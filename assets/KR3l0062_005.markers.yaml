  - {type: variant, offset: 207, length: 9, content: 十七曽布奏事上深憚, WYG: 又云嘗著海潮論海潮圖竝行于世則知為燕無疑明清乾道丙戌冬奉親㑹稽居多暇日有親朋來過相與晤言可紀者歸考其實而筆録之曰揮麈録不忍棄去遂名之曰揮麈録非所以為書也長至日明清識右揮麈録一編汝隂王仲言所作也紹興辛丑迥侍叔父尉剡叔父出仲言昆仲詩詫曰此皆小汝若干嵗雪溪先生諸子也迥􅃼然自失其後得與仲信仲言游雖}
