body:
  text: 卷之二三十七丁晉公端研三十八王荆公集句詩三十九周美成夢中得瑞鶴僊詞四十周美成風流子詞四一蔡元度燕曾文肅四二耿南仲席上不作詩四三張如塋與聶賁逺王將明同官四四徐典樂製轉調二郎神四五東坡記發冡小話四六艮嶽竒石四七朱勔葬父四八風和尚知人休咎四九蔡攸曲燕禁中五十李邈換武五一詹堅老與李端初交代五二黃謙狡獪五三王履道詠梁師成賜第五四劉跛子知人禍福五五蔡元長令費孝先􅀞卦影五六蔡元長建第錢塘五七胡宗哲陳舉氷清玉􅃳五八􅂫元老謝表五九李泰發謝表六十潭州天寧寺有平楚樓六一韋絢嘉話虚誕六二向子固維􅀭夢果應六三康倬詭易姓名六四王佾戲向宗厚六五宋毅叔醫田登母六六王子亨醫吐舌六七李氏醫腸癰六八王定􅀚服丹砂六九丁廣服丹藥七十秦㑹之還朝入相七一印行書籍自母丘儉始七二靖康議狀乃馬伸之文七三秦㑹之詆范覺民七四秦㑹之以秦熺爲乞字七五王歧公復官七六殺帥蜀之職自王暦始七七宗室入蜀自趙德夫始七八廉宣仲再居霅川七九秦㑹之擢張師言八十向伯恭奏􅀘陳序八一王俊首岳侯狀八二南都老盗自陳八三吕元直除馬子約英州八四呉幵莫儔竄逐八五國朝六曹尚書􅀉禄八六王兵部跋李伯時古器圗語八七劉士祥姦利八八張彦實居西掖八九王仲言作慈寧殿賦九十相蔡元長題超覧堂字九一林開相蔡元度子九二九江舟中盗鑄錢九三賞心亭長短句九四張韓奏凱九五秦㑹之題跋鄭德象九六甄保義賈機冝九七唐崔相國德政碑九八顔魯公墨帖九九團石䜟語一百趙知府跋揮麈録餘話緫目終
