  - {type: variant, offset: 90, length: 0, content: '', WYG: 初梁仲謨汝嘉尹臨安五鼓往待漏院從官皆在焉有據胡床而假寐者旁觀笑之又一人云近見一交椅様甚佳頗便於此仲謨請之其説云用木為荷葉且以一柄揷於靠背之後可以仰首而寢仲謨云當試為諸公製之又明日入朝則凡在坐客各一張易其舊者矣其上所合施之物悉備焉莫不歎伏而謝之今逹宦者皆用之葢始於此外祖曾空青任知信州日嘗辯宣仁聖烈誣謗以進於高宗皇帝首尾甚詳今備錄之切伏惟念宣仁聖烈皇后遭無根之謗四十餘年陛下踐祚之初首降德音昭示四方明文母保祐之功誅姦臣貪天之慝赫然威斷風動天下薄海内外鼓舞懽呼小臣么微嘗冐萬死於建炎元年八月内備錄先臣遺記扣閽以陳葢自紹聖以來大臣報復元祐私怨造為滔天之謗上及宣仁先臣某方位樞筦論議為多臣於家庭之間固已與聞其畧而先臣親書記錄尤為詳盡其後蔡渭繳文及甫等偽造之書附㑹廢立之謗當時用事之臣至以謂神考非宣仁所生以實傾揺廢立之迹欲以激怒哲宗頼哲宗皇帝天姿仁孝洞照謬妄而又先臣每事極論痛伐賊謀故於宣仁終不能遂其姦計是時蔡京撰造仁宗欲以庻人之禮改葬章獻意在施之宣仁先臣所陳乃以謂天命何可移易宣仁必無此心乞宣諭三省於詔命之}
