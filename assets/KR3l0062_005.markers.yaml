  - {type: indent, offset: 20, content: 　, id: KR3l0062_krp_005-bkkind1}
  - {type: variant, offset: 22, length: 0, content: '', WYG: 立極之初西蜀未下益州三泉縣令間道馳騎齎賀表率先至闕下上大喜平蜀後詔令三泉縣不𨽻州郡遇賀慶許發表章直逹榻前至今甲令毎於諸州軍監下注云三泉縣同是矣元符末龔言序為縣尉婦弟江端本子之薄遊至邑令簿素與龔不叶相帥遊山經宿未回龔攝縣事忽赦書至徽宗登寳位龔即宣詔稱賀偶未有子亟令子之奉表詣都令歸已無及銓曹以初品官無奏異姓無服親之文沮之子之早負俊名曾文肅當國為將上取旨特補河南府助教今之上州文學也後子之官與職俱至正郎一時以為異事紹興初四川制司建言陞縣為軍失祖宗之指矣張逸字天𨼆鄭州人登進士初嘗以樞密直學士知益州蜀人諳其民風華陽縣鄉長殺人誣道旁者縣吏受財獄具乃令殺人者守囚逸曰囚色寃守者氣不直豈守者殺人乎囚始敢言而守者果服立誅之蜀人以為神嵗飢民多殺耕牛食之犯者皆配關中逸奏民殺牛以活將廢穯事今嵗小稔請一切放還復其業報可凡四守益州逸子峋嵫亦有顯名于世嵫諸孫即端明殿學士澄也兩朝史章文憲得𧰼𫝊末云初閩人謠曰南臺沙合出宰相至得𧰼相時沙湧可涉政和六年沙復湧已而余丞相深大拜十餘年前外舅方公務德帥福唐南臺沙忽再湧已而朱漢章葉子昻相繼登庸昔人最重契義朋從年長則以兄事之齒少以弟或友呼焉父之交遊敬之為丈見之必拜執子姪之禮甚恭丈人行者命與其諸郎遊子又有孫各崇輩行略不紊亂如分守之嚴舊例書札止云啓或止稍}
