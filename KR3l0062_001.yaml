front:
  text: 揮麈前録卷之一一朝請大夫主管台州崇道觀汝隂王明清唐明皇實録云開元十七年秋八月上降誕之日大
  hash: sha256:eef540cc01375603d793c59fc9c24d1e908b91947361f2fe3b8439bd685f7b5b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_001-1a}
body:
  text: 置酒合樂燕百僚於華蕚樓下尚書左丞相源乾曜右丞相張説率百官上表願以八月五日為千秋節著之甲令布於天下咸使燕樂休假三日詔從之誕日建莭蓋肇于此天寶七載八月巳亥詔改為天長莭其後肅宗以九月三日生為地平天成莭史不書日文宗以十月十日生為慶成莭武宗六月十二生為慶陽莭僖宗八月五日生為應天莭昭宗二月二十二日生為嘉會莭哀帝十月三日生為延和節梁太祖十月二十一日生為大明節末帝九月十二日生為明聖節唐明宗九月九日生為應聖節晉髙祖二月二十八日生為天和節出帝六月二十七日生為啓聖莭後漢髙祖二月四日生為聖壽莭隱帝三月七日生為嘉慶節周太祖七月二十八日生為永壽莭丗宗九月二十四日生為天清莭恭帝八月四日生為天壽節本朝太祖二月十六日生為長春莭太宗十月七日生為乾明莭後改為壽寧節真宗十二月二日生為承天莭仁宗四月十四日生為乾元節英宗正月三日生為壽聖莭神宗四月十日生為同天節哲宗十二月七日生避僖祖忌辰以次日為興龍莭徽宗十月十日生為天寧莭欽宗四月十三日生為乾龍莭太上皇五月二十一日生為天申莭今上皇帝十月二十二日生為會慶莭而章獻明肅皇后正月八日生為長寧莭宣仁聖烈皇后七月十六日生為坤成莭以嘗臨朝故耳五代諸君莭名不見於正史以鄭向開皇記考得之唐代宗十月十三日天興莭見令狐綯文集中唐順宗聖壽莭見於齊抗會稽捨宅為寺碑後唐清泰帝正月二十三日千春莭見於五代史晉家人傳近董令升二作誕聖録惜乎未盡也祖宗神御像設在南京則鴻慶宫西京則奉先寺之興先會聖宫之降真殿揚州曰彰武滁州曰端命河東曰統平鳯翔曰上清太平宫及真宗親征北郊封泰山祀汾隂則有澶淵之信武嵩山崇福之保祥華隂雲臺之集真乾德六年即都城之南安陵之舊域建奉先資福院為慶基莭宣祖藝祖則太平興國之開先太宗則啓聖之永隆至大中祥符中建景靈宫天興殿以奉聖祖其後真宗之奉真仁宗之孝嚴英宗之英德皆在其側也又有慈孝之崇真萬壽之延聖崇先之永崇以奉真宗母后章獻明肅在崇真之旁曰章德章懿在奉先之後曰廣孝章惠在延聖之後曰廣愛在普安者二元德曰隆福明德章穆曰重徽元豐中神宗以獻饗先後失序地偏且逺有曠丗不及親祠者乃詔有司神御之在京者寓於佛祠皆廢徹而遷之禁中繇英德而上五丗合為一宫凡十一殿以丗次別東西序帝殿一門列戟七十二殿之西廡繪畫容衛公王名將羅立左右內有燕寢溫凊之實玩好畢陳而母后居其北改慶基曰天元后曰太始開先曰皇武后曰儷極永極曰定大后曰輝德奉真曰熙文后曰衍慶孝嚴曰美成后曰繼仁英德曰治隆其便殿十一曰來寧曰燕娭曰靈遊曰凝神曰天逰曰泠風曰太靈曰丹臺曰靈崑曰昭清以五年十一月奉安帝后塑像於新宫大赦天下繪像侍臣于後元祐初即治隆之後宣光殿以奉神宗紹聖初闢宫之東隅為顯承殿以宣光殿故址為徽音殿以奉宣仁聖烈建中靖國元年詔以顯承介於一偏廟號未稱於是度馳道之西東直大定南北廣袤地勢併撤省寺創為西宫建大明宫以奉神宗為館御之首涓日遷奉親祠永為不祧之廟以示推崇之意曲赦四畿録功臣後三如元豐故事云西京應天寺本後唐夾馬營大中祥符二年以太祖誕聖之地建寺錫名東京啓聖院本晉護聖營以太宗誕聖之地太平興國六年建寺雍熙二年寺成賜名二寺皆奉祖宗神御英宗以齊州防禦使入繼大統治平二年建齊州為興德軍熙寧八年八月詔潛邸為佛寺以本鎮封賜名四興德禪院仍給淤田三十頃開基節建名丗多無知者建炎初嘗詔如後來所立元聖真元節名之類除開基節外悉皆罷去始知為未久因考建中以後詔旨政和二年南京鴻慶宫道士孟若蒙進狀言本宫每遇正月初四日為創業之日修設齋醮乞置節名以永崇奉詔從其請近見曽仲躬云若蒙亦能詩文清作南京少尹日嘗與之逰亂後復會于三衢紹興間若蒙又以前績自陳時秦會之當軸令勑住臨安府天慶觀非其所欲拂衣而歸老於衢云仰惟五太上皇帝中興再造復在南都符命豈偶然哉太祖皇帝朝嘗詔修先代帝王祠廟每廟須及一百五十間以上委逐州長吏躬親點檢索圗赴闕遣使覆檢令太常禮院重定配享功臣檢討儀相畫樣給付女媧祠在晉州書傳無功臣可配太昊以金提勾芒配祠在陳州炎帝以祝融配祠在衡州黃帝以后土風后力牧配祠在坊州髙陽以玄冥配祠在澶州髙辛以稷配在宋州唐堯以司徒卨配祠在鄆州虞舜以咎繇配祠在道州夏禹以伯益配祠在越州啇帝成湯以伊尹配祠在河中府中宗太戍以伊陟臣扈配祠在大名府髙宗帝武丁以甘盤傅説配祠在陳州周文王以師鬻熊配武王以召公配成王以周公旦唐叔虞叔配康王以太公畢公配秦始皇帝以李斯蒙恬王翦配漢髙帝以蕭何配文帝以周勃陳平劉章宋昌配景帝以周亞夫竇嬰申屠嘉朝錯配武帝以公孫弘衛青霍去病金日磾霍光配宣帝以丙吉魏相霍光張安丗配以上十帝並祠在長安後漢丗祖以鄧禹吳漢耿弇賈復配明帝以東平王蒼桓榮配章帝以牟融趙意宋安配以上三廟並在河南府魏武帝以鍾繇荀攸程昱配廟在相州文帝以賈詡王朗曹真辛毗配晉武帝以羊祜張華王濬杜預配二廟在河南府後魏孝文帝以王祥王肅長孫晟配後周文帝以宇文憲蘇綽燕公于謹盧辨配二廟在耀州隋髙祖以牛弘髙預賀若弼配廟在鳯翔府唐髙祖以河間王孝恭殷開山劉政會淮南王神通配廟在耀州太宗以長孫無忌房玄齡杜如晦魏徴李靖配廟在京兆府明皇以張説郭元振王琚配廟在河中府肅宗以苗晉卿裴冕配廟在京兆府憲宗以裴度杜佑李訴配廟在同州宣宗以夏侯孜白敏中馬植配廟在耀州朱梁太祖以劉鄩敬翔葛從周袁象先配後唐莊宗以郭崇韜李嗣昭符存審配明宗以霍彥威安重進任圜配石晉髙祖以桑維翰趙瑩配以上並在河南府皆著之儀制是時吳蜀未平六朝帝廟闕而六不載本朝曹武惠配享太祖武穆配享仁宗韓忠獻配享英宗文定配享徽宗父子配享自昔所七無也明清側聞紹興初劉太中以監察御史宣諭諸路回宰臣以其稱職擬除殿中侍御史太上皇帝云且令除袐書少監宰臣啓其所以太上曰大中所至多興獄尚有未決者一除言路外方觀望恐纍及無辜德壽之號稱哉後因閲會要恭覩宏休恐中袐之書臣下莫得而悉窺今載其略紹興三年四月十六日知藤州侯彭老言本州賣鹽寬剩錢一萬貫文省買到金一百六十餘兩銀一千八百兩投進詔縱有寬剩自合歸之有司非守臣所當進納或恐亂有刻剝取媚朝廷侯彭老可特降一官放罷以懲妄作所進物退還紹興十三年四月一日宰執進呈前廣南東路轉運判官范正國言本路上供及州郡經費全仰鹽息應辦比因全行客鈔遂或闕乏欲自今本路州郡凡屬屯駐兵馬去處許依客人買鈔請鹽各就本州出賣所得息錢專充軍費上曰法必有弊然後改未見其弊遽先改非徒無益必致為害凡法皆然不獨鹽也又建炎元年十月十二日宰執詣御舟御榻前奏事訖上曰昨日有內侍自京師齎到內府真珠等物一二囊朕投之汴水矣黃潛善曰可惜有之不必棄無之不必求上曰太古之丗樀玉毁珠小盜不起朕甚慕之庶幾求所以息盜爾四年三月七日宰執進呈宣撫處置使奏大食國進奉珠玉寶貝等物已至熙州上曰大觀宣和間茶馬司川茶不以博馬唯市珠玉故馬政廢闕武備不修遂致胡虜亂華危弱之甚今若復捐數十萬緡貿易無用珠玉曷若愛惜其財以養戰士不若以禮贈而謝遣之乃降旨宣司並不得受令量度支賜以答逺人之意紹興元年三月二十二日荆湖南路馬步軍副總管孔彥舟言於潭州州城蓮池內收得玉一片堪篆刻御寶乞差人宣取詔御寶巳足備兼自艱難以來華靡之物一無所用令彥舟不須投進此與夫却千里馬還于闐八玉適相符合誠帝王之盛德也李和文遺事云仁宗嘗服美玉帶侍臣皆注目上還宫內侍曰侍臣目帶不巳何耶對曰未嘗見此竒異者上曰當以遺虜主左右皆曰此天下至寶賜外夷可惜上曰中國以人安為寶此何足九惜臣下皆呼萬歲和文遺事又云其家書畫最冨有吳道子天王胡瓌下程圗唐淨心須菩提黃居寀竹鶴孫知微虎韓幹早行圗梅雞傳古龍江南畫佛唐希雅竹李成山水唐畫公子出獵圗黃居寀雕狐圗黃筌雨中牡丹李思訓設色山水周昉按舞折支杏花徐崇嗣沒骨芍藥江南草蟲獨幅山水黃荃金盆鵓鴿大窠山茶書有懷仁真迹集右軍聖教序貞觀蘭亭詩敘右軍山隂帖樂毅論顔魯公書劉太沖序十皆冠丗之寶熙寧八年四月岐王皓嘉王頵言蒙遣中使賜臣方團玉帶各一條準閣門告報著為朝儀臣等乞寶藏于家不敢服用上命工琢玉帶以賜二王二王固辝不聽請加佩金魚以别嫌詔并以玉魚賜十一之玉帶為朝儀始于此北齊顯祖髙祥晉陽公李元忠南齊竟陵王蕭子良隋長孫覽俱諡文宣孔子蓋出四諡之後大中祥符元年始加玄聖二字後避聖祖諱易為至聖熙寧中欲加諡至神元聖帝禮官李邦直以謂夫十二子周臣也周室諸君止稱王執以為不可卒從其議元魏獻文欲置學官于郡國髙允表請制大郡立博士二人助教四人學生一百人次郡立博士二人助教二人學生八十人中郡立博士一人助教二人學生六十人下郡立博士一人助教一人學生四十人其博士取博關經典履行忠清堪為人師者年限四十以上助教亦與博士同年限四十以上若道業夙成才任教授不拘年齒學生取郡中清望人行修謹堪束循名教者先盡次及中等帝從之郡國立學自此始事載允傳本朝髙承纂十二事物紀原自謂博極而不取此何耶唐髙宗改門下省為東臺中書省為西臺尚書省為文昌臺故御史臺呼為南臺趙璘因話録云璘又云武后朝御史有左右肅政之號當時亦謂之左臺右臺則憲臺未曽有東臺西臺之稱明清嘗記張鷟朝野僉載對天后為戲語云左臺胡御史右臺御史胡是也本朝李建中為分司西京留司御史丗以西臺目之李栖筠為御史大夫不樂者呼為栖臺蓋斥其名也明清五丗祖拾遺開寶八年以近臣薦自布衣召對講易于崇政殿然後命官崇政殿説書之名肇建十五于此行事具載三朝國史太祖皇帝以歸德軍節度使創業升宋州為歸德府後為應天府太宗以晉王即位升并州為太原府真宗以壽王建儲升壽州為夀春府仁宗以升王建儲升建業為江寧府英宗以齊州防禦史入繼以齊州為興德軍神宗自頴王升儲以汝隂為順昌府哲宗自延安郡王升儲升延州為延安府徽宗以端王即位升端州為肇慶府欽宗自定王建儲前已升中山府太上以康王中興升康州為德慶府今上以建王建儲升建安為建寧府宣和元年六月邢州民董丗多進狀以英宗嘗為巨鹿郡公又知嶽州孫協進言英宗嘗為嶽州防禦使詔加討論時邢州巳升安國軍遂以邢州為信德府嶽州為嶽陽軍是歲十月又詔以列聖潛邸所領地再加討論以真宗嘗為襄王升襄州為襄陽府仁宗嘗為慶國公以慶州為慶陽府英宗嘗為冝州刺史以冝州為慶逺軍神宗嘗為安州觀察使以安州為德安府又嘗為光國公以光州為光山軍哲宗嘗為東平軍節度使以鄆州為東平府嘗為均國公以均州為武當軍徽宗嘗為寧國公以寧州為興寧軍其後又以徽宗嘗為平江鎮江軍節度使並升為府又以太宗昔嘗為睦州防禦使升睦州為遂昌軍今上皇帝即位之初升隆十六興寧國常德崇慶諸府皆以潛藩擁戲之地也英宗在濮邸與燕王宫族人丗雄厚善兩家各生子同年月日時是生神宗而丗雄之子令鑠也神宗後即帝位令鑠進士及第為本朝宗室登十七科第一國朝承五代搶攘之後三館有書僅萬二千卷乾德以後平諸國所得浸廣太宗鄉儒學下詔搜訪民間以開元四部為目館中所闕及三百已上卷者與一子出身端拱元年分三館之書别為書庫目曰祕閣真宗咸平三年詔中外臣庶家有收得三館所少書籍每納一卷給千錢卷判館看詳委是所少書數及卷秩别無差誤方許收納其所進書及三百卷以上量才試問與出身又令三館寫四部書二本一置禁中龍圗閣一置後苑之太清樓以便觀覽八年榮王宫火延燔三館焚爇殆遍於是出禁中本就館閣傳寫且命儒臣編類讎校校勘校理之官始於此也嘉祐五年又詔中外士庶許上所闕書每卷支絹一匹及五百卷特與文資元豐中祕書省三館併歸省中書亦隨徙元祐中重寫御前書籍又置校對黃本以館職資淺者為之又置重修晉書局不久皆罷去宣和初蔡攸提舉祕書省建言置輔御前書籍所再訪天下異書以資校對以侍臣拾人為參詳官餘為校勘又以進士白衣充檢閲者數人及年皆命以官未畢而國家多故靖康之變諸書悉不存太上警蹕南渡婁下搜訪之詔獻書輔官者凡數人秦熺提舉袐書省奏請命天下專委守臣又有旨録會十八稽陸氏所藏書上之今中袐所藏之書亦良備矣承平時士大夫家如南都戚氏歷陽沈氏廬山李氏九江陳氏番易吳氏俱有藏書之名今皆散逸近年所至郡府多刋文籍且易得本傳録仕宦稍顯者家必有書數千卷然多失於讎校也吳明可帥會稽百廢具舉獨不傳書明清嘗啓其故云此事當官極易辦但僕既簿書期會賔客應接無暇自校子弟又方令為程文不欲以此散其功委之它十九人孰肯盡心漫盈箱篋以誤後人不若己也紹興初昭慈聖獻皇后升遐外祖曾公公卷以江東漕兼攝二浙應辦用元符末京西漕陳向故事也朝論欲建山陵外祖議以謂帝后陵寢今存伊洛不日復中原即歸祔矣冝以􅑼宫為名僉以為當遂用之陳向權漕事見汪彥章所撰徐丞相夫二十人陳氏墓志夫人向之女也紹興戊午徽宗梓宫南歸有日秦丞相當國請以永固為陵名先人建言北齊叱奴皇后實名矣不可犯且叱奴夷狄也尤當避秦大怒幾蹈不測後數年卒易曰永祐揮麈前録卷之一
