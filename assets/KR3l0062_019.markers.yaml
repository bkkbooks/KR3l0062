  - {type: variant, offset: 3033, length: 854, content: 靖康末虜騎渡河直抵京城危蹙之甚欽宗命王㓜安㐮爲西道揔管招集勤王之師以爲捄援㓜安辟先人爲幹當公事先人爲草檄文晁四丈以以道讀之激賞不已云此出師表也今録于後叛服者夷狄之常性勢有汙隆忠義者臣子之大方道無今古矧黃屋有阽危之慮而赤縣無援助之師念聖神施德於九朝方黎庻痛心於四海敢縁尺牘盡露肺肝在昔髙帝被圍於平城文皇求盟於渭水将相失色智勇吞聲盖自竹帛已來有斯妖孽之類致鬼區獸夷之肆暴豈人謀神理之能容蠢彼小羗尤爲遺燼聲教僅通於上國名號不齒於四夷縁威懷之並施乃信義之俱棄聖上天臨万宇子育群生霄憂兼夷夏之心夕惕紹祖宗之業宣恩屈己猶負固以跳梁繼好息民更執迷而猖蹶始鴟張於沙漠再豕突於帝畿旣邊圍之弛防又廟堂之失䇿窫窳旁吞於黒水攙搶直拂於紫躔睥睨望萬雉之墉蹂踐連千里之境鯨鯢我郡邑魚鼈我人民氛祲煙塵共起熖天之勢衣冦士庻咸罹塗地之冤赤子何辜蒼天不弔冦攘驅掠不可數知焚蕩傷夷動以万計然而天惟助順神必害盈終無摩壘之兵僅保傅城之衆能接歲而再至旣經時而何施今則脊尾俱摇腹背受敵舊地皆失内潰有強隣之侵衆心自離外隳無諸國之助咸聞氣奪尚敢尸居匪惟難犯於金湯固已自迷於巢穴䑕無牙而穿屋情狀可知羊羸角以觸藩進退不果尚假息游魂於城下巳叩閽請命於軍中而况六師用壯以方張諸将不謀而問㑹熋羆之旅則帶甲百萬騄驥之足則有騋三千人知逆順而四靣聲馳士識恩讎而方萬響動務施逺略必解長圍速勞貔虎之師盡掃犬羊之衆嘯聚之黨將就戮除噍類之徒㝷當殄㓕㳙時並進旨日克平義動顯幽包胥泣秦庭之血誠開金石霽雲射浮圖之甎盍思古人謂誓死起救於將㒹勿令後日譏擁兵坐觀而不赴某恭被睿筭外緫戎昭籌筆非良敢效流馬之運輪蹄並進盡提水犀之軍戈矛相望於道塗舳艫衘尾於淮海巳浮楚澤前壓師濵誓資衛社之何盟共濟勤王之盛舉望龍虎之氣行瞻咫尺之天聽鳥烏之聲益勞方寸之地同扶王室各奉天威誓爲唇齒之依期壯輔車之勢共惟某官誠深體國義切愛君忠孝貫於神明威名慴於夷虜决䇿定難素髙平日之謀拯溺救焚豈有淹時之乆雪宗祧之大憤拯黎庻之横流勢方万全士在一舉九金鼎就難逃魑魎之形萬里塵清永肅乾坤之照乗彼瓜分之後在我皷行而清霣涕而十七言至誠斯盡, WYG: ''}
