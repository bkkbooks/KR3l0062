front:
  text: 揮麈前録卷之三
  hash: sha256:5481b51594c9dfaf2a9778606635209c62ba0b7dbb48ae0f201b814d8fda9b9a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_003-1a}
body:
  text: 汝隂王明清太上皇帝中興之初蜀中有大族犯御名之嫌者而遊䆠參差不齊倉卒之間各易其姓仍其字而更其音者勾濤是也加金字者鈎光祖是也加絲字者紡是也加草頭者茍諶是也改爲句者句思是也増而爲句龍者如淵是也繇是析爲數家累丗之後昬婣將不復别文潞公自云敬暉之後以國􅀄翼祖諱而改今有茍氏子孫與文氏所云相同蓋本一族亦是杜于南北失於相照與此相􅀋李昌武宗諤之子昭遘十八歳鎻廳及第昭遘子杲卿杲卿子士廉皆不逾是歳登甲科凡三丗俱曽爲探花郎亦衣冠之盛事也呉越國忠獻王錢佐薨其弟倧襲位未幾爲其大將胡進思所廢時忠懿王俶爲台州刺史進思迎立之元豐中王之孫暄知台州其子景臻自郡入都選尚仁宗女是爲秦魯長主靖康末胡􅀐犯闕主避狄南來因遂􅁲居後數年詔即州賜第主享之二十年壽八十六薨于天台其子伯誠居之又二十年官至少師年亦八十餘少師子即處和也處和之女又自台州􅀍選爲王妃去􅀊處和旣爲執政别營甲第南北相望甚夥一家盛事常占此境官制行置左右丞二府中班最下無有爰立者元祐中蘇子容丞相自左轄登庸時以爲異恩崇寕初徽宗亟欲相蔡元長遂用此故事時有獻詩者曰磊落儀形真漢相闊踈恩禮舊􅂫公紹興初吕元直自簽書摳宻院入相前此所無也張垍乃張說之子敬翔爲敬暉之孫本朝劉温叟以父名岳終身不聽樂至其孫几乃自度曲預修樂書可􅀏近有呉鑄者乃國􅀄功臣呉廷祚之後祖元扆復尚主而失節於劉豫仕僞庭至樞宻使爲其用事此一律吁可歎哉李叔佐云本朝以來以遺逸起逹者惟种明逸常夷甫二人而巳徽宗朝王易簡蔡崈吕注自布衣拜崇政殿說書然薦紳間多不與之也王君儀尹彦明後亦登禁從距今亦三十年矣雖婁下求賢之詔州郡間有不應聘者而羔鴈不至於巖穴也易簡即寓之父九江人大觀中家祖守郡首薦之其後改節以媚權臣官至資政殿太學士寓仕靖康驟拜二府􅀍命使虜託夢寐以辭行欽宗震怒竄嶺外父子南下中途爲盗所害寓字元忠國􅀄每􅀊放牓取士極少如安德􅁉作魁日九人而巳蓋天下未混一也至太宗朝浸多所得率江南之秀其後又别立分數考校五路舉子以北人拙於詞令故優取熈寕三年廷試罷三題專以䇿取士非雜犯不復黜然五路舉人尤爲踈略黃道夫牓傳臚至第四甲党鏄卷子神宗大􅀏曰此人何由過省知舉舒信道對以五路人用分數取末名過省上命降作第五甲末自後人益以廣宣和七年沈元用牓正奏名殿試至八百五人盖燕雲免省者旣衆天下赴南宫試者萬人前後無踰此歳之盛崇寧中以王荆公配宣聖亞兖公而居鄒公之上故遷鄒于兖之次靖康􅀄詔黜荆公但舁塑像不復移鄒公于舊位至今天下庠序悉兖鄒並列而虚右雖後來重建者舉皆㳂襲而竟不能革也沈文伯云劉器之晚居南京馬巨濟㳙作少尹巨濟廷試日器之作詳定官所取也而巨濟毎見器之未甞修門生之敬器之不平因以語客客以諷巨濟巨濟曰不然凡省闈解送則有主文故所取士得以稱門生殿試蓋天子自爲座主豈可復稱門生於他人幸此以謝劉公也客以告器之器之歎服其說自是甚懽陸務觀云亡友薛叔器家有関外侯印甚竒古後考之魏建安二十三年甞置此名也又友人家有盪虜將軍章及明清有横武將軍印皆不可考伯氏有新遷長印後考前漢書乃新室甞以上蔡爲新遷也又友人家多睦子家丞印多睦郡名旣亡子之家丞秩甚卑然􅂐文印様皆岀諸印右甞撫得之或云亦王莾時印畢少董家有雍未央姓名見於急就章明清少游外家年十八九時從舅氏曽宏父守台州有筆吏楊滌者能詩亦可觀言其外氏唐元相國之裔一日持告身來乃微之拜相綸軸也銷金雲鳯綾新􅀂手未觸白樂天行并書後有畢文簡夏文莊元章簡諸公䟦識甚多㝷聞爲秦熺所取恨當時不能入石至今往來于中也又丹陽吕城閘北委巷竹林中有李格秀才者自云唐宗室系本大鄭王房出其逺祖武德正觀以來告命勑書凡百餘亦有薛少保顔魯公書者竒甚明清每語親舊經繇不惜一訪而閱之李生亦不靳人之觀也文中子王通隋末大儒歐陽文忠公宋景文修唐書房杜傳中略不及其姓名或云其書阮逸所撰未必有其人然唐李習之甞有讀文中子而劉禹錫作王華卿墓銘序載其家丗行事甚詳云門多偉人則與書所言合矣何疑之有又皮日休有文中子碑見于文粹歐陽文忠公父名觀文多避之如碧落碑在絳州龍興宫之類蘇東坡祖名序文多云引或作叙近爲文者或倣此不知兩先生之意也賜生辰器幣起于唐以寵藩鎮五代至遣使命周丗宗眷遇魏宣懿始以賜之自是執政爲例至和三年宋元憲建言慶暦郊祀赦書許文武官立家廟而有司終不能推述先典明喻上指因循頋望遂隃十載使王公薦紳下同閭巷昭穆雜用家人縁媮習弊甚可嗟也臣近因進對婁聞聖言謂諸臣專殖第産不立私廟豈朝廷勸戒有所未孚將風教頽齡終不可復反復至意形于嘆息臣每求諸臣所以未即建立者誠亦有由蓋古今異儀封爵殊制自疑成殫遂格詔書禮官旣不講求私家何由擅立且未信而望誠者上難必責從善而設教者下或有違若欲必如三代有家嫡丗封之重山川國邑之常然後議之則墜典無可復之期矣夫建宗祏序昭穆别貴賤之等所以爲孝雖有過差是過爲孝殖産利營居室遺子孫之業或與民爭利頋不以爲恥逮夫立廟則曰不敢寕所謂去小違古而就大違古者今諸儒之惑不亦甚乎於是下兩制與禮官詳定制度而王文安以下定官一品平章事以上立四廟知樞參政同知樞簽樞以上前任見任宣徽尚書節度使東宫三少以上皆立三廟餘官􅀕於寢凡得立廟者許嫡子襲爵以主􅀕其襲爵丗降一丗死則不得别立祔廟别􅀕於寢自當立廟者即祔其主其子孫承代不許廟􅀕寢􅀕並以丗數親踈遷祧始得立廟者不祧以始封有不祧者通􅀕四廟五廟廟因衆子立而長子在則􅀕以嫡長子主之嫡子死則不傳其子而傳立廟之長凡立廟聽於京師或所居州縣其在京師者不得於裏城及南郊御路之側旣如奏仍令别議襲爵之制其後終以有廟之子孫或官微不可以承􅀕又朝廷難盡推襲恩之典遂不果行其略巳見宋次道退朝録至嘉祐中文潞公爲相乃上章引禮官詳定制度平章事以上許立四廟欲乞於河南府營創廟詔從之政和中蔡元長賜宅京師援潞公之請旣允所奏且命禮制􅈰鑄造家廟􅀕器并余丞相深以下二府皆賜之紹興中秦㑹之表勲錫第又舉二例詔令討論悉如政和之制云錢宣靖吕文靖知制誥衣緑張益之友直鄧公子也爲天章閣待制勾當三班院侍宴集英殿猶衣緋仁宗頋見即賜金紫吕文穆李仲詢及許冲元爲兩制衣緋蔡元長王子發官制行後爲中書舎人皆衣緋賈季華琰爲樞宻直學士正諫大夫衣緑本朝父子狀元及第張去華子師德梁顥子固兄弟孫何孫僅陳堯佐堯咨四家而巳後來沈文通孫晦以祖孫相繼近年許克昌寔許安丗之親姪孫而王資深子洋俱爲榜眼舊制監司雖官甚卑遇前執政宰藩亦肩輿升􅆹事宣和􅀄薛肇明自兩地出守淮南有轉運判官年少新進輕脫之甚肇明每不堪之到官朱幾肇明還舊廳因與首台蔡元長語及之且云乗轎直抵脚踏子始下呵輿之聲驚耳至今爲之重聽其他可知也元長大不平翊日降旨諸路監司遇前宰執帥守處即入客位通謁自是爲例王孟玉云熈寕中神宗命館職張載往兩浙劾知明州苗振吕正獻與御史程伯淳俱言載賢者不當使鞫獄上曰鞫獄豈賢者不可爲之事邪弗許明清家有徐東湖所記太上皇帝聖語其略曰大宗正行司將至行在南班宗子所居當作屋百間上曰修營舎宇固非今所急然事有不得巳者故春秋於此事得其時制則不書不書者聖人之所許也近時營造之制一下百姓輒受􅁦蓋縁州縣便行科配矣又甞語宰臣等曰爲法不可過有輕重惟是可以必行則人不敢犯太重則決不能行太輕則不足禁姦朕甞語徐俯異時宫中有所禁􅀄令之曰必行軍法而犯者不止朕深推其理但以常法處之後更無犯者乃知立法貴在中制所以決可行也淳化三年西夏李繼捧遣使獻鶻號海東青上賜詔曰朕乆罷畋遊盡放鷹犬卿地控邊塞時出捕獵今還以賜卿可領之也宣和末耶律禧繇此失國烏乎太宗聖矣哉元祐名卿朱紱者君子人也甞登禁從紹聖􅀄不幸坐黨錮崇寕間亦有朱紱者蘇州人初登第欲希晉用上䟽自陳與姦人同姓名恐天下後丗以爲疑遂易名諤字曰聖予蔡元長果大喜不次峻擢位至右丞未及正謝而卒年方四十薛叔器云熈寧中御史言徐德占奉祠太廟甞廣坐云仁宗有遺行詔問狀坐客客不敢對以爲無德占云臣比行事至章懿太后室因爲客言章懿實生仁宗而不及養後以帝女降后之姪瑋主乃與瑋不協使仁宗有遺恨臣實洪州人聲音之訛遂至風聞上以其言有理􅀏而薄罰之宣和中蔡居安提舉秘書省夏日㑹館職于道山食􅀲居安令坐上徵􅀲事各䟽所憶毎一條食一片坐客不敢盡言居安所徵爲優欲畢校書郎董彦逺連徵數事皆所未聞悉有據依咸嘆服之識者謂彦逺必不能安後數日果􅀘外蘇訓直云曾文肅帥定一日晨起忽語諸子曰吾必爲宰相然須南遷啓其所以公曰吾昨夕夢衣十郎緑􅂁北向謝恩豈非它日貶司户之徵乎後十年果登庸旣爲蔡元長所擠徙居衡陽巳而就降廉州司戸參軍勑到取幼子􅩕朝服以拜命果符前夢十郎即􅩕排行也韓似夫與先子言頃使金國見虜主所繫犀帶倒透中正透如圎鏡狀光彩絢目似夫注視乆之虜主云此石晉少主歸獻耶律氐者唐丗所寳日月帶也又命取磁盆一枚示似夫云此亦石主所獻中有􅀞􅀟鯉存焉水满則跳躍如生覆之無它矣二物誠絶代之珍也盆蓋見之范蜀公記事矣建隆遺事丗稱王元之所述其間帥多誣謗之詞至於稱趙普盧多遜受遺昌陵尤爲舛繆案國史韓王以開寳六年八月免相至太平興國六年九月始再秉衡鈞當太祖升遐時政在外何縁前一日與盧丞相同見于寢邪稱太祖長子德昭爲南陽王又誤矣􅀄未甞有此封元之當時近臣又秉史筆豈不詳知且載秦王傳中云云安有淳化三年而見三朝國史秦王傳邪可謂亂道此特人託名爲之又案元之自有小畜集序及三黜賦與國史本傳俱云淳化二年自知制誥舎人貶商州至道二年自翰林學士黜守滁上咸平二年守本官知齊安郡而此序年月次序悉皆顛錯其僞也明矣張賢良咸漢陽人應制舉􅀄出蜀過䕫州郡將知名士也一見遇之甚厚因問曰四科優劣之差見於何書張無以對守曰載孟子注中因檢示之且曰不可不牢攏之也張道中漫思索著論成篇至都閣試六論以此爲首題張更不注思而就主文錢穆父覽之大喜過閣第一黃六丈叔愚能記守之姓名甞以見告今巳忘之張即魏公迺翁也唐文皇聚一時名流于􅁽府始有十八學士之號後來凡居館殿者皆稱之國朝以來仕于外非兩制則雖帥守監司止呼􅀉禄官惟通判多從館中帶職出􅀘如蔡君謩湖州歐陽文忠公滑州王荆公舒州東坡先生杭州如此之􅀋甚多劉贛父赴泰倅詩云壁門金闕􅀝天開五見宫花落早梅明日扁舟滄海去却㝷雲氣望蓬萊蓋在道山五載然後得之學士之稱施于外者繇通判而然今外廷過呼大可􅀏矣建炎己酉歳二月金人舉國南冦時太上駐蹕維楊虜旣次臨淮郡相距甚邇有招信尉以所部弓手百餘人拒敵是日也塵氛蔽日虜􅀄不測其多寡遂相拒踰半日尉與衆竟死不退於是探􅀐得疾走上聞乗輿百寮僅得南度儻非尉悉力以扼其鋒俾探􅀐得上聞則殆矣尉之姓名不傳於丗可恨友人王彦國獻臣能道其詳他日當問之爲求大手筆作傳近見程可乆云尉姓孫亦甞以白國史汪聖錫矣後聞孫名榮三朝史錢儼傳云儼能飲酒百巵不醉甞患無敵或言一軍校差可倫擬問其狀曰飲酒多手益恭儼曰此亦變常非善飲也東軒筆録云馮文簡在太原以書姹王靈芝曰井門歌舞妙麗吾閉目不窺但日與和甫談禪耳平父答曰所謂禪者只恐明公未逹耳蓋閉目不窺巳是一重公案馮深伏其言以二條觀之萬事莫不安於自然也本朝及五代以來吏部給􅀄出身官付身不惟著歳數兼說形貌如云長身品紫棠色有髭髯大眼面有􅀂干痕記或云短小無髭眼小面瘢痕之􅀋以防僞冐至元豐改官制始除之靖康之亂衣冠南渡承襲僞冐盗名字者多矣不可稽考乃知舊制不爲無意也靖康間欲追褒司馬温公輿論以謂惟范忠宣在元祐間尤爲厚德可儷而有司一時鹵莾乃誤書文正之名批旨行下遂俱贈太師蓋不知文正以忠宣德孺爲宰執巳追贈至太師中書令兼尚書令魏國公乆矣適何文縝在中書以郷曲之故乃以張天覺厠名其間亦贈太保而天覺熈寕中自選人受章子厚知引爲察官事見邵氏辯誣爲舒信道發其私書貶斥流落于外紹聖􅀄子厚秉鈞再薦登言路攻擊元祐諸賢不遺餘力至欲發温公吕正獻公之墓頼曾文肅公力啓于泰陵始免其爲慘酷甚矣晚旣免相末年以校讎道藏復職又有二蘇狂率三孔闊踈之表詩有毎聞同列進不覺寸心忙之句常希古亦力言其姦後來閩中書坊間骨鯁集􅂺刋靖康詔書于首繇此天下翕然推尊之事有僥幸乃如此者可發一歎張文老云建炎末贈黃魯直秦少遊及晁无咎張文潜俱爲直龍圗閣文潜生前紹聖􅀄自起居舎人出帶此職蓋甚乆亦有司一時稽考之失也李成字咸熈系出長安唐之後裔五代避地徙家營丘弱而聦敏長而髙邁性嗜盃酒善琴奕妙􅀞山水好爲歌詩􅃈屑細務未甞經意周丗宗時樞宻使王朴與之友善特器重之甞召赴輦下㑹朴之亡因放誕酣飲慷􅁣悲􅁔遨遊搢紳間大府卿衞融守淮陽遣幣延請客家于陳日肆觴詠病酒而卒壽四十九子覺仕太宗兩歷國子􅀶士其後以覺贈至光禄寺丞云此宋白撰誌文大略如此王著書徐鉉􅂐覺字仲明列三朝國史儒學傳叙其丗家又同覺子宥仕至諫議大夫知制誥有傳載兩朝史傳云祖成五代末以詩酒遊公卿間善謩冩山水至得意處殆非筆墨所成人欲求者先爲置酒酒酣落筆煙雲萬狀丗傳以爲寳歐陽文忠公歸田録乃云李成仕本朝尚書郎固巳誤矣而米元章􅀞史復云贈銀青光禄大夫又甚誤也揮麈前録卷之三
