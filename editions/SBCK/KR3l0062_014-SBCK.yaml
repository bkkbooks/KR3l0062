front:
  text: 揮麈後録卷之九百六八汝隂王明清王廷秀字頴彦四明人靖康􅀄以李泰薦爲臺属
  hash: sha256:a727644f5ef8c7cbd02cd5d5514940f0962cb65775cf26450f408e3edf1ebe40
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_014-1a}
body:
  text: 髙宗即位擢登言路著書號閱丗録其中一條載明受之變甚備蓋其所目擊是時宰輔如朱吕二張俱有記録矜夸復辟之功悉皆不同有如聚訟不􅀂頴彦之明白無偏今録于左建炎巳酉三月一日宣麻以朱勝非爲相罷葉夢得左丞王淵自平江來上殿對畢除簽書樞宻院旣受命之次日有旨只依兩府恩例不預省事四日廷秀入對以初除察官未經上殿故也五日入起居畢復宣麻殿門即聞外變宫門巳閉廷秀與察官林之平同􅀫留於翰林院前翰林院以臨安府使院爲之乆之入學士直舎李邴爲内翰從官王綯孫覿都司葉份亦在少次聞宣宰執云苗劉兵殺内侍且欲必得康履曽擇藍珪有一閹走入學士院自剄不死卧前厠聞駕御樓軍士山呼康履走入内中歩軍太尉呉湛㝷捕得於小亭仰塵上擒以付苗劉即時斬首摽之宣諭以内侍有過當爲治之二將與轉官其下對我等􅀂欲轉官祇用牽兩疋馬與内官何必來此巳而復召侍從百官廷秀從諸公上樓見上座金􅃮椅子宰執從官并三衙衛士百官皆侍立左右樓下兵幾千數苗劉與數人甲胄居前出不遜語謂上不當即大位將來淵聖皇帝歸來不知何以處此語乃陳東應天上書中有之故二􅇯挾以脅制欲上爲内禪之事宰相從百官出門下委曲喻之使退不從左右請言太后出處分於是上遣人請太后乆之太后乗黒竹輿從四老宫監至樓上命儀鸞司設帷幄垂簾置坐不能具止坐輿中傳㫖下諭亦不肯從又肩輿至門下太后在輿中親宣諭且以上仁孝曉夕思念二聖勵兵選將欲復讎雪耻太尉等皆名家不須如此二凶抗言必欲太后輔太子聽政太后曰以太平時此事猶不易况今強敵在外太子㓜小决不可行不得巳當與皇帝同聽政委喻乆之堅不從太后復上樓上白事於竹輿前言事無可柰何須禪位太后未允又令與百官同議自朱勝非以下皆不敢出言獨有一着緋官貟進前曰陛下當從三軍之言衆甚駭之時有杭州通判章􅁩靣折之曰如何從三軍之言其人逡廵無語上亦恠而問其姓名自陳云朝散郎主管浙西安撫司機冝文字時希孟上顧翰林學士李邴令草詔邴乞上御扎取􅁓筆就椅子上冩詔以金人強横當退避云云冩畢令持詔下宣示二􅇯兵退上亦徒歩歸内中時巳未刻百官方岀見道傍卧尸枕籍皆内侍也是日凡宦者非入直在内皆爲其所殺而財物盡刼取明日太后垂簾朱勝非辤疾不岀太后使人宣召又命執政親往府中召致之太后復遣老宫監宣喻乃出自是二凶更至朝堂道間傳呼都統太尉從以強虜􅇯熖可畏行者開道避之迫脅要索惟意所欲初一劄子凡十事如改元請上徙外宫之􅀋宰執委曲調護其中有甚不可行者八日遂改元明受張浚自平江遣士人馮􅙲來議欲以上爲元帥領兵移書痛責二􅇯二凶諷朝廷以尚書召張浚不從又拜韓丗忠節度使除張俊秦鳯路緫管使領兵歸不從復降麻建節度使知秦州遣人賫麻制授二人二人械其使送平江獄又欲起兩浙新舊􅃓手之半赴行在廷秀入䟽止之時吕頥浩張浚韓丗忠劉光丗張俊同議引兵問罪復辟又加康允之待制劉蒙直閣呉􅀃金部郎中兼提舉市舶小人鼔動乗時求差遣而得之者甚多有范仲熊者轉運判官沖之子祖禹之孫也甞䧟虜迯歸日與二􅇯交遊其賔客王丗修張逵王鈞甫馬柔吉皆締暱五日之事仲熊實與聞至是二􅇯諷顔􅄮薦上殿除省郎言凡臺諌章䟽乞露姓名行下其意盖欲言者懼二􅇯不敢斥言其罪十六日上出睿聖宫以顯忠寺爲之也内人六十四人肩輿過二凶遣人偵伺恐匿内侍故也擒到内官曾擇太后降旨貶嶺外旣行一程復追回斬之亦二凶意也又欲以其親兵代禁衛守睿聖宫挾天子幸徽宣并浙東宰相曲折諭以禍福且以忠義歸之以安其反側頥浩等領兵次嘉禾二十五日召百官聽詔書大意云狄人以睿聖不當即位兵禍連年今當降位爲皇太弟兵馬大元帥嗣君爲皇太姪皇太后臨朝聽政退避大位務在息兵在庭愕然廷秀與中司欲留班論列以臺諫唯廷秀與鄭㲄二人遂不果就退睿聖宫立班乆之上御坐起居罷宰執上殿奏事議論幾數刻傳宣令百官先退仍云巳會得復聞上語宰執云若此傳之後丗豈不貽􅀏哉次日早鄭㲄入對且言旣降位号則乗輿服御亦皆降殺豈將易赭服紫耶當夜歸亦作奏狀令吏冩亭午方畢即進入未後太后宣召同中丞對簾前宰執皆在鄭㲄對乞次召廷秀太后云今日之事且因臣下有文字宰執啇量且欲睿聖皇帝緫領兵馬耳廷秀對曰臣不知其佗但人君位号豈容降改聞之天下孰不懷疑雖前丗衰乱分裂之時固未有旬日之間易二君一朝降兩朝位号也太后乃云必是殿院不曾見諸人文字相公可同殿院往都堂看前後文字便見本末旣退即隨兩府至都堂朱勝非顔岐王孝迪路允迪張􅊹皆在坐朱相自青囊取文字數紙次弟以示最上乃持服人奉議郎宋邴書次即張浚奏言睿聖皇帝當爲天下其馬大元帥下數紙不暇詳􅀚其間亦有士人上書者意皆略同廷秀語朱相云此事朝廷當有善後計但天子位号欲降於理未安廷秀旣當言責不敢嘿嘿章䟽言語狂直朱曰公爲言官自當言責蓋章䟽中有及大臣者復語諸公曰昨日之詔不可布于外必召變而張􅊹云􅀂以五日時事􅀔豈争此名位耶張欲行詔出廷秀請少緩明日鄭㲄入章引舜禪禹而親征有苗唐睿宗上畏天戒襌位太子而大事自决用其議遂􅃦二十五日詔書鄭瑴遂迁西樞以中書舎人張守爲中丞頥浩等㑹兵尅日將至兇徒氣挫乃使王丗修與宰執議天子復正往來数日四月一日辰時降旨召百官睿聖宫起居門外侍班次見宰執遣吏來問户部尚書孫覿借金帶至立班次忽有戎裝紫衫帶子也官貟綴從官班問之乃是王丗修方除工部侍郎賜􅂁帶未至先令綴班方悟假帶之繇蓋自渡江後宰執從官並繫犀帶今此異数用安反側丗脩王能甫之姪前此選人知鄭州榮澤縣虜兵偶不曾到而是邑全李綱特與改官遂爲苗􅀓幕賔午後上出百官起居畢即上馬百官掩班先行迎於内東門外杭州太守常視事在大厅之北至是丗脩具􅂁帶明日有旨正朝以苗􅀓爲淮西制置使劉正彦副之使其避張韓之兵別路而往又頒制賜䥫劵帶礪之誓三日聞韓將前軍至臨平爲二􅇯設伏掩殺四日夜二凶拔寨道餘杭門出轉龍山繇冨陽而去明日韓將劉兵皆入以張浚簽書樞宻頥浩右僕射朱勝非知洪州張􅊹知江州韓將遣人擒王丗脩鞫始謀并拘其妻子有旨令劉光丗處断晚有文字至臺申差察官就審實朝廷亦恐諸將鍜錬非實情也是時察官唯陳戩獨貟將臺吏并司獄至光丗寨取王丗脩實􅅃其􅀄王丗脩甞與二凶語閹宦恣横而劉尤嫉之上自􅀭州奔播過浙西道呉江左右䆠者以射鴨爲樂至杭州日群閹游湖山丗脩以劄子具陳其事張􅊹不納丗脩㦬而退以其劄子示正彦憤然曰公甚忠義要須與公恊力同去此軰俄又聞王淵爲樞宻愈不平苗劉乃與丗脩等謀先斬王淵然後殺内侍議巳定􅀄四日部分兵馬且使人語淵云臨安縣界有強盗欲岀擒捕五日早令丗脩伏兵於域西橋下俟淵過即捽下馬斬之継遣人圍康履家分兵捕内官凡无鬚者皆殺然後領兵伏闕請罪脅天子禅位此皆始謀實情依所招具奏明日戮之於市呉湛以輔二􅇯領中軍寨於宫門前申請除宰執侍從餘人悉於中軍寨門下馬使悍卒持挺誰何至歐擊從人損壊輿轎廷秀兩章引皇城司格令并律文䦨入法理㑹僅以章行而悍將復匿之而不出廷秀以臺中􅀍受榜於皇城司前軍士方少戢至是湛亦戮焉并貶王元左言皆殿帥以當日坐視二凶之悖不略誰何故也六日廷秀對䟽言錢塘非可居當圖建康爲暫都計上亦知此非處一章言王丗脩等及康允之劉蒙呉􅀃范仲熊讀至論仲熊事上甚怪之乃曰范仲熊莫不如是對曰臣不知其它但在宣和末進用實出梁師成門下又入文字言希孟上初怒甚便欲梟首宰執言此當自有論列百六九故廷秀章上廼貸希孟死流嶺南而賞􅁩兩官頴彦又記髙宗六龍幸海事云巳酉十一月駕幸㑹稽覘者報虜人分兵渡江一自採石入建康一自黄州過興國軍度採石者杜充兵要擊於中流小捷奏乞上親征二十五日駕起㑹稽至錢清聞虜人十九日巳度大江二十六日駕自錢清回明州避虜十二月七日至明侍從百官皆散唯宰執從行留張俊軍于越辛企宗領中軍李質領禁衛護從士卒不滿数千泉福州海船皆至廟堂即爲航海計衛兵不欲行九日遂群噪欲狙擊宰執十一日以張思正兵索城中捕乱者戮其爲首数人餘分􅀠五軍以御營使司參議官劉洪道知明州與張汝舟兩易十六日早上自府衙岀東渡門登舟十八日御舟泊定海縣二十日叅政范宗尹入城探報十六日巳䧟杭州大肆焚戮宗尹即回從駕張俊以所領軍自越來明知越州李鄴遣兵邀虜於浙江三捷旣而衆寡不敵鄴遂遣人賫書投拜虜人按兵入越俊兵在明乗賊先而恣掠鹵時城中人家少遂岀城以清野爲名環城三十里居民皆遭其焚刼或以金帛牛酒餉之幸免與紛争殺之有城南溤家子先歐其卒走歗衆來痛擊垂死積稻稈蔽之兵去人或救之者尚活而膚躰巳焦裂少刻而死二十七日虜引兵自餘姚道蓝溪入黄鄮車廐直抵湖塘分屯於湖中田舎二十八日俊引兵禦之小却於是虜人自城下呼請遣人來寨中議事明日俊遣姓徐人抵虜寨虜因釋甲與語欲如越官吏投拜拒之自後相持不敢動正月二日午間西風虜兵乗之叩西門時俊與劉洪道坐城樓上遣兵掩擊擒斃二酋虜奔北墮田間或墜水势當追而鏖敗之而俊亟令収兵要之得失略相當僅能却之而巳且張皇奏愷而䇿勳其後肆眚文云鄭水勦絶其大半蓋謂是也其夜虜兵拔寨西去俊遣人􅀱伺知虜人駐餘姚治攻具請於􅎔安之大酋益兵將復來俊托以上旨召扈從八日尽起其衆入台行甚速而李質亦以班直継行思正千餘徒屯江東而質思正洪道猶過從夜飲城中居民出者巳十七八有士人率衆叩洪道馬首願留以禦賊洪道紿曰予當數尅敵而勝􅀂等事無慮復下令民迁城外者得取其家之什物儲峙於是舟入城者數千􅃗洪道擇其大者留使官属取公使髙麗兩庫金銀器皿轢壓之而實於簏輿帑藏儲粮載之海舶而洪道所將精卒僅千人横肆乗乱剽掠州人怨之十三夜洪道㣲服出城旣過東岸恐人追襲乃使尽揭浮橋之版居人扶携㳂絙索而渡卒復邀奪其所賫擁排遏抑墜水者數千哀号震天地城中惟崇節作院廂軍與無頼􅁖少僅千人以監甲仗使臣并􅁥酒務李木者將之凡此皆欲僥倖賊不至掠取公私之物者十四日虜果復至營廣德湖舊寨前遣老弱婦女運瓦鑠填塹十五夜植砲架十餘對西門十六日以数砲碎城樓守者奔散奏東南縋城而出或浮木渡江生死相半而奔逃村落者与賊遇由是遍州之境深山窮谷平時人跡不到處皆虜人捜剔叢獉如探巢取􅆑殺掠不可勝數旣而破定海以舟絶洋刼昌國縣復欲攻象山縣至碕頭風雹大作俗謂轉碕海道㝡險處也遂回大率自正月十六日䧟明州至二月三日方去其酋長請於臨安之大酋大酋乃四太子云搜山檢海巳畢其明州取指揮報云依楊州例故自二月􅀄遣人四靣放火城中惟東南角數佛寺與僻巷居民偶得存者虜人旣去城外群小以船盗取公私錢物而村落􅇯頑殺人攘刼毒甚於虜州縣官逃避未還有蔣安義張鼐者受虜人僞命蔣爲安撫張爲通判且授安義以兩浙運司印一紐安義遂領州事繫衘出牓自命其子知鄞縣歗不逞以攘取十二日慈溪縣令林叔豹領郷兵入城見安義奪其印遺虜人十二人在開元寺病不前者叔豹誅之十六日通判蔣賡自象山歸郡官稍稍継至洪道亦自台回至奉化縣言巳受命制置浙東且樁粮料兵遂之越不知􅀓崧卿前此巳収復也洪道留奉化縣比向日誅求益甚而所將精卒􅁀横市肆邑人蔣璉􅇯悍人也前此群聚防守幸虜兵不至自以爲功方肆強梁會洪道卒有敺其黨者一夕歗引數千人圍岳林寺欲縱火而殺洪道縣丞白彦奎哀祈泣懇以和解之必使洪道殺敺人之卒不得巳取其卒杖流之乃定洪道旣入城與張思正縱其麾下斸民居窖藏逃遁之家偶脫死餒餓甚矣歸故址取所藏給朝夕則群卒強奪之雖焚餘椽楹藩籬可爲薪者人不得有公遣数百軰持長竿大鈎撈摝河陂池井間謂之䦨遺錢物輸公十不一二洪道復苛配強歛併得四万緍獻之行朝欲蒙失守之罪三月十二日乗輿自温航海至明時井邑巳焚蕩舟由城外徑之越因言者罷洪道以向子忞知明百七十州頴彦家居四明之海濵冝知其詳建炎庚戍先人任樞宻院編脩十月淮南宣撫司奏楚州城䧟鎮撫使趙立死之髙宗命先人撰其傳以進乙覽嘉歎乆之今載于後趙立徐州張益村人政和􅀄􅀠州之武衛軍中出戍江南值方臘乱從軍往言習知山川人情向背累歴戰功声名隱然又戍大名府以捕賊功􅀘本軍都虞􅀱資政殿斈士王復守徐州立在帳下是時金賊巳尽得河北兵􅀔彌熾轉戰京東所至官吏望風避去建炎三年三月犯徐州重圍旣合復率軍民登城力戰命立專往來守禦外援不至孤城益危立六中飛矢三中兵刃猶抜矢褁瘡灑血以戰復忠之自持巵酒揮涕以賞立賊帥粘罕在城下憤其難抜大益攻具城破復堅坐㕔事不肯逃遣人謂賊曰死守者我也􅁥郡而次無預焉願殺我而捨僚吏與百姓賊猶喻復投降復不從罵賊求死由是与尽室百口俱􅀍害立巷戰奪門以出爲賊所得夜殺守者入城潜求復屍撫之慟􅂘親爲掩藏立知賊兵乗勝貪得城中㢮備鼔率殘兵邀擊於外断賊歸路盡焚營壘奪舟船金帛數千計擾擊紛散四出軍聲復振尽􅇛郷民爲兵㰱血相誓戮力平賊退者必斬立之叔扆後期而至立謂曰叔以我故乱法何以臨衆促命斬之威震諸軍一皷破賊遁去追躡殺􅀗甚多遂推立爲長乗瘡痍之後拊循其民恩意户至召使復業井邑一新朝廷授忠翊郎􅁠知徐州事立奏爲復置廟城中賜名忠烈毎出師與遇歳時必率衆泣禱曰公爲朝廷守節以死必能隂佑遺民也齊人聞之歸心焉杜充守建康軍兼淮南京東宣撫使命㑹兵楚州立提忠義山寨郷兵數万人赴是時賊号托落郎君者圍楚益急往來艱梗立斬刈道路乃能行至淮隂與賊遇自昕至夕且行且戰出没賊中凢七破賊無有當其鋒者遂抵城下楚人􅀍圍乆聞立來􅌚迎鼔舞是時立中箭鏃入舌下堅不可取命醫以鐡䈤破齒鑿骨鈕去移時乃出流血盈􅁭左右毛髮皆聳而立顔色屹然不變建康失守就命立􅁠楚州事時四年正月也然賊􅀐未退益兵不巳用鵞車對樓飛砲架數百事攻州南門半月間登城者數十立皆率兵捍戰後分四門出師掩殺賊大敗解圍驅殘兵去渡淮六十里駐孫村浦立又敗之至五月賊號四太子軍者自二浙歸又寨於州之九里涇欲断楚粮道立又大破之㑹朝廷分置諸鎮嘉立殊勲超轉徐州􅀚察使承楚州漣水軍鎮撫使兼知楚州􅀄劉䂊竊據鄆州聞立在徐州遣立故人葛進等三人賫書誘令供稅賦立大怒不撤封斬之至是又遣沂州進士劉偲自鄆挾兩黥兵持旗牓誘立降且言金人大兵將臨必屠一城生聚立令拽出就戮偲呼曰我非公故人乎願公聞一言而就死立曰吾知忠義爲國豈恤故人耶速令􅆞以油布焚死市中且表其旗牓於朝廷於是立忠義之声傾天下逺迩嚮風下之賊又益以太子兵留天長諸兵皆㑹孫村浦立念敵以衆抗孤軍非鏖戰不能成功提師襲之賊大敗奪器甲數千計諸小寨皆潰立私謂僚属曰今賊自山東濟師不巳城中粮且尽則無以善其後將先取京東巳䧟没諸郡窒賊路及求粮旁邑則吾事濟矣且京東諸州本吾民也聞我之來必解甲相迎是時塩城縣水賊張榮者乗乱鴟張立親往禽之併是粮食將經營京東行至寳應縣而承州報賊復聚楊州立遂歸而賊再􅀓城立􅁣然曰賊終不捨去惟有竭莭死守此州而巳岀北門臨城濠外誓衆曰不進而退者必遭溺死我且併族尓家矣於是又大捷生致首領三百人賊以數十艘循潮河􅀚城立取火箭射船賊􅃐往救則出兵刼之焚溺死者浄盡無餘擒渤海千户李藥師等五十人立每刼賊寨必殺􅀗不貲或命僞於城頭張樂宴飲賊疑立在座立乃縋城潜入賊寨殺戮矣立念賊傾國而至憤懣激烈致三書於賊酋龍虎大王等曰尓擁金帛万艘我以楚州全師能各見大陣較勝􅀒亦英雄也賊不荅至九月􅀄城守百餘日矣賊併兵列大寨城下立擁六􅀐出呼曰我鎮撫也首領驍賊其來接戰南寨有二􅀐襲其背立跋馬回顧左右手奮兩槍賊俱墜地奪􅀟􅀐將還俄北寨中發五十餘􅀐追立立怒目大呼人馬俱辟易明日列三陣邀戰立以三隊應之賊旁鐵􅀐數百横分其陣而圍之又中飛矢立奮身突出重圍持挺左右大呼賊落馬者不知數是月十六日賊大進攻具鵝車洞砲架以千計薄東門又明日填濠將進立率進備木寨卧龍穿火濠築月城靡不備忽報賊將分布兵馬近城矣立􅀏曰將士不用相隨吾將􅀚其詭計淺深且令此賊疋馬􅃗輪不返上城東門未半忽自外飛砲中其首左右馳救之猶曰我終不能與國滅賊矣令轝致三聖庿中聲言疾病祈禱使賊不悟言絶而終然人聞其死知城必䧟失聲巷哭不可止衆以參議官程括權鎮撫使猶守旬日至二十九日賊聞哭聲知立死百計攻城烈火亘天然抑痛扶傷巷戰雖婦人女子亦挽賊俱溺於水事聞天子震悼御史謂立之功近丗一人雖張廵許逺不能過詔輟朝一日特贈奉國焉節度使開府儀同三司賜謚忠烈與十資恩澤俟復楚用監護葬事建立廟宇以旌其忠時駐蹕越州令寺􅀚作仙佛齋醮爲立及戰没將士資􅁳福所以致厚於其終者靡有不及􅀚立自起小校至爲將帥忠義之氣挺然鐵石其心雖手􅄃虎兕足蹈河海不少變渝與士卒同甘苦一飯必上下均濟故人固其志以死毎掞奏必言賊行㓕矣無足憂者願上寛宵旰之念方主上以文武之略啓中興之運擢立於卑晦隱㣲授以淮南一道其知之深矣右僕射兼知樞宻院范宗尹當軸處中與廊廟大臣皆嘉立忠義毎於勸賞應酬於内者惟恐後也而立亦不負君相之知又如此是時王復之子佾爲樞府官属朝廷命專主楚州奏報聞立􅀍圍又命浙西安撫大使劉光丗大將陳思恭㑹諸道兵水陸並進質責將帥促令渡江以援楚州故賊聞救兵且至乗之益急使立而無死將尽殄群醜少刷人神之憤然觀其所建立足以震耀於丗雖未能酬其㓕賊之心而氣亦伸矣賛曰身與義不兩立義存而身可亡此古烈丈夫專於報國忠孝之心託以死而無悔也􅀚立天挺英勇風節凛烈豈彭城從昔名將帥所岀其山川氣俗性習所鍾然耶先是詔州縣遇㓂至許携其民退保山谷而立不爲也意其不忍與城俱亡使少假之肯與賊俱存哉所以立死至城破天爲沉隂晝晦而褒贈隱䘏照爛竹帛其心明著天與聖主知之矣智力雖躓於一時而名譽􅋏動萬丗也張廵許逺皆出縉紳卿相之族聞見習熟臨難行其所知易矣立起自行伍􅁬不謀身較其時與􅀔比廵逺爲尤難也列其終始大節與攻戰百數特詳焉庻幾爲後丗忠臣義士之􅂆揮麈後録卷之九
