  - {type: variant, offset: 203, length: 3, content: 瑶華本, WYG: 㑹於子位於星知潮當附日而右旋以月臨子午潮必平矣月在卯酉汐必盡矣或遲速消息又小異而進退盈虛終不失於時期矣或問曰四海潮平來皆有漸唯浙江濤至則亘如山岳奮如雷霆水岸横飛雪崖傍射澍騰奔激吁可畏也其可怒之理可得聞乎曰或云夾岸有山南曰龕北曰赭二山相對謂之海門岸狹勢逼湧而為濤耳若言狹逼則東溟自定海縣名屬四明郡吞餘姚奉化二江江以縣為名一屬會稽一𨽻四明侔之浙江尤甚狹逼潮來不聞濤有聲耳今觀浙江之口起自纂風亭地名屬㑹稽北望嘉興大山屬秀州水闊二百餘里故海商舶船怖於上潬水中沙為潬徒旱切惟泛餘姚小江易舟而浮運河逹于杭越矣蓋以下有沙潬南北亘乏隔礙洪波蹙遏潮勢夫月離震兌他潮已生惟浙江水未洎月徑潮㢲潮來已半濁浪推滯後水益來於是溢於沙潬猛怒頓湧聲勢激射故起而為濤耳非江山淺逼使之然也宜哉令威以該洽聞于時恨不能知其人明清心謂必機博之人後以真宗實録考之大中祥符九年以燕肅為廣東提㸃刑獄遂取兩朝史燕公𫝊觀之果嘗自知越州移明州卷}
