  - {type: variant, offset: 69, length: 0, content: '', WYG: 為中司上疏力排之元直移元鎮為翰林學士元鎮引司馬温公故事以不習駢驪之文不肯就職且辭且攻之章至十數上元直竟從䇿免以優禮而去元鎭徑除簽書樞密院事時建炎四年四月也許志仁龍舒之秀士能詩善謔早為李伯紀之門賔伯紀捐舘諸子延緇徒為佛事羣僧請懴悔之詞於許迺取汪彥章昔所行謫詞中數語以授之僧徒高唱云朋邪罔上罪消滅欺世盗名罪消滅如此者不一諸子憤怒詢其所繇知出於志仁詬}
