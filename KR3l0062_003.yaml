front:
  text: 揮麈前録卷之三
  hash: sha256:5481b51594c9dfaf2a9778606635209c62ba0b7dbb48ae0f201b814d8fda9b9a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_003-1a}
body:
  text: 汝隂王明清太上皇帝中興之初蜀中有大族犯御名之嫌者而遊宦參差不齊倉卒之間各易其姓仍其字而更其音者勾濤是也加金字者鈎光祖是也加絲字者紡是也加草頭者茍諶是也改為句者句思是也增而為句龍者如淵是也繇是析為數家纍丗之後昏姻將不復别文潞公自云敬暉之後以國𥘉翼祖諱而改今有茍氏子孫與文氏所云相同蓋本一族亦是杜于南北失於相照與此相類李昌武宗諤之子昭遘十八歲鎖廳及第昭遘子杲卿杲卿子士廉皆不逾是歲登甲科凡三丗俱曽為探花郎亦衣冠之盛事也吳越國忠獻王錢佐薨其弟倧襲位未幾為其大將胡進思所廢時忠懿王俶為台州刺史進思迎立之元豐中王之孫暄知台州其子景臻自郡入都選尚仁宗女是為秦魯長主靖康末胡騎犯闕主避狄南來因遂卜居後數年詔即州賜第主享之二十年壽八十六薨于天台其子伯誠居之又二十年官至少師年亦八十餘少師子即處和也處和之女又自台州𬒳選為王妃去歲處和既為執政别營甲第南北相望甚夥一家盛事常占此境官制行置左右丞二府中班最下無有爰立者元祐中蘇子容丞相自左轄登庸時以為異恩崇寧初徽宗亟欲相蔡元長遂用此故事時有獻詩者曰磊落儀形真漢相闊踈恩禮舊蘇公紹興初吕元直自簽書摳密院入相前此所無也張垍乃張説之子敬翔為敬暉之孫本朝劉溫叟以父名嶽終身不聽樂至其孫几乃自度曲預修樂書可笑近有吳鑄者乃國𥘉功臣吳廷祚之後祖元扆復尚主而失節於劉豫仕偽庭至樞密使為其用事此一律吁可歎哉李叔佐云本朝以來以遺逸起逹者惟种明逸常夷甫二人而巳徽宗朝王易簡蔡崈吕注自布衣拜崇政殿説書然薦紳間多不與之也王君儀尹彥明後亦登禁從距今亦三十年矣雖婁下求賢之詔州郡間有不應聘者而羔鴈不至於巖穴也易簡即寓之父九江人大觀中家祖守郡首薦之其後改節以媚權臣官至資政殿太學士寓仕靖康驟拜二府𬒳命使虜託夢寐以辭行欽宗震怒竄嶺外父子南下中途為盜所害寓字元忠國𥘉每歲放榜取士極少如安德𥙿作魁日九人而巳蓋天下未混一也至太宗朝浸多所得率江南之秀其後又别立分數考校五路舉子以北人拙於詞令故優取熙寧三年廷試罷三題專以䇿取士非雜犯不復黜然五路舉人尤為踈略黃道夫榜傳臚至第四甲黨鏄卷子神宗大笑曰此人何由過省知舉舒信道對以五路人用分數取末名過省上命降作第五甲末自後人益以廣宣和七年沈元用榜正奏名殿試至八百五人蓋燕雲免省者既衆天下赴南宫試者萬人前後無踰此歲之盛崇寧中以王荆公配宣聖亞兖公而居鄒公之上故遷鄒于兖之次靖康𥘉詔黜荆公但舁塑像不復移鄒公于舊位至今天下庠序悉兖鄒並列而虛右雖後來重建者舉皆沿襲而竟不能革也沈文伯云劉器之晚居南京馬巨濟涓作少尹巨濟廷試日器之作詳定官所取也而巨濟每見器之未嘗修門生之敬器之不平因以語客客以諷巨濟巨濟曰不然凡省闈解送則有主文故所取士得以稱門生殿試蓋天子自為座主豈可復稱門生於他人幸此以謝劉公也客以告器之器之歎服其説自是甚歡陸務觀云亡友薛叔器家有關外侯印甚竒古後考之魏建安二十三年嘗置此名也又友人家有蕩虜將軍章及明清有橫武將軍印皆不可考伯氏有新遷長印後考前漢書乃新室嘗以上蔡為新遷也又友人家多睦子家丞印多睦郡名既亡子之家丞秩甚卑然篆文印樣皆出諸印右嘗撫得之或云亦王莾時印畢少董家有雍未央姓名見於急就章明清少遊外家年十八九時從舅氏曽宏父守台州有筆吏楊滌者能詩亦可觀言其外氏唐元相國之裔一日持告身來乃微之拜相綸軸也銷金雲鳯綾新若手未觸白樂天行并書後有畢文簡夏文莊元章簡諸公跋識甚多尋聞為秦熺所取恨當時不能入石至今往來于中也又丹陽吕城閘北委巷竹林中有李格秀才者自云唐宗室系本大鄭王房出其逺祖武德正觀以來告命勑書凡百餘亦有薛少保顔魯公書者竒甚明清每語親舊經繇不惜一訪而閲之李生亦不靳人之觀也文中子王通隋末大儒歐陽文忠公宋景文修唐書房杜傳中略不及其姓名或云其書阮逸所撰未必有其人然唐李習之嘗有讀文中子而劉禹錫作王華卿墓銘序載其家丗行事甚詳云門多偉人則與書所言合矣何疑之有又皮日休有文中子碑見于文粹歐陽文忠公父名觀文多避之如碧落碑在絳州龍興宫之類蘇東坡祖名序文多云引或作敘近為文者或倣此不知兩先生之意也賜生辰器幣起于唐以寵藩鎮五代至遣使命周丗宗眷遇魏宣懿始以賜之自是執政為例至和三年宋元憲建言慶曆郊祀赦書許文武官立家廟而有司終不能推述先典明喻上指因循顧望遂隃十載使王公薦紳下同閭巷昭穆雜用家人緣偷習弊甚可嗟也臣近因進對婁聞聖言謂諸臣專殖第産不立私廟豈朝廷勸戒有所未孚將風教頽齡終不可復反復至意形于嘆息臣每求諸臣所以未即建立者誠亦有由蓋古今異儀封爵殊制自疑成殫遂格詔書禮官既不講求私家何由擅立且未信而望誠者上難必責從善而設教者下或有違若欲必如三代有家嫡丗封之重山川國邑之常然後議之則墜典無可復之期矣夫建宗祏序昭穆别貴賤之等所以為孝雖有過差是過為孝殖産利營居室遺子孫之業或與民爭利顧不以為恥逮夫立廟則曰不敢寧所謂去小違古而就大違古者今諸儒之惑不亦甚乎於是下兩制與禮官詳定制度而王文安以下定官一品平章事以上立四廟知樞參政同知樞簽樞以上前任見任宣徽尚書節度使東宫三少以上皆立三廟餘官祭於寢凡得立廟者許嫡子襲爵以主祭其襲爵丗降一丗死則不得别立祔廟别祭於寢自當立廟者即祔其主其子孫承代不許廟祭寢祭並以丗數親踈遷祧始得立廟者不祧以始封有不祧者通祭四廟五廟廟因衆子立而長子在則祭以嫡長子主之嫡子死則不傳其子而傳立廟之長凡立廟聽於京師或所居州縣其在京師者不得於裏城及南郊御路之側既如奏仍令别議襲爵之制其後終以有廟之子孫或官微不可以承祭又朝廷難盡推襲恩之典遂不果行其略巳見宋次道退朝録至嘉祐中文潞公為相乃上章引禮官詳定制度平章事以上許立四廟欲乞於河南府營創廟詔從之政和中蔡元長賜宅京師援潞公之請既允所奏且命禮制局鑄造家廟祭器并余丞相深以下二府皆賜之紹興中秦會之表勳錫第又舉二例詔令討論悉如政和之制云錢宣靖吕文靖知制誥衣緑張益之友直鄧公子也為天章閣待制勾當三班院侍宴集英殿猶衣緋仁宗顧見即賜金紫吕文穆李仲詢及許沖元為兩制衣緋蔡元長王子發官制行後為中書舍人皆衣緋賈季華琰為樞密直學士正諫大夫衣緑本朝父子狀元及第張去華子師德梁皓子固兄弟孫何孫僅陳堯佐堯咨四家而巳後來沈文通孫晦以祖孫相繼近年許克昌實許安丗之親姪孫而王資深子洋俱為榜眼舊制監司雖官甚卑遇前執政宰藩亦肩輿升廳事宣和𥘉薛肇明自兩地出守淮南有轉運判官年少新進輕脫之甚肇明每不堪之到官朱幾肇明還舊廳因與首台蔡元長語及之且云乘轎直抵腳踏子始下呵輿之聲驚耳至今為之重聽其他可知也元長大不平翊日降旨諸路監司遇前宰執帥守處即入客位通謁自是為例王孟玉云熙寧中神宗命館職張載往兩浙劾知明州苗振吕正獻與御史程伯淳俱言載賢者不當使鞫獄上曰鞫獄豈賢者不可為之事邪弗許明清家有徐東湖所記太上皇帝聖語其略曰大宗正行司將至行在南班宗子所居當作屋百間上曰修營舍宇固非今所急然事有不得巳者故春秋於此事得其時制則不書不書者聖人之所許也近時營造之制一下百姓輒受弊蓋緣州縣便行科配矣又嘗語宰臣等曰為法不可過有輕重惟是可以必行則人不敢犯太重則決不能行太輕則不足禁姦朕嘗語徐俯異時宫中有所禁𥘉令之曰必行軍法而犯者不止朕深推其理但以常法處之後更無犯者乃知立法貴在中制所以決可行也淳化三年西夏李繼捧遣使獻鶻號海東青上賜詔曰朕久罷畋遊盡放鷹犬卿地控邊塞時出捕獵今還以賜卿可領之也宣和末耶律禧繇此失國烏乎太宗聖矣哉元祐名卿朱紱者君子人也嘗登禁從紹聖𥘉不幸坐黨錮崇寧間亦有朱紱者蘇州人初登第欲希晉用上疏自陳與姦人同姓名恐天下後丗以為疑遂易名諤字曰聖豫蔡元長果大喜不次峻擢位至右丞未及正謝而卒年方四十薛叔器云熙寧中御史言徐德占奉祠太廟嘗廣坐云仁宗有遺行詔問狀坐客客不敢對以為無德占云臣比行事至章懿太后室因為客言章懿實生仁宗而不及養後以帝女降后之姪瑋主乃與瑋不協使仁宗有遺恨臣實洪州人聲音之訛遂至風聞上以其言有理笑而薄罰之宣和中蔡居安提舉祕書省夏日會館職于道山食瓜居安令坐上徵瓜事各疏所憶每一條食一片坐客不敢盡言居安所徵為優欲畢校書郎董彥逺連徵數事皆所未聞悉有據依咸嘆服之識者謂彥逺必不能安後數日果輔外蘇訓直云曾文肅帥定一日晨起忽語諸子曰吾必為宰相然須南遷啓其所以公曰吾昨夕夢衣十郎緑𫀆北向謝恩豈非它日貶司户之徵乎後十年果登庸既為蔡元長所擠徙居衡陽巳而就降廉州司戶參軍勑到取幼子􅩕朝服以拜命果符前夢十郎即􅩕排行也韓似夫與先子言頃使金國見虜主所繫犀帶倒透中正透如圎鏡狀光彩絢目似夫注視久之虜主云此石晉少主歸獻耶律氐者唐丗所寶日月帶也又命取磁盆一枚示似夫云此亦石主所獻中有畫雙鯉存焉水滿則跳躍如生覆之無它矣二物誠絶代之珍也盆蓋見之范蜀公記事矣建隆遺事丗稱王元之所述其間帥多誣謗之詞至於稱趙普盧多遜受遺昌陵尤為舛繆案國史韓王以開寶六年八月免相至太平興國六年九月始再秉衡鈞當太祖升遐時政在外何緣前一日與盧丞相同見于寢邪稱太祖長子德昭為南陽王又誤矣𥘉未嘗有此封元之當時近臣又秉史筆豈不詳知且載秦王傳中云云安有淳化三年而見三朝國史秦王傳邪可謂亂道此特人託名為之又案元之自有小畜集序及三黜賦與國史本傳俱云淳化二年自知制誥舍人貶商州至道二年自翰林學士黜守滁上咸平二年守本官知齊安郡而此序年月次序悉皆顛錯其偽也明矣張賢良咸漢陽人應制舉𥘉出蜀過夔州郡將知名士也一見遇之甚厚因問曰四科優劣之差見於何書張無以對守曰載孟子注中因檢示之且曰不可不牢攏之也張道中漫思索著論成篇至都閣試六論以此為首題張更不注思而就主文錢穆父覽之大喜過閣第一黃六丈叔愚能記守之姓名嘗以見告今巳忘之張即魏公乃翁也唐文皇聚一時名流于册府始有十八學士之號後來凡居館殿者皆稱之國朝以來仕于外非兩制則雖帥守監司止呼寄祿官惟通判多從館中帶職出輔如蔡君謨湖州歐陽文忠公滑州王荆公舒州東坡先生杭州如此之類甚多劉贛父赴泰倅詩云壁門金闕倚天開五見宫花落早梅明日扁舟滄海去却尋雲氣望蓬萊蓋在道山五載然後得之學士之稱施于外者繇通判而然今外廷過呼大可笑矣建炎己酉歲二月金人舉國南冦時太上駐蹕維楊虜既次臨淮郡相距甚邇有招信尉以所部弓手百餘人拒敵是日也塵氛蔽日虜𥘉不測其多寡遂相拒踰半日尉與衆竟死不退於是探騎得疾走上聞乘輿百寮僅得南度儻非尉悉力以扼其鋒俾探騎得上聞則殆矣尉之姓名不傳於丗可恨友人王彥國獻臣能道其詳他日當問之為求大手筆作傳近見程可久云尉姓孫亦嘗以白國史汪聖錫矣後聞孫名榮三朝史錢儼傳云儼能飲酒百巵不醉嘗患無敵或言一軍校差可倫擬問其狀曰飲酒多手益恭儼曰此亦變常非善飲也東軒筆録云馮文簡在太原以書姹王靈芝曰井門歌舞妙麗吾閉目不窺但日與和甫談禪耳平父答曰所謂禪者只恐明公未逹耳蓋閉目不窺巳是一重公案馮深伏其言以二條觀之萬事莫不安於自然也本朝及五代以來吏部給𥘉出身官付身不惟著歲數兼説形貌如云長身品紫棠色有髭髯大眼面有若干痕記或云短小無髭眼小面瘢痕之類以防偽冒至元豐改官制始除之靖康之亂衣冠南渡承襲偽冒盜名字者多矣不可稽考乃知舊制不為無意也靖康間欲追褒司馬溫公輿論以謂惟范忠宣在元祐間尤為厚德可儷而有司一時鹵莾乃誤書文正之名批旨行下遂俱贈太師蓋不知文正以忠宣德孺為宰執巳追贈至太師中書令兼尚書令魏國公久矣適何文縝在中書以鄉曲之故乃以張天覺厠名其間亦贈太保而天覺熙寧中自選人受章子厚知引為察官事見邵氏辨誣為舒信道發其私書貶斥流落于外紹聖𥘉子厚秉鈞再薦登言路攻擊元祐諸賢不遺餘力至欲發溫公吕正獻公之墓賴曾文肅公力啓于泰陵始免其為慘酷甚矣晚既免相末年以校讎道藏復職又有二蘇狂率三孔闊踈之表詩有每聞同列進不覺寸心忙之句常希古亦力言其姦後來閩中書坊間骨鯁集輒刋靖康詔書于首繇此天下翕然推尊之事有僥幸乃如此者可發一歎張文老云建炎末贈黃魯直秦少遊及朝無咎張文潛俱為直龍圗閣文潛生前紹聖𥘉自起居舍人出帶此職蓋甚久亦有司一時稽考之失也李成字咸熙系出長安唐之後裔五代避地徙家營丘弱而聰敏長而髙邁性嗜杯酒善琴奕妙畫山水好為歌詩瑣屑細務未嘗經意周丗宗時樞密使王朴與之友善特器重之嘗召赴輦下會朴之亡因放誕酣飲慷慨悲歌遨遊搢紳間大府卿衛融守淮陽遣幣延請客家于陳日肆觴詠病酒而卒壽四十九子覺仕太宗兩歷國子博士其後以覺贈至光祿寺丞云此宋白撰志文大略如此王著書徐鉉篆覺字仲明列三朝國史儒學傳敘其丗家又同覺子宥仕至諫議大夫知制誥有傳載兩朝史傳云祖成五代末以詩酒遊公卿間善謨寫山水至得意處殆非筆墨所成人欲求者先為置酒酒酣落筆煙雲萬狀丗傳以為寶歐陽文忠公歸田録乃云李成仕本朝尚書郎固巳誤矣而米元章畫史復云贈銀青光祿大夫又甚誤也揮麈前録卷之三
