  - {type: variant, offset: 34, length: 0, content: '', WYG: 明杭守康志升允之委城而遁軍民迺共推誨領郡適敵寨於郊外誨登錢塘門樓遣人下與計事又唱言誨欲以城獻敵者為衆所殺時有黄大本者江湖浪人也靖康初蔡絛効丁晉公賂海商遣表之計使大本持書於吳元中云自謂不出蔡氏可乎心應知之葢謂其父疇昔有保䕶東宫之功果為開封府所獲上之元中坐此免相然元長竟得弗誅大本己酉歲亦以上書補京官假朝奉大夫直祕閣奉使北方既歸為池州貴池縣丞坐􅂍趙元振秉鈞恨其前日與蔡氏為地使元長得逃於戮遂正刑典又有朱弁字少張徽州人學文頗工早歲漂泊游京洛間􅄯以道為學官於朝一見喜之歸以從女弁以啓謝之云事大夫之賢者以其兄子妻之又以李虛中之術較量休咎游公􅀸間六飛在維揚有薦之者授修武郎閣門宣賛舍人副王正道倫出疆被拘在朔庭因正道之歸賫表於上云節上之旄盡落口中之舌徒存歎馬角之未生魂飛雪窖攀龍髯而莫逮淚灑氷天上覽之感愴厚恤其家留匈奴凡十九歲紹興壬戌始與洪光弼張才彦俱南歸易宣教郎直祕閣主管佑神觀以終旅殯於臨安近朱元晦以其族人為作行狀而尤先生延之作誌銘遷𦵏於西湖之上有聘遊集三十卷曲洧紀聞一書事多出於􅄯氏之言世頗𫝊之及與洪張為輶軒唱和集去歲朝廷録其孫為文學云明清頃有沈必先日記言奏事殿中}
