front:
  text: 揮麈後録卷之十百七一汝隂王明清呉傳朋說知信州朝辤上殿髙宗云朕有一事毎
  hash: sha256:2a104befca06788b5389610afaca40ca9989f404b669e3cba0f9e88d56ca67b6
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_015-1a}
body:
  text: 以自慊卿書九里松牌甚佳向來朕自書易之終不逮卿所書當令仍舊說皇恐稱謝是日降旨令根㝷舊牌尚在天笁寺庫堂中即復令張掛取宸奎榜入禁中說所書至今揭于松門仰見百七二聖德謙仁之不伐也傳朋自云靖康末駙馬都尉王師約之子殏爲龍德宫都監祐陵北狩御府器玩服御不能盡從者悉爲其掩有携以南度事露下廷尉伏罪髙宗欲戮之時叔祖子裳爲棘卿啓于上曰殏誠可殺但倘非其隱匿則諸物悉爲虜得無從復歸天上矣上於是貸而不誅先人摹得其古玉印數十今百七三假于楊伯虎文昺未歸建炎巳酉髙宗蹔駐蹕于建康閩中禽苗傳劉正彦獻俘于朝檻車幾百兩先付之大理獄將盡尸諸市子裳請對以陳云在律俱當誅死然其中婦女有雇買及鹵掠以從者倘殺之未免無辜願賜哀矜上矍然曰卿言極是朕思慮之所不到即百七四詔除二妻子之外餘皆釋放歡呼而岀周望字仲弼蔡州人有口材好談兵甞爲康邸記室建炎𥘉吕元直從而引用之驟拜二府髙宗幸明越命其經略淮浙付委甚重而昧於戎機駕馭無術遂至紛亂平江一城㝡爲荼毒責昭化軍節度副使連州安置以死紹興巳夘其家自理詔復故官澤及其子時凌明甫哲爲右正言明甫平江人也親見其郷里𬒳害之酷遂上䟽䟽其罪命廼寢吴越錢穆作収復平江記悉從紀實不能采其文華之要雖有浮冗之詞不欲易之建炎四年庚戍春二月金人首領四太子者自明越還師由臨安府襲秀州二十五日犯平江府午漏未盡四刻兵自盤門入刼踐官府民居廥廩積聚虜掠子女金帛乃縱火延燒煙熖見二百里凡五晝夜三月初一日出閶西冦常潤於是平江府燒之旣士民前後遷避得脫者十之二三遷避不及或殺者十之六七謹按靖康之乱金人再犯闕太上皇帝淵聖皇帝北狩今上皇帝即位于睢陽改元建炎是年秋移幸江都三年巳酉春金人南牧淮甸二月初三日大駕渡楊子江幸杭州金人叩江而不濟巳廼歸國四月大駕西還駐蹕于金陵寵其府号易江寧爲建康議者謂金陵六朝建國襟帶大江崗嶺廻合北貫淮汴西引川峽南洞襄漢東壓呉越甄閩荆廣之區四逹之國也資其冨饒基本王業以經理中原収復京洛實爲勝筭開封尹杜充乆司留鑰天下属望至是召赴行在命爲淮南京東西宣撫處置使俾提重兵保諸路又請隆祐太后領皇太子帥六宫及宗室近属前往江表百司庻府非與軍興之事者悉從焉上獨與宰相吕頥浩曁三數大臣以次侍從官留金陵治兵詔書有誓堅一死以保群生之語士民讀詔感泣奮厲以爲中興之期可指日而慶矣杜公旣有成命淹廻未遣人心稍惑之閠八月一日詔云朕嗣位累年寅奉基緒愛育生靈凢可以和戎息兵者卑辭降禮無所不至而敵人猖獗迫逐凌犯未有休息之期朕甚憚之比命杜充提兵防淮然大江之北左右應接我所守者一由荆襄至通泰敵之可來者五六兵家勝負難可預言所議衆多未易偏廢軫念旬月莫適决擇朕將定居建業不復移蹕與夫右趣鄂岳左駐呉越山川形勢地利人情孰安孰危孰利孰害以至彼我之所長歩騎之所冝何嶮可守何地可戰甚地之錢物可運甚郡之粟糓可漕其各悉心致思以告于朕昔漢髙帝謀臣良將多矣都雒之計巳定及聞婁欽一言而用之之意立决吾士大夫之確論朕豈不能虚懷而樂從哉三省可示行在職事官共條具以聞於是群臣争進避敵之計拜杜公尚書右僕射留鎮金陵不復北渡矣二十五日大駕廼復南廵九月初四日駐蹕于平江府二十五日詔休兵巳兼旬可㳙日進發詞臣引孟子廵狩𥙷助爲說始平江人猶幸於駐蹕倚以爲安至是惶遽失望盖前此駕後諸軍多阻乱不靜人旣畏之又慮胡騎乗冬深入於是逺有散之浙東閩部者而近者亦自匿於山巔水涯之際詔以工部侍郎湯東野爲守臣又命同知樞宻院周望爲淮浙宣撫使宿兵府城將官陳思恭巨師古張俊魯與李貴俗號李閻羅者等悉隷望節制又詔駕後諸軍盡命先啓行獨以禁衛請班扈蹕九月初四日駕興平江幸無釁其民復稍稍安集周望遣諸將各部署所隷兵分護境内河内降賊郭仲威領其下萬衆至自通州屯泊于虎丘山時大駕駐㑹稽十一月有旨金人於和州欲渡采石及自黃州渡兵巳至興國軍界取二十五日移蹕前去浙西爲迎敵之計呉人復引領望幸未幾建康府報是月十八日碙砂渡將官張超失守賊登岸杜丞相遣都统制官陳淬提領岳飛劉剛等二萬人分陣頭迎戰又命王全軍一萬三千人相继往來䇿應二十日陳淬與賊遇于馬家渡凡十餘合日暮戰酣勝負略相若㑹王領西兵畔敵檄鎮江府韓丗忠江州劉光丗應援皆不赴丗忠巳望風循海道潜去於是陳淬孤軍力弱不能當賊進逼建康城下守臣陳邦光降之通判楊邦義死焉杜丞相奔儀真収拾潰亡移保淮甸大駕頓于越州之蕭山縣群臣復勸南避乃幸四明於是平江大震恐周望湯東野集耆艾士夫僧道訪問所以爲計者且曰今戰守皆巳無䇿矣蓋其意在迎降而欲衆發其端士民不荅而罷望歛諸將兵歸城中懼其抗賊取怒也巳而金人自建康取捷徑刼廣德軍掠湖州南境破属邑長興武康安吉遂犯臨安府之餘杭縣急趍臨安府守臣康允之去之民自爲守六日而䧟渡錢塘江降越州守臣李鄴遂犯四明以窺行在有詔周望湯東野等固守平江等望自謂虜不敢犯境而過始少安遂倚郭仲威爲腹心㑭盡護諸將與張俊魯與居城中遣巨師古控扼呉江陳恩恭屯楞伽山李閻羅屯常熟縣思恭兵無紀律村落五十里間皆𬒳其害周望詰責之斬隊將武節郎張振乃戢而郭仲威居城府外爲忠勇之論望委任之不疑士民亦頋望信以爲重晏然按堵如平日而郊居遷避之家往往而復平江城堞完壯而地下聚水四圍渠塹深廣周望又竭取民財錢榖以鉅萬計庫廪充牣兵器犀利沛然有餘力以是人益安之過明年春正月而來傳言者多云賊自越州躡來路返金陵或又謂自臨安府昌化縣道宣歙趍當塗渡江而歸杭無疋馬隻輪矣望等素不嚴斥堠而四境無尉野無烽火但以傳言爲信乃遣張俊陳思恭等統兵規入杭州以邀収復之功俊等行涉旬纔及秀州陳思恭偵知傳言者非實走間道潜軍于湖州烏墩鎮以觀變二月十八日張俊馳報金人犯秀州崇德縣俊統兵迎擊于宣店走之平江之人且喜且懼以俟後捷十九日徴郷兵發太湖洞庭東西山千艘命用頭廵撿湯舉揔之前赴呉江陣于簡村二十一日金人犯呉江縣巨師古兵不戰而潰更以太湖民舟爲向導歸于西山二十二日郭仲威遣千兵拒守于尹山巳而退師二十三日府中令民逐便出城留少壯者登埤以守是日金人遊騎掠城東郭仲威兵未合而返守臣湯東野出奔周望以郡印付仲威二十四日仲威㑹諸將飲城上士民老㓜數萬叩頭出血請加守禦之備仲威奮髯詔衆曰即發遣騎兵虜行破矣民慎無擾人猶信之日欲晡金人大集于城下仲威及魯與兵火廣化寺又火㙠官李丗康宅望仲威等皆宵遁其下自城南轉刼居民北出齊門而去民之得出郭者多爲所害明日金人遂據城諸將奔遁潜伏外邑覘胡人之行也競以兵還三月𥘉二日張俊至自崑山初三日巨師古至自洞庭李閻羅魯與郭仲威等至自常熟初五日陳思恭至自烏墩各以力勝惟仲威竊據之揭牓于市曰本軍巳逐退金人収復府城或聞亦用此奏上周望自遁所良乆乃出領兵之呉興十五日始有詔周望等平江失守可發遣諸將兵往常州以北衝襲金人以功贖過云初金人燒刼之餘金帛錢糓尚多仲威即據城縱兵掠取晝夜捜抉不巳遺民間訪舊居即執之笞責苦楚窮問瘞藏之物民益冤憤故自金人南渡碙砂破金陵廣德杭秀常潤明越惟平江𬒳害㝡深盖以兵多將庸民始倚之而不去旣墮虜計則又再遭官軍之毒是夏疾疫大作米斗錢五百有自賊中迯歸者多困餓僵仆或驟得食而死横屍枕籍道路涇港爲實哭聲振天地自古喪乱之邦未有如是之酷也穆目覩其事幸以身免因迹階乱之由與夫敗亡次叙記之以俻後丗史官採擇目之曰収復平江府記者本郭仲威揭示之文具爲呉人諱於不復云建炎四年四月二十日記仲威出于㓂盗號郭大刀明年除楊真二州鎮撫使在郡長悪不悛劉平叔光丗爲淮浙宣撫置司京口遣其將王德禽仲百七五威至麾下殺之紹興戊午秦會之再入相遣王正道爲計議使以脩和盟十一月樞宻院編修官胡銓邦衡上書曰王倫本一狎邪小人市井無頼頃縁宰相無識遂㪯以使虜專用詐誕欺罔天聽驟得羙官天下之人切齒唾罵今日無故誘致虜使以詔諭江南爲名是欲臣妾我也是欲劉豫我也且豫臣事醜虜南靣稱王以爲子孫帝王万丗之業牢不可㧞一旦豺狼改慮捽而縛之父子爲虜啇監不逺而倫乃欲陛下效之夫天下者祖宗之天下也陛下之位祖宗之位也柰何以祖宗之天下爲犬戎之天下祖宗之位爲犬戎藩臣之位陛下一屈膝虜人則祖宗社稷之靈盡汚夷狄祖宗数百年之赤子尽爲左袵朝廷之宰輔尽爲陪臣天下士大夫皆當裂冠毁冕変爲胡服異時豺狼無厭之求安知不加我以无禮如劉豫也哉夫三尺童子至無知也指犬豕而使之拜則怫然怒堂堂天朝相率而拜犬豕曾童穉之所羞而陛下忍爲之耶倫之議乃曰我一屈膝則梓宫可還太后可復淵聖可歸中原可得嗚呼自變故以來主和議者誰不以此說㗖陛下然而卒無一驗則虜之情僞巳可見矣而陛下尚不覺悟竭民膏血而不䘏忘國大讎而不報含垢忍恥舉天下而臣之甘心焉就令虜决可和盡如倫議天下後丗以陛下爲何如主也况醜虜変詐百出而倫又以姦邪濟之則梓宫決不可還太后决不可復淵聖决不可歸中原决不可得而此膝一屈不可復伸國勢陵夷不可復振可不爲慟哭流涕長太息哉向者陛下間関海道危如累卵尚未肯臣虜況今國勢旣張諸將尽說士卒思奮如頃者醜虜陸梁僞豫入冦固甞敗之於襄陽敗之於淮上敗之於渦口敗之於淮隂較之往時蹈海之危固巳萬萬不侔儻不得巳而至於用兵則我豈遽出虜人下哉今無故欲臣之屈萬乗之尊下穹廬之拜三軍之士不戰而氣巳索此魯仲連所以義不帝秦非惜夫帝之虚名惜天下大勢有所不可也今内而百官外而軍民萬口一談皆欲食倫之肉謗議汹汹陛下不聞正恐一旦変作禍且不測臣故謂不斬王倫國之存亡未可知也雖然倫固不足道也秦檜爲心腹大臣而不爲之計陛下有堯舜之資檜不能致陛下於唐虞而欲導陛下爲石晉頃者禮部侍郎曾開以古議折之檜乃厲聲責之曰侍郎知故事我獨不知則檜之遂非愎諌巳自可知而乃建議日令臺省侍臣僉議可否蓋畏天下議巳令臺省侍臣共分謗耳有識者皆以謂朝廷無人吁可惜也孔子曰㣲管仲吾其𬒳髪左袵矣夫管仲伯者之佐尚能變左袵之軀而爲衣裳之㑹秦檜大國之相也反驅衣裳之俗而爲左袵之郷則檜也不惟陛下之罪人實管仲之罪人也孫近傳㑹檜議遂得參知政事天下望治有如飢渴而近伴食中書漫不知可否檜曰虜可講和近亦曰可和檜曰天子當拜近亦曰當拜臣嘗至政事堂三發問而近三不荅但云巳令臺諫侍臣議之矣嗚呼身爲執政不能參賛大政徒取容充位如此若虜騎長驅近還能折衝禦侮耶竊謂秦檜孫近皆可斬也臣備貟樞属義不與檜等共戴天區區之心願斬三人頭竿之槀街然後覊留虜使責以無禮徐興問罪之師則三軍之士不戰而氣自倍不然臣有赴東海而死耳寧能處小朝廷求活耶䟽入責爲昭州鹽倉而改送吏部與合入差遣注福州簽判蓋上初無深怒之意也至壬戌歳慈寧歸養秦諷臺臣論其前言弗效詔除名勒停送新州編管張仲宗元幹寓居三山以長短句送其行云夣遶神州路悵秋風連營畫角故宫離黍厎事崑崙傾砥柱九陌黃流乱注聚萬落千村狐兎天意從來髙難問况人生易老悲如許更南浦送君去凉生岸栁銷殘暑耿斜河踈星淡月断雲微度萬里江山知何處回首對床夜語鴈不到書成誰與目断青天懷今古肯兒曹恩怨相尓汝舉大白唱金縷邦衡在新興甞賦詞云富貴本魚心何事故郷輕别空使猿驚鶴怨誤薜羅風月囊錐剛要出頭來不道甚時節欲駕巾車歸去有豺狼當轍郡守張棣􅌳上之以謂譏訕秦愈怒移送吉陽軍編管棣乃擇使臣之刻核者名㳺崇管押封小項筒過海邦衡與其骨肉徒歩以渉瘴癘路人莫不憐之至雷州太守王彦恭趯雖不斈而有識適使臣者行囊中有私茶彦恭遣人捕獲送獄奏治別差使臣護送仍厚饟以濟其渡海之費邦衡頼以少甦彦恭繇此賢士大夫推重之棣訐邦衡後即就除湖北提舉常平乗軺一日而殂又数年秦始聞仲宗之詞仲宗掛冠巳乆以它事追赴大理削籍焉邦衡囚朱崖幾一紀方北歸至端明殿斈士通奉大夫八十餘而終謚忠簡此天力也此一叚皆邦衡之子澥手爲删定揮麈後録卷之十
