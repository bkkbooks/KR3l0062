body:
  text: 卷之二三十徽宗幸髙宗幄次見金龍蜿蜒榻上三乙髙宗閲奏求其生路三二髙宗興王符瑞三三徽宗御製良嶽記命李質曹組為古賦并百詠詩及詔王安中賦詩三四近日官制紊亂三五歐陽文忠與劉邍父書問答入閣儀詞三六吳縝著唐史紏繆五代史纂誤之因三七皇玉寶運録載黃巢王氣一事歐陽文忠未曾見三八京官朝參差回綱船乘歸三九人不堪命皆去為盜四十宰相奏輔于第止授九品京官自吕文穆始四乙通判運判所舉人數沿革四二磨勘進秩自孫何耿望建言始四三富文忠封還詞頭盧襄贊執奏不行四四張唐英述仁宗政要與嘉祐名臣傳四五韓魏公章子厚為山陵使四六韓魏公出判相州不敢預聞國命吕吉父出守延安乞與樞密同奏事四七丞相吳沖卿忌郭逵成功其孫吳侔以左道伏誅四八新法之行施於天下獨永康無和買四九邢和叔用章子厚語以答虜使五十吕氏為侍郎者三人俱有子孫為相五乙邵堯夫譏冨鄭公肉食者鄙五二總管之總字但從手不從絲五三李濤李擇常本出一族五四陳崇儀廟食事因五五唐宰相以宗室進者十三人如何史贊乃云七人卷之三五六熙寧以來宰相封國公五七蔡無道作官制舊典事有抵牾五八方軫論列蔡京章疏五九強淵明上景鍾頌六十王宷為林靈素中傷與劉炳俱見誅六一劉康孫啓崔貴妃奪王景彛故弟果報六二蔡元長不啓印匣用印印復在匣六三張柔直勸蔡元長收拾人材以救喪亂六四解習除知河中府以箝口喪軀六五蘭亭石刻既存而復失六六張逹明報唐欽叟令銜命誅童貫六七馮楫雷觀同為學官相排六八賀子忱李邈詐疾退避六九粘罕欲根刷玉牒名字賴秦中丞得免七十鄭居中與蔡京交惡七一追贈范忠宣誤作文正七二溫禹弼與曾文肅相失七三蘇東坡作陳公弼傳卷之四七四徽宗燕賞元霄命王安中馮熙載進詩七五陳堯臣進退終始事迹七六靖康中黃時稱徐揆段光逺三人上虜酋書七占張邦昌僣偽事迹七八夏人沮粘罕之氣卷之五七九論熙寧以來諡法八十材人所畏者尉曹八十一江氏令樊若水獻下江南之䇿宋咸鄭毅夫記其事甚詳八十二蜀孟昶上周丗宗書八十三國朝父子兄弟叔姪聮名顯著八十四黃巢明馬兒李順皆能逃命於一時八十五蔡伯俙以神童授官食祿七十五年八十六張耆燕禁從諸公八十七韓忠獻四子奏名禮部卷之六八十八韓持國入仕首末八十九王平為司理不阿旨以殺無辜九十李邯鄲命諸子名九十一司馬溫公人望所歸九十二溫公不自矜伐九十三王荆公死兆九十四晏元獻元厚之怒人犯父諱九十五時君卿稱王荆公於上前九十六蔡持正之父黃裳戒其子必報陳氏九十七王和艾德政如神九十八汪輔之就試自知登第九十九滕元發因舍弟申與楊元素失眷一百蘇東坡改王兵部滕元發行狀為墓銘百一曽氏一門六人同榜及第百二馮京作主文取張藝叟置優等百三曾文肅薦王兵部居言路不就百四曾文肅為相首末百五中使宣押蔡卞為右丞百六夏人冦慶州老卒保其無他百七趙正夫與黃魯直戲劇銜怨切骨百八林仲平二子立名百九蘇東坡不肯寫司馬文正墓志百一十歐陽觀行狀異同百十一余行之結連外界罪狀百十二李端叔行狀文章百十三東坡杭州湖上會客百十四昭靈侯行狀首末百十五曾文肅王大卿結為契家卷之七百十六國朝以來自執政徑登元台百十七本朝先正御書碑額與御書閣名百十八滕章敏訪荆公臨別贈言百十九東坡知舉時劉無言論效醉白堂記百二十朝以道跋魚枕冠頌百草一曾文肅夫人招李子約母妻百草二徐師川改陳虛中判語百草三蔡元度與門下士觀畫壁百草四揚康功使髙麗百草五方逹源乞重修汴河短垣奏疏百草六東坡舟次泗上百草七建中士人與曾蔡啓語兩易百草八曾文肅幐沙粥百草九石豫言鄒志完再竄及降復元祐人百三十毛澤民和蔡元度鴛鴦詩百三一錢昻輕童貫百三二黃魯直浯溪碑曾公袞不欲書姓名百三三郭槩善於擇壻百三四王慶曾不隨曾國老濟江乃免於難百三五唐質肅公孫女識受釐殿名百三六王歧公在翰苑命門生供經史對百三七王兵部為尉驗親識弓手殺人百三八米元章倚蔡元長凌大漕張勵百三九吕元直奏除李良輔名百四十鍾正甫治鄒志完獄劉景鞠謝景思百四一王氏書為陳元則所得百四二葉少藴書火於辨山李泰發藏書火於秦百四三東坡在張厚之家再見徐君猷家姬為之感動百四四童貫以承宣使乘狨坐由是為例百四五趙諗偽號隆興百四六髙俅本東坡小史卷之八百四七陳舉摘魯直塔記貶冝州舉復以進青蛇靑錢罰俸百四八王彥輔村里侍從百四九范寥告張懷素變百五十畢仲遊杖張懷素百五一蔡文饒館李易百五二李漢老為李濤五丗孫百五三李譓進萬歲蟾蜍百五四賈明仲治童貫第得謝踰數萬緡百五五曾空青極力照矚陳瑩中百五六王宣贊召劉斯立而距李延年至興獄纍賔主百五七王倫隨李相至禁中自陳於殿下百五八舍人草東坡復官制院吏教為結尾百五九陳述併治鄭良俱死而旅攢並室百六十江子我不信卜者之言百六一朱新仲代王彥昭致語用魯公帖及栁詞百六二蘇叔黨不從賊脅通夕痛飲而卒百六三蘇叔黨屬李植於向伯恭百六四蔡元長貶潭自歎失人心且作詞以卒百六五髙宗擢用徐師川百六六葉宗諤得婦人濟江百六七李元量魁天下卷之九百六八王廷秀閲丗録載眀受之變甚備百六九頴彥文記髙宗幸海事百七十髙宗命王兵部撰楚州守將趙立死事傳卷之十百七一吳傅朋上殿髙宗自謂九里松牌不如吳説百七二王殏掩匿御府器玩服御百七三髙宗從王子裳言釋苗劉鹵掠婦女百七四錢穆收復平江記百七五秦會之修和盟胡銓上書除名張仲宗送行詞削籍卷之十一百七六孫仲益作墓碑百七七徐康國傲忽觸韓璜劉剛百七八傳嵩卿觸二執政名百七九范擇善遷葬百八十秦會之答李元老啓百八一御史希秦會之言罷鐫汰濫賞百八二王承可以名同偏旁緣秦會之誣罔以至侍從百八三周葵言梁仲謨語泄去位百八四秦會之使馮濟川探髙宗意百八五方庭實強勉入廣百八六馬子約梁揚祖因議斷強盜罪不咸百八七朱希真雪溪集序百八八名家子知邵州希合秦會之按辛永宗籍其家百八九解潛為韓丗忠草奏配嶺外百九十榮茂丗不受嶽飛父子不軌之訴百九一曾宏父小顰誦赤壁二賦百九二髙宗問陳桷百九三秦會之以姚宏不簽名卒以祈雨死大理獄中百九四熊彥詩賀啓百九五錢遹迎拜臘冦痛毁時政為冦所殺百九六李孝廣以費又試卷謗訕竄廣南死其子病又為祟百九七方允迪以先得御注老子為毛逹可所賞百九八談稹梁師成言早來玉音可畏百九十孟富文為執政二百王慶曾畏秦會之不為顯仁償虜使金會之卒喜二百一曾吉父答啓二百二孫立為盜得壽州鈐轄印二百三王公明為王原所疑二百四秦師垣謂魏道弼莫胡思亂量二百五陸農師揮麈後録目卷終
