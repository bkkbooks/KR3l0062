  - {type: variant, offset: 9, length: 0, content: '', WYG: 不至聞從京口入都矣豈非用心不善乎子其往京師偵探之廷俶裝西上道中小緩而進比次國門則見懷素與其黨數人皆鎻頸纍纍而過防䕶甚嚴廷皇怖休於旅邸又數日變易名姓買舟南下有二白衣𨽻軰與之共載既相欵洽忽自云我開封府捉事使臣也君識}
