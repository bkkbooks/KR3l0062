  - {type: variant, offset: 32, length: 0, content: '', WYG: 十五丈希真徐五丈敦立俱為正字來過先人先人命明清出拜二公詢以國史中數事隨即應之無遺繇是受二公非常之知于弱齡希真之相予多見其詞翰中後二十年明清為方壻敦立守}
  - {type: variant, offset: 33, length: 0, content: '', WYG: 陽以書與外舅云聞近納某字之子為壻豈非字仲言者乎具道疇昔時事且過相溢美又數年敦立為貳卿明清偶訪之坐間忽發問曰度今此居號侍郎橋何耶明清即應以仁宗朝郎簡杭}
