front:
  text: 揮麈後録卷之八百四七汝隂王明清黃太史魯直本傳及文集序云太史罷守當塗奉玉
  hash: sha256:9bf697412d5cbcf3f5528dce1c7310df5dee896561719ca39d3b3f7b36c07d67
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_013-1a}
body:
  text: 隆之詞寓居江夏嘗作荆南承天寺塔記湖北轉運判官陳舉承風指採摘其間數語以為幸災謗國遂除名編隸冝州時崇寧三年正月也明清後閲徽宗詔旨云大觀二年二月壬午淮南轉運副使陳舉奏臣巡按至泗州臨淮縣東門外忽見一小蛇長八寸許在臣船上尋以燭照之巳長四尺有餘知是龍神以箱復金𥿄迎之遂入箱中并箱復送至廟中知縣黃鞏差人報稱所有箱內揭起金𥿄錢巳失小蛇止有開通元寶錢一文小青蟲一箇次日早差人賫送臣船臣切思之神龍之示人以事必以其類以臣承乏漕事實主財賦不示以別物而示以錢者以其如泉之流行於天下而無窮也不示以別錢而示以開通元寶以其有開必有通而無壅也示之以青蟲一者其蟲至微背首皆青腹與足皆金色青東方色也示其有生意金西方物也示其有成意也臣切以謂神龍伏見陸下復修神考漕運與鹽法使內外財賦豐羡流通不滯一方而無有壅塞公私通行靡有窮竭故見斯異臣不敢隱默謹述事由并開通元寶錢一文及小青蟲一箇盛以塗金銀合子謹專人詣闕進呈奉聖旨陳舉特罰銅二十斤其進開通錢并青蟲兒塗金銀合封全並於東水門外投之河中以戒詭誕敬綴于編仰見祐陵聖聰明察姦欺繇是而知所謂陳舉者誠無忌憚之小人所為若是不獨冝州之一事也遺臭千載可不百四八戒哉伯祖彥輔以文學政事楊歷中外甚久元符中為司農卿哲宗欲擢二版曹巳有定論有賣卜瞽者過門呼而問之云何日可以有喜術者云目下當動殊不如意壽數却未艾更五年後作村里從官是時伯祖巳為朝議大偶白事相俯言忤章子厚遂挂冠去國明年徽廟登極巳而遇八寶恩轉中大夫又以其子升朝遷太中大夫又數年年八十一乃終伯祖名得臣自號鳳臺子有注和杜少百四九陵詩麈史行於丗大觀中有妖人張懷素以左道遊公卿家其説以謂金陵有王氣欲謀非常分遣其徒遊説士大夫之負名望者有范寥信中成都人蜀公之族孫始名祖石能詩避事出川以從懷素懷素令寥入廣以訹黃太史魯直時魯直在冝州危疑中聞其説亟掩耳而走巳而魯直死寥益困遂詣闕陳其事朝廷興大獄坐死者十數人寥以無學籍授左藏庫副使賜豫甚厚寥又言潤州進士湯東野德廣實資助其垂橐而趣其行德廣自布衣授宣義郎司農寺簿賜緋衣寥每對客言其告變實魯直縱百五十臾之使魯直在奈何舅氏曽宏父云張懷素本舒州僧也元豐末客畿邑之陳留常插花滿頭佯狂縣中自稱戴花和尚言人休咎頗驗群小從之如市知縣事畢仲遊怒其惑衆禽至廷下素其度牒江南李氏所給也仲遊不問抹之從杖一百斷治還俗遞逐出境自是長髮從衣冠遊號落托野人初以占風水為生又以淫巧之術走士大夫門因遂猖獗既敗捕獲于真州城西儀真觀室中有美婦人十餘獄中供出蹤迹本末時仲遊死巳久詔特贈太中大夫官其二孫史册不載百五一畢氏干照存焉蔡文饒薿帥維揚郡庠有士子李者不拘細行以豪自任文饒聞其名呼與之言遂延致書室以教諸子且不責以課程巳而文饒易鎮青社携與俱行邦人疑之經歲辭歸文饒贈遺甚厚又惠槐簡一云此薿釋褐所賜足下不晚亦當魁天下官職壽數與薿悉相埒後皆如其言李即順之易建炎龍飛第一人也廉宣仲云五代李濤與弟浣俱負才望浣仕晉為內相耶律德百五二光犯京師虜之以歸仕契丹亦顯有應歷集十卷濤後相漢猶及見本朝有傳載三朝史中濤五丗孫即漢老邴也漢老之弟唐老鄴建炎初守百五三越州隨虜北去亦為之用事有可笑如此者道家者流謂蟾蜍萬歲背生芝草出為丗之嘉祥政和初黃冠用事符瑞翔集李譓以待制守河南有民以為獻者譓即以上進祐陵大喜布告天下百官稱賀于廷上表云九天睿澤溥及含靈萬歲蟾蜍聿生神草本實二物名各一芝或善辟兵或能延壽乃合為於一體允特異於百祥命以金盆儲水養之殿中浸漬數日􅃮絮敗潰鴈迹盡露上怒黜譓為單州團練副使謝表云芹獻以為美野人之愛則深輿乘而可欺子産之志焉在譓至百五四之孫也政和中將作監賈讜明仲奉詔為童貫治賜苐于都城既落成賈往謝之貫云久勞神觀而匆匆竟未能小欵翌早朝退無它幸見過點心而巳明仲領其意詰朝既見賔主不交一談頃之一卒持二物若寶蓋瓔珞狀張於貫及巳之上視之皆真珠也各命二雙鬟捧卓子一隻至所座前又令庖人持銀鐐竈即廳之側燎火造包子以酒食行凡三每一行易一卓凡果楪酒杯之屬初以銀次金又次以玉其製作竒絶目所未覩三杯即徹賈亦詞出暫至局中然後歸舍見數人立于門云太傅致意適來大監坐間受用一分器皿及雙鬟悉令持納計其直踰數萬緡賈繇此雄豪至今以冨聞湘百五五中諲逵之孫也賈虞仲云宣和庚子蔡元長當軸外祖曾空靑守山陽時方臘據二浙甚熾初元長怨陳瑩中以陳嘗上書詆文肅編置郡中欲外祖甘心焉既至外祖極力照矚之適瑩中告病外祖即令醫者朝夕診視具疾之進退與夫所俱藥餌申官巳而不起亦令作佛事僧衆下至凶肆之徒悉入狀用印係案僚吏以為何至是外祖曰數日之後當知之巳而朝廷遣淮南轉運使陸長民體究云盜賊方作未審陳􅗕之死虛實外祖即以案牘繳奏以聞人始服先見百五六之明中父舅劉斯立跋忠肅同老之子克家能文自號學易老人有集行於丗政和中以忠肅在黨籍屏居東平杜門却掃息交絶遊人罕識其靣有戚里子王宣贊者來為州鈐轄家饒財多聲妓重義好客廨舍適同里巷聞斯立之賢有願交之意託人寄聲欲致一飯之欵斯立從之且併招斯立所厚善者預席從郡中假侑觴之人極其歡洽有李延年者嘗坐法失官亦居是邦願厠其間王君距之延年大不平適往京師理雪時王黼為中司延年與之有舊因往謁之黼問東平近有何事延年即以王君開燕為言黼又詢席間有何説延年云廣坐中及宫闈二月九日之事客退黼遣吏以𥿄授延年令筆其語延年出於不虞宛轉其詞黼見之怒云當先送大理寺延年皇恐迎合以遷就之且引坐客李禔為證黼即以上聞詔付廷尉鞫治遣吏捕斯立于鄆方以忠肅諱日飯僧佛寺就齋所禽赴天獄煆錬訊掠極其苦楚惟褆抵讕不承方欲移理間斯立之猶子長言聞斯立之困辱年少氣鋭遂自陳言從巳出獄具長言真刑竄海島斯立編管壽春府席間主賔既皆坐罪下至奔走執事倡優侍姬悉皆決杖延年詔復元官此亦一客不得食而然然比之奏邸獄冤則尤為酷焉禔清臣子百五七斯立王定國壻也趙子通及忠肅孫董云王倫字正道三槐王氏之裔祖端父毅俱以材顯母眺氏昭德族女家貧無行不能治生為啇賈好椎牛酤酒往來京洛放意自恣浮沉俗間亦以俠自任賙人之急數犯法幸免聞士大夫之賢者傾心事之先人在京師正道間亦欵門先人以其倜儻待頗加禮一日從先人乞詩送行云天下將亂欲入廬山為道士宣和末先人去國不復相聞正道少與孫仲益有布衣舊仲益官中都每周旋之靖康末李士美罷相就弟正道忽直造拜於堂下士美問其所以自言願隨相公一至禁中有欲白于上士美曰方退間薦士非所預也正道自此日掃其門會有旨令前宰執赴殿廷議事正道又拜而懇曰此倫效鳴之時也士美不得巳因携之而入倫自陳於殿下曰臣真宗故相王旦之孫也有致君澤民之術無路而不得進宣和中嘗上書言大遼不可滅女真不可盟果如臣言今圍城既急它無計䇿臣謹當募死士數萬願陛下侍上皇挾諸王奪萬勝門決圍南幸欽宗忠之慰勞甚厚解所佩夏國寶劒以賜且以片𥿄批曰王倫事成日可除尚書兵部侍郎倫既拜賜翌日再對自言巳得豪俠萬餘悉願效死幸陛下勿疑即行時宰相何文縝巳主和議正道怒髮上衝冠文縝斥曰若何人敢至此耶正道曰尓何人乃至此耶又曰萬一天子蒙塵雖誅相公數百輩何益文縝怒以謂狂生言既不用恐為亂請上誅之且乞就令衛士執之上意未決正道懼無以自脫時仲益在禁中因求計仲益仲益曰昨日所拜小戎文字在否正道腰間取御批以示之仲益曰得此足矣子但立於從班中誰敢呵子豈有無故就殿上擒一侍郎之理乎倫從其言入厠侍臣之列人果不敢前翌日文縝始畫旨送御史府倫巳得間出都矣二聖北去髙宗即位於宋倫走行在所上書自伸前志乞使沙漠問二聖起居自布衣拜五品借侍從以往制詞略云胄出公侯資兼智勇朕方俯同晉國命魏絳以和戎汝其逺慕侯生御太公而歸漢經年始還不用久之徽宗凶問至起拜龍圖閣學士為梓宫奉迎使浸登二府凡三四往返竟留虜中倫雖無大過人然膽大敢為既貴之後凡往日故舊與夫屠販之友悉以自隨而任以官既拘于虜虜人欲用為留守不從而殺之褒恤甚厚李平仲孫百五八長文玄言如此先人為之作御劒銘今載家集中靖康中東坡先生追復元職時汪彥章在掖垣偶不當制舍人不學而思澀彥章戲曰公無草草渠家焚黃三字漸而怨之又一日當草一制將畢矣偶思結尾不來省中來催促不容緩愈牽窘搜思甚久院吏倉猝啓曰弟云服我休命往其欽哉可矣百五九舍人然而用之宣和中有鄭良者本茶啇交結閽寺以進至袐閣修撰廣南轉運使恃恩自恣部內有巨室蓄一瑪瑙盆每盛水則有二魚躍其中良聞之厚酬其價不售乃為一畨舶會訥者所得良遣人經營云巳進御矣𥘉未嘗也良即奏以謂訥厚藏寶貨服用僣擬乘輿得旨令究實良即以兵圍其家捕其妻孥械繫而搜索之訥之弟誼方醉卧𥘉不知其繇仗劒而出遂至紛敵良即以誼拒命殺人聞奏奏下誼伏誅訥配沙門島靖康𥘉元訥以赦得自便至京師知時事之變擊鼓訟冤𥘉蔡攸竄海外繼遣監察御史陳述明作追路誅之述度嶺而攸授首就以述為廣漕代良併往鞫治之述入境良往迓之就坐擒下枷訊施以慘酷良即承罪錮押往英州聽勑勑未下而良死旅殯僧寺述復姦利不法為人所訟制勘得情詔述除名英州編管至郡寓僧舍縱步廊間覩良旅襯在焉驚悸得疾而卒攢室相並至今猶在貪暴吞噬何異酷吏之百六十索鐵籠耶趙子通濬云江子我端友知經明道馳譽中外後盡棄舊業鰥居孑然年亦遲暮惟留心內典苦身自約不復有丗間之意結廬都城之外惟先人時時過之每㫪容畢景也乙巳歲春與之俱至相藍訪卜肆子我云吾既無功名之心何所問也先人強之瞽者布八字畢曰官人來年狀元及第矣子我顧先人云術者之妄有如此者相豫一笑而去次年值欽宗登極下詔搜訪遺逸吳元中作上台以子我名聞賜對便殿有言動聽自布衣拜承事郎尚書百六一兵部貟外郎可謂竒中矣子我休復孫也朱新仲少仕江寧在王彥昭幕中有代彥昭春日留客致語云寒食止數日間才晴又雨牡丹蓋十數種欲拆又芳皆魯公帖與牡丹譜中全語也彥昭好令人歌柳三變樂府新聲又嘗作樂語曰正好歡娛歌葉樹數聲啼鳥不妨沉醉拚畫堂一枕春酲又皆桞詞中語蘇過字叔黨東坡先生季子也翰墨文章能丗其家百六二士大夫以小坡目之靖康中得倅真定赴官次河北道遇緑林脅使相從叔黨曰若曹知丗有蘇內翰乎吾即其子肯隨尓輩求活草間邪通夕痛飲百六三翌日視之卒矣惜乎丗不知其此節也趙表之云蘇叔黨以黨禁屏處頴昌極無憀有泗州招信士人李稙元秀者鄉風慕義歲一過之必遲徊以師資焉且致饋餉甚腆叔黨懷之宣和末向伯恭出為淮漕自京師枉道以訪叔黨留連請委叔黨道李之義風而屬其左顧之伯恭入境首令訪問加禮以待未幾金虜南寇髙宗以元帥在河北伯恭即命李賫金帛往訪問行府犒師并上表勸進行數程而與前驅遇巳而飛龍御天輔承務郎百六四繇是遂𬒳眷知後來官職俱至列卿王獻臣云蔡元長既南遷中路有旨取所寵姬慕容邢武者三人以金人指名來索也元長作詩以别云為愛桃花三樹紅年年歲歲惹東風如今去逐它人手誰復尊前念老翁初元長之竄也道中市食飲之類問知蔡氏皆不肯售至於詬罵無所不道州縣吏為驅逐之稍息元長轎中獨歎曰京失人心一至於此至潭州作詞曰八十一年住丗四千里外無家如今流落向天涯夢到瑶池闕下玉殿五回命相彤庭幾度宣麻止因貪此戀榮華便有如今事也後數日卒門人吕川卞老醵錢葬之為作百六五墓志乃曰天寶之末姚宋何罪云馮于容云明清嘗於吕元直丞相家覩髙宗御扎一幅云朕比觀黃庭堅集見稱道其甥徐俯師川者聞其人在靖康中立節可嘉今致仕巳久想不復存可贈左諌議大夫或尚在即以此官召之其後乃知師川避地廣中即落致仕以右奉直大夫試左諌議大夫赴行在所門蔭者以為榮觀師川既至闕入對益契上意賜出身入禁林不旋踵遂登政府初師川仕欽宗為郎二聖北去張邦昌僣位師川獨不拜庭下持其用事之臣大呼號慟卒不自汙挂冠以去故上有立節可嘉之語圍城中嘗置一婢子名之曰昌奴遇朝士來即呼至前驅使之既登宥密頗驕傲自滿朱藏一趙元鎮並居中書師川蔑視之每除一登第者則曰又一經義之士嘗與元鎮論兵視元鎮曰公何足以知此元鎮曰鼎固不足以知之豈若師川之讀父書邪師川大不堪而無以酬之卒不安位而去後終於知信州師川德占禧之子也德占以吉甫薦命官後為給事中計議邊事永洛之敗死之事具國史東坡先生行吉甫謫詞有云力引狂生之謀馴致永洛之􅫚是也德占一子𥙿陵憐之襁褓中輔通直郎後來一向以詩酒自娛放浪江南山川間食祠祿者四十年始調通判吉州平生釐務者三數考宣和末方入朝後來登用甚驟焉既沒而眷寵終不少衰其子瑀嘗出示髙宗所賜御書光武紀後復親批云卿近進言使朕熟看丗祖紀以益中興之治因思讀之十過未若書一編之為愈也先以一卷賜卿雖字扎惡甚無足觀者但欲知朕不廢卿言耳師川沒後十年瑀貧不能家上表繳進此書乞任使託明清為表既干乙覽上為之愴然靣諭執政令即日除瑀官云建炎𥘉髙宗駐蹕維揚虜騎忽至六飛即日南百六六渡百僚竄身楊子江津舟人乘時射利停橈水中每渡一人必須金一兩然後登船是時葉宗諤為將作監逃難至江滸而實不携一錢倣徨無措忽覩婦人于其側美而艷語葉云事有適可者妾亦欲凌江有金叉二隻各重一兩冝濟二人而涉水非女子所習公幸負我以趍葉從之且舉二梭以示篙師肯首令前婦人伏于葉之背而行甫扣船舷失手婦人墜水而沒葉獨得逃生悵然以登南岸葉後以直龍圖閣帥建康其家影堂中設位云楊子江頭無姓名婦人豈鬼神托此以全其命乎許彥周云李釡字元量淮水人家丗業儒其母懷娠誕彌之日百六七晨起庖下釡鳴甚可畏聲絶免身育男其父即名之曰釡既長乃負才名于未第時建中靖國龍飛遂魁天下政和末自省郎出牧真州向伯恭為判官忤漕意對移六合尉伯恭但書舊銜時蔡元長之甥陳求道為通判郡事釡席間戲語云此所謂終不去帝號者也是時語禁正嚴求道告訐于朝興大獄釜坐免官就擢求道守儀真死則死矣終不去帝號事見晉書載記小冦王始之語向仲德云揮麈後録卷之八
