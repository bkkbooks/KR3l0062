front:
  text: 揮麈後録卷之六八八汝隂王明清韓持國既以忠憲任為將作監主簿少年清修不復
  hash: sha256:b4249fd7a315595f758175b12e35cc095f50ac387ae474159fa33524c1548d56
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_011-1a}
body:
  text: 以軒冕為意將四十矣猶未出仕宋元憲欲薦孔寧極􅌈偶觀其詩卷乃得持國所和篇誦之大喜遂捨寧極而薦持國繇是賜第入館嘉祐中與司馬文正吕正獻王荆公號為四友元祐初登政府後坐棄地入黨籍謫居均州遇赦復官以朝議大夫致仕年八十四以卒嘗語其壻王仲弓實曰以昔日受命覃恩上課計以歲月寄祿恰及是官復何憾邪元龍元吉即其後也楊如晦云仁宗朝侍御史王平字保衡候官人章聖時初為八九許州司理參軍里中女乘驢單行盜殺諸田間禠其衣而去驢逸田旁家收繫之吏捕得驢指為殺女子者訊之四旬田旁家認收繫其驢實不殺女子保衡意疑甚以狀白府州將老吏素強了不之聽趣令具獄保衡持益堅老守怒曰掾懦耶保衡曰坐懦而奏不過一免耳與其阿旨以殺無辜又陷公於不義校其輕重孰為愈邪州將因不能奪後數日河南移逃卒至許劾之乃實殺女子者田旁家得活後因衆見州將謝曰微司理嚮幾誤殺平人此與夫錢淡成何異位雖不顯保衡娶曾氏宣靖之妹生三子回字深父冏字于直向字容季俱列兩朝史儒學傳所著書傳于薦紳為多深父子汶字道原詩文尤竒有集先人作序行於丗隂九十德之報有從來矣李邯鄲命諸子名丗人難曉後見孫長文云邯鄲之長子壽朋取三壽作朋之義次子復圭本三復白圭幼子德芻以三德苾芻其指如此冝乎人所不九一解也司馬溫公元豐末來京師都人疊足聚觀即以相公目之馬至於不能行謁時相於私苐市人登樹騎屋窺瞰人或止之曰吾非望而君所願識者司馬相公之風采耳呵叱不退屋瓦為之碎樹枝為之九二折一時得人之心如此朝武于云溫公在相位韓持國為門下侍郎二公舊交相厚溫公避父之諱每呼持國為秉國有武人陳狀省中詞色頗厲持國叱之曰大臣在此不得無禮溫公作皇恐狀曰吾曹叨居重位覆餗是虞詎可以大臣自居邪秉國此言失矣非所望也持國愧歎久九三之於此亦見公之不自矜也李粹伯云王荆公在金陵有僧清曉於鍾山道上見有童子數人持幡幢羽蓋之屬僧問之曰往迎王相公幡上書云中含法姓外習塵氛到寺未久聞荆公薨薛大受叔器云其婦九四翁蔡文饒目覩晏元獻父名固在相位有朝士乃固始人往謁元獻問其鄉里朝士曰本貫固縣元獻怒曰豈有人而諱始字乎蓋其始欲避之生獰誤以應也前人亦嘗記之又元厚之作參知政事日有下狀陳乞恩例者啓曰為部中不肯依元降旨揮厚之亦怒曰九五止為汝不依元降旨揮耳粹伯云治平中有時君卿者鄭州人與王才叔廣淵為中表遊學郡庠坐法𬒳笞以善筆札去為頴邸書史𥙿陵以其有士風每與之言時王荆公賢譽翕然君卿數稱道于上前宸心繇是注意踐祚之後驟加信任然𥘉非荆公結之而才叔是時亦光顯矣君卿後至正任團練使卒于元祐間哲宗實録有傳存焉其子希孟以醫學及第南渡後康志升允之帥浙西辟為機幕明受之變樓上乃有從逆之言為章冝叟誼斥退者復辟之𥘉流于嶺外冝九六叟繇此大用蔡持正之父黃裳任陳州録事參軍年逾七十陳恭公自元台出為郡守見其老不任職揮之令去黃裳猶豫間恭公云倘不自列當具奏牘竄斥黃裳即上挂冠之請以太子右贊善大夫致仕今之通直郎也卜居于陳力教二子持正與碩苦貧困饘粥不繼久之持正登第黃裳臨終戒以必報陳氏其後持正登政路恭公之子丗儒以羣婢殺其所生坐獄而丗儒知而不發持正請并坐神宗云執中止一子留以存祭祀如何持正云五刑之贖三千其罪莫大於不孝其可赦邪竟置極典丗儒子後以娶宗女輔武官或云大將陳思恭即其孫九七思恭子龜年嘗為東宫春坊孫長丈云熙寧中王和父尹開封忽內降付下文字一紙云武德卒獲之于宫墻上陳首有欲謀亂者姓名凡數十人和父令密究其徒皆無蹤迹獨有一薛六郎者居甜水巷以典庫為業和父令以禮呼來至廷下問之云汝平日與何人為冤薛云老矣未嘗妄出門𥘉無仇怨再三詢之云有族妹之子淪落在外旬日前忽來見投貸貣不從怒罵而去𥘉亦無他和父云即此是也令釋薛而追其甥方在瓦市觀傀儡戲才十八九矣捕吏以手從後拽其衣帶回頭失聲曰豈非那事踈脫邪既至不訊而服和父曰小鬼頭沒三思至此何必窮治杖而遣之一九八府歎伏劉季髙云汪輔之宣州人少年有俊聲皇祐中覔舉開封以周以宗強為賦題場中大得意既出宣言于衆必為解魁偶與數客飲于都城所謂壽州王氏酒樓聞鄰閣有吳音士人亦同埸試者誦其所作輔之方舉酒失措墜杯即就約共坐詢其姓氏乃云湖州進士沈𥘉也輔之云適聞公程文必奪我首薦然我亦須作第二人後數日榜出果然是汪輔之登第熙寧中為職方郎中廣南轉運使蔡持正為御史知雜托其謝上表有清時有味白首無能以謂言涉譏訕坐降知虔州以卒有文集三十卷行於丗後數年興東坡之獄蓋始於此而持正竟以詩九九譴死嶺外韓德全云元豐中先祖訪滕章敏公元發於池陽時楊元素過郡二公同年生𣢾留甚􅌚一日元素忽問公曰令弟賊漢在否先祖坐間甚訝其語伺小間因啓公公曰熙寧𥘉甫與元素俱受主上柬知非常並居臺諌偶同上殿陳于上曰曽公亮久在相位有妨賢路上曰然卿等何故都未有文字來明日相約再對草疏巳畢舍弟申見之夜馳密以告曽暨至榻前未出奏牘上怒曰豈非欲言某人耶其中事悉先來辨析文字見留此卿等為朕耳目之官不慎密乃爾言遂不行吾二人繇此失眷元素所以深恨之東坡先生作滕公挽詩云先帝知公早虛懷第一人謂受𥙿陵眷簡最先也又云髙平風烈在威敏典刑存滕蓋范文正之外孫而授兵法于孫元規滕公奮身寒苦兄弟三人誓不異居而有象傲之弟即申焉恃其愛無所不至公一切置之元祐中公自髙陽易鎮維揚道卒喪次國門先祖自陳留來會哭朝士皆集舟次秦少遊時在館中少遊辱公之知最早吊畢來見先祖于舟因為少遊言其弟凌諸孤狀少遊不平䇿馬而去翌日方欲解維開封府遣人尋滕光祿舟甚急乃御史中丞蘇轍劄子言元發昔事先帝早蒙知遇有弟申從來無行今元發既死或恐從此凌暴諸孤不得安居緣元發出自孤貧兄弟別無合分財産欲乞特降旨揮在京及沿路至蘇州巳來官司不得申干預家事及奏薦恩澤仍常覺察奉聖旨令開封府備坐榜舟次詢之乃少遊昨日徑往見子由為言其事所以然耳昔人篤於風一百誼乃爾今蘇黃門章疏中備載其劄子先祖從滕章敏莫府踰十年每語先祖曰公不但僕之交遊實師友焉平日代公表啓丗多傳誦今載東坡公文集中者實先祖之文也章敏死先祖為作行狀東坡公取以為銘詩其序中易去舊語裁十數字而巳章敏𥘉名甫字元發元祐𥘉以避髙百一魯王諱以字為名曾密公諱易占字不疑歐陽文忠識其碑曰少有大志知名江南為文忠所稱如此則其人固可想矣既以豪俠自任信州玉山令有過客楊南仲文采可喜氣槩頗相投公厚贐其行會與郡將錢仙芝不叶捃托公以客所受為賄公引伏受垢不復自辨竟除名徙英州以赦自便將訴其事於朝行次南都而卒時公子南豐先生子固巳名重於丗適留京師而杜祁公以故相居宋自來逆旅為辨後事公既不偶以卒再娶朱夫人年未三十無以自存領諸孤歸里中南豐昆弟六人久益漻落與長弟曅應舉每不利於春官里人有不相恱者為詩以嘲之曰三年一度舉埸開落殺曾家兩秀才有似簷間雙燕子一雙飛去一雙來南豐不以介意力教諸弟不怠嘉祐𥘉與長弟及次弟牟文肅公妹壻王補之無咎王彥深幾一門六人俱列鄉薦既將入都赴省試子壻拜别朱夫人於堂下夫人歎曰是中得一人登名吾無憾矣榜出唱第皆在上列無有遺者楚俗遇元夕第三夜多以更闌時微行聽人語言以卜一歲之通塞子固兄弟𬒳薦時有鄉士黃其姓者亦預同升黃靣有瘢俚人呼為黃痘子諸曾俱往赴省試朱夫人亦以收燈夕往閭巷聽之聞婦人酬酢造醬法云都得都得黃豆子也得巳而捷音至果然入兩榜文昭中弟百二兄弟三人數年之間並躋華貫曾氏繇此遂興公永外祖云張藝叟治平𥘉以英宗諒暗榜赴春試時馮當丗主文柄以公生眀為賦題藝叟誤疊壓明字試罷自分黜矣及榜出乃居第四藝叟每竊自念省埸中鹵莽乃尓然未嘗輒以語人也當丗後不相聞至元祐中藝叟以祕書監使契丹當丗留守北門經由始修門生之敬置酒甚歡酒半當丗謂藝叟曰京頃作知舉時祕監賦中重疊用韻以論䇿甚佳因自為改去擢置優等尚記憶否藝叟方飲不覺柸覆懷中於是再三愧謝而去前輩成人之美有如此者然得人材如藝叟者雖重疊用韻亦何百三愧哉朱希真先生云曾文肅為相王明清祖王兵部作郎一日文肅曰主上令薦臺諫當以公應詔先祖辭曰某辱知非常一旦使居言路儻廟堂有所不當言之則有負恩地不言則實辜任使願受始終之賜幸甚文肅歎息而寢其議故外祖祭先祖文曰昔我先公知公最久引公諫垣公辝不就進退之際益堅素百四守謂此也曾文肅元符末以定䇿功爰立作相一意信任建言改元建中靖國收召元祐諸賢而用之首逐二蔡而元長先巳交結中禁膠固久矣雖云去國而眷柬方濃自是屢欲召用而文肅輒尼之一日徽宗忽顧首相韓文定云北方帥藩有闕人處否文定對以大名府未除人少刻批出蔡京除端明殿學士知大名府仍過闕朝見文肅在朝堂一覽愕然忽字呼文定云師朴可謂鬼劈口矣翌日白上以為不可上乾笑曰朕嘗夢見蔡京作宰相卿焉能遏邪數日後臺諫王能甫吳材希旨攻文肅上為罷二人文肅自恃以安然元長來意甚鋭如蔡澤之欲代范睢也甫次國門除尚書右丞踰月之後文肅擬陳祐甫守南都元長以謂祐甫文肅姻家訐之于上前因遂忿爭次日入都堂方下馬則一頂帽之卒喏于庭云錢殿院有狀申啓視之乃殿中侍御史錢遹論文肅章疏副本文肅即上馬徑出城外觀音院蓋承平時執政丐外待罪之地也是晚鎖院宣翰林學士郭知章草免文肅相制知章啓上未審詞意褒貶如何上云當用美詞以全體貌詰旦告廷以觀文殿學士知潤州尋即元長為相時崇寧元年六月也陛辭之際尉藉甚渥云秋晚相見抵潤未久而詔獄興矣百五臺諫納副本始於此竑父舅云錢穆父與蔡元度俱在禁林二公雅相好元祐末穆父先坐命詞以本官知池州元度送之郊外促膝劇談戀戀不忍捨忽羣吏來謁元度云巳降旨內翰除右丞中使將來宣押矣穆父起慶之元度喜甚卒然而應曰卞也何人不謂禮絶之敬生於坐百六上雖穆父亦為色動蔡子因云范德孺帥慶州日忽夏人入寇圍城甚急郡人惶駭未知為計疇諸將士無有以應敵其鋒者麾下有老指揮使獨來前曰願勒軍令狀保無它范信之巳而師果退去德孺大喜厚賜以賞之且詢其逆料之䇿老卒曰實無它術吾但大言以安衆耳儻百七城破各自逃竄何暇更尋一老兵行軍法邪朝武子云趙正夫丞相元祐中與黃太史魯直俱在館閣魯直以其魯人意常輕之每庖吏來問食次正夫必曰來日喫蒸餅一日聚飯行令魯直云欲五字從首至尾各一字復合成一字正夫沈吟久之曰禾女委鬼魏魯直應聲曰來力勑正整叶正夫之音闔坐大笑正夫又嘗曰鄉中最重潤筆每一志文成則太平車中載以贈之魯直曰想俱是蘿蔔與瓜虀爾正夫銜之切骨其後排擠不遺餘力卒致冝百八州之貶一時戲劇貽禍如此可不戒哉陸務觀云林仲平槩仁宗朝耆儒也二子希旦邵顔早擅克家之業仲平沒有二幼子尚在襁褓未名既長兩兄乃析其名示不忘父訓曰希曰旦曰邵曰顔後皆百九為聞人衣冠指為名族陳齊之云范景仁嘗為司馬文正作墓志其中有曰在昔熙寧陽九數終謂天不足畏謂民不足從謂祖宗不足法乃裒頑鞠凶託東坡先生書之公曰二丈之文軾不當辭但恐一寫之後三家俱受禍耳卒不為之書東坡可謂先見明矣當時刋之紹聖之間百十治黨求疵其罪可勝道哉陸務觀云歐陽觀本廬陵人家丗冠冕一祖兄弟自江南至今凡擢進士第者六七人觀少有辝學應數舉屢階魁薦咸平三年登第授道州軍州推官考滿以前官遷于泗州當淮汴之口天下舟航漕運鱗萃之所因運使至觀傲睨不即見郡守設食召之不赴因為所彈奏殆于職務遂移西渠州逮成資而卒于任所觀有目疾不能逺視苟矚讀行句去牘不逺寸其為人義行頗腆先出其婦有子隨母所育及登科其子詣之待以庶人常致之于外寒燠之服每苦于單弊而親信僕隸至死曾不得侍宴語然其骨殖卒賴其子而收葬焉右龍衮字君章所著江南野録載歐陽觀傳觀乃文忠父文忠自識其父墓云太僕府君長子諱觀字仲賔咸平三年進士及第以文行稱於鄉里少孤事母至孝丁潘原太君憂時尚貧其後終身非賔客食不重肉歲時祭祀涕泗嗚咽至老猶如平生喜待士戒家人俸勿留餘而居官以廉恕為本官至泰州軍州判官卒年五十九大中祥符三年三月二十四日終于官葬吉水縣沙溪保之瀧岡纍贈兵部郎中夫人彭城郡太君鄭氏年二十九而公卒居貧子幼守節自誓家無𥿄筆以荻畫地教其子修學書卒年七十二皇祐四年三月十七日卒子南京留守廨舍祔葬瀧岡墓志起居舍人知制誥吕臻撰工部郎中知制誥王洙篆蓋大理平事陸經書石有子曰早卒曰修觀文忠所述則觀𥘉無出婦之玷文忠又敘其考妣之賢如此衮螺江人與文忠為鄉曲豈非平時有宿憾與夫祈望不至云爾信夫毀譽不可深信不獨碧雲騢二書而巳不可不為之辨文忠公親筆今藏其孫百十一伋家明清親見之元豐中太原府推官郭時亮首教授余行之有文字結連外界神宗語宰相王岐公曰小人妄作固不足慮行之士人為此恐有謀非便時陸農師為學官𡵨公素不相知欲乘此擠之奏曰學官陸佃與之厚善乞召問之翌日上令以他事召直講陸佃對事未宣也上徐問曰卿識余行之否佃曰臣與之有故𥘉亦甚厚臣昨歸鄉里越州行之來作山隂尉携其妻而捨其母臣以此少之自是往來甚踈上曰儻如此不足以成事矣然農師由此遂受知神宗不次拔擢乃知窮逹有命雖當國者不能巧抑其進焉行之既腰斬時亮改京秩辭不受時人有詩云行之三截斷時亮一生休百十二行之靖之族孫也陸務觀云李端叔之儀趙郡人以才學聞於丗弟之純亦以政事顯名為中司八座終以老龍帥成都兄弟頡頑于元祐間端叔於尺牘尤工東坡先生稱之以為得發遣三昧東坡帥定武辟為簽判以從朝夕酬唱賔主甚歡建中靖國初為樞密院編修官曾文肅薦于祐陵擬賜出身擢右史成命未頒而為御史錢遹論列報罷去國之後暫泊頴昌值范忠宣公疾篤口授其指令作遺表上讀之悲愴之餘稱賞不巳欲召用之而蔡元長入相時事大變祐陵裂去御書丗濟忠直之碑及降旨御書院書碑旨揮更不施行且興獄治遺表中語端叔坐除名編管太平州會赦復官因卜居當塗奉祠著書不復出仕適郭功父祥正亦寓郡下文人相輕遂成仇敵郡娼楊姝者色藝見稱于黃山谷詩詞中端叔喪偶無嗣老益無憀因遂畜楊于家巳而生子遇郊禋受延賞會蔡元長再相功父知元長之惡端叔也乃訹豪民吉生者訟于朝謂冒以其子受蔭置鞫受誣又坐削籍亦略見徽宗實録楊姝者亦𬒳決功父作俚語以快之云七十餘歲老朝郎曾向元祐説文章如今白首歸田後却與楊姝洗杖瘡其不樂可知也初端叔嘗為郡人羅朝議作墓志首云姑熟之溪其流有二一淸而一濯清者謂羅公也蓋指濯者為功父功父益以怨深刺骨焉久之其甥林彥振攄執政門人吳可思道用事于時相子訟其冤方獲昭雪盡還其官與子端叔終朝議大夫年八十而卒代忠宣之表今載于此生則有涯難逃定數死之將至願畢餘忠輒將垂盡之期仰瀆蓋髙之聽臣中謝伏念臣賦性拙直稟生艱危忠義雖得之家傳利害率同於人欲未始苟作以干譽不敢患失以營私蓋常先天下而憂期不負聖人之學此先臣所以教子而微臣資以事君粵自治平擢為御史繼逢神考進列諫垣荏苒五十二年首尾四十六任分符擁節持橐守邊晚叨宥密之司再席鈞衡之任遇事輒發更不顧身因時有為止欲及物故知盈滿之當戒弗思禍釁之隂乘万里風濤僅脫江魚之葬四年瘴癘幾從山鬼之遊忽遭睿聖之臨朝首圖纎介之舊物復官易地遣使宣恩而臣目巳不明無復仰瞻於舜日身猶可勉或能親奉堯言豈事理之能諧兾神明之見嗇未復九重之入覲卒然四體之不隨空慙田畒之還上負乾坤之造猶且強親藥石貪戀歲時儻粗釋於沉迷或稍紓於報效今則膏盲巳逼氣息僅存泉路非遙聖時永隔恐叩閽之靡及雖結草以何為是以假漏偷生刳心瀝懇庶皇慈之俯覽亮愚意之無他臣若不言死有餘恨伏望皇帝陛下仁心寡欲約巳便民逹孝道於精微擴仁心於廣逺深絶朋黨之論詳察邪正之歸搜抉幽隱以盡人材屏斥竒巧以厚風俗愛惜生靈而無輕議邊事包容狂直而無遽逐言官若宣仁之誣謗未明致保祐之憂勤不顯本權臣務快其私忿非泰陵實謂之當然以至未究流人之往愆悉以聖恩而特敘尚使存殁猶汙瑕疵又復未解疆埸之嚴幾空帑藏之積有城必守得地難耕凡此數端願留聖念無令後患常軫淵衷臣所重者陛下上聖之資臣所愛者宗社無疆之業苟斯言之可采則雖死而猶生淚盡詞窮形留神逝紹興中趙元鎮作相提舉重修太陵實録書成加恩吕居仁在玉堂取其中一對云惟宣仁之誣謗未明致哲廟之隂靈不顯于麻制中時人以為用語親切不以蹈襲為非也端叔自號姑溪老農文有集六十卷與先人往還者為多今尚有其親筆藏于家楊生之子名堯光墜其家風止于選調家今猶在宛陵姑熟之間村落中明清前年在宣幕亦嘗令訪問則狼狽之甚至有不可言者蓋繇端叔正始百十三之失使人惋歎王稱東都事略云端叔姑熟人非也姚舜明庭輝知杭州有老姥自言故娼也及事東坡先生云公春時每遇休暇必約客湖上早食于山水佳處飯畢每客一舟令隊長一人各領數妓任其所適晡後鳴鑼以集之復會望湖樓或竹閣之類極歡而罷至一二鼓夜市猶未散列燭以歸城中士女雲集夾道以觀千騎之還實一時之勝事也姚令云昭靈侯南陽張公諱路斯隋之𥘉家頴上縣百社村百一四年十六中明經第唐景龍中為宣城令以才能稱夫人石氏生九子自宣城罷歸常釣于焦氏臺之隂一日顧見釣處有宫室樓殿遂入居之自是夜出旦歸歸輒體寒而濕夫人驚問之公曰我龍也蓼人鄭祥逺者亦龍也與我爭此居明日當戰使九子助我領有絳綃者我也青綃者鄭也明日九子以弓矢射青綃者中之怒而去公亦逐之所過為溪谷以逹于淮而青綃者投于合淝之西山以死為龍穴山九子皆化為龍而石氏葬關洲公之兄為馬步使者子孫散居頴上其墓皆存焉事見于唐布衣趙耕之文而傳于淮頴間父老之口載于歐陽文忠之集古録云以上東坡先生所撰頴州昭靈侯廣碑米元章作辨名志刻于後云豈有人而名路斯者乎蓋蘇翰林慿舊碑公名路當是句斷斯頴上人也唐人文贅多如此米刻略云爾明清比仕寧國因民訟度地四至有宣城令張路斯祠堂基者坡碑言侯嘗任宣城令則知名路斯無疑元章辨之誤矣眀清向入壽春幕嘗以職事走沿淮有昭靈行祠而六安縣有鄭公山山下有百一五龍穴今涸矣乃與公所戰者鄭祥逺也因併記之曾文肅自髙陽帥易青社道出相臺馮文簡作守相見云本郡有一寄居王大卿名尚恭年髙不出仕有鄉曲之譽願一見公露少懇𣢾使其自言相豫共飯可乎文肅頷之翌日㑭之同坐即之甚溫請間云某有一子頗知宦學趣向不幸早死啓手足際自云初任荆南椽曹秩滿賃舟泛江而下偶與一婺婦共載因而野合有娠既抵京師分首聞婦人免身得雄後售與曾尚書家作妾今計其子亦十餘歲矣不知果否文肅云某向任三司使日置一獲云本貴種失身自售携一小兒來見俱隨行某以兒子畜之坐上因令呼來大卿公一見抱持大慟云靣貌與亡兒無少異者今願以見豫文肅云雖如此然事不可料聞公今歲當任子願為內舉畢齎輔牒來當遣人送歸王且悲且喜彼此後皆如文約文肅諸子兄弟名連絲字表德上以公字此子取名約字公詳示不忘曾氏而公詳之異母弟亦連名綯字公敏後易敏功公詳仕至郡守終奉直大夫敏功子炎以公詳蔭入仕嘗為樞密使婺婦在文肅家生二子至今兩族如一家焉婦亦姓王果名族從弟乃信孺革與其子鼎相繼尹京云外祖手記揮麈後録卷之六
