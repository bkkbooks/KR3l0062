front:
  text: 揮麈後録卷之十一百七六汝隂王明清孫仲益每為人作墓碑得潤筆甚冨所以家益豐有
  hash: sha256:cc5d03c41c3d3efb7197b1fe0edca2cc097c634ba865e54b03a8a77b935ba6ea
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_016-1a}
body:
  text: 為晉陵主簿者父死欲仲益作志銘先遣人逹意于孫云文成縑帛艮粟各當以千濡毫也仲益欣然落筆且溢美之既刻就遂寒前盟以𥿄筆龍涎建茗代其數且作啓以謝之仲益極不堪即以駢驪之詞報之略云米五斗而作傳絹千匹以成碑古或有之今未見也立道旁碣雖無愧詞諛墓中百七七人遂成虛語翟無逸云韓璜叔夏為司諌奉使江外回赴堂白事徐康國為兩浙漕亦以職事入謁中書康國自謂踐掦之久率多傲忽既詣省候于廊廡以待朝退一緑衣少年巳先在焉天尚未辨明康國初不知為叔夏也貌慢之偃然坐胡床雙展兩足于火踏子之上目視雲霄久之始問曰足下前任何處緑衣曰乍脫州縣時方事之殷外方多以獻利害得審察之命因以求任使者康國疑為此等易之曰朝廷多事之際隨材授官乍脫州縣者未易遽干要除有堂吏過與之揖康國且詫于緑衣曰此某中奉也某在此儻非諸公調護亦焉能久安耶語未終丞相下馬遣直省吏致意康國曰適以韓司諌奉使回得旨有所問未及接見吏引緑衣以登回首揖康國而趍康國始知為諌官驚悵恐怖腳蹙踏子翻空灰火滿地皇灼而退是時有流言劉剛據金陵叛剛知之束身星馳詣闕自明適康國翌日再造有黮袍後生武士復在焉康國反前日之轍先揖而問之曰適從何來武士曰來自建康康國遽問曰聞劉剛巳反公來時如何武士作色曰吾即劉剛吾豈反者想公欲反耳康國又慚而去越數日竟為叔夏彈其交結堂吏臣所目覩而罷外舅云百七八傳嵩卿子駿以都司奉使二浙回行在所時王唐翁張全真為參政子駿既至堂中諸公問以部使者郡太守治狀子駿曰浙東提點刑獄王翿殊不職次欲啓知明州張汝舟始悟適犯唐公諱矣思所以避之卒然白明州張守尤無狀頃刻之間二執百七九政姓名俱及之錢德載二范擇善同宣和中登第得江西教官自當塗奉雙親之官其父至上饒而殂寓于道旁之蕭寺中進退倣徨主僧憐之云寺後山半適有一穴不若就葬之不但免般挈之勞而老僧平日留心風水此地朝揖絶勝誠為吉壤擇善從之即其地而殯之其後擇善驟貴登政府乃謀歸袝于其祖兆請朝假以往改卜時老僧尚在力勸不從才徙之後擇善以飛語得罪于秦會之未還闕言者希指攻之云同以遷葬為名謁告于外搔擾州縣遷謫而死趙宣明云百八十季漢老與秦會之賀進維垣啓云推赤心於腹中君既同於光武有大勳於天下相自比於姬公秦答之云君既同於光武仰歸美報上之誠相自比于百八一姬公其敢犯貪天之戒漢老得之皇恐者纍月建炎末范覺民當軸下討論之制論崇觀以來泛濫受賞遷擢與夫入仕之人官曹殽亂冝從鐫汰自此僥幸之徒屏迹不敢出紹興辛酉御史乃言以謂方事之殷從軍之人多有受前日之濫賞者願亟罷此文以安反側詔從之蓋是時秦會之初用事也先是宣和𥘉鄭達夫為相逹夫與會之俱華陽王氏壻會之以其兄楚材梓囑于逹夫會傅墨卿使髙麗逹夫俾楚材以傔從墨卿輔下班祗應泊回即以獻頌直赴殿試祐陵實録亦略載之又王顯道以逹夫壻冒寵位中大夫祕閣修撰且會之夫人同包也金彥行安節為諌官嘗陳其事于會之疏中二人擯迹纍年至是御史希會之之旨以為之地繇此二人俱彼峻用不及一歲皆登從班建炎末先人為樞密院編修官𬒳旨專一纂集百八二祖宗兵制書成進呈髙宗皇帝覽之稱善諭宰臣范覺民宗尹云王某所進兵制甚佳朕連夕觀之為目痛可改官與陛擢差遣賜其書名曰樞庭備撿時秦會之為參知政事素與先人議論不同雖更秩然自此去國矣王鈇字承可會之舅氏王本觀復之子會之心𣣔用之薦于上謂有史才名適與先人偏旁相似上忽問云豈非修兵制者乎會之即應之云是也詔再除樞屬徐獻之琛亦王氏甥與會之為中表而師川之族弟會之知髙宗眷念師川不替一日奏事啓上云徐俯身後伶俜可憐有弟琛能承兄之業願陛下録用之上從其請其後承可獻之皆為二卿百八三會之並緣罔上率皆類此紹興巳未周敦義葵為侍御史梁仲謨汝嘉為户部尚書敦義欲論之甫屬藁而泄其事于仲謨時秦會之秉鈞仲謨致懇欵于會之會之領略之是夕敦義牒閣門明朝有封事求對翌日會之奏事即擬除敦義為左史天意未允敦義方侍引會之下殿即喻閣門云周葵巳得旨除起居郎隔下又明日敦義立螭直前訴之髙宗喻會之云周葵遽易之何也會之云周葵位長言路碌碌無所建明且進退百官臣之職也儻以臣黜陟不公願先去位上云不須如此是日批出周葵與郡遂出守霅川秦含怒未巳思多方誤之未幾易守平江會李仲永椿年為浙漕應辦北使會之喻意仲永使為之所仲永之回即入奏敦義在郡錫燕虜使飲食臭腐致行人有詞講和之𥘉不冝如此敦義落職罷郡謝表云雖宰夫是供各司其職耳然百八四王事有闕是誰之過歟自是投間十五年紹興庚申秋虜人敗約復取河南故地秦會之在相位蹤迹頗危時馮濟川楫為二卿一日相見告之云金人背盟我之去就未可卜如前此元老大臣皆不足慮獨君鄉衮未測淵衷如何公其為我探之翌日濟川求對啓上云金冦長驅犯淮勢須興師如張某者當且以戎機付之髙宗正色曰寧至覆國不用此人濟川亟以告秦秦且喜且感濟川云適觀天意楫必被逐願乞瀘川以為晝繍至晚批出馮楫令與外任遂以楫為待制帥瀘百八五南在任凡十二年張文老云方公美庭實興化人其父宣和中嘗為廣南提學以卒公美後登科至紹興間自省郎為廣東提刑以母憂去官服闋復除是職公美辭以不忍往秦會之不樂降旨趣行公美強勉之官謝上表云三舍教育先臣之遺愛尚存一笑平反慈母之音容百八六未逺讀者哀之巳而竟沒於嶺外蘇少連云馬子約純紹興中為江西漕時梁企道楊祖為帥每強盜勑下貸命必配潮州喻部吏至郊外即投之江中如此者屢矣子約云使其合死則自正刑典以其罪止於流故赦其生猶或自新既斷之後即平人爾倘如此與殺無罪之人何以異乎二公由此不咸後以它事交訴于朝俱罷去𥘉熙寧中子約父處厚默知登州建言乞減放沙門島罪人處厚時未有嗣夢天錫一子當壽八十仕至諌議大夫前人巳記之矣子約隆興𥘉以太中大夫致仕百八七壽八十一而終太中蓋官制前諌議大夫也紹興丁卯歲明清從朱三十五丈希真乞先人文集序引文既成矣出以相示其中有云公受今維垣益公深知倚用而不及明清讀至此啓云竊有疑焉朱丈云敦儒與先丈皆秦會之所不喜此文傳播逹其聞聽無此等語至掇禍明清云歐陽文忠與王深父書云吾徒作事豈為一時當要之後丗百八八為如何也朱丈歎伏除去之近有名家子知邵州時辛永宗為湖南總管駐劄郡下永宗兄弟早侍上有眷秦會之方自虜中來歸與冨季申爭寵指諸辛為黨會之深嫉之及會之登師垣既竄其兄企宗道宗邵守迎合按永宗冒請全俸合計以贓會之得所申大喜下本郡閲實焉永宗實以嘗立軍功許給有御札非偽守先以計取得之以送秦矣秦既當路無從辨白竟凖以盜論流端州盡籍其家以責欠選郡僚之苛酷者使録橐一簪不得與償既及數猶謂所遣官云前赴其家燕集以某器勸酒今乃不見豈隱之百八九邪殘刻有如是者吕稽中紹興壬戍罷三大帥兵柄時韓王丗忠為樞密使語馬帥解潛曰雖云講和虜性難測不若姑留大軍之半于江之北觀其釁公其為我草奏以陳此事解用其指為劄子韓上之巳而付出秦會之語韓云何不素告我而遽為是邪韓覺秦詞色稍異倉卒皇恐即云丗忠不識字此乃解潛為之使某上耳秦大怒翌日貶潛單州團練副使南安軍安置百九十竟死嶺外張子韶云榮茂丗薿為湖北漕置司鄂州有都統司統制官王俊以其舊主帥嶽飛父子不丗狀詣茂丗陳首茂云我職掌漕計它無所預却之俊遂從總領汪叔詹陳其事汪即日上聞奏會之得之藉以興羅織之獄殺嶽父子知茂丗不受理深怨之而髙宗於茂丗有霸府之舊秦屢加害而不從秦死榮竟登從班汪訐嶽之後獄方竟而殂豈非命歟榮次新云舅氏曾宏父生長綺紈而風流醖藉聞于薦紳長於百九一歌詩膾炙人口紹興中守黃州有雙鬟小顰者頗慧黠宏父令誦東坡先生赤壁前後二賦客至代謳人多稱之見于謝景思所敘刋行詞䇿後歸上饒時鄭顧道吕居仁朝恭道俱為寓客日夕往來杯酒流行顧道教其小獲亦為此技宏父顧鄭笑曰此真所謂效顰也後來士大夫家與夫尊爼之間悉轉而為鄭衛之音不獨二賦而巳明清兄弟兒時先妣製道服先人云須異於俗人者乃佳舊見黃太史魯直所服絶勝時在臨安呼匠者教令染之久之始就名之曰山谷褐數十年來則人人百九二斆之幾遍國中矣秦會之為相髙宗忽問陳桷好士人今何在可惜間却當與一差遣會之乃繆以元承為對云今從韓丗忠辟為宣司參議官元承季任適同姓名上笑云非也好士人豈肯從軍耶因此遂召用仲舅云百九三姚宏字令聲越人也父舜明廷暉嘗任户待令聲少有才名吕元直為相薦為刪定官以憂去秦會之當國婁求官不報張如瑩澄與令聲為中表令聲托為扣之秦云廷暉與某靖康末俱位柏臺上書粘罕乞存趙氏拉其連銜持牘去經夕復見歸竟不僉名此老純直非狡獪者聞皆宏之謀也繇是薄其為人如瑩以告令聲令聲曰不然先人當日固書名矣今丗所傳秦所上書與當來者大不同更易其語以掠美名用此誑人以僕嘗見之所以見忌巳而言逹于秦秦大怒思有以害之會令聲更秩調知衢州江山縣適當亢旱有巡檢者自言能以法致雷雨試之果然而邑民訟其以妖術惑衆追赴大理竟死獄中初令聲宣和中在上庠有僧妙應者能知人休咎語令聲云君不得以令終候端午日伍子胥廟中見石榴花開則竒禍至矣令聲初任監杭州稅任三載足迹不敢登吳山將赴江山也自其諸暨所居趍越來訪帥憲既歸出城數里值大風雨亟愒路旁一小廟中見庭下榴花盛開妍甚可愛詢祝史云此伍子胥廟其日乃五月五日令聲慘然登車未幾遂罹其酷弟寬字令威問學詳博注史記行於丗三乘九流無所不通紹興辛巳歲完顔亮舉國冦淮江浙震恐令威云木德所照當必無它故詔書云歲星臨於吳分者是也髙宗幸金陵以其言驗令除郎召對奏事之際得疾仆於榻前徐五丈敦立戲云太史當奏客星犯帝座甚急上念之亟用其弟百九四憲于朝憲無它材能不逮二兄後登政府命也熊叔雅彥詩伯通之孫早有文名紹興𥘉入館權郎秦會之秉釣指為趙元鎮客擯不用者十年慈寧回鑾會之以功升維垣叔雅以啓賀之云大風動地不移存趙之心白刃在前獨奮安劉之略會之大喜起知永州巳而擢漕湖北其後王日嚴曮為少蓬權直禁林會之加恩取其聮入制詞中翌日即除禮部侍郎甲戌歲䇿士于庭有引此以對百九五大問者遂魁天下薛仲藏云外舅方務德有聞見手記近事凡六條今悉録之錢遹為侍御史有長子之喪聞曾文肅失眷亟上彈章既施行然後謁告尋遷中執法吳伯舉天用當制其詞云思蹇蹇以匪躬遂􅈱􅈱而弗子未幾擊吳罷去鄭亨仲云臘寇犯浦江境上遹具衣冠迎拜道左對渠魁痛毀時政以幸苟免寇謂遹受朝廷爵秩之厚如此乃敢首為訕上之言亟命其徒殺之亨仲居浦江目覩其事汪彥章詔旨中作百九六遹傳亦甚詆之李孝廣崇寧間為成都漕以點檢卭州士人費又韋直方私試試卷詞理謗訕龐汝翼課册係元祐學術譏詆元豐政事上聞三人並竄廣南孝廣遷官後紹興庚戌孝廣之子倞屬疾于婺州謂有妖孽招路時中治之時中始不肯言倞託親舊扣問其詳時中云有一費乂者獨不肯但巳且莫知其故尋以告倞倞云若尓某疾不復起矣因自道向來百九七費乂等事實倞以告其父後乂輩俱客死于路政和初方允迪將就廷試前期聞御注老子新頒賜宰執欲得之以備對會允迪與薛肇胡有連亟從問之乃云無有也一日入薛書室試啓書篋忽見之盡能記憶泪廷試果發問毛逹可友得對䇿大喜即欲置魁選而強隱季淵明為參詳官力爭謂其間贊聖德處有一二語病必欲置十名之後逹可尤力辨既而中夜思之時中人絡繹於諸公間万一轉而上聞非徒無益乃議置十二名猶在甲科是時陳彥方以術得幸又令使預占今歲甲科幾人彥云七人而中人輩欲神其説密喻主司僅取此數既而傳嵩卿以上舍薜尚友盛并以執政子皆置甲科卒取十人允迪乃在乙科第四百九八允迪即外舅之仲父也紹興初經從嚴陵邢鈐轄招飯時老璫趙舜輔在焉坐間邢趙相語云頗記吾曹同在延福宫時事否趙唯唯因叩其事邢云一日梁師成談稹坐于延福宫門下二人實從主管西城所李彥者過門下馬致禮于談梁甚恭既去談謂梁早來聞玉音否可畏哉趙問梁何言答云適見李彥於榻前納西城所羡餘三百万緍上顧彥云李彥李彥莫教做弄一火大賊來斫却你頭後怎奈何不數年彥果百九九以橫斂𬒳誅孟富文庾為户部侍郎紹興辛亥之歲邊遽少寧廟堂與一二從官共議以謂不若乘時間隙分遣諸將削平諸路盜賊其方張不易擒者莫如閩之范汝為乃以命韓丗忠而丗忠在諸將雖號勇鋭然病其難制或為州縣之害當選從官中有風力者一人置宣撫使丗忠副之以行而在廷實囏其選衆乃謂孟人物既厖厚且嘗為韓所薦首遷本部尚書遣之又以為韓官巳髙亦非尚書所能令乃欲以為同簽書上意巳定時洪成季擬為禮部尚書吕丞相以孟除與成季參預之命同進上留擬狀值連數日假告而巳甚播初沈必先為侍御史時嘗擊去成季至是沈召還舊列成季亦復為宗伯以吕丞相初拜未欲論也至是聞將大用亟奏成季罷去上意以謂二相初拜薦二執政其一巳先擊去其一萬一又有議之者二相俱不安矣遂亟批出冨文除參知政事蓋適記前日除冨文誤當成季所擬官二相亦恐紛紛不復申前説也然亦議定俟閩中使還即罷之而會逢多事在位二百獨久凡三年然後去國紹興壬戌夏顯仁皇后自虜中南歸詔遣參知政事王慶曾次翁與后弟違淵迓于境上時虜主亦遣其近臣與內侍凡五輩護后行既次燕山虜人憚於暑行后察其意虞有他變稱疾請于虜少須秋涼進發虜許之因稱貸于虜之副使得黃金三百星且約至對境倍息以還后既得金營辦佛事之餘盡以犒從者悉皆歡然途中無間言由此力也既將抵境上虜必欲先得所負然後以后歸我后遣人喻指于韋淵淵詞曰朝廷遣大臣在焉可徴索之遂詢于王初王之行也事之纎粟悉受頥指于秦丞相獨此偶出不料虜人趣金甚急王雖所賫甚厚然心懼秦疑其私相結納歸欲攘其位必貽秦怒堅執不肯償相持界上者凡三日九重初不知曲折但與先報后渡淮之日既愆期張俊為樞密使請備邊憂慮百出人情洶洶謂虜巳背盟中變矣秦適以疾在告朝廷遂為備邊計中外大恐時王以江東轉運副使為奉迎提舉一行事務從王知事急力為王言之不從乃自裒其隨行所有僅及其數以與之虜人喜后即日南度疑懼釋然而王不預也王歸白秦以謂所以然者以未始稟命故不敢專秦以王為畏巳果大喜巳而后泣訴于上王某大臣不顧國家利害如此萬一虜生它計于數日間則使我母子不相見矣上震怒欲暴其罪而誅之初樓照仲輝自樞府以母憂去位終制起帥浙東儲之欲命謝于虜廷至是秦為王營救回護謂冝遣柄臣往謝之於是輟仲輝之行以為報謝使以避上怒逮歸上怒稍霽然終惡之秦喻使辝位遂以職名奉祠巳而引年安居于四明秦終憐之餽問不絶秦之擅國凡居政府者莫不以微過忤其指例以罪行獨王以此情好不替王卒特為開陳贈恤加厚諸子與壻親戚族人添差浙東者又數人以便其私議者謂秦居政府二二百一十年間終始不二者獨見王一人而巳曾文清吉父孔毅父之甥也早從學于毅父文清以蔭入仕大觀初以銓試合格五百人為魁用故事賜進士出身紹興中明清以啓贄見云傳經外氏早侍仲尼之間居提筆文埸曾寵平津之為首文清讀之喜曰可謂著題矣後與明清詩云吾宗擇壻得羲之令子傳家又絶竒甥舅從來多酷似弟兄如此信難為徐敦立覽之笑云此乃用前日之二百二啓為體修報耳孫立者壽春人少為盜敗露竄伏淝河中覺有物隱然抱持而出乃木匣一啓視之銅印一顆云壽州兵馬鈐轄之印印背云太平興國八年鑄後三十年以從軍之勞差充安豐軍鈐轄安豐即昔日壽二百三州也遂用此明清為判官日親見之楊原仲願秦會之腹心為之鷹犬凡與會之異論者驅除殆盡以此致位二府出守宣城王公明與原仲為中表原仲為之經營舉削改官得知蘄水縣往謝原仲𣢾集醉中戲語原仲云昔嘗於吕丞相處得公頃歲所與渠書其間頗及秦之短尚記憶否公明初出無心也原仲聞之色如死灰即索之云偶巳焚之原仲自此疑公明慮其以告秦出入起居跬步略不暫捨夜則多以人隂加防守公明婁求歸而不從深以為苦如此者幾歲原仲移帥建業途中亦如是焉既抵金陵館于玉麟堂後宇諸司大合樂開燕守卒輩往觀優戲稍怠公明忽覩客船纜于隔岸亟與其親僕潔囊喚而登之遁去會散原仲呼之則巳逺矣即遣人四散往訪之二百四邈不可得原仲憂撓成疾而斃蘇訓直云魏道弼良臣與秦會之有鄉曲共學之舊秦既得志引登禁路道弼恃其久要一日啓于秦曰某昨夕不寐偶思量得一事非晚郊祀如遷客之久在遐方者可因赦內徙以召和氣秦曰足下今作何官道弼云備貟吏部侍郎奏復曰且管了銓曹職事不須胡思亂量翌日降旨魏良臣與郡出守二百五池州巳而罷去丗言秦有度量恐未必然也建中靖國初陸農師執政時天下奏案率不貸命農師語時相云罪疑惟輕所以讞上一門引領以望其生今一切從死所傷多矣時相然其言自是有末減者乾道初忽降旨揮云法令禁姦理冝畫一比年以來旁緣出入引例為弊殊失刑政之中應今後犯罪者有司並據情欵直引條法定斷更不奏裁是時外舅方務德為刑部侍郎入議云切詳今來旨揮今後犯罪者有司並據情𣢾直條法定斷更不奏裁切恐其間有情重法輕情輕法重情理可憫刑名疑慮命官犯罪議親貴之類州郡難以一切定斷今來除並不得將例册引用外其有載在勑律條令明言合奏裁事件欲乞並依建隆二年二月五日勑文參詳到事理施行得旨從請二者皆仁人之言其利博哉明清頃焉不自度量嘗以聞見漫緝小帙曰揮麈録輒以鏤板正疑審是于師友之前久矣竊伏自念平昔以來父祖談訓親交話言中心藏之尚餘不少始者乏思慮筆之簡編傳信之際或招怨尤今復惟之侵尋晚景倘棄而不録恐一旦溘先朝露則俱墯渺茫誠為可惜若夫於其中間善有可勸惡有可戒出於無心可也豈在於因噎而廢食朝謁之暇濡毫紀之㧾一百七十條無一事一字無所從來釐為六卷名之曰揮麈後録尚容思索嗣列于左紹熙甲寅上元日汝隂王明清書于武林官舍半山樓古之史官小事書于簡牘所謂廣記備言者在此東漢以後傳記益衆皆以為史筆之資然而詮擇不精疑信相半紬書者病之汝隂王仲言家傳史學三丗矣族黨交遊無非一時名公巨人平日談論皆後學之所未聞者渡江以來簡册散亡老成凋落於是有考焉曩嘗筆其所聞為揮麈録既又續之所記益廣其間雅健之文著述之體誠有所自來也儻使遂一家之言當不愧實録云海陵王禹錫謹書揮麈後録卷之十一
