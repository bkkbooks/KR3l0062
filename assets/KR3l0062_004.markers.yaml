  - {type: variant, offset: 0, length: 5676, content: 揮麈前録卷之四汝隂王明清王絲字敦素越之蕭山人景祐𥘉爲縣令㑹歲歉絲每家支錢一千以濟之期以明年夏輸絹壹匹邑人大受其惠稱爲德政繇此當路薦之蓋是時一縑售價不逾其數爾仕止郎曹典州而巳范文正公爲作墓誌具載其事王荆公當國倣其法施之天下號爲和買乆之本錢旣不復俵且有折帛之害丗誤傳始於王儀仲素儀仲文正公之子早即貴逹未甞爲邑官至八座没謚懿敏國史本傳可考其子鞏字定國與東坡先生游李定字仲求洪州人晏元獻公之甥文亦竒欲預賽神㑹而蘇子美以其任子距之致興大獄梅聖俞謂一客不得食覆鼎傷衆賔者也其孫即商老彭以詩名列江西派中又李定字資深元豐御史中丞其孫方叔正民兄弟皆顯名一時楊州人又李定嘉祐治平以來以風采聞甞遍歷天下諸路計度轉運使官制未行老于正卿乃敦老如岡之祖盖濟南人也同姓名者凡三人丗亦多指而爲一不可不辯李陽翟人東坡先生門下士亦字方叔兩方叔俱以文鳴詩章又多互傳於丗郭稹字仲微仕至龍圗閣學士權知開封府幼孤母邊更嫁王氏旣而母亡稹解官服䘮知禮院宋祁言稹服䘮爲過禮請下有司博議因馮元等奏聽解官申心䘮始此太祖皇帝立極之𥘉西蜀未下益州三泉縣令間道馳騎齎賀表率先至闕下上大喜平蜀後詔令三泉縣不隷州郡遇賀慶許發表章直逹榻前至今甲令毎於諸州軍監下注云三泉縣同是矣元符末龔言序爲縣尉婦弟江端本子之薄遊至邑令簿素與龔不叶相帥遊山經宿未回龔攝縣事忽赦書至徽宗登寳位龔即宣詔稱賀偶未有子亟令子之奉表詣都令歸巳無及銓曹以𥘉品官無奏異姓無服親之文沮之子之早負俊名曾文肅當國爲將上取旨特𥙷河南府助教今之上州文學也後子之官與職俱至正郎一時以爲異事紹興𥘉四川制司建言陞縣爲軍失祖宗之指矣張逸字天隱鄭州人登進士初甞以樞宻直學士知益州蜀人諳其民風華陽縣郷長殺人誣道旁者縣吏受財獄具乃令殺人者守囚逸曰囚色冤守者氣不直豈守者殺人乎囚始敢言而守者果服立誅之蜀人以爲神歳飢民多殺耕牛食之犯者皆配關中逸奏民殺牛以活將廢穡事今歲小稔請一切放還復其業報可凡四守益州逸子峋嵫亦有顯名于丗嵫諸孫即端明殿學士澄也兩朝史章文憲得象傳末云初閩人謡曰南臺沙合出宰相至得象相時沙湧可渉政和六年沙復湧巳而余丞相深大拜十餘年前外舅方公務德帥福唐南臺沙忽再湧巳而朱漢章葉子昂相繼登庸昔人最重契義朋從年長則以兄事之齒少以弟或友呼焉父之交遊敬之爲丈見之必拜執子姪之禮甚恭丈人行者命與其諸郎遊子又有孫各崇輩行略不紊亂如分守之嚴舊例書札止云啓或止稍尊之則再拜雖行髙而位崇者不過曰頓首再拜而巳非父兄不施覆字宰輔以上方曰台候餘不敢也前輩名卿尺牘中可考今俱不然誠可太息太平興國六年五月詔遣供奉官王延德殿前承旨白勲使髙昌雍熈元年四月延德等叙其行程來上云初自夏州歴玉亭鎮次歷黃羊平其地平而産黃羊度砂磧無水行人皆載水凡二日次都囉囉族漢使過者遺以財貨謂之打當次歷茅家喎子族臨黃河以羊皮爲囊吹氣實之浮於水或以囊馳牽木栰而度次歷茅女王子開道族行入六窠砂砂深三尺馬不能行行者皆乗槖駝不育五糓砂中生草名登相收之以食次歷樓子山無居人行砂磧中以日爲占旦則背日暮則向日日下則止又行望月亦如之次歷卧羊梁劾特族地有都督山唐回鶻之地次歷太子大蟲族接契丹界人衣尚錦綿器用金銀馬乳釀酒飲之亦醉次歷屋地目族蓋逹于于越王子之子次至逹于于越王子族此九族逹靼中尤尊者次歷拽利王子族有合羅川唐回鶻公主所居之地城基尚在有湯泉池傳曰契丹舊爲回紇牧羊逹靼舊爲回紇牧牛回紇徙甘州契丹逹靼遂各爭長攻戰次歷阿墩族經馬鬃山望郷嶺嶺上石庵有李陵題字處次歷格囉美源西方百川所㑹極望無際鷗鷺鳬鴈之類甚衆次至托邊城亦名李僕射城城中首領號通天王次歷小石州次歷伊州州將陳氏其先自唐開元二年領州凡數十丗唐時詔勑尚在地有野蠶生苦參上可爲綿帛有羊尾大而不能走尾重者三斤小者一斤肉如熊白而甚美又有勵石剖之得賔鐡謂之喫鐵石又生胡桐樹經雨即生胡桐律次歷益都次歷納職城在大患鬼魅磧之東南望玉門關甚近地無水草載粮以行凡三日至思谷曰避風驛本俗法試出詔押御風御風乃息凡八日至澤田寺髙昌聞使至遣人來迎次歷寳莊又歷六鍾乃至髙昌髙昌即西州也其地南距于闐西南距大石波斯西距西天步露沙雪山葱嶺皆數千里地無雨雪而極熱每盛暑人皆穿池爲穴以處飛鳥羣萃河濵或起飛即爲日氣所爍墜而傷翼屋室覆以白堊開寳二年雨及五寸即廬舎多壞有水岀金嶺導之周繞國城以漑田園作水磑地産五榖惟無喬麥貴人食馬餘食牛及鳬鴈樂多箜篌出貂䑕白㲲綉文花蘃布俗多騎射婦人戴油帽謂之蘇幕遮用開元七年曆以三月九日爲寒食餘二社冬至亦然以銀或鍮爲筒貯水激以相射或以水交潑爲戲謂之壓陽氣去病好遊賞行者必抱樂器佛寺五十餘區皆唐朝所賜額寺中有大藏經唐韻玉篇經音等居民春月多遊羣聚遨樂於其間遊者馬上持弓矢射諸物謂之穰灾有勑書樓藏唐太宗明皇御扎詔勑緘鎻甚謹後有摩尼寺波斯僧各持其法佛經所謂外道者也統有南突厥北突厥大衆熨小衆熨様磨割禄黠戞司末蠻格哆族預龍族之名甚衆國中無貧民絶食者共振之人多壽考率百餘歳絶無夭死時四月獅子王避暑於北廷以其舅阿多于越守國先遣人致意於延德曰我王舅也使者拜我乎延德曰持朝命而來禮不當拜復問曰見王拜乎延德曰禮亦不當拜阿多于越復數日始出相見然其禮頗恭獅子王邀延德至其北庭歷交河州凡六日至金嶺口寳貨所出又兩日至漢家寨又五日上金嶺温嶺即多雨雪上有龍王刻石記云小雪山也嶺上有積雪行人皆服毛罽度嶺一日至北廷憇髙臺寺其王烹羊馬以具饍尤豐㓗地多馬王及王后太子各養馬牧放於平川中彌亘百餘里以毛色分别爲羣莫知其數北廷川長廣數千里鷹鷂鵰鶻之所生多美草下生花砂䑕大如䨲鷙禽捕食之其王遣人來言擇日以見使者願無訝其淹乆至七日見其王及王子侍者皆東向拜受賜旁有持磬者擊以節拜王聞磬聲乃拜旣而王之兒女親屬皆出羅拜以受賜遂張樂飲燕爲優戲至暮明日泛舟於池中池四面作鼓樂又明日遊佛寺曰應運㤗寜之寺正觀十四年造北廷北山中出􅗠砂山中常有煙氣涌起而無雲霧且又光𦦨若炬照見禽䑕皆赤采􅗠砂者著木㡳鞵若皮爲底者即焦下有穴生淸泥出穴外即變爲砂石土人取以治皮城中多樓䑓草木人白晳端正惟工巧善治金銀銅鐵爲器及攻玉善馬直絹一疋其駑馬充食者纔直一丈貧者皆食肉西抵安西即唐之西境七月令延德先還其國其王始至亦聞有契丹使來脣缺以銀葉蔽之謂其王曰聞漢遣使入達靼而道出王境誘王窺邊冝早送至達靼無使乆留因云髙敞本漢土漢使來覘視封域將有異圗王當察之延德偵知其語因謂王曰犬戎素不順中國今乃反間我欲殺之王固勸乃止自六年五月離京師七年四月至髙昌所歷以詔賜諸蕃君長襲衣金帶贈帛八年春與其謝恩使凡百餘人復循舊路而還雍熈元年四月至京師延德初至逹靼之境頗見晉末䧟虜者之子孫咸相率遮迎獻飲食問其郷里親戚意甚悽感留旬日不得去延德之自叙云此雖載于國史而丗莫熟知用書于編以俟通道九夷八蠻將使指者或取諸此焉紹興丙辰明清甫十歲時朱三十五丈希真徐五丈敦立俱爲正字來過先人先人命明清出拜二公詢以國史中數事隨即應之無遺繇是受二公非常之知于弱齡希真之相予多見其詞翰中後二十年明清爲方壻敦立守滁陽以書與外舅云聞近納某字之子爲壻豈非字仲言者乎具道疇昔時事且過相溢美又數年敦立爲貳卿明清偶訪之坐間忽發問曰度今此居號侍郎橋何邪明清即應以仁宗朝郎簡杭州人以工部侍郎致仕居此里人德之遂以名橋又問郎表德謂何明清云兩朝國史本傳字簡之王荆公集中有寄郎簡之詩甚稱其賢少焉司馬季思來其去復問明清云温公兄弟何以不連名明清荅以温公之父天章公生于秋浦故名池從子校理公生于郷中名里天章長子以三月一日生名旦後守宛陵生仲子名宣晚守浮光得温公名光承平時光州學中有温公祠堂存焉敦立大喜曰皆是也且顧坐客云卒然而酬博聞如此可謂俊人矣烏乎敦立今墓木將拱言之於邑郭熈畫山水名盛昭陵時嘗爲翰林院待詔熈寧初其子思登進士第至龍圗閣直學士更帥三路旣貴廣以金帛收贖熈之遺筆以藏於家繇是熈之畫人間絶少思亦多材藝有笑談可用集行於丗元祐中吕微仲當軸其兄大忠自陜漕入朝微仲虚正寑以待之大忠辭以相第非便微仲云界以中霤即私家也卒從微仲之請時安厚卿亦在政府父日華尚康寕且具慶焉厚卿夫婦偃然居東序時人以此別二公之賢否姚寛令威明清先友也著西溪殘語考古今事㝡爲詳備其間一條云舊於㑹稽得一石碑論海潮依附隂陽時刻極有理不知其誰氏復恐遺失故載之觀古今諸家海潮之說多矣或謂天河激湧葛洪潮說亦云地機翕張見洞眞正一經盧肇以日激水而潮生封演云月周天而潮應挺空入漢山湧而濤隨施師謂僧隱之之言析木大梁月行而水大見竇叔蒙濤志源殊派異無所適從索隱探微宜伸確論大中祥符九年冬奉詔按察嶺外甞經合浦郡廉州㳂南溟而東過海康雷州歷陵水化州渉恩平恩州住南海廣州迨由龍川惠州抵潮陽潮州洎出守㑹稽越州移蒞句章明州是以上諸郡皆㳂海濵朝夕觀望潮汐之候者有日矣汐音夕潮退也得以求之刻漏究之消息消息進退十年用心頗有凖的大率元氣嘘吸天隨氣而漲歛𬈑渤往來潮順天而進退者也以日者重陽之母隂生於陽故潮附之於日也月者太隂之精水者隂故潮依之於月也是故隨日而應月依隂而附陽盈於朔望消於朏敷尾切魄於上下弦息於輝朒女六切朔而日見東方故潮有大小焉今起月朔夜半子時潮平於地之子位四刻一十六分半月離於日在地之辰次日移三刻七十二分對月到之位以日臨之次潮必應之過月望復東行潮附日而又西應之至後朔子時四刻一十六分半日月潮水亦俱復㑹於子位於星知潮當附日而右旋以月臨子午潮必平矣月在卯酉汐必盡矣或遲速消息又小異而進退盈虚終不失於時期矣或問曰四海潮平來皆有漸唯浙江濤至則亘如山岳奮如雷霆水岸橫飛雪崖傍射澎騰奔激吁可畏也其可怒之理可得聞乎曰或云夾岸有山南曰龕北曰赭二山相對謂之海門岸狹勢逼湧而爲濤耳若言狹逼則東𬈑自定海縣名屬四明郡吞餘姚奉化二江江以縣爲名一屬㑹稽一隷四明侔之浙江尤甚狹逼潮來不聞濤有聲耳今觀浙江之口起自纂風亭地名屬㑹稽北望嘉興大山屬秀州水闊二百餘里故海商舶船怖於上潬水中沙爲潬徒旱切惟泛餘姚小江易舟而浮運河逹于杭越矣蓋以下有沙潬南北亘乏隔礙洪波蹙遏潮勢夫月離震兊他潮巳生惟浙江水未洎月徑潮巽潮來巳半濁浪推滯後水益來於是溢於沙潬猛怒頓湧聲勢激射故起而爲濤耳非江山淺逼使之然也宜哉令威以該洽聞于時恨不能知其人明淸心謂必機博之人後以眞宗實録考之大中祥符九年以燕肅爲廣東提點刑獄遂取兩朝史燕公傳觀之果嘗自知越州移明州卷末又云甞著海潮論海潮圗並行于丗則知爲燕無疑明清乾道丙戌冬奉親㑹稽居多暇日有親朋來過相與悟言可紀者歸考其實而筆録之隨手盈秩不忍棄去遂名之曰揮麈録非所以爲書也長至日明清識右揮麈録一編汝隂王仲言所作也紹興辛丑逈侍叔父尉剡叔父出仲言昆仲詩詫曰此皆小汝若干歲雪溪先生諸子也逈茫然自失其後得與仲信仲言游雖服其該洽當時未知學問之有味也越二十年逈塵忝末科試吏于淮壖得奉行政事之在民者因讀荀卿子書曰法不貳後王又讀宣王詩曰周道粲然復興於是思熟於本朝典故者以講論學問士夫間訪之未獲也忽仲言出示此書乃平昔之所期不謂近出於朋舊之中喜可知也雖然僕有疑焉仲言冨於春秋冝以壯烈上佐時用何遽留心於著述若僕軰衰老不適用乃可娯意於蕳冊之間耳仲言其懋哉乾道己丑八月左文林郎饒州德興縣丞沙隨程逈可乆跋九悳素聞仲言多識前言往行真好古博雅君子願從下風聽餘論聞所未聞爲有日矣今幸同僚于此謂可破此願也而郡邑相距餘一舎仲言入郭有時不得朝夕見斯心竟未能满間從清流王孟玉借揮麈録觀之殆所謂窺豹一斑者因手抄之古人有云不見異人當得異書今也見其人得其書何喜如焉因誌于後傾囷倒廪尚兾自此無靳也迪功郎髙郵軍教授臨汝郭九悳書李賢良簡垕拜手昨日辱下頋殊恨不𣢾經夕伏惟台候客况萬福宣政從臣出處極爲詳備受賜甚多揮麈録昨晩與老人伏讀共歎該洽如垕輩可知愧矣鄭公之說甚善切幸小留以容乞靈龍山俯就食其禄可也一二同舎郎與凡厚善皆以爲喜老人亦約同白廟堂且喻意京兆來早幸過此共飯巳約叔度欵宏論不宣垕上覆仲言簽判學士契兄王知府自跋丘明子長班范陳壽之書不經它手故議論歸一自唐太宗脩晉書置局設官雖房元齡禇遂良受詔而許敬宗李義府之徒厠迹其間文字交錯約史自此失矣劉煦之唐書薛居正之五代史號爲二氏而職長監脩未始措辭嘉祐重命大儒再新唐史歐陽文忠宋景文各析紀傳故直筆紏繆之書出國朝三朝史爲大典之冠而進呈於天聖垂簾之際名臣大節無所叙録居多或有一事見之數傳褒貶異同自建隆抵于元符信史婁更先人於是七國朝史述焉直欲追倣遷固鋪張揚厲爲無窮之觀雖前日宗工筆削不敢更易但益以遺落損其重複如一姓父子兄弟附于本傳之次増以宗室宰執世系與夫陟黜歳月三表如唐書之制紹興戊午中執法常公聞其事詔奉祠中視史官之秩尚方給扎奏御及半而一秦專柄不盡以所著逹于乙覧獨存副本私室先人弃世野史之禁興告訐之風熾薦紳重足而立明清兄弟居蓬衣白亡所掩匿手澤不復敢留悉化爲煙霧又十五年巨援没而公道開再命㑹稽官以物辦訪遺書于家但記憶殘缺以𥙷冊府之闕而巳故舊文居多此舉蓋自先祖早授學於六一翁之門命意本于六一其後先人承之故先人遷官制云汝好古博雅自其先世属詞比事度越軰流痛哉斯文雖不傳於後代而王言可訓于萬丗也明清弱齡過庭前言往行探㝷舊事􅏯夕剽聆多歷年所憂苦摧挫萬事瓦解不自意全莫能髠鈐以續先志乾道之初竊叢祠之禄偏奉山隂親朋相過抵掌劇談偶及昔聞間有可記隨即考而筆之曰揮麈録故人程逈可乆知名士也覽而大喜手録而識于後繇是流傳又甞取司馬文正公百官公卿表與夫陳龢叔及紹興拜罷録叅考弼臣進退次第年月列爲四圗表置之坐隅以便觀覽今鏤板于閩蜀江浙矣丁酉春覔官行都獲登太史李公仁甫之門命與其子仲信遊㫪容間偶岀二編公一見稱道再三且以宣政名卿出處下詢如黃寔章子厚之甥不麗其舅而卒老于外方軫蔡元長之姻婭引登言路而首論其非遂罹逺竄潘兊朱勔里人不登其門而擯斥李森爲中司不肯觀望王黼窮鄧之綱之獄而𬒳逐燕雲之役蓋成於王寀之枉繇盛章父子欲害劉炳兄弟丗皆亡其事跡明清不量其愚爲冥捜倫類凡二十餘條摭據依本末告之公益喜大加敬歎又云僕兼攝天官覩銓牓有臨安龍山監稅見次君可俯就但食其禄而相與討論徐請君于朝以助我明清力辤以名迹不正且非其人而歸未幾公父子俱去國明清餞别于秀州之杉青閘下舟中相持悵然後數年仲信没于蜀公後雖復召領史局而明清適官逺外參辰一見方欲造公而公巳下丗比焉試邑窮塞公事無多飜篋復見舊藁愴念父祖以來平生用心嗟夫師友之淪没言猶在耳孰令聽之邪投老殘年感歎之餘姑以胸中所存識左方後之攬者亦將太息于斯作淳熈乙巳中元日朝請大夫主管台州崇道觀汝隂王明清書揮麈前録卷之四, WYG: ''}
