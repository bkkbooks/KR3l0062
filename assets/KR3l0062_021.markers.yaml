  - {type: variant, offset: 110, length: 0, content: '', WYG: 於未用事時其後以此遷謫流落無有寧日其人若醒悟狀曰此所以南度後便為參政也盖後誤以為陳去非然不知初又以為何人也李泰發之遷責海外也欲寓書秦丞相以祈内徙而無人可遣門人王彦恭趯罷雷守閒居全州泰發乃作秦書託王為尋端便王鄰之居有李將領者坐岳侯事編置於郡與閭里通情趯令其子司法者從李將就雇一𨽻遣徃㑹稽授書於泰發家既至越泰發子弟不敢以人入都乃就令此介自往相府投之既達於秦忽令問李參政今在何所逺人倉猗􅇜對云李參政見在全州與王知府鄰居盖誤以李將為泰發也且云有王法司與李參政親以書付我令來盖錯愕之際又稱司法為法司也秦怒於是送大理寺根勘行下全州體䆒李光擅離貶所如何輒敢存留在本州且追王趯并王法司赴獄而全州適有法司人吏姓王者亦與彥恭舍甚邇俱就逮後體䆒得泰發初未嘗離昌化但誣彥恭以前任過愆除名勒停編管辰州王法司者懵然不知亦勒認􅂍罪杖脊當時聞者無不笑而憐之汪明遠為荆襄宣諭使金亮遣劉萼領兵號二十萬侵犯襄漢間荆鄂諸軍屢㨗俘掠人多僉軍語我師云我軰皆􅀍敵中僉來離家日父兄告戒云汝見南朝軍馬切勿向前迎敵但只投降他日定放汝歸父兄再有相見之期儻不從誨戒必遭南軍殺戮有聞此語以告明逺者遂與幕僚謀之建議盡根刷俘掠之人借𥙷以官縱遣北歸歡躍而去乾道改}
