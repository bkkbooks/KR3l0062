  - {type: variant, offset: 9, length: 5, content: 乙自漢哀帝, WYG: 千以濟之期以明年夏輸絹壹匹邑人大受其恵稱為徳政繇此當路薦之葢是時一縑售價不逾其數爾仕止郎曹典州而已范文正公為作墓誌具載其事王荆公當國倣其法施之天下號為和買久之本錢既不復俵且有折帛之害世誤𫝊始於王儀仲素儀仲文正公之子早即貴逹未嘗為邑官至八座沒諡懿敏國史本𫝊可考其子鞏字定國與東坡先生游李定字仲求洪州人晏元獻公之甥文亦竒欲預賽神㑹而蘇子美以其任子距之致興大獄梅聖俞謂一客不得食覆鼎傷衆賔者其孫即商老彭以詩名列江西派中又李定字資深元豐御史中丞其孫方叔正民兄弟皆顯名一時揚州人又李定嘉祐治平}
