body:
  text: 榮穆陳守貴榮毅張緼榮安王説端節韓嘉彥僖靖鄭紳恭榮鄭翼之恭簡邢焕安毅郭崇乂忠節髙世則榮懷髙公玘忠定曹誘恭靖韓同卿端靖郭師禹内臣諡忠靖劉有方忠良賈詳忠簡劉瑗僖儉張茂則忠􅉖李舜舉僖敏宋用臣忠敏李憲安恪盧守勤忠憲梁和榮恪郝隨恭僖王中正恭敏裴詵恭節馮世寧勤惠王仲榮節康履大中祥符間章聖祀汾陰至泰山下聚觀者㡬數萬人闐擁道路警蹕不能進上以詢左右或云村民所畏者尉曹也俾彈壓之即命亟召之少焉一緑衣少年躍馬疾馳而前羣氓大呼官人來矣奔走辟易而散上笑云我不是官人邪王嵎季夷云樊若水夜釣采石世多知之宋咸笑談録云李煜有國日樊若水與江氏子共謀江年少而􅃛時李主重佛法即削髮投法眼禪師爲弟子隨逐出入禁苑因遂得幸法眼示寂代其住持建康清涼寺號曰小長老眷渥無間凡國中虛實盡得之先令若水走闕下獻下江南之䇿江爲内應其後李主既俘各命以官江後累典名州家於安陸子孫亦無聞鄭毅夫爲江氏書目記載文集中云舊藏江氏書數百卷缺落不甚完予凡三歸安陸大爲搜訪殘帙墜編往往得之閭巷間無遺矣僅獲五百十卷通舊藏凡千一百卷江氏遺書具此矣江氏名正字元叔江南人太祖時同樊若水獻䇿取李氏仕至比部郎中嘗爲越州刺史越有錢氏時書正借本謄冩遂并其本有之及破江南又得其逸書兼吳越所得殆數萬卷老爲安陸刺史遂家焉盡輦其書築室貯之正既殁子孫不能守悉散落於民間火燔水溺䑕蟲齧棄并奴僕盜去市人裂之以藉物有張氏者所購最多其貧乃用以爲爨凡一篋書爲一炊飯江氏書至此窮矣然余家之所有幸而僅存者蓋自吾祖田曹始畜之至予三世矣於余則固能保有之於其後則非余所知也然物亦有數或存或亡安知異日終不亡哉故記盛衰之迹俾子孫知其所自則庶乎或有能保之者矣書多用油拳紙方册如笏頭青縑爲標字體工拙不一史記晉書或爲行書筆墨尤勁其末用越州觀察使印亦有江氏所題余在杭州命善書者補其缺未具也明清案馬令作南唐書及龍衮作江南野史云北朝聞李後主崇奉釋氏陰𨕖少年有經業口辯者往化之謂之一佛出世號爲小長老朝夕與論六根四諦天堂地獄循環果報又說令廣施梵刹營造塔像身被紅羅銷金三事後主因讓其太奢乃曰陛下不讀華嚴經爭知佛富貴自是襟懷縱恍兵機守禦之謀慌然而弛帑廩漸虛財用且竭又使後主於牛頭山大起蘭若千間聚徒千衆旦暮設齋食無非異方珍􅄿一日食之不盡明旦再具謂之折倒時議謂折倒爲煜之讖及大兵至獲爲營署北朝又俾僧於采石磯下卓庵自云少而草衣木食後主遣使齎供獻以往佯爲不受乃陰作通穴及累石爲塔闊數圍髙迫數丈而夜量水面及王師尅池州而浮梁遂至繫於塔穴以渡南北不差毫釐師徒合圍召小長老議其拒守對曰臣僧當揖退之於是登城大呼而㫖麾兵乃小却後主喜令僧俗兵士誦救苦觀音菩薩滿城沸湧未㡬四面矢石雨下士民傷死者衆後主復使呼之託疾不起及誅皇甫繼勲之後方疑無驗乃鴆而殺之觀宋鄭所記則知李氏國破之際所鴆者非眞又以計免而歸本朝遂饕岳牧之任也三朝史孟昶傳云其在蜀日改元廣政周世宗既取秦鳳昶懼致書世宗自稱大蜀皇帝世宗怒其抗禮不答其書眞迹今藏樓大防所用録於左七月一日大蜀皇帝謹致書於大周皇帝閣下竊念自承先訓恭守舊邦匪敢荒寧於兹二紀頃者晉朝覆滅何建來歸不因背水之戰爭遂有仇池之土地洎審遼君歸北中國且空暫興敝邑之師更復成都之境下闕數字實爲下國之邊陲其後漢主徑自并汾來都汴浚聞征車之未息尋神器之有歸伏審貴朝先皇帝應天順人繼統即位奉玉帛而未克承弓劍之空遺但傷嘉運之難諧適歎新懽之且隔以至前載忽勞睿德逺舉全師土疆㝷隸於大朝將卒亦拘於貴國幸蒙皇帝惠其首領頒以衣裘偏裨盡補其軄員士伍徧加於糧賜則在彼無殊於在此敝都寧比於雄都方懷全活之恩非有放還之望今則指揮使蕭知逺馮從讜等押領將士子弟共計八百九十三人已到當國具審皇帝迥開仁愍深念支離厚給衣裝兼加巾屨給沿程之驛料散逐分之緡錢仍以員僚之迴還安知所報此則皇帝念疆場則已經革㡬代舉干戈則不在盛朝特軫優容曲全情好永懷厚義常貯微衷載念前在鳳州支敵虎旅偶於行陣曾有拘擒其排陣使胡立已下㝷在諸州安排及令軍幕収管自來各支廩食並給衣裝却縁比者不測宸襟未敢放還鄉國今既先蒙開釋已認沖融歸朝雖愧於後時報德未稽於此日其胡立已下今各給鞍馬衣裝錢帛等專差御衣庫使李彥昭部領送至貴境望垂宣㫖収管矧以昶昔在齠齓即離并都亦承皇帝鳳起晉陽龍興汾水合叙鄉闗之分以陳玉帛之懽儻蒙惠以嘉音即佇専馳信使謹因胡立行次聊陳感謝詞莫披述伏惟仁明洞垂鑒念不宣明清嘗跋其後云歐陽文忠公五代史世家序云蜀嶮而富故其典章粲然此書文亦奇尤先生所謂豈非出於世修降表李昊斯言信歟頃歳姚令威注五代史惜乎不見是卷也國朝以來父子兄弟叔姪以名望顯著薦紳間稱之於一時者如二吕正獻端左丞餘慶二竇可𧰼儀望之儼二孫次公何鄰㡬僅二宋元憲庠景文祁二錢子髙彥逺子飛明逸二蘇才翁舜元子美舜欽二吳正肅育正憲充二程明道先生顥伊川先生頤二章莊敏楶申公惇二張橫渠先生載天祺戩二邵安簡亢不疑必二蔡元長京元度卞二鄭德夫久中達夫居中二鄧子能洵仁子常洵武三陳文忠堯叟文惠堯佐康肅堯咨三蘇文安先生洵文忠軾文定轍三沈存中括文通溝睿達遼三王荆公安石平父安國和父安禮三孔經父文仲常甫武仲毅甫平仲三曾南豐先生鞏文肅布文昭肇三韓康肅絳持國維莊敏縝三范蜀公鎮子功百禄淳夫祖禹三劉邍父敞贛父攽仲馮奉世是也太宗實録淳化五年五月李順之平帶御器械張舜卿奏事言臣聞順已遁去諸將所獲非也太宗云平賊纔數日汝何從知之徒欲害人功爾上怒叱出將斬之徐曰前代帝王暴怒殺人正爲此輩然其父戍邊以死遂貰之但罷近軄舜卿父訓爲定逺軍節度使卒於鎮故上念之明清後觀沈存中筆談云蜀中劇賊李順陷劍南兩川闗右震動朝廷以爲憂後王師破賊梟李順収復兩川書功行賞了無間言至景祐中有人告李順尚在廣州巡檢使臣陳文璉捕得之乃眞李順也年已七十餘推驗明白囚赴闕覆按皆實朝廷以平蜀將士功賞已行不欲㬥其事但斬順賞文璉二官仍除閤門祇候文璉家有李順案款本末甚詳順本蜀江王小波之妻弟始王小波反於蜀中不能撫其徒衆乃共推順爲主順初起悉召鄉里富人大姓令具其家所有財粟據其生齒足用之外一切調發大賑貧乏録用材能存撫善良號令嚴明所至一無所犯時兩蜀大饑旬日之間歸之者數萬人所向州縣開門延納傳檄所至無復完壘及敗人常懷之故順得脱去三十餘年乃始就戮如此則當平蜀時逃去無可疑矣信知盜亦有道焉然舜卿非太宗之全宥則刑歸於濫矣頃見王仁裕洛城漫録云張全義爲西京畱守識黃巢於羣僧中而陶榖五代亂紀云巢既遁免祝髮爲浮屠有詩云三十年前草上飛鐵衣著盡著僧衣天津橋上無人問獨倚危欄看落暉又僧史言巢有塔在西京龍門號翠微禪師而世傳巢後住雪竇所謂雪竇禪師即巢也然明州雪竇山有黃巢墓歳時邑官遣人祀之至今而太平廣記載則天時宋之問謫官過杭州遇駱賓王於靈隱寺披緇在大衆中與之問詩有樓觀滄海日門對浙江潮之句唐夷堅集言南嶽寺僧見姚泓五季泛聞録云太祖仕周受命北伐以杜太后而下寄於封禪寺抵陳橋推戴韓通聞亂亟走寺中訪㝷欲加害焉主僧守能者以身蔽之遂免太祖德之即位後極眷寵之年八十餘臨終語其弟子曰吾即澤州明馬兒也馬兒五代之巨冦也贊寧續傳載云開寳末江州圓通寺旦過寮中有客僧將寂滅袒其背以示其徒有彫青李重進三字云我即其人脱身煙焰至於今日而近日陸務觀清尊録言老内侍見林靈素於蜀道季次仲季自云嘗遇姚平仲於廬山授其人段錦之術未知果否要是桀􅃛之徒多能逃命於一時皆此𩔖文璉洪進之子也眞宗實録召試神童蔡伯俙授官之後寂無所傳明清因於故書中得其奏狀一紙今録於此司農少卿管勾江州太平觀蔡伯俙奏臣輒陳愚懇仰凟睿聰退省􅄽尤甘俟竄殛臣見係知州資任乞管勾宫觀奉敕授前件差遣於舒州居住自熙寧八年八月三日到任伏念臣先於大中祥符八年眞宗皇帝遣内臣毛昌達宣召賜對試誦眞宗皇帝御製歌詩即日蒙恩釋褐授守祕書省正字臣遭遇之年方始三歳及賜臣御詩云七閩山水多才俊三歳奇童出盛時終篇後批閏六月十五日敕賜見刋刻在本家収祕續蒙宣赴東宫侍仁宗皇帝讀書朝夕親近頗歴歳年以臣父龜從進士及第臣幼小難以住京因乞將帶出外又蒙恩賚優渥其後臣年一十七歳以家貧陳乞差遣仁宗皇帝聖念矜憐特依所乞仍有㫖餘人不得援例自兹累歴任使今來本任至來年二月當滿切念臣幼稚幸會效官從事勉勵愚拙今已白首重念臣生事蕭條累族重大又無得力兒男可以供侍一日捨禄無以爲生幸遇皇帝陛下至仁至治無一物失所其於老者惠䘏尤深臣於祥符八年三歳甲子庚申節未至衰老欲望聖慈特賜許臣再任管勾江州太平觀一任覬仍廩稍得養單貧祇飭閨門相傳忠孝庶㡬補報以盡餘齡候勅㫖蓋元豐初計其年尚未七十司農少卿今之朝議大夫也碌碌無所聞豈非聰明不及於前時耶御詩明清偶記其全篇七閩山水多才俊三歳奇童出盛時家世應傳清白訓嬰兒自得老成姿初當移歩來朝謁方及能言便誦詩更勵孜孜圖進益青雲千里看前期後閲朱興仲續歸田録云伯俙字景蕃與晏元獻俱五六歳以神童侍仁宗於東宫元獻自初梗介蔡最柔媚每太子過門闌髙者蔡伏地令太子履其背而登既踐祚元獻被知遇至宰相蔡竟不大用以舊恩常領郡頗不循法令或被劾取㫖上識其姓名必曰藩邸舊臣且令轉官凡更四朝元符初致仕已八十歳矣監司薦之乞落致仕與宫祠其辭略云蔡伯俙年八十歳食禄七十五年余謂人生名位固可得罕得緜長如此者以上朱録中語因併載之張耆既貴顯嘗啓章聖欲私第置酒以邀禁從諸公上許之既晝集盡驩曰更願畢今夕之樂幸毋辭也於是羅幃翠幕稠疊圍繞繼之以燭列屋蛾眉極其殷勤豪侈不可狀每數桮則賓主各少愒如是者凡三數諸公但訝夜漏如是之永暨至徹席出户詢之則云已再晝夜矣朱新仲言韓忠憲億景祐中參仁宗政事天下稱爲長者四子仲文綜子華絳持國維玉汝縝俱禮部奏名忠憲啓上曰臣子叨陛下科第雖非有司觀望然臣既備位政府豈當受而有之天下將以爲由臣故致此臣雖不足道使聖明之政人或以議之非臣所安也臣教子既以有成又何必昭示四方以爲榮觀哉乞盡免殿試唱第幸甚誠懇再三上嘉歎而允所請忠憲既薨仲文子華玉汝相繼再中科甲獨持國曰吾前已奏名矣當遵家君之言何必布之逺方耶不復更就有司之求故文潞薦持國疏云曾預南中髙薦從不出仕宦其後仲文知制誥子華玉汝皆登宰席持國賜出身至門下侍郎爲本朝之甲族云玉隆外祖云韓元吉著桐陰舊話却不及此揮麈後録卷五欽定四庫全書揮麈後録卷六宋王明清撰
