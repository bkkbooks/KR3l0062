  - {type: line-break, offset: 104, content: '', id: KR3l0062_SBCK_021-1b04}
  - {type: variant, offset: 105, length: 0, content: '', WYG: 萬乃國家腹心之疾大尉儻能平此朝廷必喜將士以此取富貴何患不濟諸將皆喜云此亦何難彥舟亦首肯張遂促其出師一戰而勝賊徒犇潰張遂與彥舟具立功人姓名及歸降文字與彥舟心腹數人俱入蜀謁魏公行至䕫州又遇劇賊劉超者擁數萬衆欲往湖南刼掠張又以説彥舟之言告之且言太尉或肯相從我當併往宣撫司言之超亦聽命駐軍於夔州不為鹵掠之計以俟朝命張行未及宣撫司數舍遇族兄自魏公處來問何幹且以兩事告之族兄者從而攫金張答以此行止為朝廷寛顧憂及救數路生靈之命豈有閑錢相助其人不悦逕返往見魏公先言以為張受}
  - {type: page-break, offset: 105, content: '', id: KR3l0062_WYG_018-12b, image: WYG1038/WYG1038-0561b.png}
  - {type: variant, offset: 106, length: 2, content: 祐陵, WYG: 賊賂甚厚其謀變詐不可信魏公然之張至宣撫司乞推賞孔彥舟部曲以彦舟為主帥且令屯駐荆南使之彈壓鍾相餘黨招撫襄漢荆湖之人復耕桑之業魏公悉不從姑令彥舟領部曲往黄州屯駐大失望徒黨皆不樂黄州之行以謂宣司不信其誠心遂率衆渡淮降敵紹興初楊么復嘯聚鍾相餘黨二十萬占洞庭湖襄漢湖湘之民蹂踐過半至今州縣荒殘不能復舊劉超者只駐軍􅇪州後遇劉季高自蜀􅀍召趍朝携降書入奏朝廷大喜季高之進用繇此而得之以上悉張自叙云爾不欲易之湯致逺鵬舉守婺州}
  - {type: page-break, offset: 106, content: '', id: KR3l0062_WYG_018-13a, image: WYG1038/WYG1038-0561c.png}
  - {type: variant, offset: 109, length: 0, content: '', WYG: 通判梁仲寛厚善仲寛者越人也晩得一婢甚憐寵之一旦辭去遂為天章寺長老德範者所有納之於方丈梁邑邑以終湯時帥長沙有過客為湯言之且悲且憤識之胸中明年湯易帥浙東入境卽天章甫至寺中急呼五百禽主僧決而逐出大以快意然德範者與婢一舸東去已逾月􅀍撻之髠入院葢未乆也陳師禹汝錫處州人也以才猷宣力於中興之初高宗自四明還㑹稽領帥浙東當搶攘之後安輯經理美効甚著適秦㑹之自北方還朝素懷睚眦以它罪坐師禹貶單州團練副使漳州安置既行一程次楓橋鎮客將朱禮者晨起鼓帥於衆曰責降官在法不當差破送還人一喏而散師禹不免雇賃使令以之貶所時王昭祖揚英為帥屬在旁知狀雖憤怒之而莫能何也後十八年昭祖以吏部郎出為叅謀官朱禮者已為大吏適湯致逺來為帥湯素負嫉惡之名帥藩未久昭祖白其事於湯令搜訪其姦􅂍黥竄象州一郡翕然師禹孫師㸃也吳棫才老舒州人飽經史而能文決科之後浮湛州縣晩始得丞太常紹興間尚須次也娶孟氏仁仲之妹貧往依焉仁仲自建康易帥浙東言者論謝上表中舍譏刺詔令分析仁仲辨數以謂乆弃筆研實託人代作孟雖放罪尋亦引閑秦㑹之令物色知假手於才老臺評遂上罷其新任繇是廢斥以終有毛詩叶韻行於世汪明遠澈任衡州教授以母憂歸從吉後造朝從秦㑹之仍求舊闕詞甚懇到秦問何苦欲此汪云彼中人情既熟且郡有兩臺可以求知秦愈疑之不與迺以沅州教授處之既不遂意而地偏且逺汪家素貧稱貸赴官極為不滿到郡見井邑之荒凉游從之寥落尤以鬱陶心竊怒秦而不敢言也適万俟元忠與秦異議自參政安置秭歸後徙沅江汪因謁之投分甚懽日夕往還三載之間益以膠固万俟還朝繼而大拜首加薦引力為之地入朝七年間遂登政府事不可料有如此者鄭恭老作肅甲戍歲自知吉州囘上殿陳劄子云郡中每歳以黄河竹索錢輸于公上黄河久陷偽境錢歸何所乞行蠲免其他循襲似此等者亦乞盡令除放高宗嘉納且喻秦丞相而稱奬再三焉秦大怒諷部使者誣以為在任不法興大獄而繩治之逮吏及門而秦殂遂免紹興己邜陳瑩中追諡忠肅其子應之正同適為刑部侍郎往謝政府有以大魁為元樞者忽問云先丈何事得罪秦師垣邪應之曰先人建中初為諫官力言二}
