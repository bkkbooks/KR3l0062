front:
  text: 揮麈後録卷之七百一六汝隂王明清國朝以來自執政徑登元台不歷次揆而升者薛文
  hash: sha256:478df49cec5d16d8a263703a953e586fafc03eeda061ee1fbc71eba66d9eaffb
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_012-1a}
body:
  text: 惠吕正惠畢文簡丁晉公王文惠龐莊敏韓獻肅司馬文正吕正愍章申公何清源鄭華原白蒙亨徐擇之沈守約葉子昻獨相而久者章子厚是也故其罷相制云為之不置次輔所以責其成功後來秦師垣豈止倍其數邪前此如王文公蔡師垣雖信任之篤古今所無見之訓詞然中書右府各皆官備而未始專持柄權歲月之深如是秦得志之後有名望士大夫悉屏之逺方凡齷齪委靡不振之徒一言契合自小官一二年即登政府仍止除一廳循故事伴拜之制伴食充位而巳蓋循舊制二府一貟伴拜不可闕也稍出一語斥而去之不異奴隸皆禠其職名恩數奏薦俱不放行猶庶百一七官云御書碑額其始見之宋次道退朝録御書閣名或傳蔡元度為請祐陵書以賜王荆公家未詳也次道所紀碑名之後韓忠獻曰兩朝顧命定䇿元勳曾宣靖曰兩朝顧命定䇿亞勳冨文忠曰顯忠尚德司馬文正曰清忠粹德趙清獻曰愛直高武烈曰決䇿定難顯忠基慶髙康王曰克勤敏功鍾慶韓獻肅曰忠弼孫溫靖曰純亮范忠宣曰丗濟忠直韓文定曰丗濟厚德姚兕曰丗濟忠武趙隆曰旌忠馮文簡曰吉德王文恭曰元豐治定弼亮功成蔡持正曰元豐受遺定䇿勳臣折可適曰旌武劉仲偃曰旌忠褒節陳長卿曰褒功顯德秦敏學曰清德啓慶御書閣名王文公曰文謨丕承蔡元長曰君臣慶會元度曰元儒亨會吳敦老曰勳賢梁才父曰耆英劉德𥘉曰儒賢亨會楊正父曰安民定功運興德史直翁曰清忠亮直秦會之曰決䇿和戎精忠全德鄭逹天云勳賢承訓何伯通云嘉會成功蔡攸曰濟美象賢余源仲曰賢弼亮功鄧子常曰丗濟忠嘉曰蒙亨曰醇儒王黼曰得賢治定蔡持正曰褒忠顯功蔡攸曰緇衣美慶朱勔曰顯忠童貫曰褒功髙俅曰風雲慶會秦會之曰一德格天楊正父曰風雲慶會史直百一八翁曰明良亨會其它尚多未能盡紀當俟續考元豐中先祖同滕章敏王荆公于鍾山臨别贈言云立德廣量行惠非特為兩公别後之戒安石亦終身所行之者也先祖云以某所見前二語則相公誠允蹈之但末後之言相公在位時行青苗免役百一九之法于天下未審如何公默然不應東坡先生為韓魏伀作醉白堂記王荆公讀之云此韓白優劣論尓元祐中東坡知貢舉以光武何如髙帝為論題張文潛作參詳官以一卷子携呈東坡云此文甚佳蓋以先生醉白堂記為法東波一百草賢喜曰誠哉是言擢置魁等後拆封乃劉燾無言也東坡先生為兵部尚書時為説之言黃州時陳慥相戲曰公只不能作佛經曰何以知我不能曰佛經是三昧流出公未免思慮出耳曰君知子不出思慮者胡不以一物試之陳不肯曰公何物不曾作題目今何可相煩者復強之乃指其首魚枕冦曰頌之曰假君子手為子書焉可也陳於是筆不及並墨􅒒且笑曰便作佛經語耶説之請公書是頌曰不揆輒欲著其作頌始𥘉本末如此以視後之學者而留落頽墮負其𥘉志三十有三年矣今年以其頌歸謝甥伋伋聞而有請所不得辭遂亟識之并以當時所書李潭馬贊歸伋宣和七年乙巳二月十六日丁巳朝請大夫致仕朝説之題右朝四丈以道跋東坡書著之于編欲使後人知作文百二一之所因真迹今藏謝景思家李撰字子約毗陵人曾文肅在真定李為教授家素窮約夫人嘗招其母妻燕集時有武官提刑宋者妻亦預席宋妻盛飾而至珠翠耀目李之姑婦所服浣衣不潔凊各携其子俱來宋之子眉目如畫衣裝華煥李之子憃甚然悉皆絃誦如流左右共哂之夫人笑曰教授今雖貧諸郎俱令器它時未易量提刑之子雖楚楚其服但趍走之才耳子約五子四登科三人至侍從二人為郎彌綸彌大彌性彌遜彌正也宋之子浚止於閣門祗候果如夫百二二人之言老親云陳珹虛中瑩中之弟也以名家典郡知吉州日徐師川通判郡事師川恃才傲丗不肯居人下嘗取虛中所判抹而改之然非所長也虛中語師川曰足下塗抹城之批判雖不足道然公所改抹未當奈何况夫佐官妄改長官巳判於法不輕即呼通判廳人吏將坐以罪師川知巳之屈也祈原之虛中曰此亦甚易君可使珹之前判如故即便釋吏矣師川於是以粉筆塗去巳之改字以呈虛中虛中百三三遂貰之虛中能以理服師川不復飾非皆可喜也蔡元度為樞密與其兄內相搏力祈解政遷出于郊外觀音院去留未定也平時門下士悉集焉是時所厚客巳有叛元度者元度心不能平飯巳與諸君步廊廡觀壁間所畫熾盛光佛降九曜變相方群神逞威之際而其下趍走有稽首默敬者元度笑以指示羣公曰此小鬼最叵耐上靣勝負未分他底下早巳合掌矣客有慚者元祐初揚康功使髙麗別禁從諸公問以所委皆不百二四答獨蔡元度曰髙麗磬甚佳歸日煩為置一口不久康功言還遂以磬及外國竒巧之物遺元度甚豐它人不及也或有問之者康功笑曰當僕之度海也諸公悉以謂沒於巨浸不復以見屬獨元度百二五之心猶兾我之生還吾聊以報其意耳韓簡伯云汴水湍急失足者隨流而下不可復活舊有短垣以限往來久而傾圮民佃以為浮屋元祐中方逹源為御史建言乞重修短垣護其堤岸疏入報可遂免淹溺之患逹源名蒙桐廬人陳述古壻多與蘇黃遊奏疏見其家集中用載於此臣聞為治先務在於求民疾苦與之防患去害至於一夫不獲若巳推而納於溝中昔者子産用車以濟涉未若大禹思溺者之由己溺之心如此故能有仁民之實形於政令而下𬒳上施欣戴無斁今汴堤修築堅全且無車牛濘淖故途人樂行於其上然而汴流迅急墜者不救頃年並流築短墻為之限隔以防行人足跌乘馬驚逸之患每數丈輒開小缺以通舟人維纜之便然後無殞溺之虞此來短墻多隳而依岸民廬皆蓋浮棚月侵歲展岸路益狹固巳疑防患之具不周矣近軍巡院禁囚有馳馬逼墜河者果於短墻隳圯之處也又聞城內續有殞溺者蓋由短墻但係河清兵士依例修築而未有著故官司不常舉行欲望降指揮京城沿汴南北兩岸下至泗州應係人馬所行汴岸令河清兵士並流修墻以防人跌馬驚之患每數丈聽小留缺不得過二尺或有圯毁即時循輔其因裝卸官物權暫拆動者候畢即日完築或有浮棚侵路亦令徹去委都水監及提舉河岸官司常切檢察令天下皆知朝廷惜一民之命若保赤子聖時之仁術也逹源生三子元修字時敏元若允迪元矩道縱皆有才名于宣政間允迪嘗為少蓬丗以為隂德之感時敏之子即務德也東坡先生自黃州移汝州中道起守文登舟次泗上百二六偶作詞云何人無事燕坐空山望長橋上燈火閙史君還太守劉士彥本出法家山東木強人也聞之亟謁東坡云知有新詞學士名滿天下京師便傳在法泗州夜過長橋者徒二年况知州邪切告收起勿以示人東坡笑曰軾一生罪過開口常是百二七不在徒二年以下張唐佐云建中初曾文肅秉軸與蔡元長兄弟為敵有當時文士與文肅啓略云扁舟去國頌聲惟在於曾門䇿杖還朝足迹不登於蔡氏明年文肅南遷元度當國即更其語以獻曰幅巾還朝輿頌咸歸於蔡氏扁舟去國片言不及於曾門士大夫不足養如此老親云百二八米元章紹興中章子厚在相位曾文肅居西府文肅忽苦腹疾子厚來視病坐間文肅忽思幐沙粥時外祖空青先生曾公卷在侍側咄嗟而辦文肅食之甚美子厚猶未去也詢其速致之術空青云適令於市中貨幐沙饀簷中買來取其穰入粥中故耳子厚百二九賞歎云它日轉運使才也其後空青仕宦果數歷輸􅞮石豫者寧陵人外憃而中狡崇寧初以交通閽寺姓名遂逹于崇恩繇是至位中司首言鄒志完再竄昭州昭慈復從瑶華降復元祐人立黨籍碑皆其疏也當時士大夫莫不憤其姦凶後五十年其子百卅敦義為廣東提刑坐贓黥隸栁州毛澤民受和曾文肅擢置館閣文肅南遷坐黨與得罪流落久之蔡元度鎮潤州與澤民俱臨川王氏壻澤民傾心事之惟謹一日家集觀池中鴛鴦元度席上賦詩末句云莫學飢鷹飽便飛澤民即席和以呈元度曰貪戀恩波未肯飛元度夫人笑曰豈非適從曾相公池中飛過來者邪澤民漸不能百三一舉首吳傅朋云錢昂治郡有聲以材能稱於崇觀間嘗帥秦州時童貫初得幸為熙河措置邊事恃寵驕倨將迎不暇獨昂未嘗加禮昂短小精悍老而矍鑠一日赴天寧開啓待貫之來久之方至昂問之曰太尉何來暮邪貫曰偶以所乘騾小而難騎動必跳躍適方欲據鞍忽盤旋庭中甚久以此遲遲昂曰太尉之騾雄也雌耶貫對曰雄者也昂曰既尓難奈何不若閹之貫雖一時愧怒而莫能報其後貫大用事百三二卒致遷責陸務觀云崇寧三年黃太史魯直竄冝州携家南行泊于零陵獨赴貶所是時外祖曾空青坐鈎黨先徙是郡太史留連逾月極其歡洽相豫酬唱如江樾書事之類是也帥遊浯溪觀中興碑太史賦詩書姓名于詩左外祖急止之云公詩文一出即日傳播某方為流人豈可出郊公又逺徙蔡元長當軸豈可不過為之防邪太史從之但詩中云亦有文士相追百卅三隨蓋為外祖而設元祐中有郭槩者東平人法家者流遍歷諸路提點刑獄善於擇壻趙清憲陳無巳髙昌庸謝良弼名位皆優而謝獨不甚顯其子乃任伯後為參知政事無巳集中首篇送外舅郭大夫詩是也趙髙子孫甥壻皆聲華籍甚數十年間為薦紳之榮耀焉百卅四良弼顯道之弟也曾國老弼崇寧中為湖北提舉學事時王慶曾作學事司幹當公事按行諸郡與之偕行次漢陽欲絶江之鄂渚國老約慶曽晨炊相與同渡慶曾辭以茹素自於客館飯畢而後追路國老怏怏亟登舟慶曾食未竟忽聞國老中流不濟船中無一人免者慶曽後四十年為參知政事國老弟即文清用百三五其恤典補官身貴而後有聞仲躬云錢忱伯誠妻􅌡國夫人唐氏正肅公介之孫既歸錢氏隨其姑長公主入謝欽聖向后于禁中時紹聖𥘉也先有戚里婦數人在焉俱從后步過受釐殿同行者皆仰視讀釐為離夫人笑于旁曰受禧也蓋取宣室受釐之義耳后喜回顧主曰好百三六人家男女終是别蓋后亦以自謂也陸子逸云明清於王歧公孫曉浚明處見歧公在翰苑時令門百三七生輩供經史對偶全句十餘册限當時不曾傳之也先祖𥘉任安州應城尉有村民為人所殺往驗其尸而未得賊先祖注觀之次有兮手持蓋于後先祖即令縛之云此人兩日前差出是處靣有爪痕而百三八尸手爪有血以是驗之當尓訊治果然米元章崇寧𥘉為江淮制置發運司包當直逹綱運置司真州大漕張勵深道見其滑稽玩丗不能俯仰順時深不樂之每加形迹元章甚不能堪會蔡元長拜相元章知巳也徒私僕訴于元長乞於銜位中削去所帶制置發運司五字仍降旨請給序位人從並同監司元長悉從之遣僕持人勑命以來元章既得之閉户自書新刺凌晨拜命畢呵殿徑入謁直抵張之廳事張驚愕莫測及展刺即講鈞敵之禮始知所以既退憤然語坐客云米元章一生證候仐日乃使著矣後元章以能書得幸祐陵擢列星曹國朝以任子為南宫舍人者惟龐懋賢元英與元章二人元章晚益豪放不拘繩檢故蔡天啓作其墓碑云君與西蜀劉涇巨濟長安薜紹彭道祖友善三公風神蕭散蓋一流人也又云冠服用唐規制所至人聚觀之視其眉宇軒百三九然進趍襜如音吐鴻暢雖不識者知其為米元章也李良輔者憸人也元符末在永州主歧陽簿有教授李師聃祖道蜀中老儒黃太史魯直之姻家善士也范忠宣遷是郡祖道作詩慶其生𥘉有江邊間艤濟川舟之句良輔與之有隙遂上其本祖道坐此削籍流九江良輔用賞改秩浸至郡守建炎𥘉吕元直當軸良輔造朝求差遣元直舊知其事詢所以然良輔猶以為績效歷歷具陳之元直笑曰𥘉未知本末之詳正欲公自言之尓即命直省吏百四十拘于客次奏于上除其名人皆快之余晉仲云鄒志完元符三年自右正言上疏論中宫事除名竄新州鍾正甫將漕廣東次年上元廣帥朱行中約正甫觀燈巳就坐矣忽得密旨令往新州制勘公事正甫不待杯行連夜星馳以往抵新興追逮志完赴司理院荷校因之正甫即院中治事極其暴虐志完甘為機上肉矣詰旦忽令推吏去其杻械請至簾下勞問甚勤云𥘉無其它正言可安心置慮歸休愒處某亦便還司矣志完出正甫果去且遣騎致饋極腆志完惘然不知所以又明日郡中宣徽宗登極赦書蓋正甫先巳知矣未幾志完𬒳召遂登禁路紹興二年秦會之罷右僕射制略云自詭得權而舉事當聳動於四方逮兹居位以陳謀首建明於二䇿罔燭厥理殊乖素期又云豫奪在我豈云去朋黨之難終始待卿斯無負君臣之義此綦叔厚之文禠職告詞云聳動四方之聽朕志為移建明二䇿之謀尓材可見謝任伯之文綦謝姻家也秦大憾之先是髙宗有親批云秦檜不知治體信任非人人心大搖怨讟載路丁卯歲啓上詔毁宰執拜罷録謂載訓詞也至乙亥歲秦復知御札在任伯之子伋景思處作劄子自陳大槩云陛下是時尚未深知臣所以有此乞行抽取得旨下台州從伋所追索得之是秋又令其姻黨曹泳為擇酷吏劉景者擢守天台專欲鞫勘景思寓居外邑黃巖山間景視事之次日遣捕吏追逮景思直以姓名傳檄縣令差人防護甚峻景思自分必死將抵郡城外渡舟中望見景備郊迎之儀一見執禮甚恭至館舍則美其帷帳厚其飲食景思叵測是晚置酒延佇座間笑語極歡而罷始聞早巳得會之訃音矣又踰旬景思拜處牧之命二事絶相類然終不知所興之獄謂百罒一何也先祖早歲登科遊宦四方留心典籍經營收拾所藏書逮數万卷皆手自校讎貯之于鄉里汝隂士大夫多從而借傳元符末坐黨籍謫官湖外乃於安陸卜築為久居計輦置其半于新居建炎𥘉冦盜蜂起惟德安以邑令陳規元則帥衆堅守秋豪無犯事聞擢守本郡先祖之遺書留空宅中悉為元則載之而去後十年元則以閣學士來守順昌亦保城無虞先祖汝隂舊藏書猶存又為元則所掩有二處之書悉歸陳氏先人每以太息然無理從而索之先人南渡後所至窮力抄録亦有書幾萬卷明清憂患之𥘉年幼力弱秦伯陽遣浙漕吳彥猷渡江攘取太半丁卯歲秦會之擅國言者論會稽士大失家藏野史以謗時政𥘉未知為李泰發家設也是時明清從舅氏曾宏父守京口老母懼焉凡前人所記本朝典故與夫先人所述史藁雜記之類悉付之回䘵每一思之痛心疾首後來明清多寓浙西婦家煨燼之餘所存不多諸姪輩不能謹守又為親戚盜去或它人久假不歸今遺書十不一存每一歸展省舊篋不忍復啓但流涕百四二而巳唐著作郎杜寶大業幸江都記云隋煬帝聚書至三十七万卷皆焚于廣陵其目中蓋無一帙傳於後代靖康俶擾中祕所藏與士大夫家者悉為烏有南度以來惟葉少緼少年貴盛平生好收書逾十万卷置之霅川辨山山居建書樓以貯之極為華煥丁邜冬其宅與書俱蕩一燎李泰發家舊有萬百四三餘卷亦以是歲火於秦豈厄會自有時邪徐得之君猷陽翟人韓康公壻也知黃州日東坡先生遷謫于郡君猷周旋之不遺餘力其後君猷死於黃東坡作祭文挽詞甚哀又與其弟書云軾始謫黃州舉眼無親君猷一見相待如骨肉此意豈可忘哉君猷後房甚盛東坡常聞堂上絲竹詞中謂表德元來字勝之者所最寵也東坡北歸過南都則其人巳歸張樂全之子厚之恕矣厚之開燕東坡復見之不覺掩靣號慟妾乃顧其徒而大笑東波每以語人為蓄婢之戒君猷子端益字輔之娶燕王元儼孫女為右階粗有文采建炎中冨季申登樞府以其故家處以永嘉路分都監時曽覿為雙穗鹽埸官與其子本中厚善曾既用事薦本中于孝宗遂得密侍禁中韓氏子弟亦有攀緣而進者本中娶趙氏從聖野之孫即磻老家女也蘇訓直云百四四故事兩制以上方乘狨座餘不預也大觀中童貫新得幸以泰寧軍承宣使副禮部尚書鄭久中使遼百四五國遂俱乘狨座繇是為例韓勉夫云隆興改元歲明清在會稽因為友人言先人初為曾氏壻嘗於外家手節曾文肅公日録有庚辰歲在相位日一帙真迹外家後來失去見於外祖曾空青三朝正論後序矣先人節本偶存焉其中一則記趙諗事諗弟詼於渝州所居柱上題云隆興二年天章閣待制荆湖南北等路安撫使再題云隆興三年隨軍機冝李時雍從行諗不軏事發鑿取其柱赴制勘所并具奏其所題之意詼坐此亦死如此則隆興之號豈可犯耶友人云願借一觀遂以假之亟馳元本送似當軸者繼即開陳遂改乾道之號友人繇此乃晉用然先人手澤不可復取而此書不傳于丗矣友人後登從班交往既厚不欲書其姓名初諗以甲科為太常博士謁告省其父庭臣于蜀道中夢神人授以詩云天錫雄材孰與戡征西才罷又征南冕旒端拱披龍衮天子今年二十三繇此有猖狂之志伏誅時適及歲刑部郎中王吉甫獨引律中文以謂口陳欲反之言心無真實之狀吉甫坐絀詔改渝州為恭州諗𥘉登第時太常少卿李積中女有國色即以妻之百四六成婚未久而敗或云馮時可者諗遺腹子也髙俅者本東坡先生小史筆扎頗工東坡自翰苑出帥中山留以豫曾文肅文肅以史令巳多辝之東坡以屬王晉卿元符末晉卿為樞密都承旨時祐陵為端王在潛邸日巳自好文故與晉卿善在殿廬待班解后王云令日偶忘記帶篦刀子來欲假以掠鬢可乎晉卿從腰間取之王云此樣甚新可愛晉卿言近創造二副一猶未用少刻當以馳內至晚遣俅賫往值王在園中蹴鞠俅候報之際睥晲不巳王呼來前詢曰汝亦解此技邪俅曰能之漫令對蹴遂愜王之意大喜呼隸輩云可往傳語都尉既謝篦刀之况并所送人皆輟留矣由是日見親信踰月王登寶位上優寵之眷渥甚厚不次遷拜其儕類援以祈恩上云汝曹爭如彼好腳迹邪數年間建節循至使相遍歷三衙者二十年領殿前司職事自俅始也父敦復復為節度使兄伸自言業進士直赴殿試後登八坐子姪皆為郎潛延閣恩幸無比極其冨貴然不忘蘇氏每其子弟入都則給飬問恤甚勤靖康初祐陵南下俅從駕至臨淮以疾為解辭歸京師當時侍行如童貫梁師成輩皆坐誅而俅獨死於牖下胡元功云揮麈後録卷之七
