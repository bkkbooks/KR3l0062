front:
  text: 揮麈第三録卷之三二三汝隂王明清劉廷者開封人向氏甥頗知書少年不檢無家可歸
  hash: sha256:57f3ed0cada637d7f9458fc5b0e44c0f40d06fb4fb4dac4c9036d13e3509c265
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_020-1a}
body:
  text: 從張懷素左道于真州一日懷素語廷云吾嘗遣范信中往説諸遷客于湖廣間久之不至聞從京口入都矣豈非用心不善乎子其往京師偵探之廷俶裝西上道中小緩而進比次國門則見懷素與其黨數人皆鎖頸纍纍而過防護甚嚴廷皇怖休于旅邸又數日變易名姓買舟南下有二白衣隸輩與之共載既相欵洽忽自云我開封府捉事使臣也君識一劉廷秀才否近以通謀為逆事露官遣我捕之君其為我物色焉廷略不露其蹤迹次臨淮岸分背自此遁迹江淮間建炎初思陵中興應天乃更名誨上書自奮應募願使虜廷召對稱旨自韋布授京秩直袐閣借侍從以行將命有指擢直顯謨閣守楚州制詞云昨將使指之光華備歷征途之嶮岨命分憂於凋郡併進直於清班己酉歲金寇渡淮誨走奔錢塘時大駕已幸四明杭守康志升允之委城而遁軍民乃共推誨領郡適虜寨于郊外誨登錢唐門樓遣人下與計事有唱言誨欲以城獻賊者為衆所殺時有黃大本者江湖浪人也靖康初蔡絛效丁晉公賂海啇遣表之計使大本持書于吳元中云自謂不出蔡氏可乎心應知之蓋謂其父疇昔有保護東宫之功果為開封府所獲上之元中坐此免相然元長竟得弗誅大本己酉歲亦以上書輔京官假朝奉大夫直袐閣奉使北方既歸為池州貴池縣丞坐贓趙元振秉鈞恨其前日與蔡氏為地使元長得逃於戮遂正刑典又有朱辨字少張徽州人學文頗工早歲漂泊遊京洛間朝以道為學官于朝一見喜之歸以從女辨以啓謝之云事大夫之賢者以其兄子妻之又以李虛中之術較量休咎遊公卿間六飛在惟揚有薦之者授修武郎閣門宣贊舍人副王正道倫出疆𬒳抅在朔庭因正道之歸賫表于上云節上之旄盡落口中之舌徒存歎馬角之未生魂飛雪窖攀龍􅿁而莫逮淚灑氷天上覽之感愴厚恤其家留胸奴凡十九歲紹興壬戌始與洪光弼張才彥俱南歸易宣教郎直袐閣主管佑神觀以終旅殯于臨安近朱元晦以其族人為作行狀而尤先生延之作志銘遷葬于西湖之上有聘遊集三十卷曲洧紀聞一書事多出於朝氏之言丗頗傳之及與洪張為輶軒唱二四和集去歲朝廷録其孫為文學云明清頃有沈必先日記言奏事殿中髙宗云近有人自東京逃歸聞張九成見為劉豫用事可怪必先奏云張九成在其鄉里臨安府鹽官縣寄居去行闕無百里而逺兩日前方有文字來乞將磨勘一官回授父改緋章服幸陛下裁之上云如此則所傳妄矣可笑不若便與一差遣召來蓋子韶廷試䇿流播偽齊人悉諷誦故傳疑焉翌日降二五旨除袐書郎吕元直秉鈞既久又侍上泛海回越益肆其功自任威福趙元鎮為中司上疏力排之元直移元鎮為翰林學士元鎮引司馬溫公故事以不習駢儷之文不肯就職且辭且攻之章至十數上元直竟從二六䇿免以優禮而去元鎮徑除簽書樞密院事時建炎四年四月也許志仁龍舒之秀士能詩善謔早為李伯紀之門賔伯紀捐館諸子延緇徒為佛事群僧請懴悔之詞于許乃取汪彥章昔所行謫詞中數語以授之僧徒髙唱云朋邪罔上罪消滅欺丗盜名罪消滅如此者不一二七諸子憤怒詢其所繇知出于志仁詬責而逐之李元度云紹興𥘉梁仲謨汝嘉尹臨安五鼓往待漏院從官皆在焉有據胡床而假寐者旁觀笑之又一人云近見一交椅樣甚佳頗便於此仲謨請之其説云用木為荷葉且以一柄插于靠背之後可以仰首而寢仲謨云當試為諸公製之又明日入朝則凡在坐客各一張易其舊者矣其上所合施之物悉二八備焉莫不歎伏而謝之今逹宦者皆用之蓋始於此外祖曾空青任知信州日嘗辨宣仁聖烈誣謗以進于髙宗皇帝首尾甚詳今備録之切伏惟念宣仁聖烈皇后遭無根之謗四十餘年陛下踐祚之初首降德音昭示四方明文母保祐之功誅姦臣貪天之慝赫然威斷風動天下薄海內外鼓舞歡呼小臣么微嘗冒萬死於建炎元年八月內備録先臣遺記扣閽以陳蓋自紹聖以來大臣報復元祐私怨造為滔天之謗上及宣仁先臣某方位樞管論議為多臣於家庭之間固巳與聞其略而先臣親書記録尤為詳盡其後蔡渭繳文及甫等偽造之書附會廢立之謗當時用事之臣至以謂神考非宣仁所生以實傾搖廢立之迹欲以激怒哲宗賴哲宗皇帝天姿仁考洞照謬妄而又先臣每事極論痛伐賊謀故於宣仁終不能遂其姦計是時蔡京撰造仁宗欲以庶人之禮改葬章獻意在施之宣仁先臣所陳乃以謂天命何可移易宣仁必無此心乞宣諭三省於詔命之中推明太母德意時哲宗聖諭云宣仁乃婦人之堯舜又蔡京以謂不誅楚邸則天下根本未正先臣所陳乃以謂就令楚邸有謀亦當􅉼容闊略豈唯傷先帝篤愛兄弟之恩亦恐形迹宣仁上纍聖德時哲宗又有他必不知之語雖追貶王圭力不能回而於圭責詞中猶用先臣之言增四句云昭考與子之意素已著明太母愛孫之慈初無間隙哲宗至再三稱善元符之末太上皇帝踐祚欽聖獻肅垂簾之初先臣又嘗陳三省言元祐廢立之事欽聖云冤他娘娘豈有此意又云無此事又云當時不聞誰敢説及此事蓋欽聖受遺神宗同定大䇿禁中論議無不與聞歎息驚嗟形於聖語誣罔之狀明白可知逮崇寧之後蔡京用事首逐先臣極力傾擠置之死地一時忠良相繼貶竄方遂其指鹿為馬之計豈復以投鼠忌器為嫌顛倒是非甘心快意至與蔡懋等撰造宫禁語言事迹加誣欽聖欺罔上皇以誑惑衆聽國史所載臣雖不得而見然以紹聖不得伸之姦謀施於崇寧擅權自肆之後其變亂是非巧肆誣詆亦不待言而後知也然彼不知者公論所在判若黑白於陛下聖德亦巳久矣又况二聖玉音如在先臣記録甚詳乃欲以一二姦人之言欺天罔地成其私意今日之敗必至之理也本末事實盡載先臣三朝正論伏望聖慈萬機之暇特賜省覽付之外廷宣之史官播告中外使天下後丗曉然皆知哲宗仁孝之德𥘉無疑似欽聖歎息之語深切著明而四十餘年間止緣二三姦臣賊子興訛造訕以報簾幃之怨貪天之力以掩巍巍之功使宣仁聖烈皇后保佑大德返遭誣今者考正是非誅鉏謗讟隂霾蔽蝕之際然後赫然日月之光旁燭四海焜耀萬丗與天地合德於無窮也先臣不昧亦鼓舞於九泉之下矣此紹興三年五月也三二九朝正論士大夫家往往有之紹興庚申歲明清侍親居山隂方總角有學者張堯叟唐老自九江來從先人適聞嶽侯父子伏誅堯叟云㒒去歲在羌廬正覩嶽侯葬母儀衛甚盛觀者填塞山間如市解后一僧為㒒言嶽葬地雖佳但與王樞密之先塋坐向既同龍虎無異掩壙之後子孫須有非命者然經數十年再當昌盛子其識之今乃果然未知它日如何耳王樞密乃襄敏本江州人葬其母于鄉里有十子輔道既罹橫逆而有名字者為開封幕過橋墮馬死名端者待漏禁門簷瓴氷柱折墜穿頂而沒後數十年輔道之子炎弼彥融以勳德之裔朝廷録用以官把麾持節升直內閣炎弼二子萬全萬樞令皆正郎而諸位登進士第者接踵嶽非辜之後凡三十年滿洗冤誣諸子若孫驟從縲紲進躐清華昔日之言三十猶在耳也紹興癸亥和議初成有南雄太守黃逹如者考滿還朝獻言請盡誅前此異議之士庶幾以杜後患秦會之喜之薦為監察御史方數日廣東部使者韓球按其贓汙巨萬奏牘既上雖秦亦不能掩僅止三一罷絀人亦快之洪景伯兄弟應博學宏詞以克敵弓銘為題洪惘然不知所出有巡鋪老卒覩于案間以問洪云官人欲知之否洪笑曰非而所知卒曰不然我本韓丗忠太尉之部曲從軍日目見有人以神臂弓舊樣獻于太尉太尉令如其制度製以進御賜名克敵并以歲月告之洪盡用其語首云紹興戊午五月大將云云主文大以驚喜是歲遂中科目若有神助焉此蓋熙寧中西人李宏中創造因內侍張三二若水獻于𥙿陵者也李平叔云鄭亨仲剛中為川陜宣撫節制諸將極為尊嚴吳璘而下每入謁必先階墀然後升廳就坐忽璘除少保來謝語主閽吏乞講鈞敵之禮吏以為白亨仲亨仲云少保官雖髙猶都統制耳倘變常禮是廢軍容少保若欲反則取吾頭可矣階墀之儀不可易也璘皇恐聽命人皆韙之政和末秦會之自金陵往參成均行次當塗境上值大雨水衝橋斷不能前進虛中居民開短窗延一士子教其子弟士子於書室窗中窺見秦徒步執蓋立風雨中淋漓悽然甚憐之呼入令小愒至晚雨不止白其主人推食挽留而共榻翌日晴霽送之登途秦大以感激秦既自敘其詳復詢士之姓名云曹筠庭堅也秦登第即宦顯絶不相聞久之曹建炎初以太學生隨大駕南幸至維揚免省䇿名後為台州知録老不任事太守張稱對移為黃巖主簿無憀之甚時秦專權久矣曹一夕偶省悟其前此一飯之恩因謀諸婦婦吳越錢族晚事曹頗解事謂曰審爾何不漫訴之筠因便介姑作詩以致祈懇末句云浩浩秦淮千万頃好將餘浪到灘頭其淺陋不工如此秦一覽慨然興念以刪定官召之尋改官入臺遂進南床髙宗惡之親批逐出秦猶以為集英殿修撰知衢州未幾坤維闕帥即擢次對制閫全蜀到官之後弛廢不治遂致孝忠之變秦竟庇護之奉祠而歸秦沒始奪其三四職云方務德帥荆南有寓客張黜者乃魏公之族子出其乃翁所記建炎刑州遺事一編示務德云孔彥舟領衆十餘萬破荆南城是時朝廷方經理北虜未暇討捕群盜張單騎入城説諭彥舟使之效順朝廷著名青史勿罣丹書為天下笑彥舟感悟與部下謀咸有納𣢾之意張又語之云太尉須立勞效庶為朝廷所信四川宣撫乃我之叔父也目今去朝廷甚逺俟見太尉立功當為引領頭目人入川參宣撫以求保奏推賞如何彥舟云甚好今有一項虜人往湖南劫掠聞朝夕取道襄陽以歸北界待與欄截勦殺以圖報國張云此項虜寇人數不多又是歸師在今日無甚利害鼎州一帶有賊徒鍾相衆號四十萬乃國家腹心之疾太尉儻能平此朝廷必喜將士以此取冨貴何患不濟諸將皆喜云此亦何難彥舟亦首肯張遂促其出師一戰而勝賊徒奔潰張遂與彥舟具立功人姓名及歸降文字與彥舟心腹數人俱入蜀謁魏公行至夔州又遇劇賊劉超者擁數萬衆欲往湖南劫掠張又以説彥舟之言告之且言太尉或肯相從我當併往宣撫司言之超亦聽命駐軍于夔州不為鹵掠之計以俟朝命張行未及宣撫司數舍遇族兄自魏公處來問何幹且以兩事告之族兄者從而攫金張答以此行止為朝廷寬顧憂及救數路生靈之命豈有間錢相助其人不恱徑返往見魏公先言以為張受三賊賂甚厚其謀變詐不可信魏公然之張至宣撫司乞推賞孔彥舟部曲以彥舟為主帥且令屯駐荆南使之彈壓鍾相餘黨招撫襄漢荆湖之人復耕桑之業魏公悉不從姑令彥舟領部曲往黃州屯駐大失望徒黨皆不樂黃州之行以謂宣司不信其誠心遂率衆渡淮降虜紹興初楊么復嘯聚鍾相餘黨二十萬占洞庭湖襄漢湖湘之民蹂踐過半至今州縣荒殘不能復舊劉超者只駐軍夔州後遇劉季髙自蜀𬒳召趍朝携降書入奏朝廷大喜季髙之進用繇此而得之以上悉張自敘云尓不欲易之湯致逺鵬舉守婺州與通判梁仲寬厚善仲寬者越人也晚得一婢甚憐寵之一旦辭去遂為夭章寺長老德範者所有納之于方丈梁邑邑以終湯時帥長沙有過客為湯言之且悲且憤識之胸中明年湯易帥浙東入境即夭章甫至寺中急呼五百禽主僧決而逐出大以快意然德範者與婢一舸三六東去巳逾月被撻之髠入院蓋未久也陳師禹汝錫處州人也以才猷宣力于中興之初髙宗自四明還會稽領帥浙東當槍攘之後安輯經理美效甚著適秦會之自北方還朝素懷眥睚以它罪坐師禹貶單州團練副使漳州安置既行一程次楓橋鎮客將朱禮者晨起鼓帥于衆曰責降官在法不當差破送還人一喏而散師禹不免雇賃使令以之貶所時王昭祖揚英為帥屬在旁知狀雖憤怒之而莫能何也後十八年昭祖以吏部郎出為參謀官朱禮者巴為大吏適湯致逺來為帥湯素負嫉惡之名開藩未久昭祖白其事于湯令搜訪其姦贓黥竄象州一郡翕然師禹孫三七師點也吳棫才老舒州人飽經史而能文決科之後浮湛州縣晚始得丞太常紹興間尚須次也娶孟氏仁仲之妹貧往依焉仁仲自建康易帥浙東言者論謝上表中含譏刺詔令分析仁仲辨數以謂久棄筆研實託人代作孟雖放罪尋亦引間秦會之令物色知假手于才老臺評遂上罷其新任繇是廢三八斥以終有毛詩叶韻行於丗汪明逺徹任衡州教授以母憂歸從吉後造朝從秦會之仍求舊求舊闕詞甚懇到秦問何苦欲此汪云彼中人情既熟且郡有兩臺可以求知秦愈疑之不與乃以沅州教授處之既不遂意而地偏且逺汪家素貧稱貸赴官極為不滿到郡見井邑之荒涼遊從之寥落尤以欎陶心竊怒秦而不敢言也適万俟元忠與秦異議自參政安置秭歸後徙沅江汪因謁之投分甚歡日夕往還三載之間益以膠固万俟還朝繼而大拜首加薦引力為三九之地入朝七年間遂登政府事不可料有如此者鄭恭老作肅甲戌歲自知吉州回上殿陳劄子云郡中每歲以黃河竹索錢輸于公上黃河久陷偽境錢歸何所乞行蠲免其他循襲似此等者亦乞盡令除放髙宗嘉納且喻秦丞相而稱奬再三焉秦大怒諷部使者誣以為在任不法興大獄而繩四十治之逮吏及門而秦殂遂免紹興巳卯陳瑩中追諡忠肅其子應之正同適為刑部侍郎往謝政府有以大魁為元樞者忽問云先丈何事得罪秦師垣邪應之曰先人建中初為諌官力言二蔡於未用事時其後以此遷謫流落無有寧日其人若醒悟狀曰此所以南度後便為參四一政也蓋後誤以為陳去非然不知初又以為何人也李泰發之遷責海外也欲寓書秦丞相以祈內徙而無人可遣門人王彥恭躍罷雷守間居全州泰發乃作秦書託王為尋端便王鄰之居有李將領者坐嶽侯事編置于郡與閭里通情躍令其子司法者從李將就雇一隸遣往會稽授書于泰發家既至越泰發子弟不敢以人入都乃就令此介自往相府投之既逹于秦忽令問李參政今在何所逺人倉猝遽對云李參政見在全州與王知府鄰居蓋誤以李將為泰發也且云有王法司與李參政親以書付我令來蓋錯愕之際又稱司法為法司也秦怒於是送大理寺根勘行下全州體究李光擅離貶所如何輒敢存留在本州且追王躍并王法司赴獄而全州適有法司人吏姓王者亦與彥恭舍甚邇俱就逮後體究得泰發𥘉未嘗離昌化但誣彥恭以前任過愆除名勒停編管辰州王法司者懵然不知亦勒認贓罪杖脊當時聞者無不四二笑而憐之汪明逺為荆襄宣諭使逆亮遣劉蕚領兵號二十萬侵犯襄漢間荆蕚諸軍屢捷俘虜人多僉軍語我師云我輩皆𬒳虜中僉來離家日父凡告戒云汝見南朝軍馬切勿向前迎敵但只投降他日定放汝歸父兄再有相見之期儻不從誨戒必遭南軍殺戮有聞此語以告明逺者遂與幕僚謀之建議盡根刷俘虜之人借輔以官縱遣北歸歡躍而去乾道改元虜人再來侵犯荆鄂亦出師入北界四三縱遣之人有來為鄉道者諸將皆全璧而歸逆亮篡位之後偶因本朝遣使至其闕廷有畏讋者遂有輕我之心即謀大舉僉刷以北人為兵欲以百萬南攻止得六十七萬以二十七萬侵淮東敵劉信叔亮以四十萬自隨由淮西來與王權相遇而王權之衆不能當在和州對壘權盡遣渡船過南岸與其衆誓云國家飬汝輩許時政要今日以死上報衆皆唯唯兩軍堅壁不動權以二三腹心自隨手執諸軍旗號戒諭諸將云不可妄動且看虜軍有陳腳不固不肅者看吾舉逐軍旗號先舉動虜軍數重之內有紫傘往來傳呼者莫知其意虜軍先來犯陳遇大雨遂退復駐軍于舊寨無一不肅諸將遂語權云虜軍如此我軍如何可戰權云諸公不可説此語今日正當報國之時冝盡死于此不可有一人異議諸將云太尉欲與諸軍死此却將甚軍馬與國家保守江靣權悟其言遂言當從諸人議往南岸叫船渡軍馬還與國家保江却自往朝廷請罪又與諸將計算軍馬渡江有殿後者必為虜騎所追合損折一軍半人馬又要一將殿後統制官時俊云願為殿後保全軍馬過江衆服其勇王琪是時為護聖馬軍統制亦同行云所部軍馬乃主上親隨太尉不可失却他一人一騎遂令護聖馬軍先渡諸軍次第而濟虜騎果下馬來追襲時俊牌手當之幸所失不致如算之數諸軍遂就采石各上戰艦以備虜人權為樞密行府押詣朝廷竄于海外逆亮築臺江岸刑白馬祭天自執紅旗麾諸軍渡江行至中流為采石戰艦迎敵時俊在舟中令軍士以寸札弩射虜人赴水者多盡皆退走亮知江岸有備遂全軍過楊州軍士奏凱未及登岸虞丞相允文以參贊軍事偶至采石遂與王琪報捷于朝虞自中書舍人除兵部尚書自此遂柬眷知琪除正任觀察使諸將在江中獲捷者亦皆次第而遷水軍統制盛新功多而獲賞最輕一鬱而死建康采石軍士至今憐之次年春初明清從外舅起帥合肥道出采石親見將士言之直書其語不復潤色以文云隆興初有胡昉者大言夸誕當國者以為天下竒才力加薦引命之以官曾未數年為兩浙漕一日語坐客云朝廷官爵是買吾曹之頭顱豈不可畏四五適聞人伯卿阜民在坐末趍前云也買脫空胡默然前録載湯進之封慶國公也明清嘗陳之章聖之初封湯始疑以為未然於史館檢閲然後封章其所上劄子乃云自天聖以來未有敢以為封者然又不知宣和中王黼白蒙亨皆嘗受而失於辭避是四六不曾詳於稽考也明清晚識遂初尤延之先生一見傾蓋若平生歡借舉引重恩誼非輕公任文昌一日忽問云天臨殿在於何時邪明清云自昔以來蓋未有之紹聖初米元章為令畿邑之雍丘遊治下古寺寺僧指方丈云頃章聖幸亳社千乘萬騎經從嘗愒宿于中元章即命彩飾建鴟嚴其羽衛自書榜之曰天臨殿時吕升卿為提點開封府縣鎮公事以謂下邑不白朝廷擅創殿立名將按治之蔡元長作內相營救獲免聞有自製殿贊恨未見之尤即從袖間出文書乃元章所書贊也云才方得之公可謂博物洽聞矣翌日入省形言稱道于稠人廣衆中焉樓大防作夕郎出示其近得周文矩所畫重屏圖祐陵親題白樂天詩于上有衣中央帽而坐者指以相問云此何人邪明清云頃歲大父牧九江於廬山圎通寺撫江南李中主像藏于家今此繪容即其人文矩丹青之妙在當日列神品蓋畫一時之景也亟走介往會稽取舊收李像以呈似靣貌冠服無豪髮之少異因為跋其後樓深以賞激繼而明清丐外得請以詩送行後一篇云遂初陳迹遽凄涼擊節青箱極薦揚談笑於儂情易厚典刑使我意差強重屏唐畫論中主古殿遺文話阿章舊事從今向誰問尺書時許到淮鄉明清前年厠迹蹕路假居于臨安之七寶山俯仰顧眄聚山林江湖之勝于几案間襟懷灑然記憶舊聞纂揮麈後録既幸成編去歲請外從欲贅丞海角涉筆之暇無所用心省之胸次隨手濡毫又獲數十事不覺盈帙漫名曰揮麈第三録凡所聞見若來歷尚晦本末未詳姑且置之以待乞靈于博洽之君子然後敢書斯亦習氣未能掃除猶雞肋之餘味耳慶元初元仲春丁巳明清重書于吳陵官舍佳客亭揮麈第三録卷之三
