front:
  text: 揮麈後録餘話卷之一
  hash: sha256:08db666185738c4b6fdcdc5b3295a859ccb371f3098b1afd35d40fe5f02410f5
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_022-1a}
body:
  text: 朝請大夫主管台州崇道觀汝隂王明清永昌陵卜吉命司天監苗昌裔往相地西洛旣覆土昌裔引董役内侍王繼恩登山巔周覧形勢謂繼恩云太祖之後當再有天下繼恩黙識之太宗大漸繼恩乃與參知政事李昌齡樞宻趙鎔知制誥胡旦布衣潘閬謀立太祖之孫惟吉適洩其機吕正惠時爲上宰鎻繼恩而迎真宗于南衙即帝位繼恩等尋悉誅竄前人巳嘗記之熈寧中昌齡之孫逢登進士第以能賦擅名一時吴伯固編三元衡鑑祭九河合爲一者是也逢素聞其家語與方士李士寧毉官劉育熒惑宗室丗居共謀不軌旋皆敗死詳見國史靖康末趙子崧守陳州子崧先在邸中剽竊此說至是適天下大亂二聖北狩與門人傳亮等㰱血爲盟以倖非常傳檄有云藝祖造邦千齡而符景運皇天佑宋六葉而生眇躬繼知髙宗巳濟大河皇懼歸命遣其妻弟陳良翰奉表勸進髙宗羅致元帥幕中興後亟欲大用㑹與大將辛道宗争功道宗得其文繳進之詔置獄京口究治得情髙宗震怒然不欲暴其事以它罪竄子崧于嶺外此與夏賀良赤精子之言劉歆易名以應符䜟何以異哉豈知接千歳之統帝王自有真邪熈寧初王荆公力薦常夷父乞以种放之禮召之上云放軰詩酒自娯而巳豈有經丗之才如常秩肯來朕當以非常之禮待之故制詞云幡然斯來副朕虗佇蓋宣德音也靖康初李伯紀薦任申先丗初自布衣錫對欽宗忽問云卿在前朝曾上書乞取燕雲丗初云誠有之臣是時爲見遼國衰弱謂我若訓練甲兵遟以歳月乗此機㑹可以盡復燕雲舊地初非欲結小羗擣其巢穴此書尚在可賜睿覧上云曾見之使如卿言燕雲之地何患不得繼以歎息即批出賜進士出身自是進用丗初伯雨之子也髙宗應天中興之初大臣有薦瀘州草澤彭知一者有康濟之略隱居鳯翔府得旨令守臣錢蓋等津發至行在所旣入朝廼以所燒金及藥術爲獻詔云朕不忍燒假物以誤後人仰三省發遣赴元來去處日下施行仍將燒金合用什物於街市搥毀建炎已酉以葉夢得少緼爲左丞纔十四日而爲言者所攻而罷其自記奏對聖語備列于後一日進呈知婺州蘇遟奏乞减年額上供羅聖訓問祖宗額幾何臣等對皇祐編勑一萬匹問今數幾何臣等指蘇遟奏言平羅婺羅花羅三等共五萬八千七百九十七疋聖訓驚曰苦哉民何以堪臣等奏建炎赦書諸崇寧以後增添上供過數非祖宗舊制自合盡罷今遟奏乞减一半聖訓曰與盡依皇祐法臣等奏今用度祖宗時不同却恐减太多用度不足即不兔再拋買或致失信欲且與减二萬疋并八千有零數臣等奏陛下至誠䘏民可謂周盡聖訓復云如此好事利益於民一日且做得一件一年亦有三百六十件臣等退御筆即從中出曰訪聞婺州上供羅舊數不過一萬疋崇寧以後積漸增添幾至五倍近歳無本錢皆出科配乆爲民病深可矜恤今後可毎年與减二萬八千匹并零數者爲永法仍令本州及轉運司毎年那融應副本錢足備臣等即施行車駕初至臨安府霖雨不止一日臣等奏事畢因言州治屋宇不多六宫居必隘窄且東南春夏之交多雨蒸潤非京師比聖訓曰亦不覺窄但卑濕爾然自過江百官六軍皆失所朕何敢獨求安至今寢処尚在堂外當竢將士官局各得所居迁從之人稍有所歸朕方敢迁入寢臣等皆言聖心如此人情孰不感動車駕始至臨安府手詔郎官以上悉皆許薦人材蓋特恩也一日進呈侍從官等奏狀聖訓諭臣等曰今次所薦人材不比已前當須擇其可取者便擢用之乃命並召赴都堂審察翌日復命臣等曰郎官等所薦士不若便令登對朕當親自延見之早朝退遍閱諸処章奏未嘗閑今後進膳罷令後殿引見及晚朝前皆可引三班庻得欵曲臣等奏但恐上勞聖躬若陛下不倦接見踈逺捜訪賢能天下幸甚於是再批旨行下一日初進對聖訓首言陳東歐陽徹可贈一官并与子或弟一人恩澤始罪東等出於倉猝終是以言責人朕甚悔之今方降詔使士庻皆得言事當使中外皆知此意臣等即奉詔言甚善聖訓復曰馬伸前此責去亦非罪可召還或曰聞伸巳死聖訓曰不問其死但朝廷召之以示不以前責爲罪之意乃問伸自何官責臣等皆曰自衛尉少卿聖訓曰可復召爲衛尉少卿臣等奉詔而退東等於是皆贈官及与子或弟恩澤一人并詔所居優䘏其家進呈湖州民王永從進錢五十萬緡优囯用臣等言户部財用稍集亦不至甚闕聖訓曰如此即安用徒有取民之名却之或曰巳納其伍万緡矣今却之則前後異同聖訓曰旣不闕用可併前巳納還之仍詔今後富民不許陳獻臣等皆言聖慮及此東南之民聞風當益感恱一日聖訓諭臣等言過江器械皆散亡甲所失尤多朕毎躬擐甲胄閱武於宫中以勵衛士乃知舊所造甲有未盡善如披膊皆用鐵臂肘幾不可引以當胸緩急如何屈伸今皆親自裁定損益與舊不同極便於施行令兩浙路諸州分造甲五十副一以新様爲之臣等皆言陛下留意武事前所未講盡經聖慮此前史所以稱漢宣帝器械技巧皆精其能朝退内出新様甲一副示臣等舊轉肘鐵葉處皆易以皮屈伸無不利便佗皆類此其後陳東歐陽徹俱贈袐撰各又官其二子仍賜田十頃髙宗建炎二年冬自建康避狄幸浙東初度錢塘至蕭山有列拜于道側者揭其前云宗室趙不衰以下起居上大喜頋左右曰符兆如是吾無慮焉詔不衰進秩三等是行雖渉海往返然天下自此大定矣不衰即善俊之父此與太宗征河東宋捷之祥一也是時選御舟槹工又有趙立畢勝之䜟建炎庚戍正月三日髙宗航海次台州之章安鎮落帆于鎮之祥符寺前屏去警蹕易衣徒歩登岸時長老者方陞座道祝聖之祠帝趾忽前聞其稱讃之語甚喜戒左右勿令驚惶而諦聽之少焉千乗万騎畢集始知爲六飛臨幸野僧初不閑禮節恐怖失措從行有司始教以起居之儀李承造升之云紹興中趙元鎮爲左相一日入朝見自外移竹栽入内奏事畢亟往視之方興工於隙地元鎮詢誰主其事曰内侍黃彦節也元鎮即呼彦節詬責之曰頃歳艮嶽花石之擾皆出汝曹今將復蹈前轍邪命勒軍令狀日下罷役彦節以聞于上翌日元鎮奏事上喻曰前日偶見禁中有空地囙令植竹数十竿非欲以爲苑囿然卿能防㣲杜漸如此可謂尽忠爾後儻有似此等事勿憚以警朕之不逮也彦節自云沈之才者以碁得幸思陵爲御前祗應一日禁中與其類對奕上喻曰切須子細之才遽曰念兹在兹上怒云技藝之徒廼敢對朕引經邪命内侍省打竹箆二十逐出廉宣仲云秀州外毉張浩自云少隷軍籍甞爲杉清閘官虞候一日晩出郊過嘉興縣忽覩丞㕔赤光照天疑爲回禄亟入視之云趙縣丞之室適免身得雄是誕育孝宗也浩之子樸今爲毉官家于縣橋之西可質焉張浩自云紹興壬子詔知大宗正事安定郡王今畤訪求宗室伯字號七歳以下者十人入宫備選十人中又擇二人焉一肥一癯廼留肥而遣癯賜銀三百兩以謝之未及出思陵忽云更子細觀廼令二人义手並立忽一猫走前肥者以足蹴之上曰此猫偶尓而過何爲遽踼之輕易如此安能任重耶遂留癯而逐肥者癯者乃阜陵也肥者名伯浩後終於温州都監趙子導彦沔云辛巳歳顔亮冦淮江浙震動有處州遂昌縣道流張思廉者人稱爲有道之士言事多驗時李正之大正爲邑尉從而問之思廉以片紙書云孝宗御名乃在位初得之殊不可曉次年阜陵改名正儲登極李正之云明清頃於蔡微處得觀祐陵與蔡元長賡歌一軸皆真迹也今録于後己亥十一月十三日南郊祭天齋宫即事賜太師報本精禋自國南先期清廟宿齋嚴層霄初今上御名同雲霽暖吹俄回海日暹十萬軍容氷作陣九街鴛瓦玉爲簷肅雍顯相同元老行慶均釐四海霑太師臣京恭和雪晴至日日初南帝舉明禋祀事嚴萬瓦溝中寒色在一輪空外曉光暹雲和龍􅎮開氷轍風暖鸞旗拂凍簷共喜天心扶聖悳珠璣更誤寵恩霑展采齊明拱靣南濃雲深入夜更嚴風和不放瓊英落日暖高隨玉漏暹照地神光臨午陛鳴臯仙羽下重簷五門回仗如天上看舉鷄竿雨露霑衮龍朱履午階南大輦鸞鳴羽衛嚴玉􅎮乍回黃道穏金烏初上白雲暹五門曉吹開旗尾萬騎花光入帽簷巳見神光昭感格鶴書恩下萬邦霑飲福初回八陛南凝旒裒對百神嚴睍消塵入康衢潤神應光隨北陛暹丹檻雉開中扇影朱繩鶴下五門簷群生鼔舞明禋畢却憶花飛舞䄂霑清廟齋幄常有詩賜太師巳曾和進禋祀禮成以目擊之事依前韻再進今亦用元韻復賜太師非特以此相困盖清時君臣賡載亦一時盛事耳靈皷黃麾道指南紫壇蒼壁示凝嚴聮翩玉羽層霄下烜赫神光愛景暹爲喜鑾輿回鳯闕故留芝蓋出虬簷禮天要作斯民福解雨今當萬物霑太師以𬒳賜暹字韻詩前後凢三次進和蓋欲示其韻愈嚴而愈工耳復以前韻又賜太師天位迎陽轉斗南千官山立盡恭嚴共欣奠玉煙初逹争奉回鸞日巳暹歸問雪中誰詠䋈冥捜花底自廵簷禮成却喜歌盈尺端爲來麰萬寓霑唐杜甫詩廵簷索共梅花笑蓋雪事也太師臣京題神霄宫下馬神霄第一回晴空宫殿九秋開月中桂子看時落雲外仙軿特地來參差碧瓦切昭回繡户雲輀次第開仙伯九霄曾付託得隨真主下天來神霄玉清萬壽宫慶成卿以使事奉安聖像聞有二詩書幈俯同其韻復賜太師碧落金風爽氣回藂霄乍喜瑞霞開經營欲致黎元福敢謂詩人詠子來曈曚日馭曉光回金碧相冝王府開歩武煙霞還舊觀百神應喜左元來昨日召卿等自卿私第泛舟經景龍江㳺擷芳園靈沼聞卿有小詩今俯同其韻賜太師景龍江静喜安流玉色閑看浴翅鷗巳覺西風頗無事何妨穩泛濟川舟登山想見留雲際賞日還能傍水涯對此巳多重九興先輸黃髮賞黃花錦繡煙霄碧玉山縈紆静練照晴川留連不惜厭厭去雅興難忘旣醉篇上清寳籙宫立冬日講經之次有羽鶴數千飛翔空際公卿士庻衆目仰瞻卿時預榮觀作詩紀實來上因俯同其韻賜太師以下上清講席鬰蕭臺俄有青田萬侣來蔽醫晴空疑雪舞低佪轉影類雲開飜翰清淚遥相續應瑞移時尚不回歸羙一章歌盛事喜今重見謫仙才又上已日賜太師金明春色正芳妍修禊佳辰集衆賢乆矣愆陽罹暵旱沛然膏雨潤農田乗時賸挾花盈帽胥樂何辤酒滿船所頼爕調功有自佇期髙廩報豐年微元長之孫自云當其父祖冨貴鼎盛時悉貯于隆儒亨㑹閣此百分之一二焉國禍家艱之後散落人間不知其幾也祐陵癸巳歳蔡元長自錢唐趣召再相詔特錫燕于太清樓極承平一時之盛元長作記以進云政和二年三月皇帝制詔臣京宥過眚愆復官就第命四方舘使榮州防禦使臣童師敏齎詔召赴闕臣京頓首辤繼𬒳御札手詔責以大義惶怖上道於是飲至于郊曲燕于垂拱殿祓禊于西池寵大恩隆念無以稱上曰朕攷周宣王之詩吉甫燕喜旣多受祉來歸自鎬我行永乆飲御諸友炰鼈膾鯉其可不如古者詔以是月八日開後苑太清樓命内客省使保大軍節度觀察留後帶御器械臣譚稹同知入内内侍省事臣楊戩内客省使保康軍節度觀察留後帶御器械臣賈祥引進使晉州管内觀察使勾當内東門司臣梁師成等伍人緫領其事西上閤門使忠州刺史尚藥局典御臣鄧忠仁等一十三人掌典内謁者職有司請辦具上帝弗用前三日幸太清相視其所曰於此設次於此陳器皿於此置尊罍於此膳羞於此樂舞出内府酒尊寳器琉璃馬瑙水精坡璃翡翠玉曰以此加爵致四方羙味螺蛤蝦鱖白南海瓊枝東陵玉蘂與海物惟錯曰以此加籩頒御府寳帶宰相親王以玉執政以通犀餘花犀曰以此實篚教坊請具樂奏上弗用曰後庭女樂肇自先帝􅊢業大臣未之享其陳于庭上曰不可以燕樂廢政是日視事垂拱殿退召臣何執中臣蔡京臣鄭紳臣呉居厚臣劉正夫臣侯蒙臣鄧洵仁臣鄭居中臣鄧洵武臣髙俅臣童貫崇政殿閱弓馬所子弟武伎引強如格各命以官遂賜坐命宫人擊鞠臣何執中等辤請立侍上曰坐乃坐於是馳馬舉仗翻手覆手丸素如綴又引滿馳射妙絶一時賜賚有差乃由景福殿西序入苑門就次以憇詔臣蔡京曰此跬歩至宣和即昔言者所謂金柱玉户者也厚誣宫禁其令子攸掖入觀焉東入小花逕南度碧蘆叢又東入便門至宣和殿止三楹左右挾中置圗書筆硯古鼎彛罍洗陳几案臺榻􅃮以黒下宇純朱上棟飾緑無文采東西廡側各有殿亦三楹東曰瓊蘭積石爲山峯巒間出有泉出石竇注于沼北有御札静字牓梁間以洗心滌慮西曰凝方後曰積翠南曰瑶林北洞曰玉宇石自壁隱出嶄巖峻立幽花異木扶踈茂宻後有沼曰環碧兩旁有亭曰臨漪華渚沼次有山殿曰雲華閣曰太寧左躡道以登中道有亭曰琳霄垂雲騫鳯層巒不大髙峻俯視峭壁攅峯如深山大壑次曰㑹春閣下有殿曰玉華玉華之側有御書牓曰三洞瓊文之殿以奉髙真旁有種玉縁雲軒相峙臣奏曰宣和殿閣亭沼縱横不滿百歩而修真觀妙發號施令仁民愛物好古博雅玩芳綴華咸在焉楹無金瑱壁無珠璫堦無玉砌而沼池巖谷谿澗原隰太湖之石泗濵之罄澄竹山茶崇蘭香茞葩華而紛郁無犬馬射獵畋游之奉而有鷗鳬鴈鶩鴛鴦鷄䳵龜魚馴馴雀飛而上下無筦絃絲竹魚龍曼衍之戯而有松風竹韻鶴唳鸎啼天地之籟適耳而自鳴其㓗齊清靈雅素若此則言者不根蓋不足恤日午謁者引執中以下入女童樂四百靴𫀆玉帶列排場肅然無敢磬咳者宫人珠籠巾玉束帶秉扇拂壷巾劒鉞持香毬擁御床以次立亦無敢離行失次皇子嘉王楷起居升殿側侍進趍莊重儼若成人臣執中等前賀曰皇子侍燕宗社之慶樂作節奏如儀聲和而繹群臣同樂冝略去苛禮飲食起坐當自便無間執事者以寳器進上量滿酌以賜命皇子宣勸群臣惶恐飲釂又以惠山泉建溪毫琖烹新貢太平嘉瑞闘茶飲之上曰日未晡可命樂殿上笙篁琵琶箜篌方響筝簫登陛合奏宫娥妙舞進御酒上執爵命掌樽者注群臣酒曰可共飲此柸群臣俯伏謝上又曰可觀群臣凭陛以觀又頓首謝又命宫娥撫琴擘阮巳而群臣盡醉臣竊考鹿鳴之什冠於小雅而忠臣嘉賔得盡其心旣醉太平之時醉酒飽德人有士君子之行在昔君臣施報之道在於飲食燕樂之間太清自真祖開宴以迄于今飲食之設供張之盛樂奏之和前此未有勤侑之恩禮意之厚相與無間之情亦今昔所無實君臣千載之遇而臣德輶智殫曾不足仰報萬分昔仲甫徂齊式遄其歸而吉甫作誦穆如清風召􅍑受命錫以圭瓉􅍑拜稽首對揚山休作召公考天子萬壽然則上之施光下之報冝厚而臣老矣論報無所切不自量慕古人之謹稽首再拜誦曰皇帝在衘政若稽首昔周宣王燕嘉吉甫曰來汝京實始予輔厥初有爲唱予和汝式遄其歸逺于吴楚勞還于庭飲至于露旣又享之其開禁禦有來帝車相視其所於此膳羞於此樂舞海物惟錯于以加爼何錫予之實篚及筥簫皷鏘鏘後庭委女帝曰宣和不逺跬歩人昔有言金柱玉戸帝命子攸尔掖尔父乃瞻庭除乃歴殿廡緑飾上棟􅃮朱下宇梁無則雕檻不采組有石巖巖有泉湑湑體道清心於此燕處彼言厚誣何恤何慮帝執帝爵勸酬交舉母相其儀母間笑語有喜惟王飲之俾飫臣拜稽首千載之遇君施臣報式燕且譽臣拜稽首明命是賦天子萬年受天之祜蔡元長所述太清樓特燕記旣列于前又得保和殿曲燕延福宫曲燕二記今復載于左方宣和元年九月十二日皇帝召臣蔡京臣王黼臣越王俁臣燕王似臣嘉王楷臣童貫臣嗣濮王仲忽臣馮熈載臣蔡攸燕保和殿臣蔡鯈臣蔡翛臣蔡鞗東曲水朝於玉華殿上歩西曲水循􅙐醾架至太寧閣登層巒林霄騫鳯垂雲亭景物如前林木蔽䕃如勝始至保和殿三楹楹七十架兩挾閣無綵繪飾侈落成於八月而髙竹崇檜巳森然蓊欝中楹置御榻東西二間列寳玩與古鼎彛器王左挾閤曰妙有設古今儒書史子楮墨右曰日宣道家金櫃玉笈之書與神霄諸天隱文上歩前行稽古閣有宣王石皷歴䆳古尚古鑑古作古傳古博古秘古諸閣藏祖宗訓謨與夏啇周尊彛鼎鬲爵斚卣敦盤盂漢晉隋唐書畫多不知識駭見上親指示爲言其槩因指閣内此藏卿表章字札無遺者命開櫃櫃有朱隔隔内置小匣匝内覆以繒綺得臣所書撰淑妃劉氏制臣進曰札悪文鄙不謂襲藏如此念無以稱報頓首謝抵玉林軒過宣和殿列岫軒天真閣凝德殿之東崇石峭壁髙百丈林壑茂宻倍於昔見過翠翹燕閣諸處賜茶全真殿上親御擊注湯出乳花盈靣臣等惶恐前曰陛下略君臣夷等爲臣下烹調震悸惶怖豈敢啜頓首拜上曰可少休乃出瑶林殿中使馮皓傳旨留題殿壁喻臣筆墨巳具乃題曰瓊瑶錯落宻成林檜竹交加午有隂恩許塵凡時縱歩不知身在五雲深頃之就坐女童樂作坐間賜荔子黃橙金柑相間布列前後命師文浩剖橙分賜酒五行再休許至玉真軒軒在保和西南廡即安妃粧閤命使傳旨曰雅燕酒酣添逸興玉真軒内看安妃詔臣賡𥙷成篇臣即題曰保和新殿䴡秋輝詔許塵凡到綺闈方是時人自謂得見妃矣旣而但畫像掛西垣臣即以謝奏曰玉真軒檻暖如春只見丹青未有人月裏常娥終有恨鑑中姑射未應真須臾中使召臣至玉華閣上手持詩曰因卿有詩况姻家自當見臣曰頃縁葭莩巳得拜望故敢以詩請上大笑妃素粧無珠玉飾綽約若仙子臣前進再拜叙謝妃荅拜臣又拜妃命左右掖起上手持大觥酌酒命妃曰可勸太師臣奏曰禮無不報不審酬酢可否於是持瓶注酒授使以進再坐徹女童去羯皷御侍奏細樂作蘭陵王楊州散古調酬勸交錯上頋群臣曰桂子三秋七里香七里香桂子名也臣楷頃許對曰夌雲九夏兩𡵨秀臣攸曰鷄舌五羊千歳棗臣曰菊英九日萬齡黃乃賡載歌曰君臣燕衎昇平際属句論文樂未央臣奏曰陛下樂與人同不間髙卑日且暮乆勤聖躬不敢安上曰不醉無歸更勸迭進酒行無筭上忽憶紹聖春宴口號二句問曰卿所作否餘句云何臣曰臣所進詩歳乆不記上曰是時以疾告假哲宗召至宣和西閤問所告假者對曰臣有負薪之疾不果預需雲之燕哲宗曰蔡承旨有佳句曰紅臘青煙寒食後翠華黃屋太㣲間不可不赴上曰臣敢不力疾遵奉是日待漏東華哲宗巳遣使詢來否語罷命郝隨持盃以勸凢三酬大醉免謝扶出因沉吟曰記上下句有曰集英班者繼而曰牙牌曉奏集英班日照雲龍下九關紅臘青煙寒食後翠華黃屋太㣲間繼又曰三天樂奏三春曲萬歳聲連萬歳山欲識君臣同樂意天威咫尺不違顔臣頓首謝曰臣操筆注思於今二十年陛下語及方省髣髴然不記一字陛下藩邸巳知臣蓋非今曰豈勝榮幸再拜謝上輪指曰二十四年矣左右皆大驚非聖人孰與夫此臣又謝曰臣𬒳知藩邸受眷紹聖兩朝遭遇臣駑下衰老無毫髪稱報上曰屢見哲宗道卿但爲章惇輩沮忌不及用朕時年八歳垂髻侍側一日哲宗疑慮黙若有所思問曰大臣以謂不當紹𫐠朕深疑之奏曰臣聞子紹父業不當問人何疑之有哲宗駭曰是兒有大志如此由是劉摯吕大防相繼斥逐紹述自此始臣奏曰陛下曲燕御酒樂欣交通而追時惟哲宗付託與紹述之始孝友篤於誠心非臣之幸社稷天下之幸因再拜賀黼巳下皆再拜上又曰嘗記合食與卿否臣謝曰是時大禮禁嚴厨饔不得入貿食端邸蒙陛下賜之臣𬒳遇自兹終身不敢忘又曰崇政殿試卿在西幕詳定時因入持扇求書得二詩皆杜甫所作詩曰户外昭容紫䄂垂瞻御座引朝儀香飄合殿春風轉花覆千官淑景移又五夜漏聲催曉箭九重春色醉仙桃旌旗日暖龍蛇動宫殿風微燕雀髙臣曰崇寧初蒙宣諭扇猶在上曰今尚在也臣曰自古人臣遭遇或以一能一技見知當時名顯後丗臣章句片言二十年前巳蒙収録崇寧以來𬒳遇若此君臣千載盖非一日君之施厚臣之報豐臣無尺寸孤負恩紀但知感涕上曰卿可以安矣臣又奏曰樂奏􅌭紛酒觴交錯方事燕飲上及繼述下及故老若朋友相與衘盃酒接慇懃之歡道舊論新頋臣何足以當臣請序其事以示後丗知今日燕樂非酒食而巳夜漏巳二皷五籌衆前奏丐罷始退十三日臣京序延福宫曲宴記宣和二年十二月癸巳召宰執親王等曲宴于延福宫特召學士承旨臣李邦彦學士臣宇文粹中與示異恩也是日初御睿謨殿設席如外廷賜宴之禮然器用殽品壞竒精緻非常宴比仙韶執樂和音曼聲合變争節亦非教坊工人所能髣髴上遣殿中監蔡行諭旨曰此中不同外廷無彈奏之儀但飲食自如食味果實有餘者自可携歸酒五行以碧玉醆宣諭侍宴諸臣云前此曲宴早坐未甞宣勸今出異數少憇于殿門之東廡晩召赴景龍門觀燈玉華閣飛陞金碧絢耀疑在雲霄間設衢樽鈞樂于下都人熈熈且醉且戲繼以歌誦示天下與民同樂之恩侈太平之盛事次詣穆清殿後入崆峒洞天過霓橋至㑹寧殿有八閤東西對列曰琴碁書畫茶丹經香臣等熟視之自崆峒入至八閤所陳之物左右上下皆琉璃也映徹焜煌心目俱奪閤前再坐小案玉斚珎異如海陸羞鼎又與睿謨不同酒三行甚速起詣殿側縱觀上謂保和殿學士蔡翛曰引二翰苑子細看一一說與諄諭再三次詣成平殿鳯燭龍燈燦然如畫竒偉萬狀不可名言上命近侍取茶具親手注湯擊拂少頃白乳浮醆靣如踈星澹月頋諸臣曰此自布茶飲畢皆頓首謝旣而命坐酒行無筭復出宫人合曲妙舞蹁蹮態有餘妍凢目創見上諭臣邦彦臣粹中曰此盡是嬪御自來翰林不曾與此集自卿等始又曰翰林志誰修太宰王黼奏云承旨李邦彦上頋臣邦彦曰好翰林志可以盡載此事此卿等榮遇臣邦彦謝不敏瓊瑶玉舟宣勸非一上毎親臨視使釂復頋臣某曰李承旨善飲仍數𬒳特勸夜分而罷臣仰惟陛下加惠親賢共享太平肆念詞臣許陪鼎席宗工之末周於待遇略去常儀臣邦彦粹中首膺異數親承玉音俾編載榮遇以侈北門之盛蓋陛下崇儒右文表異鼇禁用示眷瞩之意誠千載幸㑹也竊伏惟念一介㣲臣粤自布衣叨膺識擢凢所蒙𬒳度越倫軰曾㣲毫忽以助山嶽兹侍燕衎咫尺威顔獨誤睿奬至官而不名豈臣糜捐所能稱塞臣切觀文武之盛始於憂勤而逸樂繼之鹿鳴之燕群臣嘉賔得盡其心故天保之報永永無極臣雖么陋敢忘歸羙之義輒揚盛蹟備載千篇使視草之臣知聖主曲宴内務自臣等始謹録進呈伏取進止宣和末祐陵欲内禪稱疾作令召東宫先是欽宗在朱邸每不平諸倖臣之恣横至是内侍數十人擁鄆王楷至殿門時何瓘以殿帥守禁衛仗劒拒之鄆王趍前曰太尉豈不識楷耶瓘指劒以示曰瓘雖識大王但此物不識耳皆皇恐辟易而退始亟趍欽宗入立李子成可乆云建炎庚戍先人𬒳旨脩祖宗兵制書成賜名樞廷備檢今藏于右府其詳巳見後録獨有引文存于家集用録于後臣竊聞祖宗兵制之精者蓋能深鑒唐末五代之弊也唐自盗起幽陵藩鎮竊據外抗王命内擅一方其末流至於朱温以編户殘冦挾宣武之師睥睨王室必俟天子禁衛神䇿之兵屠戮俱盡却迁洛陽乃可得志如李克用王建楊行宻非不忠義旋以遐方孤鎮同盟欲王室皆悲叱憤懣坐視兇逆終不能出一兵内嚮者昭宗親兵旣盡朱温羽翼巳就行宻軰﨑嶇於一邦初務飬練不能遽成此内外俱輕盗臣得志之患也後唐莊宗萃名將握精兵父子轉戰二十餘年僅能㓕梁功成而驕兵制不立弗虞之患一夫夜呼内外瓦解故李嗣源以老將飬痾私第起提大兵與趙在禮合於甘陵返用莊宗直擣大梁之術徑襲洛陽乗内輕外重之勢數日而濟大事其後甘陵舊卒恃功狂肆邀求無窮至一軍盡誅血膏原野而明宗爲治少定如李從珂晉髙祖劉知逺郭威皆提本鎮之兵直入中原而内外拱手聽命者循用莊宗明宗之意也周丗宗知其弊始募天下亡命寘於帳下立親衛之兵爲腹心肘腋之用未及朞年兵威大振敗澤潞取淮南内外兼濟莫之能禦當是時藝祖皇帝歷試諸難親緫師旅應天順人暦數有歸則躬定軍制紀律詳盡其軍製親衛殿禁之名其營立龍虎日月之號功臣勲爵優視公師至檢校官皆令僕臺憲之長封叙父母妻子榮名崇品悉以與之郊祀赦宥先務贍軍不士金幣緍錢無所愛惜然令以威駕峻其等差爲一階一級之法動如行師俾各伏其長待之盡矣爲出戍法使更出迭入無顧戀家室之意殊方異邦不能萌其非心僅及三年巳復更戍爲卒長轉貟之例定其功實超轉資級以彼易此不使上下人情習熟又其下懔懔毎有事新之懼樞府大臣侍便殿專主簿貟限三日畢事命出之後一日迁陟不得少留此祖宗制兵垂法作則大指也器甲精堅日課其藝而無怠惰者矣選爲教首嚴其軍號精其服飾而驕銳出矣中都二防製造兵器旬一進視謂之旬課列置武庫故械器精勁盈牣充積前丗所無至纎至悉舉自宸斷臣下奉行惟恐不及其㝡大者召前朝慢令恃功藩鎮大臣一日而列於環衞皆俯伏駭汗聽命不暇更用侍從館殿郎官拾遺𥙷闕代爲守臣銷累朝䟦扈偃蹇之患於呼吸哦頃之際毎召藩臣朝令夕至破百百年難制之弊使民享安㤗於無窮者宸心巳定利害素分剛斷必行故也其定荆湖取巴蜀浮二廣平江南者前後精兵不過三十餘萬京師屯十萬足以制外變外郡屯十萬足以制内患京師天下無内外之患者此也京師之内有親衞諸兵而四城之外諸營列峙相望此京師内外相制之兵也府畿之營雲屯數十萬之衆其將副視三路者以虞京城與天下之兵此府畿内外之制也非特此也凢天下兵皆内外相制也以勇悍忠實之臣分控西北邊孔道何繼筠守滄景李漢超守關南以拒虜郭進在邢州以禦太原姚内斌守慶州董遵誨守通逺軍以捍西戎傾心委之䜛謗不入來朝必升殿賜坐對御飲食錫賚殊渥事事精豐使邊境無事得以盡力削平東南僣僞諸國者得猛士以守四方而邊境夷狄無内外之患者此也州郡節察防團刺史雖召居京師謂之遥授至於一郡則盡行軍制守臣通判名衘必帶軍州其佐曰簽書軍事及節度觀察軍事推官判官之名雖曹掾悉曰參軍一州稅賦民財出納之所獨曰軍資庫者蓋稅賦本以贍軍著其實於一州官吏與帑庫者使知一州以兵爲本咸知所先也置轉運使於逐路專一飛輓芻粮餉軍爲職不務科歛不抑兼并冨室連我阡陌爲國守財尓緩急盗賊竊發邊境擾動兼并之財樂於輸納皆我之物所以稅賦不増元元無愁歎之聲兵卒安於州郡民庻安於田閭外之租稅足以贍軍内之甲兵足以護民城郭與村郷相資無内外之患者此也一州錢斛之出入士卒之役使令委貳郡者當其事一兵之寡一米之㣲守臣不得而獨預其防㣲杜漸深矣出銅虎符契以發兵驗其機括不得擅興以革僞冒節度州有三印節度印隨本使在闕則納于有司觀察印則長吏用之州印則晝付録事掌用至暮歸於長吏凢節度使在鎮兵杖之屬則觀察属官用本使印判狀焉田賦之屬則觀察屬官用本使印簽狀焉刺屬縣則用州印本使判狀焉故命師必曰某軍節度某州管内觀察等使某州刺史必具此三者言軍則專制兵旅言管内則專緫察風俗言刺史則治其州軍此祖宗損益唐制軍民之務職守之分俾各歸其實也逐縣置尉專捕盗賊濟以縣廵檢之兵不足則㑹合數州廵檢使之兵又不足則資諸守臣兼提舉兵甲賊盗公事與一路帥臣兼兵馬鈐轄者故兵威強盛䑕偷草竊尋即除蕩盖内外相維上下相制若臂運指如尾應首靡不相資也凢統馭施設制度號令人不敢慢者功過必行明於賞罰而已明於賞罰則上下奮勵知所聳動而姦究不敢少踰繩墨之外事必立就也怒蜀大將之貪暴也曹彬獨無所汙自客省使隨軍都監超授宣徽南院使義成軍節度使以賞之御便殿閱武第其藝能連營俱令轉資至於荆罕儒戰死責部將不効命斬石進等二十九人雄武兵白晝掠人於市至斬百軰乃止川班直訴賞則盡戮其將校而廢其班太祖甞曰撫飬士卒不吝爵賞苟犯吾法惟有劒耳然神機所照及物無遺察人之心而人盡死力班大原之師則謂將士曰尓軰皆吾腹心爪牙吾寧不得太原豈忍令害尓軰也或訴郭進脩第用筩瓦如諸王制則曰吾於郭進豈减兒女耶祖宗賞罰雖明有誠心以及物故天下用命兵雖少而至精也逮咸平西北邊警之後兵增至六十萬皇祐之初兵巳一百四十萬矣故翰林學士孫洙號善論本朝兵者其言古者兵一而巳今内外之兵百餘萬而别爲三四又離爲六七也别而爲三四禁兵也廂兵也蕃兵也離而爲六七者謂之兵而不知戰者也給漕輓者兵也服工役者兵也繕河防者兵也供寢廟者兵也飬國馬者兵也疲老而坐食者兵也前丗之兵未有猥多如今日者也前丗制兵之害未有甚於今日者也蓋常率計天下之户口千有餘万自皇祐一歳之入一倍二千六百餘萬而耗於兵者常十八而留州以供軍者又數百萬也緫户口歳入之數而以百萬之兵計之無十户而資一廂兵十畒而給一散卒矣其兵職衛士之給又浮費數倍何得而不大蹙也况積習刓弊又數十年教習不精士氣不振㨂兵則點數而巳宣借則重疊妄濫迯亡巳乆而衣糧自如疲癃無堪而虛名具數元豐中神宗謂宰臣呉充曰祖宗以來制軍有意凢領在京殿前馬歩軍司所統諸指揮置都使虞候分領之凢軍中之事止責分領節度之人則軍衆自齊責之旣嚴則遇之亦優故軍校轉貟有由行伍不乆巳轉至團練使者王者之衆不得不然若諸路則軍校不過各領一營耳周室雖盛至康之後寖巳衰㣲本朝太平百餘年由祖宗法度具在豈可輕改也自昔夷狄横而窺中國者先觀兵之盛衰然則兵備可一日忘哉盖祖宗相承其愛民之實若出一心謂民之作兵者多與兵之仰者衆而民不可重困也故張齊賢欲益民兵吕蒙正曰兵非取於民不可而真宗以深念擾動邊人遂止河東河北旣置義勇軍以韓琦忠亮急於備邊猶欲刺陜西民爲義勇諌官司馬光抗章數十萬言其不可熈寧申命天下教保甲盛於元豐本周官寓兵於農之意聮什伍之民族黨相保舉三路言之凢有百萬人天下稱是旋亦廢置盖兵雖可練而民不可重擾也本朝旣以民作軍矣又求之畎畒則州郡内外皆兵前丗所未有也此祖宗重以民爲兵也臣謹列自建國巳來兵制㳂革與夫祖宗禦戎備邊又諸軍興廢所因詳著於篇者凢二百卷又原祖宗聖意之不見於文字者爲之序然竊甞謂後丗誦帝堯之德惟知茅茨不剪土階三尺而巳至史謂就之如日望之如雲則堯及物之功與天地等矣惟書曰乃聖乃神乃武乃文具是四者堯德乃備則固由所見淺深欤共惟祖宗以聖神文武斡運六合鞭笞四夷悉本於兵其精神心術之㣲盖不在迹然効神宗重規疊矩之盛在本聖心而其迹顧豈能盡今臣之淺拙雖欲紬繹傳載所有不能知也熈寧三年曾宣靖爲昭文相以疾乞解機政乆之除守司空侍中河陽三城節度使集禧觀使王文恭爲内相當制進進草神宗讀至髙旗鉅節遥臨踐土之邦間館珍臺獨揖浮丘之𬒮顧文恭笑云此句甚熟想備下多時文恭云誠如聖訓歸語其子仲修云吾自聞魯公丐去即辦此一聮歎服上之精鍳如此蘇仁仲云𥙿陵懷韓魏公定䇿之勲崇德報功不次擢其子儀公忠彦登禁路未及柄用而魏公薨甚爲不滿故亟用曾宣靖之子令綽執事樞柄時元豐官制初行肇建東西二府俾迎宣靖入居虞侍之爲搢紳之美談後二十年儀公始相祐陵思陵中興興念故家所以富鄭公之孫季申直柔儀公之孫似夫肖胄相繼賜第爲右府又三十年令綽之孫欽道懷亦賜出身登宰席皆近丗衣冠之盛事若蔡元長之於攸秦㑹之之於熺蓋恩澤侯不足道也熈寧中蔡敏肅挺以樞宻直學士帥平涼初冬置酒郡齋偶成喜遷鶯一闋霜天清曉望紫塞古壘寒雲衰草汗馬嘶風邊鴻飜月壟上䥫衣寒早劒歌騎曲悲壯盡道君恩難報塞垣樂盡雙鞬錦帶山西年少談笑刁斗静烽火一把常送平安耗聖主憂邊威靈遐布驕虜且寛天討歳華向晩愁思誰念玉關人老太平也且歡娱不惜金尊頻倒詞成閑歩後園以示其子朦朦寘之䄂中偶遺墜爲譍門老卒得之老卒不識字持令筆吏辦之適郡之娼魁素與筆吏洽因授之㑹賜衣襖中使至敏肅開燕娼尊前執板歌此敏肅怒送獄根治倡之儕類祈哀于中使爲援于敏肅敏肅舎之復令謳焉中使得其本以歸逹于禁中宫女軰但見太平也三字爭相傳授歌聲遍掖庭遂徹于宸聽詰其從來廼知敏肅所製𥙿陵即索𥿄批出云玉關人老朕甚念之樞筦有闕留以待汝以賜敏肅未幾遂拜樞宻副使御筆見藏其孫稹家史言獻肅交結内侍進詞柄用又不同也元祐二年東坡先生入翰林暇日㑹張秦眺陳李六君子于私第忽有旨令撰賜奉安神宗御容禮儀使吕大防口宣茶藥詔東坡就牘書云於赫神考如日在天顧群公曰能代下一轉語否各辭之坡隨筆後書云雖光明無所不臨而躔次必有所舎群公大以聳服導引鼔吹詞蓋亦是時作真迹今藏明清處二事曾國華云富文忠公熈寧二年再相王荆公爲參知政事始用事與文忠不恊文忠力丐去以使相判河南府上章自劾繼改亳州今録于此清時竊禄難迯素食之譏白首佐朝遂起蔽賢之謗幸聖明之洞照舉毫髪以無遺頋此薄材尚容具位中謝切念臣業非經逺識寡通方少因章句之科得偕群俊長脫簿書之秩獲事三朝仁宗之頋遇匪輕英廟之丁寧尤甚旋属大人繼照飛龍在天思肯搆於先基忽遐遺於萬物澗蘋何美雜圭壁以薦羞槽馭巳疲復驊騮之共駕殫力雖勞於負岳小心更甚於履氷果不克堪遂貽彈劾如安石者學強辯勝年壯氣豪論議方鄙於古人措置肯諧於僚黨至使山林末學草澤後生放自得之良心樂人傳之異說蘋蘋者子譊譊其書足以干名足以取貴拖紳朝序者非安石之黨則指爲俗吏圜冠校學者異安石之學則笑爲迃儒嘆古人之不生恨斯文之將喪臣切觀安石平居之間則口筆丘旦有爲之際則身心管啇至乃忽故事於祖宗肆巧譏於中外喜怒惟我進退其人待聖主爲可欺視同僚爲不物臺諌官以兹切齒謂社稷付在何人士大夫罔不動心以朝廷安用彼相爲臣及此事主若何臣非不能秉筆華衮之前而正其非覆身青蒲之上而排其失重念陛下方當淵黙堯舜中和禹湯同天德之尚待人臣之有體徒髙唇吻莫𥙷聦明且區區晉都尚有相先之下佐况赫赫昭代豈有不和之大臣愚念及斯衆言陋此伏乞陛下特申雄斷大决群疑正安石過舉之謬以幸保家邦白臣等後言之罪而俾歸田里如其尚矜㣲朽處以便藩不唯有遂於物情亦以不妨於賢路如是則始終事聖史傳不附於姦朋去就爲臣物議庻歸於直道其臨薨二表尤爲懇切明清家舊有之今不復存東坡先生公神道碑云手封遺表使其子上之者也徐敦立國紀亦載其略至於謂宫闈之臣不可使之專揔兵柄人心不服易以敗事後來童貫之徒是矣韙哉先見之明焉熈寧初司天監亢瑛奏後三十年西南有亂出于同姓是時方議皇族𥙷外官於是詔宗室不得注授川峽差遣至建中靖國初趙諗叛于渝州相距果三十年其言廼驗繼而瑛又言丙午丁未汴都不守乗輿有播遷之厄不可輕改祖宗之法恐致召亂王荆公大怒啓𥙿陵竄瑛英州韓知命云曾文肅十子㝡鍾愛外祖空青公有壽詞云江南客家有寧馨兒三丗文章稱大手一門兄弟獨良眉籍甚衆多推千里足來自渥洼池莫倚善題鸎鵡賦青山須待徤時歸不似傲當時其後外祖果以詞翰名丗可謂父子爲知已也陳禾字秀實四明人政和𥘉爲右正言明目張膽展盡底緼時稱得人徽宗批出除給事中㑹䆠官童貫黃經臣恃貴幸驕險且與中執法盧航相爲表裏搢紳側目莫敢言者禾曰吾備位臺諌朝廷有至可慮者一遷給舎則非其職此而不言後悔何追未受告命即抗䟽上言力陳漢唐之禍不可不戒此隙一開異日有不勝言者惟陛下留意於未然論列旣乆上以日晚頗飢拂衣而起曰朕飢矣禾褰挽上衣泣奏曰陛下少留容臣罄竭愚衷上爲少留禾曰此曹今日受富貴之利陛下佗日受危亡之禍孰爲重輕願陛下擇之上衣𥚑脫落上曰正言碎朕衣矣禾奏曰陛下不惜碎衣臣又豈惜碎首以報陛下其言激切上爲之變色且曰卿能如此朕復何憂内侍請上易衣上止之曰留以旌直節翌日經臣率其黨訴于上前曰國家極治如此安得有此不祥之語繼而盧航上章謂禾一介書生言事狂妄東臺之除旣寢復責授信州監酒乆之自便丐祠奉親還里先是陳瑩中寓居郡中禾交遊日乆又遣其子正彚來從學後瑩中論列蔡元長得􅓧禾上書力爲救解及正彚告發蔡氏事父子俱就逮監獄者知瑩中與禾游謂言必自禾發移文取證禾荅以事誠有之罪不敢迯人謂禾曰豈冝以實對禾曰禍福死生吾自有處豈肯以一死易不義耶儻得分賢者􅓧固所願也朝廷指以爲黨勒停宣和中起守龍舒以卒事見髙抑崇閌所述行狀紹熈間史直翁再相上其所著易與春秋傳特官其孫近脩四朝史無人爲之立傳此節義遂失傳於後丗可勝太息林子忠有野史一編丗多傳之其間議論與平日所爲極以背馳殊不可曉豈非知公論不可揜欲蓋其迹於天下後丗耶東坡先生雖竄斥于紹聖元符然元祐中黃慶基趙君錫賈易之徒巳摘取其所行訓詞中語以爲詆誣後來施行蓋權輿於是史冊可以具考近人作好事如鄭介夫鄒志完陳瑩中士林每以爲佳話然如王和父之救東坡先生江民表之乞不深治蔡邸獄豐相之於祐陵前辯元祐諸公之無罪方軫之上書力詆蔡元長之失雍孝聞之奉廷對李彪之擬賢良䇿數二蔡之姦二人者俱罹刑辟之類尚多皆人之所難言惜乎丗人之不盡知也成都人景煥野人閑話蓋乾德三年所𫐠其間載蜀後主一條今録於後蜀後主孟氏諱昶字保元尊號睿文英武仁聖明孝皇帝道號玉霄子承髙祖纂業性多明敏以孝慈仁義在位三紀巳來尊儒尚學貴農賤啇𥘉用趙季良母昭裔知政事李仁學趙廷隱等分主兵權李昊徐光浦掌牋檄王處回爲樞要無可政教壅滯恩澤雜遝一但赫怒誅權臣張業出王處回自命二相李昊徐光浦開獻納院創貢舉埸不十餘年山西潭隱者俱起肅肅多士赳赳武夫亦一方之盛事城内人生三十歳有不識米夌之苗者毎春三月夏四月有遊浣花香錦浦者歌樂掀天珠翠闐咽貴門公子乗彩舫遊百花潭窮奢極麗諸王功臣巳下皆置林亭異果名花小類神仙之境兵部王尚書珪題亭子詩其一聮曰十字水中分島嶼數重花外見樓臺皆此類也自大軍収復蜀主知運數有歸尋即納𣢾識者聞之嘉歎蜀主能文章好博覧知興亡有詩才嘗爲箴誡頒諸字人各令刋刻於坐隅謂之頒令箴曰朕念赤子旰食宵衣託之令長撫飬惠綏政在三異道在七絲驅雞爲理留犢爲規寛猛得所風俗可移無令侵削無使瘡痍下民易虐上天難欺賦與是切軍國是資朕之賞爵固不踰時尓俸尓禄民膏民脂爲民父母莫不仁慈勉尓爲誡體朕深私治平中張次功著蜀檮杬亦書是箴與此一同章獻明肅初自蜀中汎江而下舟過真州之長蘆有閩僧法燈者築茅庵岸旁燈一見聽其歌聲許以必貴倒囊津置入京繼遂遭際及位長樂燈尚在后捐奩中百萬緡命淮南兩浙江南三路轉運使創建大刹工巧雄麗甲于南北俾燈住持賜予不絶李邯鄲爲之碑至今存焉皇祐初名僧谷全號全大道以道行價重禪林住廬山圎通寺忽一男子貨藥入山自云帝子全見其狀皃頗異厚資其行使徃京師自陳鞫治得其妄廼都人冷緒之男青也誅之全坐黥配郴州郡中令荷築城之土經歳當盛暑忽弛檐布中作頌云今朝六月六老全受罪足若不登天堂定是入地獄言訖跌坐而化郡人即其地建塔焉事有相類而禍福不侔如此者徐敦立國紀廼云全與青俱弃市誤矣王文穆欽若以故相來守杭州錢唐一老尉蒼顔華髪矣文穆初甚不樂詢其履歴乃同年生惻然哀之遂封章于朝詔特改京秩尉以詩謝之云當年同試大明宫文字雖同命不同我作尉曹君作相東君元没兩般風眺武子云章俞者郇公之族子早歳不自拘檢妻之母楊氏年少而寡俞與之通巳而有娠生子初産之時楊氏欲不舉楊氏母勉令留之以一合貯水緘置其内遣人持以還俞俞得之云此兒五行甚佳將大吾門雇乳者謹視之旣長登第始與東坡先生締交後送其出守湖州詩首云方丈仙人出渺茫髙情猶愛水雲郷以爲譏巳由是怨之其子入政府俞尚無恙甞犯法以年八十勿論事見神宗實録紹聖相天下坡渡海盖脩報也所謂燕國夫人墓獨處而無祔者即楊氏也章房仲云元豐末章子厚爲門下侍郎以本官知汝州時錢穆父爲中書舎人行告詞云鞅鞅非少主之臣悻悻無大臣之操子厚固怨之矣元祐間穆父在翰苑詔書中有不容群枉規欲動揺以指子厚尤以切齒紹聖初子厚入相例遭斥逐穆父旣出國門蔡元度餞别因誦其前聮云公知子厚不可撩撥何故詆之如是穆父愀然曰鬼劈口矣元度曰後來代言之際何故又及之穆父笑曰郍鬼又來劈一劈了去朱希真先生云周羙成邦彦元豐𥘉以太學生進汴都賦神宗命之以官除太學録其後流落不偶浮沈州縣三十餘年蔡元長用事美成献生日詩略云化行禹貢山川内人在周公禮樂中元長大喜即以袐書少監召又復薦之上殿契合詔再取其本以進表云六月十八日賜對崇政殿問臣爲諸生時所進先帝汴都賦其辝云何臣對曰賦語猥繁歳月持乆不能省憶即勑以本來進者雕虫末技巳玷國恩芻狗塵言再干睿覧事超所望憂過於榮切惟漢晉以來才士軰出咸有頌述爲國光華兩京天臨三國鼎峙竒偉之作行於無窮共惟神宗皇帝盛德大業卓髙古初積害悉平百廢具舉朝廷郊廟罔不崇飾倉廪府庫罔不充仞經術學校罔不興作禮樂制度罔不釐出攘狄片地罔不留行理財禁非動恊成筭以至鬼神懷鳥獸若縉紳之所誦習載籍之所編記三五以降莫之與京未聞承學之臣有所歌詠於今無傳視古爲愧臣於斯時自惟徒費學廪無益治丗萬分之一不揣所堪裒集盛事鋪陳爲賦冒死進投先帝哀其狂愚賜以首領特從官使以勸四方臣命薄數竒旋遭時變不能俛仰取容自觸罷廢漂零不偶積年于兹臣孤憤莫伸大恩未報毎抱舊藁涕泗横流不啚於今得望天表親承聖訓命録舊文退省荒蕪恨其少作憂懼怕惑不知所爲伏惟陛下執道御有本於生知出言成章匪由學習而臣也欲晞雲漢之麗自呈繪畫之工唐突不量誅死何恨陛下德侔覆燾恩浹飛沉致絶異之祥光出乆幽之神璽豐年屢應瑞物畢臻方將泥金泰山鳴玉梁父一代方冊可無述焉如使臣殫竭精神馳騁筆墨方於兹賦尚有靡者焉其元豐元年七月所進汴都賦并書共二䇿謹隨表上進以聞表入乙覧稱善除次對内祠其後宣和中李元叔長民獻廣汴都賦上亦甚喜除袐書省正字元叔定之孫也栁色黃金嫰梨花白雪香隂鏗詩也李太白取用之杜子羙太白詩云李白有佳句往往似隂鏗後人以謂以此譏之然子羙詩有蛟龍得雲雨鵰鶚在秋天一聮巳見晉書載記矣如氷肌玉骨清無汗水殿風來暗香滿孟蜀王詩東坡先生度以爲詞昔人不以蹈襲爲非南部煙花録夕陽如有意偏傍小䆫明唐人方域詩新唐書藝文志有方域詩一卷煙花録一名大業拾遺記文詞極悪可疑而大業幸江都記自有十二卷唐著作郎杜寳所纂明清家有之永平時楊州印本也沈睿逹遼文通之同包長於歌詩尤工翰墨王荆公曾文肅學其筆法荆公得其清勁而文肅傳其眞楷登科後㳺京師偶爲人書帬帶詞頗不典流轉鬻于相藍内侍買得之逹于九禁近幸嬪御服之遂塵乙覧時𥙿陵初嗣位勵精求治一見不恱㑹遣監察御史王子韶察訪兩浙臨遣之際上喻之曰近日士大夫全無顧藉有沈遼者爲倡優書淫冶之辭于帬帶遂逹朕聽如此等人豈可不治子韶抵浙中適睿逹爲呉縣令子韶希旨以它罪劾奏時荆公當國爲申解之上復伸前說竟不能釋疑遂坐深文削藉爲民其後卜居池陽之齊山有集號雲巢編行於丗揮麈餘話卷之一
