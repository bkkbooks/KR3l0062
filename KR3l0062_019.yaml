front:
  text: 揮塵第三録卷之二七汝隂王明清元祐中舒州有李亮工者以文鳴薦紳間與蘇黃遊
  hash: sha256:00090a9debd9f7d552da066d33eaa3344486a2c10932c5143f7c5a53188b1d2f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_019-1a}
body:
  text: 兩集中有與其唱和而李伯時以善丹青妙絶冠丗且好古博雅多收三代以來鼎彛之類為考古圖又有李元中字畫之工追蹤鍾王時號龍眠三李同年登進士第出處相若納以先貴毋相忘其八後位俱不顯先大父大觀𥘉從郎曹得守九江自鄉里汝隂之官有同年生宋景瞻者姑溪人其子惠直為德化縣主簿迎侍其父以來先祖愛其清修好學甚前席之教以習宏詞科日與出題以其所作來呈不復責以吏事會王彥昭渙之出帥長沙令作樂語以燕犒之時有王積中者知名士也以特起為僉書節度判官且俾預席其藁不存但記憶三聮云少年射䇿有賈太傅之文章落筆驚人繼沈中丞之翰墨從來汝頴之間固多竒士此去瀟湘之地逢故人况有錦帳之郎官來為東道且邀紅蓮之幕客共醉西園先祖讀之大喜以謂句句著題薦之于時相何清源即除書局已而中詞科自此聲名籍甚惠直字子溫其子乃貺也紹興間鼎貴亦不復相聞今又未知其子孫猶知之否九江有碑工李仲寧刻字甚工黃太史題其居曰瑑玉坊崇寧初詔郡國刋元祐黨籍姓名太守呼仲寧使劖之仲寧曰小人家舊貧寠止因開蘇內翰黃學士詞翰遂至飽暖今日以姦人為名誠不忍下手守義之曰賢哉士大夫之所不及也餽以十酒而從其請宣和中蘇叔黨遊京師寓居景德寺僧房忽見快行家者同一小轎至傳旨宣召亟令登車叔黨不知所以然不敢拒才入則以物障其前惟不設頂上以小涼傘敝之二人肩之其疾如飛約行十餘里抵一修廊內侍一人自上而下引之升一小殿中上巳先坐披黃背子頂青玉冠宫女環侍莫知其數弗敢仰窺始知為崇髙莫大之居時當六月積氷如山噴香若煙霧寒不可忍俯仰之間不可名狀起居畢上喻云聞卿是蘇軾之子善畫窠石適有素壁欲煩一掃非有它也叔黨再拜承命然後落筆須臾而成上起身縱觀賞歎再三命宫人捧賜釂酒一鍾錫賚極渥拜謝而下復循廊間登小輿而出亦不知經從所歷何地但歸來十一如夢復如癡也胡元功云徽宗靖康𥘉南幸次京口駐蹕郡治外祖曾空青以江南轉運使來攝府事應辦忽宣至行宫上引至深邃之所問勞勤渥命喬貴妃者出焉上回顧語喬曰汝在京師每問曾三此即是也特令汝一識耳蓋外祖少年日喜作長短句多流入中禁故爾取七寶杯令喬手擎滿酌并以杯賜之外祖拜貺而出明清少依外氏寶杯猶及見之今不十二知流落何所錢遜叔伯言穆父之子臨政有風采知宿州日有虹縣士民陳詞舉留邑宰宰貪酷之聲遜叔先巳聞之至是衆趨廷下遜叔令吏卒舉挺擊出左右言似不須如此遜叔笑云彼中打將來此間打回去蘇仁仲云曾文肅熙寧初為海州懷仁令有監酒使臣張者小女甫六七歲甚為惠黠文肅之室魏夫人憐之教以誦詩書頗通解其後南北睽隔紹聖𥘉文肅柄事樞時張氏女已入禁中雖無名位以善筆札掌命令之出入忽與夫人相聞夫人以夫貴疏封􅌡國稱壽禁庭始相見敘舊自後歲時遣問夫人沒張作詩以哭云香散簾幃寂塵生翰墨間空傳三壼譽無復內朝班從此絶迹矣後四十年靖康之變張從昭慈聖獻南渡至錢唐朱忠靖筆録所記昭慈遣其傳導反正之議張夫人者即其人也年八十餘終先娘子云劉季髙岑未逹時詹安丗度帥中山以貧甚携王履道書往謁之既至彼館勞甚至酒食遊戲徴逐無虛日而略無一語及他時河北盜賊已充斥留連逾月季髙興懷歸之念因漫扣之詹云足下之來何幹度豈不能曉其敢苦相挽留耶少刻便令差將兵二百防護行李以濟犬河乃回三日之間餽十五餉稠疊所得凡萬緡云姚令則云靖康丙午真戎亂華次歲之春京城不守恣其號舞妄有易置時秦會之為御史中丞陳議狀云檜切緣自父祖以來七丗事宋身為禁從職當臺諌荷國厚恩甚愧無報今大金重擁甲兵臨已拔之城操生殺之柄威制官吏軍民等必欲滅宋易姓檜忘身盡死以辨非理非特忠其主也欲明聖朝之利害爾趙氏自祖宗以至嗣君一百七十餘年功德基業比隆漢唐實異兩晉頃緣姦臣叛盟結怨鄰國謀臣失計誤主喪師遂致生靈被禍京都失守嗣君皇帝致躬出郊埛求和於軍前兩元帥並議巳布聞於中外矣且空竭帑藏居民之所積追取鑾輿服御之所用割兩河之地共為臣子今乃變異前議自敗斯盟致二主銜怨廟社將傾為臣之義安得忍死而不論哉自宋之於中國號令一統綿地數萬里覆載之內疆場為大子孫蕃衍充創四海德澤在外百姓安業前古未有興亡之命雖在天有數焉可以一城而決廢立哉新室篡奪東漢中興於白水東漢絶於曹氏劉備王蜀唐為朱溫竊取李克用父子猶推其丗序而繼之蓋繼志之德澤在人者淺深根基堅固雖陵遲之甚然四海英雄必畏天之威而不敢窺其位古所謂基廣則難傾根深則難拔之謂也西晉武帝因宣景之權以窺魏之神器德澤在人者淺加以惠帝昏亂五王爭柄自相殘戮故劉淵石勒以據中原猶賴王導溫嶠輩輔翼元皇江左之任踰於西京石勒欺天罔上交結外邦以篡其主晉於天下也得之以契丹少主失德任用非人而忘大恩曽無德澤下及黎庶特以中國藩籬之地以贍戎人天下其何思之哉此契丹所以能滅晉也宋之有天下九丗宥德比隆漢唐實異兩晉切觀今日計議之士多前日大遼亡國之臣畫䇿定計所以必滅宋者非忠於大金也假滅大宋以報其怨尓曽不知滅大遼者大金大宋共為之也大宋既滅大金得不防間其人乎頃者上皇誤聽姦臣李良嗣父兄之怨滅契丹盟好之國乃有今日之難然則因人之怨以滅人之國者其禍不可勝言繆為計者必又曰滅宋之國在絶兩河懷舊之恩除鄰國復仇之志而已又曰大金兵威無敵天下中國之民可指揮而定若大金果能滅宋兩河懷舊之恩亦不能忘果不能滅宋徒使宋人之宗屬賢德之士唱義天下竭國力以北向則兩河之民雖異日撫定之後亦將去大金而歸宋矣且天生南北之方域志異也晉為契丹所滅周丗宗復定三關是為晉祚報恨然則今日之滅趙氏豈必趙氏然後復仇哉雖中原英雄亦將復報中國之恨矣檜今竭肝膽捐軀命為元帥言廢立之義以明兩朝之利害伏望元帥不恤群議深思國計以辨之於朝若或有讒佞之言以矜己功能傷敵國之義適貽患於異日矣又况禍莫大於滅人之國昔秦滅六國而六國滅之符堅滅燕而燕滅之頃童貫蔡攸貪土地以奉主欲營私而忘國計屯兵境上欲滅大遼以取燕雲之地方是時也契丹之使交馳接境祈請於前為貫攸之計冝偽許而從其請乃欲邀功以兼人之地遂貽患於主而宗廟危今雖焚尸戮族又何益哉今元帥威震中原功髙在昔乃欲用讎間之論矜一巳之功其於國計亦云失矣貫攸之為可不鑒哉自古兵之強者固有不足恃劉聰石勒威足以制愍懷而銼於李矩數千之衆符堅以百萬之師衄於淝水之孤旅是兵強而不足恃也大金自去歲問罪中國入境征伐已踰歲矣然所攻必克者無他以大金久習兵革中國承平百年士卒弛練將佐不得其人而然也且英雄丗不乏材使士卒異日精練若唐藩鎮之兵將相得人若唐肅代之臣大金之於中國能必其勝負哉且丗之興亡必以有德代無德以有道而易無道然後皇天佑之四海歸之若張邦昌者在上皇時專事燕遊不務規諌附會權幸之臣共為蠹國之政今日社稷傾危生民凎炭雖非一人所致亦邦昌之力也天下之人方疾之若仇讎若付以土地使主人民四方英豪必共起而誅之非特不足以代宋亦不足以為大金之屏翰矣大金必欲滅宋而立邦昌者則京師之民可服而天下之民不可服京師之宗子可滅而天下之宗子不可滅檜不顧斧越之誅戮族之患為元帥言兩朝之利害伏望元帥稽考古今深鑒斯言復君之位以安四方之民非特大宋蒙福實大金萬丗之利不勝皇恐懇告之至第二狀云檜巳具壯申大元帥府外有不盡之意不敢自隱今更忍死瀝血上干台聽伏念前主皇帝違犯盟約既巳屈服而今日存亡繼絶惟在元帥不然則有監國皇太子自前主恭命出郊以來鎮撫居民上下帖然或許就立以從民望若不容檜等伸臣子之情則望賜矜念趙氏祖宗並無失德內外親賢皆可擇立若必擇異姓天下之人必不服從四方英雄必致雲擾生靈塗炭卒未得蘇檜等自知此言罪在不赦然念有宋自祖宗以來德澤在人於今九丗天下之人雖匹夫匹婦未忍忘之又况檜等丗食君祿方今主辱臣憂之時上為宗社下為生靈苟有可言不敢逃死伏望台慈更賜矜察無任哀懇痛切皇恐隕越之至此書得之于丹陽蘇著廷藻云頃為秦之孫塤客因傳其本詞意忠厚文亦甚竒使會之誠有此而無紹興再相擅國罔上專殺尚威則謂非賢可乎昔人有詩云周公恐懼流言後王莽謙十六恭未篡時若使當時身便死一生真偽有誰知靖康末虜騎渡河直抵京城危蹙之甚欽宗命王幼安襄為西道揔管招集勤王之師以為救援幼安辟先人為幹當公事先人為草檄文朝四丈以以道讀之激賞不已云此出師表也今録于後叛服者夷狄之常性勢有汙隆忠義者臣子之大方道無今古矧黃屋有阽危之慮而赤縣無援助之師念聖神施德於九朝方黎庶痛心於四海敢緣尺牘盡露肺肝在昔髙帝被圍於平城文皇求盟於渭水將相失色智勇吞聲蓋自竹帛已來有斯妖孽之類致鬼區獸夷之肆暴豈人謀神理之能容蠢彼小羌尤為遺燼聲教僅通於上國名號不齒於四夷緣威懷之並施乃信義之俱棄聖上天臨万宇子育群生霄憂兼夷夏之心夕惕紹祖宗之業宣恩屈己猶負固以跳梁繼好息民更執迷而猖蹶始鴟張於沙漠再豕突於帝畿既邊圍之弛防又廟堂之失䇿窫窳旁吞於黑水攙搶直拂於紫躔睥睨望萬雉之墉蹂踐連千里之境鯨鯢我郡邑魚鱉我人民氛祲煙塵共起熖天之勢衣冦士庶咸罹塗地之冤赤子何辜蒼天不弔冦攘驅掠不可數知焚蕩傷夷動以万計然而天惟助順神必害盈終無摩壘之兵僅保傅城之衆能接歲而再至既經時而何施今則脊尾俱搖腹背受敵舊地皆失內潰有強鄰之侵衆心自離外隳無諸國之助咸聞氣奪尚敢尸居匪惟難犯於金湯固已自迷於巢穴鼠無牙而穿屋情狀可知羊羸角以觸藩進退不果尚假息遊魂於城下巳叩閽請命於軍中而况六師用壯以方張諸將不謀而問會熋羆之旅則帶甲百萬騄驥之足則有騋三千人知逆順而四靣聲馳士識恩讎而方萬響動務施逺略必解長圍速勞貔虎之師盡掃犬羊之衆嘯聚之黨將就戮除噍類之徒尋當殄滅涓時並進旨日克平義動顯幽包胥泣秦庭之血誠開金石霽雲射浮圖之甎盍思古人謂誓死起救於將顛勿令後日譏擁兵坐觀而不赴某恭被睿算外總戎昭籌筆非良敢效流馬之運輪蹄並進盡提水犀之軍戈矛相望於道塗舳艫銜尾於淮海巳浮楚澤前壓師濵誓資衛社之何盟共濟勤王之盛舉望龍虎之氣行瞻咫尺之天聽鳥烏之聲益勞方寸之地同扶王室各奉天威誓為唇齒之依期壯輔車之勢共惟某官誠深體國義切愛君忠孝貫於神明威名懾於夷虜決䇿定難素髙平日之謀拯溺救焚豈有淹時之久雪宗祧之大憤拯黎庶之橫流勢方万全士在一舉九金鼎就難逃魑魎之形萬里塵清永肅乾坤之照乘彼瓜分之後在我鼓行而清霣涕而十七言至誠斯盡竊惟國家道得仁義蓄飬天下自一命以上隨其器宇各霑恩澤祖宗以來平時奬待群臣之恩至厚者蓋慮一旦緩急之間貴其盡節死職以忠報朝廷伏見頃者虜兵所加靡然風偃知名之士幾無而僅有於亂離中隂訪得三人焉若不論之朝廷實慮忠臣義士㗸冤負憤無以自明太原總管王稟當虜人作難之時在圍城中奮忠城義不顧一身一家之休戚遇一兩日輒領輕騎出城馬上運大刀徑造虜營中左右轉戰得虜級百十方徐引歸率以為常宣撫使張孝純視城之危一日會監司食謀欲降虜稟知之率所將刀手五百人謁孝純列刀於前起論曰汝等欲官否衆曰然稟曰惟朝廷立功則官可得又曰汝等欲賞否衆曰然稟曰惟朝廷禦敵則賞可致且曰汝等既欲官又欲賞冝宣力盡心以忠衛國借如汝等輩流中有言降者當如何群卒舉刀曰願以此戮之又曰如稟言降當如何卒曰亦乞此戮之又曰宣撫與衆監司言降當如何卒曰亦乞此戮之孝純自後絶口不復敢言降事而城中兵權盡在稟矣又於守城過有隄備虜人巧設機械屢出竒計見攻稟候其來必以意麾解之後圍益急民益困倉庫軍儲且盡城中之人五相啖食披甲之士致煮弓弩筋膠塞飢勢力既竭外援不至城既陷父子背負太宗皇帝御容赴火而死又有晉寧知軍徐徽言虜騎攻城極力保護綿歷時月嬰城之人疲於守禦虜騎既登城軍士散走徽言奮臂疾呼獨用弓矢斧鉞盡殺先登者衆見知軍如此氣乃復振虜亦稍郤後為監門官宣贊舍人石贇開門縱敵巳入知不可奈何遂置妻妾兒女於空室中積薪自焚且仗劒坐廳事前虜人至者皆手刃之須臾積尸多虜衆群至遂為所擒酋長賞其英毅深欲活之使降徽言不降使之跪徽言不跪與酒令飲既授酒以杯擲虜靣曰我尚飲虜賊酒乎幔罵不已虜怒持刃刺徽言袒禓就刃刃未及死罵聲不絶又有真定帥臣李邈城破被虜復令作帥邈曰坐邈不才使一城生靈陷於塗炭縱邈無耻復受官爵有何靣見朝廷及一城阜老乎卒不肯受尋之燕山虜亦欲保全之而邈意略不少屈又不肯去頂髮虜人責之邈髠而為僧謂曰更以二分潤官虜大怒牽赴市令斬將刑神色不變言笑如平時告刑者曰願容我辝南朝皇帝以死拜訖南向端坐就戮燕山之民皆為之流涕此三者蓋人傺也惜不逢時使不得成功於丗然當是之時怙亂要生靡所不有而稟輩風節如此質之古人誠未多得慮朝廷未能究之使忠義之士與庸人共就湮沒實可憫悼伏望矜恤將稟等忠烈寵之爵命葬之衮服建祠以圖其像載事實以刋之碑仍乞訪尋子孫重加旌異且令劄付史官以奬忠孝少萬偷俗之弊右此紙頃歲得之故人榮芭次新几間雖失所著人姓氏嘉其用心忠憤激切故用録之因而夷考三人行事稟開封人追封安化郡王錫賚甚腆擢其子為樞密院屬官曾丞相懷即其壻也徽言衢州人贈晉州觀察使諡忠壯程致道為作志銘邈臨江軍人名儒中之子曾南豐之甥進士及第纍為監司與蔡元長不叶換右階以青州觀察使死節贈少保諡忠壯十八有道處士逈之兄也建炎己酉苗傅劉正彥反呂張二公檄諸州之兵以勤王檄至霅川郡守梁端會寓客謀之外祖曾公卷在坐衆未及言公奮然曰逆順明甚出師無可疑者間數日二凶取兵公請械繫使人毋令還當是時微公幾殆髙宗反正中司張全真守白發其忠詔進職二等赴闕全真奏議集中載其十九薦牘亦已刋行故不復録外祖跋董令升家所藏真草書千文略云崇寧初在零陵見黃九丈魯直云元祐中東坡先生錢四丈穆父飰京師寶梵僧舍因作草書數紙東坡賞之不已穆父無一言問其所以但云恐公未見藏真真迹爾庭堅心切不平紹聖貶黔中始得藏真自敘於石揚休家諦觀數日恍然自得落筆便覺超異回視前日所作可笑然後知穆父之言不誣也錢義妻德國夫人李氏和文之孫女早歲人物妹麗建套初侍其姑秦魯大主避虜入淮次真州而為巨冦張遇衝劫骨肉散走度大江抵句容境上復為賊之潰黨十餘人所略同時被虜儕類六十輩姿色皆勝歐之入村落閴無人迹之境悉置一古廟中每至未曉則群盜皆出扄鎖甚固至深夜乃歸必携金繒酒肉而來蓋椎埋得之逾旬無計可脫一日午間忽聞廟外有嗽咳之音諸婦出隙中窺之一男子坐于石上即呼來隔扉與之語男子云我荷擔于此所謂貨囊者婦各以實告且祈哀以求生路許以厚圖報謝其人復云此距巡檢司才十餘里吾當亟往告之以營救若等今夕必濟幸無怖也何用報乎至夜盜歸醉飽而寢忽聞鑼聲甚振乃巡檢者領兵至矣盡獲賊徒無一人脫者詢婦輩各言門閥皆名族貴家於是遣人以禮津送其歸夫人後享冨貴者數十年頃歲其子雋草一道端英奉版輿過天台夫人已老親為明清言之向伯恭為淮南漕張邦昌僣竊于京師遣向之甥劉逵賫偽詔來伯恭不啓封焚之械繫逵于獄遣官奉表勸進髙宗于河北其後以此柬上之知至位法從挂冠而去寵遇極渥丗所共知而胡仁仲宏作其行狀亦嘗及焉時又有徐端益字彥思婺州人也為宿州虹縣武尉邦昌赦書至邑邑令以下迎拜宣讀如常儀端益不屈膝而走事定伯恭為言于朝詔換文資後終於朝請大夫子亦登科彥思博學多聞與先遊從所厚者也先人嘗以詩著其節誼淳熙戊申冬明清調官于臨安解后其次子于相府方識之以其父前績祈造化于周益公坐客莫有知者於立談間乃指明清為引草二證舊聞益公將上得旨令與屬官差遣趙叔近者宗室子登進士弟有材略建炎𥘉為兩浙提刑統兵平錢塘之亂擢直龍圖閣時大駕駐維揚以選掄守秀州治績甚著或有言其貪汙者免所居官拘係于郡遣朱芾代其任芾到官未久頗肆殘酷軍民怨憤有茶酒小卒徐明者帥其衆囚芾迎叔近復領州事叔近知事不可遏登廳呼卒徒安尉而告之曰新守暴虐不恤致汝輩所以為此我當為汝等守印請于朝别差慈祥愷悌之人來拊此一方群卒俯伏不敢猖獗奏牘末及徹閽而朝廷已聞詔遣大軍往討之矣先是王淵在京為小官時狎露臺娼周者稔甚亂後為叔近所得携歸家淵每對人切齒是時適淵為御營司都統制張韓俱為淵部曲淵命張提師以往張素以父事淵拜辭于廷淵云趙叔近在彼張默解其指將次秀境叔近乘涼輿以太守之儀郊迎于郡北沈氏園張即叱令供析方下筆而群刀悉前斷其右臂叔近號呼曰我宗室也衆云汝既從逆何云宗室巳折首于地秀卒見叔近被殺始忿怒返戈嬰城以距敵縱火歐略一郡之內􅱷血荼毒翌日破關誅其首惡雖曰平定然其擾尤甚凱旋行闕第功行賞焉張於亂兵中獲周娼以獻于淵淵勞之曰處置甚當但此婦人吾豈冝納君當自取之張云父既不取某焉敢耶時韓在旁淵顧曰汝留之無嫌也韓再拜而受之既歸韓甚以寵嬖為韓生子韓既貴盛周遂享國封之榮朝廷後知叔近之死於不幸詔特贈集英殿修撰制詞云士有以權濟事當時賴之未幾姦人圖之于今公議歸之此朕所深悼者也可無愍典以光泉壤哉爾屬籍之英吏能優𥙿昨者嘉禾適所臨典旁近部狂冦三發悉賴爾以定一方怗然而適與禍會可謂真不幸矣御史以冤狀聞朕用衋傷追榮論撰式表忠勤尚或有知歆此休命官其二子鄒浩然云揮麈第三録卷之二
