  - {type: variant, offset: 111, length: 3, content: 長賡歌, WYG: 敵人再來侵犯荆鄂亦出師入北界縱遣之人有來爲鄉道者諸將皆全璧而歸金亮簒位之後偶因本朝遣使至其闕廷有畏讋者遂有輕我之心即謀大舉僉刷以北人為兵欲以百萬南攻止得六}
