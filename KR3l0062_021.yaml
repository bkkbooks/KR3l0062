front:
  text: 揮麈録餘話總目卷之一一帝王自有真二王荆公薦常秩三任丗𥘉上書乞取燕雲四髙宗却獻燒金及藥術五葉夢得奏對聖語六建炎符兆七髙宗幸台州祥符寺八趙元鎮責黃彥節九沈之才引經𬒳逐十孝宗儲祥十一紹興中選擇宗子十二張思廉言事多驗十三祐陵與蔡元長賡歌十四蔡元長作大清樓特燕記十五蔡元長保和殿曲燕記延福宫曲燕記十六祐陵召東宫十七祖宗兵制名樞廷備撿十八王文恭草制辦下多時十九近丗衣冠之盛二十蔡敏肅帥平涼作喜遷鶯詞二十一東坡入翰林𬒳旨二十二富文忠上章自劾二十三司天監亢瑛上奏二十四曾文肅有壽詞二十五陳禾節義敢言二十六林子中野史二十七黃慶基摘東坡語以為詆誣二十八士林佳話二十九景煥述野人間話三十事有相類而禍福不侔三十一王文穆薦同年尉三十二東坡送章守湖州詩三十三錢穆父行章子厚告詞三十四周美成再進汴都賦表三十五詞人蹈襲三十六沈睿逹書裙帶詞
