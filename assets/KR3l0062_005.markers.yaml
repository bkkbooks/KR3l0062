  - {type: variant, offset: 237, length: 0, content: '', WYG: 年迥塵忝末科試吏于淮壖得奉行政事之在民者因讀荀卿子書曰法不貳後王又讀宣王詩曰周道粲然復興於是思熟於本朝典故者以講論學問士夫間訪之未獲也忽仲言出示此書乃平昔之所期不謂近出於朋舊之中喜可知也雖然僕有疑焉仲言富於春秋宜以壯烈上佐時用何遽畱心於著述若僕輩衰老不適用乃可娱意於簡冊之間耳仲言其懋哉乾道己丑八月左文林郎饒州徳興縣丞沙隨}
  - {type: page-break, offset: 237, content: '', id: KR3l0062_WYG_004-15a, image: WYG1038/WYG1038-0397a.png}
  - {type: variant, offset: 238, length: 1, content: 若, SBCK: 􅀂}
  - {type: variant, offset: 238, length: 2, content: 若英, WYG: 迥可久跋九悳素聞仲言多識前言往行真好古博雅君子願從下風聽餘論聞所未聞為有日矣今幸同僚于此謂可破此願也而郡邑相距餘一舎仲言入郭有時不得朝夕見斯心竟未能滿間從清流王孟玉借揮麈録觀之殆所謂窺豹一班者因手抄之古人有云不見異人當得異書今也見其人得其書何喜如焉因誌于後傾困倒廩尚冀自此無靳也廸功郎高郵軍教授臨汝郭九悳書李賢良簡垕拜手昨日辱下顧殊恨不款經夕伏惟台候客况萬福宣政從臣出處極為詳備受賜甚多揮麈録昨晩與老人伏讀共歎該洽如垕輩可知愧矣鄭公之説甚善切幸小畱以容乞靈龍山俯就食其禄可也一二同舍郎與兄厚善皆以為喜老人亦約同白廟堂且喻意京兆來早幸過此共飯已約叔度款宏論不宣垕}
