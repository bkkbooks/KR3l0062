  - {type: line-break, offset: 24, content: '', id: KR3l0062_SBCK_005-1a04}
  - {type: variant, offset: 24, length: 0, content: '', WYG: 通天王次歴小石州次歴伊州州將陳氏其先自唐開元}
  - {type: variant, offset: 25, length: 0, content: '', WYG: 年領州凡數十世唐時詔勅尚在地有野􅁞生苦參上可為綿帛有羊尾大而不能走尾重者三斤小者一斤肉如熊白而甚美又有勵石剖之得賓鐡謂之喫鐡石又生胡桐樹經雨即生胡桐律次歴益都次歴納職城在大患鬼魅磧之東南望玉門關甚近地無水草載糧以行凡三日至思谷曰避風驛本俗法試出詔押御風御風乃息凡八日至澤田寺高昌聞使至遣人來迎次歴寳莊又歴六鍾乃至高昌高昌即西州也其地距于闐西南距大石波斯西距西天步露沙雪山蔥嶺皆數千里地無雨雪而極熱每盛暑人皆穿池為穴以處飛鳥羣萃河濱或起飛即為日氣所爍墜而傷翼屋室覆以白堊開寳二年雨及五寸即廬舎多壞有水出金嶺導之周繞國城以溉田園作水磑地產五穀惟無喬麥貴人食馬餘食牛及鳬㕍樂多箜篌出貂鼠白㲲綉文花蘂布俗多騎射婦人戴油帽謂之蘇幕遮用開元七年厯以三月九日為寒食餘二社冬至亦然以銀或鍮為筒貯水激以相射或以水交潑為戲謂之壓陽氣去病好遊賞行者必抱樂器佛寺五十餘區皆唐朝所賜額寺中有大藏經唐韻玉篇經音等居民春月多遊羣聚遨樂於其間遊者馬上持弓矢射諸物謂之禳灾有勅書樓藏唐}
  - {type: page-break, offset: 25, content: '', id: KR3l0062_WYG_004-6a, image: WYG1038/WYG1038-0392c.png}
  - {type: page-break, offset: 25, content: '', id: KR3l0062_WYG_004-6b, image: WYG1038/WYG1038-0392d.png}
