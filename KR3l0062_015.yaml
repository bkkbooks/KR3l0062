front:
  text: 揮麈後録卷之十百七一汝隂王明清吳傳朋説知信州朝辭上殿髙宗云朕有一事每
  hash: sha256:1cec4029df4a9e827b13f14acc392433bd09d92be4261d30e599311de1ea23e0
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_015-1a}
body:
  text: 以自慊卿書九里松牌甚佳向來朕自書易之終不逮卿所書當令仍舊説皇恐稱謝是日降旨令根尋舊牌尚在天笁寺庫堂中即復令張挂取宸奎榜入禁中説所書至今揭于松門仰見百七二聖德謙仁之不伐也傳朋自云靖康末駙馬都尉王師約之子殏為龍德宫都監祐陵北狩御府器玩服御不能盡從者悉為其掩有携以南度事露下廷尉伏罪髙宗欲戮之時叔祖子裳為棘卿啓于上曰殏誠可殺但倘非其隱匿則諸物悉為虜得無從復歸天上矣上於是貸而不誅先人摹得其古玉印數十今百七三假于楊伯虎文昺未歸建炎巳酉髙宗暫駐蹕于建康閩中禽苗傳劉正彥獻俘于朝檻車幾百兩先付之大理獄將盡尸諸市子裳請對以陳云在律俱當誅死然其中婦女有雇買及鹵掠以從者倘殺之未免無辜願賜哀矜上矍然曰卿言極是朕思慮之所不到即百七四詔除二妻子之外餘皆釋放歡呼而出周望字仲弼蔡州人有口材好談兵嘗為康邸記室建炎𥘉吕元直從而引用之驟拜二府髙宗幸明越命其經略淮浙付委甚重而昧於戎機駕馭無術遂至紛亂平江一城最為荼毒責昭化軍節度副使連州安置以死紹興巳卯其家自理詔復故官澤及其子時凌明甫哲為右正言明甫平江人也親見其鄉里𬒳害之酷遂上疏疏其罪命乃寢吳越錢穆作收復平江記悉從紀實不能采其文華之要雖有浮冗之詞不欲易之建炎四年庚戍春二月金人首領四太子者自明越還師由臨安府襲秀州二十五日犯平江府午漏未盡四刻兵自盤門入劫踐官府民居廥廩積聚虜掠子女金帛乃縱火延燒煙熖見二百里凡五晝夜三月初一日出閶西冦常潤於是平江府燒之既士民前後遷避得脫者十之二三遷避不及或殺者十之六七謹按靖康之亂金人再犯闕太上皇帝淵聖皇帝北狩今上皇帝即位于睢陽改元建炎是年秋移幸江都三年巳酉春金人南牧淮甸二月初三日大駕渡楊子江幸杭州金人叩江而不濟巳乃歸國四月大駕西還駐蹕于金陵寵其府號易江寧為建康議者謂金陵六朝建國襟帶大江岡嶺回合北貫淮汴西引川峽南洞襄漢東壓吳越甄閩荆廣之區四逹之國也資其冨饒基本王業以經理中原收復京洛實為勝算開封尹杜充久司留鑰天下屬望至是召赴行在命為淮南京東西宣撫處置使俾提重兵保諸路又請隆祐太后領皇太子帥六宫及宗室近屬前往江表百司庶府非與軍興之事者悉從焉上獨與宰相吕頥浩暨三數大臣以次侍從官留金陵治兵詔書有誓堅一死以保群生之語士民讀詔感泣奮厲以為中興之期可指日而慶矣杜公既有成命淹回未遣人心稍惑之閠八月一日詔云朕嗣位纍年寅奉基緒愛育生靈凡可以和戎息兵者卑辭降禮無所不至而敵人猖獗迫逐凌犯未有休息之期朕甚憚之比命杜充提兵防淮然大江之北左右應接我所守者一由荆襄至通泰敵之可來者五六兵家勝負難可預言所議衆多未易偏廢軫念旬月莫適決擇朕將定居建業不復移蹕與夫右趣鄂嶽左駐吳越山川形勢地利人情孰安孰危孰利孰害以至彼我之所長步騎之所冝何嶮可守何地可戰甚地之錢物可運甚郡之粟穀可漕其各悉心致思以告于朕昔漢髙帝謀臣良將多矣都雒之計巳定及聞婁欽一言而用之之意立決吾士大夫之確論朕豈不能虛懷而樂從哉三省可示行在職事官共條具以聞於是群臣爭進避敵之計拜杜公尚書右僕射留鎮金陵不復北渡矣二十五日大駕乃復南巡九月初四日駐蹕于平江府二十五日詔休兵巳兼旬可涓日進發詞臣引孟子巡狩輔助為説始平江人猶幸於駐蹕倚以為安至是惶遽失望蓋前此駕後諸軍多阻亂不靜人既畏之又慮胡騎乘冬深入於是逺有散之浙東閩部者而近者亦自匿於山巔水涯之際詔以工部侍郎湯東野為守臣又命同知樞密院周望為淮浙宣撫使宿兵府城將官陳思恭巨師古張俊魯與李貴俗號李閻羅者等悉隸望節制又詔駕後諸軍盡命先啓行獨以禁衛請班扈蹕九月初四日駕興平江幸無釁其民復稍稍安集周望遣諸將各部署所隸兵分護境內河內降賊郭仲威領其下萬衆至自通州屯泊于虎丘山時大駕駐會稽十一月有旨金人於和州欲渡采石及自黃州渡兵巳至興國軍界取二十五日移蹕前去浙西為迎敵之計吳人復引領望幸未幾建康府報是月十八日碙砂渡將官張超失守賊登岸杜丞相遣都統制官陳淬提領嶽飛劉剛等二萬人分陳頭迎戰又命王全軍一萬三千人相繼往來䇿應二十日陳淬與賊遇于馬家渡凡十餘合日暮戰酣勝負略相若會王領西兵畔敵檄鎮江府韓丗忠江州劉光丗應援皆不赴丗忠巳望風循海道潛去於是陳淬孤軍力弱不能當賊進逼建康城下守臣陳邦光降之通判楊邦義死焉杜丞相奔儀真收拾潰亡移保淮甸大駕頓于越州之蕭山縣群臣復勸南避乃幸四明於是平江大震恐周望湯東野集耆艾士夫僧道訪問所以為計者且曰今戰守皆巳無䇿矣蓋其意在迎降而欲衆發其端士民不答而罷望斂諸將兵歸城中懼其抗賊取怒也巳而金人自建康取捷徑劫廣德軍掠湖州南境破屬邑長興武康安吉遂犯臨安府之餘杭縣急趍臨安府守臣康允之去之民自為守六日而陷渡錢塘江降越州守臣李鄴遂犯四明以窺行在有詔周望湯東野等固守平江等望自謂虜不敢犯境而過始少安遂倚郭仲威為腹心㑭盡護諸將與張俊魯與居城中遣巨師古控扼吳江陳恩恭屯楞伽山李閻羅屯常熟縣思恭兵無紀律村落五十里間皆𬒳其害周望詰責之斬隊將武節郎張振乃戢而郭仲威居城府外為忠勇之論望委任之不疑士民亦顧望信以為重晏然按堵如平日而郊居遷避之家往往而復平江城堞完壯而地下聚水四圍渠塹深廣周望又竭取民財錢榖以巨萬計庫廪充牣兵器犀利沛然有餘力以是人益安之過明年春正月而來傳言者多云賊自越州躡來路返金陵或又謂自臨安府昌化縣道宣歙趍當塗渡江而歸杭無匹馬隻輪矣望等素不嚴斥堠而四境無尉野無烽火但以傳言為信乃遣張俊陳思恭等統兵規入杭州以邀收復之功俊等行涉旬才及秀州陳思恭偵知傳言者非實走間道潛軍于湖州烏墩鎮以觀變二月十八日張俊馳報金人犯秀州崇德縣俊統兵迎擊于宣店走之平江之人且喜且懼以俟後捷十九日徴鄉兵發太湖洞庭東西山千艘命用頭巡撿湯舉揔之前赴吳江陳于簡村二十一日金人犯吳江縣巨師古兵不戰而潰更以太湖民舟為向導歸于西山二十二日郭仲威遣千兵拒守于尹山巳而退師二十三日府中令民逐便出城留少壯者登埤以守是日金人遊騎掠城東郭仲威兵未合而返守臣湯東野出奔周望以郡印付仲威二十四日仲威會諸將飲城上士民老幼數萬叩頭出血請加守禦之備仲威奮髯詔衆曰即發遣騎兵虜行破矣民慎無擾人猶信之日欲晡金人大集于城下仲威及魯與兵火廣化寺又火㙠官李丗康宅望仲威等皆宵遁其下自城南轉劫居民北出齊門而去民之得出郭者多為所害明日金人遂據城諸將奔遁潛伏外邑覘胡人之行也競以兵還三月𥘉二日張俊至自崑山初三日巨師古至自洞庭李閻羅魯與郭仲威等至自常熟初五日陳思恭至自烏墩各以力勝惟仲威竊據之揭榜于市曰本軍巳逐退金人收復府城或聞亦用此奏上周望自遁所良久乃出領兵之吳興十五日始有詔周望等平江失守可發遣諸將兵往常州以北衝襲金人以功贖過云初金人燒劫之餘金帛錢穀尚多仲威即據城縱兵掠取晝夜搜抉不巳遺民間訪舊居即執之笞責苦楚窮問瘞藏之物民益冤憤故自金人南渡碙砂破金陵廣德杭秀常潤明越惟平江𬒳害最深蓋以兵多將庸民始倚之而不去既墮虜計則又再遭官軍之毒是夏疾疫大作米斗錢五百有自賊中逃歸者多困餓僵仆或驟得食而死橫尸枕籍道路涇港為實哭聲振天地自古喪亂之邦未有如是之酷也穆目覩其事幸以身免因迹階亂之由與夫敗亡次敘記之以備後丗史官採擇目之曰收復平江府記者本郭仲威揭示之文具為吳人諱於不復云建炎四年四月二十日記仲威出于寇盜號郭大刀明年除楊真二州鎮撫使在郡長惡不悛劉平叔光丗為淮浙宣撫置司京口遣其將王德禽仲百七五威至麾下殺之紹興戊午秦會之再入相遣王正道為計議使以修和盟十一月樞密院編修官胡銓邦衡上書曰王倫本一狎邪小人市井無賴頃緣宰相無識遂舉以使虜專用詐誕欺罔天聽驟得美官天下之人切齒唾罵今日無故誘致虜使以詔諭江南為名是欲臣妾我也是欲劉豫我也且豫臣事醜虜南靣稱王以為子孫帝王万丗之業牢不可拔一旦豺狼改慮捽而縛之父子為虜啇監不逺而倫乃欲陛下效之夫天下者祖宗之天下也陛下之位祖宗之位也奈何以祖宗之天下為犬戎之天下祖宗之位為犬戎藩臣之位陛下一屈膝虜人則祖宗社稷之靈盡汚夷狄祖宗數百年之赤子盡為左袵朝廷之宰輔盡為陪臣天下士大夫皆當裂冠毁冕變為胡服異時豺狼無厭之求安知不加我以無禮如劉豫也哉夫三尺童子至無知也指犬豕而使之拜則怫然怒堂堂天朝相率而拜犬豕曾童稚之所羞而陛下忍為之耶倫之議乃曰我一屈膝則梓宫可還太后可復淵聖可歸中原可得嗚呼自變故以來主和議者誰不以此説啖陛下然而卒無一驗則虜之情偽巳可見矣而陛下尚不覺悟竭民膏血而不恤忘國大讎而不報含垢忍恥舉天下而臣之甘心焉就令虜決可和盡如倫議天下後丗以陛下為何如主也况醜虜變詐百出而倫又以姦邪濟之則梓宫決不可還太后決不可復淵聖決不可歸中原決不可得而此膝一屈不可復伸國勢陵夷不可復振可不為慟哭流涕長太息哉向者陛下間關海道危如纍卵尚未肯臣虜況今國勢既張諸將盡説士卒思奮如頃者醜虜陸梁偽豫入冦固嘗敗之於襄陽敗之於淮上敗之於渦口敗之於淮隂較之往時蹈海之危固巳萬萬不侔儻不得巳而至於用兵則我豈遽出虜人下哉今無故欲臣之屈萬乘之尊下穹廬之拜三軍之士不戰而氣巳索此魯仲連所以義不帝秦非惜夫帝之虛名惜天下大勢有所不可也今內而百官外而軍民萬口一談皆欲食倫之肉謗議洶洶陛下不聞正恐一旦變作禍且不測臣故謂不斬王倫國之存亡未可知也雖然倫固不足道也秦檜為心腹大臣而不為之計陛下有堯舜之資檜不能致陛下於唐虞而欲導陛下為石晉頃者禮部侍郎曾開以古議折之檜乃厲聲責之曰侍郎知故事我獨不知則檜之遂非愎諌巳自可知而乃建議日令臺省侍臣僉議可否蓋畏天下議巳令臺省侍臣共分謗耳有識者皆以謂朝廷無人吁可惜也孔子曰微管仲吾其𬒳髮左袵矣夫管仲伯者之佐尚能變左袵之軀而為衣裳之會秦檜大國之相也反驅衣裳之俗而為左袵之鄉則檜也不惟陛下之罪人實管仲之罪人也孫近傳會檜議遂得參知政事天下望治有如飢渴而近伴食中書漫不知可否檜曰虜可講和近亦曰可和檜曰天子當拜近亦曰當拜臣嘗至政事堂三發問而近三不答但云巳令臺諫侍臣議之矣嗚呼身為執政不能參贊大政徒取容充位如此若虜騎長驅近還能折衝禦侮耶竊謂秦檜孫近皆可斬也臣備貟樞屬義不與檜等共戴天區區之心願斬三人頭竿之稿街然後羈留虜使責以無禮徐興問罪之師則三軍之士不戰而氣自倍不然臣有赴東海而死耳寧能處小朝廷求活耶疏入責為昭州鹽倉而改送吏部與合入差遣注福州簽判蓋上初無深怒之意也至壬戌歲慈寧歸養秦諷臺臣論其前言弗效詔除名勒停送新州編管張仲宗元幹寓居三山以長短句送其行云夢繞神州路悵秋風連營畫角故宫離黍砥事崑崙傾砥柱九陌黃流亂注聚萬落千村狐兔天意從來髙難問况人生易老悲如許更南浦送君去涼生岸栁銷殘暑耿斜河踈星淡月斷雲微度萬里江山知何處回首對床夜語鴈不到書成誰與目斷青天懷今古肯兒曹恩怨相尓汝舉大白唱金縷邦衡在新興嘗賦詞云富貴本魚心何事故鄉輕别空使猿驚鶴怨誤薜羅風月囊錐剛要出頭來不道甚時節欲駕巾車歸去有豺狼當轍郡守張棣􅌳上之以謂譏訕秦愈怒移送吉陽軍編管棣乃擇使臣之刻核者名遊崇管押封小項筒過海邦衡與其骨肉徒步以涉瘴癘路人莫不憐之至雷州太守王彥恭躍雖不學而有識適使臣者行囊中有私茶彥恭遣人捕獲送獄奏治別差使臣護送仍厚餉以濟其渡海之費邦衡賴以少蘇彥恭繇此賢士大夫推重之棣訐邦衡後即就除湖北提舉常平乘軺一日而殂又數年秦始聞仲宗之詞仲宗挂冠巳久以它事追赴大理削籍焉邦衡囚朱崖幾一紀方北歸至端明殿學士通奉大夫八十餘而終諡忠簡此天力也此一假皆邦衡之子澥手為刪定揮麈後録卷之十
