  - {type: variant, offset: 23, length: 0, content: '', WYG: 之則再拜雖行高而位崇者不過曰頓首再拜而已非父兄不施覆字宰輔以上方曰台候餘不敢也前輩名卿尺牘中可考今俱不然誠可太息太平興國六年五月詔遣供奉官王延徳殿前承㫖白勲使高昌雍熙元年四月延徳等叙其行程來上云初自夏州歴玉亭鎮次歴黄羊平其地平而産黄羊度沙磧無水行人皆載水凡二日次都囉囉族漢使過者遺以財貨謂之打當次歴茅家喎子族臨黄河以羊皮為囊吹氣實之浮於水或以囊馳牽木栰而度次歴茅女王子開道族行入六窠砂砂深三尺馬不能行行者皆乘槖駞不育五穀砂中生草名登相收之以食次歴樓子山無居人行砂磧中以日為占旦則背日暮則向日日下則止又行望月亦如之次歴卧羊梁劾特族地有都督山唐回鶻之地次歴太子大蟲族接契丹界人衣尚錦綿器用金銀馬乳醸酒飲之亦醉次歴屋地目族葢托雲裕恱王子之子次至托雲裕恱王子族此九族逹靼中尤尊者次歴伊喇王子族有哈喇川唐回鶻公主所居之地城基尚在有湯泉池𫝊曰契丹舊為囘鶻牧羊逹靼舊為回紇牧牛囘紇徙甘州契丹逹靼遂各争長攻戰次歴阿墩族經馬鬃山望鄉嶺嶺上石庵有李陵題字處次歴格囉美源西方百川所㑹極望無際鷗鷺鳬㕍之𩔖甚衆次至托邉城亦名李僕射城城中首領}
