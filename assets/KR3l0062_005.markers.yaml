  - {type: variant, offset: 17, length: 3, content: 代加上, WYG: 天下諸路計度轉運使官制未行老于正卿乃敦老如岡之祖葢濟南人也同姓名者凡三人世亦多指而為一不可不辯李􅀢陽翟人東坡先生門下士亦字方叔兩方叔俱以文鳴詩章又多互𫝊於世郭稹字仲微仕至龍圖閣學士權知開封府幼孤母邊更嫁王氏既而母亡稹解官服喪知禮院宋祁言稹服喪為過禮請下有司博議因馮元等奏聽解官申心喪始此太祖}
