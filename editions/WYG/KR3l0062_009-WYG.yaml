seq: 9
front:
  text: 徽宗宣和七年十二月二十一日就睿謨殿張燈預賞
  hash: sha256:76addc018fe1ea109ea8eae00e2cb04ca34665a26edbb998305894f23f04d6f5
body:
  text: 元宵曲燕近臣命左丞王安中中書侍郎馮熙載爲詩以進安中云上帝通明闕神霄廣愛天九光環日月五色麗雲烟紫袖開三極瓊璈列萬仙希夷塵境斷髣髴玉經傳妙道逢昌運眞王撫􅆻賢龜圖規大壯龍位正純乾穹昊親無間皇居掇自然剛風同變化祥氣共陶甄層觀星潢上重闉斗柄邊摩空七雉峻冠嶠六鼇連夢想何嘗到階升信有縁昕朝初放仗密宴忽聞宣清禁來鳴珮脩廊入並肩獸鋪金半闔鸞障繡微褰霽景畱庭砌雷文繪桷梴宫簾波錦漾殿榜字金塡花擁巍巍座香浮秩秩筵髙呼稱萬億韶奏侍三千華嵗推堯厯元璣候舜璿氷霜知臘後梅栁認春前造化應呈巧芳菲已鬭妍樛枝彫檻小多葉露桃鮮錯落飛盃斚鏘洋雜管絃承雲歌歴歴囘雪舞翩翩黼幄祥氛合銅壺永漏延鎬京方置醴羲馭自停鞭乃聖情深渥諸臣意更䖍宗藩親魯衛相芾拱閎顚側弁恩光浹中觴詔蹕旋寳薰攜滿袖御果得加籩要賞嬉遊盛俄追歩武遄騰身複道表送日夾城􅕨仰揖蒼龍𧰼旁臨艮嶽巓謳歌紛廣陌簫鼓樂豐年赫奕攢輕幰珍奇集市􅆵博盧多袒跣飲肆競蹁躚蕃衍開朱邸崔嵬照彩椽橋虹灣矗矗江練泮濺濺擊柝周廬晩張燈别院先餘霞搖綺暈列宿舍珠􅄤浩蕩三山島稜層十丈蓮再趨天北極却立榻東偏既用家人禮仍占聖製篇兕觥從酩酊蟾魄待嬋娟轉盻隨親指環觀得縱穿曲屏江浪蹙巨柱赤虬􅅶光透垂枝井晶銜帶壁錢蕭臺千級峻重屋八窻全就席花墪匝行樽紫袖揎交輝方爍爍起立復闐闐䆳宇會寧過中宵勝賞專鋪陳尤有韻清雅不相沿户箔明珠串欄釭水碧棬規模商􅀈鑄款識魯壺鐫秦曲移箏柱唐粧儼鬢蟬窄襟珠綴領髙朶翠爲鈿喜氣排寒沍輕颸洗靜便層琳藉璣組方鼎炷龍涎瑪瑙供盤大玻璃琢琖圓暖金傾小榼屑玉釀新泉帝子天才異英姿棣蕚聯頻㸔揮斗盌端是吸鯨川推食俱均逮攘餐及墜捐海螯初破殻江柱乍離淵寧數披緜雀休論縮頸鯿南珍誇飣餖北􅄿厭烹煎賜橘懷赬卵酡顔釂寳船言歸荷慈惠末節笑拘攣放鑰嚴扃啓籠紗逸足牽氷輪掛銀漢夜色映華韉人識重熙𧰼功參獨斷權五辰今不忒六氣永無愆天紀承三古時雍變八埏比閭增板籍疆埸罷戈鋋文軌包夷夏絃歌徧幅員恢儒榮藻薦作士極魚鳶慶胄貽謀顯多男景福緜迓衡常穆穆遵路益平平亭障今踰隴耕耘久際燕信通鵬海漲威竄塞沙氊東擬封雲岱西將款澗瀍琳科宣蘂笈玉府下雲軒帝籍勤初播宫蠶長自眠蠒絲登六寢稃米秀中田廟鶴垂昭格壇光監吉蠲靈芝滋菌蠢甘醴湧潺湲合教尨風革頒經衆疾痊雨隨親禱降河避上流遷執契皇猷洽披圖福物駢太和輸橐籥妙用絶蹄筌此際君臣悦應先簡冊編雅稱魚罩罩頌述鼓咽咽詎比千齡遇猶聞四始箋羇臣起韋布陋質愧駑鉛驟㑭陪機政由來出眷憐恩方拜綸綍報未効塵涓密席叨臨勸藏鈎擬曲拳雖無三峽水曾歩八花磚渝望知難稱才慳合勉旃鈞天思盡賦賸續白雲箋熙載云化工欲放陽春到先教元冥戮衰草層氷封地萬木僵誰向雪中探天巧璿璣星囘斗指寅羣芳未知時已春人心蕩漾趂佳節燈夕獨冠年華新昇平萬里同文軌井邑相連通四裔蘭膏競吐夜烘春和叔囘車避羲轡巍巍九禁倚天開温風更覺先春來試燈不用雨花俗迎陽爲却寒崔嵬宣和初載元冬尾瑞白纔消塵不起穆清光賞屬欽鄰錦繡雲龍頒宴喜初聞傳詔開睿謨歩障㡬里承金鋪調音度曲三千女正似廣樂陳清都遏雲妙唱韓娥侣囘雪飛花稱獨歩千春蟠木效紅英獻夀當筵豈金母上林晩色􅈣藹輕景龍遊人歡笑聲霞裾月珮擁仙仗翠鳳挾輦趨平成銅華金掌散晶彩翠碧重重簇珠琲先從前殿望修廊日出綺霞紅滿海神光通透雲母屏驪龍出舞波濤驚煌煌黼座承天命座下錯落如明星榻前玉案眞核旅獸炭銀爐夜初鼓憲天重屋訝雲屯崇道簫臺疑蜃吐前楹火柱囘萬牛藺卿璧碎色光浮周圍照耀眼界徹氷壺漾月生珠流㸃㸃金錢盡銜璧豹髓騰輝粲銀礫絲篁人籟有機緘繳繹清音傳屋壁須臾隨蹕登會寧如驂鸞鶴遊紫清彩蟾倒影上浮空纖雲不㸃惟光明四壁垂簾玉非玉銀缸吐豔相連屬棼楣橫帶碧玻璃一朶翠雲承日轂萬光閃爍爭吐吞燭龍銜耀輝四崑又如電母神鞭馳金虵著壁不可捫端信奇工通造化豈比優人能幻假丹青漫數顧虎頭盤礴解衣未容寫此時帝御鈞天臺紫垣兩兩明三台尚方飲器萬金寳古玉未足誇雲雷帝旁侍女雲華品玉立仙標及時韻四音促柱泛笙簫應有翔鸞落千仞龍瓶㵼酒如流泉御厨絡繹紛珍鮮榻邊爭欲供天笑快倒頗𩔖虹吸川厭厭夜飲方歡浹玉漏頻催鼓三疊金門初下醉歸時正見氷輪上城堞微臣去嵗陪清班惡詩誤辱重瞳觀小才易窮眞䑕技再賦愈覺相如慳履道彥爲二集中今不復印行故録於此宣和初徽宗有意征遼蔡元長鄭達夫不以爲然童貫初亦不敢領畧惟王黼蔡攸將順贊成之有諜者云天祚貌有亡國之相班列中或言陳堯臣者婺州人善丹青精人倫登科爲畫學正黼聞之甚喜薦其人於上令銜命以視之擢水部員外郎假尚書以將使事堯臣即挾畫學生二員俱行盡以道中所歴形勢向背同繪天祚像以歸入對即云遼主望之不似人君臣謹冩其容以進若以相法言之亡在旦夕幸速進兵兼弱攻昧此其時也并圖其山川嶮易以上上大喜即擢堯臣右司諫賜予鉅萬燕雲之役遂决時堯臣方三十三嵗遷至侍御史會蔡元長復將起預政事黼訹堯臣望風上疏以元長前日不合人情狀攻之初榜朝堂然上猶眷元長黜堯臣爲萬州監税而元長竟不吿廷堯臣繼寢是行黼敗堯臣亦遭斥建炎中監察御史李寀疏其爲黼鷹犬誤國之罪始詔除其職初秦會之主泮髙密堯臣以滄州掾曹同爲京東漕同試官因以厚甚會之擅國遂盡復故官雖不敢用招至武林每延致相府款密叙舊堯臣以前所錫萬金築園亭於西湖之上極其雄麗今所謂陳侍御花園是也會之殂湯致遠爲御史欲露臺評而周爲髙方崇堯臣之妻兄致遠之腹心力囘䕶之遂免先以夀終李仁父長編載胡交修繳其祠命之章尤摘其姦其嗣懇爲髙作行狀以蓋前迹為髙後亦悔之會之炎炎時前御史敢於國門外建第以此可見爲髙之子樂云靖康之變士大夫紀録排日編綴者多矣其間蓋亦有逸事焉近從親舊家得是時進士黃時偁徐揆段光遠三人所上敵人書云大宋進士黃時偁謹齋沐裁書於大金二帥曰嘗謂良藥苦口利於病忠言逆耳利於行若夫樂軟熟而憎鯁切取諛美而捨忠良雖堯舜無以致治時偁淮右寒生家襲儒業老父每訓曰不在其位不謀其政罔可輕言自取戮辱由是鉗口結舌守分固窮未曾敢以片言辯時是非方今國家艱難茍有見聞寧忍甘蹈盲聾之域非不知身爲宋民不當以狂妄之辭干冐元帥聰德也非不知一言忤意死未塞責也直欲内報吾君之德外光二元帥之名一身九死又何憾焉時偁切觀我宋自崇寧以來姦臣誤國竊㺯威柄者有之妨公害民者有之大啓倖門壅遏言路者有之所以元帥因之遂有此舉道君太上皇帝親降詔書反已痛責斷出宸心乃傳大寳今皇帝即位未久適丁國難以孝行夙彰天人咸服今元帥斂城不下蓋爲此也時偁伏覩去年十二月二十三日國書正爲催督金銀表段有云須索之外必不重取禮數優異保無它虞奈何都民朝夕思念燃頂煉臂延頸跂踵以望御車之塵也元帥豈不念天生萬民而立之君以主治之乃復須索他物絡繹不絶參酌以情雖不足以報再生之萬一然方冊所載自古及今未聞有大事既决反縁細故而延萬乘之君者證以國書似非初意愚切惑之念我國家曩昔傷財害民之事結怨連禍之人尚可目也曰内侍伶倫美女是已曰宫室衣服聲樂是已今軍前一一須索唯復謂此悉皆國害堅欲爲我痛耡其根株耶亦欲驅挈歸境以爲自奉之樂耶軍機深密非愚陋可得而知也法曰上賢下不肖取誠信去詐僞禁暴亂止奢侈又曰爲彫文刻鏤技巧華飾而傷農事者必禁之願元帥詳覽此章熟思正論殺人以梃與刃無以異也儻使宿姦復被新寵是猶禾莠相雜而耕者未耘膏肓之疾而醫者未悟則將日漸月稽習以成風不害此而害彼何時已矣時偁懵不知書愚不練事言切而其意甚忠事雖小而所繫甚大方議修書鋪陳管見未及形言衆乃自禍嗚呼天網恢恢疎而不漏老蠧巨惡難於逃覆載之中也且如内侍藍訢醫官周道隆樂官孟子書俱爲平昔僥濫渠魁今取過軍前坐席未煖乃忘我宋日前恩寵之優不思兩國修講和好之始尚循故態妄興間諜稱有金銀在本家窖藏遂煩元帥怪問考諸人用心雖粉骨碎軀難塞滔天之罪請試陳之今焉明降御筆根括金銀以報大金活生靈之恩切須盡力不可惜人情茍可以報大金者雖髮膚不惜只是要有盡取於是有司累行勸諭及指爲禁物稍有隱藏以軍法從事其措置根括非不盡心上至宗廟器皿下至細民首飾罄其所有欲酬再造而天子且曰朕可以報金國者雖髮膚不惜凡爲臣子固當體國愛君疋兩以上盡合送納藍訢等不務濟朝廷之急報元帥之仁輒抵冐典憲埋窖金銀慳吝庸逆無如此之甚者若使未過軍前則人人蓄爲私寳論當時根括指揮已合誅戮切恐逐人昨緣有司根取犒賞亦嘗囚禁挾此爲仇意要生事厥罪尤不可赦愚謂正當擾攘之際猶敢懷姦罔上取佞一時異日安居爲國患也必矣亮元帥智周萬物不待斯言察見罪狀文王問太公主聽如何太公答曰勿妄而許勿逆而拒聖人垂教良有以也伏望元帥擴乾坤之度垂日月之明毋納諛情以玷大德將藍訢等先賜行遣徇首京城不惟掃蕩宿孽又可以懲戒後人仍願元帥務全兩國之驩以慰生靈之心請我鑾輿早還禁籞軍前或有所闕朝廷亦必不違書之青史傳爲盛事豈不韙歟太學生徐揆等謹獻書於大金國相元帥太子元帥揆等聞昔春秋魯宣公十一年伐陳欲以爲縣申叔時諫曰諸侯之從者曰討有罪也今縣陳是貪其富以討召諸侯而以貪歸之無乃不可乎王曰善哉吾未之聞也乃復封陳後之君子莫不多申叔時之善諫楚子之從諫千百嵗之下猶且想其風采爲不可及昔上皇任用非人政失厥中背盟致討元帥之職也大肆縱兵都城失守社稷㡬亡而復存元帥之德也兵不血刃市不易㕓生靈㡬死而幸免元帥之仁也雖楚子入陳之功未能遠過我宋皇帝以萬乘之尊兩造轅門議賞軍之資加徽號之請越在草莽信宿逾邁國中喁喁企望屬車塵者屢矣今生民無主境内騷然忠義之士食不下噎又聞道路之言以金銀未足天子未還揆等切惑之蓋金銀之産不在中國而在深山窮谷之間四方職貢嵗有常賦邦財既盡海内蕭然帑藏爲之一空此元帥之所明知也重以去嵗之役增請和之幣獻犒賞之資官吏征求及於編户都城之内雖一妾婦之飾一器用之微無不輸之於上以酬退師之恩也又自兵興以來邦國未寧道路不通富商大賈絶迹而不造境京師豪民蓄積素厚者悉散而之四方矣間有從宦王畿仰給於俸禄者飦粥之外儲無長資豈復有金銀之多乎今雖天子爲質猶無益於事也元帥體大金皇帝好生之德每以赤子塗炭爲念大兵長驅直抵中原未嘗以屠戮爲事所以愛民者至矣凡元帥有存社稷之德活生靈之仁而乃以金銀之故質君是猶愛人子弟而辱及其父祖與不愛奚擇元帥必不爲也昔楚子圍鄭三日克之鄭伯肉袒牽羊以迎左右曰不可許王曰其君能下人必能信用其民矣退三十里而許之平春秋書之後世以爲美談揆等願元帥推惻隱之心存終始之惠反其君父損其元數班師振旅緩以時月使求之四方然後遣使人獻則楚子封陳之功不足道也國中之人德元帥之仁豈敢弭忘傳曰主憂臣辱主辱臣死揆等雖卑賤輒敢浼死以紓君父之難唯元帥矜之大宋進士段光遠謹齋沐裁書百拜獻於大金元帥軍前僕嘗讀春秋左傳有曰親仁善鄰國之寳也又嘗讀禮記聘義有曰輕財重禮則民遜矣讀至於斯未嘗不三復斯言掩卷長歎切謂非賢聖之人疇能如此仰而思之在昔太祖皇帝膺天明命以揖遜受禪奄有神器爲天下君創業垂統重熙累洽垂二百年東漸西被南洽北暢薄海内外悉爲郡縣􅊋方絶域悉爲鄰國聘問交通絡繹道路其間義重禮隆恩深德渥方之他國唯大金皇帝爲然比年以來本朝不幸姦臣用事宦官撓權罔知陳善閉邪而格其非罔知獻可替否而引之當道欺君誤上蠧國害民靡所不至姦臣可罪庶民可弔事一至此則弔民問罪之師有不得已而舉也共惟大金元帥舉問罪之師施好生之德念今聖之有道憫斯民之無辜斂兵不下宗社再安生靈獲全深厚之惠若海涵而春育生成之賜若天覆而地載兩國永和萬姓悦服夫如是則親仁善鄰曷以加於此哉特枉鑾輿爲民請命重蒙金諾與國通和帝謂髮膚亦所不惜况於金帛豈復有辭宵旰焦勞不遑寢食官户根括急於星火竭帑藏之所積罄貧下之所有甘心獻納莫或敢違雖曠蕩之恩難以論報而有限之財恐或不敷久畱聖駕痛切民心夙夜匪懈而事君之禮廢於朝號泣旻天痛君之民滿於道仰望恩慈再垂矜念冀聖駕之早還慰下民之痛切夫如是則輕財重禮曷以加於此哉伏念光遠草茅寒士沐浴膏澤涵泳聖涯陰受其賜於兹有年才疎命薄報德無階今兹聖駕蒙塵於外僕雖至愚噫嗚泣涕疾首痛心其於庶民尚幸仰賴元帥再生之恩若天地無不覆載於人無所不容僕是以敢輸忠義激切之誠干冐威嚴仰祈垂聽俯賜矜憐無任戰懼皇恐哀懇之至不宣俶擾之際排難解紛伏節死􅁩有如此者嘉其忠義慷慨嵗久慮不復傳所以録之張邦昌爲金人所立反正之功蓋出於吕舜徒吕氏自叙甚詳不復重紀啓其端者堂吏張思聰也應天中興思聰已死詔特贈宣教郎思聰字謀道知書能文嘗從先人學今其子孫尚有事刀筆於省中者然亦不振金人立張僞詔與其謝牘併録於後維天會五年嵗次丁未二月辛亥朔二十一日辛巳皇帝若曰先皇帝肇造區夏務安元元肆朕纂承不敢荒怠夙夜兢兢思與方國措於治平粤惟有宋爰乃通鄰貢嵗幣以交歡馳星軺而講好斯於萬世永保無窮蓋我大造於宋也指斥不録今者國既乏主民宜混同然念厥功誠非貪土遂致帥府與衆推賢僉曰太宰張邦昌天毓疏通神咨睿哲在位著忠良之譽居家聞孝友之名實天命之有歸乃人情之所徯擇其賢者非子其誰是用遣使諸部宫都署尚書左僕射權簽書樞密事韓昉持節備儀以璽綬冊命爾爲皇帝以授斯民國號大楚都於金陵自黃河以外除西夏對新疆埸仍世輔王室永作藩臣貢禮時修汝勿疲於述職聘問嵗致汝無緩於忱誠於戲天生蒸民不能自治故立君而臨之君不能獨理故樹官以教之乃知民非后不治非賢不守其於有位可不愼歟子懋乃德嘉乃丕休日愼一日雖休勿休欽哉其聽朕命天會五年三月日大楚皇帝邦昌謹致書於國相元帥皇子元帥今月初七日依奉聖㫖特降樞臣俯加封冊退省庸陋之資何堪對揚之賜㝷因還使附致感悰願亟拜於光儀庶少伸於謝禮未聞台令􅊋震危衷遂遣從官具敷誠懇重蒙敦諭仰戴眷存然而掩目未前撫躬無措恐浸成於稽緩實深積於兢惶伏望恩慈早容趨詣俟取報示徑伏軍門拳拳之誠併留面叙不宣謹白建炎元年詔云九月二十五日三省同奉聖㫖張邦昌初聞以權宜攝國事嘉其用心寵以髙位雖知建號肆赦度越常格支優賞賜錢數百萬緡猶以迫於金人之勢其示外者或不得已比因鞫治他獄始知在内中衣赭衣履黃裀宿福寧殿使宫人侍寢心迹如此甚負國家遂將盜有神器雖欲容貸懼祖宗在天之靈尚加惻隱不忍顯肆市朝今遣奉議郎試殿中侍御史馬伸問狀止令自裁全其家屬仍令潭州日給口券常切拘管先是祐陵在端邸有妾彭者稍慧􅃛上憐之小故出嫁爲都人聶氏婦上即位頗思焉復召入禁中以其嘗爲民妻無所稱但以彭婆目之或呼爲聶婆婆其實未有年也恩倖一時舉無與比父黨夫族頗招權顧金錢士大夫亦有登其門而進者逮二聖北狩彭以無名位獨得畱内庭敵人强立邦昌僭位之後雖竊處宸居多不敢當至尊之儀服御之屬未始易也寢殿之䆳不敢履也一夕偶置酒彭生乘邦昌之醉擁之曰官家事已至此它復何言即衣之赭色半臂邦昌醉中猶能却彭呼二三宫人力挽而穿之益之以酒掖邦昌入福寧殿使宫人之有色者侍邦昌寢邦昌既醒皇恐而趨就它室急解其衣固已無及矣邦昌卒坐此以死蓋詔中及之者也姑叙邦昌初終於帙焉嗚呼彭生者誠可誅矣然當時在庭之臣被二聖寵榮者尚奉賊稱臣賣降恐後彼小人也又何足道哉彭事陸務觀云旰宋刻作盱尼堪相金國取大遼繼擾我朝既歸乃欲伐夏國夏人陰爲之備久矣忽求釁於夏言欲馬萬匹夏人從其請先以所練精兵每一馬以二人御之紿言於金人曰萬馬雖有然本國乏人牽攏今以五千人押送請遣人交之尼堪遣人往取皆善騎射者其實欲以窺之也至境未及交馬夏人羣起金國之兵悉斃夏人復持馬歸國尼堪氣沮自此不敢西向發一矢玉隆外祖云揮麈後録卷四欽定四庫全書揮麈後録卷五宋王明清撰諡以節惠孟子謂名之幽厲孝子慈孫百世不能易三代以來君臣務取美稱遂至失實國朝諸諡宋常山退朝録備載之止於熙寧三年明清謹續之於後然聞見未廣姑存所記憶遺落尚多當嗣益之后諡慈聖光獻宣仁聖烈昭慈聖獻昭懷欽聖獻肅欽成欽慈顯恭顯肅顯仁明節憲節憲聖慈烈成穆成恭妃諡昭靜沈貴妃明達懿文後追冊爲明達皇后明節和文後追冊爲明節皇后靖淑王賢妃太子諡沖憲茂元懿敷莊文愭諸王諡端獻吳王顥端懿益王頵沖僖檉悼敏楫沖穆材哀獻俊沖厚僴惠价沖惠倜公主諡賢惠蜀國公主王晉卿室賢穆韓嘉彥室賢德懿行王師約室賢穆明懿錢景臻室賢惠張端禮室賢靜柔志公主淑和端福公主沖懿賢福公主悼穆㣲福公主順穆介福公主宗室諡恭憲世雄恭孝宣旦仲湜士緘克寛榮穆宗暉僖簡宗景康孝仲御僖靖承裕僖安仲汾恭僖宗博僖穆宗璞和恭承顯康僖克戒勤孝宗惠敦和克和僖惠宗隱宗勉修安克敦孝靖宗綽簡獻仲忽安憲宗悌士孝恪仲芮敦恪仲操良僖仲嬰世恩叔嶠孝僖宗衮仲癸僖惠仲隗榮思宗諤孝良仲臯令蘧修簡仲萉和僖仲防欽修仲碩榮孝仲嗟仲革孝穆世瓞惠孝仲佺孝修世奬令穆孝恪世膺全稼安恪仲玘孝簡世輝順思仲􅍀孝恪仲摻孝恭世恪世恬敦孝仲越孝敦仲僕恭惠叔􅀈純僖仲麗惠和檢之忠孝世表叔武叔充榮惠世設良恪克章叔珫令瓘安良世括容孝叔亞惠恭世采榮恪叔雅叔黔恭宜世鳴榮敏叔縱良恭世亨良憲叔敖益世逢孝敏士會思裕叔安莊靖叔苖莊節叔炤温獻令圖良裕士空忠敏令穰孝榮令鐸良懿令瑤安惠世顒安僖秀王温靖士俴恭靖士㒟不微士樽襄靖令懬文獻令祉忠靖士珸康宗旦宰相諡宣靖曾魯公公亮忠獻韓魏王琦文忠富韓公弼張天覺商英忠烈文潞公彥博正獻吕申公公著忠肅劉同老摯虞并武允文正愍吕汲公大防忠宣范堯夫純仁忠懷蔡持正確文恭王禹玉珪正憲吳沖卿充莊敏韓玉汝縝文定韓儀公忠彥文王荆公安石獻肅陳秀公升之文憲劉德初正夫何清源執中文正司馬温公鄭達夫居中清憲趙正夫挺之文肅曾魯公布忠穆吕成公頤浩文和李士美邦彥忠定李伯紀綱伯汪廷俊彥文恭陳魯公康伯正獻陳福公俊卿文惠洪景伯适史直翁浩文靖梁叔于克家文忠京丞相鏜執政諡文憲蘇公易簡文定張太保方平許公將文忠歐陽太師修清獻趙少保抃康靖趙叔平槩章簡元厚之絳張子公燾簡翼張公璪修簡胡公宗愈莊定王正仲存恭敏蒲傳正宗孟定簡温虞弼益忠定孫傳忠穆郭公逵張公懿安簡邵公亢襄敏王公韶康懿何中正康節張公昇忠肅陳公過庭文敏吕吉父惠卿李漢老邴恭愍聶昌恭敏嶭公向獻簡傅公堯俞敏肅蔡公挺懿簡趙天觀瞻温靖孫公固莊敏章公楶文節林子中希文簡張康國鄧洵武文正蔡元度卞忠憲种公師道忠肅劉立道大中忠文張􅄞仲叔夜李彥穎文懿管歸善師仁安惠鄧聖求温伯忠武韓蘄王世忠忠烈張循王俊忠獻胡成公世將敏肅魏道弼良臣忠武岳公飛敏節王子尚庶章簡張彥程元籲正綱克俊忠敏沈必克與永莊定劉共父珙莊簡李泰發光簡穆辛􅂒李次膺簡惠周敦義葵莊敏汪明逺徹文安洪景嚴遵安簡王公剛中榮敏謝開之廓然􅉖節王正道倫文臣諡文穆范成大忠文范蜀公鎮宋尹喬年文恪王中丞陶章敏滕元發甫懿恪王宣徽拱辰文憲强翰林淵明洪尚書擬文簡蔡鯈昌程大宣簡李浦邦彥父忠􅉖徐給事禧水李侍郎若忠憲耿傳忠毅向子韶忠簡張克戩趙令㡬胡邦衡銓張大猷闡忠顯劉公韐文昭曾翰林肇莊節王復恭􅉖錢歸善唐重定􅉖胡唐老威􅉖鄭驟霖澤宗汝剛􅉖曾逢原孝序文靖楊侍郎時文定胡待制安國忠襄楊邦乂勇節郭永莊敏藺中謹韓彥直子温林栗黃中忠壯章且叟􅁩康節邵先生雍節孝徐仲車積忠定劉元城安世文康葛銀青勝仲忠惠蔡君謨襄文忠東坡先生忠宣洪光弼皓獻簡陳邦彥良翰獻肅胡周伯沂文張大經彥康肅吳明可芾文清曾吉父㡬忠肅陳瑩中瓘傅公晦察忠介王子飛雲清敏豐相之稷清孝葛君書思僖敏張如瑩澄賢節王庠忠鄒志完浩忠確張公克戩僖簡莊公徽肅愍宇文虛中節肅龔彥和夬文惠韓公粹彥文僖姚祐夀祖忠敏任德翁伯雨惠懿楊子寛偰武臣諡忠愍髙永年武莊郝質武恪賈逵忠敏姚麟武愍劉法忠節李彥仙忠壯徐徽言李邈馬彥博穆武髙繼勲恭勇楊惟忠勤惠王德恭勤毅宋守約康理楊應詢康簡髙敦復威肅劉仲武勇節郭永忠勇蘇緘武安吳玠武順吳璘莊􅉖种師中毅肅劉公昌祚忠介楊宗閔恭毅楊震武恭楊存中剛烈劉位忠朱沖勤威馮守信武僖劉光世武穆劉錡忠烈趙立義節王忠植莊敏王厚毅勇闗師古壯愍曲端襄毅楊政外戚諡恭敏李端慤王師約壯恪劉永年惠節向傳範康懿向經良僖劉安民榮穆劉從愿良顯王憲榮縱向宗回榮僖髙公繪
