front:
  text: 揮麈前録卷之二草一朝請大夫主管台州崇道觀汝隂王明清祖宗朝重先代陵寢每下詔申樵採之禁至于再三
  hash: sha256:21287cc9e2fb2d7903741784b428428f40f912831962fd36f2048e0a49c7cad9
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_002-1a}
body:
  text: 置守冡户委逐處長吏及本縣令佐常切檢校罷任有無廢闕書于曆子太昊葬宛丘在陳州炎帝葬長沙在潭州黃帝葬稿山在上郡今坊州界髙陽葬臨河縣故城東髙辛葬濮陽頓丘城南臺隂城唐堯葬城陽榖林今鄆州界舜葬零陵郡九疑山今永州界女媧葬華州界夏禹葬會稽山今越州會稽縣啇湯葬寶鼎縣周文王武王並葬京兆府咸陽縣界漢髙祖葬長陵在耀州安北後漢丗祖葬原陵在洛陽縣界唐髙祖葬獻陵在耀州三原縣東太宗葬昭陵在醴泉縣北九堫山以上十六帝各置守陵五户每歲春秋祠御書名祝板祭以大牢諸處舊有祠廟者亦别祭饗啇中宗帝大戍葬內黃縣東南陽武丁葬西華縣北周成王康王皆葬畢在咸陽縣界漢文帝葬霸陵在長安東南宣帝葬杜陵在長安南魏武帝葬髙陵在鄴縣西晉武帝葬峻陽陵在洛陽後周太祖文帝葬成陵在耀州富平縣隋髙祖文帝葬太陵在武功縣以上十帝置三户歲一饗以太牢秦始皇帝葬昭應縣漢惠帝葬安陵景帝葬陽陵在長安東北武帝葬茂陵在長安西後漢明帝葬顯節陵章帝葬敬陵並在洛陽東南魏文帝葬首陽陵在偃師縣後魏孝文帝葬永寧陵在冨平縣唐明皇泰陵憲宗景陵俱在奉天縣肅宗建陵葬醴泉縣宣宗正陵在雲泉縣朱梁太祖葬興極陵在伊闕縣後唐莊宗葬伊陵在新安縣明宗葬徽陵在洛陽東北石晉髙祖葬顯陵在壽安縣以上十五帝各置守陵兩户三年一祭以太牢凡祭祀皆令長吏行禮所用太牢以羊代之陵户並以陵近小户充除二稅外免諸雜羌徭周桓王葬澠池縣東北靈王葬河南縣桓亭西周山上景王葬洛陽城中西北隅前漢元帝葬渭陵在長安縣成帝葬延陵在咸陽縣哀帝葬義陵在扶風平帝葬康陵在長安縣北後漢和帝葬慎陵塋中庚地安帝葬恭陵在長安西北順帝葬順陵沖帝葬懷陵並在洛陽西質帝葬靜陵桓帝葬宣陵並在洛陽東靈帝葬文陵在洛陽西北獻帝葬禪陵在渭城北魏明帝葬髙平陵在河淸縣髙貴鄉公葬洛陽瀍澗之濵陳留王葬王原陵在鄴西晉惠帝葬太陽陵在洛陽魏文帝葬冨平縣東南東魏孝靜帝葬鄴唐髙宗乾陵睿宗稿陵穆宗光陵僖宗靖陵並葬奉天縣中宗定陵代宗元陵順宗豐陵文宗章陵懿宗簡陵並葬冨平縣德宗崇陵敬宗莊陵武宗端陵並葬三原縣昭宗和陵葬河南緱氏縣梁末帝葬伊闕縣後唐末帝葬明宗陵內以上三十八帝常禁樵採此乾德四年十月詔也著于甲令其後又詔曾經開發者重製禮衣常服棺槨重葬焉東晉以降六朝陵寢多在金陵丹陽之間皆可考識而制書不載者當時江左未平故耳先子嘗纂歷代陵名自漢髙帝建名以來雖后妃追崇僣霸草二無有遺者今行于丗國朝百官致仕庶僚守本官以合遷一官回授任子侍從仍轉一官宰執換東宫官熙寧初歐陽文忠公始以太子少師帶觀文殿學士致仕示特恩也故謝表云道愧師儒乃忝春宫之峻秩身居畎畒草三猶兼書殿之隆名自是以為例國朝侍從以上自有寄祿官如左右正言二史給諫吏禮部郎中之類是也若庶僚曾經飾擢至於雜流甄敘悉皆有别一見刺字便知涇渭元豐官制草四既行混而為一故王荆公有流品不分之語舊制如侍從致仕轉官遺表贈四官皆自其合遷官草五上加之今則寄祿官至升朝轉贈僅止貟郎而巳蒲傳正在翰林因入對神宗曰學士職清地近非它官比而官儀未寵自今冝加佩魚遂著為令見于神宗實録東坡先生謝入翰林表曰玉堂賜篆仰淳化之彌文寶帶重金佩元豐之新渥中書舍人繫紅鞓犀帶自葉少藴始見姚令威叢語而石林自記却不及舊假服色不佩魚崇寧末王照尚書詳定勑令啓請許之自是為例仍許入銜具草六載詔書其後以除勑中不載多不署魚袋二字國朝凡登從班無在外間居者有罪則落職歸班亦奉朝請或黜守偏州甚者乃分司安置不然則告老挂冠熙寧間始置在外宫觀本王荆公意以處異論者而荆公首以觀使間居鍾山者八年官制後惟光祿大夫及中散朝議二大夫分左右增磨勘而巳初非以科第也元祐間范忠宣當國始帶左右紹聖初罷去事見常希古奏疏大觀二年又置中奉奉直二大夫徹中散朝議左右字紹興初樞密院編修官楊願啓請再分左右自是以出草八身為重前宰相為樞密使者宋元憲冨鄭公文潞公陳秀公宣和二年鄭華原以故相領院事紹興七年秦師垣亦以前揆拜樞密使未幾復登庸近歲張魏公亦然李邦直許沖元曾令綽韓師朴為二府後皆再入為尚書然不久復柄用惟令綽竟止八座舊制樞密使知樞密院奏薦子弟皆輔班行故冨鄭公之子紹京文潞公之子貽慶皆為閣門祗候元卅豐後方授文資神宗朝詔樞密院編修經武要略以都承旨張誠一提舉誠一武臣也乞差編修官二貟時王正仲胡完夫為館職詔令兼之是夕忽御批提舉改作管勾詰朝執政啓上所以上云巳差館職編修豈卅一可令武臣提舉而樞密院編修自此始也樞密院舊皆武臣如都承旨亦然國初二曹俱嘗為之熙寧中王荆公怒李評罷去命曾令綽為都承旨自是方文武互用矣仁宗以大中祥符七年由慶國公出閣隆興初湯特進封慶國公明清嘗以故事啓之遂上章辝不敢受改封榮國公王將明白蒙亨宣和間皆封慶公卅三而不辝豈一時忘之耶政和中詔天下州縣官皆帶提舉管勻學事時姚麟以節度使守蔡州建言乞免繫階朝廷許之靖康初除去紹興中復增但改庶官為主管時孟信安仁仲來帥會稽先人寓居孟氏與家間契分甚厚仁仲以兄事先人入境語先人云忠厚與秦會之雖為僚壻而每懷疑心今省謁櫕宫先入朝然後開府從兄求一不傷時忌對劄先人舉此仁仲大喜為援麟舊請草牘以上奏入即可尋又降卅四旨自此武臣帥守並免入銜行之至今國朝范魯公王文獻溥魏宣懿仁浦秉鈞史館昭文集賢三相俱全太宗初即位薛文惠居正沈恭惠倫盧大戎多遜真宗咸平二年李文靖沆文簡敏中吕文穆蒙正仁宗至和二年劉文忠沆文潞公彥博冨韓公弼元祐初司馬溫公為左僕射文潞公平章軍國重事吕正獻平章軍國事皆三相也至三年溫公薨文吕二公在位而吕汲公大防卅五范忠宣純仁為左右僕射殆四相然不久也本朝宰相兼公師者范魯公王文獻趙韓王薛文惠王文貞丁晉公馮文懿王文公吕文靖韓忠獻曾宣靖富韓公文潞公吕正獻蔡師垣秦師垣陳魯公而巳餘皆罷政後方拜近日惟張魏公自外以卅六少傳再拜右揆本朝三入相者趙韓王吕文穆文靖張鄧公文潞公卅七蔡元長雖四入而不克有終國朝自外拜相者文潞公韓康公章子厚近年陳原卅八公亦曠典也元符末曾文肅自知樞拜相公弟文昭為翰林鎖宿禁中靣對喻旨草麻文昭力辝上云弟草兄麻太平美事禁中巳檢見韓絳故事矣不須辝文昭始拜命蓋熙寧初韓康公入相實持國當制國朝以來兩家而巳金坡遺事載錢希白為文僖草麻雖云儀同鈞衡實未嘗秉政也是時母氏年九歲偶至東府門外觀閲歸告文肅云翁翁明日相矣適見快行家宣叔翁入內甚急以是逆料巳卅九而果然國朝宰相享耆壽者宋惠安八十張鄧公八十六陳文惠八十二冨文公八十一杜祁公八十宋元獻七十九李文定七十七曾宣靖八十龐頴公七十六蘇丞相八十二文潞公雖至九十四而薨貶秩中蔡師垣亦八十晚節拘籍南遷殂於中路不得四十全有冨貴考終本朝名公多厄於六十六韓忠獻歐陽文忠王荆公四一蘇翰林而秦師垣復獲預其數吕正惠吕文穆亦然本朝宰相登庸年少者常山春明退朝録備見之然無逾近歲范覺民丞相廷告日方三十一但壽止三十七其後張魏公入相亦未四十且太夫人康健罷相之後遷謫居外幾二十年後雖入竟不拜四二元宰國朝身為宰相壽考康寧再見其子入政府者惟曾四三宣靖一人而巳吕文穆相太宗猶子文靖參真宗政事相仁宗文靖子惠穆為英宗副樞為神宗樞使次子正獻為神宗知樞相哲宗正獻孫舜徒四四為太上皇右丞相繼執七朝政真盛事也本朝一家為宰執者吕氏最盛既列于前矣父子兄弟者韓忠憲億子康公絳黃門維莊敏縝范文正仲淹子忠宣純人左轄純禮石元懿熙載子文定中立吕參政餘慶弟正惠端陳參政恕子恭公執中曹武惠彬子武穆瑋任安惠中師弟康懿中正張參政洎孫左轄璪王惠獻化基子安簡舉正陳文忠堯叟弟文惠堯佐王文獻傳孫康靖貽永章文獻得象從孫壯恪楶丞相惇王樞密博文子忠簡疇吳正肅育弟正惠充曾宣靖公亮子樞密孝寬韓魏公琦子文定忠彥曾孫樞密肖胃胡文恭宿姪左丞宗愈張榮僖耆曾孫忠文叔夜梁懿肅適孫中書子美蔡忠懷確子樞密懋林文節希從子中書攄蔡太師京子樞密攸鄧樞密洵武弟左轄洵仁近日如錢參政端禮之於文僖史簽書才從子丞相浩亦一家而洪右相適樞密遵為伯仲數十年未嘗見也王文公安石弟左轄安禮冨韓公弼四五孫知樞直柔韓循之奉常治之妻魯國太夫人文氏潞公之孫魏公之孫婦儀公之冢婦吕惠穆之外孫魯簡肅之外曾孫吕文靖之曾外孫身見其子肖胃為樞密壻鄭億年為資政殿大學士儀同執政他子與孫俱𬒳飾擢壽隃八秩婦人中罕有唐張延賞苗夫四六人可儷之也錢武肅鏐自唐乾寧中盡有二浙之地享國五丗至忠懿王俶以版圗來歸改封鄧國王子弟皆換節旄其後弟十四子文僖惟演以文章進仕昭陵為樞密使文僖子次對暄次對子景臻尚秦魯公主位至少保生子伯誠忱亦至少師它子悉建節伯誠子處和端禮今參知政事忠懿兄廢王倧之子希白易希白子修懿明逸子飛彥逺兄弟對掌內外制父子又中大科子飛子穆協元祐中入禁林穆子遜叔伯言至樞密直學士他位顯庸尚多雖間有以四七肺腑進然冨貴文物三百年相續前代所未見也晏元獻夫人王氏國初勳臣超之女樞密使德用之妹也元獻壻冨鄭公也鄭公壻馮文簡文簡孫壻蔡彥清朱聖豫聖豫女適滕子濟俱為執政元獻有古硯一竒甚王氏舊物也諸女相授號傳壻硯今藏滕氏朱之孫女適洪景嚴近又登二府亦盛事也又有古犀帶一亦元獻舊物今亦藏滕氏明四八清嘗於子濟子珙處見之本朝居政府在具慶下者王文獻盧大戎包孝肅張文孝吳長文吳正肅吕吉父章子后安厚卿馮彥為曾四九令綽王彥霖李士美王將明蔡居安林彥振王元忠本朝狀元登庸者吕文穆李文定王文正宋元憲故詩人有云皇朝四十三龍首身到黃扉止四人王文安覽之不恱後數十年李士美何文亦以廷五十魁至鼎席唐朝丗掌絲綸以為美談而本朝以來兄弟居禁林者竇可象儀弟望之儼宋元憲景文王荆公和父韓康公持國蘇翰林子由曾文肅文昭蔡元長元度鄧子裳子文張康伯賔老宇文仲逹叔通父子則李文正昌武朝文元文莊梁翰林固懿肅適蔡文忠仲逺延慶錢希白子飛蘇儀甫子容一家則張尚書洎唐公瓌邃明璪范蜀公子功淳父元長而淳父元長又父子也錢氏又有純老穆父焉葉道卿少藴而蔡君謨之於元長兄弟亦一族也外制則前人俱嘗掌之惟曾南豐與文昭文肅兄弟三人焉孔經父常父劉邍父贛父與從子少馮又對掌內外五一制也近日於洪忠宣父子間再見之雍孝聞蜀士之秀也元符末有聲太學學者推重之崇寧初省試奏名第一前此婁上封事剴切九重固巳默識其名至是殿䇿中力詆二蔡及時政未便者徽宗大怒減死竄海外宣和末上思其忠親批云雍孝聞昨上書致罹刑辟忠誠可嘉特開落過犯授修武郎閣門宣贊舍人命攽而孝聞死矣於是録其子子純為右選紹興初從張魏公入蜀魏公令屬趙哲軍中哲誅子純坐編管既死魏公憐之復致其子安行一官紹興間以告訐流領外不知所終五二三丗俱以罪廢與前所紀諸家不侔然亦不幸也唐朝崔盧李鄭及城南韋杜二家蟬聮圭組丗為顯著至本朝絶無聞人自祖宗以來故家以真定韓氏為首忠憲公家也忠憲諸子名連系字康公兄弟也生宗字宗生子名從玉字玉生子從日字日生元字元生子從水字居京師廷有桐木都人以桐樹目之以别相韓焉相韓則魏公家也魏公生儀公兄弟名連彥字彥生子名從口字口生子從胄字胄之子名連三畫或謂魏公之命以其名琦字析焉東萊吕氏文穆家也文穆諸子文靖兄弟也名連簡字簡字生公字公字生希字希字生問字問字生中字中字生大字大字生祖字河內向氏文簡公家也文簡諸子名連傳字傳字生子從系字系字生從宗字欽聖憲肅兄弟也宗字生子字子字生水字水字生土字土字生公字兩浙錢氏文僖兄弟名連惟字惟字生日字日字生景字景字生心字心字生之字在長主孫則連端字賜名也曹武惠諸子名連玉字玉字生字慈聖光獻昆季也人字生言字言字生日字日字生水字水字生絲字髙武烈諸子連遵字遵字生士字宣仁聖烈兄弟也士字生公字公字生丗字丗字生之字朝文元諸子名連宗字文莊兄弟也宗字生仲字仲字生端字端字生之字之字生公字公字生子字李文定本甄城人既徙京師都人呼為濮州李家李文和居永寧坊有園亭之勝築髙樓臨道邊呼為看樓李家李邯鄲宅並念佛橋以橋名目之陳文惠居近金水門以門名目之王文貞手植三槐于廷都人以三槐表之王文正本北海人以青州王氏别之王景彛居太子巷以巷名目之王審琦太師九子以九院呼之張榮僖以位顯名以待中家目之賈文元居廂後宋宣獻居宣明坊亦以巷名目之宋元獻兄弟安陸人以安州表以上數家派源既繁名不盡連矣在江南則兩曾氏宣靖與南豐是也曾文清兄弟亦以儒學顯又二族矣三蘇氏太簡儀父明允兩范氏蜀公與文正是也若莆田之蔡白沙之蕭毗陵之胡會稽之石番陽之陳新安之汪吳興之沈龍泉州之鮑皆為今之望五三族而都城專以戚里名家又數家不能悉數也建州浦城最為僻邑而四甲族皆本縣人楊氏則起于文莊章氏則肇自郇公蓋練夫人孫夫人隂德丗多傳焉黃氏本于子思陳氏本于秀公軒裳極五四盛今仕途所至有之浦城章氏盡有諸元子平為廷試魁而表民望之制科第一子厚悙開封府元正夫楶鎖廳元正夫子綡為國學元子厚子援為省元次子持為别試元其後自閩徙居吳中族屬既殷簪裳益茂至今放榜必有居上列者章氏自有登科題名石刻在建陽揮麈前録卷之二
