  - {type: variant, offset: 0, length: 6748, content: 揮麈後録卷之十一百七六汝隂王明清孫仲益毎爲人作墓碑得潤筆甚冨所以家益豐有爲晉陵主簿者父死欲仲益作誌銘先遣人逹意于孫云文成縑帛艮粟各當以千濡毫也仲益忻然落筆且溢美之旣刻就遂寒前盟以𥿄筆龍涎建茗代其數且作啓以謝之仲益極不堪即以駢驪之詞報之略云米五斗而作傳絹千匹以成碑古或有之今未見也立道旁碣雖無愧詞䛕墓中百七七人遂成虚語翟無逸云韓璜叔夏爲司諌奉使江外回赴堂白事徐康國爲兩浙漕亦以職事入謁中書康國自謂踐掦之乆率多傲忽旣詣省候于廊廡以待朝退一緑衣少年巳先在焉天尚未辨明康國初不知爲叔夏也貌慢之偃然坐胡床雙展兩足于火踏子之上目視雲霄乆之始問曰足下前任何處緑衣曰乍脫州縣時方事之殷外方多以獻利害得審察之命因以求任使者康國疑爲此等易之曰朝廷多事之際隨材授官乍脫州縣者未易遽干要除有堂吏過與之揖康國且詫于緑衣曰此某中奉也某在此儻非諸公調護亦焉能乆安耶語未終丞相下馬遣直省吏致意康國曰適以韓司諌奉使廻得旨有所問未及接見吏引緑衣以登回首揖康國而趍康國始知爲諌官驚悵恐怖脚蹙踏子飜空灰火滿地皇灼而退是時有流言劉剛據金陵叛剛知之束身星馳詣闕自明適康國翌日再造有黮袍後生武士復在焉康國反前日之轍先揖而問之曰適從何來武士曰來自建康康國遽問曰聞劉剛巳反公來時如何武士作色曰吾即劉剛吾豈反者想公欲反耳康國又慚而去越數日竟爲叔夏彈其交結堂吏臣所目覩而罷外舅云百七八傳崧卿子駿以都司奉使二浙回行在所時王唐翁張全真爲參政子駿旣至堂中諸公問以部使者郡太守治狀子駿曰浙東提點刑獄王翿殊不職次欲啓知明州張汝舟始悟適犯唐公諱矣思所以避之卒然白明州張守尤無狀頃刻之間二執百七九政姓名俱及之錢德載二范擇善同宣和中登第得江西教官自當塗奉雙親之官其父至上饒而殂寓于道旁之蕭寺中進退彷徨主僧憐之云寺後山半適有一穴不若就葬之不但免般挈之勞而老僧平日留心風水此地朝揖絶勝誠爲吉壤擇善從之即其地而殯之其後擇善驟貴登政府乃謀歸袝于其祖兆請朝假以往改卜時老僧尚在力勸不從才徙之後擇善以飛語得罪于秦㑹之未還闕言者希指攻之云同以迁葬爲名謁告于外搔擾州縣迁謫而死趙宣明云百八十季漢老與秦㑹之賀進維垣啓云推赤心於腹中君旣同於光武有大勲於天下相自比於姬公秦答之云君旣同於光武仰歸美報上之誠相自比于百八一姬公其敢犯貪天之戒漢老得之皇恐者累月建炎末范覺民當軸下討論之制論崇觀以來汎濫受賞迁擢與夫入仕之人官曹殽乱冝從鐫汰自此僥倖之徒屏迹不敢出紹興辛酉御史廼言以謂方事之殷從軍之人多有受前日之濫賞者願亟罷此文以安反側詔從之盖是時秦㑹之初用事也先是宣和𥘉鄭達夫爲相逹夫與㑹之俱華陽王氏婿㑹之以其兄楚材梓嘱于逹夫㑹傅墨卿使髙麗逹夫俾楚材以傔從墨卿𥙷下班祗應泊回即以献頌直赴殿試祐陵實録亦畧載之又王顯道以逹夫婿冒寵位中大夫祕閣脩撰且㑹之夫人同包也金彦行安節爲諌官甞陳其事于㑹之䟽中二人擯跡累年至是御史希㑹之之旨以爲之地繇此二人俱彼峻用不及一歳皆登從班建炎末先人爲樞宻院編脩官𬒳旨專一纂集百八二祖宗兵制書成進呈髙宗皇帝覧之稱善諭宰臣范覺民宗尹云王某所進兵制甚佳朕連夕觀之爲目痛可改官與陛擢差遣賜其書名曰樞庭備撿時秦㑹之爲叅知政事素與先人議論不同雖更秩然自此去國矣王鈇字承可㑹之舅氏王本觀復之子㑹之心𣣔用之薦于上謂有史才名適與先人偏旁相似上忽問云豈非脩兵制者乎㑹之即應之云是也詔再除樞属徐獻之琛亦王氏甥與㑹之爲中表而師川之族弟㑹之知髙宗眷念師川不替一日奏事啓上云徐俯身後伶俜可憐有弟琛能承兄之業願陛下録用之上從其請其後承可獻之皆爲貳卿百八三㑹之並縁罔上率皆類此紹興巳未周敦義葵爲侍御史梁仲謨汝嘉爲户部尚書敦義欲論之甫属藁而泄其事于仲謨時秦㑹之秉鈞仲謨致懇欵于㑹之㑹之領略之是夕敦義牒閣門明朝有封事求對翌日㑹之奏事即擬除敦義爲左史天意未允敦義方侍引㑹之下殿即喻閤門云周葵巳得旨除起居郎隔下又明日敦義立螭直前愬之髙宗喻㑹之云周葵遽易之何也㑹之云周葵位長言路碌碌無所建明且進退百官臣之職也儻以臣黜陟不公願先去位上云不須如此是日批出周葵與郡遂出守霅川秦含怒未巳思多方誤之未幾易守平江㑹李仲永椿年爲浙漕應辦北使㑹之喻意仲永使爲之所仲永之回即入奏敦義在郡錫燕虜使飲食臭腐致行人有詞講和之𥘉不冝如此敦義落職罷郡謝表云雖宰夫是供各司其職耳然百八四王事有闕是誰之過歟自是投閑十五年紹興庚申秋虜人敗約復取河南故地秦㑹之在相位蹤迹頗危時馮濟川檝爲貳卿一日相見告之云金人背盟我之去就未可卜如前此元老大臣皆不足慮獨君郷衮未測淵衷如何公其爲我探之翌日濟川求對啓上云金冦長駈犯淮勢須興師如張某者當且以戎機付之髙宗正色曰寧至覆國不用此人濟川亟以告秦秦且喜且感濟川云適觀天意檝必被逐願乞瀘川以爲晝繍至晩批出馮檝令與外任遂以檝爲待制帥瀘百八五南在任凢十二年張文老云方公美庭實興化人其父宣和中嘗爲廣南提學以卒公美後登科至紹興間自省郎爲廣東提刑以母憂去官服闋復除是職公美辤以不忍往秦㑹之不樂降旨趣行公美強勉之官謝上表云三舎教育先臣之遺愛尚存一笑平反慈母之音容百八六未逺讀者哀之巳而竟没於嶺外蘇少連云馬子約純紹興中爲江西漕時梁企道楊祖爲帥每強盗勑下貸命必配潮州喻部吏至郊外即投之江中如此者屢矣子約云使其合死則自正刑典以其罪止於流故赦其生猶或自新旣断之後即平人尔倘如此與殺無罪之人何以異乎二公由此不咸後以它事交愬于朝俱罷去𥘉熈寧中子約父處厚黙知登州建言乞减放沙門島罪人處厚時未有嗣夣天錫一子當壽八十仕至諌議大夫前人巳記之矣子約隆興𥘉以太中大夫致仕百八七壽八十一而終太中蓋官制前諌議大夫也紹興丁夘歳明清從朱三十五丈希真乞先人文集序引文旣成矣出以相示其中有云公受今維垣益公深知倚用而不及明清讀至此啓云竊有疑焉朱丈云敦儒與先丈皆秦㑹之所不喜此文傳播逹其聞聽無此等語至掇禍明清云歐陽文忠與王深父書云吾徒作事豈爲一時當要之後丗百八八爲如何也朱丈歎伏除去之近有名家子知邵州時辛永宗爲湖南緫管駐劄郡下永宗兄弟早侍上有眷秦㑹之方自虜中來歸與冨季申争寵指諸辛爲黨㑹之深嫉之及㑹之登師垣旣竄其兄企宗道宗邵守迎合按永宗冒請全俸合計以贓會之得所申大喜下本郡閱實焉永宗實以嘗立軍功許給有御札非僞守先以計取得之以送秦矣秦旣當路無從辯白竟凖以盗論流端州盡籍其家以責欠選郡僚之苛酷者使録橐一簪不得與償旣及數猶謂所遣官云前赴其家燕集以某器勸酒今乃不見豈隱之百八九邪殘刻有如是者吕稽中紹興壬戍罷三大帥兵柄時韓王丗忠爲樞宻使語馬帥解潜曰雖云講和虜性難測不若姑留大軍之半于江之北觀其釁公其爲我草奏以陳此事解用其指爲劄子韓上之巳而付出秦㑹之語韓云何不素告我而遽爲是邪韓覺秦詞色稍異倉卒皇恐即云丗忠不識字此乃解潜爲之使某上耳秦大怒翌日貶潜單州團練副使南安軍安置百九十竟死嶺外張子韶云榮茂丗薿爲湖北漕置司鄂州有都統司統制官王俊以其舊主帥岳飛父子不丗狀詣茂丗陳首茂云我職掌漕計它無所預却之俊遂從緫領汪叔詹陳其事汪即日上聞奏㑹之得之藉以興羅織之獄殺岳父子知茂丗不受理深怨之而髙宗於茂丗有霸府之舊秦屢加害而不從秦死榮竟登從班汪訐岳之後獄方竟而殂豈非命歟榮次新云舅氏曾宏父生長綺紈而風流醖藉聞于薦紳長於百九一歌詩膾炙人口紹興中守黃州有雙鬟小顰者頗慧黠宏父令誦東坡先生赤壁前後二賦客至代謳人多稱之見于謝景思所叙刋行詞䇿後歸上饒時鄭頋道吕居仁晁恭道俱爲寓客日夕往來杯酒流行頋道教其小獲亦爲此技宏父頋鄭笑曰此真所謂效顰也後來士大夫家與夫尊爼之間悉轉而爲鄭衛之音不獨二賦而巳明清兄弟兒時先妣製道服先人云須異於俗人者乃佳舊見黃太史魯直所服絶勝時在臨安呼匠者教令染之乆之始就名之曰山谷褐數十年來則人人百九二斆之幾遍國中矣秦㑹之爲相髙宗忽問陳桷好士人今何在可惜閑却當與一差遣㑹之乃繆以元承爲對云今從韓丗忠辟爲宣司參議官元承季任適同姓名上笑云非也好士人豈肯從軍耶因此遂召用仲舅云百九三姚宏字令聲越人也父舜明廷暉嘗任户待令聲少有才名吕元直爲相薦爲刪定官以憂去秦㑹之當國婁求官不報張如瑩澄與令聲爲中表令聲托爲扣之秦云廷暉與某靖康末俱位栢臺上書粘罕乞存趙氏拉其連衘持牘去經夕復見歸竟不僉名此老純直非狡獪者聞皆宏之謀也繇是薄其爲人如瑩以告令聲令聲曰不然先人當日固書名矣今丗所傳秦所上書與當來者大不同更易其語以掠美名用此誑人以僕嘗見之所以見忌巳而言逹于秦秦大怒思有以害之㑹令聲更秩調知衢州江山縣適當亢旱有廵檢者自言能以法致雷雨試之果然而邑民訟其以妖術惑衆追赴大理竟死獄中初令聲宣和中在上庠有僧妙應者能知人休咎語令聲云君不得以令終候端午日伍子胥廟中見石榴花開則竒禍至矣令聲初任監杭州稅任三載足迹不敢登呉山將赴江山也自其諸曁所居趍越來訪帥憲旣歸岀城數里值大風雨亟愒路旁一小廟中見庭下榴花盛開妍甚可愛詢祝史云此伍子胥廟其日乃五月五日令聲慘然登車未幾遂罹其酷弟寛字令威問學詳博注史記行於丗三乗九流無所不通紹興辛巳歳完顔亮舉國冦淮江浙震恐令威云木德所照當必無它故詔書云歳星臨於呉分者是也髙宗幸金陵以其言驗令除郎召對奏事之際得疾仆於榻前徐五丈敦立戲云太史當奏客星犯帝座甚急上念之亟用其弟百九四憲于朝憲無它材能不逮二兄後登政府命也熊叔雅彦詩伯通之孫早有文名紹興𥘉入館權郎秦㑹之秉釣指爲趙元鎮客擯不用者十年慈寧回鑾㑹之以功陞維垣叔雅以啓賀之云大風動地不移存趙之心白刃在前獨奮安劉之略㑹之大喜起知永州巳而擢漕湖北其後王日嚴曮爲少蓬權直禁林㑹之加恩取其聮入制詞中翌日即除禮部侍郎甲戌歳䇿士于庭有引此以對百九五大問者遂魁天下薛仲藏云外舅方務德有聞見手記近事凢六條今悉録之錢遹爲侍御史有長子之喪聞曾文肅失眷亟上彈章旣施行然後謁告㝷遷中執法呉伯舉天用當制其詞云思蹇蹇以匪躬遂􅈱􅈱而弗子未幾擊呉罷去鄭亨仲云臈㓂犯浦江境上遹具衣冠迎拜道左對渠魁痛毀時政以倖苟免㓂謂遹受朝廷爵秩之厚如此乃敢首爲訕上之言亟命其徒殺之亨仲居浦江目覩其事汪彦章詔旨中作百九六遹傳亦甚詆之李孝廣崇寧間爲成都漕以點檢卭州士人費又韋直方私試試卷詞理謗訕龐汝翼課冊係元祐學術譏詆元豐政事上聞三人並竄廣南孝廣迁官後紹興庚戌孝廣之子倞属疾于婺州謂有妖孽招路時中治之時中始不肯言倞託親舊扣問其詳時中云有一費乂者獨不肯但巳且莫知其故㝷以告倞倞云若尓某疾不復起矣因自道向來百九七費乂等事寔倞以告其父後乂軰俱客死于路政和初方允迪將就廷試前期聞御注老子新頒賜宰執欲得之以備對㑹允迪與薛肇胡有連亟從問之乃云無有也一日入薛書室試啓書篋忽見之盡能記憶泪廷試果發問毛逹可友得對䇿大喜即欲置魁選而強隱季淵明爲參詳官力争謂其間賛聖德處有一二語病必欲置十名之後逹可尤力辨旣而中夜思之時中人絡繹於諸公間万一轉而上聞非徒無益乃議寘十二名猶在甲科是時陳彦方以術得幸又令使預占今歳甲科幾人彦云七人而中人軰欲神其說宻喻主司僅取此數旣而傳崧卿以上舎薜尚友盛并以執政子皆寘甲科卒取十人允迪乃在乙科第四百九八允迪即外舅之仲父也紹興初經從嚴陵邢鈐轄招飯時老璫趙舜輔在焉坐間邢趙相語云頗記吾曹同在延福宫時事否趙唯唯因叩其事邢云一日梁師成譚稹坐于延福宫門下二人寔從主管西城所李彦者過門下馬致禮于譚梁甚恭旣去譚謂梁早來聞玉音否可畏哉趙問梁何言荅云適見李彦於榻前納西城所羡餘三百万緍上頋彦云李彦李彦莫教做弄一火大賊來斫却你頭後怎柰何不數年彦果百九九以横歛𬒳誅孟富文庾爲户部侍郎紹興辛亥之歳邊遽少寕廟堂與一二從官共議以謂不若乗時間隙分遣諸將削平諸路盗賊其方張不易擒者莫如閩之范汝爲乃以命韓丗忠而丗忠在諸將雖號勇銳然病其難制或爲州縣之害當選從官中有風力者一人置宣撫使丗忠副之以行而在廷寔囏其選衆乃謂孟人物旣厖厚且甞爲韓所薦首迁本部尚書遣之又以爲韓官巳髙亦非尚書所能令乃欲以爲同簽書上意巳定時洪成季擬爲禮部尚書吕丞相以孟除與成季參預之命同進上留擬狀值連數日假告而巳甚播初沈必先爲侍御史時嘗擊去成季至是沈召還舊列成季亦復爲宗伯以吕丞相初拜未欲論也至是聞將大用亟奏成季罷去上意以謂二相初拜薦二執政其一巳先擊去其一萬一又有議之者二相俱不安矣遂亟批出冨文除參知政事盖適記前日除冨文誤當成季所擬官二相亦恐紛紛不復申前說也然亦議定俟閩中使還即罷之而㑹逢多事在位二百獨乆凡三年然後去國紹興壬戌夏顯仁皇后自虜中南歸詔遣參知政事王慶曾次翁與后弟違淵迓于境上時虜主亦遣其近臣與内侍凢五軰護后行旣次燕山虜人憚於暑行后察其意虞有他變稱疾請于虜少須秋凉進發虜許之因稱貸于虜之副使得黃金三百星且約至對境倍息以還后旣得金營辦佛事之餘盡以犒從者悉皆懽然途中無間言由此力也旣將抵境上虜必欲先得所負然後以后歸我后遣人喻指于韋淵淵詞曰朝廷遣大臣在焉可徴索之遂詢于王初王之行也事之纎粟悉受頥指于秦丞相獨此偶出不料虜人趣金甚急王雖所賫甚厚然心懼秦疑其私相結納歸欲攘其位必貽秦怒堅執不肯償相持界上者凡三日九重初不知曲折但與先報后渡淮之日旣愆期張俊爲樞宻使請備邊憂慮百出人情洶洶謂虜巳背盟中變矣秦適以疾在告朝廷遂爲備邊計中外大恐時王以江東轉運副使爲奉迎提舉一行事務從王知事急力爲王言之不從乃自裒其隨行所有僅及其數以與之虜人喜后即日南度疑懼釋然而王不預也王歸白秦以謂所以然者以未始禀命故不敢專秦以王爲畏巳果大喜巳而后泣訴于上王某大臣不顧國家利害如此萬一虜生它計于數日間則使我母子不相見矣上震怒欲暴其罪而誅之初樓炤仲輝自樞府以母憂去位終制起帥浙東儲之欲命謝于虜廷至是秦爲王營捄回護謂冝遣柄臣往謝之於是輟仲輝之行以爲報謝使以避上怒逮歸上怒稍霽然終悪之秦喻使辝位遂以職名奉祠巳而引年安居于四明秦終憐之餽問不絶秦之擅國凡居政府者莫不以㣲過忤其指例以罪行獨王以此情好不替王卒特爲開陳贈䘏加厚諸子與壻親戚族人添差浙東者又數人以便其私議者謂秦居政府二二百一十年間終始不貳者獨見王一人而巳曾文清吉父孔毅父之甥也早從學于毅父文清以䕃入仕大觀初以銓試合格五百人爲魁用故事賜進士出身紹興中明清以啓贄見云傳經外氏早侍仲尼之間居提筆文埸曾寵平津之爲首文清讀之喜曰可謂着題矣後與明清詩云吾宗擇壻得羲之令子傳家又絶竒甥舅從來多酷似弟兄如此信難爲徐敦立覧之笑云此廼用前日之二百二啓爲體脩報耳孫立者壽春人少爲盗敗露竄伏淝河中覺有物隱然抱持而岀乃木匣一啓視之銅印一顆云壽州兵馬鈐轄之印印背云太平興國八年鑄後三十年以從軍之勞差充安豐軍鈐轄安豐即昔日壽二百三州也遂用此明清爲判官日親見之楊原仲愿秦㑹之腹心爲之鷹犬凢與㑹之異論者駈除殆盡以此致位二府出守宣城王公明與原仲爲中表原仲爲之經營舉削改官得知蘄水縣往謝原仲𣢾集醉中戲語原仲云昔嘗於吕丞相處得公頃歳所與渠書其間頗及秦之短尚記憶否公明初出無心也原仲聞之色如死灰即索之云偶巳焚之原仲自此疑公明慮其以告秦出入起居跬歩略不蹔捨夜則多以人隂加防守公明婁求歸而不從深以爲苦如此者幾歳原仲移帥建業途中亦如是焉旣抵金陵館于玉麟堂後宇諸司大合樂開燕守卒軰往觀優戯稍怠公明忽覩客船䌫于隔岸亟與其親僕絜囊喚而登之遁去㑹散原仲呼之則巳逺矣即遣人四散往訪之二百四邈不可得原仲憂撓成疾而斃蘇訓直云魏道弼良臣與秦㑹之有郷曲共學之舊秦旣得志引登禁路道弼恃其乆要一日啓于秦曰某昨夕不寐偶思量得一事非晩郊祀如遷客之乆在遐方者可囙赦内徙以召和氣秦曰足下今作何官道弼云備貟吏部侍郎奏復曰且管了銓曹職事不須胡思乱量翌日降旨魏良臣與郡出守二百五池州巳而罷去丗言秦有度量恐未必然也建中靖國初陸農師執政時天下奏案率不貸命農師語時相云罪疑惟輕所以讞上一門引領以望其生今一切從死所傷多矣時相然其言自是有末减者乾道初忽降旨揮云法令禁姦理冝畫一比年以來旁縁出入引例爲弊殊失刑政之中應今後犯罪者有司並據情欵直引條法定斷更不奏裁是時外舅方務德爲刑部侍郎入議云切詳今來旨揮今後犯罪者有司並據情𣢾直條法定斷更不奏裁切恐其間有情重法輕情輕法重情理可憫刑名疑慮命官犯罪議親貴之類州郡難以一切定斷今來除並不得將例冊引用外其有載在勑律條令明言合奏裁事件欲乞並依建隆二年二月五日勑文參詳到事理施行得旨從請二者皆仁人之言其利博哉明清頃焉不自度量嘗以聞見漫緝小帙曰揮麈録輒以鏤板正疑審是于師友之前乆矣竊伏自念平昔以來父祖談訓親交話言中心藏之尚餘不少始者乏思慮筆之簡編傳信之際或招怨尤今復惟之侵㝷晩景倘弃而不録恐一旦溘先朝露則俱墯渺茫誠爲可惜若夫於其中間善有可勸悪有可戒出於無心可也豈在於因噎而廢食朝謁之暇濡毫紀之㧾一百七十條無一事一字無所從來釐爲六卷名之曰揮麈後録尚容思索嗣列于左紹熈甲寅上元日汝隂王明清書于武林官舎半山樓古之史官小事書于簡牘所謂廣記備言者在此東漢以後傳記益衆皆以爲史筆之資然而詮擇不精疑信相半紬書者病之汝隂王仲言家傳史學三丗矣族黨交㳺無非一時名公巨人平日談論皆後學之所未聞者渡江以來簡冊散亡老成凋落於是有攷焉曩嘗筆其所聞爲揮麈録旣又續之所記益廣其間雅徤之文著述之體誠有所自來也儻使遂一家之言當不愧實録云海陵王禹錫謹書揮麈後録卷之十一, WYG: ''}
