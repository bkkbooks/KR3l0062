  - {type: variant, offset: 137, length: 1, content: 十, WYG: 本傳字簡之王荆公集中有寄郎簡之詩甚稱其賢少焉司馬季思來其去復問明清云温公兄弟何以不連名明清答以温公之父天章公生於秋浦故名池從子校理公生于鄉中名里天章長子以三月}
  - {type: variant, offset: 139, length: 0, content: '', WYG: 日生名旦後守宛陵生仲子名宣晚守浮光生温公名光承平時光州學中有温公祠堂存焉敦立大喜曰皆是也且顧坐客云卒然而酬博聞如此可謂俊人矣烏乎敦立今墓木將栱言之於邑郭熙畫山水名盛}
  - {type: page-break, offset: 139, content: '', id: KR3l0062_WYG_004-10b, image: WYG1038/WYG1038-0394d.png}
  - {type: variant, offset: 141, length: 2, content: 降誕, WYG: 時嘗為翰林院待詔熙寜初其子思登進士第至龍圖閣直學士更帥三路既貴廣以金帛收贖熈}
  - {type: variant, offset: 144, length: 1, content: 因, WYG: 遺筆以藏於家繇是熙之畫人間絶少思亦多材藝有笑談可用集行于世元祐中呂微仲當軸其兄大忠自陜漕入朝微仲虛正寢以待之大忠辭以相第非便微仲云界以中􅋼即私家也卒從微仲之請時安厚卿亦在政府父日華尚康寜且具慶焉厚卿夫婦偃然居東序時人以此别二公之賢否姚寛令威明清先友也著西溪殘語考古今事最為詳備其間一條云舊於㑹稽得一石碑論海潮依附隂陽時刻極有理不知其誰氏復恐遺失故載之觀古今諸家海潮之説多矣或謂天河激湧葛洪潮説亦云地機翕張見洞真正一經盧肇以日激水而潮生封演云月周天而潮應挺空入漢山湧而濤隨施師謂僧𨼆之之言析木大梁月行而水大見竇叔蒙濤志源殊派異無所適從索𨼆探微宜伸確論大中祥符九年冬奉詔按察嶺外嘗經合浦郡亷州㳂南溟而東過海康雷州歴陵水化州涉恩平恩州住南海廣州迨由龍川恵州抵潮陽潮州洎出守㑹稽越州移蒞句章明州是以上諸郡皆㳂海濵朝夕觀望潮汐之候者有日矣汐音夕潮退也得以求之刻漏究之消息消息進退十年用心頗有準的大率元氣嘘吸天隨氣而漲斂溟渤往來潮順天而進退者也以日者重陽之母隂生於陽故潮附之於日也月者太隂之精水者隂故潮依之於月也是故隨日而應月依隂而附陽盈於朔望消於朏敷尾切魄於上下弦息於輝朒女六切朔而日見東方故潮有大小焉今起月朔夜半子時潮平於地之子位四刻一十六分半月離於日在地之辰次日移三刻七}
