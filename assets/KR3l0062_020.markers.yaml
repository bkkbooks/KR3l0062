  - {type: variant, offset: 0, length: 6610, content: 揮麈第三録卷之三二三汝隂王明清劉廷者開封人向氏甥頗知書少年不檢無家可歸從張懐素左道于真州一日懷素語廷云吾嘗遣范信中往說諸遷客于湖廣間乆之不至聞從京口入都矣豈非用心不善乎子其往京師偵探之廷俶裝西上道中小緩而進比次國門則見懷素與其黨數人皆鎻頸纍纍而過防護甚嚴廷皇怖休于旅邸又數日變易名姓買舟南下有二白衣隷軰與之共載旣相欵洽忽自云我開封府捉事使臣也君識一劉廷秀才否近以通謀爲逆事露官遣我捕之君其爲我物色焉廷略不露其蹤跡次臨淮岸分背自此遁迹江淮間建炎初思陵中興應天廼更名誨上書自奮應募願使虜廷召對稱旨自韋布授京秩直袐閣借侍從以行将命有指擢直顯謨閣守楚州制詞云昨将使指之光華備歴征途之嶮岨命分憂於凋郡併進直於清班己酉歲金㓂渡淮誨走奔錢塘時大駕已幸四明杭守康志升允之委城而遁軍民廼共推誨領郡適虜寨于郊外誨登錢唐門樓遣人下與計事有唱言誨欲以城獻賊者爲衆所殺時有黃大本者江湖浪人也靖康初蔡絛効丁晉公賂海啇遣表之計使大本持書于呉元中云自謂不岀蔡氏可乎心應知之蓋謂其父疇昔有保護東宫之功果爲開封府所獲上之元中坐此免相然元長竟得弗誅大本己酉歳亦以上書𥙷京官假朝奉大夫直袐閣奉使北方旣歸爲池州貴池縣丞坐贓趙元振秉鈞恨其前日與蔡氏爲地使元長得逃於戮遂正刑典又有朱弁字少張徽州人學文頗工早歳漂泊游京洛間晁以道爲學官于朝一見喜之歸以從女弁以啓謝之云事大夫之賢者以其兄子妻之又以李虚中之術較量休咎游公卿間六飛在惟揚有薦之者授修武郎閤門宣賛舎人副王正道倫岀疆𬒳抅在朔庭因正道之歸賫表于上云節上之旄盡落口中之舌徒存歎馬角之未生魂飛雪窖攀龍􅿁而莫逮淚灑氷天上覧之感愴厚䘏其家留匈奴凢十九歳紹興壬戌始與洪光弼張才彦俱南歸易宣教郎直袐閣主管佑神觀以終旅殯于臨安近朱元晦以其族人爲作行狀而尤先生延之作誌銘遷葬于西湖之上有聘遊集三十卷曲洧紀聞一書事多岀於晁氏之言丗頗傳之及與洪張爲輶軒唱二四和集去歳朝廷録其孫爲文學云明清頃有沈必先日記言奏事殿中髙宗云近有人自東京迯歸聞張九成見爲劉䂊用事可怪必先奏云張九成在其郷里臨安府塩官縣寄居去行闕無百里而逺兩日前方有文字來乞將磨勘一官回授父改緋章服幸陛下裁之上云如此則所傳妄矣可笑不若便與一差遣召來盖子韶廷試䇿流播僞齊人悉諷誦故傳疑焉翌日降二五旨除袐書郎吕元直秉鈞旣乆又侍上汎海回越益肆其功自任威福趙元鎮爲中司上䟽力排之元直移元鎮爲翰林學士元鎮引司馬温公故事以不習駢儷之文不肯就職且辭且攻之章至十數上元直竟從二六䇿免以優禮而去元鎮徑除簽書樞宻院事時建炎四年四月也許志仁龍舒之秀士能詩善謔早爲李伯紀之門賔伯紀捐館諸子延緇徒爲佛事群僧請懴悔之詞于許廼取汪彦章昔所行謫詞中數語以授之僧徒髙唱云朋邪罔上罪消㓕欺丗盗名罪消㓕如此者不一二七諸子憤怒詢其所繇知出于志仁詬責而逐之李元度云紹興𥘉梁仲謨汝嘉尹臨安五皷往待漏院從官皆在焉有據胡床而假寐者旁觀笑之又一人云近見一交椅様甚佳頗便於此仲謨請之其說云用木爲荷葉且以一柄挿于靠背之後可以仰首而寢仲謨云當試爲諸公製之又明日入朝則凢在坐客各一張易其舊者矣其上所合施之物悉二八備焉莫不歎伏而謝之今逹䆠者皆用之盖始於此外祖曾空青任知信州日嘗辯宣仁聖烈誣謗以進于髙宗皇帝首尾甚詳今備録之切伏惟念宣仁聖烈皇后遭無根之謗四十餘年陛下踐祚之初首降德音昭示四方明文母保祐之功誅姦臣貪天之慝赫然威斷風動天下薄海内外皷舞懽呼小臣么微嘗冒萬死於建炎元年八月内備録先臣遺記扣閽以陳盖自紹聖以來大臣報復元祐私怨造爲滔天之謗上及宣仁先臣某方位樞筦論議為多臣於家庭之間固巳與聞其略而先臣親書記録尤爲詳盡其後蔡渭繳文及甫等僞造之書附㑹廢立之謗當時用事之臣至以謂神考非宣仁所生以實傾摇廢立之迹欲以激怒哲宗頼哲宗皇帝天姿仁考洞照謬妄而又先臣每事極論痛伐賊謀故於宣仁終不能遂其姦計是時蔡京撰造仁宗欲以庻人之禮改葬章獻意在施之宣仁先臣所陳乃以謂天命何可移易宣仁必無此心乞宣諭三省於詔命之中推明太母德意時哲宗聖諭云宣仁乃婦人之堯舜又蔡京以謂不誅楚邸則天下根本未正先臣所陳乃以謂就令楚邸有謀亦當􅉼容闊略豈唯傷先帝篤愛兄弟之恩亦恐形迹宣仁上累聖德時哲宗又有他必不知之語雖追貶王珪力不能回而於珪責詞中猶用先臣之言増四句云昭考與子之意素已著明太母愛孫之慈初無間隙哲宗至再三稱善元符之末太上皇帝踐祚欽聖獻肅垂簾之初先臣又嘗陳三省言元祐廢立之事欽聖云冤他孃孃豈有此意又云無此事又云當時不聞誰敢說及此事盖欽聖受遺神宗同定大䇿禁中論議無不與聞歎息驚嗟形於聖語誣罔之狀明白可知逮崇寜之後蔡京用事首逐先臣極力傾擠寘之死地一時忠良相繼貶竄方遂其指鹿爲馬之計豈復以投䑕忌噐爲嫌顛倒是非甘心快意至與蔡懋等撰造宫禁語言事跡加誣欽聖欺罔上皇以誑惑衆聽國史所載臣雖不得而見然以紹聖不得伸之姦謀施於崇寧擅權自肆之後其變亂是非巧肆誣詆亦不待言而後知也然彼不知者公論所在判若黒白於陛下聖德亦巳乆矣又况二聖玉音如在先臣記録甚詳乃欲以一二姦人之言欺天罔地成其私意今日之敗必至之理也本末事實盡載先臣三朝正論伏望聖慈萬機之暇特賜省覧付之外廷宣之史官播告中外使天下後丗暁然皆知哲宗仁孝之徳𥘉無疑似欽聖歎息之語深切著明而四十餘年間止縁二三姦臣賊子興訛造訕以報簾幃之怨貪天之力以掩巍巍之功使宣仁聖烈皇后保佑大德返遭誣今者考正是非誅鉏謗讟隂霾蔽蝕之際然後赫然日月之光旁燭四海焜燿萬丗與天地合德於無窮也先臣不昧亦皷舞於九泉之下矣此紹興三年五月也三二九朝正論士大夫家往往有之紹興庚申歲明清侍親居山隂方緫角有學者張堯叟唐老自九江來從先人適聞岳侯父子伏誅堯叟云㒒去歳在羗廬正覩岳侯葬母儀衛甚盛觀者填塞山間如市解后一僧爲㒒言岳葬地雖佳但與王樞宻之先塋坐向旣同龍虎無異掩壙之後子孫須有非命者然經數十年再當昌盛子其識之今廼果然未知它日如何耳王樞宻廼襄敏本江州人葬其母于郷里有十子輔道旣罹横逆而有名字者爲開封幕過橋墮馬死名端者待漏禁門簷瓴氷柱折墜穿頂而没後數十年輔道之子炎弼彦融以勲德之裔朝廷録用以官把麾持節升直内閣炎弼二子萬全萬樞令皆正郎而諸位登進士第者接踵岳非辜之後凢三十年滿洗冤誣諸子若孫驟從縲紲進躐清華昔日之言三十猶在耳也紹興癸亥和議初成有南雄太守黃逹如者考滿還朝獻言請盡誅前此異議之士庻幾以杜後患秦㑹之喜之薦爲監察御史方數日廣東部使者韓球按其贓汙鉅萬奏牘旣上雖秦亦不能揜僅止三一罷絀人亦快之洪景伯兄弟應博學宏詞以克敵弓銘爲題洪惘然不知所岀有廵鋪老卒覩于案間以問洪云官人欲知之否洪笑曰非而所知卒曰不然我本韓丗忠太尉之部曲從軍日目見有人以神臂弓舊様獻于太尉太尉令如其制度製以進御賜名克敵并以歳月吿之洪盡用其語首云紹興戊午五月大将云云主文大以驚喜是歲遂中科目若有神助焉此蓋熈寧中西人李宏中創造因内侍張三二若水獻于𥙿陵者也李平叔云鄭亨仲剛中爲川陜宣撫節制諸將極爲尊嚴呉璘而下每入謁必先堦墀然後升㕔就坐忽璘除少保來謝語主閽吏乞講鈞敵之禮吏以爲白亨仲亨仲云少保官雖髙猶都統制耳倘變常禮是廢軍容少保若欲反則取吾頭可矣堦墀之儀不可易也璘皇恐聽命人皆韙之政和末秦㑹之自金陵往參成均行次當塗境上值大雨水衝橋断不能前進虚中居民開短䆫延一士子教其子弟士子於書室䆫中窺見秦徒歩執蓋立風雨中淋漓悽然甚憐之呼入令小愒至晚雨不止白其主人推食挽留而共榻翌日晴霽送之登途秦大以感激秦旣自叙其詳復詢士之姓名云曹筠庭堅也秦登第即䆠顯絶不相聞乆之曹建炎初以太學生隨大駕南幸至維揚免省䇿名後爲台州知録老不任事太守張偁對移爲黃巖主簿無憀之甚時秦專權乆矣曹一夕偶省悟其前此一飯之恩因謀諸婦婦呉越錢族晩事曹頗解事謂曰審爾何不漫愬之筠因便介姑作詩以致祈懇末句云浩浩秦淮千万頃好將餘浪到灘頭其淺陋不工如此秦一覧慨然興念以刪定官召之㝷改官入臺遂進南床髙宗悪之親批逐岀秦猶以爲集英殿修撰知衢州未幾坤維闕帥即擢次對制閫全蜀到官之後弛廢不治遂致孝忠之變秦竟庇護之奉祠而歸秦没始奪其三四職云方務德帥荆南有寓客張黜者廼魏公之族子岀其廼翁所記建炎刑州遺事一編示務德云孔彦舟領衆十餘萬破荆南城是時朝廷方經理北虜未暇討捕群盗張單騎入城說諭彦舟使之効順朝廷著名青史勿罣丹書爲天下笑彦舟感悟與部下謀咸有納𣢾之意張又語之云太尉須立勞効庻爲朝廷所信四川宣撫乃我之叔父也目今去朝廷甚逺俟見太尉立功當爲引領頭目人入川叅宣撫以求保奏推賞如何彦舟云甚好今有一項虜人往湖南刼掠聞朝夕取道㐮陽以歸北界待與欄截勦殺以圖報國張云此項虜㓂人數不多又是歸師在今日無甚利害鼎州一帶有賊徒鍾相衆號四十萬乃國家腹心之疾太尉儻能平此朝廷必喜將士以此取冨貴何患不濟諸將皆喜云此亦何難彦舟亦首肯張遂促其岀師一戰而勝賊徒犇潰張遂與彦舟具立功人姓名及歸降文字與彦舟心腹數人俱入蜀謁魏公行至䕫州又遇劇賊劉超者擁數萬衆欲往湖南刼掠張又以說彦舟之言告之且言太尉或肯相從我當併往宣撫司言之超亦聽命駐軍于䕫州不爲鹵掠之計以俟朝命張行未及宣撫司數舍遇族兄自魏公處來問何幹且以兩事吿之族兄者從而攫金張荅以此行止爲朝廷寛頋憂及救數路生靈之命豈有閑錢相助其人不恱徑返往見魏公先言以爲張受三賊賂甚厚其謀變詐不可信魏公然之張至宣撫司乞推賞孔彦舟部曲以彦舟爲主帥且令屯駐荆南使之彈壓鍾相餘黨招撫襄漢荆湖之人復耕桑之業魏公悉不從姑令彦舟領部曲往黃州屯駐大失望徒黨皆不樂黄州之行以謂宣司不信其誠心遂率衆渡淮降虜紹興初楊么復嘯聚鍾相餘黨二十萬占洞庭湖襄漢湖湘之民蹂踐過半至今州縣荒殘不能復舊劉超者只駐軍䕫州後遇劉季髙自蜀𬒳召趍朝携降書入奏朝廷大喜季髙之進用繇此而得之以上悉張自叙云尓不欲易之湯致逺鵬舉守婺州與通判梁仲寛厚善仲寛者越人也晚得一婢甚憐寵之一旦辭去遂爲夭章寺長老德範者所有納之于方丈梁邑邑以終湯時帥長沙有過客爲湯言之且悲且憤識之胷中明年湯易帥浙東入境即夭章甫至寺中急呼五百禽主僧决而逐出大以快意然德範者與婢一舸三六東去巳逾月被撻之髠入院蓋未乆也陳師禹汝錫處州人也以才猷宣力于中興之初髙宗自四明還㑹稽領帥浙東當槍攘之後安輯經理美効甚著適秦㑹之自北方還朝素懐眦睚以它罪坐師禹貶單州團練副使漳州安置旣行一程次楓橋鎮客将朱禮者晨起皷帥于衆曰責降官在法不當差破送還人一喏而散師禹不免雇賃使令以之貶所時王昭祖揚英爲帥属在旁知狀雖憤怒之而莫能何也後十八年昭祖以吏部郎出爲叅謀官朱禮者巴爲大吏適湯致逺來爲帥湯素負嫉悪之名開藩未乆昭祖白其事于湯令搜訪其姦贓黥竄象州一郡翕然師禹孫三七師點也呉棫才老舒州人飽經史而能文决科之後浮湛州縣晚始得丞太常紹興間尚須次也娶孟氏仁仲之妹貧往依焉仁仲自建康易帥浙東言者論謝上表中含譏刺詔令分析仁仲辯數以謂乆弃筆研實託人代作孟雖放罪㝷亦引閑秦㑹之令物色知假手于才老臺評遂上罷其新任繇是廢三八斥以終有毛詩叶韻行於丗汪明逺澈任衡州教授以母憂歸從吉後造朝從秦㑹之仍求舊求舊闕詞甚懇到秦問何苦欲此汪云彼中人情旣熟且郡有兩臺可以求知秦愈疑之不與廼以沅州教授處之旣不遂意而地偏且逺汪家素貧稱貸赴官極爲不滿到郡見井邑之荒凉游從之寥落尤以欎陶心竊怒秦而不敢言也適万俟元忠與秦異議自參政安置秭歸後徙沅江汪囙謁之投分甚懽日夕往還三載之間益以膠固万俟還朝繼而大拜首加薦引力爲三九之地入朝七年間遂登政府事不可料有如此者鄭恭老作肅甲戌歲自知吉州回上殿陳劄子云郡中毎歲以黃河竹索錢輸于公上黃河乆䧟僞境錢歸何所乞行蠲免其他循襲似此等者亦乞盡令除放髙宗嘉納且喻秦丞相而稱奬再三焉秦大怒諷部使者誣以爲在任不法興大獄而繩四十治之逮吏及門而秦殂遂免紹興巳夘陳瑩中追謚忠肅其子應之正同適爲刑部侍郎往謝政府有以大魁爲元樞者忽問云先丈何事得罪秦師垣邪應之曰先人建中初爲諌官力言二蔡於未用事時其後以此遷謫流落無有寧日其人若醒悟狀曰此所以南度後便爲參四一政也盖後誤以爲陳去非然不知初又以爲何人也李泰發之遷責海外也欲寓書秦丞相以祈内徙而無人可遣門人王彦恭趯罷雷守閑居全州泰發乃作秦書託王爲㝷端便王鄰之居有李将領者坐岳侯事編置于郡與閭里通情趯令其子司法者從李将就雇一隷遣往會稽授書于泰發家旣至越泰發子弟不敢以人入都乃就令此介自往相府投之旣逹于秦忽令問李參政今在何所逺人倉猝遽對云李參政見在全州與王知府鄰居蓋誤以李將爲泰發也且云有王法司與李參政親以書付我令來盖錯愕之際又稱司法爲法司也秦怒於是送大理寺根勘行下全州體究李光擅離貶所如何輒敢存留在本州且追王趯并王法司赴獄而全州適有法司人吏姓王者亦與彦恭舍甚迩俱就逮後體究得泰發𥘉未嘗離昌化但誣彦恭以前任過愆除名勒停編管辰州王法司者懵然不知亦勒認贓罪杖脊當時聞者無不四二笑而憐之汪明逺爲荆襄宣諭使逆亮遣劉蕚領兵號二十萬侵犯襄漢間荆蕚諸軍屢捷俘虜人多僉軍語我師云我軰皆𬒳虜中僉來離家日父凡告戒云汝見南朝軍馬切勿向前迎敵但只投降他日定放汝歸父兄再有相見之期儻不從誨戒必遭南軍殺戮有聞此語以告明逺者遂與幕僚謀之建議盡根刷俘虜之人借𥙷以官縱遣北歸歡躍而去乾道改元虜人再來侵犯荆鄂亦出師入北界四三縱遣之人有來爲郷道者諸將皆全璧而歸逆亮篡位之後偶因本朝遣使至其闕廷有畏讋者遂有輕我之心即謀大舉僉刷以北人爲兵欲以百萬南攻止得六十七萬以二十七萬侵淮東敵劉信叔亮以四十萬自隨由淮西來與王權相遇而王權之衆不能當在和州對壘權盡遣渡船過南岸與其衆誓云國家飬汝軰許時政要今日以死上報衆皆唯唯兩軍堅壁不動權以二三腹心自隨手執諸軍旗號戒諭諸將云不可妄動且看虜軍有陣脚不固不肅者看吾舉逐軍旗号先舉動虜軍數重之内有紫傘往來傳呼者莫知其意虜軍先來犯陣遇大雨遂退復駐軍于舊寨無一不肅諸將遂語權云虜軍如此我軍如何可戰權云諸公不可說此語今日正當報國之時冝盡死于此不可有一人異議諸將云太尉欲與諸軍死此却将甚軍馬與國家保守江靣權悟其言遂言當從諸人議往南岸叫船渡軍馬還與國家保江却自往朝廷請罪又與諸将計筭軍馬渡江有殿後者必爲虜騎所追合損折一軍半人馬又要一将殿後統制官時俊云願爲殿後保全軍馬過江衆服其勇王琪是時爲護聖馬軍統制亦同行云所部軍馬乃主上親隨太尉不可失却他一人一騎遂令護聖馬軍先渡諸軍次第而濟虜騎果下馬來追襲時俊牌手當之幸所失不致如筭之數諸軍遂就采石各上戰艦以備虜人權爲樞宻行府押詣朝廷竄于海外逆亮築臺江岸刑白馬祭天自執紅旗麾諸軍渡江行至中流爲采石戰艦迎敵時俊在舟中令軍士以寸札弩射虜人赴水者多盡皆退走亮知江岸有備遂全軍過楊州軍士奏凱未及登岸虞丞相允文以參賛軍事偶至采石遂與王琪報捷于朝虞自中書舎人除兵部尚書自此遂柬眷知琪除正任觀察使諸将在江中獲捷者亦皆次第而遷水軍統制盛新功多而獲賞㝡輕壹鬱而死建康采石軍士至今憐之次年春初明清從外舅起帥合肥道出采石親見将士言之直書其語不復潤色以文云隆興初有胡昉者大言夸誕當國者以爲天下竒才力加薦引命之以官曾未數年爲两浙漕一日語坐客云朝廷官爵是買吾曹之頭顱豈不可畏四五適聞人伯卿阜民在坐末趍前云也買脫空胡黙然前録載湯進之封慶國公也明清甞陳之章聖之初封湯始疑以爲未然於史館檢閱然後封章其所上劄子廼云自天聖以來未有敢以爲封者然又不知宣和中王黼白蒙亨皆甞受而失於辭避是四六不曾詳於稽考也明清晚識遂初尤延之先生一見傾蓋若平生懽借舉引重恩誼非輕公任文昌一日忽問云天臨殿在於何時邪明清云自昔以來蓋未有之紹聖初米元章爲令畿邑之雍丘遊治下古寺寺僧指方丈云頃章聖幸亳社千乗萬騎經從嘗愒宿于中元章即命彩飾建䲭嚴其羽衞自書榜之曰天臨殿時吕升卿為提點開封府縣鎮公事以謂下邑不白朝廷擅創殿立名將按治之蔡元長作内相營捄獲免聞有自製殿賛恨未見之尤即從䄂間出文書迺元章所書賛也云才方得之公可謂博物洽聞矣翌日入省形言稱道于稠人廣衆中焉楼大防作夕郎出示其近得周文榘所畫重屏圖祐陵親題白樂天詩于上有衣中央帽而坐者指以相問云此何人邪明清云頃歳大父牧九江於廬山圎通寺撫江南李中主像藏于家今此繪容即其人文榘丹青之妙在當日列神品蓋畫一時之㬌也亟走介往㑹稽取舊収李像以呈似靣皃冠服無豪髮之少異因爲跋其後楼深以賞激継而明清丐外得請以詩送行後一篇云遂初陳迹遽凄凉擊節青箱極薦揚談笑於儂情易厚典刑使我意差強重屏唐畫論中主古殿遺文話阿章舊事從今向誰問尺書時許到淮郷明清前年厠迹蹕路假居于臨安之七寳山俯仰顧眄聚山林江湖之勝于几案間襟懷洒然記憶舊聞纂揮麈後録旣幸成編去歳請外從欲贅丞海角涉筆之暇無所用心省之胷次隨手濡毫又獲数十事不覺盈帙漫名曰揮麈第三録凢所聞見若來歷尚晦本末未詳姑且置之以待乞靈于博洽之君子然後敢書斯亦習氣未能掃除猶雞肋之餘味耳慶元初元仲春丁巳明清重書于呉陵官舎佳客亭揮麈第三録卷之三, WYG: ''}
