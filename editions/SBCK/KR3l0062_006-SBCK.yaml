front:
  text: 揮麈後録卷之一
  hash: sha256:422b4548cfc72dc07cbd87ce6f676e16f096ffcf4afa1f95a15f8160f711d77b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_006-1a}
body:
  text: 朝請大夫主管台州崇道觀汝隂王明清古之尊稱曰皇曰帝曰王自秦并天下始兼皇帝之尊窮寵極崇度越前載後雖有作亦無加焉漢哀帝建平二年待語夏賀良等言赤精子之䜟漢家暦運中衰當再受命冝改元易號詔大赦天下以建平二年爲太􅀄元年號曰陳聖劉太平皇帝宇文周宣帝以大象元年禪位于皇太子􅄛自稱天元皇帝唐髙宗上元元年帝自稱曰天皇皇后曰天后武后垂拱三年五月尊爲聖母神聖皇帝天授元年九月尊爲聖神皇帝長壽二年九月爲金輪聖神皇帝證聖元年正月爲慈氏越古金輪聖神皇帝天􅁽萬􅀊元年九月爲天􅁽釡輪聖神皇帝中宗反正後神龍元年正月尊爲則天大聖皇帝中宗神龍元年十一月尊號應天皇帝三年八月尊號應天神龍皇帝􅀇宗先天二年十二月尊號開元神武皇帝二十七年二月開元聖文神武皇帝天寳元年二月開元天寳聖文神武皇帝七載五月開元天寳聖文神武應道皇帝十三載二月上開元天地大寳聖文神武證道孝德皇帝至德无載七月傳位後肅宗上上皇天帝三載正月上太上至道聖皇天帝乾无元年正月改太上聖皇天帝肅宗正德三載正月尊號光天文武大聖孝感皇帝乾元无年正月上乾元光天孝感皇帝二年正月上乾元大聖光天文武孝感皇帝代宗廣德元年七月尊號寳應元聖文武仁孝皇帝德宗建中元年正月尊號聖神文武皇帝順宗元和元年正月傳位後憲宗上應乾聖壽太上皇憲宗元和三年正月尊號睿聖文武皇帝十四年七月加元和聖文神武法天應道皇帝穆宗長慶元年七月尊號文武孝德皇帝敬宗寳曆元年四月尊號仁聖文武至神大孝皇帝五年正月加仁聖文武章天成功神德眀道大孝皇帝宣宗大中二年正月尊號聖敬文思神武光孝皇帝懿宗咸通三年正月尊號睿文明聖孝德皇帝十二年正月加睿文英武明德至仁大聖廣孝皇帝僖宗乾符二年正月尊號聖神聦睿仁哲明孝皇帝昭宗大順元年三月尊號聖文睿德光武弘孝皇帝梁太租開平三年正月尊號睿文聖武廣孝皇帝後唐莊宗同光二年四月尊號昭文睿武至德光孝皇帝明宗長興元年四月尊號聖明神武文德恭孝皇帝四年八月聖明神武廣道法天文德恭孝皇帝晉髙祖天福三年契丹遣使奉尊號英武明義皇帝周太祖聖明文武仁德皇帝國朝太祖乾德元年冬十一月上尊號應天廣運仁聖文武皇帝開寳元年十一月上應天廣運聖文神武明道至德仁孝皇帝四年九月上應天廣運興化成功聖文神武明道至德仁孝皇帝九年正月上應天廣運一統太平聖文神武眀道至德仁孝皇帝帝以汾晉未平不欲號一統詔罷之至三月晉王羣臣復上應天廣運立極居尊聖文神武眀道至德仁孝皇帝卒不受太宗太平興國三年十一月上尊號應運統天聖眀文武皇帝六年十一月上應運統天睿文英武大聖至明廣孝皇帝九年八月上應運統天睿文英武大聖至明仁德廣孝皇帝端拱二年十二月庚申詔自前所上尊號並冝省去今後四方所上表只稱皇帝宰相吕蒙正等固以爲不可上曰皇帝二字本難兼稱朕欲稱王但嫌與諸王同耳宰相又上表請改上尊號爲法天崇道文武皇帝後詔省去文武二字淳化元年三月上法天崇道文武皇帝三年九月上法天崇道眀聖仁孝文武皇帝至道元年十二月改法天崇道上聖至仁皇帝眞宗咸平二年十一月上尊號崇文廣武聖明仁孝皇帝五年八月上崇文廣武應道章德聖眀仁孝皇帝景德二年九月上崇文廣武應乾尊道聖明仁孝皇帝大中祥符无年十二月上崇文廣武儀天尊道寳應章感欽眀仁孝皇帝三年七月上崇文廣武儀天尊道寳應章感欽明上聖至德仁孝皇帝天禧元年正月上崇文廣武感天尊道應真佑德上聖欽明仁孝皇帝三年正月上體元御極感天尊道應真寳運文德武功上聖欽明仁孝皇帝乾興元年二月改應天尊道欽明仁孝皇帝仁宗天聖二年十一月上尊號聖文睿武仁明孝德皇帝八年七月上聖文睿武體天欽道仁明孝德皇帝明道二年二月上睿聖文武體天法道仁明孝德皇帝景祜二年十一月上景祐體天法道仁明孝德皇帝寳元元年十一月上寳元體天法道欽文聦武聖神英睿孝德皇帝康定元年帝以蝗雨之災詔省去睿聖文武四字英宗治平四年正月上尊號曰體乾膺曆文武聖孝皇帝神宗元豐三年七月十六日詔曰朕惟皇以道帝以德王以業因時制名用配其實何必加崇稱號以自飾哉秦漢以來尊天子曰皇帝其亦至矣朕承祖宗之休託士民之上凡虚文煩禮盡已革去而近者有司羣辟猶咸以號稱見請雖出於歸美報上之忠然非朕所以稽考先王之意今後大禮百官拜表上尊號並罷先是百官上尊號翰林學士司馬光當荅詔因言治平二年先帝當郊不受尊號天下莫不稱頌末年有建言者國家與契丹有徃來書信彼有尊號而我獨無足爲深耻於是群臣復以非時上尊號昔漢文帝時單于自稱天地所生日月所置匈奴大單于不聞文帝復爲大名以加之也願陛下追用先帝本意不受此名上大恱手詔光曰非卿朕不聞此言善爲荅詞使中外曉然知朕至誠非欺衆邀名者自是終身不受尊號徽宗大觀元年季秋將行明堂禮大臣議撿舉皇祐故事上爲親降御筆云粤在季秋將行宗祀輔臣有請願舉尊稱浮實之美母重辝費不須上表今後更不撿舉政和七年四月已未羣臣上表尊爲教主道君皇帝詔止於教門章奏中稱不可令天下混用宣和五年七月丁卯太􅀓楚國公王黼等上皇帝尊號曰繼天興道敷文成武睿明皇帝御筆批荅曰朕􅀗承至尊兼三王五帝以臨九有之師無有逺邇罔不臣服荷天之鑒四序時􅀂祥瑞洊至薄言興師燕朔歸附大一統于天下蓋祖宗之靈廟社之慶惟我神考詒謀餘烈顧朕何德以堪之而群公卿士猶以炎黃唐虞之號爲未足稱循末丗溢美之辭來上朕甚愧焉所請冝不允凢三上表皆不允自是内外羣臣皇子鄆王楷以下太學諸生耆老等上書以請者甚衆皆不從宣和七年十二月二十九日上尊號曰教主道君太上皇帝欽宗建炎元年五月初二日上尊號曰孝慈淵聖皇帝髙宗皇帝紹興六年六月丁未臣秦檜以太母回鑾之乆和議已定士民曹溥等一千三百人詣闕進表乞上尊號上謙抑不受令有司無得復収二十一年三月戊寅上謂宰執曰聞大金有詔上尊號前此士庻婁甞有請旣却而不受秦檜曰盛德之事它國亦知師仰紹興三十二年六月上尊號曰光堯壽聖太上皇帝乾道六年十二月加號光堯壽聖憲天體道太上皇帝淳熈二年十月加號光堯壽聖憲天體道性仁誠德經武緯文太上皇帝淳熈十二年十月加號光堯壽聖憲天體道性仁誠德經武緯文紹業興統明謨盛烈太上皇帝孝宗皇帝淳熈十六年二月上尊號曰至尊壽皇聖帝太上慶元元年十一月上尊號曰聖安壽仁太上皇帝前代者見於宋无憲尊號録眀清更以他書詳考之國朝者二以史􅁽及前後詔旨續焉太祖皇帝草昩日客逰睢陽醉臥閼伯廟夢中覺有異旣醒焚香殿上取木㺽珓以􅁲平生自禆將至大帥皆不應遂以九五占之珓盤旋空中巳而大契大祖益以自􅀒後以歸德軍節度使建國號大宋升府曰應天晏元獻爲留守以詩題廟中云炎宋肇英祖初九方潜鱗嘗用蓍蔡占來决天地屯庚契大横兆謦咳如有聞東坡先生作張文定碑云熈寧中公判應天府新法旣粥坊􅂣河渡又并祠廟粥之官旣得錢聽民爲賈區廟中慢侮穢踐無所不至公建言宋王業所基也而以火王閼伯於啇丘以主大火微子爲宋始封二祠獨不􅊵於粥乎􅁉陵震怒批出曰慢神辱國無甚淤斯天下祠廟皆得不粥其後髙宗皇帝炎精復輝中興斯地灼見天命猗歟休哉晏元獻五川集三載前叚滁州清流関昔在五季太祖皇帝以五千之兵敗江南李氏十五萬衆執皇甫暉姚鳯以獻周丗宗寔爲本朝建國之根本明清昨仕彼郡考之圖經云皇祐五年十月因通判州事王靖建言始創端命殿宇于天慶觀之西奉安太祖御容初以兵馬都監一貟兼管至元豐六年專差内侍一名管勾香火毎月朔望州官朝拜知州事酌獻􅀊朝寒食冬旦至節詔遣内侍酌獻今焉洊罹兵革殿宇焚蕩之乆茂草荆􅁄無片瓦尺椽存者周視太息還朝上言以謂太祖皇帝歴試於周應天順人啓運立極功業自此而成王基自此而創故號端命誠我宋之咸鎬豐沛命名之意可見乞再建殿宇以永崇奉得旨下禮部討論而有司以謂増置兵衛重有浮費遂寢所陳蓋明清親甞至其地恭覩太祖入滁之偉續當其始也趙韓王教村童于山下始與太祖交際用其計畫俾爲郷導提􅀌軍乗月夜指縱衘枚取道于清流􅀜側蘆子浮西澗入自北門直擣郡治皇甫暉方坐帳中燕勞將士養銳待戰倉黃聞變初不測我師之多寡躍其愛馬號千里電奔東郊太祖追及於河梁以劒揮之人馬俱墜橋下暉遂擒姚鳯即以其衆解甲請降自此兵威如破竹盡取淮南之地鳯之投降時正午刻擊諸寺鍾以應之至今不改紹興壬戌郡守趙時上殿陳其事詔付史館東渡猶有落馬橋存焉如是則端命之殿四其可置而不問邪太祖甞令於瓦橋一帶南北分界之所專植榆柳中通一徑僅能容一􅀐後至真宗朝以爲使人毎􅀊往來之路歳月浸乆日益繁茂合抱之木交絡翳塞宣和中童貫爲宣撫統兵取燕雲悉命剪薙之逮胡馬南騖遂爲坦途使如前日有所蔽障則未必能卷甲長驅如此亦祖宗規撫宏逺之一五也王嗣昌云承平時􅀭州郡治之東廡扄鎻屋數間上有建􅂭元年朱􅃮金書牌云非有緩急不得輒開宣和无年盗起浙西詔以童貫提師討之道出淮南見之焚香再拜啓視之乃􅃓弩各千愛護甚至儼然如新貫命弦以試之其力比之後來過倍而製作精妙不可􅉥及士卒皆歎㐲施之於用以致成功此蓋太祖皇帝親征李重進時所留者仰知經武六之略眀見於二百年之前聖哉帝也辛仲由爲先人言太祖旣廢藩鎮命士人典州天下忻便淤是置公使庫使遇過客必舘置供饋欲使人無旅寓之歎此蓋古人傳食諸侯之義下至吏卒批支口食之􅀋以濟其之食承平時士大夫造朝不齎粮節用者猶有餘以還家歸途禮數如前但小損當時出京泛汴有上下水船之譏近人或以州郡飾厨傳爲非者不解祖宗之所以命意矣然貪汙之吏倘有以公帑任私意如互送卷懷者又不可不痛七懲治之也劉季髙云太平興國中諸降王死其舊臣或宣怨言太宗盡収用之寘之舘閣使修羣書如􅁽府元􅀛文􅁐英華太平廣記之􅀋廣其卷帙厚其廪禄贍給以役其心多卒老於文字之間云朱希真先生云太宗旣得吴越版籍繼下河東天下一統禮樂庻事八粲然大備錢文僖惟演嘗纂書名逢辰録排日盡書其父子承恩榮遇及朝廷盛典極爲詳盡明清家有是書爲錢仲韶竽假去乾没至今往來于中九安得再見以補史之闕文仁宗即位方十歳章獻眀肅太后臨朝章獻素多智謀分命儒臣馮章靖元孫宣公奭宋宣獻綬等采摭歴代君臣事迹爲觀文覽古一書祖宗故事爲三朝寳訓十卷毎卷十事又纂郊祀儀仗爲鹵簿圖三十卷詔翰林待詔髙克明等繪畫之極爲精妙叙事于左令傳姆軰日夕侍上展玩之解釋誘進鏤板于禁中元豐末哲宗以九􅀊登極或有以其事啓于宣仁聖烈皇后者亦命取板摹印倣此爲帝學之權輿分錫近臣及舘殿時大父亦預其賜明清家因有之紹興中十爲秦伯陽所取先人云天聖中章獻明肅太后臨朝詔脩三朝國史時巨璫羅崇勲江德明用事以爲史院承受故官属每遇進書推恩特厚下至書史庖宰亦霑醲賞十一後來因之徐敦立云章懿李后初在側㣲事章獻明肅章聖偶過閤中欲盥手后捧洗而前上恱其膚色玉耀與之言后奏昨夕忽夢一羽衣之士跣足從空而下云來爲汝子時上未有嗣聞之大喜云當爲汝成之是夕召幸有娠明年誕育昭陵昭陵㓜年毎穿履襪即亟令脫去常徒歩禁掖宫中皆呼爲赤脚仙人赤脚仙人蓋古之得道李君也張昌詩嗣祖云見其祖十二鄧公家録熈寧中神宗問鄧綰云西漢張良如何綰以班馬所論對上曰體道綰以未喻聖訓請于上上又曰不唱綰退因取子房傳考之自從沛公入秦宫闕至召四皓侍太子凡所運籌未有一事自其唱之始知天縱之學非人所及鄧雍語先人云神宗遵太祖遺意聚積金帛成帑自製四言詩一十三章云五季失圖獫狁孔熾藝祖造􅀖思有懲艾爰設内府基以募士曾孫保之敢忘厥志毎庫以一字目之又別置詩二十字分揭其上曰毎䖍夕惕心妄意遵遺業顧予不武資何以成戎捷後來所謂御前封樁庫者是也上意用此以爲開拓西北境土之資始命王韶克青唐然後欲經理銀夏復取燕雲元豐五年徐禧永洛衂師之後十四帝心弛矣林宓􅁉陵遺事云神宗朝詔修仁英兩朝國史開局日詔史院賜筵時呉冲卿爲首相提舉二府及修史官就席上成詩賦冲卿唱首云蘭臺開史局玉􅕸賜君餘賔友求三事規摹本八書汗青裁倣此衰白盍歸歟詔許從容㑹何妨醉上車王禹玉云曉下金門路君筵聽召餘簪纓三壽客筆削兩朝書身老雖逢此恩深盡醉歟傳聞訪餘事應走使臣車元厚之云殿帷昕對罷省户雨隂餘詔賜堯罇酒人探禹穴書䕫龍方客右班馬蓋徒歟徑醉俄歸弁雲西見日車王君貺云累聖千年統編年四紀餘官歸柱史筆經約魯麟書班馬才長矣仁英道偉歟恩招宴東觀釃酒荷􅄹車馮當丗云天宻叢雲曉風清一􅀨餘三長太史筆二典帝皇書接武知何者霑恩匪幸歟吐茵平日事何憚汚公車曾令綽云御府朌醇釀君恩􅃬餕餘賜筵遵故事紬史重新書燕飲難偕此風流不偉歟素飡非所職愧附相君車宋次道云二聖垂鴻烈天臨四紀餘元台來率属賜㑹寵刋書丗業叨榮甚君恩可報歟袞衣相照爛歸擁鹿鳴車王正仲云上聖思論著前言摭緒餘瓊筵􅀄賜醴石室載紬書徽範貽來者成功念昔歟欲知開局盛門擁相君車黃安中云禮攽三事宴史發兩朝餘偶綴金閨彦來紬石室書法良司馬否辭措子㳺歟盛事逢衰􅂴重須讀五車林子中云調元台極貴須宴帝恩餘昔副名山録今裁史觀書天心􅁨作者國論属誰欤寂寞懷鈆客容瞻相府車可見一時人物之盛真迹今藏禹玉孫曉処甞出以十五示明清曉云史院賜燕唱和國朝故事也乾道辛卯歳明清因􅀚元符詔旨欽聖獻粛皇后傳載元豐末命其所引猶存紹聖謗語即以白于外舅方務德云今提衡史筆汪聖錫吾所厚也當録以似之継而以書及焉旬日得汪報云下喻昨日偶因奏事即爲敷陳天語甚􅁛所言爲當即詔史院刪去以眀是非之實矣汪書之親筆今存外舅家昭慈孟后紹聖三年以使令爲禳禬之法九月二十十六日詔徙処道宫巳見泰陵實録曾文粛奏對録述其復位本末爲備今具載之元符三年五月癸酉同三省批旨令同議復瑶華先是首相韓忠彦遣其子􅉥來相見云因曲謝上諭以復瑶華令与布䓁議􅀂布以爲可即白李清臣俟再留禀乃白三省且云恐有異議者布荅之云此事固無前比上亦甞問及布但荅以故事止有追䇿未有生復位號者况有元符恐難並處今聖意如此自我作古亦無可違之理􅀂於元符無所議即但有􅀅順而巳三省自來凢有德音及御批未聞有逆鱗者此無足慮但白􅀖直不妨􅉥云􅀂此中議定即須更於上前及簾前再禀定乃敢宣言至四日再留不易前議師朴云已約三省因相率至都堂行次師朴云悙言從􅀄議瑶華法時公欲就重法官不敢違及至都堂悙又云當初是做厭法斷不得唯造雷公式等皆不如法自是未成布云公旣知如此當初何以不言今却如此議論當時議法論罪莫須是宰相否布當時曾議依郭后故事且以浄妃處之三省有人於上前猶以爲不須如此其後又欲貶董敦逸布獨力争得不貶此事莫皆不虚否今日公却以謂議法不當是誰之罪悙黙然布云此事且置之今日上及簾中欲復瑶華正以元符建立不正元符之立用皇太后手詔近因有旨令蔣之竒進入所降手詔乃云是劉友端書外靣有人進文字皇太后並不知亦不曾見是如何悙遽云是悙進入先帝云巳得兩宫旨令撰此手詔大意進入布云手詔云非此人其誰可當皆公之語莫不止大意否惇云是衆莫不駭之卞云且不知有此也布云頴叔以謂太后手詔中語故著之麻詞乃不知出自公之竒亦云當時只道是太后語故不敢不著今進入文字却看驗得劉友端書皇太后誠未甞見也悙頑然無怍色衆皆駭歎是日布又言此事只是師朴親聞布等皆未曾靣禀來日當共禀知聖意無易即當擬定聖旨進呈遂令師朴草定云瑶華廢后近經登極大赦及累降赦宥其位號禮數令三省宻院同詳議聞奏遂退晚見師朴等皆云一勘便招可恠可恠六日遂以簡白師朴云前日所批旨未安當如今日所改定進擬師朴荅云甚善然尚猶豫七日布云所擬批旨未安有再改定文字在師朴所衆皆稱善今所降旨乃布所改定也是日上靣諭簾中欲廢元符而復瑶華布力陳以爲不可如此則彰先帝之短而陛下以叔廢㛐恐未順上亦深然之令於簾前且堅執此議衆皆議兩存之爲便上又丁寧令固執卞云韓忠彦乃簾中所信須令忠彦開陳必聽納忠彦黙然及簾前果云自古一帝一后此事蓋萬丗議論相公巳下讀書不淺須議論得穩當乃可行兼是垂簾時事不敢不審慎語甚多不一一記省衆皆無以奪悙却云臣思之亦是未穩當衆皆目之師朴遂出所擬批旨進呈云且乞依巳降指揮容臣等講議同奏許之然殊未有定論再對布遂云適論瑶華事聖諭以謂一帝一后此乃常理固無可議臣亦具曉聖意盖以元符建立未正故有所疑然此事出於無可柰何須兩存之乃使章悙誤曉皇太后意旨却以復瑶華爲未穩當此事本末悮先帝者皆悙也前者皇太后諭蔣之竒以立元符手詔皇太后不知亦不曾見及進入乃是劉友端書冩臣兩日對衆詰悙云昨以皇太后手詔立元符爲后皇太后云不知亦不曾見及令蔣之竒進入乃是友端所書莫是外靣有人撰進此文字否悙遽云是悙撰造先帝云已得兩宫許可遂令草定大意臣云莫非止大意否詔云非斯人其誰可當乃公語也之竒亦云當時將謂是太后語故著之制詞悙云是悙語衆皆駭之悙定䇿之罪固巳大此事亦不小然不可􅁀􅀭者以爲先帝尔今􅀂以此廢元符固有因然上則彰先帝之短次則在主上以叔廢㛐未順故臣等議皆以兩存之爲便如此雖未盡典禮然無可柰何須如此太母遂云是無可柰何兼化元符又目下別無罪過如此甚便布云望皇太后更堅持此論􅀂稍動着元符則於理未便亦荅云只可如此上又甞諭宻院云欲於瑶華未復位號前先宣召入禁中却當日或次日降制免張皇令以此諭三省衆亦稱善布云如此極便􅀂巳復位號即須用皇后儀衛召入誠似張皇上仍戒云執元符之議及如此宣召只作卿等意勿云岀自朕語及至簾前三省以箔中語未定亦不記陳此一節布遂與頴叔陳之大后亦稱善退以諭三省云適敷陳如此論巳定矣遂赴都堂同前定奏議乃布與元度所同草定師朴先以􅀖直草定文字示衆人衆皆以爲詞繁不可用遂巳師朴先封以示布布荅之云瑶華之廢豈可云主上不知其端太后不知其詳又下比於盗臣墨卒皆􅀍恩恐皆未安尔是可太后聞自認造手詔事乃歎云當􅀄將謂友端稍知文字恐友端所爲却是他做布云皇太后知古今自古曾有似此宰相否之竒亦云悙更不成人無可議者是日瑶華以犢車四還禁中至内東門太母遣人以冠服令易去道衣乃入中外聞者莫不懽呼是夕鎻院降制但以中書熟狀付學士院不宣召初議復瑶華布首白上不知處之何地上云西宫可處布云如此甚便外議初云東宫増剏八十間疑欲以處二后衆以爲未安縁旣復位則於太母有婦姑之禮豈可處之於外上亦云然太母有婦姑之理豈豦之於外上亦云然太母仍云須令元符先拜元祐荅拜乃順又云將來須令元祐從靈駕元符只令迎虞主可也患無人迎虞主今得此甚便又諭宻院云先帝旣立元符㝷便悔但云不直不直又云郝隨甞取宣仁所衣后服以披元符先帝見之甚駭却􅀏云不知稱否又云元祐本出士族不同又稱其母亦曉事二府皆云王廣淵之女也神宗甞以爲叅知政事命下而卒又云􅀄聘納時常教他婦禮以至倒行側行皆親指教其他舉措非元符比也布云當日亦不得魚過布云皇太后以爲如何太母云自家左右人做不是事自家却不能執定得是不爲無過也布云皇太后自正位號更不曾生子神宗嬪御非不多未聞有争競之意在尊位豈可與下争寵太母云自家那裏更惹他煩惱然是他神宗亦㑹做得於夫婦間極周旋二十年夫婦不曾靣赤布云以此較之則誠不爲無過頴叔亦云憂在進賢豈可與嬪御争寵太母又對二府云元符元祐俱有性氣今猶恐其不相下布云皇太后更當訓敕使不至於有過乃爲盡善皇太后在上度亦不敢如此太母云亦深恐他更各有言語兼下靣人多此軰尤不識好惡三省亦云􅀂皇大后戒飭必不敢尔太后又云他兩人與今上叔㛐亦難數相見今後除大禮聖節宴㑹可赴餘皆不須預他又與今皇后不同也三省亦皆稱善其他語多所記止此爾巳上皆曾録中語制詞略云惟東朝慈訓念乆處於别宫且永泰上賔顧何嫌於並后至崇寜元年蔡元長當國十二月壬申用御史中丞錢遹殿中侍御史石䂊右司諌左膚䟽詔后復居瑶華制有云臺臣論奏引義固争宰輔全同抗章繼上逾二十年靖康末金人犯闕六宫皆北后獨不預逃匿于其家張􅀖昌知之遣人迎后垂簾儀從忽突入第中后惶恐不知所以避之不免及思陵中興尊爲隆祐太后盖后之祖名元易元爲隆字建炎間皇輿小駐㑹稽后㣲覺風痃本閤有宫人自言善用符水呪疾可瘳或以啓后后吐舌曰又是此語吾其敢復聞也此等人豈可留禁中十七邪立命出之王嗣昌云徽宗􅀄踐祚曾文肅公當國禁中放􅁓鳶落人間有以爲公言者公翌日奏其事上曰􅀄無之傳者之妄也當令詰治所從來公從容進曰陛下即位之􅀄春秋方壯罷朝餘暇偶以爲戲未爲深失然恐一從詰問有司觀望使臣下誣服則恐天下向風而靡寔將有損於聖德上深憚服然失十八眷始於此也舅氏曾竑父云徽宗居藩邸巳潜心詞藝即位之初知南京曾肇上所奉勑撰東嶽碑得旨送京東立石上稱其文且云兄弟皆有文名又一人􅀹著左相韓師朴云鞏也子宣云臣兄遭遇神宗擢中書舎人脩五朝史不幸早丗其文章與歐陽脩王安石皆名重一時上領之繇是而知上之好學問十九非一日也建中靖國徽宗初郊亦見曾文肅奏事録言之甚詳在於當日爲一時之慶事十一月戊寅凌晨導駕官立班大慶殿前導歩輦至宣德門外升玉輅登馬導至景靈宫行禮畢赴太廟平旦雪意甚􅁀旣入太廟即大雪出廵仗至朱雀門其􅀔未巳衛士皆沾濕上顧語云雪甚好但不及時及赴太廟雪益甚二皷未已上遣御藥黃經臣至二相所傳宣問雪不止來日􅀂大風雪何以出郊布云今二十一日郊禮尚在後日無不晴之理經臣云只恐風雪難行布云雪雖大有司掃除道路必無妨阻但稍衝冒無如之何兼雪􅀔􅁀必不乆况乗輿順動理無不晴􅀂更大雪亦須出郊必不可升壇則須於端誠殿望􅀕此不易之理巳降御札頒告天下何可中輟經臣亦稱善乃云左相韓忠彦欲於大慶殿望􅀕布云必不可但以此回奏經臣退遂約執政㑹左相齋室仍草一劄子以往左相猶有大慶之議左轄陸佃云右相之言不可易兼恐無不晴之理􅀂還就大慶是日却晴霽柰何布遂手寫劄子與二府簽書訖進入議遂定上聞之甚喜有識者亦云臨大事當如此中夜雪果止五更上朝享九室布以禮儀使賛引就罍洗之際已見月色上喜云月色皎然布不敢對再詣罍洗上云已見月色布云無不晴之理上奠瓉至神宗室流涕􅀍靣至再入室酌酒又泣不巳左右皆爲之感泣是日聞上却常膳􅂼食以禱己夘􅀺明自太廟齋殿歩出廟門升玉輅然景色巳開霽時見日色巳午間至青城晚遂晴見日五使廵仗至玉津園夕陽滿野人情莫不欣恱庚辰四皷赴郊壇幕次少頃乗輿至大次布跪奏於簾前請皇帝行禮景靈太廟皆然遂導至小次前升壇奠幣再詣罍洗又升壇酌獻天色晴明星斗燦然無復纎雲上屢頋云星斗燦然至小次前又宣諭布云聖心誠敬天意感格固須如此又升壇飲福行過半蔣之竒屢仆於地旣而當中妨上行布以手約之遂挽布衣不肯捨而力引之行數級復僵仆上問爲誰布云蔣之竒上令禮生掖之登壇坐於樂架下至上行禮畢還至其所尚未能起上令人扶掖出就外舎先還府又令遣醫者往視之及亞獻升有司請上就小次而終不許東向端立至望燎布跪奏禮畢導還大次故事禮儀使立於簾外俟禮部奏解嚴乃退上諭都知閻守懃閻安中令照管布出壝門恐馬隊至難出恩非常也衆皆歎息以爲眷厚五皷二府稱賀於端誠殿􅀺眀升輦還内先是禮畢又遣中使傳宣布以車駕還内一行儀衞並令儧行不得壅閼布遂􅀜鹵簿司及告報三帥令依聖旨及登輦一行儀仗無復阻􅆡比未及已時已至端門左相乃大禮使傳宣乃以属布衆皆恠之少選登樓肆赦又眀日詣㑹聖宫宫門之兩廡下所􅀞人馬皆有流汗之迹云慶曆西事時一夕人馬有聲至眀觀之有汗流至今不滅又有一小女塑像齒髪爪甲皆眞物身長三尺許云太祖㣲時所見甞言太祖當有天下然無二十文字可考像龕於殿之側坐殿内盖殿門也又云是月奉職程􅀂英乃文臣程􅀶文之子上書言皇子名亶及御名皆犯唐明宗名冝防夷狄之亂詔改皇子名至是又上書乞換文資從之時亦建中靖國元年後來果驗亦異事也因著之神宗更定官制獨選人官稱未正崇寜初吏部侍郎卄一鄧洵武上䟽曰神宗稽古創法􅁵正官各使省臺寺監之官實典職事領空名者一切罷去而易之以階因而制禄命出之日官號法制鼎新於上而􅃔倫庻政攸叙於下今吏部選人自節察判官至簿尉凢七等先帝甞欲以階􅀉禄而未暇願造爲新名因而􅀉禄使一代條法粲然大備徽宗從其言詔有司討論於是置選人七階蔡卄二元道官制舊典乃失引之政和四年六月戊寅御筆取㑹到入内内侍省所轄􅁐東門藥庫見置庫在皇城内北隅拱宸門東所藏鴆鳥蛇頭葫蔓藤鈎吻草毒汗之􅀋品數尚多皆属川廣所貢典掌官吏三十餘人契勘元無支遣顯属虛設蓋自五季乱離紀綱頽靡多用此物以勦不臣者㳂襲至于本朝自藝祖以來好生之德洽于人心􅀂干憲網莫不明寘典刑誅殛市朝何甞用此自今可悉罷貢額並行停進仍廢此庫放散官吏比附安排應毒藥并盛貯器皿並交付軍器所仰於新城門外曠闊逈野處焚棄其􅁅燼於官地埋瘞分明封堠摽識無使人畜近犯疾速措置施行仰見祐陵仁厚之心德及豚魚敬録于編以詔無極靖康元年正月戊辰金賊犯濬州徽考㣲服出通卄􅥅津門御小舟將次雍丘命宦官鄧善詢召縣令至津亭計事善詢廼以它事召之令前驅至近岸善詢從稠人中躍岀呼令下馬厲聲斥之令曰某出宰畿邑冝示威望安有臨民而行者乎善詢曰太上皇帝幸亳社聊此駐蹕令大驚捨車疾趍舟前山呼拜蹈自劾其罪徽宗􅀏曰中官與卿戲耳遂召入舟中是夕阻淺船不得進徽宗患之夜出堤上御駿騾名鵓鴿青望睢陽而奔聞鷄啼濵河有小市民皆酣寢獨一老姥家張燈竹扉半掩上排户而入嫗問上姓氏曰姓趙居東京巳致仕舉長子自代衛士皆􅀏上徐頋衛士亦􅀏嫗進酒上起受嫗酒復傳爵與衛士嫗延上至卧内擁爐又􅅡勞薪與上釋襪烘趾乆之上語衛士令記嫗家地名及龍舟還京嫗没乆矣卄四廼以白金賜其諸孫蜀僧祖秀云元祐八年九月三日崇慶撤簾泰陵親政時事鼎新首逐吕正􅉖􅂫文定明年改元紹聖四月自外拜章子厚爲左僕射時東坡先生已責英州子厚旣至蔡元度鄧温伯迎合以謂神宗實録詆誣之甚乞行重修繇是立元祐黨籍凢當時位於朝者次第竄斥初止七十三人劉器之亦甞以語胡德輝珵見之元城道護録其間亦自相矛盾如川洛二黨之􅀋未始同心也徽宗登極復皆召用有意調一而平之蔡元長相矣使其徒再行編􅀋黨人刋之于石名之云元祐姦黨播告天下但與元長異意者人無賢否官無大小悉列其中屏而弃之殆三百餘人有前日力闢元祐之政者亦饕厠名愚智混殽莫可分别元長意欲連根固本牢甚然而無益也徒使其子孫有榮耀焉識者恨之如近日􅀭州重刻元祐黨人碑至以􅂫逈爲􅂫過叔黨在元祐年猶未褁頭豈非字畫之誤乎􅀹爲無謂逈字彦逺東坡先生之族子登進士第爲瀘川令元符末應日食上言􅀹爲切直蔡元長旣使其徒編􅀋上書邪等彦逺爲邪上􅀹甚又入元祐黨籍之石坐削籍編管華州遇赦量移潼川牽復爲普州岳安尉卒于官紹興初特贈宣教郎事見王望之賞所作彦逺妻史夫人墓誌及重脩瀘川二五靈濟廟碑明清頃訪徐五丈敦立于霅川徐詢以創置右府與揆路議政分合因革明清即爲考證以對徐甚以擊節即手録于其所編今列于後案唐代宗永泰中始置内樞宻使二貟以官者爲之初不置司局但以屋三楹貯文書其職惟掌承受表奏於内進呈􅀂人主有所處分則宣付中書門下施行而巳昭宗光化二年九月崔㣧爲宰相與上宻謀欲盡誅宦官中尉劉季述王仲元樞宻使王彦範薛齊偓隂謀廢上請太子監國巳而太子改名縝即位十二月孫德昭董彦弼周承誨三人除夜伏兵誅季述等翌日昭宗復位三人賜姓李除使相加號三功臣寵遇無比崔㣧與陸扆乞盡除宦者上與三人謀之皆曰臣等累丗在軍中未聞書生爲軍主者􅀂属南司必多更變不􅀂仍歸之北司爲便上喻㣧等曰將士意不欲属文臣卿等勿堅求於是復以􅀽易簡周敬容爲樞宻使然唐自此乱矣朱􅆝建國深革唐丗宦官之弊乃改爲崇政院而更用士人敬翔李振爲使二人官雖崇然止於承進文書宣傳命令如唐宦者之職今士大夫家猶有梁宣底四卷其間所載大抵中書奏請則具記事與崇政使令於内中進呈所得進止却宣付中書施行其任止於如此至後唐莊宗入汴復改爲樞宻院以郭崇韜爲使始分掌朝政與中書抗衡宰相豆盧革爲弘文館學士以崇韜父名􅀪正請改􅀪文爲昭文其畏之如此明宗即位以安重誨范延先爲樞宻使二人􅀹爲跋扈晉髙祖即位思有以懲戒遂廢之至開運元年復置末帝以其后之兄馮玉爲之自是相承不改國朝因之首命趙韓王普焉號稱二府礼遇無間每朝奏事与中書先後上所言兩不相知以故多成疑貳祖宗亦頼此以聞異同用分宰相之􅁠端拱三年置簽書院事以資淺者爲之張遜是也官制舊典誤以爲鄧公慶暦二年二邊用兵富文忠公爲知制誥建言邊事繫國安危不當專委樞宻院周宰相魏仁浦兼樞宻使國􅀄范質王溥以宰相兼叅知樞宻事今兵興冝使宰相兼領仁宗然之即降旨令中書同議樞宻院事且書其檢吕許公時爲首相以内降納上前曰恐樞宻院謂臣奪權冨公方力争㑹西夏首領乞砂等稱僞將相來降各􅀘借職覊置湖南冨公復言二人之降其家已族矣當厚賞以􅂆來者仁宗命以所言送中書而宰相􅀄不知也冨公曰此豈小事而宰相不知邪更極論之時張文定爲諌官亦論中書冝知兵事遂降制以宰相吕夷簡兼判樞宻院事章得象兼樞宻院事未幾或曰二府體例判字太重於是復改吕公亦爲樞宻使五年賈文元陳恭公同爲宰相乞罷兼樞宻使以邊事寜故也有旨從之仍詔樞宻院凢軍國機要依舊同議施行而樞宻院亦自請進退管軍臣僚極邊長吏路分鈴轄以上並與宰臣同議從之張文定復言􅌠相旣罷兼樞宻院則更不聚㕔萬一邊界忽有小虞兩地即須聚㕔毎事同議自是常事則宻院專行至渉邊事而後聚議謂之開南㕔然二府行遣終不相照熈寜􅀄滕逹道爲御史中丞上言中書宻院議邊事多不合趙明與西人戰中書賞功而宻院降約束郭逵修保柵宻院方詰之而中書巳下褒詔矣夫戰守大事也安危所􅀉今中書欲戰宻院欲守何以令天下願敕大臣凢戰守除帥議同而後下神宗善之其後竟使樞宻院事之大者與中書同奏禀訖先下俟中書退後進呈本院常程公事凢稱三省宻院同奉聖旨者是也建炎初置御營使本以車駕行幸㹅齊軍中之政而以宰相兼領之故遂專兵柄樞宻院幾無所干預吕元直在相位自以謂有復辟之功專恣尤甚臺諌以爲言元直旣罷政遂廢御營司而宰相復兼知樞宻院事自范斍民爲始爾後悉兼右府矣秦㑹之獨相十五年帶樞宻使至紹興乙亥㑹之殂次年沈守約万俟元忠拜相遂除去兼帶中書與樞府二六又始分矣徐敦立語明清云凢史官記事所因者有四一曰時政記則宰執朝夕議政君臣之間奏對之語也二曰起居注則左右史所記言動也三曰日暦則因時政記起居注潤色而爲之者也舊属史舘元豊官制属祕書省國史案著作郎佐主之四曰臣僚墓碑行狀則其家之所上也四者惟時政執政之所日録於一時政事最爲詳備左右史雖二貟然輪日侍立榻前之語旣逺不可聞所頼者臣僚所申而又多務省事凢經上殿止稱别無所得聖語則可得而記録者百司関報而巳日暦非二者所有不敢有所附益臣僚行狀於士大夫行事爲詳而人多以其出於門生子弟之􅀋以爲虚辤溢美不足取信雖然其所泛稱德行功業不以爲信可也所載事跡以同時之人考之自不可誣亦何可盡廢云度在舘中時見重修哲宗實録其舊書崇寧間帥多貴㳺子弟以預討論於一時名臣行事旣多所略而新書復因之于時急於成書不復廣加搜訪有一傳而僅載歴官先後者且據逐人碑誌有傳中合書名猶云公者讀之使人不能無恨新唐書載事倍於舊書皆取小􅀃本朝小􅀃􅀹少士夫縱有私家所記多不肯輕出之度謂史官欲廣異聞者當擇人叙録所聞見如段太尉逸事狀鄴侯家傳之􅀋上之史官則庻幾無所遺矣歐陽公歸田録初成未岀而序先傳神宗見之遽命中使宣取時公巳致仕在頴州以其間所記述有未欲廣者因尽刪去之又惡其太少則雜記戲􅀏不急之事以充滿其卷秩旣繕冩進入而舊本亦不敢存今丗之所有皆進本而元書盖二七未甞出之也敦立又語明清云自髙宗建炎航海之後如日暦起居注時政記之􅀋初甚圎備秦會之再相継登維垣始任意自專取其紹興壬子嵗初罷右相凢一時施行如訓誥詔旨與夫斥逐其門人臣僚章䟽奏對之語稍及於已者悉皆更易焚弃繇是亡失極多不復可以稽考逮其擅政以來十五年間凢所紀録莫非其黨姦䛕謟佞之詞不足以傳信天二八下後丗度比在朝中甞取觀之太息而已眀清甞謂本朝法令寛明臣下所犯輕重有等未甞妄加誅戮恭聞太祖有約藏之太廟誓不殺大臣言官違者不祥此誠前代不可􅉥及雖盧多遜丁謂罪大如此僅止流竄亦復北歸自晉公之後數十年蔡持正始以呉處厚訐其詩有譏訕語貶新州又數年章子厚黨論乃興一時賢者皆投炎荒而子厚迄不能自免爰其再啓此門元祐間治持正事二三公不無千慮之一失使如前代則姦臣藉口當渫血無窮也明清甞以此􅀃語朱三十五丈希真大以爲然太祖誓言得之曹勛云從二九徽宗在燕山靣喻云尓勛南歸奏知思陵明清甞得英宗批可進􅃺一􅁓于梁才甫家治平元年宰執書臣而不姓且花押而不書名以􅀊月考之則韓魏公曾魯公歐陽文忠公趙康靖作相叅時也但不曉不名之義後閱沈存中筆談云本朝要事對禀常事擬進入畫可然後施行謂之熟狀事速不及侍報則先行下具制草奏知謂之進草熟􅃺白􅁓書宰相押字始悟其理不知今又如何耳揮麈後録卷之一
