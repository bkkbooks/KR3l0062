front:
  text: 實録院牒泰州
  hash: sha256:8cfb3f07ee6e4889515788b122dc7ca6aae70f9be2220932ffe4a31c513c6816
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_000-1a}
body:
  text: 檢準淳熙十五年五月二十四日尚書省劄子國史院狀勘會巳降聖旨指揮修髙宗皇帝實録續奉聖旨編修御集今來合要髙宗皇帝朝曾任宰執侍從卿監應職事等官𬒳受或收藏御製御筆手詔及奏議章疏劄子并制誥日記家集碑志行狀諡議事迹之類委守臣躬親詢訪如逐官其間有己物故者詢其家子孫取索如部秩稍多差人前去抄録及委官點對津發赴院仍許投獻優賜錢帛多者推賞候指揮五月二十三日三省同奉聖旨依劄付院當院今訪問得泰州通判王明清有揮麈前後録合行點使須至公文牒請詳牒內事理遵從巳降聖旨指揮移文王通判借本差人抄録委官點對無差漏疾速津發赴院守等照使幸勿違滯仍先希巳依應公文回示謹牒慶元元年七月初八日牒宣教郎太學博士兼實録院檢討官戴溪奉議郎袐書省著作佐郎兼實録院檢討官李璧中奉大夫行軍器少監兼玉牒所檢討官兼實録院檢討官髙文虎朝請郎新除樞密院檢詳諸房文字兼實録院檢討官石宗昭實録院牒泰州檢準淳熙十五年五月二十四日尚書省劄子節文勘會巳降聖旨指揮修髙宗皇帝實録續奉聖旨編修御集今來合要髙宗皇帝朝曾任宰執侍從卿監職事等官𬒳受或收藏御製御筆手詔及奏議章疏劄子并制誥日記家集碑志行狀諡議事迹之類今訪問得泰州通判王明清有揮麈前後録合行照使當院巳於七月內文移貴州去後至今多日未見依應前來須至再行公文牒請詳牒內事理遵從巳降聖旨指揮移文王通判借本差人抄録前項所要文字委官點對無差漏疾速津發赴院守等照使幸勿仍前違滯謹牒慶元元年九月日牒宣教郎太學博士兼實録院檢討官戴溪奉議郎袐書省著作佐郎兼實録檢討官李璧奉議郎祕書省祕書郎兼實録院檢討官兼弟許國公府教授兼權司封郎官顔棫朝散郎祕書省著作郎兼實録檢討官兼吳王益王府教授兼權兵部郎官王容承議郎袐書丞兼實録院檢討官兼權禮部郎官邵康中奉大夫行軍器少監兼玉牒所檢討官實録院檢討官髙文虎朝議大夫起居郎兼實録院檢討官兼權刑部侍郎劉德秀朝請大夫權尚書禮部侍郎兼實録院同修撰楊輔朝奉大夫權尚書吏部侍郎兼實録院同修撰應孟明朝議大夫試中書舍人兼侍講兼實録院同修撰黃由太中大夫試吏部尚書兼侍講兼實録院同修撰葉翥揮麈前録總目卷之一一誕節立名自唐明皇千秋節始二祖宗御像所在三祖宗誕聖之地建寺賜名四開基節名因孟若蒙乞置五太祖詔修三代帝王祠廟配享所在六本朝功臣配享七髙宗用人納言皆有明見八仁宗不以玉帶為寶以人安為寶九李和文其家書畫皆冠丗之寶十以玉帶為朝儀始于熙寧十一諡孔子為至聖文宣王十二郡國立學自元魏獻文始十三東臺西臺立號所始十四崇政殿講書肇于開寶十五本朝列聖潛藩升府十六英宗與令鑠同年月日時生十七皇朝列聖搜訪書籍十八士大夫家藏書多失於讎校十九紹興帝后陵寢以􅑼宫為名二十徽宗永固陵為永祐卷之二二十一祖宗重先代陵寢詔禁樵採二十二歐陽文忠公以太子少師帶觀文殿學士致仕二十三國朝侍從以上自有寄祿官二十四舊制侍從致仕加贈四官二十五翰林佩魚自蒲傳正始二十六熙寧間始置在外宫觀二十七本朝官制分左右字沿革二十八本朝宰相再為樞密使二十九樞密使子弟皆㭪班行三十館職編修不可令武臣提舉三十一密院承旨文武互用自王荆公始三十二湯特進封慶國公上章不受三十三州縣官帶學事繫銜三十四五朝俱立三相三十五本朝宰相兼公師三十六本朝三入相者六人三十七本朝自外拜相者四人三十八弟草兄麻國朝以來有兩家三十九國朝宰相享富貴耆壽者十人四十本朝名公多厄於六十六四一本朝宰相年少無逾范覺民張魏公四二宰相見子入政府惟曾宣靖一人四三本朝吕氏一家執七朝政四四本朝父子兄弟為宰執者二十餘人四五韓奉常之妻可儷於唐之苗夫人四六錢氏冨貴三百年相續前代未見四七古硯犀帶皆王氏舊物四八本朝居政府在具慶下者十七人四九本朝狀元登庸者六人五十本朝父子兄弟俱居翰苑五一雍孝聞三丗俱以罪廢五二本朝族望之盛五三建州浦城有四甲族五四浦城章氏登科題名卷之三五五蜀中大族犯髙宗御名各易其姓五六三丗探花郎五七錢氏一家盛事常占天台五八本朝蘇蔡吕入相故事五九子孫當為祖父諱名六十本朝以遺逸起者二人六一國初取士極少無踰宣和之盛六二配享宣聖兖鄒並列六三劉器之殿試取馬巨濟巨濟不稱門生六四薛叔器家有古關外侯印六五台吏楊滌丹陽李格藏多唐綸軸告命六六歐宋唐書不著文中子而李習之劉禹錫等載之甚詳六七歐蘇二公作文多避祖諱六八賜生辰器幣至遣使命六九慶曆赦書許文武官立家廟七十衣緋緑賜金紫七一本朝父子兄弟俱為狀元有四家七二監司遇前宰執帥守處即入客位通謁七三張載賢者不當使鞠獄七四立法貴得中制七五太宗還西夏所獻鶻七六朱紱自陳與姦人同姓名蔡元長大喜七七徐德占讀詔聲音之訛七八董彥逺連徴蔡居安爪事果輔外七九曾文肅夢衣緑謝恩八十虜主犀帶磁盆八一建隆遺事詞多誣謗八二張賢良應制科遇所著論中選八三久在館中始呼學士八四髙宗得尉拒敵故得南渡八五飲酒談禪貴安自然八六國初吏部給出身兼説歲數形貌以防偽冒八七靖康追褒或有僥幸八八張文潛元帶閣職八九李成因子覺為國博贈光祿寺卷之四九十王素同姓名者二李定同姓名者三九一心喪始於郭稹九二三泉縣令許發賀表奏輔九三張逸知蜀斷政如神九四南朝沙合出宰相九五昔人重契義書札嚴分守九六王延德歷敘使髙昌行程所見九七王仲言弱齡見知於朱希真徐毅立二公九八郭熙畫山水有名九九吕微仲安厚卿二公賢否一百姚令威得會稽石碑論海潮依附隂陽時刻百一王仲言序百二李賢良簡百三王知府跋前四卷秀州巳嘗刋行
