front:
  text: 揮塵第三録卷之二七汝隂王明清元祐中舒州有李亮工者以文鳴薦紳間與􅂫黄游
  hash: sha256:05c7a97abe74b91baaa684cb9913fdc5a61877798657cda8eca12906d6dbb63f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_019-1a}
body:
  text: 兩集中有與其唱和而李伯時以善丹青妙絶冠丗且好古愽雅多收三代以來鼎彛之􅀋為考古圖又有李元中字畫之工追蹤鍾王時號龍眠三李同年登進士第出處相若納以先貴毋相忘其八後位俱不顯先大父大􅀚􅀄從郎曹得守九江自郷里汝隂之官有同年生宋景瞻者姑溪人其子惠直爲德化縣主簿迎侍其父以來先祖愛其清修好學甚前席之教以習宏詞科日與岀題以其所作來呈不復責以吏事㑹王彦昭渙之出帥長沙令作樂語以燕犒之時有王積中者知名士也以特起爲僉書節度判官且俾預席其藁不存但記憶三聮云少年射䇿有賈太傅之文章落筆驚人継沈中丞之翰墨從來汝頴之間固多竒士此去瀟湘之地逢故人况有錦帳之郎官來爲東道且邀紅蓮之幕客共醉西園先祖讀之大喜以謂句句着題薦之于時相何清源即除書局已而中詞科自此聲名籍甚惠直字子温其子廼貺也紹興間鼎貴亦不復相聞今又未知其子孫猶知之否九江有碑工李仲寧刻字甚工黃太史題其居曰瑑玉坊崇寧初詔郡囯刋元祐黨籍姓名太守呼仲寧使劖之仲寧曰小人家舊貧寠止因開􅂫内翰黃學士詞翰遂至飽暖今日以姦人爲名誠不忍下手守義之曰賢哉士大夫之所不及也餽以十酒而從其請宣和中􅂫叔黨游京師寓居景德寺僧房忽見快行家者同一小轎至傳旨宣召亟令登車叔黨不知所以然不敢拒才入則以物障其前惟不設頂上以小凉傘敝之二人肩之其疾如飛約行十餘里抵一脩廊内侍一人自上而下引之升一小殿中上巳先坐披黃背子頂青玉冠宫女環侍莫知其數弗敢仰窺始知爲崇髙莫大之居時當六月積氷如山噴香若煙霧寒不可忍俯仰之間不可名狀起居畢上喻云聞卿是􅂫軾之子善􅀞窠石適有素壁欲煩一掃非有它也叔黨再拜承命然後落筆須􅁷而成上起身縱􅀚賞歎再三命宫人捧賜釂酒一鍾錫賚極渥拜謝而下復循廊間登小輿而出亦不知經從所歷何地但歸來十一如夢復如癡也胡元功云徽宗靖康􅀄南幸次京口駐蹕郡治外祖曾空青以江南轉運使來攝府事應辦忽宣至行宫上引至深􅃉之所問勞勤渥命喬貴妃者出焉上回顧語喬曰汝在京師每問曾三此即是也特令汝一識耳蓋外祖少年日喜作長短句多流入中禁故爾取七寳盃令喬手擎滿酌并以盃賜之外祖拜貺而岀明清少依外氏寳盃猶及見之今不十二知流落何所錢遜叔伯言穆父之子臨政有風采知􅀫州日有虹縣士民陳詞舉留邑宰宰貪酷之聲遜叔先巳聞之至是衆趨廷下遜叔令吏卒舉挺擊出左右言似不須如此遜叔􅀏云彼中打􅀅來此間打廻去􅂫仁仲云曾文肅熈寧初爲海州懐仁令有監酒使臣張者小女甫六七􅀊甚爲惠􅃛文肅之室魏夫人憐之教以誦詩書頗通解其後南北睽隔紹聖􅀄文肅柄事樞時張氏女已入禁中雖無名位以善筆札掌命令之岀入忽與夫人相聞夫人以夫貴䟽封􅌡國稱壽禁庭始相見叙舊自後歳時遣問夫人没張作詩以哭云香散簾幃寂塵生翰墨閑空傳三壼譽無復内朝班從此絶迹矣後四十年靖康之變張從昭慈聖獻南渡至錢唐朱忠靖筆録所記昭慈遣其傳導反正之議張夫人者即其人也年八十餘終先嬢子云劉季髙岑未逹時詹安丗度帥中山以貧甚携王履道書往謁之旣至彼館勞甚至酒食游戲徴逐無虚日而略無一語及他時河北盗賊已充斥留連逾月季髙興懷歸之念因漫扣之詹云足下之來何幹度豈不能暁其敢苦相挽留耶少刻便令差將兵二百防護行李以濟犬河廼回三日之間餽十五饟稠疊所得凢萬緡云姚令則云靖康丙午真戎亂華次歳之春京城不守恣其號舞妄有易置時秦㑹之爲御史中丞陳議狀云檜切縁自父祖以來七丗事宋身爲禁從職當臺諌荷國厚恩甚媿無報今大金重擁甲兵臨已㧞之城操生殺之柄威制官吏軍民等必欲滅宋易姓檜忘身尽死以辯非理非特忠其主也欲明聖朝之利害爾趙氏自祖宗以至嗣君一百七十餘年功德基業比隆漢唐實異兩晉頃縁姦臣叛盟結怨隣國謀臣失計誤主䘮師遂致生靈被禍京都失守嗣君皇帝致躬出郊埛求和於軍前兩元帥並議巳布聞於中外矣且空竭帑藏居民之所積追取鑾輿服御之所用割兩河之地共爲臣子今乃變異前議自敗斯盟致二主銜怨廟社將傾爲臣之義安得忍死而不論哉自宋之於中國號令一統綿地數萬里覆載之内疆場爲大子孫蕃􅄛充刱四海德澤在外百姓安業前古未有興亡之命雖在天有數焉可以一城而決廢立哉新室􅆲奪東漢中興於白水東漢絶於曹氏劉備王蜀唐爲朱温竊取李克用父子猶推其丗序而繼之蓋繼志之德澤在人者淺深根基堅固雖陵遲之甚然四海英雄必畏天之威而不敢窺其位古所謂基廣則難傾根深則難抜之謂也西晉武帝因宣景之權以窺魏之神器德澤在人者淺加以惠帝昬乱五王争柄自相殘戮故劉淵石勒以據中原猶頼王導温嶠軰輔翼元皇江左之任踰於西京石勒欺天罔上交結外􅀖以􅆲其主晉於天下也得之以契丹少主失德任用非人而忘大恩曽無德澤下及􅀺庻特以中國藩籬之地以贍戎人天下其何思之哉此契丹所以能㓕晉也宋之有天下九丗宥德比隆漢唐實異兩晉切觀今日計議之士多前日大遼亡國之臣畫䇿定計所以必㓕宋者非忠於大金也假㓕大宋以報其怨尓曽不知㓕大遼者大金大宋共爲之也大宋旣㓕大金得不防閑其人乎頃者上皇誤聽姦臣李良嗣父兄之怨㓕契丹盟好之國乃有今日之難然則因人之怨以㓕人之國者其禍不可勝言繆爲計者必又曰㓕宋之國在絶兩河懷舊之恩除鄰國復仇之志而已又曰大金兵威無敵天下中國之民可指揮而定􅀂大金果能㓕宋兩河懷舊之恩亦不能忘果不能㓕宋徒使宋人之宗属賢德之士唱義天下竭國力以北向則兩河之民雖異日撫定之後亦􅀅去大金而歸宋矣且天生南北之方域志異也晉爲契丹所㓕周丗宗復定三􅀜是爲晉祚報恨然則今日之㓕趙氏豈必趙氏然後復仇哉雖中原英雄亦􅀅復報中國之恨矣檜今竭肝膽􅂢軀命爲元帥言廢立之義以明兩朝之利害伏望元帥不恤群議深思國計以辯之於朝若或有䜛佞之言以矜己功能傷敵國之義適貽患於異日矣又况禍莫大於㓕人之國昔秦㓕六國而六國㓕之符堅㓕燕而燕㓕之頃童貫蔡攸貪土地以奉主欲營私而忘國計屯兵境上欲㓕大遼以取燕雲之地方是時也契丹之使交馳接境祈請於前爲貫攸之計冝僞許而從其請乃欲邀功以兼人之地遂貽患於主而宗廟危今雖焚屍戮族又何益哉今元帥威震中原功髙在昔乃欲用讎間之論矜一巳之功其於國計亦云失矣貫攸之爲可不鍳哉自古兵之強者固有不足恃劉聦石勒威足以制􅉖懷而剉於李矩數千之衆符堅以百萬之師衂於淝水之􅀌旅是兵強而不足恃也大金自去歳問罪中國入境征伐已踰􅀊矣然所攻必克者無他以大金乆習兵革中國承平百年士卒㢮練􅀅佐不得其人而然也且英雄丗不乏材使士卒異日精練若唐藩鎮之兵􅀅相得人􅀂唐肅代之臣大金之於中囯能必其勝負哉且丗之㒷亡必以有德代无德以有道而易無道然後皇天佑之四海歸之若張􅀖昌者在上皇時專事燕游不務規諌附㑹權倖之臣共爲蠹國之政今日社稷傾危生民凎炭雖非一人所致亦􅀖昌之力也天下之人方疾之若􅄷讎若付以土地使主人民四方英豪必共起而誅之非特不足以代宋亦不足以爲大金之屏翰矣大金必欲㓕宋而立􅀖昌者則京師之民可服而天下之民不可服京師之宗子可㓕而天下之宗子不可㓕檜不顧斧越之誅戮族之患爲元帥言兩朝之利害伏望元帥稽考古今深鍳斯言復君之位以安四方之民非特大宋蒙福實大金萬丗之利不勝皇恐懇吿之至第二狀云檜巳具壯申大元帥府外有不盡之意不敢自隠今更忍死瀝血上干台聽伏念前主皇帝違犯盟約旣巳屈服而今日存亡繼絶惟在元帥不然則有監國皇太子自前主恭命出郊以來鎮撫居民上下帖然或許就立以從民望若不容檜等伸臣子之情則望賜矜念趙氏祖宗並无失德内外親賢皆可擇立若必擇異姓天下之人必不服從四方英雄必致雲擾生靈􅂗炭卒未得甦檜等自知此言罪在不赦然念有宋自祖宗以來德澤在人於今九丗天下之人雖匹夫匹婦未忍忘之又况檜等丗食君禄方今主辱臣憂之時上爲宗社下爲生靈苟有可言不敢逃死伏望台慈更賜矜察無任哀懇痛切皇恐隕越之至此書得之于丹陽􅂫著廷藻云頃爲秦之孫塤客因傳其本詞意忠厚文亦甚竒使㑹之誠有此而無紹興再相擅國罔上專殺尚威則謂非賢可乎昔人有詩云周公恐懼流言後王莽謙十六恭未篡時􅀂使當時身便死一生真僞有誰知靖康末虜􅀐渡河直抵京城危蹙之甚欽宗命王㓜安㐮爲西道揔管招集勤王之師以爲捄援㓜安辟先人爲幹當公事先人爲草檄文晁四丈以以道讀之激賞不已云此出師表也今録于後叛服者夷狄之常性􅀔有汙隆忠義者臣子之大方道無今古矧黃屋有阽危之慮而赤縣無援助之師念聖神施德於九朝方􅀺庻痛心於四海敢縁尺牘盡露肺肝在昔髙帝被圍於平城文皇求盟於渭水􅀅相失色智勇吞聲盖自竹帛已來有斯妖孽之􅀋致􅀑區獸夷之肆􅁀豈人謀神理之能容蠢彼小羗尤爲遺燼聲教僅通於上國名號不齒於四夷縁威懷之並施乃信義之俱棄聖上天臨万宇子育群生霄憂兼夷夏之心夕􅅥紹祖宗之業宣恩屈己猶負固以跳梁繼好息民更執迷而猖蹶始鴟張於沙漠再豕突於帝畿旣邊圍之弛防又廟堂之失䇿窫窳旁吞於黒水􅍴搶直拂於紫􅄤睥睨望萬雉之墉蹂踐連千里之境鯨鯢我郡邑魚鼈我人民氛祲煙塵共起熖天之􅀔衣冦士庻咸罹􅂗地之􅁈赤子何辜蒼天不弔冦攘驅掠不可數知焚蕩傷夷動以万計然而天惟助順神必害􅄹終無摩壘之兵僅保傅城之衆能接􅀊而再至旣經時而何施今則脊尾俱摇腹背受敵舊地皆失内潰有強隣之侵衆心自離外隳無諸國之助咸聞氣奪尚敢尸居匪惟難犯於金湯固已自迷於巢穴䑕無牙而穿屋情狀可知羊羸角以觸藩進退不果尚假息游魂於城下巳叩閽請命於軍中而况六師用壯以方張諸􅀅不謀而問㑹熋羆之旅則帶甲百萬騄􅂹之足則有騋三千人知逆順而四靣聲馳士識恩讎而方萬響動務施逺略必解長圍速勞􅆛虎之師盡掃犬羊之衆嘯聚之黨將就戮除噍􅀋之徒㝷當殄㓕㳙時並進旨日克平義動顯幽包胥泣秦庭之血誠開金石霽雲射浮圖之甎盍思古人謂誓死起救於將㒹勿令後日譏擁兵坐觀而不赴某恭被睿筭外緫戎昭籌筆非良敢效流馬之運輪蹄並進盡提水犀之軍戈矛相望於道塗舳艫衘尾於淮海巳浮楚澤前壓師濵誓資衛社之何盟共濟勤王之盛舉望龍虎之氣行瞻咫尺之天聽鳥烏之聲益勞方寸之地同扶王室各奉天威誓爲唇齒之依期壯輔車之􅀔共惟某官誠深體國義切愛君忠孝貫於神明威名慴於夷虜决䇿定難素髙平日之謀拯溺救焚豈有淹時之乆雪宗祧之大憤拯􅀺庻之横流􅀔方万全士在一舉九金鼎就難逃魑魎之形萬里塵清永肅乾坤之照乗彼􅀲分之後在我皷行而清霣涕而十七言至誠斯盡竊惟國家道得仁義蓄飬天下自一命以上隨其器宇各霑恩澤祖宗以來平時奬待群臣之恩至厚者蓋慮一旦緩急之間貴其盡節死職以忠報朝廷伏見頃者虜兵所加靡然風偃知名之士幾無而僅有於亂離中隂訪得三人焉若不論之朝廷寔慮忠臣義士㗸􅁈􅀒憤無以自明太原緫管王禀當虜人作難之時在圍城中奮忠城義不頋一身一家之休戚遇一兩日輒領輕􅀐岀城馬上運大刀徑造虜營中左右轉戰得虜級百十方徐引歸率以爲常宣撫使張孝純視城之危一日㑹監司食謀欲降虜禀知之率所將刀手五百人謁孝純列刀於前起論曰汝等欲官否衆曰然禀曰惟朝廷立功則官可得又曰汝等欲賞否衆曰然禀曰惟朝廷禦敵則賞可致且曰汝等旣欲官又欲賞冝宣力盡心以忠衛國借如汝等軰流中有言降者當如何群卒舉刀曰願以此戮之又曰如禀言降當如何卒曰亦乞此戮之又曰宣撫與衆監司言降當如何卒曰亦乞此戮之孝純自後絶口不復敢言降事而城中兵權盡在禀矣又於守城過有隄備虜人巧設機械屢岀竒計見攻禀候其來必以意麾解之後圍益急民益困倉庫軍儲且盡城中之人五相啖食披甲之士致煑􅃓弩筋膠塞飢􅀔力旣竭外援不至城旣䧟父子背􅀒太宗皇帝御容赴火而死又有晉寧知軍徐徽言虜􅀐攻城極力保護綿歷時月嬰城之人疲於守禦虜􅀐旣登城軍士散走徽言奮臂疾呼獨用􅃓矢斧􅃏盡殺先登者衆見知軍如此氣乃復振虜亦稍郤後爲監門官宣賛舎人石贇開門縱敵巳入知不可柰何遂置妻妾兒女於空室中積薪自焚且仗劒坐廳事前虜人至者皆手刄之須􅁷積尸多虜衆群至遂爲所擒酋長賞其英毅深欲活之使降徽言不降使之跪徽言不跪與酒令飲旣授酒以盃擲虜靣曰我尚飲虜賊酒乎幔罵不已虜怒持刃刺徽言􅃝禓就刄刄未及死罵聲不絶又有真定帥臣李邈城破被虜復令作帥邈曰坐邈不才使一城生靈䧟於􅂗炭縱邈無耻復受官爵有何靣見朝廷及一城阜老乎卒不肯受㝷之燕山虜亦欲保全之而邈意略不少屈又不肯去頂髪虜人責之邈髠而爲僧謂曰更以二分􅃳官虜大怒牽赴市令斬􅀅刑神色不變言􅀏如平時告刑者曰願容我辝南朝皇帝以死拜訖南向端坐就戮燕山之民皆為之流涕此三者蓋人傺也惜不逢時使不得成功於丗然當是之時怙乱要生靡所不有而禀軰風節如此質之古人誠未多得慮朝廷未能究之使忠義之士與庸人共就湮没實可憫悼伏望矜恤􅀅禀等忠烈寵之爵命葬之衮服建祠以圖其像載事實以刋之碑仍乞訪㝷子孫重加旌異且令劄付史官以奬忠孝少萬偷俗之弊右此紙頃􅀊得之故人榮􅉮次新几間雖失所著人姓氏嘉其用心忠憤激切故用録之囙而夷考三人行事禀開封人追封安化郡王錫賚甚腆擢其子爲樞宻院屬官曾丞相懷即其壻也徽言衢州人贈晉州觀察使謚忠壯程致道爲作誌銘邈臨江軍人名儒中之子曾南豐之甥進士及第累爲監司與蔡元長不叶換右階以青州觀察使死節贈少保謚忠壯十八有道處士逈之兄也建炎己酉苗傅劉正彦反呂張二公檄諸州之兵以勤王檄至霅川郡守梁端㑹寓客謀之外祖曾公卷在坐衆未及言公􅁬然曰逆順明甚出師無可疑者間數日二􅇯取兵公請械繫使人毋令還當是時㣲公幾殆髙宗反正中司張全真守白發其忠詔進職二等赴闕全真奏議集中載其十九薦牘亦已刋行故不復録外祖跋董令升家所藏真草書千文略云崇寧初在零陵見黄九丈魯直云元祐中東坡先生錢四丈穆父飰京師寳梵僧􅃕因作草書數紙東坡賞之不已穆父無一言問其所以但云恐公未見藏真真迹尔庭堅心切不平紹聖貶黔中始得藏真自叙於石揚休家諦􅀚數日恍然自得落筆便􅁴超異回視前日所作可􅀏然後知穆父之言不誣也錢義妻德國夫人李氏和文之孫女早歳人物妹麗建㚐初侍其姑秦魯大主避虜入淮次真州而爲巨冦張遇衝刼骨􅁏散走度大江抵句容境上復爲賊之潰黨十餘人所略同時被虜儕􅀋六十軰姿色皆勝歐之入村落閴無人迹之境悉置一古廟中毎至未暁則群盗皆出扄鏁甚固至深夜廼歸必携金繒酒􅁏而來蓋椎埋得之逾旬無計可脫一日午間忽聞廟外有嗽咳之音諸婦岀􅂩中窺之一男子坐于石上即呼來隔扉與之語男子云我荷擔于此所謂貨嚢者婦各以實告且祈哀以求生路許以厚圖報謝其人復云此距廵檢司才十餘里吾當亟往吿之以營捄若等今夕必濟幸無怖也何用報乎至夜盗歸醉飽而寢忽聞鑼聲甚振迺廵檢者領兵至矣盡􅀗賊徒無一人脫者詢婦軰各言門閥皆名族貴家於是遣人以禮津送其歸夫人後享冨貴者數十年頃􅀊其子雋卄一道端英奉版輿過天台夫人已老親爲明清言之向伯恭爲淮南漕張􅀖昌僣竊于京師遣向之甥劉逵賫僞詔來伯恭不啓封焚之械繋逵于獄遣官奉表勸進髙宗于河北其後以此柬上之知至位法從掛冠而去寵遇極渥丗所共知而胡仁仲宏作其行狀亦甞及焉時又有徐端益字彦思婺州人也爲􅀫州虹縣武尉􅀖昌赦書至邑邑令以下迎拜宣讀如常儀端益不屈􅂰而走事定伯恭爲言于朝詔換文資後終於朝請大夫子亦登科彦思􅀶學多聞與先游從所厚者也先人嘗以詩著其節誼淳熈戊申冬明清調官于臨安解后其次子于相府方識之以其父前績祈造化于周益公坐客莫有知者於立談間廼指明清爲引卄二證舊聞益公􅀅上得旨令與属官差遣趙叔近者宗室子登進士弟有材略建炎􅀄爲兩浙提刑統兵平錢塘之亂擢直龍圖閣時大駕駐維揚以選掄守秀州治績甚著或有言其貪汙者免所居官拘係于郡遣朱芾代其任芾到官未乆頗肆殘酷軍民怨憤有茶酒小卒徐明者帥其衆囚芾迎叔近復領州事叔近知事不可遏登㕔呼卒徒安尉而告之曰新守􅁀虐不䘏致汝軰所以爲此我當爲汝等守印請于朝别差慈祥愷悌之人來拊此一方群卒俯伏不敢猖獗奏牘末及徹閽而朝廷已聞詔遣大軍往討之矣先是王淵在京爲小官時狎露臺娼周者稔甚亂後爲叔近所得携歸家淵每對人切齒是時適淵爲御營司都統制張韓俱爲淵部曲淵命張提師以往張素以父事淵拜辭于廷淵云趙叔近在彼張黙解其指􅀅次秀境叔近乗凉輿以太守之儀郊迎于郡北沈氏園張即叱令供析方下筆而群刀悉前斷其右臂叔近號呼曰我宗室也衆云汝旣從逆何云宗室巳折首于地秀卒見叔近被殺始忿怒返戈嬰城以距敵縱火歐略一郡之内􅱷血荼毒翌日破􅀜誅其首􅁖雖曰平定然其擾􅀹甚凱旋行闕第功行賞焉張於亂兵中􅀗周娼以獻于淵淵勞之曰處置甚當但此婦人吾豈冝納君當自取之張云父旣不取某焉敢耶時韓在旁淵顧曰汝留之無嫌也韓再拜而受之旣歸韓甚以寵嬖爲韓生子韓旣貴盛周遂享國封之榮朝廷後知叔近之死於不幸詔特贈集英殿修撰制詞云士有以權濟事當時頼之未幾姦人圖之于今公議歸之此朕所深悼者也可無􅉖典以光泉壌哉爾属籍之英吏能優􅁉昨者嘉禾適所臨典旁近部狂冦三發悉頼爾以定一方怗然而適與禍㑹可謂真不幸矣御史以􅁈狀聞朕用衋傷追榮論譔式表忠勤尚或有知歆此休命官其二子鄒浩然云揮麈第三録卷之二
