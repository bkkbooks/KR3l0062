  - {type: variant, offset: 370, length: 395, content: 族五四陳崇儀廟食事因五五唐宰相以宗室進者十三人如何史賛乃云七人卷之三五六熈寧以來宰相封國公五七蔡无道作官制舊典事有抵牾五八方軫論列蔡京章䟽五九強淵明上景鍾頌六十王宷爲林靈素中傷與劉炳俱見誅六一劉康孫啓崔貴妃奪王景彛故弟果報六二蔡元長不啓印匣用印印復在匣六三張柔直勸蔡元長收拾人材以救喪亂六四解習除知河中府以箝口喪軀六五蘭亭石刻旣存而復失六六張逹明報唐欽叟令衘命誅童貫六七馮檝雷觀同爲學官相排六八賀子忱李邈詐疾退避六九粘罕欲根刷玉牒名字頼秦中丞得免七十鄭居中與蔡京交悪七一追贈范忠宣誤作文正七二温禹弼與曾文肅相失七三蘇東坡作陳公弼傳卷之四七四徽宗燕賞元霄命王安中馮熈載進詩七五陳堯臣進退終始事迹七六靖康中黃時偁徐揆段光逺三人上虜酋書七占張邦昌僣僞事迹七八夏人沮粘罕之氣卷之五七九論熈寧以來謚法八十材人所畏者尉曹八十一江氏令樊若水獻下江南之䇿宋咸鄭毅夫記其事甚詳八十二蜀孟昶上周丗宗書八十三國朝, WYG: 姓}
