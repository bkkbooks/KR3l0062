front:
  text: 揮麈餘話卷之二
  hash: sha256:ff2c51eb33a062558d797a3628690da4a70e994453958e4ef8a0237b762ab2a7
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_023-1a}
body:
  text: 汝隂王明清丁晉公自海外徙宅光州臨終以一巨篋寄郡帑中上題云候五十五年有姓丁來此作通判可分付開之至是歲有丁姓者來二郡政即晉公之孫計其所留年月尚未生啓視之但一黑匣貯大端研一枚上有一小竅以一碁子覆之揭之有水一泓流出無有歇時溫潤之甚不可名狀丁氏子孫至今珤之又陳公密縝未逹時嘗知端州聞部內有冨民蓄一研竒甚至破其家得之研面丗所謂尉斗焦者成一黑龍奮迅之狀可畏二鸜鵒眼以為目每遇隂晦則雲霧輒興公密沒歸于張仲謀詢政和間遂登金門祐陵置于宣和殿為書符之用靖康之亂龍德宫服御多為都監王球藏匿事露下大理思陵欲誅之子裳叔祖為棘卿為之營救止從逺竄其後北歸以此研謝子裳至今藏于家二研真希丗之寶也明清嘗於王瑩夫瓘處見王荆公手書集句詩一𥿄云海棠亂發皆臨水君知此處花何似涼月白紛紛香風隔岸聞囀枝黃鳥近隔岸聲相應隨意坐莓苔飄零酒一杯今不知在何所周美成晚歸錢塘鄉里夢中得瑞鶴仙一闋悄郊原帶郭行路永客去車塵漠漠斜陽映山落斂餘紅猶戀孤城闌角凌波步弱過短亭何用素約有流鶯勸我重解繡鞍緩引春酌不記歸時早暮上馬誰扶醒眠朱閣驚飈動幕猶殘醉繞紅藥嘆西園巳是花深無地東風何事又惡任流光過却歸來洞天自樂未幾方臘盜起自桐廬擁兵入杭時美成方會客聞之倉黃出奔趍西湖之墳庵次郊外適際殘臘落日在山忽見故人之妾徒步亦為逃避計約下馬小飲于道旁旗亭聞鶯聲于木杪分背少焉抵庵中尚有餘醺困卧小閣之上恍如詞中逾月賊平入城則故居皆遭蹂踐旋營緝而處繼而得請提舉杭州洞霄宫遂老焉悉符前作美成嘗自記甚詳今偶失其本姑追記其略而書于編周美成為江寧府溧水令主簿之室有色而慧美成每􅍁洽于尊席之間丗所傳風流子詞蓋所寓意焉新緑小池塘風簾動碎影舞斜陽羡一作見金屋去來舊時巢燕土花繚繞前度莓墻繡閣鳯帷深幾許聽得理絲簧欲説又休慮乖芳信未歌先噎愁轉淸商暗想新粧了開朱戶應自待月西廂最苦夢魂今宵不到伊行問甚時却與佳音密耗擬將秦鏡偷換韓香天便教人霎時厮見何妨新緑待月皆簿廳亭軒之名也俞羲仲云曾文肅初與蔡元長兄弟皆臨川王氏之親黨後來位勢既隆遂為仇敵崇寧初文肅為元長攘其相位文肅以觀文守南徐時元度帥維揚赴鎮過郡元度開燕甚勤自為口號云並居二府同事三朝悵契闊於當年喜逢迎於斯地又云對掌紫樞參大政同扶赫日上中天謬為恭敬如是而中實不然巳而興獄文肅遂遷衡陽元祐初滕章敏帥定武時耿晞道南仲為教授偶燕集郡僚章敏席間作詩坐客皆和獨晞道辭云某以經義過省不習為詩章敏之壻何洵直滑稽名丗忽云熙寧中𥙿寧後苑射弓而殿帥林廣云不能上詢其故云臣本出弩手闔坐大笑黃六丈叔愚云李處邁邯鄲之孫政和初以直祕閣知相州外甥張澄如瑩繇宗女夫為承節郎侍行掌扎牘之寄時聶賁逺山為郡博士王將明甫為決曹椽如瑩處甥館既與二公往還且周旋甚至悉皆懷感王聶同年生也始甚歡而聶於樂籍中有所屬意王亦昵之每戒不令前聶恨之因而遂成仇怨其後甫改名黼為相薦如瑩易文階除樞密院編修巳而更秩為郎聶後以蔡元長稱其剛方有立薦之改名昌擢侍從黼大用事貶聶散官安置衡州益銜黼矣靖康時事大變召登政府黼之誅死聶有力焉而聶亦以是歲出使至絳州𬒳害黼初敗如瑩蹤迹頗危賴聶之回互竟無它南渡之後出入中外浸登要途至端明殿學士宣奉大夫拜慶逺軍節目以終四十三年無一日居間中興以來如瑩一人而巳孫長文云徐幹臣伸三衢人政和初以知音律為太常典樂出知常州嘗自製轉調二郎神之詞云悶來彈鵲又攪碎一簾花影謾試著春衫還思纎手薰徹金虬燼冷動是愁端如何向但怪得新來多病嗟舊日沈腰如今潘鬢怎堪臨鏡重省别時淚滴羅襟猶凝為我厭厭日髙慵起長託春酲未醒鴈足不來馬蹄難駐門掩一亭芳景空佇立盡日欄干倚遍晝長人靜既成會開封尹李孝壽來牧吳門李以嚴治京兆號李閻羅道出郡下幹臣大合樂燕勞之喻羣娼令謳此詞必待其問乃止娼如戒歌至三四李果詢之幹臣蹙頞云某頃有一侍婢色藝冠絶前歲以亡室不容逐去今聞在蘇州一兵官處屢遣信欲復來而今之主公靳之感慨賦此詞中所敘多其書中語今焉適有天幸公擁麾于彼不審能為我之地否李云此甚不難可無慮也既次無錫賔贊者請受謁次第李云郡官當至楓橋橋距城十里而逺翌日艤舟其所官吏上下望風股栗李一閲刺字忽大怒云都監在法不許出城乃亦至此使郡中萬一有火盜之虞豈不殆哉斥都監下階荷校送獄又數日取其供牘判奏字其家震懼求援宛轉哀鳴致懇李笑云且還徐典樂之妾了來理會兵官者解其指即日承命然後舍之曽仲恭云東坡先生出帥定武黃門以書薦士往謁之東坡一見云某記得一小話子昔有人發冡極費力方透其穴一人祼坐其中語盜曰公豈不聞此山號首陽我乃伯夷焉有物邪盜慊然而去又往它山钁治方半忽見前日祼衣男子從後拊其背曰勿開勿開此乃舍弟墓也徐敦立云政和建艮嶽異花竒石來自東南不可名狀忽靈壁縣貢一巨石髙二十餘丈周圍稱是舟載至京師毀水門樓以入千夫舁之不動或啓于上云此神物也宜表異之祐陵親灑宸翰云慶雲萬態竒峯仍以金帶一條挂其上石即遂可移省夫之半頃刻至苑中李平仲云潘兊字説之吳門人仕祐陵為侍從宣和𥘉奉祠居里中時郡民朱勔以幸進寵眷無比父沖殂勔護喪歸葬鄉間傾城出迓而潘獨不往潘之先塋適有山林形勢近沖新阡勔欲得之乃修敬于潘杜門弗納勔恃恩自恣遣人諷之且席以薰天之勢潘一切拒之勔歸京師果訴于上降御筆奪之已而又訹御史誣之以罪而禠潘之職雖抑之於一時而吳人至今稱之曽育當時云祐陵時有僧妙應者江南人往來京洛間能知人休咎其説初不言五行形神且不在人之求而告之佯狂奔走初無定止飲酒食肉不拘戒行人呼之為風和蔡元長禠職居錢塘一日忽直造其堂書詩一絶云相得端明似虎形搖頭擺腦得人憎看取明年作宰相張牙劈口喫衆生又書其下云衆生受苦兩紀都休巳而悉如其言紹興初猶在廣中蛻寂于柳州明清投轄録中亦書其略蘇訓直玭云蔡攸嘗侍徽宗曲宴禁中上命連沃數巨觥婁至顚仆賜之未巳攸再拜以懇曰臣鼠量巳窮逮將委頓願陛下憐之上笑曰使卿若死又灌殺一司馬光矣始知溫公雖遭貶斥于一時而九重固自敬服如此樂壽之云李彥思邈曾文肅之甥早歲及弟文采為政稱于一時蔡元長與之連初亦喜之後元長與文肅交惡始惡之政和𥘉自江外作邑歸時元長以師垣秉鈞入謁之後元長語其所厚曰李邈面目如此所欠一黥耳彥思聞之皇恐即上書欲願投筆比再見元長元長曰公乞易武早巳降旨換授莊宅使矣邈聞語即趍廷下效使臣之喏云李邈謝太師更不再升階而出元長笑云李彥思元來了得遮一解即除知保州見闕中父舅云詹大和堅老來京師省試罷坐微纍下大理時李傳正端初為少卿初入之時堅老哀鳴曰某逺方舉人不幸抵此祈公憐之端初怒操俚談詬曰子觜尖如此誠姦人也因困辱之巳而榜出奏名所犯既輕在法應釋得以無事自此各不相聞後十餘年端初為淮南路轉運副使既及瓜堅老自郎官出為代端初固忩之而堅老心未能平也相見各敘昧生平而巳既再見端初頗省其面目猶不記前事因曰郎中若有素者豈嘗解后朝路中邪風采堂堂非曩日比也堅老答曰風采堂堂固非某所自見但不知比往時觜不尖否端初愧怍而寤端初有子即粹伯處全也粹伯乃外祖之遺體不但曽氏之指節可驗而髙明豪放酷肖之粹伯亦不自隱禮待二家均一丗亦多知之傳正邯鄲公淑孫也鳯翔府太平觀主道士張景先出入黃安中之門甚久安中坐此彈章中頗及之有閩人黃謙者狡獪人也自買度牒逺投景先求為弟子因得以識安中後歸閩遂住武夷山每對客必目安中為家兄人以其名連易卦頗以為然安中至里中焚黃謙亦謁之安中以景先之故稍禮之逮安中北還謙宣言送伯氏出閩以山轎迹其後所至官吏眥所覩示不疑也安中既多在北方而閩距京師稍逺安中名重一時謙藉其聲勢大為姦利人不敢何一日安中遣姪歸邵武間有客道其事者姪大不平云須當痛治之謙伺其來候於道左伏謁禮甚恭方欲詰其事謙曰無廣此言聊假虎威耳舉初甚厚遂為􅍁留數日不問而去自是衆益信之人之無良有如是者謙後至政和間遂得幸為道官黃宋翰云王履道初自大名府監倉任滿至京師茫然無所向會梁師成賜第初成極天下之華麗許士庶入觀履道髽兩角以小籃貯筆墨徑入就其新堂大書歌行以美之末云初寮道人擲筆而出主􅊢輩見其人物偉勝詞翰妙絶衆目叵側時方崇尚道教直以為神仙降臨不敢呵止亟以報師成師成讀之大喜即令物色延見索其它文益以擊節薦之于上不數年登禁林入政府基於此也謝景思云劉跛子者洛陽人知人死生禍福歲一至京師前輩雜説中多記之至宣和猶在蔡元長正炎盛聞其入都在大房中下大房者外方居養福田院之類即令其子絛屏騎從往訪之跛子以手揮之勿令前且取一瓦礫用土書一退字更無它語絛歸以告于元長元長悟其言而不能用遂至于敗蔡元長帥成都嘗令費孝先畫卦影歷歷悉見後來無差豪之失末後畫小池龍躍其中又畫兩日兩月一屋有鴟吻一人掩面而哭不曉其理後元長南竄死於潭州昌明寺始悟焉蔡徽云蔡元長少年鼎貴建第錢塘極為雄麗全占山林江湖之絶勝今行在殿前司是也宣和末金冦豕突盡以平日之所積用巨艦泛汴而下置其宅中靖康初下籍沒之詔適毛逹可友守杭州逹可元長門下士也緩其施行密喻其家藏隱逾半所以蔡氏之後皆不貧又嘗以金銀寶貨四十擔寄其族人家海鹽者巳而蔡父子兄弟誅竄不暇往索盡掩為已有至今海鹽蔡氏冨冠浙右胡元功云紹聖初治元祐黨人秦少遊出為杭州通判坐以修史詆誣道貶監處州酒稅在任兩浙運使胡宗哲觀望羅織劾其敗壞場務始送郴州編管黃魯直罷守當塗寓居荆南作承天院塔記湖北轉運判官陳舉迎合中司趙正夫發其中含謗訕遂編管宜州陳舉者乃宗哲之壻可謂氷淸玉潤也蘇在廷元老東坡先生之從孫自幼即卓然東坡許之元符末入太學東坡巳度海每與其書委曲詳盡宣和中歷館職郎曹奉常言者論其宗元祐學術罷為宫觀而謝表乃云念昔黨人偶同髙祖士大夫頗少之張文老云靖康中蔡元長父子既敗言者攻之發其姦惡不遺餘力蓋其門下士如楊中立孫仲益之類是也李泰發光時為侍御史獨不露章且勸勿為大甚坐是責監汀州酒稅謝表云當垂涕止彎弓之射人以為狂然臨危多下石之徒臣則不敢士大夫多稱之陸務觀云張邦昌僣位國號大楚其坐罪始責昭化軍節度副使潭州安置既抵貶所寓居于郡中天寧寺寺有平楚樓取唐沈傳師目傷平楚虞帝魂之句也朝廷遣殿中侍御史馬伸賜死讀詔畢張徘徊退避不忍自盡執事者趣迫登樓張仰首急覩三字長歎就縊錢秉之元成云趙德夫明誠金石録云唐韋絢著劉公嘉話載武氏諸碑一夕風雨失龜跌之首凡碑上武字皆不存巳而武元衡遇害後來考之武字皆完龜首固自若韋絢之妄明矣而益知小説傳記不足信也明清後見元和姓纂絢乃執誼之子其虛誕有從來也建炎戊申冬髙宗駐蹕維揚時未經兵燼井邑全盛向子固叔堅來赴調于行在所冠蓋闐委偶解后金壇士子郭珣瑜者因與共處于天寧寺佛殿之供卓下一夕夜半忽呼郭覺而語云有一事甚異適夢吾服金紫來領此郡皆荆榛瓦礫之場非復今日入城亦有官吏父老輩相迎皆蕭索可憐公衣緑𫀆于衆客中不可曉也巳而虜人南冦六飛度江城之內外悉遭焚毀後二十年叔堅果握帥符郭登第未久為郡博士迓于郊外始悟前夢相與感歎向荆父云康倬字為章元祐名將識之子少日不拘細行遊京師生計既蕩析遂偶一娼始來即詭其姓名曰李宣德情意既洽婦人者亦戀戀不忍捨為章謂曰吾既無室家汝肯從我南下為偕老之計乎娼大然之槖中所有甚冨分其半以遺姥指天誓日不相棄背買舟出都門沿汴行裁數里相與登岸小酌旗亭伺娼之醉為章解纜亟發娼拗怒戟手於河滸為章弗顧也娼既為其所紿倉黃還家後數年為章再到京師過其門娼母子即呼街卒録之為章略無憚色時李孝壽尹開封威令凛然既至府為章自言平時未嘗至都下無由識此曹恐有貌相肖者願試詢之尹以問娼娼曰宣德郎李某也為章遽云巳即右班殿直康倬也尹曰誠倬也取文書來為章探懷中取吏部告示文字以呈之尹撫案大怒曰信知浩穰之地姦欺之徒何所不有命重杖娼之母子令衆通衢慰勞為章而遣之李尹自以謂益顯神明之政矣為章自此折節讀書易文資有名於丗後來事浸露李尹聞之嘗以語外祖曰僕為京兆而康為章能作此竒事可謂大膽矣與之其子也宏父舅云向宗厚履方建炎末為樞密院計議官履方美髯而若滑稽之狀裹華陽巾纏足極彎長於鈎距同舍王佾公為嘗戲語之曰君唐明皇時四人合而為一何邪向曰願聞之公為曰君狀類黃幡綽頭巾類葉法善腳類楊貴妃心腸似安祿山席間一笑履方不歡後程致道行其祠部貟外郎告詞云汝佩服髙古操履甚恭又以戲之向止叔云宋道方毅叔以醫名天下居南京然不肯赴請病者扶擕以就求脈政和初田登守郡母病危甚呼之不至登怒云使吾母死亦以憂去殺此人不過斥責即遣人禽至廷下荷之云三日之內不痊則吾當誅汝以徇衆毅叔曰容為診之既而曰尚可活處以丹劑遂愈田喜甚云吾一時相困辱然豈可不刷前耻乎用太守之車從妓樂酬以千緡俾群卒負于前增以綵釀導引還其家旬日後田母病復作呼之則全家遁去田母遂殂蓋其疾先巳在膏肓宋姑以良藥緩其死耳程可久云王况字子亨本士人為南京宋毅叔壻毅叔既以醫名擅南北況𥘉傳其學未精薄遊京師甚悽然會鹽法忽變有大賈覩揭示失驚吐舌遂不能復入經旬食不下咽尫羸日甚國醫不能療其家憂懼榜于市曰有治之者當以千萬為謝况利其所售之厚姑往應其求既見賈之狀忽發笑不能制心以謂未易措手也其家人怪而詰之况謬為大言答之曰所笑者輦轂之大如此乃無人治此小疾耳語主人家曰試取針經來况謾檢之偶有穴與其疾似是者况曰爾家當勒狀與我萬一不能活則勿尤我當為若針之可立效主病者不得巳亦從之急針舌之底抽針之際其人若委頓狀頃刻舌遂伸縮如平時矣其家大喜謝之如約又為之延譽自是翕然名動京師既小康始得盡心肘後之書卒有聞於丗事之偶然有如此者况後以醫得幸宣和中為朝請大夫著全生指迷論一書醫者多用之外舅云楊介吉老者泗州人以醫術聞四方有儒生李氏子棄業願娶其女以授其學執子壻禮甚恭吉老盡以精微告之一日有靈壁縣冨家婦有疾遣人邀李生以往李初視脈云腸胃間有所苦邪婦曰腸中痛不可忍而大便從小便中出醫者皆以謂無此證不可治故欲屈君子李曰試為籌之若姑服我之藥三日當有瘳不然非某所知也下小元子數十粒煎黃耆湯下之冨家依其言下膿血數升而愈冨家大喜贈錢五十萬置酒以問之曰始切脈時覺芤脈現於腸部王叔和脈訣云寸芤積血在胸中關內逢芤腸裏癰此癰生腸內所以致然所服者乃雲母膏為丸耳切脈至此可以言醫矣李後以醫科及第至博士李稙元秀即其從子也王憲臣云王稱定觀者元符殿帥恩之子有才學好與元祐故家遊范元實溫潛溪詩眼中亦稱其能詩政和末為殿中監年二十八矣眷東甚渥少年貴仕酒色自娛一日忽宣召入禁中上云朕近得一異人能製丹砂服之可以長生久視煉治經歲而成色如紫金卿為試之定觀欣躍拜命即取服之才下咽覺胸間煩燥之甚俄項煙從口中出急扶歸巳不救既殮之後但聞棺中剝啄之聲莫測所以巳而火出其內頃刻之間遂成烈熖室廬盡焚開封府尹亟來救之延燒數百家方止但得枯骨于餘燼中亦可怪也范子濟云丁廣者明清里中老儒也與祖父為輩行嘗任保州教授郡將武人而通判者戚里子悉多姬侍以酒色沈縱會有道人過郡自言數百歲能煉大丹服之可以飽耆欲而康強無疾然後飛升度丗守二館之以先生之禮事之選日創丹竈依其法煉之四十九日而成神光屬天置酒大合樂相慶然後嘗之廣聞之裁書以獻乞取刀圭以養病身道人者以其骨凡不肯與守二憐之為請僅得半粒廣欣然服之不數日郡將通判皆疽發於背道人宵遁守二相繼告殂廣腰間亦生癤甚皇恐亟飲地漿解之得愈明年考滿改秩歸里中疾復作又用前法稍痊偶覺熱躁因澡身水入創口中不能起金石之毒有如此者併書之于此以為丗誡云秦會之𥘉自虜中還朝泛海至楚州楚守楊揆子才疑以為偽即欲斬之館客管當可者謂揆曰萬一果然朝廷知之匪便不若津遣赴行在真假自辨矣揆於是遣人隂加防間護送至會稽會之既相訪尋當可官其二子揆屏迹天台不敢出者逾二十年會之末年始得劉景以為台州守欲與綦謝二家併治之而會之死髙宗偶記其姓名召用之後為次對纍典名藩斯亦命也毌丘儉貧賤時嘗借文選于交遊間其人有難色發憤異日若貴當板以鏤之遺學者後仕王蜀為宰遂踐其言刋之印行書籍創見於此事載陶嶽五代史輔後唐平蜀明宗命太學博士李鍔書五經倣其製作刋板于國子監監中印書之始今則盛行于天下蜀中為最明清家有鍔書印本五經存焉後題長興二年也明清第三録載秦會之靖康末議狀全篇比見表姪常保孫言嘗聞之于遊定夫之孫九言云乃馬伸先覺之文也初會之為御史中丞虜人議立張邦昌以主中國先覺為監察御史抗言于稠人廣坐中曰吾曹職為爭臣豈可坐視緘默不吐一詞當共入議狀乞存趙氏會之不答少焉屬藁遂就呼臺史連名書之會之既為臺長則當列于首以呈會之會之猶豫先覺帥同僚合辭力請會之不得巳始肯書名先覺遣人疾馳以逹虜酋所以秦氏所藏本猶云檜等也先覺中興初任殿中侍御史以亮直稱于一時為汪黃所擠責監濮州酒稅後髙宗思之以九列召示以大用而先覺巳死會之還自虜中揚言已功盡掠其美名遂取冨貴位極人臣勢冠今古先覺子孫漂泊閩中先覺有甥何珫者慷慨自任得其元藁纍欲上之而馬氏子止之云秦會之凶熖方熾其可犯邪紹興乙亥春珫忽夢先覺衣冠如平生云秦氏將敗趣使往陳之珫即持其藁以叫閽會之大怒誣以他罪下珫大理竄嶺外抵流所未幾而會之果殂其家訟冤詔復珫故官後至貟郎先覺忠績遂别白于時遊與馬鄰墻而居得其詳云秦會之范覺民同在廟堂二公不相咸虜騎初退欲定江西二守臣之罪康倬知臨江軍棄城而走撫州守王仲山以城降仲山會之婦翁也覺民欲寬之會之云不可既巳投拜委質於賊甚麼話不曾説豈可貸邪蓋詆覺民嘗仕偽楚耳秦熺本王㬇之孽子㬇妻鄭氏逹夫之女㬇繇婦家而早逹鄭氏怙勢而妬熺既誕即逐其所生以熺為會之乞子會之任中司虜拘北去夫婦偕行獨留熺于會之夫人伯父王仲薿豐父家豐父子時憍而傲每凌侮之其後會之用其親黨遍躋要途獨時每以參議官處之王浚明云王仲薿字豐父歧公暮子有風采善詞翰四六尤工以名字典郡政和末為中大夫守會稽頗著績效如乾湖為田導水入海是也童貫時方用事貫苦腳氣或云楊梅仁可療是疾豐父裒五十石以獻之才可知矣後擢待制再任不歷貼職徑登次對前後惟豐父一人初歧公為首台元豐末命或云歧公有異議紹聖親政追貶萬安軍司户諸子皆勒停不得入國門奪所賜第以豫王荆公家崇寧初以為臣不忠列黨籍碑至是豐父既有內援而又鄭逹夫歧公之壻相與申理遂洗前誣詔盡復歧公爵諡祐陵又題其墓刻云元豐治定弼亮功成之碑御筆云嘉祐中英宗立為皇子王圭時為學士預聞大議近因其子仲薿以其詔藁來上始得究其本末乃知神考擢置政府厥有攸在協贊事功維持法度十有六年元豐末上自有子發言自圭遂定大䇿安宗廟墜碑未立惻然于懷賜額親筆書題此政和七年二月丙子也豐父謝表有金杯賜第玉篆題碑之對建炎初知袁州虜人冦江西坐失守削籍與馬子約皆寓居永嘉豐父兄仲山同時牧臨川以城降坐廢子約酒酣戲之云平原太守吾兄也後秦會之再入相會之仲山壻也豐父以啓懇之云黃紙除書久無心於夢寐青氊舊物尚有意於陶鎔會之為開陳詔復元官奉祠放行奏薦時豐父寄祿巳為通議大夫不問職名所以諸孫皆奏京秩年八十餘卒有子曉亦能文祖宗以來帥蜀悉雜學士以上方為之李璆西美坐蔡元長黨久擯不用紹興中乃以女適秦會之夫人之弟王曆因而內相昵結起帥瀘南巳而復次對制閫成都自是蜀帥職始殺矣其後曹筠王剛中是也張文老云熙寧三年詔宗室出官從政于外方惟不許入蜀鄭亨仲本秦會之所引自溫州判官不數年登禁近遂以資政殿大學士宣撫川陜亨仲駕馭諸將有理諸將雖外敬而內憚之適亨仲有忤秦之意因相與媒蘖言其有跋扈狀秦聞之謀于王顯道㬇㬇云不若遣一宗室有風力者往制之因薦趙德夫不棄焉於是創四川總領財賦命德夫至坤維得朝公武子止于冷落中辟為幹辦公事俾令采訪亨仲隂事欲加以罪又以德夫子善究為總領司幹辦公事越常制也子止又引亨仲所逐使臣魏彥忠者相與物色其失上聞遂興大獄竄籍亨仲即召德夫為版曹云張文老云廉宣仲布建炎初自其鄉里山陽避冦南來所擕巨萬至臨安寓居吳山之下舍館甫定而郡兵陳通等亂囊橐悉為劫掠一簮不遺夫婦倣徨宣仲昔在京師為學官日與侍晨道士時若愚遊至是聞若愚用事賊間姑往訪之一見甚篤綈𫀆之義且云吾從盜所得寶貨盈屋敗露指日悉録于官矣縱盡以與君無憾然度必不能保今有兩篋以授子可亟去此庶有生理又令二校防護出關而返宣仲夫婦既幸脫厄買舟趨霅川來依外祖空青公空青館置于所泊僧舍宣仲張子能壻也外祖戲曰君真是沒興徐德言矣按堵之後啓篋視之皆黃金也計其所失無毫釐之差宣仲後坐姻黨擯不用藉此得以自存焉宣仲自云靖康初秦會之自銜史丐祠歸建康僦舍以居適當炎暑上元宰張師言昌訪之會之語師言此屋粗可居但每為西日所苦奈何得一涼棚備矣翌日未曉但聞斤斧之聲會之起視之則松棚巳就詢之匠者云縣宇中方創一棚昨日聞侍御之言即輟以成此會之大喜次年會之入為中司北去又數年還朝巳而拜相時師言年逾七十會之於是就官簿中減去十歲擢知楚州把麾持節者又踰十年然後挂冠老于潛晥近九十而終師言詩文甚佳多傳於然李元度云陳彥育序丹楊士子從後湖蘇養直學詩造其三昧向伯恭為浙漕訪養直于隱居彥育適在坐一見喜之邀與之共途益以契合遂以其愛姬冦氏嫁之擕歸逾年伯恭登從班乃啓于思陵云冦氏萊公之元孫其後獨有此一女乞以一官與其夫陳序遂詔特輔和州文學伯恭為自製簮裳靴笏令人賫黃牒往併授之并以白金為餉彥育方教村童于陋巷持書人至彥育疑非其所有至出輔牒見其姓名始拜命望踰意表不勝驚喜閭巷為之改觀其後終于刪定官明清有其詩一秩至今尚存也向止叔云明清壬子歲仕寧國得王俊所首嶽侯狀于其家云左武大夫果州防禦使差充京東東路兵馬鈐轄御前前軍副統制王俊右俊於八月二十二日夜二更以來張太尉使奴厮兒慶童來請俊去説話俊到張太尉衙令虞候報覆請俊入宅在蓮花池東面一亭子上張太尉先與一和尚何澤點著燭對面坐地説話俊到時何澤更不與俊相揖便起向燈影黑處潛去俊於張太尉面前唱喏坐間張太尉不作聲良久問道你早睡也那你睡得著俊道太尉有甚事睡不著張太尉道你不知自家相公得出也俊道相公得出那裏去張太尉道得衢婺州俊道既得衢州則無事也有甚煩惱張太尉道恐有後命俊道有後命如何張太尉道你理會不得我與相公從微相隨朝廷必疑我也朝廷交更翻朝見我去則不必來也俊道向日范將軍𬒳罪朝廷賜死俊與范將軍從微相隨俊元是雄威副都頭轉至正使皆是范將軍兼係右軍統制同提舉一行事務心懷忠義到今朝廷何曽賜罪太尉不須别生疑慮張太尉道更説與你我相公處有人來交我救他俊道如何救他張太尉道我遮人馬動則便是救他也俊道動後甚意似張太尉道這裏將人馬老小盡底移去襄陽府不動只在那駐劄朝廷知必使嶽相公來彈壓撫喻俊道太尉不得動人道若太尉動人馬朝廷必疑嶽相公越𬒳罪也張太尉道你理會不得若朝廷使嶽相公來時便是我救他也若朝廷不肻交相公來時我將人馬分布自據襄陽府俊道諸軍人馬如何起發得張太尉道我虜劫舟船盡裝載步人老小令馬軍便陸路前去俊道且看國家患難之際且更消停張太尉道我待做你安排著待我交你下手做時你便聽我言語俊道恐軍中不伏者多張太尉道誰敢不伏傳選道我不伏俊道傳統制慷慨之人丈夫剛氣必不肯伏張太尉道待有不伏者勦殺俊道這軍馬做甚名目起發張太尉道你問得我是我假做一件朝廷文字教發我須交人不疑俊道太尉去襄陽府後面張相公遣人馬來追襲如何張太尉道必不敢來趕我投他人馬來到這裏時我巳到襄陽府了也俊道且如到襄陽府張相公必不肯休繼續前來收捕如何張太尉道我又何懼俊道若畨人探得知必來夾攻太尉南面有張相公人馬北面有畨人太尉如何處置張太尉冷笑我别有道理待我遮裏兵才動先使人將文字去與畨人萬一支吾不前交畨人發人馬助我俊道諸軍人馬老小數十萬襄陽府糧如何張太尉道這裏糧盡數著船裝載前去郢州也有糧襄陽府也有糧可喫得一年俊道如何這裏數路應副錢糧尚有不前那裏些小糧一年巳後無糧如何張太尉道我那裏一年巳外不别做轉動我那裏不一年交畨人必退我遲則遲動疾則疾動你安排著張太尉又道我如今動後背嵬遊奕伏我不伏俊道不伏底多張太尉道姚觀察背嵬王剛張應李璋伏不伏俊道不知如何明日來我這裏聚廳時你請姚觀察王剛張應李璋云你衙裏喫飯説與我這言語説道張太尉一夜不曽得睡知得相公得出恐有後命今自家悶都出嶽相公門下若諸軍人馬有語言交我怎生置禦我東則東隨他人我又不是都統制朝廷又不曾有文字交我管他悶有事都不能管得至三更後俊歸來本家次日天曉二十三日早衆統制官到張太尉衙前張太尉未坐衙俊叫起姚觀察於教場內亭子西邊坐地姚觀察道有甚事大哥俊道張太尉一夜不曽睡知得相公得出大假煩惱道破言語交俊來問觀察如何姚觀察道既相公不來時張太尉管軍事節都在張太尉也俊問觀察道將來諸軍亂後如何姚觀察道與他彈壓不可交亂恐壞了這軍人馬你做我覆知太尉緩緩地且看國家患難面道罷各散去更不曾説張太尉所言事節俊去見張太尉唱喏張太尉道夜來所言事如何俊道不曾去請王剛等只與姚觀察説話來覆太尉道恐兵亂後不可不彈壓我遊奕一軍鈐束得整齊必不到得生事張太尉道既姚觀察賣弄道他人馬整齊我做得尤穩也你安排著俊便唱喏出來自後不曽説話九月初一日張太尉起發赴樞密院行府俊去辭張太尉道王統制你後面粗重物事轉換了著我去後將來必共這悶一處你收拾等我來叫你重念俊元係東平府雄威第八長行日本府闕糧諸營軍兵呼千等結連俊欲劫東平府作過當時俊食祿本營不敢負於國家又不忍棄老母遂經安撫司告首奉聖旨輔本營副都頭後來繼而金人侵犯中原俊自靖康元年首從軍旅於京城下與金人相敵斬首及俊口內中箭射落二齒奉聖旨特換授成忠郎後來並係立戰功轉至今來官資俊盡節仰報朝廷今來張太尉結連俊起事俊不敢負於國家欲伺候將來赴樞密行府日面詣張相公前告首又恐都統王太尉别有出入張太尉後面别起事背叛臨時力所不及使俊陷於不義俊巳於初七日面覆都統王太尉訖今月初八日納狀告首如有一事一件分毫不實乞依軍法施行乃俊自出官巳來立到戰功所至今來官資即不曽有分毫過犯所有俊應干告勑宣劄在家收附外有告首呼千等輔副尉都頭宣繳申外庶曉俊忠義不曽作過不敢負於國家謹具狀披告伏候指揮次歲明清入朝始得詔獄全案觀之嶽侯之坐死乃以嘗自言與太祖俱以三十歲為節度使以為指斥乘輿情理切害及握兵之日受庚牌不即出師者凡十三次以為抗拒詔命初不究將在軍君命有所不受之義又云嶽雲與張憲書通謀為亂所供雖嘗移緘既不曽逹繼復焚如亦不知其詞云何且與元首狀了無干涉煆錬雖極而不得實情的見誣罔孰所為據而遽皆處極典覽之拂膺儻非後來詔書湔洗追褒則沒地銜冤於無窮所可恨者使當時推鞫酷吏漏網不正刑典耳王俊者初以小兵徒中反告而轉資晚以禆將而妄訐主帥遂叨冨貴駔卒鈐奴一時傾嶮不足比數考其終始之間可謂怪矣首狀雖甚為鄙俚之言然不可更一字也田登知南都一日詞狀忽二人扶一癃老之人至庭下自云平日善為盜某年日某處火燒若干家即某為之假此為姦至於殺人或有獲者皆冤也前後皆百餘所未嘗敗露後來所積既多因而成家遂不復出所扶之人即其孫也今年逾八十自陳於垂死之際欲得後人知之而已登大驚鄂命左右縳之則已殂矣程可久云馬子約純負材自任好面折人人敬長之建炎中吕元直作相子約求郡元直拒之徐云有英州見闕公可往否子約曰領鈞旨待先去為相公蓋一宅子奉候朱新仲云靖康之末二聖北狩四海震動士大夫救死不暇往來賊中洋洋自得者吳幵莫儔二人路人所知也事定皆竄逐嶺外秦會之為小官時幵在禁林嘗封章薦之疏見其文集中稱道再三秦繇此進用後為相遂放二人逐便幵滁人也內自愧怍不敢還里卜居于贑上秦乃以其壻曽端伯慥知虔州國朝以來六曹尚書寄祿今之金紫銀青光祿大夫之官也雖不登二府亦循途而遷國初如竇儀陶穀邢昺後來楊文莊張忠定朝文元孫宣公馬忠肅余襄公元豐官制後易今名如滕章敏王懿敏王懿恪范蜀公之類祐陵時溫萬石孟昌齡王革父子宋喬年盛章詹度皆為金紫銀青光祿大夫極多不止此中興後宋貺益謙洪景盧邁俱宣奉大夫上課陳乞悉柅不行李伯時自畫其所蓄古器為一圗極其精妙舊在上蔡畢少董良史處少董嘗從先人求識于後少董死乃歸秦伯陽熺其後流轉于其壻林子長桷今為王順伯厚之所得真一時之竒物也先人跋語云右古器圗龍眠李伯時所藏因論著自畫以為圗也今藏豫友畢少董家凡先秦古器源流莫先於此軸矣昔孔子刪詩書以堯舜殷周為終始至於繫辭言三皇之道則罔罟耒耨衣裳舟楫所從來者而繼之曰後丗聖人者欲知明道立法制器咸本於古也本朝自歐陽子劉邍父始輯三代鼎彞張而明之曰自古聖賢所以不朽者未必有託於物然固有託於聖賢而取重於人者歐陽子肇此論而龍眠賡續然後渙然大備所謂三代邈矣萬一不存左右採獲幾見全古惟龍眠可以當之也此圗既物之難致者而得之又少董以聞道知經為朝廷識拔則陳聖人之大法指陳根源貫萬古惟一理其將以春秋侍帝傍矣順伯録以見豫靖康之亂省部文字散失不存南渡之後有禮部老吏劉士祥者大為姦利士子之桀黠者相與表裏云某歲曽經省試下合該年免既下部則士祥但云省記到因而僥幸遂獲推恩者不知其數薛叔器云張彥實御諱番易人子公參政大父行有東窗集行於丗自知廣德軍秩滿造朝除著作郎秦會之當軸其兄楚材為袐書少監約彥實觀梅于西湖楚材有詩彥實次其韻云天上新驂寶輅回看花仍趂雪英開折歸忍負金蕉葉笑插新臨玉鏡臺女堞未須翻角調錦囊先喜助詩材少蓬自是調羮手葉底應尋好句來時楚材再婚故及玉鏡臺事會之見之大稱賞曰旦夕當以文字官相處遷擢左史再遷而掌外制楊原仲並居西掖代言多彥實與之潤色初亦無他彥實偶戲成二毫筆絶句云包羞曽借虎皮蒙筆陳仍推兔作鋒未用吹毛強分别即今同受管城封原仲以為誚已大怒訴于會之訹言路彈之彥實以本官罷為宫祠謝表云雖造化之有生有殺本亦何心然臣下之或賞或刑咸其自取屏居數年求休致先除次對帥南昌雖生不及拜命而身後盡得侍從恩數紹興壬戍夏顯仁皇后歸就九重之養伯氏仲信年十八作慈寧殿賦以進云臣聞乾天稱父坤地稱母天地至大必言之以父母者明其尊崇博厚無以加也是以圎首方足皆仰之壽之欲報欲奉無不極盡繇古以來聖人之盛莫過堯舜而孟子以謂堯舜之道孝悌而巳矣恭惟皇帝陛下繼大人之照宜日中之豐體堯邁舜憲古明王以治天下發為號令典誥廟謨宸斷親仁善鄰開物成務者莫不以孝為首臣聞孔子謂曽參曰明王以孝治天下故災害不生禍亂不作仰惟陛下曩者以皇太后扈從未還願見之心致軫宵旰四方兆民延頸指日以冀來音久矣斯焉天人交孚鄰邦修眭櫜弓箙矢息師偃革寰宇之間遂臻安堵恭奉騩駕言歸闕庭凡在動植孰不手舞足蹈翼鼓膺奮遹觀古初敻無前此臣伏以老氏三寶以慈為首乾元之道萬國咸寧洪惟慈寧之殿合為嘉名超軼前丗致安之道繇是以始形勢制作煥乎其有文章儀刑萬邦風化際薄無所不及若堯之光𬒳四表舜之丕冒海隅蒼生者行見于今日甚盛烈也臣生長當丗薰陶漸摩德義之人目覩心欣不能自巳思欲頌良圗協恭式化成規誠開金石感動逺邇以彰聖治莫大之慶而昭述巨美者有日矣輒因殿之名以推原萬一至於辭意淺陋言語膚率不能抉竒摘異以為偉不惟不能亦所不敢也臣謹昧死再拜而作賦焉臣恭惟皇帝之嗣位十六載也海宇澄清四方砥平受上天之眷命紹洪基於大明邇安逺至措刑寢兵人熙熙兮春臺物蕩蕩兮由庚六服承德衆心成城所以復炎德之輝而迓周邦之衡先是騩駕從狩鄰國克享天心咸有一德式遄來歸歡動九域乃命羣工擇基之隆儲祥之勝坼建問安之上宫列辟肅然而赴職百執鎗然而效忠爰即行闕以成厥功於是上髙擬天下蟠法地削甘泉之繁縟屏含元之侈麗揆太極之宸模就坤靈之寶勢乃諏龜筮龜筮協從乃稽萬物萬物無異帝曰欽哉乃彰鴻名慈以覆育於天下寧以鎮服於寰瀛蓋將昭徽音於太姒而表思齊於周京者也有嚴有慿或降或升揆之以日築之登登經始勿亟百堵皆興伎者獻其伎能者精其能否往兮泰來閫決兮垠開倉昊馳耀兮黃祇助培運郢碩之斤斧攻𣏌梓之良材萬杵散雨兮千鑱轉雷離婁督繩兮而公輸削墨夏育治礫兮孟賁掇荄聲隆隆兮伐喬枚勢轞轞兮豁層崖長林巨植兮千年之産而萬年之材輾如闖直如矗兮崔嵬于時山壤獻靈川流效祉陸架水浮風屯雲委輻湊鱗集衡行櫛比以萃於殿之址也於是匠氏經營百藝駢并礪焉而礪硎焉而硎髙下曲折塗墍丹靑此興造之本意而動作之形容也既而四周凌天而岌嶪九門參空而伶俜闕百常兮屋十尋皆􅚃爵兮建瓴儋儋千栭間間旅楹岫綺對砌窗霞翼櫺彤墀洋洋金碧煌煌神鴟展吻而呀文犀厭牖而赫張寶排象拱列星間梁撩桶欒楶黼藻鉛黃玫瑰玳瑁翡翠明璫方疏圎井琑連斗扛枅欀上承柱石下當騰雙猊兮盤礎刻怒兕兮伏相其蟠也顔九淵之虬屈其翥也若千仞之鳯翔或倒文􅃮於衛社或薦孤桐於嶧陽烏㭕橫截緗蘖交相第栲栵與椅檟積楩柵兮豫章蓋天下之竒幹盡羽粲而國欀夫然未足以比其制未足以形其雄轇轕巄嵸飛雲架空出入兮日月吸呼兮雨風開重軒兮纍玉鱗萬瓦兮遊龍髙下髮直左右翼從西八東九金礫珉鎔平寫三山之景坐移羣玉之峰喜泄泄兮樂融融入如遇兮出如逢映斗杓而瞳朧挹天漢兮舂容觀其巨鎮在南長江在東前擁後顧盤錯窪隆占皇圗之奕奕鬱佳氣之蔥蔥天海相際造化溟濛雕題貫膂大艑􅔓艨尋撞戴斗兮航浮索援皆馳驅而致恭采肅慎之楛矢職夷黔之布賨上則天目於潛之山鳯凰南北之巔巉巖嶻嶭窈窕回旋狀羣羽之集麓若萬馬之奔川海門之潮滄溟之淵濠洶奔於勢如朝焉皆足以小崤函而吞涇渭等河雒而隘隴岍夫以此而駐蹕實一制而萬全然而不以為離宫不以為别宇而獨以奉長樂之安而為承顔之所故能逺邁漢唐夸歷三五則雖兼天下之奉極天下之貴亦人所樂而天所與也凡臣所鋪翼而陳之者尚可名言之也非比三吳之盛麗九旗之容衛六宫之深嚴萬物之侈冶不足以隆一人之孝於無窮於是俯而拜仰而重曰當乎法駕言歸宗祏生輝千丈萬騎如指如摩備一時之盛禮慶萬國之洪禧望閶闔兮瑞霏微劐稜兮祥威蕤馭嚴嚴之玉輦建之朱旗華蓋效杠天驥驂非增日星之光明闐老幼之提擕千官之班兮鴛鷺兆民之欣兮嬰慕喜􅋏動於堪輿澤周流於道路樂極者或至於抃躍感深者爭先於馳騖沈漻晏然兮屏翳收風靉靆不興兮豐隆霽怒雙閎敞兮如升萬室昂兮如訴若乃萬壽誕日之辰一人會朝之際濟濟峨峨羣臣在位皆輔皋而弼夔過房杜兮丙魏奉玉巵兮瓊甓展采儀兮文陛皇帝躬蹈事親之美以獨髙于萬丗進退禮樂抑崇下貴隆帝業兮億載歡祝聖人兮千萬歲然後敷兹睿化遍于中下尊卑模範兮盈里閭膏澤滲漉兮盛王霸工在衢士在朝而農在野百度修明萬幾間暇無有遐遺睦如姻婭四海安若覆盂九有基如太華於是有客相謂曰子聞今日之盛事歟曰然嘻為堯舜神人以和運紹五帝獄訟謳歌但無為而巳矣於致養以云何豈若我皇躬勤儉之資恢隆平之時約已以奉太母之訓致美以化羣黎之為端一心而應感斥衆異之盱睢煥爛方册照溢書詩哉且客聞歷代之制乎土階之卑不免乎儉固雕椽之飾不免乎驕奢魯夸靈光而但述土木之巧魏稱景福而徒為制作之華俱遊觀之是云奚文辭之足誇又豈若我皇綏定邦家以成孝道允邵羲媧哉且上棟下宇聖人所取也至德要道聖人之孝也作可楚室能修泮宫諸侯之功也與其論諸侯曷若言聖道與其言雄壯曷若言聖德明明我宋得天下之統蒸哉祖宗膺器之重殆二百年休聲無壅下之所奉者惟君上之所承者惟親當君享九重之實而親安萬乘之尊蓋匹夫之孝曽閔所難不足以言惟據域中之大饗天下之養然後為重也巳析而合既失而得然後為喜之至也曠古所無一旦在已漢唐所恨自我而得凡是數者兼而有之不特為四方之賀又將為萬丗之光寵也今是殿也不奢不陋不髙不卑合禮之界與天下齊以是為固鞏於鼎龜以是為寶保若山溪雖廣八荒而為城開溟渤而為池倚圎天而為蓋立棟梁於四維亦奚有宜乎於是再拜而歌曰蒼蒼髙旻覆下民兮與物為春澤無垠兮一人孝至通帝意兮金石可開不可移兮上下合契定大議兮法駕六騩言還歸兮勑以慈寧為殿名兮厥功告成百室盈兮居之克安若石磐兮四方瞻觀化益寬兮天人合應助其證兮光啓中興祖武繩兮紹復大運法堯舜兮旋澤曲軫翕然順兮孝道克全鑒上天兮壽祿萬年其永延兮聖人孝兮感人深責成賢輔兮雋功克忱廣殿軒軒兮巨厦深沉晨昏之養兮萬乘親臨財豐俗阜兮寫于薰琴百姓克愛兮諸侯克欽亘萬國兮得其歡心宫殿之制巳陳之矣天子之孝既備述矣四方之心見於斯矣口軟字碎其言卑矣欲昭聖孝永無極矣日月為字天為卑矣許顗彥周跋云王仲信此賦如河決泉涌沛乎莫之能禦也天資辭源之壯蓋未之見昔柳柳州云辨如孟軻淵如莊周壯如李斯明如賈誼哀如屈原專如揚雄柳州論之古人以一字到今不可移易願吾仲信兼用六語而加意於莊屈當與古人並驅而爭先矣伯氏天才既髙輔以承家之學經術文章超邁今古真草篆􅊢沈著痛快天文地理星官曆翁之所歎伏肘後卜筮三乘九流無不玄解丹青之妙模寫煙雲落筆人藏以為寶奏賦之時與范志能成大詔俱赴南宫其後志能登第名位震耀而伯父坎壈以終興言流涕如音人二老歸西伯賦云一為尚父一為餓者雖升沈之不同其趣一也蔡元長元符末間居錢塘無憀中春時往霅川遊郊外慈感寺寺僧新建一堂頗偉勝元長即拈筆題云超覽堂適有一客在坐自云能相字起賀云以字占之走召入見而臣字旁觀如月四字居中當在初夏巳而果然蔡元度娶荆公之女封福國夫人止一子子因仍是也談天者多言其壽命不永元度夫婦憂之一日盡呼術者之有名如林開之徒集于家相與決其疑云當止三十五歲元度顧其室云吾夫婦老矣可以放心豈復見此逆境邪其後子因至乾道中壽八十而終然其初以恩幸為徽猷閣學士靖康初既蔡氏敗例遭削奪恰年三十五蓋其祿盡之歲繇是而知五行亦不可不信也大觀丁亥家祖守九江夜登庾樓逺望大江中燈熖明滅坐客以為漁火家祖曰不然是必為姦者遣吏往捕之頃刻而至乃舟中盜鑄錢其模如火甲狀每出爐則就水中蘸而取之焉宣政中有兩地早從王荆公學以經術自任全乏文采自建業移帥維楊臨發作長短句題于賞心亭云為愛金陵佳麗乃分符來此擁麾忽又向淮東便咫尺人千里畫鼓一聲催起邦內人齊跪江山有興我重來斟别酒休辭淚官中以碧紗籠之後有輕薄子過其下刮去有字改作沒字我字易作你字往來觀之莫不啓齒唐牛竒章玄怪録載蕭至忠欲出獵羣獸求哀于山神云當令巽二起風滕六致雨翌日風雨蕭不復出郊建炎中金冦駐楚泗間時張韓擁兵于髙郵虜誓于衆整師大入二將自料非其敵深以為怯將欲交鋒之際風雨大作虜衆辟易散走損折甚多因遂奏凱范師厚直方滑稽之雄也為參贊軍事笑云焉知張七韓五乃得巽二滕六力邪聞者為之閧堂鄭德象滋晚守京口怠於為政湯致逺鵬舉為兩浙漕宣言俟應辦虜使至郡按治之時秦會之當國德象求援于秦蓋宣和初秦赴試南宫鄭為參詳官其所取也至是湯别秦以行秦云鄭德象久不通問有少書信煩為提携逹因面授之湯視緘題云稟目申呈判府顯學侍郎先生門下具位秦檜謹封湯得之幡然而改乃奏其治狀遂移帥江東靖康間戎務方殷有士子賈元孫者多遊大將之門談兵騁辨顧揖不暇自稱賈機宜時有甄陶者奔走公卿之前以善幹事大夫多使令之號甄保義空青先生嘗戲以為對云甄保義非真保義賈機宜是假機宜翟公巽每誦之于廣坐以為笑談元孫建炎龍飛為特奏名第一人明清紹興壬午從外舅帥合肥郡治前有四豐碑屹然有樓基在焉上云唐崔相國德政碑李華文張從申書天寶中所立也詞翰俱妙念欲摹打是時大兵後工匠皆逃避未歸巳而明清持牧貢造朝私念復來必須償此志繼而外舅易鎮京口後十年明清赴壽春幕道出于彼始再往訪之則不復存詢之云前歲武帥郭振者取以砌城矣大以悵然悍卒無知亦何足責付之一歎明清去夏掃松山隂郡齋中見王成之信所刋其寶藏顔魯公墨帖自題其後極為夸大固巳訝其字畫不工及觀其後有云楊徽之蘇易簡張洎錢易同觀于玉堂之署尤為可疑遂亟取玉堂題名及史册諸傳考之楊文莊初未嘗入翰苑雖蘇太簡自雍熙六年至淳化五年出入禁林十年而錢希白以天聖四年方掌內制距大簡之在院相去凡隔四十五年希白卒年五十五是時方為兒童何緣而同造金坡邪今春髙郵守張仲思頠寄以其家藏秦少遊所臨蘭亭刻置黃堂墨本見遺後少遊題云元豐二年八月書時年五十九案少遊本傳及志銘云以建中靖國元年卒年五十三而龍井題名元豐五年三十六則又焉得元豐二年年五十九乎二物皆贋甚明繇是而知凡入石跋識不可不審也紹興甲子歲衢婺大水今首台余處恭未十歲與里人共處一閣凡數十輩在焉閣𬒳漂幾沈空中有聲云余端禮在內當為宰相可令愛護之少選一物如黿鼉其長十數丈來負其閣逹于平地一閣之人皆得無它又三衢境內地名張步溪中有石里人號曰團石有讖語云團石圜出狀元團石仰出宰相乙丑歲水涸石忽如圜鏡明年劉文孺章魁天下前歲大水石乃側仰而去年余拜相此與閩中沙合南臺蓋相似也沈信叔諶云易貴多識前言往行詩貴多識鳥獸草木之名至於多聞見則欲守約而守卓寡聞見則曰無約而無卓古人有取乎博洽者於此可見誠以寡陋之為吾病不淺也范武之問殽蒸籍談之忘司典可以鑒矣記禮有云學然後知不足教然後知困知不足然後能自反也知困然後能自強也丗之旁搜廣採貪多務得者其亦以自反自強者有以加力於其先故其知識聞見之多日以博洽自然人鮮得而企及雪溪先生秉太史筆諸子仲信仲言史學得之家傳惟父子志趣髙逺學問器識率加於人一等故所以自期者敻然與衆不同雖經史子集傳記與夫九流百家道釋之書皆巳饜飫方且以為未足而又求所未聞訪所未見常有歉然不滿之意兹泰華所以不得不髙溟渤所以不得不深也歟不譾自幼服膺雪溪先生之名恨不得摳衣趨隅在弟子列所幸得從仲信仲言遊仲信寓越之蕭寺不譾以敝廬密邇時一相過未嘗不劇談終日有輔於茅塞為多仲言後居甥館于嘉禾每興契闊之歎仲信著京都歲時記廣古今同姓名録留心內典作輔定水陸章句洞曉天文作新乾曜真形圗此皆平昔幸得以窺一斑者不寧惟是其發為稗官小説尤不碌碌仲言著投轄録清林詩話玉照新志揮麈録昆季之所作類皆出人意表且學士大夫之所欲知者益信夫父子之博洽雖名卿巨公無不欽服敬慕蓋有自來遂初尤丈一時之鴻儒也淹貫古今罕見其比一日詢仲言以天臨殿與南唐中主畫像仲言詳陳本末無一不符遂𥘉驚愕歎仰以為丗不多得至形諸公送行泰倅詩擬欲告于上收置史館不果仲言又嘗剴切上封事不譾因不自揆以拙句殿諸公後有云信史賖青簡封章窒皂囊者以此揮麈所録尤仲言平日之用功深者三復以觀非志不分力不衰加之歉然不滿者朝夕于懷未易得此是不可以無傳也前録先巳刋行後録餘話不譾備數昭武日仲言移書見委顧淺見寡聞亦欲以其素所未知者期天下之共知是以喜而承命因浼龍山張君得以繼之若夫博洽如仲言父子者則勿以見誚可也慶元庚申秋七月既望昭武假守浚儀趙不譾師厚父揮麈餘話卷之二終
