front:
  text: 揮麈後録卷之五七九汝隂王明清謚以節惠孟子謂名之幽厲孝子慈孫百丗不能易
  hash: sha256:a091629294e40af16af6c5945ff439ff136baa588428dc0af88ae3baa5a3ae49
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_010-1a}
body:
  text: 三代以來君臣務取羙稱遂至失實國朝諸謚宋常山退朝録備載之止於熈寧三年明清謹續之于後然聞見未廣姑存所記憶遺落尚多當嗣益之后謚慈聖光獻宣仁聖烈昭慈聖獻昭懷欽聖獻肅欽成欽慈顯恭顯肅顯仁明節憲節憲聖慈烈成穆成恭妃謚昭靜沈貴妃明逹懿文後追冊爲明逹皇后明節和文後追冊爲明節皇后靖淑王賢妃太子謚冲憲茂元懿敷荘文愭諸王謚端獻呉王顥端懿益王頵冲僖檉悼敏楫冲穆材哀獻俊冲厚僴惠价冲惠倜公主謚賢惠蜀國公主王晉卿室賢穆韓嘉彦室賢德懿行王師約室賢穆明懿錢景臻室賢惠張端礼室賢静柔志公主淑和端福公主冲懿賢福公主悼穆徽福公主順穆介福公主宗室謚恭憲丗雄恭孝宣旦仲湜士緘克寛榮穆宗暉僖簡宗景康孝仲御僖靖承𥙿僖安仲汾恭僖宗博僖穆宗墣和恭承顯康僖克戒勤孝宗惠敦和克和僖惠宗隱宗勉修安克敦孝靖宗綽簡獻仲忽安憲宗悌士孝恪仲芮敦恪仲操良僖仲嬰丗恩叔嶠孝僖宗衮仲癸僖惠仲隗榮思宗諤孝良仲辠令蘧修簡仲萉和僖仲防欽修仲碩犖孝仲嗟仲革孝穆丗瓞惠孝仲佺孝修丗獎令穆孝恪丗膺全稼安恪仲玘孝簡丗輝順思仲􅍀孝恪仲摻孝恭丗恪丗恬敦孝仲越孝敦仲僕恭惠叔純僖仲麗惠和檢之忠孝丗表叔武叔充榮惠丗設良恪克章叔珫令􅗕安良丗括容孝叔亞惠恭丗采榮恪叔雅叔黔恭冝丗鳴榮敏叔縱良恭丗亨良憲叔敖益丗逢孝敏士夽思𥙿叔安莊靖叔苗莊節叔炤温獻令圖良𥙿士空忠敏令穣孝榮令鐸良懿令珤安惠丗顒安僖秀王温靖士棧恭靖士㒟不㣲士樽襄靖令懬文獻今祉忠靖士珸康宗且宰相謚宣靖曾魯公公亮忠獻韓魏王琦文忠冨韓公弼張天斍啇英忠烈文潞公彦博正獻吕申公公著忠肅劉同老摯虞并武允文正愍吕汲公大防忠宣范堯夫紀仁忠懷蔡持正確文恭王禹玉珪正憲呉冲卿充莊敏韓玉汝縝文定韓儀公忠彦文王荆公安石獻肅陳秀公升之文憲劉德初正夫何清源執中文正司馬温公鄭逹夫居中清憲趙正夫挺之文肅曽魯公布忠穆呂成公頥浩文和李士美邦彦忠定李伯紀綱汪廷俊彦伯文恭陳魯公康伯正獻陳福公俊卿文惠洪景伯适史直翁浩文靖梁叔于克家文忠京丞相鏜執政謚文憲蘇公易簡文定張太保方平許公將文忠歐陽太師脩清獻趙少保抃康靖趙叔平槩章簡元厚蘇黄門轍之絳張于公夀簡翼張公璪脩簡胡公宗愈莊定王正仲存恭敏蒲傳正宗孟定簡温虞弼益忠定孫傳忠穆郭公逵張公懿安簡邵公亢襄敏王公韶康懿何中正康節張公昇忠肅陳公過庭文敏吕吉父惠卿李漢老邴恭愍聶昌恭敏薜公向獻簡傅公堯俞敏肅蔡公挺懿簡趙天觀瞻温靖孫公固莊敏章公楶文節林子中希文簡張康國鄧洵武文正蔡元度卞忠憲种公師道忠肅劉立道大中忠文張嵆仲叔夜李彦頴文懿管歸善師仁安惠鄧聖求温伯忠武韓蘄王丗忠忠烈張循王俊忠獻胡成公丗將敏肅魏道弼良臣武穆岳公飛敏節王子尚庻章簡張彦程元籲正綱克俊忠敏沈必克與求莊定劉共父珙莊簡李泰發光簡穆辛李次膺簡恵周敦義葵莊敏汪明逺徹文安洪景嚴遵安簡王公剛中榮敏謝開之廓然愍節王正道倫文臣謚文穆范成大忠文范蜀公鎮宋尹喬年文恪王中丞陶章敏滕元發甫懿恪王宣徽拱辰文憲強翰林淵明洪尚書擬文簡蔡鯈程大昌宣簡李浦邦彦父忠愍徐給事禧李侍郎若水忠憲耿傳忠毅向子韶忠簡張克戬趙令幾胡邦衡銓張大猷阐忠顯劉公韐文昭曾翰林肇莊節王復恭愍錢歸善唐重定愍胡唐老威愍鄭驟宗汝霖澤剛愍曽逢原孝序文靖楊侍郎時文定胡待制安囯忠襄楊邦乂勇節郭永莊敏藺中謹韓彦直子温林栗黃中忠壯章且叟誼康節邵先生雍節孝徐仲車積忠定劉元城安丗文康葛銀青勝仲忠惠蔡君謨㐮文忠東坡先生忠宣洪光弼皓獻簡陳邦彦良翰獻肅胡周伯沂張大經彦文康肅呉明可芾文清曽吉父幾忠肅陳瑩中􅗕傳公晦察忠介王子飛雲清敏豊相之稷清孝葛君書思僖敏張如瑩澄賢節王庠忠鄒志完浩忠確張公克戩僖簡莊公徽肅愍宇文虚中節肅龔彦和夬文惠韓公粹彦文僖姚祐壽祖忠敏任德翁伯雨惠懿楊子寛偰武臣謚忠愍髙永年武莊郝質武恪賈逵忠敏姚麟武愍劉法忠節李彦仙忠壯徐徽言李邈馬彦博穆武髙継勲恭勇楊惟忠勤惠王德恭勤毅宋守約康理楊應詢康簡髙敦復威肅劉仲武勇節郭永榮穆陳守貴犖毅張緼榮安王說端節韓嘉彦僖靖鄭紳恭榮鄭翼之恭簡邢煥安毅郭崇乂忠節髙丗則犖懷髙公玘忠定曹誘恭靖韓同卿端靖郭師禹内臣謚忠靖劉有方忠良賈詳忠簡劉瑗僖儉張茂則忠愍李舜舉僖敏宋用臣忠敏李憲安恪盧守勤忠憲梁和榮恪郝隨恭僖王中正恭敏裴詵恭節馮丗寕勤惠王仲榮節康履大中祥符間章聖祀汾隂至泰山下聚觀者幾數八十萬人闐擁道路警蹕不能進上以詢左右或云村民所畏者尉曹也俾彈壓之即命亟召之少焉一緑衣少年躍馬疾馳而前羣氓大呼官人來矣八一奔走辟易而散上笑云我不是官人邪王嵎季夷云樊若水夜釣采石丗多知之宋咸笑談録云李煜有國日樊若水與江氏子共謀江年少而黠時李主重佛法即削髪投法眼禪師爲弟子隨逐出入禁苑因遂得幸佛眼示寂代其住持建康清凉寺號曰小長老眷渥無間凢國中虚實盡得之先令若水走闕下獻下江南之䇿江爲内應其後李主旣俘各命以官江後累典名州家于安陸子孫亦無聞鄭毅夫爲江氏書目記載文集中云舊藏江氏書數百卷缺落不甚完予凢三歸安陸大爲捜訪殘秩墜編徃徃得之閭巷間無遺矣僅獲五百十卷通舊藏凢千一百卷江氏遺書具此矣江氏名正字元叔江南人太祖時同樊若水獻䇿取李氏仕至比部郎中甞爲越州刺史越有錢氏時書正借本謄冩遂并其本有之及破江南又得其逸書兼呉越所得殆數萬卷老爲安陸刺史遂家焉盡輦其書築室貯之正旣殁子孫不能守悉散落於民間火燔水溺鼠虫齧弃并奴僕盗去市人裂之以籍物有張氏者所購最多其貧乃用以爲㸑凡一篋書爲一炊飯江氏書至此窮矣然余家之所有幸而僅存者蓋自吾祖田曹始畜之至予三世矣於余則固能保有之於其後則非余所知也然物亦有數或存或亡安知異日終不亡哉故記盛衰之迹㑭子孫知其所自則庻乎或有能保之者矣書多用油拳𥿄方冊如笏頭青縑爲褾字體工拙不一史記晉書或爲行書筆墨尤勁其末用越州觀察使印亦有江氏所題余在杭州命善書者𥙷其缺未具也明清案馬令作南唐書及龍衮作江南野史云北朝聞李後主崇奉釋氏隂選少年有經業口辯者往化之謂之一佛出丗号爲小長老朝夕與論六根四諦天堂地獄循環果報又說令廣施𣑽刹營造塔像身𬒳紅羅銷金三事後主因讓其太奢乃曰陛下不讀華嚴經争知佛冨貴自是襟懷縱恍兵機守禦之謀慌然而弛帑廪漸虚財用且竭又使後主於牛頭山大起蘭若千間聚徒千衆旦暮設齋食無非異方珍饌一日食之不盡明旦再具謂之折倒時議謂折倒爲煜之䜟及大兵至獲爲營署北朝又俾僧於采石磯下卓庵自云少而草衣木食後主遣使賫供獻以往佯爲不受乃隂作通穴及累石爲塔闊數圍髙迫數丈而夜量水靣及王師尅池州而浮梁遂至繫于塔穴以渡南北不差毫釐師徒合圍召小長老議其拒守對曰臣僧當揖退之於是登城大呼而旨麾兵乃小却後主喜令僧俗兵士誦救苦觀音菩薩满城沸湧未幾四靣矢石雨下士民傷死者衆後主復使呼之託疾不起及誅皇甫繼勲之後方疑無驗乃鴆而殺之觀宋鄭所記則知李氏國破之際所鴆者非真又以計免而歸八二本朝遂饕岳牧之任也三朝史孟昶傳云其在蜀日改元廣政周丗宗旣取秦鳳昶懼致書丗宗自稱大蜀皇帝丗宗怒其抗禮不荅其書真迹今藏樓大防所用録于左七月一日大蜀皇帝謹致書于大周皇帝閤下竊念自承先訓恭守舊邦匪敢荒寧于兹二紀頃者晉朝覆㓕何建来歸不因背水之戰爭遂有仇池之土地泊審遼君歸北中國且空暫興敝邑之師更復武都之境下闕數字實爲下國之邊陲其後漢主徑自并汾來都汴浚聞征車之未息㝷神器之有歸伏審貴朝先皇帝應天順人繼統即位奉玉帛而未克承弓劒之空遺但傷嘉運之難諧適歎新懽之且隔以至前載忽勞睿德逺舉全師土疆㝷隷於大朝將卒亦拘於貴國幸蒙皇帝惠其首領頒以衣裘偏禆盡捕其職貟士伍徧加於粮賜則在彼無殊於在此敝都寧比於雄都方懷全活之恩非有放還之望今則指揮使蕭知逺馮從讜等押領將士子弟共計八百九十三人巳到當國具審皇帝􅒯開仁愍深念支離厚給衣裝兼加巾屨給㳂程之驛料散逐分之緡錢仍以貟僚之迴還安知所報此則皇帝念疆埸則巳經革幾代舉干戈則不在盛朝特軫優容曲全情好永懷厚義常貯㣲衷載念前在鳯州支敵虎旅偶於行陣曾有拘擒其排陣使胡立巳下㝷在諸州安排及令軍幕収管自來各支廪食並給衣裝却縁比者不測宸襟未敢放還郷國今旣先蒙開釋巳認冲融歸朝雖愧於後時報德未稽於此日其胡立巳下今各給鞍馬衣裝錢帛等專差御衣庫使李彦昭部領送至貴境望垂宣旨収管矧以昶昔在齠齓即離并都亦承皇帝鳳起晉陽龍興汾水合叙郷関之分以陳玉帛之懽儻蒙惠以嘉音即佇專馳信使謹因胡立行次聊陳感謝詞莫披述伏惟仁明洞垂鍳念不宣明清甞䟦其後云歐陽文忠公五代史丗家序云蜀嶮而冨故其典章粲然此書文亦竒尤先生所謂豈非岀於丗修降表李昊斯言信歟頃歲姚令威注五代史惜乎不見是卷也國朝以來父子兄弟叔姪以名望顯著薦紳間稱之八三於一時者如二吕正獻端左丞餘慶二竇可象儀望之儼二孫次公何鄰幾僅二宋元憲庠景文祁二錢子髙彦逺子飛明逸二蘇才翁舜元子美舜欽二呉正肅育正憲充二程眀道先生顥伊川先生頥二章莊敏楶申公悙二張横渠先生載天祺戩二邵安簡亢不疑必二蔡元長京元度卞二鄭德夫乆中逹夫居中二鄧子能洵仁子常洵武三陳文忠堯叟文惠堯佐康肅堯咨三蘇文安先生洵文忠軾文定轍三沈存中括文通溝睿逹遼三王荆公安石平父安國和父安札三孔經父文仲常甫武仲毅甫平仲三曾南豐先生鞏文肅布文昭肇三韓康肅絳持國維莊敏縝三范蜀公鎮子功百禄淳夫相禹三劉邍父敞贛父攽仲馮奉丗八四是也太宗實録淳化五年五月李順之平帶御器械張舜卿奏事言臣聞順巳遁去諸將所獲非也太宗云平賊纔數日汝何從知之徒欲害人功爾上怒叱出將斬之徐曰前代帝王暴怒殺人正爲此軰然其父戍邊以死遂貰之但罷近職舜卿父訓爲定逺軍節度使卒於鎮故上念之明清後觀沈存中筆談云蜀中劇賊李順䧟劒南兩川関右震動朝廷以爲憂後王師破賊梟李順収復兩川書功行賞了無間言至景祐中有人告李順尚在廣州廵檢使臣陳文璉捕得之乃真李順也年巳七十餘推驗明白囚赴闕覆按皆實朝廷以平蜀將士功賞巳行不欲暴其事但斬順賞文璉二官仍除閤門祗候文璉家有李順案𣢾本末甚詳順本蜀江王小波之妻弟始王小波反於蜀中不能撫其徒衆乃共推順爲主順初起悉召郷里冨人大姓令具其家所有財粟據其生齒足用之外一切調發大賑貧乏録用材能存撫良善号令嚴明所至一無所犯時兩蜀大饑旬日之間歸之者數萬人所向州縣開門延納傳檄所至無復完壘及敗人常懷之故順得脫去三十餘年乃始就戮如此則當平蜀時逃去無可疑矣信知盗亦有道焉然舜卿非太宗之全宥則刑歸於濫矣頃見王仁𥙿洛城漫録云張全義爲西京留守識黃巢于羣僧中而陶榖五代亂紀云巢旣遁免祝髪爲浮屠有詩云三十年前草上飛鐵衣着盡着僧衣天津橋上無人問獨倚危欄看落暉又僧史言巢有塔在西京龍門號翠㣲禪師而丗傳巢後住雪竇所謂雪竇襌師即巢也然明州雪竇山有黃巢墓歳時邑官遣人祀之至今而太平廣記載則天時宋之問謫官過杭州遇駱賔王于靈隱寺披緇在大衆中與之問詩有樓觀滄海日門枕浙江朝之句唐夷堅集言南嶽寺僧見姚泓五季泛聞録云太祖仕周受命北伐以杜太后而下寄于封禪寺抵陳橋推戴韓通聞亂亟走寺中訪㝷欲加害焉主僧守能者以身蔽之遂免太祖德之即位後極眷寵之年八十餘臨終語其弟子曰吾即澤州明馬兒也馬兒五代之巨㓂也賛寧續傳載云開寳末江州圎通寺旦過竂中有客僧將寂㓕袒其背以示其徒有彫青李重進三字云我即其人脫身煙熖至于今日而近日陸務觀清尊録言老内侍見林靈素于蜀道季次仲季自云甞遇姚平仲于廬山授其八段錦之術未知果否要是桀黠之徒多能迯命於一時皆此類文璉洪進八五之子也真宗實録召試神童蔡伯俙授官之後寂無所傳明清因於故書中得其奏狀一紙今録于此司農少卿管勾江州太平觀蔡伯俙奏臣輒陳愚懇仰瀆睿聦退省愆尤甘俟竄殛臣見係知州資任乞管勾宫觀奉勑授前件差遣於舒州居住自熈寧八年八月三日到任伏念臣先於太中祥符八年真宗皇帝遣内臣毛昌逹宣召賜對試誦真宗皇帝御製歌詩即日蒙恩釋褐授守祕書省正字臣遭遇之年方始三歳及賜臣御詩云七閩山水多才俊三歳竒童岀盛時終篇後批閠六月十五日勑賜見刋刻在本家収祕續蒙宣赴東宫侍仁宗皇帝讀書朝夕親近頗歷歳年以臣父龜從進士及第臣幼小難以住京因乞將帶岀外又蒙恩賚優渥其後臣年一十七歳以家貧陳乞差遣仁宗皇帝聖念矜怜特依所乞仍有旨餘人不得援例自兹累歷任使今來本任至來年二月當满切念臣幼稚幸會效官從事勉勵愚拙今巳白首重念臣生事蕭條累族重大又無得力兒男可以供侍一日捨禄無以爲生幸遇皇帝陛下至仁至治無一物失所其於老者惠䘏尤深臣以祥符八年三歳甲子庚申節未至衰老欲望聖慈特賜許臣再任管勾江州太平觀一任覬仍廪稍得飬單貧祗飭閨門相傳忠孝庻幾𥙷報以盡餘齡候勑旨蓋元豊初計其年尚未七十司農少卿今之朝議大夫也碌碌無所聞豈非聦明不及於前時邪御詩明清偶記其全篇七閩山水多才俊三歲竒童出盛時家丗應傳清白訓嬰兒自得老成姿初當移歩來朝謁方及能言便誦詩更勵孜孜圖進益青雲千里看前期後閱朱興仲續歸田録云伯俙字景蕃與晏元獻俱五六歳以神童侍仁宗於東宫元獻自初梗介蔡最柔媚毎太子過門䦨髙者蔡伏地令太子履其背而登旣踐祚元獻被知遇至宰相蔡竟不大用以舊恩常領郡頗不循法令或被劾取旨上識其姓名必曰藩邸舊臣且令轉官凢更四朝元符初致仕巳八十歳矣監司薦之乞落致仕與宫祠其辤略云蔡伯俙年八十歳食禄七十五年余謂人生名位固可得八六罕得綿長如此者以上朱録中語囙併載之張耆旣貴顯甞啓章聖欲私第置酒以邀禁從諸公上許之旣晝集盡驩曰更願畢今夕之樂幸母辤也於是羅幃翠幕稠疊圍繞繼之以燭列屋蛾眉極其殷勤豪侈不可狀每數桮則賔主各少愒如是者凢三數諸公但訝夜漏如是之永曁至徹八七席岀户詢之則云巳再晝夜矣朱新仲言韓忠憲億景祐中叅仁宗政事天下稱爲長者四子仲文綜子華絳持國維玉汝縝俱禮部奏名忠憲啓上曰臣子叨陛下科第雖非有司觀望然臣旣備位政府豈當受而有之天下將以謂由臣故致此臣雖不足道使聖明之政人或以議之非臣所安也臣教子旣巳有成又何必昭示四方以爲榮觀哉乞盡免殿試唱第幸甚誠懇再三上嘉歎而允所請忠憲旣薨仲文子華玉汝相繼再中科甲獨持國曰吾前巳奏名矣當遵家君之言何必布之逺方耶不復更就有司之求故文潞薦持國䟽云曾預南宫髙薦從不出仕宦其後子文知制誥子華玉汝皆登宰席持國賜出身至門下侍郎爲本朝之甲族云玉隆外祖云韓元吉著桐隂舊話却不及此揮麈後録卷之五
