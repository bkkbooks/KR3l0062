front:
  text: 永昌陵卜吉命司天監苗昌裔往相地西洛既覆土昌
  hash: sha256:5e6bdf97a92a8ef47b32c8612a17091edb31b6ec4117d930679c4d861afb3bfe
body:
  text: 裔引董役内侍王繼恩登山巔周覽形勢謂繼恩云太祖之後當再有天下繼恩黙識之太宗大漸繼恩乃與參知政事李昌齡樞密趙鎔知制告胡旦布衣潘閬謀立太祖之孫惟吉適洩其機吕正惠時為上宰鎖繼恩而迎真宗於南衙即帝位繼恩等尋悉誅竄前人已嘗記之熙寧中昌齡之孫逢登進士第以能賦擅名一時吳伯固編三元衡鑑祭九河合為一者是也逢素聞其家語與方士李士寧毉官劉育熒惑宗室世居共謀不軌旋皆敗死詳見國史靖康末趙子崧守陳州子崧先在邸中剽竊此說至是適天下大亂二聖北狩與門人傅亮等㰱血為盟以倖非常傳檄有云藝祖造邦千齡而符景運皇天佑宋六葉而生眇躬繼知髙宗已濟大河皇懼歸命遣其妻弟陳良翰奉表勸進髙宗羅致元帥幕中興後亟欲大用㑹與大將辛道宗爭功道宗得其文繳進之詔置獄京口究治得情髙宗震怒然不欲暴其事以它罪竄子崧於嶺外此與夏賀良赤精子之言劉歆易名以應符䜟何以異哉豈知接千秋之統帝王自有真邪熙寧初王荆公力薦常夷父乞以种放之禮召之上云放輩詩酒自娛而已豈有經世之才如常秩肯來朕當以非常之禮待之故制詞云幡然斯來副朕虚佇蓋宣德音也靖康初李伯紀薦任申先世初自布衣錫對欽宗忽問云卿在前朝曾上書乞取燕雲世初云誠有之臣是時為見遼國衰弱謂我若訓練甲兵遲以歲月乘此機㑹可以盡復燕雲舊地初非欲結小羌擣其巢穴此書尚在可賜睿覽上云曾見之使如卿言燕雲之地何患不得繼以歎息即批出賜進士出身自是進用世初伯雨之子也髙宗應天中興之初大臣有薦瀘州草澤彭知一者有康濟之略隱居鳯翔府得㫖令守臣錢蓋等津發至行在所既入朝迺以所燒金及藥術為獻詔云朕不忍燒假物以誤後人仰三省發遣赴元來去處日下施行仍將燒金合用什物於街市搥毁建炎己酉以葉夢得少緼為左丞纔十四日而為言者所攻而罷其自記奏對聖語備列於後一日進呈知婺州蘇遲奏乞減年額上供羅聖訓問祖宗額幾何臣等對皇祐編勅一萬匹問今數幾何臣等指蘇遲奏言平羅婺羅花羅三等共五萬八千七百九十七疋聖訓驚曰苦哉民何以堪臣等奏建炎赦書諸崇寧以後增添上供過數非祖宗舊制自合盡罷今遲奏乞減一半聖訓曰與盡依皇祐法臣等奏今用度祖宗時不同却恐減太多用度不足即不免再抛買或致失信欲且與減二萬疋并八千有零數臣等奏陛下至誠䘏民可謂周盡聖訓復云如此好事利益於民一日且做得一件一年亦有三百六十件臣等退御筆即從中出曰訪聞婺州上供羅舊數不過一萬疋崇寧以後積漸增添幾至五倍近歲無本錢皆出科配久為民病深可矜恤今後可每年與減二萬八千匹并零數者為永法仍令本州及轉運司每年那融應副本錢足備臣等即施行車駕初至臨安府霖雨不止一日臣等奏事畢因言州治屋宇不多六宫居必隘窄且東南春夏之交多雨蒸潤非京師比聖訓曰亦不覺窄但卑溼爾然自過江百官六軍皆失所朕何敢獨求安至今寢處尚在堂外當竢將士官局各得所居遷從之人稍有所歸朕方敢遷入寢臣等皆言聖心如此人情孰不感動車駕始至臨安府手詔郎官以上悉皆許薦人材蓋特恩也一日進呈侍從官等奏狀聖訓諭臣等曰今次所薦人材不比已前當須擇其可取者便擢用之乃命並召赴都堂審察翌日復命臣等曰郎官等所薦士不若便令登對朕當親自延見之早朝退遍閲諸處章奏未嘗閑今後進膳罷令後殿引見及晩朝前皆可引三班庶得欵曲臣等奏但恐上勞聖躬若陛下不倦接見疎遠搜訪賢能天下幸甚於是再批㫖行下一日初進對聖訓首言陳東歐陽徹可贈一官并與子或弟一人恩澤始罪東等出於倉猝終是以言責人朕甚悔之今方降詔使士庶皆得言事當使中外皆知此意臣等即奉詔言甚善聖訓復曰馬伸前此責去亦非罪可召還或曰聞伸已死聖訓曰不問其死但朝廷召之以示不以前責為罪之意乃問伸自何官責臣等皆曰自衞尉少卿聖訓曰可復召為衞尉少卿臣等奉詔而退東等於是皆贈官及與子或弟恩澤一人并詔所居優䘏其家進呈湖州民王永從進錢五十萬緡佐國用臣等言戸部財用稍集亦不至甚闕聖訓曰如此即安用徒有取民之名却之或曰已納其伍萬緡矣今却之則前後異同聖訓曰既不闕用可併前已納還之仍詔今後富民不許陳獻臣等皆言聖慮及此東南之民聞風當益感悅一日聖訓諭臣等言過江器械皆散亡甲所失尤多朕每躬擐甲胄閲武於宫中以勵衞士乃知舊所造甲有未盡善如披􅈩皆用鐵臂肘幾不可引以當胸緩急如何屈伸今皆親自裁定損益與舊不同極便於施行令兩浙路諸州分造甲五十副一以新様為之臣等皆言陛下畱意武事前所未講盡經聖慮此前史所以稱漢宣帝器械技巧皆精其能朝退内出新様甲一副示臣等舊轉肘鐵葉處皆易以皮屈伸無不利便佗皆𩔖此其後陳東歐陽徹俱贈祕撰各又官其二子仍賜田十頃髙宗建炎二年冬自建康避敵幸浙東初度錢塘至蕭山有列拜於道側者揭其前云宗室趙不衰以下起居上大喜顧左右曰符兆如是吾無慮焉詔不衰進秩三等是行雖涉海往返然天下自此大定矣不衰即善俊之父此與太宗征河東宋捷之祥一也是時選御舟橰工又有趙立畢勝之䜟建炎庚戌正月三日髙宗航海次台州之章安鎮落帆於鎮之祥符寺前屏去警蹕易衣徒步登岸時長老者方陞座道祝聖之詞帝趾勿前聞其稱讚之語甚喜戒左右勿令驚惶而諦聽之少焉千乘萬騎畢集始知為六飛臨幸野僧初不閑禮節恐怖失措從行有司始教以起居之儀李承造升之云詞宋刻作祠紹興中趙元鎮為左相一日入朝見自外移竹栽入内奏事畢亟往視之方興工於隙地元鎮詢誰主其事曰内侍黄彦節也元鎮即呼彦節詬責之曰頃歲艮嶽花石之擾皆出汝曹今將復蹈前轍邪命勒軍令狀日下罷役彦節以聞於上翌日元鎮奏事上喻曰前日偶見禁中有空地因令植竹數十竿非欲以為苑囿然卿能防微杜漸如此可謂盡忠爾後儻有似此等事勿憚以警朕之不逮也彦節自云沈之才者以碁得幸思陵為御前祗應一日禁中與其𩔖對奕上喻曰切須子細之才遽曰念兹在兹上怒云技藝之徒迺敢對朕引經邪命内侍省打竹箆二十逐出廉宣仲云秀州外毉張浩自云少𨽻軍籍嘗為杉清閘官虞候一日晩出郊過嘉興縣忽覩丞㕔赤光照天疑為回祿亟入視之云趙縣丞之室適免身得雄是誕育孝宗也浩之子樸今為毉官家於縣橋之西可質焉張浩自云紹興壬子詔知大宗正事安定郡王令畤訪求宗室伯字號七歲以下者十人入宫備選十人中又擇二人焉一肥一癯迺畱肥而遣癯賜銀三百兩以謝之未及出思陵忽云更子細觀迺令二人叉手並立忽一猫走前肥者以足蹴之上曰此猫偶爾而過何為遽踢之輕易如此安能任重耶遂畱癯而逐肥者癯者乃阜陵也肥者名伯浩後終於温州都監趙子導彦沔云辛巳歲顔亮寇淮江浙震動有處州遂昌縣道流張思廉者人稱為有道之士言事多驗時李正之大正為邑尉從而問之思廉以片紙書云眘乃在位初得之殊不可曉次年阜陵改名正儲登極李正之云明清項於蔡微處得觀祐陵與蔡元長賡歌一軸皆真迹也今錄於後己亥十一月十三日南郊祭天齋宫即事賜太師報本精禋自國南先期清廟宿齋嚴層霄初擴同雲霽暖吹俄回海日暹十萬軍容氷作陣九街鴛瓦玉為簷肅雍顯相同元老行慶均釐四海霑太師臣京恭和雪晴至日日初南帝舉明禋祀事嚴萬瓦溝中寒色在一輪空外曉光暹雲和龍􅎮開氷轍風暖鸞旗拂凍簷共喜天心扶聖德珠璣更誤寵恩霑展采齊明拱面南濃雲深入夜更嚴風和不放瓊英落日暖髙隨玉漏暹照地神光臨午陛鳴臯仙羽下重簷五門回仗如天上看舉雞竿雨露霑衮龍朱履午階南大輦鸞鳴羽衞嚴玉􅎮乍回黄道穩金烏初上白雲暹五門曉吹開旗尾萬騎花光入帽簷已見神光昭感格鶴書恩下萬邦霑飲福初回八陛南凝旒裒對百神嚴睍消塵入康衢潤神應光隨北陸暹丹檻雉開中扇影朱繩鶴下五門簷羣生鼓舞明禋畢却憶花飛舞袖霑清廟齋幄常有詩賜太師已曽和進禋祀禮成以目擊之事依前韻再進今亦用元韻復賜太師非特以此相困蓋清時君臣賡載亦一時盛事耳靈鼓黄麾道指南紫壇蒼璧示凝嚴聯翩玉羽層霄下烜赫神光愛景暹為喜鸞輿回鳯闕故畱芝蓋出虬簷禮天要作斯民福解雨今當萬物霑太師以被賜暹字韻詩前後凡三次進和蓋欲示其韻愈嚴而愈工耳復以前韻又賜太師天位迎陽轉斗南千官山立盡恭嚴共欣奠玉煙初達爭奉回鸞日已暹歸問雪中誰詠絮冥搜花底自巡簷禮成却喜歌盈尺端為來麰萬㝢霑唐杜甫詩巡簷索共梅花笑蓋雪事也太師臣京題神霄宫下馬神霄第一回晴空宫殿九秋開月中桂子看時落雲外仙軿特地來參差碧瓦切昭回繡戸雲輀次第開仙伯九霄曽付託得隨真主下天來神霄玉清萬壽宫慶成卿以使事奉安聖像聞有二詩書幈俯同其韻復賜太師碧落金風爽氣回藂霄乍喜瑞霞開經營欲致􅀺元福敢謂詩人詠子來曈曚日馭曉光回金碧相宜玉府開步武煙霞還舊觀百神應喜左元來昨日召卿等自卿私第泛舟經景龍江游擷芳園靈沼聞卿有小詩今俯同其韻賜太師景龍江靜喜安流玉色閒看浴翅鷗已覺西風頗無事何妨穩泛濟川舟登山想見畱雲際賞日還能傍水涯對此已多重九興先輸黄髮賞黄花錦繡􅈣霄碧玉山縈紆靜練照晴川畱連不惜厭厭去雅興難㤀既醉篇上清寶籙宫立冬日講經之次有羽鶴數千飛翔空際公卿士庶衆目仰瞻卿時預榮觀作詩紀實來上因俯同其韻賜太師以下上清講席鬱蕭臺俄有青田萬侣來蔽翳晴空疑雪舞低徊轉影𩔖雲開飜翰清唳遙相續應瑞疑時尚不回歸美一章歌盛事喜今重見謫仙才又上巳日賜太師金明春色正芳妍修禊佳辰集衆賢久矣愆陽罹暵旱沛然膏雨潤農田乘時賸挾花盈帽胥樂何辭酒滿船所賴燮調功有自佇期髙廪報豐年微元長之孫自云當其父祖富貴鼎盛時悉貯於隆儒亨㑹閣此百分之一二焉國禍家艱之後散落人間不知其幾也祐陵癸巳歲蔡元長自錢塘趣召再拜詔特錫燕於太清樓極承平一時之盛元長作記以進云政和二年三月皇帝制詔臣京宥過眚愆復官就第命四方館使榮州防禦使臣童師敏齎詔召赴闕臣京頓首辭繼被御札手詔責以大義惶怖上道於是飲至于郊曲燕于垂拱殿祓禊于西池寵大恩隆念無以稱上曰朕攷周宣王之詩吉甫燕喜既多受祉來歸自鎬我行永久飲御諸友炰鼈膾鯉其可不如古者詔以是月八日開後苑太清樓命内客省使保大軍節度觀察畱後帶御器械臣譚稹同知入内内侍省事臣楊戩内客省使保康軍節度觀察畱後帶御器械臣賈祥引進使晉州管内觀察使勾當内東門司臣梁師成等伍人總領其事西上閤門使忠州刺史尚藥局典御臣鄧忠仁等一十三人掌典内謁者職有司請辦具上帝弗用前三日幸太清相視其所曰於此設次於此陳器皿於此置尊罍於此膳羞於此樂舞出内府酒尊寶器琉璃馬瑙水精玻瓈翡翠玉曰以此加爵致四方美味螺蛤蝦鱖白南海瓊枝東陵玉蘂與海物惟錯曰以此加籩頒御府寶帶宰相親王以玉執政以通犀餘花犀曰以此實篚教坊請具樂奏上弗用曰後庭女樂肇自先帝𨽻業天臣未之享其陳於庭上曰不可以燕樂廢政是日視事垂拱殿退召臣何執中臣蔡京臣鄭紳臣吳居厚臣劉正夫正侯蒙臣鄧洵仁臣鄭居中臣鄧洵武臣髙俅臣童貫崇政殿閱弓馬所子弟武伎引强如格各命以官遂賜坐命宫人擊鞠臣何執中等辭請立侍上曰坐乃坐於是馳馬舉仗翻手覆手丸素如綴又引滿馳射妙絶一時賜賚有差乃由景福殿西序入苑門就次以憇詔臣蔡京曰此跬步至宣和即昔言者所謂金柱玉戸者也厚誣宫禁其令子攸掖入觀焉東入小花逕南度碧蘆叢又東入便門至宣和殿止三楹左右挾中置圖書筆硯古鼎彞罍洗陳几案榻漆以黒下宇純朱上棟飾綠無文采東西廡側各有殿亦三楹東曰瓊蘭積石為山峰巒間出有泉出石竇注於沼北有御札靜字牓梁間以洗心滌慮西曰凝方後曰積翠南曰瑤林北洞曰玉宇石自壁隱出嶄巖峻立幽花異木扶疎茂密後有沼曰環碧兩旁有亭曰臨漪華渚沼次有山殿曰雲華閣曰太寧左躡道以登中道有亭曰琳霄垂雲騫鳯層巒不大髙峻俯視峭壁攢峰如深山大壑次曰㑹春閣下有殿曰玉華玉華之側有御書牓曰三洞瓊文之殿以奉髙真旁有種玉緣雲軒相峙臣奏曰宣和殿閣亭沼縱横不滿百步而修真觀妙發號施令仁民愛物好古博雅玩芳綴華咸在焉楹無金瑱壁無珠璫堦無玉砌而沼池巖谷谿澗原隰太湖之石泗濱之磬澄竹山茶崇蘭香茝葩華而紛郁無犬馬射獵畋遊之奉而有鷗鳬雁鶩鴛鴦鷄鶒龜魚馴馴雀飛而上下無筦絃絲竹魚龍曼衍之戲而有松風竹韻鶴唳鶯啼天地之􅄜適耳而自鳴其㓗齊清靈雅素若此則言者不根蓋不足恤日午謁者引執中以下入女童樂四百靴袍玉帶列排場肅然無敢謦咳者宫人珠籠巾玉束帶秉扇拂壺巾劒鉞持香毬擁御牀以次立亦無敢離行失次皇子嘉王楷起居升殿側侍進趍莊重儼若成人臣執中等前賀曰皇子侍燕宗社之慶樂作節奏如儀聲和而繹羣臣同樂宜略去苛禮飲食起坐當自便無間執事者以寶器進上量滿酌以賜命皇子宣勸羣臣惶恐飲釂又取惠山泉建溪毫琖烹新貢太平嘉瑞鬭茶飲之上曰日未晡可命樂殿上笙簧琵琶箜篌方響筝簫登陛合奏宫娥妙舞進御酒上執爵命掌樽者注羣臣酒曰可共飲此杯羣臣俯伏謝上又曰可觀羣臣凭陛以觀又頓首謝又命宫娥撫琴擘阮已而羣臣盡醉臣竊考鹿鳴之什冠於小雅而忠臣嘉賓得盡其心既醉太平之時醉酒飽德人有士君子之行在昔君臣施報之道在於飲食燕樂之間太清自真祖開宴以迄於今飲食之設供張之盛樂奏之和前此未有勸侑之恩禮意之厚相與無間之情亦今昔所無實君臣千載之遇而臣德輶智殫曽不足仰報萬分昔仲甫徂齊式遄其歸而吉甫作誦穆如清風召虎受命錫以圭瓚虎拜稽首對揚王休作召公考天子萬壽然則上之施光下之報宜厚而臣老矣論報無所切不自量慕古人之風謹稽首再拜誦曰皇帝在御政若稽古昔周宣王燕嘉吉甫曰來汝京實始予輔厥初有為唱予和汝式遄其歸遠于吳楚勞還于庭飲至于露既又享之其開禁禦有來帝車相視其所於此膳羞於此樂舞海物惟錯于以加俎何錫予之實篚及筥簫鼓鏘鏘後庭委女帝曰宣和不遠跬步人昔有言金柱玉戸帝命子攸爾掖爾父乃瞻庭除乃厯殿廡緣飾上棟漆朱下宇梁無刻雕檻不采組有石巖巖有泉湑湑體道清心於此燕處彼言厚誣何恤何慮帝執帝爵勸酬交舉毋相其儀毋間笑語有喜惟王飲之俾飫臣拜稽首千載之遇君施臣報式燕且譽臣拜稽首明命是賦天子萬年受天之祐謦宋刻作磬蔡元長所述太清樓特燕記既列於前又得保和殿曲燕延福宫曲燕二記今復載於左方宣和元年九月十二日皇帝詔臣蔡京臣王黼臣越王俁臣燕王似臣嘉王楷臣童貫臣嗣濮王仲忽臣馮熙載臣蔡攸燕保和殿臣蔡鯈臣蔡翛臣蔡鞗東曲水朝於玉華殿上步西曲水循􅙐醿架至太寧閣登層巒凌霄騫鳯垂雲亭景物如前林木蔽䕃如勝始至保和殿三楹楹七十架兩挾閣無綵繪飾侈落成於八月而髙竹崇檜已森然蓊欝中楹置御榻東西二間列寶玩與古鼎彝器玉左挾閤曰妙有設古今儒書史子楮墨右曰日宣道家金櫃玉笈之書與神霄諸天隱文上步前行稽古閣有宣王石皷厯􅃉古尚古鑑古作古傳古博古祕古諸閣藏祖宗訓謨與夏商周尊彝鼎鬲爵斚卣敦盤盂漢晉隋唐書畫多不知識駭見上親指示為言其槩因指閣内此藏卿表章字札無遺者命開櫃櫃有朱隔隔内置小匣匣内覆以繒綺得臣所書撰淑妃劉氏制臣進曰札惡文鄙不謂襲藏如此念無以稱報頓首謝抵玉林軒過宣和殿列岫軒天真閣凝德殿之東崇石峭壁髙百丈林壑茂密倍於昔見過翠翹燕閣諸處賜茶全真殿上親御擊注湯出乳花盈面臣等惶恐前曰陛下略君臣夷等為臣下烹調震悸惶怖豈敢啜頓首拜上曰可少休乃出瑤林殿中使馮皓傳㫖畱題殿壁喻臣筆墨已具乃題曰瓊瑤錯落密成林檜竹交加午有隂恩許塵凡時縱步不知身在五雲深頃之就坐女童樂作坐間賜茘子黄橙金柑相間布列前後命師文浩剖橙分賜酒五行再休許至玉真軒軒在保和西南廡即安妃粧閤命使傳㫖曰雅燕酒酣添逸興玉真軒内看安妃詔臣賡補成篇臣即題曰保和新殿麗秋輝詔許塵凡到綺闈方是時人自謂得見妃矣既而但畫像掛西垣臣即以謝奏曰玉真軒檻暖如春只見丹青未有人月裏常娥終有恨鑑中姑射未應真須㬰中使召臣至玉華閤上手持詩曰因卿有詩況姻家自當見臣曰頃緣葭莩已得拜望故敢以詩請上大笑妃素粧無珠玉飾綽約若仙子臣前進再拜叙謝妃答拜臣又拜妃命左右掖起上手持大觥酌酒命妃曰可勸太師臣奏曰禮無不報不審酬酢可否於是持瓶注酒授使以進再坐徹女童去羯鼔御侍奏細樂作蘭陵王揚州散古調酬勸交錯上顧羣臣曰桂子三秋七里香七里香桂子名也臣楷頃許對曰麥雲九夏兩歧秀臣攸曰雞舌五年千歲棗臣曰菊英九日萬齡黄乃賡載歌曰君臣燕衎昇平際屬句論文樂未央臣奏曰陛下樂與人同不間髙卑日且􅇀久勤聖躬不敢安上曰不醉無歸更勸迭進酒行無算上忽憶紹聖春宴口號二句問曰卿所作否餘句云何臣曰臣所進詩歲久不記上曰是時以疾告假哲宗召至宣和西閤問所告假者對曰臣有負薪之疾不果預需雲之燕哲宗曰蔡承㫖有佳句曰紅蠟青煙寒食後翠華黄屋太微間不可不赴上曰臣敢不力疾遵奉是日待漏東華哲宗已遣使詢來否語罷命郝隨持盃以勸凡三酬大醉免謝扶出因沈吟曰記上下句有曰集英班者繼而曰牙牌曉奏集英班日照雲龍下九關紅蠟青煙寒食後翠華黄屋太微間繼又曰三春樂奏三春曲萬歲聲連萬歲山欲識君臣同樂意天威咫尺不違顔臣頓首謝曰臣操筆注思於今二十年陛下語及方省髣髴然不記一字陛下藩邸已知臣蓋非今日豈勝榮幸再拜謝上輪指曰二十四年矣左右皆大驚非聖人孰與夫此臣又謝曰臣被知藩邸受眷紹聖兩朝遭遇臣駑下衰老無毫髮稱報上曰屢見哲宗道卿但為章惇輩沮忌不及用朕時年八歲垂髻侍側一日哲宗疑慮黙若有所思問曰大臣以謂不當紹述朕深疑之奏曰臣聞子紹父業不當問人何疑之有哲宗駭曰是兒有大志如此由是劉摰吕大防相繼斥逐紹述自此始臣奏曰陛下曲燕御酒樂欣交通而追時惟哲宗付託與紹述之始孝友篤於誠心非臣之幸社稷天下之幸因再拜賀黼已下皆再拜上又曰嘗記合食與卿否臣謝曰是時大禮禁嚴厨饔不得入貿食端邸蒙陛下賜之臣被遇自兹終身不敢㤀又曰崇政殿試卿在西幕詳定時因入持扇求書得二詩皆杜甫所作詩曰戸外昭容紫袖垂雙瞻御座引朝儀香飄合殿春風轉花覆千官淑景移又五夜漏聲催曉箭九重春色醉仙桃旌旗日暖龍蛇動宫殿風微燕雀髙臣曰崇寧初蒙宣諭扇猶在上曰今尚在也臣曰自古人臣遭遇或以一能一技見知當時名顯後世臣章句片言二十年前已蒙收錄崇寧以來被遇若此君臣千載豈非一日君之施厚臣之報豐臣無尺寸孤負恩紀但知感涕上曰卿可以安矣臣又奏曰樂奏繽紛酒觴交錯方事燕飲上及繼述下及故老若朋友相與銜盃酒接慇懃之歡道舊論新顧臣何足以當臣請序其事以示後世知今日燕樂非酒食而已夜漏已二鼔五籌衆前奏丐罷始退十三日臣京序延福宫曲宴記宣和二年十二月癸巳召宰執親王等曲宴於延福宫特召學士承㫖臣李邦彦學士臣宇文粹中與示異恩也是日初御睿謨殿設席如外廷賜宴之禮然器用殽品瓌竒精緻非常宴比仙韶執樂和音曼聲合變爭節亦非教坊工人所能髣髴上遣殿中監蔡行諭㫖曰此中不同外廷無彈奏之儀但飲食自如食味果實有餘者自可攜歸酒五行以碧玉醆宣諭侍宴諸臣云前此曲宴早坐未嘗宣勸今出異數少憇於殿門之東廡晩召赴景龍門觀燈玉華閣飛陞金碧絢耀疑在雲霄間設衢樽鈞樂於下都人熙熙且醉且戲繼以歌誦示天下與民同樂之恩侈太平之盛事次詣穆清殿後入崆峒洞天過霓橋至㑹寧殿有八閤東西對列曰琴碁書畫茶丹經香臣等熟視之自崆峒入至八閤所陳之物左右上下皆琉璃也映徹焜煌心目俱奪閤前再坐小案玉斚珍異如海陸羞鼎又與睿謨不同酒三行甚速起詣殿側縱觀上謂保和殿學士蔡翛曰引二翰苑子細看一一說與諄諭再三次詣成平殿鳯燭龍燈燦然如畫竒偉萬狀不可名言上命近侍取茶具親手注湯擊拂少頃曰乳浮醆面如疎星澹月顧諸臣曰此自布茶飲畢皆頓首謝既而命坐酒行無算復出宫人合曲妙舞蹁蹮態冇餘妍凡目創見上諭臣邦彦臣粹中曰此盡是嬪御自來翰林不曾與此集自卿等始又曰翰林志誰修太宰王黼奏云承㫖李邦彦上顧臣邦彦曰好翰林志可以盡載此事此卿等榮遇臣邦彦謝不敏瓊瑤玉舟宣勸非一上每親臨視使釂復顧臣某曰李承㫖善飲仍數被特勸夜分而罷臣仰惟陛下加惠親賢共享太平肆念詞臣許陪鼎席宗工之末周於待遇略去常儀臣邦彦粹中首膺異數親承玉音俾編載榮遇以侈北門之盛蓋陛下崇儒右文表異鼇禁用示眷矚之意誠千載幸㑹也竊伏惟念一介微臣粤自布衣叨膺識擢凡所蒙被度越倫輩曾微毫忽以助山嶽兹侍燕衎咫尺威顔獨誤睿奬至官而不名豈臣糜捐所能稱塞臣切觀文武之盛始於憂勤而逸樂繼之鹿鳴之燕羣臣嘉賓得盡其心故天保之報永永無極臣雖么陋敢㤀歸美之義輒揚盛蹟備載於篇使視草之臣知聖主曲宴内務自臣等始謹錄進呈伏取進止宣和末祐陵欲内禪稱疾作令召東宫先是欽宗在朱邸每不平諸倖臣之恣横至是内侍數十人擁鄆王楷至殿門時何瓘以殿帥守禁衞仗劒拒之鄆王趍前曰太尉豈不識楷耶瓘指劒以示曰瓘雖識大王但此物不識耳皆皇恐辟易而退始亟趍欽宗入立李子成可久云建炎庚戌先人被㫖脩祖宗兵制書成賜名樞廷備檢今藏於右府其詳已見後錄獨有引文存於家集用錄於後臣竊聞祖宗兵制之精者蓋能深鑒唐末五代之弊也唐自盜起幽陵藩鎮竊據外抗王命内擅一方其末流至於朱温以編戸殘寇挾宣武之師睥睨王室必俟天子禁衞神䇿之兵屠戮俱盡却遷洛陽乃可得志如李克用王建楊行密非不忠義旋以遐方孤鎮同盟欲缺王室皆悲叱憤懣坐視兇逆終不能出一兵内嚮者昭宗親兵既盡朱温羽翼已就行密輩﨑嶇於一邦初務養練不能遽成此内外俱輕盜臣得志之患也後唐莊宗萃名將握精兵父子轉戰二十餘年僅能滅梁功成而驕兵制不立弗虞之患一夫夜呼内外瓦解故李嗣源以老將養痾私第起提大兵與趙在禮合於甘陵返用莊宗直擣大梁之術徑襲洛陽乘内輕外重之勢數日而濟大事其後甘陵舊卒恃功狂肆邀求無窮至一軍盡誅血膏原野而明宗為治少定如李從珂晉髙祖劉知遠郭威皆提本鎮之兵直入中原而内外拱手聽命者循用莊宗明宗之意也周世宗知其弊始募天下亡命寘於帳下立親衞之兵為腹心肘腋之用未及朞年兵威大振敗澤潞取淮南内外兼濟莫之能禦當是時藝祖皇帝厯試諸難親總師旅應天順人厯數有歸則躬定軍制紀律詳盡其軍製親衞殿禁之名其營立龍虎日月之號功臣勲爵優視公師至檢校官皆令僕臺憲之長封叙父母妻子榮名崇品悉以與之郊祀赦宥先務贍軍衍士金幣緍錢無所愛惜然令以威駕峻其等差為一階一級之法動如行師俾各伏其長待之盡矣為出戍法使更出迭入無顧戀家室之意殊方異邦不能萌其非心僅乃三年已復更戍為卒長轉員之例定其功實超轉資級以彼易此不使上下人情習熟又其下懍懍每有事新之懼樞府大臣侍便殿專主簿員限三日畢事命出之後一日遷陟不得少畱此祖宗制兵垂法作則大指也器甲精堅日課其藝而無怠惰者矣選為教首嚴其軍號精其服飾而驕銳出矣中都二防製造兵器旬一進視謂之旬課列置武庫故械器精勁盈牣充積前世所無至纎至悉舉自宸斷臣下奉行惟恐不及其最大者召前朝慢令恃功藩鎮大臣一日而列於環衞皆俯伏駭汗聽命不暇更用侍從館殿郎官拾遺補闕代為守臣銷累朝跋扈偃蹇之患於呼吸俄頃之際每召藩臣朝令夕至破百年難制之弊使民享安泰於無窮者宸心已定利害素分剛斷必行故也其定荆湖取巴蜀浮二廣平江南者前後精兵不過三十餘萬京師屯十萬足以制外變外郡屯十萬足以制内患京師天下無内外之患者此也京師之内有親衞諸兵而四城之外諸營列峙相望此京師内外相制之兵也府畿之營雲屯數十萬之衆其將副視三路者以虞京城與天下之兵此府畿内外之制也非特此也凡天下兵皆内外相制也以勇悍忠實之臣分控西北邊孔道何繼筠守滄景李漢超守關南以拒敵郭進在邢州以禦太原姚内斌守慶州董遵誨守通遠軍以捍西戎傾心委之讒謗不入來朝必升殿賜坐對御飲食錫賚殊渥事事精豐使邊境無事得以盡力削平東南僭偽諸國者得猛士以守四方而邊境遐裔無内外之患者此也州郡節察防團刺史雖召居京師謂之遙授至於一郡則盡行軍制守臣通判名銜必帶軍州其佐曰簽書軍事及節度觀察軍事推官判官之名雖曹掾悉曰叅軍一州稅賦民財出納之所獨曰軍資庫者蓋稅賦本以贍軍著其實於一州官吏與帑庫者使知一州以兵為本咸知所先也置轉運使於逐路專一飛輓芻糧餉軍為職不務科斂不抑兼并富室連我阡陌為國守財爾緩急盜賊竊發邊境擾動兼并之財樂於輸納皆我之物所以稅賦不增元元無愁歎之聲兵卒安於州郡民庶安於田閭外之租稅足以贍軍内之甲兵足以䕶民城郭與鄉村相資無内外之患者此也一州錢斛之出入士卒之役使令委貳郡者當其事一兵之寡一米之微守臣不得而獨預其防微杜漸深矣出銅虎符契以發兵驗其機括不得擅興以革偽冒節度州有三印節度印隨本使在闕則納於有司觀察印則長吏用之州印則晝付錄事掌用至􅇀歸於長吏凡節度使在鎮兵杖之屬則觀察屬官用本使印判狀焉田賦之屬則觀察屬官用本使印簽狀焉刺屬縣則用州印本使判狀焉故命師必曰某軍節度某州管内觀察等使某州刺史必具此三者言軍則專制兵旅言管内則專總察風俗言刺史則治其州軍此祖宗損益唐制軍民之務職守之分俾各歸其實也逐縣置尉專捕盜賊濟以縣廵檢之兵不足則㑹合數州巡檢使之兵又不足則資諸守臣兼提舉兵甲賊盜公事與一路帥臣兼兵馬鈐轄者故兵威强盛䑕偷草竊尋即除蕩蓋内外相維上下相制若臂運指如尾應首靡不相資也凡統馭施設制度號令人不敢慢者功過必行明於賞罰而已明於賞罰則上下奮勵知所聳動而姦宄不敢少踰繩墨之外事必立就也怒蜀大將之貪暴也曹彬獨無所汚自客省使隨軍都監超授宣徽南院使義成軍節度使以賞之御便殿閲武第其藝能連營俱令轉資至於荆罕儒戰死責部將不効命斬石進等二十九人雄武兵白晝掠人於市至斬百輩乃止川班直訴賞則盡戮其將校而廢其班太祖嘗曰撫養士卒不吝爵賞茍犯吾法惟有劒耳然神機所照及物無遺察人之心而人盡死力班太原之師則謂將士曰爾輩皆吾腹心爪牙吾寧不得太原豈忍令害爾輩也或訴郭進修第用筩瓦如諸王制則曰吾於郭進豈減兒女耶祖宗賞罰雖明有誠心以及物故天下用命兵雖少而至精也逮咸平西北邊警之後兵増至六十萬皇祐之初兵已一百四十萬矣故翰林學士孫洙號善論本朝兵者其言古者兵一而已今内外之兵百餘萬而别為三四又離為六七也别而為三四禁兵也廂兵也蕃兵也離而為六七者謂之兵而不知戰者也給漕輓者兵也服工役者兵也繕河防者兵也供寢廟者兵也養國馬者兵也疲老而坐食者兵也前世之兵未有猥多如今日者也前世制兵之害未有甚於今日者也蓋常率計天下之戸口千有餘萬自皇祐一歲之入一倍二千六百餘萬而耗於兵者常十八而畱州以供軍者又數百萬也總戸口歲入之數而以百萬之兵計之無十戸而資一廂兵十畆而給一散卒矣其兵職衞士之給又浮費數倍何得而不大蹙也況積習刓弊又數十年教習不精士氣不振揀兵則㸃數而已宣借則重疊妄監逃亡已久而衣糧自如疲癃無堪而虛名具數元豐中神宗謂宰臣吳充曰祖宗以來制軍有意凡領在京殿前馬步軍司所統諸指揮置都使虞候分領之凡軍中之事止責分領節度之人則軍衆自齊責之既嚴則遇之亦優故軍校轉員有由行伍不久已轉至團練使者王者之衆不得不然若諸路則軍校不過各領一營耳周室雖盛至康之後寖已衰微本朝太平百餘年由祖宗法度具在豈可輕改也自昔外裔横而窺中國者先觀兵之盛衰然則兵備可一日㤀哉蓋祖宗相承其愛民之實若出一心謂民之作兵者多與兵之仰者衆而民不可重困也故張齊賢欲益民兵吕蒙正曰兵非取於民不可而真宗以深念擾動邊人遂止河東河北既置義勇軍以韓琦忠亮急於備邊猶欲刺陜西民為義勇諫官司馬光抗章數十萬言其不可熙寧申命天下教保甲盛於元豐本周官寓兵於農之意聨什伍之民族黨相保舉三路言之凡有百萬人天下稱是旋亦廢置蓋兵雖可練而民不可重擾也本朝既以民作軍矣又求之畎畆則州郡内外皆兵前世所未有也此祖宗重以民為兵也臣謹列自建國已來兵制㳂革與夫祖宗禦戎備邊又諸軍興廢所因詳著於篇者凡二百卷又原祖宗聖意之不見於文字者為之序然竊嘗謂後世誦帝堯之德惟知茅茨不剪土階三尺而已至史謂就之如日望之如雲則堯及物之功與天地等矣惟書曰乃聖乃神乃武乃文具是四者堯德乃備則固由所見淺深歟共惟祖宗以聖神文武斡運六合鞭笞四裔悉本於兵其精神心術之微蓋不在迹然効神宗重規疊矩之盛在本聖心而其迹顧豈能盡今臣之淺拙雖欲紬繹傳載所有不能知也熙寧三年曽宣靖為昭文相以疾乞解機政久之除守司空侍中河陽三城節度使集禧觀使王文恭為内相當制進進草神宗讀至髙旗鉅節遙臨踐土之邦間館珍臺獨揖浮丘之袂顧文恭笑云此句甚熟想備下多時文恭云誠如聖訓歸語其子仲修云吾自聞魯公丐去即辦此一聯歎服上之精鑒如此蘇仁仲云裕陵懷韓魏公定䇿之勲崇德報功不次擢其子儀公忠彦登禁路未及柄用而魏公薨甚為不滿故亟用曽宣靖之子令綽執事樞柄時元豐官制初行肇建東西二府俾迎宣靖入居虞侍之為搢紳之美談後二十年儀公始相祐陵思陵中興興念故家所以富鄭公之孫季申直柔儀公之孫似夫肖胄相繼賜第為右府又三十年令綽之孫欽道懷亦賜出身登宰席皆近世衣冠之盛事若蔡元長之於攸秦㑹之之於熺蓋恩澤侯不足道也熙寧中蔡敏肅挺以樞密直學士帥平涼初冬置酒郡齋偶成喜遷鶯一闋霜天清曉望紫塞古壘寒雲衰草汗馬嘶風邊鴻飜月壟上鐵衣寒早劒歌騎曲悲壯盡道君恩難報塞垣樂盡雙鞬錦帶山西年少談笑刁斗靜烽火一把常送平安耗聖主憂邊威靈遐布强敵且寛天討歲華向晩愁思誰念玉關人老太平也且歡娛不惜金尊頻倒詞成閑步後園以示其子䑃朦寘之袖中偶遺墜為譍門老卒得之老卒不識字持令筆吏辨之適郡之娼魁素與筆吏洽因授之㑹賜衣襖中使至敏肅開燕娼尊前執板歌此敏肅怒送獄根治倡之儕𩔖祈哀於中使為援於敏肅敏肅舍之復令謳焉中使得其本以歸達於禁中宫女輩但見太平也三字爭相傳授歌聲遍掖庭遂徹於宸聽詰其從來迺知敏肅所製裕陵即索紙批出云玉關人老朕甚念之樞筦有闕畱以待汝以賜敏肅未幾遂拜樞密副使御筆見藏其孫稹家史言獻肅交結内侍進詞柄用又不同也元祐二年東坡先生入翰林暇日㑹張秦􅄯陳李六君子於私第忽有㫖令撰賜奉安神宗御容禮儀使吕大防口宣茶藥詔東坡就牘書云於赫神考如日在天顧羣公曰能代下一轉語否各辭之坡隨筆後書云雖光明無所不臨而􅄤次必有所舍羣公大以聳服導引鼔吹詞蓋亦是時作真迹今藏明清處二事曽國華云富文忠公熙寧二年再相王荆公為叅知政事始用事與文忠不協文忠力丐去以使相判河南府上章自劾繼改亳州今錄於此清時竊祿難逃素食之譏白首佐朝遂起蔽賢之謗幸聖明之洞照舉毫髮以無遺顧此薄材尚容具位中謝切念臣業非經遠識寡通方少因章句之科得偕羣俊長脫簿書之秩獲事三朝仁宗之顧遇匪輕英廟之丁寧尤甚旋屬大人繼照飛龍在天思肯搆於先基勿遐遺於萬物澗蘋何美雜圭璧以薦羞槽馭已疲復驊驑之共駕殫力雖勞於負嶽小心更甚於履氷果不克堪遂貽彈劾如安石者學强辯勝年壯氣豪論議方鄙於古人措置肯諧於僚黨至使山林末學草澤後生放自得之良心樂人傳之異說蘋蘋者子譊譊其書足以千名足以取貴拖紳朝序者非安石之黨則指為俗吏圜冠校學者異安石之學則笑為迂儒嘆古人之不生恨斯文之將喪臣切觀安石平居之間則口筆丘旦有為之際則身心管商至乃忽故事於祖宗肆巧譏於中外喜怒惟我進退其人待聖主為可欺視同僚為不物臺諫官以兹切齒謂社稷付在何人士大夫㒺不動心以朝廷安用彼相為臣及此事主若何臣非不能秉筆華衮之前而正其非覆身青蒲之上而排其失重念陛下方當淵黙堯舜中和禹湯同天德之尚􅇅待人臣之有體徒髙唇吻莫補聰明且區區晉都尚有相先之下佐況赫赫昭代豈有不和之大臣愚念及斯衆言陋此伏乞陛下特申雄斷大決羣疑正安石過舉之謬以幸保家邦白臣等後言之罪而俾歸田里如其尚矜微朽處以便藩不唯有遂於物情亦以不妨於賢路如是則始終事聖史傳不附於姦朋去就為臣物議庶歸於直道其臨薨二表尤為懇切明清家舊有之今不復存東坡先生公神道碑云手封遺表使其子上之者也徐敦立國紀亦載其略至於謂宫闈之臣不可使之專總兵柄人心不服易以敗事後來童貫之徒是矣韙哉先見之明焉氷宋刻作水熙寧初司天監亢瑛奏後三十年西南有亂出於同姓是時方議皇族補外官於是詔宗室不得注授川峽差遣至建中靖國初趙諗叛於渝州相距果三十年其言迺驗繼而瑛又言丙午丁未汴都不守乘輿有播遷之厄不可輕改祖宗之法恐致召亂王荆公大怒啓裕陵竄瑛英州韓知命云魯文肅十子最鍾愛外祖空青公有壽詞云江南客家有寧馨兒三世文章稱大手一門兄弟獨良眉籍甚衆多推千里足來自渥洼池莫倚善題鸎鵡賦青山須待健時歸不似傲當時其後外祖果以詞翰名世可謂父子為知己也陳禾字秀實四明人政和初為右正言明目張膽展盡底緼時稱得人徽宗批出除給事中㑹宦官童貫黄經臣恃貴幸驕險且與中執法盧航相為表裏搢紳側目莫敢言者禾曰吾備位臺諫朝廷有至可慮者一遷給舍則非其職此而不言後悔何追未受告命即抗疏上言力陳漢唐之禍不可不戒此隙一開異日有不勝言者惟陛下畱意於未然論列既久上以日晩頗饑拂衣而起曰朕饑矣禾褰挽上衣泣奏曰陛下少畱容臣罄竭愚衷上為少畱禾曰此曹今日受富貴之利陛下它日受危亡之禍孰為重輕願陛下擇之上衣裾脫落上曰正言碎朕衣矣禾奏曰陛下不惜碎衣臣又豈惜碎首以報陛下其言激切上為之變色且曰卿能如此朕復何憂内侍請上易衣上止之曰畱以旌直節翌日經臣率其黨訴於上前曰國家極治如此安得有此不祥之語繼而盧航上章謂禾一介書生言事狂妄東臺之除既寢復責授信州監酒久之自便丐祠奉親還里先是陳瑩中寓居郡中禾交遊日久又遣其子正彚來從學後瑩中論列蔡元長得罪禾上書力為救解及正彚告發蔡氏事父子俱就逮監獄者知瑩中與禾遊謂言必自禾發移文取證禾荅以事誠有之罪不敢逃人謂禾曰豈宜以實對禾曰禍福死生吾自有處豈肯以一死易不義耶儻得分賢者辠固所願也朝廷指以為黨勒停宣和中起守龍舒以卒事見髙抑崇閌所述行狀紹熙間史直翁再相上其所著易與春秋傳特官其孫近脩四朝史無人為之立傳此節義遂失傳於後世可勝太息林子忠有野史一編世多傳之其間議論與平日所為極以背馳殊不可曉豈非知公論不可揜欲蓋其迹於天下後世耶東坡先生雖竄斥於紹聖元符然元祐中黄慶基趙君錫賈易之徒已摘取其所行訓詞中語以為詆誣後來施行蓋權輿於是史冊可以具考近人作好事如鄭介夫鄒志完陳瑩中士林每以為佳話然如王和父之救東坡先生江民表之乞不深治蔡邸獄豐相之於祐陵前辯元祐諸公之無罪方軫之上書力詆蔡元長之失雍孝聞之奉廷對李彪之擬賢良䇿數二蔡之姦二人者俱罹刑辟之𩔖尚多皆人之所難言惜乎世人之不盡知也成都人景煥野人閑話蓋乾德三年所述其間載蜀後主一條今錄於後蜀後主孟氏諱昶字保元尊號睿文英武仁聖明孝皇帝道號玉霄子承髙祖纂業性多明敏以孝慈仁義在位三紀已來尊儒尚學貴農賤啇初用趙季良母昭裔知政事李仁學趙廷隱等分主兵權李昊徐光浦掌牋檄王處回為樞要無何政教壅滯恩澤雜遝一旦赫怒誅權臣張業出王處回自命二相李昊徐光浦開獻納院創貢舉場不十餘年山西潭隱者俱起肅肅多士赳赳武夫亦一方之盛事城内人生三十歲有不識米麥之苗者每春三月夏四月有遊浣花香錦浦者歌樂掀天珠翠闐咽貴門公子乘彩舫遊百花潭窮奢極麗諸王功臣已下皆置林亭異果名花小𩔖神仙之境兵部王尚書珪題亭子詩其一聯曰十字水中分島嶼數重花外見樓臺皆此𩔖也自大軍收復蜀主知運數有歸尋即納欵識者聞之嘉歎蜀主能文章好博覽知興亡有詩才嘗為箴誡頒諸字人各令刋刻於坐隅謂之頒令箴曰朕念赤子旰食宵衣託之令長撫養惠綏政在三異道在七絲驅雞為理畱犢為規寛猛得所風俗可移無令侵削無使瘡痍下民易虐上天難欺賦與是切軍國是資朕之賞爵固不踰時爾俸爾禄民膏民脂為民父母莫不仁慈勉爾為誡體朕深私治平中張次功著蜀極杭亦書是箴與此一同旦宋刻作但章獻明肅初自蜀中汎江而下舟過真州之長蘆有閩僧法燈者築茅庵岸旁燈一見聽其歌聲許以必貴倒囊津置入京繼遂遭際及位長樂燈尚在后捐奩中百萬緡命淮南兩浙江南三路轉運使創建大刹工巧雄麗甲于南北俾燈住持賜予不絶李邯鄲為之碑至今存焉皇祐初名僧谷全號全大道以道行價重禪林住廬山圜通寺忽一男子貨藥入山自云帝子全見其狀貌頗異厚資其行使往京師自陳鞫治得其妄迺都人冷緒之男青也誅之全坐黥配郴州郡中令荷築城之圡經歲當盛暑忽弛檐市中作頌云今朝六月六老全受罪足若不登天堂定是入地獄言訖趺坐而化郡人即其地建塔焉事有相𩔖而禍福不侔如此者徐敦立國紀迺云全與青俱棄市誤矣王文穆欽若以故相來守杭州錢塘一老尉蒼顔華髮矣文穆初甚不樂詢其履厯乃同年生惻然哀之遂封章於朝詔特改京秩尉以詩謝之云當年同試大明宫文字雖同命不同我作尉曹君作相東君元没兩般風􅄯武子云章俞者郇公之族子早歲不自拘檢妻之母楊氏年少而寡俞與之通已而有娠生子初産之時楊氏欲不舉楊氏母勉令畱之以一合貯水緘置其内遣人持以還俞俞得之云此兒五行甚佳將大吾門雇乳者謹視之既長登第始與東坡先生締交後送其出守湖州詩首云方丈仙人出𣺌茫髙情猶愛水雲鄉以為譏已由是怨之其子入政府俞尚無恙嘗犯法以年八十勿論事見神宗實錄紹聖相天下坡渡海蓋修報也所謂燕國夫人墓獨處而無祔者即楊氏也章芳仲云兒宋刻作而元豐末章子厚為門下侍即以本官知汝州時錢穆父為中書舍人行告詞云鞅鞅非少主之臣悻悻無大臣之操子厚固怨之矣元祐間穆父在翰苑詔書中有不容羣枉規欲動搖以指子厚尤以切齒紹聖初子厚入相例遭斥逐穆父既出國門蔡元度餞别因誦其前聯云公知子厚不可撩撥何故詆之如是穆父愀然曰鬼劈口矣元度曰後來代言之際何故又及之穆父笑曰那鬼又來劈一劈了去朱希真先生云周美成邦彦元豐初以太學生進汴都賦神宗命之以官除太學錄其後流落不偶浮沈州縣三十餘年蔡元長用事美成獻生日詩略云化行禹貢山川内人在周公禮樂中元長大喜即以祕書少監召又復薦之上殿契合詔再取其本生進表云六月十八日賜對崇政殿問臣為諸生時所進先帝汴都賦其辭云何臣對曰賦語猥繁歲月持久不能省憶即勅以本來進者雕蟲末技已玷國恩芻狗塵言再干睿覽事超所望憂過於榮切惟漢晉以來才士輩出咸有頌述為國光華兩京天臨三國鼎峙竒偉之作行於無窮共惟神宗皇帝盛德大業卓髙古初積害悉平百廢再舉朝廷郊廟㒺不崇飾倉廩府庫㒺不充仭經術學校㒺不興作禮樂制度㒺不釐出遐荒片地㒺不流行理財禁非動協成算以至鬼神懷鳥獸若搢紳之所誦習載籍之所編記三五以降莫之與京未聞承學之臣有所歌詠於今無傳視古為愧臣於斯時自惟徒費學廩無益治世萬分之一不揣所堪裒集盛事鋪陳為賦冒死進投先帝哀其狂愚賜以首領特從官使以勸四方臣命薄數竒旋遭時變不能俛仰取容自觸罷廢漂零不偶積年於兹臣孤憤莫伸大恩未報每抱舊藁涕泗横流不啚於今得望天表親奉聖訓命錄舊文退省荒蕪恨其少作憂懼怕惑不知所為伏惟陛下執道御有本於生知出言成章匪由學習而臣也欲晞雲漢之麗自呈繪畫之工唐突不量誅死何恨陛下德侔覆燾恩浹飛沈致絶異之祥光出久幽之神璽豐年屢應瑞物畢臻方將泥金泰山鳴玉梁父一代方冊可無述焉如使臣殫竭精神馳騁筆墨方於兹賦尚有靡者焉其元豐元年七月所進汴都賦并書共二䇿謹隨表上進以聞表入乙覽稱善除次對内祠其後宣和中李元叔長民獻廣汴都賦上亦甚喜除祕書省正字元叔定之孫也桺色黄金嫩梨花白雪香隂鏗詩也李太白取用之杜子美太白詩云李白有佳句往往似隂鏗後人以謂以此譏之然子美詩有蛟龍得雲雨鵰鶚在秋天一聯已見晉書載記矣如氷肌玉骨清無汗水殿風來暗香滿孟蜀王詩東坡先生度以為詞昔人不以􅌃襲為非南部煙花錄夕陽如有意偏傍小窻明唐人方域詩新唐書藝文志有方域詩一卷煙花錄一名大業拾遺記文詞極惡可疑而大業幸江都記自有十二卷唐著作即杜寶所纂明清家有之永平時揚州印本也沈睿達遼文通之同胞長於歌詩尤工翰墨王荆公曽文肅學其筆法荆公得其清勁而文肅傳其真楷登科後遊京師偶為人書帬帶詞頗不典流轉鬻於相藍内侍買得之達於九禁近幸嬪御服之遂塵乙覽時裕陵初嗣位勵精求治一見不悅㑹遣監察御史王子韶察訪兩浙臨遣之際上喻之曰近日士大夫全無顧藉有沈遼者為倡優書􅁋冶之辭於帬帶遂達朕聽如此等人豈可不治子韶抵浙中適睿達為吳縣令子韶希㫖以它罪劾奏時荆公當國為申解之上復伸前說竟不能釋疑遂坐深文削籍為民其後卜居池陽之齊山有集號雲巢編行於世揮麈餘話卷一欽定四庫全書揮麈餘話卷二宋王明清撰
