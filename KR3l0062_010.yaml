front:
  text: 揮麈後録卷之五七九汝隂王明清諡以節惠孟子謂名之幽厲孝子慈孫百丗不能易
  hash: sha256:1ce8407b8cd623813aeabf2c1f50688907edde04d955f6023447e40dc9116807
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_010-1a}
body:
  text: 三代以來君臣務取美稱遂至失實國朝諸諡宋常山退朝録備載之止於熙寧三年明清謹續之于後然聞見未廣姑存所記憶遺落尚多當嗣益之后諡慈聖光獻宣仁聖烈昭慈聖獻昭懷欽聖獻肅欽成欽慈顯恭顯肅顯仁明節憲節憲聖慈烈成穆成恭妃諡昭靜沈貴妃明逹懿文後追册為明逹皇后明節和文後追册為明節皇后靖淑王賢妃太子諡沖憲茂元懿敷莊文愭諸王諡端獻吳王皓端懿益王頵沖僖柳悼敏楫沖穆材哀獻俊沖厚僴惠價沖惠倜公主諡賢惠蜀國公主王晉卿室賢穆韓嘉彥室賢德懿行王師約室賢穆明懿錢景臻室賢惠張端禮室賢靜柔志公主淑和端福公主沖懿賢福公主悼穆徽福公主順穆介福公主宗室諡恭憲丗雄恭孝宣旦仲湜士緘克寬榮穆宗暉僖簡宗景康孝仲御僖靖承𥙿僖安仲汾恭僖宗博僖穆宗墣和恭承顯康僖克戒勤孝宗惠敦和克和僖惠宗隱宗勉修安克敦孝靖宗綽簡獻仲忽安憲宗悌士孝恪仲芮敦恪仲操良僖仲嬰丗恩叔嶠孝僖宗衮仲癸僖惠仲隗榮思宗諤孝良仲罪令蘧修簡仲萉和僖仲防欽修仲碩犖孝仲嗟仲革孝穆丗瓞惠孝仲佺孝修丗獎令穆孝恪丗膺全稼安恪仲玘孝簡丗輝順思仲􅍀孝恪仲摻孝恭丗恪丗恬敦孝仲越孝敦仲僕恭惠叔純僖仲麗惠和檢之忠孝丗表叔武叔充榮惠丗設良恪克章叔珫令􅗕安良丗括容孝叔亞惠恭丗采榮恪叔雅叔黔恭冝丗鳴榮敏叔縱良恭丗亨良憲叔敖益丗逢孝敏士夽思𥙿叔安莊靖叔苗莊節叔照溫獻令圖良𥙿士空忠敏令穰孝榮令鐸良懿令珤安惠丗顒安僖秀王溫靖士棧恭靖士㒟不微士樽襄靖令懬文獻今祉忠靖士珸康宗且宰相諡宣靖曾魯公公亮忠獻韓魏王琦文忠冨韓公弼張天覺啇英忠烈文潞公彥博正獻吕申公公著忠肅劉同老摯虞并武允文正愍吕汲公大防忠宣范堯夫紀仁忠懷蔡持正確文恭王禹玉圭正憲吳沖卿充莊敏韓玉汝縝文定韓儀公忠彥文王荆公安石獻肅陳秀公升之文憲劉德初正夫何清源執中文正司馬溫公鄭逹夫居中清憲趙正夫挺之文肅曽魯公布忠穆呂成公頥浩文和李士美邦彥忠定李伯紀綱汪廷俊彥伯文恭陳魯公康伯正獻陳福公俊卿文惠洪景伯適史直翁浩文靖梁叔于克家文忠京丞相鏜執政諡文憲蘇公易簡文定張太保方平許公將文忠歐陽太師修清獻趙少保抃康靖趙叔平槩章簡元厚蘇黃門轍之絳張于公夀簡翼張公璪修簡胡公宗愈莊定王正仲存恭敏蒲傳正宗孟定簡溫虞弼益忠定孫傳忠穆郭公逵張公懿安簡邵公亢襄敏王公韶康懿何中正康節張公升忠肅陳公過庭文敏吕吉父惠卿李漢老邴恭愍聶昌恭敏薜公向獻簡傅公堯俞敏肅蔡公挺懿簡趙天觀瞻溫靖孫公固莊敏章公楶文節林子中希文簡張康國鄧洵武文正蔡元度卞忠憲种公師道忠肅劉立道大中忠文張嵆仲叔夜李彥頴文懿管歸善師仁安惠鄧聖求溫伯忠武韓蘄王丗忠忠烈張循王俊忠獻胡成公丗將敏肅魏道弼良臣武穆嶽公飛敏節王子尚庶章簡張彥程元籲正綱克俊忠敏沈必克與求莊定劉共父珙莊簡李泰發光簡穆辛李次膺簡惠周敦義葵莊敏汪明逺徹文安洪景嚴遵安簡王公剛中榮敏謝開之廓然愍節王正道倫文臣諡文穆范成大忠文范蜀公鎮宋尹喬年文恪王中丞陶章敏滕元發甫懿恪王宣徽拱辰文憲強翰林淵明洪尚書擬文簡蔡鯈程大昌宣簡李浦邦彥父忠愍徐給事禧李侍郎若水忠憲耿傳忠毅向子韶忠簡張克戬趙令幾胡邦衡銓張大猷闡忠顯劉公韐文昭曾翰林肇莊節王復恭愍錢歸善唐重定愍胡唐老威愍鄭驟宗汝霖澤剛愍曽逢原孝序文靖楊侍郎時文定胡待制安國忠襄楊邦乂勇節郭永莊敏藺中謹韓彥直子溫林栗黃中忠壯章且叟誼康節邵先生雍節孝徐仲車積忠定劉元城安丗文康葛銀青勝仲忠惠蔡君謨襄文忠東坡先生忠宣洪光弼皓獻簡陳邦彥良翰獻肅胡周伯沂張大經彥文康肅吳明可芾文清曽吉父幾忠肅陳瑩中􅗕傳公晦察忠介王子飛雲清敏豐相之稷清孝葛君書思僖敏張如瑩澄賢節王庠忠鄒志完浩忠確張公克戩僖簡莊公徽肅愍宇文虛中節肅龔彥和夬文惠韓公粹彥文僖姚祐壽祖忠敏任德翁伯雨惠懿楊子寬偰武臣諡忠愍髙永年武莊郝質武恪賈逵忠敏姚麟武愍劉法忠節李彥仙忠壯徐徽言李邈馬彥博穆武髙繼勳恭勇楊惟忠勤惠王德恭勤毅宋守約康理楊應詢康簡髙敦復威肅劉仲武勇節郭永榮穆陳守貴犖毅張緼榮安王説端節韓嘉彥僖靖鄭紳恭榮鄭翼之恭簡邢煥安毅郭崇乂忠節髙丗則犖懷髙公玘忠定曹誘恭靖韓同卿端靖郭師禹內臣諡忠靖劉有方忠良賈詳忠簡劉瑗僖儉張茂則忠愍李舜舉僖敏宋用臣忠敏李憲安恪盧守勤忠憲梁和榮恪郝隨恭僖王中正恭敏裴詵恭節馮丗寧勤惠王仲榮節康履大中祥符間章聖祀汾隂至泰山下聚觀者幾數八十萬人闐擁道路警蹕不能進上以詢左右或云村民所畏者尉曹也俾彈壓之即命亟召之少焉一緑衣少年躍馬疾馳而前羣氓大呼官人來矣八一奔走辟易而散上笑云我不是官人邪王嵎季夷云樊若水夜釣采石丗多知之宋咸笑談録云李煜有國日樊若水與江氏子共謀江年少而黠時李主重佛法即削髮投法眼禪師為弟子隨逐出入禁苑因遂得幸佛眼示寂代其住持建康清涼寺號曰小長老眷渥無間凡國中虛實盡得之先令若水走闕下獻下江南之䇿江為內應其後李主既俘各命以官江後纍典名州家于安陸子孫亦無聞鄭毅夫為江氏書目記載文集中云舊藏江氏書數百卷缺落不甚完豫凡三歸安陸大為搜訪殘秩墜編往往得之閭巷間無遺矣僅獲五百十卷通舊藏凡千一百卷江氏遺書具此矣江氏名正字元叔江南人太祖時同樊若水獻䇿取李氏仕至比部郎中嘗為越州刺史越有錢氏時書正借本謄寫遂并其本有之及破江南又得其逸書兼吳越所得殆數萬卷老為安陸刺史遂家焉盡輦其書築室貯之正既殁子孫不能守悉散落於民間火燔水溺鼠蟲齧棄并奴僕盜去市人裂之以籍物有張氏者所購最多其貧乃用以為㸑凡一篋書為一炊飯江氏書至此窮矣然余家之所有幸而僅存者蓋自吾祖田曹始畜之至豫三世矣於余則固能保有之於其後則非余所知也然物亦有數或存或亡安知異日終不亡哉故記盛衰之迹㑭子孫知其所自則庶乎或有能保之者矣書多用油拳𥿄方册如笏頭青縑為褾字體工拙不一史記晉書或為行書筆墨尤徑其末用越州觀察使印亦有江氏所題余在杭州命善書者輔其缺未具也明清案馬令作南唐書及龍衮作江南野史云北朝聞李後主崇奉釋氏隂選少年有經業口辨者往化之謂之一佛出丗號為小長老朝夕與論六根四諦天堂地獄循環果報又説令廣施𣑽剎營造塔像身𬒳紅羅銷金三事後主因讓其太奢乃曰陛下不讀華嚴經爭知佛冨貴自是襟懷縱恍兵機守禦之謀慌然而弛帑廪漸虛財用且竭又使後主於牛頭山大起蘭若千間聚徒千衆旦暮設齋食無非異方珍饌一日食之不盡明旦再具謂之折倒時議謂折倒為煜之讖及大兵至獲為營署北朝又俾僧於采石磯下卓庵自云少而草衣木食後主遣使賫供獻以往佯為不受乃隂作通穴及纍石為塔闊數圍髙迫數丈而夜量水靣及王師尅池州而浮梁遂至繫于塔穴以渡南北不差毫釐師徒合圍召小長老議其拒守對曰臣僧當揖退之於是登城大呼而旨麾兵乃小却後主喜令僧俗兵士誦救苦觀音菩薩滿城沸湧未幾四靣矢石雨下士民傷死者衆後主復使呼之託疾不起及誅皇甫繼勳之後方疑無驗乃鴆而殺之觀宋鄭所記則知李氏國破之際所鴆者非真又以計免而歸八二本朝遂叨嶽牧之任也三朝史孟昶傳云其在蜀日改元廣政周丗宗既取秦鳳昶懼致書丗宗自稱大蜀皇帝丗宗怒其抗禮不答其書真迹今藏樓大防所用録于左七月一日大蜀皇帝謹致書于大周皇帝閣下竊念自承先訓恭守舊邦匪敢荒寧于兹二紀頃者晉朝覆滅何建來歸不因背水之戰爭遂有仇池之土地泊審遼君歸北中國且空暫興敝邑之師更復武都之境下闕數字實為下國之邊陲其後漢主徑自并汾來都汴浚聞征車之未息尋神器之有歸伏審貴朝先皇帝應天順人繼統即位奉玉帛而未克承弓劒之空遺但傷嘉運之難諧適歎新歡之且隔以至前載忽勞睿德逺舉全師土疆尋隸於大朝將卒亦拘於貴國幸蒙皇帝惠其首領頒以衣裘偏禆盡捕其職貟士伍遍加於糧賜則在彼無殊於在此敝都寧比於雄都方懷全活之恩非有放還之望今則指揮使蕭知逺馮從讜等押領將士子弟共計八百九十三人巳到當國具審皇帝􅒯開仁愍深念支離厚給衣裝兼加巾屨給沿程之驛料散逐分之緡錢仍以貟僚之回還安知所報此則皇帝念疆埸則巳經革幾代舉干戈則不在盛朝特軫優容曲全情好永懷厚義常貯微衷載念前在鳯州支敵虎旅偶於行陳曾有拘擒其排陳使胡立巳下尋在諸州安排及令軍幕收管自來各支廪食並給衣裝却緣比者不測宸襟未敢放還鄉國今既先蒙開釋巳認沖融歸朝雖愧於後時報德未稽於此日其胡立巳下今各給鞍馬衣裝錢帛等專差御衣庫使李彥昭部領送至貴境望垂宣旨收管矧以昶昔在齠齓即離并都亦承皇帝鳳起晉陽龍興汾水合敘鄉關之分以陳玉帛之歡儻蒙惠以嘉音即佇專馳信使謹因胡立行次聊陳感謝詞莫披述伏惟仁明洞垂鑒念不宣明清嘗跋其後云歐陽文忠公五代史丗家序云蜀嶮而冨故其典章粲然此書文亦竒尤先生所謂豈非出於丗修降表李昊斯言信歟頃歲姚令威注五代史惜乎不見是卷也國朝以來父子兄弟叔姪以名望顯著薦紳間稱之八三於一時者如二吕正獻端左丞餘慶二竇可象儀望之儼二孫次公何鄰幾僅二宋元憲庠景文祁二錢子髙彥逺子飛明逸二蘇才翁舜元子美舜欽二吳正肅育正憲充二程眀道先生皓伊川先生頥二章莊敏楶申公悙二張橫渠先生載天祺戩二邵安簡亢不疑必二蔡元長京元度卞二鄭德夫久中逹夫居中二鄧子能洵仁子常洵武三陳文忠堯叟文惠堯佐康肅堯咨三蘇文安先生洵文忠軾文定轍三沈存中括文通溝睿逹遼三王荆公安石平父安國和父安札三孔經父文仲常甫武仲毅甫平仲三曾南豐先生鞏文肅布文昭肇三韓康肅絳持國維莊敏縝三范蜀公鎮子功百祿淳夫相禹三劉邍父敞贛父攽仲馮奉丗八四是也太宗實録淳化五年五月李順之平帶御器械張舜卿奏事言臣聞順巳遁去諸將所獲非也太宗云平賊才數日汝何從知之徒欲害人功爾上怒叱出將斬之徐曰前代帝王暴怒殺人正為此輩然其父戍邊以死遂貰之但罷近職舜卿父訓為定逺軍節度使卒於鎮故上念之明清後觀沈存中筆談云蜀中劇賊李順陷劒南兩川關右震動朝廷以為憂後王師破賊梟李順收復兩川書功行賞了無間言至景祐中有人告李順尚在廣州巡檢使臣陳文璉捕得之乃真李順也年巳七十餘推驗明白囚赴闕覆按皆實朝廷以平蜀將士功賞巳行不欲暴其事但斬順賞文璉二官仍除閣門祗候文璉家有李順案𣢾本末甚詳順本蜀江王小波之妻弟始王小波反於蜀中不能撫其徒衆乃共推順為主順初起悉召鄉里冨人大姓令具其家所有財粟據其生齒足用之外一切調發大賑貧乏録用材能存撫良善號令嚴明所至一無所犯時兩蜀大飢旬日之間歸之者數萬人所向州縣開門延納傳檄所至無復完壘及敗人常懷之故順得脫去三十餘年乃始就戮如此則當平蜀時逃去無可疑矣信知盜亦有道焉然舜卿非太宗之全宥則刑歸於濫矣頃見王仁𥙿洛城漫録云張全義為西京留守識黃巢于羣僧中而陶榖五代亂紀云巢既遁免祝髮為浮屠有詩云三十年前草上飛鐵衣著盡著僧衣天津橋上無人問獨倚危欄看落暉又僧史言巢有塔在西京龍門號翠微禪師而丗傳巢後住雪竇所謂雪竇襌師即巢也然明州雪竇山有黃巢墓歲時邑官遣人祀之至今而太平廣記載則天時宋之問謫官過杭州遇駱賔王于靈隱寺披緇在大衆中與之問詩有樓觀滄海日門枕浙江朝之句唐夷堅集言南嶽寺僧見姚泓五季泛聞録云太祖仕周受命北伐以杜太后而下寄于封禪寺抵陳橋推戴韓通聞亂亟走寺中訪尋欲加害焉主僧守能者以身蔽之遂免太祖德之即位後極眷寵之年八十餘臨終語其弟子曰吾即澤州明馬兒也馬兒五代之巨寇也贊寧續傳載云開寶末江州圎通寺旦過竂中有客僧將寂滅袒其背以示其徒有雕青李重進三字云我即其人脫身煙熖至于今日而近日陸務觀清尊録言老內侍見林靈素于蜀道季次仲季自云嘗遇姚平仲于廬山授其八段錦之術未知果否要是桀黠之徒多能逃命於一時皆此類文璉洪進八五之子也真宗實録召試神童蔡伯俙授官之後寂無所傳明清因於故書中得其奏狀一紙今録于此司農少卿管勾江州太平觀蔡伯俙奏臣輒陳愚懇仰瀆睿聰退省愆尤甘俟竄殛臣見係知州資任乞管勾宫觀奉勑授前件差遣於舒州居住自熙寧八年八月三日到任伏念臣先於太中祥符八年真宗皇帝遣內臣毛昌逹宣召賜對試誦真宗皇帝御製歌詩即日蒙恩釋褐授守祕書省正字臣遭遇之年方始三歲及賜臣御詩云七閩山水多才俊三歲竒童出盛時終篇後批閠六月十五日勑賜見刋刻在本家收祕續蒙宣赴東宫侍仁宗皇帝讀書朝夕親近頗歷歲年以臣父龜從進士及第臣幼小難以住京因乞將帶出外又蒙恩賚優渥其後臣年一十七歲以家貧陳乞差遣仁宗皇帝聖念矜憐特依所乞仍有旨餘人不得援例自兹纍歷任使今來本任至來年二月當滿切念臣幼稚幸會效官從事勉勵愚拙今巳白首重念臣生事蕭條纍族重大又無得力兒男可以供侍一日捨祿無以為生幸遇皇帝陛下至仁至治無一物失所其於老者惠恤尤深臣以祥符八年三歲甲子庚申節未至衰老欲望聖慈特賜許臣再任管勾江州太平觀一任覬仍廪稍得飬單貧祗飭閨門相傳忠孝庶幾輔報以盡餘齡候勑旨蓋元豐初計其年尚未七十司農少卿今之朝議大夫也碌碌無所聞豈非聰明不及於前時邪御詩明清偶記其全篇七閩山水多才俊三歲竒童出盛時家丗應傳清白訓嬰兒自得老成姿初當移步來朝謁方及能言便誦詩更勵孜孜圖進益青雲千里看前期後閲朱興仲續歸田録云伯俙字景蕃與晏元獻俱五六歲以神童侍仁宗於東宫元獻自初梗介蔡最柔媚每太子過門闌髙者蔡伏地令太子履其背而登既踐祚元獻被知遇至宰相蔡竟不大用以舊恩常領郡頗不循法令或被劾取旨上識其姓名必曰藩邸舊臣且令轉官凡更四朝元符初致仕巳八十歲矣監司薦之乞落致仕與宫祠其辭略云蔡伯俙年八十歲食祿七十五年余謂人生名位固可得八六罕得綿長如此者以上朱録中語因併載之張耆既貴顯嘗啓章聖欲私第置酒以邀禁從諸公上許之既晝集盡歡曰更願畢今夕之樂幸母辭也於是羅幃翠幕稠疊圍繞繼之以燭列屋蛾眉極其殷勤豪侈不可狀每數杯則賔主各少愒如是者凡三數諸公但訝夜漏如是之永暨至徹八七席出户詢之則云巳再晝夜矣朱新仲言韓忠憲億景祐中參仁宗政事天下稱為長者四子仲文綜子華絳持國維玉汝縝俱禮部奏名忠憲啓上曰臣子叨陛下科第雖非有司觀望然臣既備位政府豈當受而有之天下將以謂由臣故致此臣雖不足道使聖明之政人或以議之非臣所安也臣教子既巳有成又何必昭示四方以為榮觀哉乞盡免殿試唱第幸甚誠懇再三上嘉歎而允所請忠憲既薨仲文子華玉汝相繼再中科甲獨持國曰吾前巳奏名矣當遵家君之言何必布之逺方耶不復更就有司之求故文潞薦持國疏云曾預南宫髙薦從不出仕宦其後子文知制誥子華玉汝皆登宰席持國賜出身至門下侍郎為本朝之甲族云玉隆外祖云韓元吉著桐隂舊話却不及此揮麈後録卷之五
