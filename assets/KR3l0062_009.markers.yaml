  - {type: variant, offset: 5894, length: 1, content: 四, WYG: 幽厲孝子慈孫百世不能易三代以來君臣務取美稱遂至失實國朝諸諡宋常山退朝録備載之止於熙寧三年明清謹續之於後然聞見未廣姑存所記憶遺落尚多當嗣益之后諡慈聖光獻宣仁聖烈昭慈聖獻昭懷欽聖獻肅欽成欽慈顯恭顯肅顯仁明節憲節憲聖慈烈成穆成恭妃諡昭靜沈貴妃明達懿文後追冊爲明達皇后明節和文後追冊爲明節皇后靖淑王賢妃太子諡沖憲茂元懿敷莊文愭諸王諡端獻吳王顥端懿益王頵沖僖檉悼敏楫沖穆材哀獻俊沖厚僴惠价沖惠倜公主諡賢惠蜀國公主王晉卿室賢穆韓嘉彥室賢德懿行王師約室賢穆明懿錢景臻室賢惠張端禮室賢靜柔志公主淑和端福公主沖懿賢福公主悼穆㣲福公主順穆介福公主宗室諡恭憲世雄恭孝宣旦仲湜士緘克寛榮穆宗暉僖簡宗景康孝仲御僖靖承裕僖安仲汾恭僖宗博僖穆宗璞和恭承顯康僖克戒勤孝宗惠敦和克和僖惠宗隱宗勉修安克敦孝靖宗綽簡獻仲忽安憲宗悌士孝恪仲芮敦恪仲操良僖仲嬰世恩叔嶠孝僖宗衮仲癸僖惠仲隗榮思宗諤孝良仲臯令蘧修簡仲萉和僖仲防欽修仲碩榮孝仲嗟仲革孝穆世瓞惠孝仲佺孝修世奬令穆孝恪世膺全稼安恪仲玘孝簡世輝順思仲􅍀孝恪仲摻孝恭世恪世恬敦孝仲越孝敦仲僕恭惠叔􅀈純僖仲麗惠和檢之忠孝世表叔武叔充榮惠世設良恪克章叔珫令瓘安良世括容孝叔亞惠恭世采榮恪叔雅叔黔恭宜世鳴榮敏叔縱良恭世亨良憲叔敖益世逢孝敏士會思裕叔安莊靖叔苖莊節叔炤温獻令圖良裕士空忠敏令穰孝榮令鐸良懿令瑤安惠世顒安僖秀王温靖士俴恭靖士㒟不微士樽襄靖令懬文獻令祉忠靖士珸康宗旦宰相諡宣靖曾魯公公亮忠獻韓魏王琦文忠富韓公弼張天覺商英忠烈文潞公彥博正獻吕申公公著忠肅劉同老摯虞并武允文正愍吕汲公大防忠宣范堯夫純仁忠懷蔡持正確文恭王禹玉珪正憲吳沖卿充莊敏韓玉汝縝文定韓儀公忠彥文王荆公安石獻肅陳秀公升之文憲劉德初正夫何清源執中文正司馬温公鄭達夫居中清憲趙正夫挺之文肅曾魯公布忠穆吕成公頤浩文和李士美邦彥忠定李伯紀綱伯汪廷俊彥文恭陳魯公康伯正獻陳福公俊卿文惠洪景伯适史直翁浩文靖梁叔于克家文忠京丞相鏜執政諡文憲蘇公易簡文定張太保方平許公將文忠歐陽太師修清獻趙少保抃康靖趙叔平槩章簡元厚之絳張子公燾簡翼張公璪修簡胡公宗愈莊定王正仲存恭敏蒲傳正宗孟定簡温虞弼益忠定孫傳忠穆郭公逵張公懿安簡邵公亢襄敏王公韶康懿何中正康節張公昇忠肅陳公過庭文敏吕吉父惠卿李漢老邴恭愍聶昌恭敏嶭公向獻簡傅公堯俞敏肅蔡公挺懿簡趙天觀瞻温靖孫公固莊敏章公楶文節林子中希文簡張康國鄧洵武文正蔡元度卞忠憲种公師道忠肅劉立道大中忠文張􅄞仲叔夜李彥穎文懿管歸善師仁安惠鄧聖求温伯忠武韓蘄王世忠忠烈張循王俊忠獻胡成公世將敏肅魏道弼良臣忠武岳公飛敏節王子尚庶章簡張彥程元籲正綱克俊忠敏沈必克與永莊定劉共父珙莊簡李泰發光簡穆辛􅂒李次膺簡惠周敦義葵莊敏汪明逺徹文安洪景嚴遵安簡王公剛中榮敏謝開之廓然􅉖節王正道倫文臣諡文穆范成大忠文范蜀公鎮宋尹喬年文恪王中丞陶章敏滕元發甫懿恪王宣徽拱辰文憲强翰林淵明洪尚書擬文簡蔡鯈昌程大宣簡李浦邦彥父忠􅉖徐給事禧水李侍郎若忠憲耿傳忠毅向子韶忠簡張克戩趙令㡬胡邦衡銓張大猷闡忠顯劉公韐文昭曾翰林肇莊節王復恭􅉖錢歸善唐重定􅉖胡唐老威􅉖鄭驟霖澤宗汝剛􅉖曾逢原孝序文靖楊侍郎時文定胡待制安國忠襄楊邦乂勇節郭永莊敏藺中謹韓彥直子温林栗黃中忠壯章且叟􅁩康節邵先生雍節孝徐仲車積忠定劉元城安世文康葛銀青勝仲忠惠蔡君謨襄文忠東坡先生忠宣洪光弼皓獻簡陳邦彥良翰獻肅胡周伯沂文張大經彥康肅吳明可芾文清曾吉父㡬忠肅陳瑩中瓘傅公晦察忠介王子飛雲清敏豐相之稷清孝葛君書思僖敏張如瑩澄賢節王庠忠鄒志完浩忠確張公克戩僖簡莊公徽肅愍宇文虛中節肅龔彥和夬文惠韓公粹彥文僖姚祐夀祖忠敏任德翁伯雨惠懿楊子寛偰武臣諡忠愍髙永年武莊郝質武恪賈逵忠敏姚麟武愍劉法忠節李彥仙忠壯徐徽言李邈馬彥博穆武髙繼勲恭勇楊惟忠勤惠王德恭勤毅宋守約康理楊應詢康簡髙敦復威肅劉仲武勇節郭永忠勇蘇緘武安吳玠武順吳璘莊􅉖种師中毅肅劉公昌祚忠介楊宗閔恭毅楊震武恭楊存中剛烈劉位忠朱沖勤威馮守信武僖劉光世武穆劉錡忠烈趙立義節王忠植莊敏王厚毅勇闗師古壯愍曲端襄毅楊政外戚諡恭敏李端慤王師約壯恪劉永年惠節向傳範康懿向經良僖劉安民榮穆劉從愿良顯王憲榮縱向宗回榮僖髙公繪}
