front:
  text: 揮麈後録卷之二三十汝隂王明清宣和中燕諸王于禁中髙宗以困於酒倦甚小愒
  hash: sha256:6fdf5cfff53c836ad051f0e28f39bfe9d6181423152bd44958f9791e47d94815
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_007-1a}
body:
  text: 幄次徽宗忽詢康王何往乎左右告以故徽宗幸其所視之甫入即返驚鄂默然內侍請于上上云適揭簾之次但見金龍丈餘蜿蜒榻上不欲呼之所以亟出歎息久之云此天命也繇是三一異待焉趙士籛彭老云髙宗嘗語吕頥浩云朕在宫中每天下奏案至莫不熟閲再三求其生路有至夜分卿可以此意戒刑寺官凡於治獄切當留心勿草草頥浩再拜贊即三二以上旨喻之薑安禮處恭云曹功顯勛語明清云昨從徽宗北狩至燕山逃歸顯仁令奏髙宗曰上為康王再使虜中欲就鞍時二后洎宫人送至廳前有小婢招兒者見四金甲人狀貌雄偉各執弓劒擁衛上體婢指示衆雖不見然莫不畏肅后即悟曰我事四聖香火甚謹必其隂助今陷虜中愈當虔事自後夜深必四十拜止更令奏上冝嚴祟奉以答景貺髙宗後跓蹕臨安即詔於西湖建觀像設以祀甚為壯麗又云后未知上即位嘗用象戲局子褁以黃羅書康王字貼於將上焚香禱曰今三十二子俱擲於局若康王字入九宫者必得天位一擲其將子果入九宫他子皆不近后以手加額喜甚即具奏徽廟大喜復謂后曰瑞卜昭三三應異常可無慮矣元符末掖廷訛言祟出有茅山道士劉混康者以法籙符水為人祈禳且善捕逐鬼物上聞得出入禁中頗有驗崇恩尤敬事之寵遇無比至於即其鄉里建置道宫甲于宇內祐陵登極之初皇嗣未廣混康言京城東北隅地叶堪輿倘形勢加以少髙當有多男之祥始命為數仞岡阜巳而後宫占熊不絶上甚以為喜繇是崇信道教土木之工興矣一時佞幸因而逢迎遂竭國力而經營之是為艮嶽宣和壬寅歲始告成御製為記云京師天下之本昔之王者申畫畿疆相方視址考山川之所會占隂陽之所和據天下之上遊以會同六合臨觀八極故周人胥字於𡵨山之陽而又卜澗水之西秦臨函谷二殽之關有百二之嶮漢人因之又表以太華終南之山帶以黃河清渭之川宰制四海然周以龍興卜年八百秦以虎視失於二丗漢德弗嗣中分二京何則在德不在嶮也昔我藝祖撥亂造邦削平五季方是時周京市邑千門萬肆不改棄之而弗顧漢室提封五方阻山浮渭屹然尚在也捨之而弗都于胥斯原在浚之郊通逹大川平臯千里此維與宅故今都邑廣野平陸當八逹之衝無崇山峻嶺襟帶於左右又無洪流巨浸浩蕩洶湧經緯於四疆因舊貫之居不以襲嶮為屏且使後丗子孫丗丗修德為萬丗不拔之基垂二百年于兹祖功宗德民心固於泰華社稷流長過於三江五湖之逺足以跨周軼漢蓋所恃者德而非嶮也然文王之囿方七十里其作靈臺則庶民子來其作靈沼則於仞魚躍髙上金闕則玉京之山神霄大帝亦下遊廣愛而海上有蓬萊三島則帝王所都仙聖所宅非形勝不居也傳曰為山九仞功虧一簣是山可為功不可書於是太尉梁師成董其事師成博雅忠藎思精志巧多才可屬乃分官列職曰雍曰琮曰琳各任其事遂以圖材付之按圖度地庀徒僝工纍土積石畚插之役不勞斧斤之聲不鳴設洞庭湖口絲溪仇池之深淵與泗濵林慮靈壁芙蓉之諸山取瓌竒特異瑶琨之石即姑蘇武林明越之壤荆楚江湘南粵之野移枇杷橙柚橘柑榔栝荔枝之木金蛾玉羞虎耳鳯尾素馨渠郍末利含笑之草不以土地之殊風氣之異悉生成長飬於雕欄曲檻而穿石出罅岡連阜屬東西相望前後相續左山而右水後溪而旁隴連綿彌滿吞山懷谷其東則髙峰峙立其下則植梅以萬數緑蕚承趺芬芳馥􆇿結髙宗廟諱山根號蕚緑華堂又旁有承嵐崑雲之亭有屋外方內圎如半月是名書館又有八仙館屋圎如規又有紫石之岩祈真之嶝攬秀之軒龍吟之堂清林秀出其南則壽山嵯峨兩峯並峙列嶂如屏瀑布下入鴈池池水清泚漣漪鳬鴈浮泳水靣棲息石間不可勝計其上亭曰噰噰北直絳霄樓峯巒崛起千疊萬復不知其幾千里而方廣無數十里其西則參术𣏌菊黃精芎藭𬒳山彌塢中號藥寮又禾麻菽麥黍豆粳秫築室若農家故名西莊上有亭曰巢雲髙出峰岫下視羣嶺若在掌上自南徂北行岡脊兩石間綿亘數里與東山相望水出石口噴薄飛注如獸靣名之曰白龍沜濯龍峽蟠秀練光跨雲亭羅漢岩又西半山間樓曰倚翠青松蔽密布于前後號萬松嶺上下設兩關出關下平地有大方沼中有兩洲東為蘆渚亭曰浮陽西為梅渚亭曰雲浪沼水西流為鳯池東出為研池中分二館東曰流碧西曰環山館有閣曰巢鳯堂曰三秀以奉九華玉真安妃聖像東池後結棟山下曰揮雲廳復由嶝道盤行縈曲捫石而上既而山絶路隔繼之以木棧木倚石排空周環曲折有蜀道之難躋攀至介亭最髙諸山前列巨石凡三丈許號排衙巧怪嶄巖藤蘿蔓衍若龍若鳯不可殫窮麓雲半山居右極目蕭森居左北俯景龍江長波逺岸彌十餘里其上流注山間西行潺湲為漱玉軒又行石間為煉丹凝亭觀圌山亭下視水際見髙陽酒肆清斯閣北岸萬竹蒼翠蓊欎仰不見明有勝筠庵躡雲臺蕭間館飛岑亭無雜花異木四靣皆竹也又支流為山莊為回溪自山蹊石罅搴滌下平陸中立而四顧則岩峽洞穴亭閣樓觀喬木茂草或髙或下或逺或近一出一入一榮一雕四向周匝徘徊而仰顧若在重山大壑幽谷深巖之底而不知京邑空曠坦蕩而平夷也又不知郛郭寰會紛華而填委也真天造地設神謀化力非人所能為者此舉其梗槩焉及夫時序之景物朝昏之變態也若夫土膏起脈農祥晨正萬類胥動和風在條宿凍分沾泳渌水之新波𬒳石際之宿草紅苞翠蕚爭笑並開於煙瞑新鶯歸燕呢喃百轉於木末攀柯弄蘂藉石臨流使人情舒體墮而忘料峭之味及雲峯四起列日照耀紅桃緑李半垂間出於密葉芙蕖􅔽蓞薵蓼芳苓搖莖弄芳倚縻於川湄蒲菰荇蕖茭菱葦蘆沿岸而泝流青苔緑蘚落英墜實飄巖而鋪砌披清風之廣莫蔭繁木之餘隂清虛爽塏使人有物外之興而忘扇箑之勞及一葉初驚蓐收調辛燕翩翩而辭巢蟬寂寞而無聲白露既下草木搖落天髙氣清霞散雲薄逍遙徜徉坐堂伏檻曠然自怡無蕭瑟沉寥之悲及朔風凛冽寒雲暗幕萬物調踈禽烏縮漂層氷峨峨飛雪飄舞而青松獨秀於髙巔香梅含華於凍霧離榭擁幕體道復命無歲律云暮之歎此四時朝昏之景殊而所樂之趣無窮也朕萬機之餘徐步一到不知崇髙貴冨之榮而騰山赴壑窮深探嶮緑葉朱苞華閣飛升玩心愜志與神合契遂忘塵俗之􅌭紛而飄然有凌雲之志終可樂也及陳清夜之醮奏𣑽唄之音而煙雲起於巖竇火炬煥於半空環珮雜遝下臨於修塗狹徑迅雷掣電震動於庭軒户牖既而車輿冠冕往來交錯嘗甘味酸覽香酌醴而遺瀝墜核紛積床下俄頃揮霍騰飛乘雲沉然無聲夫天不人不因人不天不成信矣朕履萬乘之尊居九重之奧而有山間林下之逸澡溉肺腑發明耳目恍然如見玉京廣愛之舊而東南萬里天台鴈蕩鳯凰廬阜之竒偉二川三峽雲夢之曠蕩四方之逺且異徒各擅其一美未若此山并包羅列又兼其絶勝颯爽溟涬參諸造化若開闢之素有雖人為之山顧豈小哉山在國之艮故名之曰艮嶽則是山與泰華嵩衡等同固作配無極壬寅歲正月朔日記又命睿思殿應制李質曹組各為賦以進質云宣和四年歲在壬寅夏五月朔艮嶽告成命小臣質恭詣作古賦以進臣俯伏惴栗懼學術荒陋不足以奉詔正衣冠屏息竊誦宸製如日月照映至於經營終始與其命名之意義備載奎文使執筆之臣徒震汗縮伏辝其不能雖然臣之榮遇千載一時敢不祗若休命於是虛心滌慮再拜稽首而獻賦焉其詞曰偉兹嶽之宏厚兮固磐基於坤軸跨穹隆之髙標兮俯萬象於林麓一氣肇其吐吞兮割隂陽於晦昱信天造而地設兮行聖心之神欲相美利於艮維兮膺億載之假福允定命以匹休兮同澗瀍之乃卜惟重熙兮纍洽固帝祚之無疆繄浚都之是宅陋周原之匪臧誠體國之有制擬形勢而辨方伊岡聮與阜屬翼慶瑞兮綿長仰黃屋之非心融至道以垂裳即崇山之奧區翳薈鬱其蒼蒼紛川澤之沮洳限江湖之渺茫類曾城與丹丘仍飈馭之求翔鳴遼鶴於晝寂嘯巴猿於夜決靄煙霞之超絶殆未邈乎康莊時萬機之餘暇頓六轡以髙驤逸天步之轍迹怡聖情而弗忘俾飛雲以川泳均草木之有光軒重闉之敞敞植梅桃以時岡挺八仙之桂檜漲潤氣以疏香屹舞手之竒石導風𬒮以前鄣仰奎文之聖述如震栗乎春雷兼虞商之渾灝類雲漢之昭回蟣虱之臣不敢久以伏讀兮一再誦而心開燦八龍之神藻覺虎卧之煤埃惟明光之絢練永作鎮於鈞臺俄北行而少進驚泛雪之虛闢屏分翠緑以雙抗兮沃泉中湛而凝碧伊留雲與宿霧佐清致於瑶席飲甌靣之瓊膄貯風生於兩腋登和容於射圃􅋏弧矢之神威流芳馨於素華且舒笑而忘歸撫跨雲之欄楯驚倚翠之翬飛陟半山而前矚虛廡亘其繩直聳凝觀而北列視鑑湖之湜湜忽峥嶸而環合想圌山之嘉色敞玉霄之閟洞仙真過而寓息兾煉丹以服餌生身體之羽翼闢瓊津與清斯望龍江而西東何茂修之夾植中演漾而溶溶覿山莊之派別引回徯而曲通挹飛岑於秀發倚躡雲之崇崇虛蕭間之邃宇貯毫楮於厥中延勝筠之宿潤發五蓋之遊蒙無雜卉以周布端此君之迎逢委檜隂之修徑出髙陽之酒亭奉千鍾之湛露傾葵藿於堯齡欲洗練其神宅耳漱瓊之泠泠度金霞而矯首介亭屹其上征險年腸於九折升雲棧而心驚有排衙之巨石間珍木之敷榮為巉妙之絶巘類簫臺之玉京冝帝真之下墮後電掣而雷鳴繼神光之燭壇響環珮之琮琤何天人之無間本皇上之精誠路逶迤而東轉經極目之蕭森下來禽之茂嶺披合歡之華林始祈真於磴杪終欖秀於軒隂啓龍吟之虛堂靣紫石之髙壁分竹齋於向背沸不老之泉液愛揮雲之翔鱗若騰躍於天地踰萬松之峻嶺設兩關而嶔﨑垂濯龍之瀑布與蟠秀而東馳憩練光以容與仰竒峯而登躋矧梅蘆之二渚結雲浪與浮陽俄就夷而絶嶮復淵澄而沼方池名鳯以號硯乃餘波之洋洋既流碧之霞錯又環山之翼張嚴宏堂之三秀奉九華之玉真悵白雲之巳逺追音徽之尚存壯阿閣以巢鳯擁萬木之巖春何漣漪之颯爽仰拱霄之是鄰覿書館之幽致擅著古之佳名極驚蛇而走虺知草聖之縱橫臨清流而喜賦鄙秋風之淫聲揭崑雲兮承嵐相岧嶤而抗衡彼會真之髙館總羣玉之邃清儼踈梅之盈萬常沐雨而披煙儷氷姿於蕚緑非取媚而爭妍駭白龍之噴激落銀漢於九天方巢雲之入望亘黃果之綿連登絳霄以遊目聳萬壽之南山㵼烏龍之垂霤注鴈池於石間企噰噰之峻亭諒絶塵而可攀欣藥寮之西闢藴丹華之秀巖羅玉芝與雲桂産南燭之非凡下丁香之密徑有間植之松杉嗟禾麻兮菽麥蓻黍稷兮惟艱開西莊以務本信農事之匪間俯明秀之傑閣晞梅岩及春華偃霜風之老檜跋鳯翼之欹斜蔭檀欒之藝館豁凝思之雅堂備上臺之珍文若星燦而霞章臣蓋聞赤縣神州之説方壼貟嶠之言既不周之具載亦同紀於崑崙定洪荒之無考冝姑置而勿論窮山川於疇昔效子長之飛蹇登岱宗而佇貽嘗歷井於天門瞻巍然之日觀視鳬繹之駿奔維祝融之巨鎮欎紫蓋之竒峯摽赤城而霞起滴九疑之翠濃觀羅浮與鴈蕩望廬阜之橫空陟嵩髙之峻極有二室之重巒森峩峩之太華若秀色之可餐聳天平於林慮睇王屋之仙壇何諸山之環異均賦美於一端豈若兹嶽神模聖作揔衆德而大備冨千嵓兮萬壑何小臣之榮觀忽承詔而駭愕捨蓽門之圭竇詣鈞天之廣樂驚蓬心與蒿目蕩􅎍次之煩濁欲粗窮其勝槩徒喙息乎林薄蜂房櫛比視閭閻也垤蟻往來觀市人也縈紆如線貫汲流也布算縱橫俯阡陌也纍塊積蘇羅層臺也翾飛蚊聚聽輪迹也其體穹崇旁日月也其用浩博行變化也塵翳翳以電掃兮雲溶溶而承字既崛起以崷崒兮又盤互而深阻逺而望之則或抗戾以分暌或附從而黨伍或然而仰或偃然而俯或相蹲踞或相旁午迫而視之則或如躍龍或如虎或若會同之冠冕或若隱翳之環堵或引援而維持或參差而齟齬或名三竒或號太古萬形千狀不可得而備舉也而又瑕石詭暉嶙峋巉巖靈壁之秀發於淮之北太湖之異來自江之南伏犀抱犢紫金之峯凌雲透月瓊玉之嵓遂根拏而固結成聳翠之煙嵐植湘水之丹橘列洞庭之黃柑盈待鳯之椅梧聳負霜之楩柟篔簹䈽篾橚矗以森萃青綸紫熒曄曄而髿鬖遂凌岑而跨谷仰締􅌟於其間虹梁並亘旅楹有間嘉玉舄之輝潤睇雲楯之爛班臨飛陛之揭孽渺平波之汪灣艤青翰投丈竿却龍舟而弗御規就橋而處安得元珠於赤水仰神聖之在宥推無為於象先擴堯仁之天覆且帝澤之旁流復上昭而下漏冝乎絶珠殊祥駢至迭輳潛生沼之丹魚萃育藪之皓獸神爵棲其林麒麟臻其囿屈軼茂而蓂莢滋紫脫華而朱英秀何動植之休嘉表自天之多祐臣又聞積水成淵而蛟龍生積土成山而風雨興皆物理之自然豈人力之所能蓋嘗觀雲氣之靄靄時出沒而相仍作寰區之潤澤肇五榖之豐登霈為霖而復斂抱虛壁之層層舉兹山之盡美渠可得而誦稱爾乃或遐矚以寄情或周覽以託興衆彩迭耀臣目迷而不能得視羣籟互鳴臣耳惑而不能得聽何神用之莫測使凡氣之無定品物流形各正厥命如文王之在靈臺民樂其有德武王之居鎬京物不失其性豈若左太華而右褒斜為長楊之誇南丹水而北紫淵為上林之盛而巳哉夫昔唐堯訪四子於藐姑射之山周穆賔西王母於瑶池之上是皆篤要妙而有輕天下之心務逸舉而有和雲謡之唱蓋翠華之逺遊徒赤子之在望惟吾皇之至神擴廣愛之遐想曾何逺於九重邁蓬瀛之清賞得忠嘉之信臣協規制於明兩罄丹𣢾以爰謀念賢勞之鞅掌迄成功於九仞説見知於天獎凡經營於六載之間而為萬丗無窮之休豈不廣哉曹組云臣伏蒙聖慈宣示李質所進艮嶽賦特命臣繼作顧臣才短學踈豈能仰副睿旨進退皇懼不知所裁謹齋心百拜以賦其辭曰客有遊輦轂之下以問京師之主人曰東北之隅地勢綿連岡嶺秀深氣象萬千不知何所而乃如此焉主人曰國家壽山子孫福地名曰艮嶽客曰蓋聞五星在天五嶽在地東有泰山甲於區宇下臨滄溟旁跨齊魯南有衡山祝融紫蓋湘潭為址九向九背西有太華三峯插天枕瞰函谷橫斜渭川北則常山以限天驕太河朔漢仰其岧嶤中則嵩髙與天峻極襟帶河洛屏翰京國復見兹於中都何前此而未識且山嶽之大天造地設開闢之初元氣凝結是豈人為願聞其説主人曰清濁既分爰其隂陽播之大鈞孰為主張是必造物區處維綱今以一人之尊大統華夏宰制萬物而役使羣衆阜成兆民而道濟天下夫惟不為動心侔於造化則兹嶽之興固其所也而况水浮陸走天助神相凡動之呇來萬物之享上故適再閠而歲六周星萬壑千巖芳菲丹青之寫圖障也客曰嶽有五焉今益其一在於五行數則差失主人曰客不聞五行在天乃六氣君火以名相火以位寒暑運行曾無越次矧此有形創於神智生生不窮悠逺之義然則五嶽視三公之官艮嶽為多男之地乃其冝也夫何擬議客首肯久之曰吾見乎嶽之外矣吾聞乎嶽之説矣獨有未詳孰知其中蓋禁鑰十二皇居九重深嚴祕奧內外莫通願子陳其次弟庶幾因以形容主人唯唯曰其大則可以槩舉其細則莫能縷數唯乘輿有時臨幸雖山嶽亦類於庭廡請先陳其嵓谷岡巒之體勢後狀其樓觀池臺之處所皆聖作而神𫐠盡宏規而傑矩夫艮者八卦之列位嶽者衆山之惣名髙為峯則秀拔拱為岫則崢嶸霽色晚靜風光曉凝陟崔嵬而直上俯蹬道以寬平雜花異香莫知其名佳木繁隂欣欣其榮唯特立於諸峯之右者乃主乎壽照之以南極之星所謂山者如此淺若龍龕深若雲竇鎖煙霞於杳冥留風雨於昏晝或秉炬而可入或捫扄而可叩石磊磊以巉巖木森森而聳秀間則流潤雲蒸可卜以隂晴之候所謂洞者如此為山之屏為洞之扄承乎上則安若榱桷芘於下則覆若簷楹珍叢幽芳古木長藤蘢絡蔽虧髙低相層鳥啼花發則春容淡蕩霜降木脫則石角崚嶒所謂巖者如此兩山之間氣聚其中衆木斯茂泉流暗通或重羅以瞑晝或偃草而進風裊長春之翠莖挺堅節之霜松每晨曦之照耀靄朝霧以空濛所謂谷者如此又有岡則隱然而起勢連山谷殊萃屼之峯巒類縈紆之林麓白雪照夜則寒梅盛開紅雲嬌春則仙桃極目恍如望千畒之鋭非巖之秀橫石壁壘亘若岡阜既草木以敷榮復地形之延袤迢迢大庾隔絶遐荒落落萬松得名錢塘今移根於南北亦不限於炎涼至若溶溶大波瀦為巨派其流則小其合則大瑩上下之天光溉淺深之湍瀨有巨魚以潛波扈龍舟而夾載岸容萬栁春風柔柯飛花滿空長條拂波或趂景而移棹或鳴根而笑歌此謂之江者回環山根縈帶竒石淺以蕩谷深以凝碧潺湲不窮流衍潄激泛桃花之露紅浮洞天之春色輕鷗文禽棲息其側荷花不斷雲錦舒張或聚而為曲沼或漲而為橫塘煙梢露蓧交翠玄昂此之謂溪者夫山洞嵓谷岡嶺江溪既略陳矣子獨不見樓有綘霄朱欄倚空跨晴雲之縹渺挂瑞日之曈曨綺踈凝霧天香散風覺星辰之逼近如霄漢之穹隆招飛仙於蓬壷揖素娥於蟾宫霓旌鶴馭稅駕其中又不見閣有巢鳯異乎髙岡豈丹穴之瑞應無雄髙宗廟諱以翶翔即其軒楹架以傑閣芘五彩之鴛雛下九霄之鸑鷟因太平之象會廊廟之人置酒大嚼歸美逢辰續夏日之句頌南風之薰其北也諸山之上衆木之杪俯雲壑之沉沉視煙霄之杳杳西瞻太行於晴霽東望海霞於清曉山巃嵸石嶙峋挹長風之回玉宇導明月之湧冰輪齋心嘗比於崆洞精禱每延乎上真見飄飄之仙馭隨裊裊之青芬視其榜曰介亭有排衙蒼碧之前陳者也因山髙下周以回廊如璧月之環坐復晴曦之騰光玩牙籖之甲乙發寶書之祕藏徐繞砌而散步間挾䇿而寓興花雖芳而晝寂鳥雖啼而人靜俲隱士之山堂取逸人之三徑其搒曰書館豈蓬户陳編之可並者也亭有勝筠周以美竹何禁籞之寶檻迸藍田之叢玉巳交戞而近砌復扶踈而出屋分月影之瑣碎聽風聲之斷續遊塵不到清意自生目蒼雲之翳翳靣霜節之亭亭挺然不屈四時長青宸襟對爽固以貺名且館曰蕭間深庭邃宇來萬籟之清風無九夏之劇暑棲寓懷之寶玩備宸章之毫楮前橫江練傍列山莊或遣乘槎而上漢或笑喝石而為羊超然燕處真逍遙自適之鄉雜花爭妍紅紫相鮮或引繩而為徑或彌望而成川錦繡照空而明煥風露散曉而香傳肅然行列若羽林之萬騎粲然艷粧如宫女之三千四時之候參差不齊異塵埃之桃李雜紛蹂以成蹊斯號林華之苑見鏤玉之珍題至若山莊竹籬蘿蔓蓊鬱睨緑筠之共茂夾修徑而髙出俯以愛蒼苔之承步仰以見雲梢之蔽日軒亭欄檻各相方而搒名故扶晨散綺洞煥秀瀾隨所寓而不一晴波融怡是為鴈池望風中之飛練接雲際之虹霓南山巍然而蒼翠北渚湛若而漣漪聽雍雍之下集觀肅肅以髙飛朝離乎雪霜之野暮宿乎葭葦之湄唯恩波之可泳豈墮陽之恨遲練以幽芳蕚緑華堂何玉顔之淡佇見竒姿之異常鄙江梅之尚紅陋臘梅之太黃得天上碧桃之露掩薰爐清逺之香恍聖情而異稟蒙天笑以增光故賜神仙之號闊珠户而敞文窗然而如此之類安能悉紀若夢逰仙髣佛而巳客曰子之所陳心存意識或欲周知何從皆得主人曰人間天下飛潛動植率在其中不可殫極姑陳述乎二三而已徯纍言於千百非若子虛上林之夸大兩京三都之緣飾顧難狀於言辝徒充塞于􅎍臆客曰姑置是事請質所疑何一隅之形勢若千里之封圻主人笑曰嘻夫耳目之不際何可以意測思慮不至孰可以強知望壺中者𥘉不察其天地遊武陵者亦豈意其有桃溪矧都邑紛華之地藏十洲三岱之竒客又曰蓋聞橘不踰淮貉不踰汶令兹草木來自四方原莫知夫逺近物理地冝請得而論主人曰天子神聖明堂頒制視四海為一家通天下為一氣考其迹則車書混同究其理則南北無異故草木之至微不變根荄於易地是豈資於人力蓋巳默然運於天意故五嶽之設也天臨宇宙五嶽之望也列於百神兹嶽之崇也作配萬壽彼以滋庶物之蕃昌此以壯天支之擢秀是知真人膺運非特役巨靈而驅五丁自生民以來蓋未之有客恍然聞所未聞於是鼓舞歡欣頌詠太平等乾坤之永久又詔二臣共作艮嶽百詠詩以進艮嶽勢連坤軸近乾岡地首東維鎮八方江不風波山不險子孫千億壽無強介亭雲棧橫空入翠煙躋攀端可躡飛仙介然獨出諸山上磊磊排衙石滿前極目亭千里飛鴻坐上看山川風月在慿欄不知地占最髙處但覺恢恢天宇寬圌山亭軒楹正在翠微中欲雪雲生四靣峯璀璨地鋪紅瑪瑙巑岏山聳碧芙蓉跨雲亭地髙天近怯慿欄下視浮雲咫尺間只怪輕雷起嵓際不知飛雨過山前半山亭慿髙玉輦每從容中路嘗聞憩六龍塵外有人如到此便須行徹最髙峯蕭森亭曉日珍瓏宿霧開四簷時有好風來不應班竹林中見却似松根琥珀堆麓雲亭山下深林起白雲白雲飛處斷紅塵伴行直到髙峯上舒卷縱橫不礙人清賦亭四海熙熙萬物和太平廊廟只賡歌欲追林下騷人意却是臨流得句多散綺亭斷虹飛雨過天涯碧落浮雲不復遮明日隂晴真可卜倚欄來此看餘霞清斯亭天波萬斛㵼鎔銀跨水橫橋麗髙宗廟諱新但取真堪濯纓意玉階金闕本無塵煉丹亭藥爐龍虎正交馳五色雲生固濟泥凡骨欲逃三万日君王曾賜一刀圭璿波亭水影搖暉動碧虛日華凌亂上金鋪安知不是鮫人寶往往淵中得美殊小隱亭古木回環石路橫居山𥘉不在峥嶸聖人天下藏天下小隱聊為戲事名飛岑亭微雲將雨洗層巒石磴莓苔路屈盤正是江南最佳處仰看蒼翠俯澄瀾草聖亭落筆縱橫走電光近臣時得賜雲章龍盤鳯翥皆天縱渴驥驚蛇不足方書隱亭吾皇聖學自天衷載籍源流一一通宵旰萬機營四海更將心醉六經中髙陽亭仙舟時倚碧溪灣花外青旗映淺山不醉閬風緣底事要看豪飲似人間噰噰亭聖主從來不射生池邊群鴈恣飛鳴成行却入雲霄去全似人間好弟兄忘歸亭玉景金霞長不夜松篁泉石更留人廣寒宫殿秋偏好待看林梢月色新八仙館蟠桃𥘉熟玉京春圎屋如規户牖新盡是瑶池髙會客豈容塵丗飲中人環山館峯巒回合聳雲屏巖靄溪光靣靣橫開户忽驚千仞翠慿髙方見九重城藝館玉堂金馬盡名儒黃本牙籖付石渠向此別藏三萬卷不憂中有蠧書魚書館蓮燭詞臣在外庭青錢學士巳登瀛回廊屈曲隨巖阜挾䇿何妨取次行蕭間館書草吹來種種香好風移韻入松篁丹臺紫府無塵事倚覺壺中日月長漱瓊軒淺碧分江入衆山山深無處不潺開軒最近寒溪口噴薄松風嚮珮環書林軒甲乙森然盡寶書校讎曾授魯中儒萬機多暇時來此玉軸牙籖自卷舒雲岫軒山上飛雲片片輕雲山相似倚空明從龍本合封中去觸石光從望處生梅池玉鈿勻點鑑新磨香逐風來水上多應為橫斜詩句好故教踈影㵼平波鴈池暮天飛下一行行淺渚平沙足稻梁有此恩波好遊泳何須辛苦去衡陽硯池黑雲凌亂曉光凝氣接崑崙冷不冰龍餅麝元皆御墨遊魚吞却化鯤鵬林華苑連雲復道映樓臺茂苑竒花日日開但得如春天一笑芳菲何必曉風吹絳霄樓翼瓦飛薨跨閬風捲簾滄海日曈曨佳時自有群仙到笑語雲霞縹眇中倚翠樓梯空窗户半山間滴滴嵐光照畫欄六月火雲揮汗日雲唯覺石屏寒奎文樓龍蟠鰲負出風雲鏤玉填金聖製新自與六經垂日月更令羣目仰星辰巢鳯閣朝陽鳴處有亭梧爭似珠簾映綺疏丹穴來儀聽九奏不妨於此長鵷雛竹岡蒼雲蒙密竹森無數新篁出妨林巳有鳯山調玉律正隨天籟作龍吟梅岡闊連峯嶺玉崔嵬春逐陽和動地來不似前村深雪裏夜寒唯有一枝開萬松嶺蒼蒼森列萬株松終日無風亦自風白鶴來時清露下月明天籟滿秋空蟠桃嶺不到瑶臺曰玉京海中仙果但聞名何人為報西王母嶺上如今種巳成梅嶺雪林橫夜月交光萬壑風來處處香聖主乾坤為度量包藏曾不限遐荒三秀堂窗户深沉晝不開鳯凰時下九層臺月明夜靜聞環珮知有霓旌羽扇來蕚緑華堂緑蕚承趺玉蘂輕清香續續度簷楹天教不雜開桃李賜與神仙物外名嵓春堂桂影亭亭漾碧溪尋芳曽𬒳暗香迷碧桃開後晴風暖花外幽禽自在啼躡雲臺萬本琅玕密不開林深明碧瑣髙臺更無一點遊塵到伹覺雲隨步步來玉霄洞披香尋徑百花中蝶引蜂隨路不窮但見凌霄纏古木洞天應與碧虛通清虛洞天玉關金鎖一重重只見桃源路暗通行到水雲空洞處恍如身丗在壺中和容廳白羽流星一點眀上林飛鴈幾回驚弓開月到天心滿風外唯聞中的聲泉石廳縈迂流碧與環山月地雲階在兩間有此清泠居物外方知塵土屬人環揮雲亭天風吹作海濤聲揮斥浮雲日更明波上石鯨時吼雨只知樓閣是蓬瀛泛雪廳月團携下九重天來試人間第一泉正在水聲山色裏六花浮動紫甌圎虛妙齋武王屈巳尊箕子黃帝齋心問廣成惟道集虛觀衆妙超然將見不能名壽山太上御名大崇髙秀氣連清風不老月長圎春遊玉座時相對花發鶯啼億萬年杏岫山上晴霞興綵雲芳菲時節避花繁分明自有神仙種不是青旗賣酒村景龍江潤通河漢碧涵空影倒光山曉翠重聞説巨魚時駭浪只應風雨是神龍鑑湖水天澄徹瑩寒光一片平波六月涼移得會稽三百里不教全屬賀知章桃溪霏霏紅雨落清潯流出山中直至今休道仙源在平地空教人向武陵尋回溪穿雲透石落潺潺戀浦餘波尚繞山只怪嵐光迷向背不知流水正回環滴滴巖蒼苔青潤石嶙泉脈涓涓濕白雲疑有天仙深夜過丁當環珮月中聞榴花嵓絶域移根上苑栽又分紅緑向嵓隈纍纍子巳枝間滿灼灼花猶葉底開枇杷嵓結根常得近林巒晚翠誰憐却歲寒不見龍文橫桿靣方知垂實作金丸日觀嵓朝陽𥘉上海霞紅五色雲生碧洞中回首爛柯人自老棊聲猶在石門東雨花嵓紛紛泊泊弄晴暉曾逐春風上繡衣不為胡僧翻貝葉仙家長有碧桃飛蘆渚萬葉梢梢秋意初斜風細雨憶江湖誰知雪壓波澄後更與宫中作畫圖梅渚只借晴波為曉鑑不隨花島作江雲未須吹笛風中去多得清香水際聞榠查谷折花冝與酒相薰結難隨酒入唇一陳暗香無處覔不知幽谷巧藏春秋香谷玉屑花繁淡淡黃碧嵓曾伴紫欄芳月明露洗三秋葉山逈風傳七里香松谷雲藏煙鎖晝蒼蒼得地何須作棟梁聞道九龍扶輦過一山風又作笙簧長春谷洞天風物幾人知暗得隂陽造化機不似寒鄉待鄒律四時嵓際有芳菲桐徑不嫌春老花飛濕要聽秋來雨打聲一自移根來禁籞朝陽常有鳯凰鳴松徑夾路成行一樣清吟風篩月自亭亭雲章正寫人間瑞坐待雲根長茯苓百花徑紅紫交加一徑通翠條柔蔓浴玲瓏日晴煙暖微風度百和香薰錦繡中合歡徑綵絲拂拂機中錦繡縷茸茸馬項纓却似漢宫三十六黃昏時節掩羅屏竹徑翠葉吟風長浙瀝寒梢擎露忽髙低有時杳杳穿雲去碧玉交加四望迷雪香徑夾徑梨花玉作英年年寒食半隂晴要看雪色無邊際十二樓前月正明海棠屏清明微雨欲開時收什狂香付整齊但得浣花春在眼不須枝上杜鵑啼百花屏衆香芬馥著人衣雲母光寒露未晞圍得春風勝繡幕紛紛紅紫鬪芳菲蠟梅屏冶葉倡條不受羈翠筠輕束最繁枝未能隔絶蜂相見一一花房似蜜脾飛來峯突兀初驚倚碧空翠嵐仍與瑞煙重吳儂莫作西來認真是蓬萊第一峯留雲石白雲何事苦留連中有嵌空小洞天却恐啇嵓要霖雨因風時到日華邊宿霧石飛煙自繞龍樓駐瑞氣長隨海日開獨有春風花上露夜深多伴月明來辛夷塢山中常壓早梅開不待暄風暖景催似與東君書造化筆頭春色最先來橙塢磊磊金丸畫不如空濛香霧幾千株應憐緑橘秋江上却𬒳人間喚木奴海棠川清明時候暖風吹葉暗花明滿目開石在劒門猶北向錦江春色亦須來仙李園亳社靈蹤亘古存混元龍蛻出風塵移根更接蟠桃嶺結子開花萬万春紫石壁沒水攀蘿琢馬肝齎持堅潤出風湍潛藩每恨端溪逺疊作山中峭絶看椒崖團枝紅實見秋成曾按方書合五行不遣漢宫塗屋璧此間吞餌得長生濯龍峽山束蒼煙細路通噴泉飛雨灑晴空真龍豈許尋常見故作雲間飲澗虹不老泉來從雲竇不知逺湧出碧嵓無暫停花落鶯啼春自晚潺湲長得坐中聽柳岸牽風拂水弄春柔三月花飛滿御樓不似津亭供悵望一生長得繫龍舟棧路六丁開處只通秦此地天臨萬國春駐蹕有時思叱馭服勞王事愛忠臣藥寮巳聞頒朔向明堂百草猶思一一嘗天意應憐民疾苦欲躋仁壽佐平康太素庵結草鋪茅不用華白雲深處列仙家蕭騷風玉千竿竹翠葉濃隂襯碧霞祈真磴臺上爐香裊翠煙雲間風馭巳翩翩吾皇奉道明靈降惟德從來可動天躑躅巋春風曉日亂晴霞艷艷𥘉開一巋花疑是仙琴紅玉軫醉歸遺在紫皇家山莊重崖置屋亦常關下法龍眠小隱山縱有青牛不耕稼但聞犬吠白雲間西莊低作柴扉短作籬日晴雞犬自熙熙躬耕每以農為夲稼穡艱難舊亦知東西關天上人間自不同故留關鑰限西東姓名若在黃金籍日日朝元路自通敷春門帝力無私萬國通尚思寒谷待春風欲將和氣均天下都在熙熙造化中又詔翰林學士王安中令登豐樂樓望而賦詩云日邊髙擁瑞雲深萬井喧闐正下臨金碧樓臺雖禁籞煙霞嵓洞却山林巍然適髙宗廟諱千齡運仰止常傾四海心此地去天真尺五九霄𡵨路不容尋質字文伯熙陵時參知政事昌齡之曾孫組字元寵頴昌陽翟人俱有才思晚始際遇悉授右列侍祐陵時寵臣皆內侍梁師成所引遂得愛幸質少不檢文其身賜號錦體謫仙後隨從北狩組逢辰未久而沒官止副使有子即勛也頗能文祐陵即以其父官輔之後獲幸髙宗位至使相録之于秩以紀當時之盛近王稱作東都事略載蜀僧祖秀所述遊華陽宫記不若是之備也是時獨有太學生鄧肅上十詩備述花石之擾其末句云但願君王安万姓圃中何日不東風詔屏逐之靖康𥘉李伯紀啓其事薦其才召對賜進士出身後為右正言著亮直之名于當日肅字志宏南劒人有文集號栟櫚遺文三十卷詩印集中祖宗以來除拜二府必遷六曹侍郎或諌大夫當時為寄祿官在今皆太中大夫以上是以從官入參機務也登兩制必左右正言前行郎中為之今承議郎以上是以朝臣而論思獻納也元豐官制行𥙿陵考唐六典太宗用魏鄭公為祕書監參知機務故事易執政為中大夫王和父蒲傳正是矣而從臣易為通直郎猶曰朝官舒亶徐禧是也巳為殺矣近日錢師魏登政府坐謬舉降三官明清即以啓之以謂自昔以來未有朝請大夫而參知政三五事者且大臣有過當去位不當降罰不報明清嘗觀歐陽文忠與劉邍父書問答入閣儀詞甚諄復見兩賢文集中近閲田宣簡儒林公議語簡而詳今載于左國家承五代大亂之餘每朔望起居及常朝並無仗衛或數年始一立冬正仗當丗人士或不識朝廷容衛迄至缺然太宗朝常詔史館修撰楊徽之等校定入閣舊圖時江南張洎獻狀述朝會之制得失明著且要云今之乾元殿即唐之含元殿也在周為外朝在唐為大朝冬至元日立全仗朝百國在此殿也今之文德殿即唐之宣政殿在周為中朝在漢為前殿在唐為正衙凡朔望起居册拜后妃皇太子王公大臣對四夷君長試制䇿科舉人在此殿也昔東晉太極殿有東西閣唐置紫宸上閣法此制也且人君恭已南靣嚮眀而理紫微黃屋至尊至重故巡幸則有大駕法從之盛御殿則有勾陳羽衛之嚴故雖隻日常朝亦猶立仗前代謂之入閣儀者蓋隻日御紫宸上閣之時先於宣政殿前立黃麾金吾仗候勘契畢喚仗即自東西閣門入故謂之入閣今朝廷且以文德正衙權冝為上閣甚非憲度况國家繼百王之後天下隆平凡曰憲章咸從損益惟視朝之禮尚自因循竊見長春殿正與文德殿南北相對殿前地位連橫街亦甚廣博伏請改創此殿作上閣為隻日立仗視朝之所其崇政殿即唐之延英是也為雙日常時聽斷之所庶乎臨御之式允協前經今論以入閣儀注為朝廷非常之禮甚無謂也臣竊按舊史中書門下御史臺謂之三署為侍從供奉之官今常朝之日侍從官先次入殿庭東西立定俟正班入一時起居其侍從官則東西對拜甚失北靣朝謁之禮今請準舊儀侍從官先次入起居畢在左右分行侍立於丹墀之下故謂之蛾眉班然後宰相率執政班入起居庶免侍從官有東西對拜之文得遵正禮至慶曆三年豫知制誥時始詔臺省侍從官隨宰相正班北靣起居其他則無所更焉嘉祐中詔宋景文歐陽文忠諸公重修唐書時有蜀人吳縝者𥘉登弟因范景仁而請于文忠願預官屬之末上書文忠言甚懇切文忠以其年少輕佻距之縝鞅鞅而去逮夫新書之成乃從其間指摘瑕疵為糾繆一書至元祐中縝遊宦蹉跎老為郡守與五代史纂誤俱刋行之紹興中福唐吳仲實元美為湖州教授復刻于郡庠且作後序以謂針膏肓起廢疾杜預實為左氏之忠臣然不知縝三七著書之本意也張仲宗云明清家有續皇王寶運録一書凡十卷王景彛家所藏印識存焉多敘唐中葉以後事至於詔令文檄悉備唐史新舊二書之闕文也但殊乏文華所恨宋景文歐陽文忠諸公未曾見之其載黃巢王氣一事盡存舊詞姑綴于編中和三年夏太白先生自號太白山人不拘禮則又云姓王竟不知何許人也金州耆宿云每三年見入州市一度自見此先生賣藥已僅三四十年顔貌不改不老其年夏六月三日太白山人修謁金州刺史檢校尚書左僕射兼御史大夫崔堯封云本州直北有牛山傍有黃巢谷金桶水且大冦之帥黃巢凌劫州縣盜據上京近巳六年又偽國大齊年號金統必慮王氣在北牛山伏請聞奏蜀京掘破牛山則此賊自敗散堯封聽之大喜且具茶果與之言話移時太白山人禮揖而去堯封遂與州官啇量點諸縣義丁男日使萬工掘牛山一箇月餘其山後崖崩十丈以來有一石桶桶深三尺徑三尺桶中有一頭黃腰獸桶上有一劒長三尺黃腰見之乃􅊯然數聲自撲而死堯封遂封劒及畫所掘地圗所見石桶事件聞奏僖宗大恱尋加堯封檢校司徒封博陵侯黃巢至秋果衰是歲中原尅平如昭洗王涯三八等七家之詔亦見是書也舊制京官造朝不許步行每自外任代還朝參日步軍司即差兵士三人馬一匹隨從得差遣朝辝畢所屬徑關排岸司應副回綱船乘座以歸如在蘇杭間居止即差浙西綱船選人改官授告有日閣門關步軍司差人馬如五人改官即五騎十五人伺候內前授告了各乘馬以故一時戲語云冝徐九行照管踏了選人祖宗開國以來西北兵革既定故寬其賦役民間生業每三畒之地止收一畒之稅緣此公私富庶人不思亂政和間謀利之臣建議以為彼處減匿稅賦乃創置一司號西城所命內侍李彥主治之盡行根刷拘催專供御前支用州縣官吏無郤顧之心竭澤而漁急如星火其推行為尤者京東漕臣王宓劉寄是也人不堪命遂皆去而為盜胡馬未南牧河北蜂起遊宦啇賈巳不可行至靖康𥘉智勇俱困有啓于欽宗者命斬彥竄斥宓寄以徇下寬恤之詔然無鄉從之心矣其後散為巨冦于江淮間如張遇曹成鍾相李成之徒皆其人四十也外舅云沈義倫盧多遜為相其子起家即授水部貟外郎後遂以為常今之朝奉郎也吕文穆為相當任子奏曰臣忝甲科及第釋褐止授九品京官况天下才能老於巖穴不能霑寸祿者多矣今臣男始離襁褓膺此寵命恐罹譴責乞以臣釋褐時所授官輔四一之自是止授九品京秩因以為定制以至今日太平興國五年詔通判得舉選人充京官運判所舉人數與提刑等至熙寧三年置諸路提舉常平廣惠倉各添舉貟有旨今後通判更不舉選人充京四二官運判比提刑減人數之半唐制郊祀行慶止進勳階五代肆赦例遷官秩本朝因之未暇革也章聖時左司諌孫何與起居郎耿望言其非制四三上嘉納之遂定三年磨勘進秩之法孫鄰幾家傳云官制未改時知制誥今之中書舍人但演詞而巳不聞繳駮也康定二年冨文忠為知制誥先是昭陵聘后蜀中有王氏女姿色冠丗入京備選章獻一見以為妖艷太甚恐不利於少主乃以嫁其姪從德而擇郭后位中宫上終不樂之王氏之父蒙正由劉氏姻黨屢典名藩未幾從德卒至是中批王氏封遂國夫人許入禁中文忠適當草制封還抗章甚力遂併寢其旨外制繳詞頭蓋自此始崇觀姦佞用事賄賂關節干祈恩澤多以御筆行下朱書其旁云稽留時刻者以大不恭論流三千里三省無所干預大啓幸門為宦途之捷徑宣和五年有黃冠丁希元者得幸為侍晨道録自云晉公之孫忽降御筆丁謂輔相真宗逮仁宗即位有定䇿之功未經褒贈可特贈少保官其後五人時盧襄贊元為吏部尚書袖其牘請對啓于上云使謂過可湔洗則纍朝敘恤久矣獨至今乎倘罪惡顯然一旦褒録豈不駭四方之聽於是命格不下自是御筆遂有執奏不行者四四矣二者皆甚盛之舉也張唐英字次功西蜀人與天覺為同包兄也熙寧中仕至殿中侍御史嘗述仁宗政要上于朝又盡作昭陵朝宰執近臣知名之賢諸傳於其中今丗所謂嘉祐名臣傳者是也特政要中一門耳然印本亦未盡焉眀清家有政要全書可考次功父文四五蔚范蜀公作墓碑韓魏公嘉祐末以翊戴功輔英宗既為永昭山陵使使事畢而上不豫矣不敢辭位四載而永厚鼎成以元宰復護葬于洛魏公先自上疏云自有唐至于五代山陵使事訖求去今先帝巳祔廟而臣兩為山陵使恬然不能援故事去位則是不知典故何以勝天下之責雖陛下欲以私恩留臣顧中外公議且謂臣何神宗再三留之卧家不出遂以司徒兩鎮節度使判鄉郡相州元符末章子厚為永泰山陵使子厚專權之久人情欎陶有曾誕敷文者作詞略云草草山陵職事厭厭罷相情懷謂故事也紹興間會稽因山秦會之為固位之計乃除孟仁仲為樞密使以代其行仁仲不悟其機事竣猶入國門會之怒諷言路引四六以論列出典金陵熙寧𥘉韓魏公力辭機政以司徒侍中判相州巳命未辭忽報西邊有警曾宣靖乞召公同議廷中神宗從之公辭云巳去相位今帥臣也但當奉行詔書豈敢預聞國論時人以為得體元豐末吕吉父以前兩地守延安過闕乞與樞密院同奏事上親批云弼臣議政自請造前輕躁矯誣深駭朕聽免朝辭疾速之任巳而落職知單州其後吉父貶建州安置東坡先生行制辝云輕躁矯誣德四七音猶在謂此也孫叔易近為先人言大觀中自南京教授差作試官回次朱遷鎮閲邸報吳侔兄弟以左道伏誅坐中監鎮使臣云某少日作吳沖卿丞相直省官親見元豐中交趾李乾德陷雍廉州詔郭逵討之神宗問所以平交趾者逵曰兵難預度願馳至雍管上方略師往遂復雍州進次冨良江又破之獲賊將洪真太子者於是乾德議降而逵以重兵壓富良江與交人止一水之隔沖卿忌其成功堂帖令班師逵逗遛不進交人大入全軍皆覆逵坐貶秩侔儲沖卿孫也此蓋天報之云當時詩人陳傳作佐郎將云林中生致左郎將名王頭顱十四五乾德可禽嗟不謀同惡相濟能包羞降書冉冉過中洲中軍傳呼笑點頭蠻首算成勿藥喜君臣稱觴弭多壘元戎凱旋隔天水夜經桄榔趍決里驅四八將十萬人性命換得交州數張𥿄眀清前録載和買起于王絲後閲范蜀公東齋記事云太宗時馬元方為三司判官建言方春民乏絶時預給官錢貸之至夏秋令輸絹於官和買紬絹蓋始於此然在昔止是一時權冝措置於一歲之間或行於一郡邑而巳至熙寧新法乃施之天下示為凖則是時越州會稽縣民繁而貪所貸最多舊額不除至今為害而不能革惟婺州永康縣有一桀黠老農鼓帥鄉民不令稱貸且云官中豈可打交道邪衆不敢請獨此一邑遂無是患聞今四九不然紹聖𥘉孟后廢處道宫偶遼國遣使來詔命邢和叔館之邢白時宰章子厚曰北使萬一問及瑶華事何以為詞子厚曰當云罪如詔書巳而北人不及之忽問曰南朝近日行遣元祐人何邪邢即以子厚語答之歸奏泰陵大喜以謂善於專五十對劉季髙云五代時有姓吕為侍郎者三人皆各族俱有後仕本朝為相吕琦晉天福為兵部侍郎曾孫文惠端相太宗吕夢竒後唐長興中為兵部侍郎孫文穆蒙正相太宗曾孫文靖夷簡相仁宗衣冠最盛巳具前録吕咸休周顯德中為户部侍郎七丗孫五一正愍大防相哲宗異哉冨鄭公晚居西都嘗會客于第中邵康節與焉因食羊肉鄭公顧康節云煮羊惟堂中為勝堯夫所未知也康節云野人豈識堂食之味但林下𬞞筍則五二常喫耳鄭公赧然曰弼失言邵公濟云治平𥘉詔改諸路馬步軍部署為總管避厚陵名也考之前史總字皆從手合作揔字非從絲無疑五三出於一時稽考不審沿襲至今不可更矣李成季昭玘元祐左史自號樂靜居士五代宰相李濤五丗孫濤至本朝以兵部尚書莒國公致仕尚書當時階官也其家自洛徙齊成季猶子漢老邴也中興𥘉位政府一時大詔令多出其手秦少遊作李公擇常行狀云逺祖濤五代時號稱名臣仕皇朝為兵部尚書封莒國公莒公少時仕於湖南有一子留江南公其裔孫也所以今為南康建昌人丗號山房李氏成季與公擇鄉里雖各南北要是本出一族子孫皆鼎盛不知後來兩家曾敘昭五四穆否耳儂賊犯交廣毒流數州諸將久無成功狄武襄既受命顓征首責崇儀使陳曙斬之余襄公皇恐降階祈求武襄尉藉遣之於是軍聲大振竟破賊而桂人為崇儀建廟兒祀事至今唯謹東坡先生以書抵廣西憲曹子方云間居偶念一事非吾子方莫可告者故崇儀陳侯忠勇絶丗死非其罪廟食西路威靈肅然願公與程之邵議或同一削乞載祀典使此侯英魄少信眉於地中如何如何武襄必無濫誅而廣人奉事之益嚴又有東坡之説如此不可曉也隆興初帥臣張維奏詔賜其廟額曰忠愍曙髙郵人進士及第後換右列靈芝王平甫撰其碑志甚詳其壻許光疑始以布衣自嶺外護其五五喪以歸人皆多之後登第終吏部尚書唐書特立宗室傳贊乃云宰相以宗室進者九人林甫姦諛幾亡天下程知柔在位無所發明林甫在姦臣傳知柔相昭宗附宣惠太子業傳後第五卷止敘七人適之峴勉夷簡程石回然李麟乃懿祖後李逢吉李蔚俱隴西同系李宗閔出鄭王房李揆亦出隴西宰相共十三人也不同作一傳何耶揮麈後録卷之二
