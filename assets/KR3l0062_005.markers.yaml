  - {type: variant, offset: 26, length: 2, content: 祖興, WYG: 宗明皇御札詔勅緘鎖甚謹後有摩尼寺波斯僧各持其法佛經所謂外道者也統有南突厥北突厥大衆熨小衆熨様磨割禄􅃛戞司末蠻格哆族預龍族之名甚衆國中無貧民絶食者共振之人多夀考率百餘嵗絶無天死時四月獅子王避暑於北廷以其舅阿多裕恱守國先遣人致意於延德曰我王舅也使者拜我乎延德曰持朝命而來禮不當拜復問曰見王拜乎延德曰禮亦不當拜阿多裕悦復數日始出相見然其禮頗恭獅子王邀延德至其北庭歴交河州凡六日至金嶺口寳貨所出又兩日至漢家寨又五日上金嶺温嶺即多雨雪上有龍王刻石記云小雪山也嶺上有積雪行人皆服毛􅄢度嶺一日至北廷憩高臺寺其王烹羊馬以具饍尤豐潔地多馬王及王后太子各飬馬牧放於平川中彌亘百餘里以毛色分别為羣莫知其數北廷川長廣數千里鷹鷂鵰鶻之所生多美草下生花砂䑕大如䨲鷙禽捕食之其王遣人來言擇日以見使者願無任其淹久至七日見其王子侍者皆東向拜受賜旁有持磬者擊以節拜王聞磬聲乃拜既而}
  - {type: page-break, offset: 26, content: '', id: KR3l0062_WYG_004-7b, image: WYG1038/WYG1038-0393b.png}
  - {type: page-break, offset: 26, content: '', id: KR3l0062_WYG_004-8a, image: WYG1038/WYG1038-0393c.png}
  - {type: variant, offset: 30, length: 1, content: 兆, WYG: 兒女親屬皆出羅拜以受賜遂張樂飲燕為優戲至暮明日泛舟於池中池四面作鼓樂又明日遊佛寺曰應運泰寜之寺貞觀十四年造北廷北山中出􅗠砂山中常有􅈣氣湧起而無雲霧且又光燄若炬照見禽鼠皆赤采􅗠砂者著木底鞵若皮為底者即焦下有穴生清泥出穴外即變為砂石土人取以治皮城中多樓臺草木人白晳端正惟工巧善治金銀銅鐡為器及攻玉善馬直絹一疋其駑馬充食者纔直一丈貧者皆食肉西抵安西即唐之西境七月令延德先還其國其王始至亦聞有契丹使來脣缺以銀葉蔽之謂其王曰聞漢遣使入逹靼而道出王境誘王窺邉宜早送至逹靼無使久畱因云高敞本漢土漢使來覘視封域將有異圖王當察之延德偵知其語因謂王曰契丹素不順中國今乃反間我欲殺之王固勸乃止自六年五月離京師七年四月至高昌所歴以詔賜諸蕃君長襲衣金帶贈帛八年春與其謝恩使凡百餘人復循舊路而還雍熙元年四月至京師延徳初至逹靼之境頗見晉末陷敵者之子孫咸相率􅃒迎獻飲食問其鄉里親戚意甚悽感畱旬日不得去延徳之自叙云此雖載于國史而世莫熟知用書于編以俟通道九夷八蠻將使指者或取諸此焉紹興丙辰明清甫十嵗時朱}
