seq: 5
body:
  text: 揮麈後録緫目卷之一乙自漢哀帝以來歴代加上皇帝尊號二太祖興王之兆三滁州創端命殿崇奉太祖御容四祖宗規撫宏逺五太祖藏􅃓弩於楊州郡治宣和間得用六祖宗置公庫以待過客欲使人無旅寓之歎七太宗収用舊臣處之編修以役其心八錢氏逢辰録言朝廷典故甚詳九章獻太后命儒臣編書鏤板禁中十天聖中詔修三朝國史十一昭陵降誕之因十二神宗聖學非人所及十三神宗置封椿庫以爲開拓境土之資十四神宗詔史院賜筵史官就席賦詩十五録紹聖謗語與史院十六曽布等議復瑶華本末十七曽布奏事上深憚服十八徽宗好學潜心詞藝十九徽宗􅀄郊事迹二十程􅀂英上言皆驗二乙鄧洵武乞正選人官稱二二政和中廢毒藥庫幷罷貢額二三靖康中鄧善詢隨車駕次雍丘召縣令計事二四編􅀋元祐黨人立碑刋石二五宰相樞宻分合因革二六史官記事所因者有四二七自秦相擅政紀録不足傳信二八太祖誓不殺大臣言官二九治平宰執進草熟狀卷之二三十徽宗幸髙宗幄次見金龍蜿蜒榻上三乙髙宗閲奏求其生路三二髙宗興王符瑞三三徽宗御製良嶽記命李質曹組爲古賦并百詠詩及詔王安中賦詩三四近日官制紊亂三五歐陽文忠與劉邍父書問荅入閤儀詞三六吳縝著唐史紏繆五代史纂誤之因三七皇玉寳運録載黃巢王氣一事歐陽文忠未曾見三八京官朝叅差回綱舡乗歸三九人不堪命皆去爲盗四十宰相奏􅀘于第止授九品京官自吕文穆始四乙通判運判所舉人數㳂革四二磨勘進秩自孫何耿望建言始四三富文忠封還詞頭盧襄賛執奏不行四四張唐英述仁宗政要與嘉祐名臣傳四五韓魏公章子厚爲山陵使四六韓魏公出判相州不敢預聞國命吕吉父出守延安乞與樞宻同奏事四七丞相呉冲卿忌郭逵成功其孫呉侔以左道伏誅四八新法之行施於天下獨永康無和買四九邢和叔用章子厚語以荅虜使五十吕氏爲侍郎者三人俱有子孫爲相五乙邵尭夫譏冨鄭公􅁏食者鄙五二緫管之緫字但從手不從絲五三李濤李擇常本出一族五四陳崇儀廟食事因五五唐宰相以宗室進者十三人如何史賛乃云七人卷之三五六熈寧以來宰相封國公五七蔡无道作官制舊典事有抵牾五八方軫論列蔡京章䟽五九強淵明上景鍾頌六十王宷爲林靈素中傷與劉炳俱見誅六一劉康孫啓崔貴妃奪王景彛故弟果報六二蔡元長不啓印匣用印印復在匣六三張柔直􅂆蔡元長收拾人材以救喪亂六四解習除知河中府以箝口喪軀六五蘭亭石刻旣存而復失六六張逹明報唐欽叟令衘命誅童貫六七馮檝雷􅀚同爲學官相排六八賀子忱李􅊬詐疾退避六九粘罕欲根刷玉牒名字頼秦中丞得免七十鄭居中與蔡京交􅁖七一追贈范忠宣誤作文正七二温禹弼與曾文肅相失七三􅂫東坡作陳公弼傳卷之四七四徽宗燕賞元霄命王安中馮熈載進詩七五陳堯臣進退終始事迹七六靖康中黃時偁徐揆段光逺三人上虜酋書七占張􅀖昌僣僞事迹七八夏人沮粘罕之氣卷之五七九論熈寧以來謚法八十材人所畏者尉曹八十一江氏令樊􅀂水獻下江南之䇿宋咸鄭毅夫記其事甚詳八十二蜀孟昶上周丗宗書八十三國朝父子兄弟叔姪聮名顯著八十四黄巢明馬兒李順皆能逃命於一時八十五蔡伯俙以神童授官食禄七十五年八十六張􅂄燕禁從諸公八十七韓忠獻四子奏名禮部卷之六八十八韓持國入仕首末八十九王平爲司理不阿旨以殺無辜九十李邯鄲命諸子名九十一司馬温公人望所歸九十二温公不自矜伐九十三王荆公死兆九十四晏元獻元厚之怒人犯父諱九十五時君卿稱王荆公於上前九十六蔡持正之父黃裳戒其子必報陳氏九十七王和艾德政如神九十八汪輔之就試自知登第九十九滕元發因舎弟申與楊元素失眷一百􅂫東坡改王兵部滕元發行狀爲墓銘百一曽氏一門六人同牓及第百二馮京作主文取張芸叟置優等百三曾文肅薦王兵部居言路不就百四曾文肅爲相首末百五中使宣押蔡卞爲右丞百六夏人冦慶州老卒保其無他百七趙正夫與黃魯直戯劇衘怨切骨百八林仲平二子立名百九􅂫東坡不肯冩司馬文正墓誌百一十歐陽觀行狀異同百十一余行之結連外界罪狀百十二李端叔行狀文章百十三東坡杭州湖上㑹客百十四昭靈侯行狀首末百十五曾文肅王大卿結爲契家卷之七百十六國朝以來自執政徑登元台百十七本朝先正御書碑額與御書閣名百十八滕章敏訪荆公臨別贈言百十九東坡知舉時劉無言論效醉白堂記百二十晁以道跋魚枕冠頌百卄一曾文肅夫人招李子約母妻百卄二徐師川改陳虚中判語百卄三蔡元度與門下士觀􅀞壁百卄四􅀭康功使髙麗百卄五方逹源乞重脩汴河短垣奏䟽百卄六東坡舟次泗上百卄七建中士人與曾蔡啓語兩易百卄八曾文肅幐沙粥百卄九石豫言鄒志完再竄及降復元祐人百三十毛澤民和蔡元度鴛鴦詩百三一錢昻輕童貫百三二黃魯直浯溪碑曾公袞不欲書姓名百三三郭槩善於擇壻百三四王慶曾不隨曾國老濟江乃免於難百三五唐質肅公孫女識受􅁵殿名百三六王歧公在翰􅁐命門生供經史對百三七王兵部爲尉驗親識􅃓手殺人百三八米元章􅀝蔡元長凌大漕張勵百三九吕元直奏除李良輔名百四十鍾正甫治鄒志完獄劉景鞠謝景思百四一王氏書爲陳元則所得百四二葉少藴書火於弁山李泰發藏書火於秦百四三東坡在張厚之家再見徐君猷家􅁎爲之感動百四四童貫以承宣使乗狨坐由是爲例百四五趙諗僞號􅂭興百四六髙俅本東坡小史卷之八百四七陳舉摘魯直塔記貶冝州舉復以進青蛇靑錢罰俸百四八王彦輔村里侍從百四九范寥告張懷素變百五十畢仲㳺杖張懷素百五一蔡文饒館李易百五二李漢老爲李濤五丗孫百五三李譓進萬歳蟾蜍百五四賈明仲治童貫第得謝踰數萬緡百五五曾空青極力照瞩陳瑩中百五六王宣賛召劉斯立而距李延年至興獄累賔主百五七王倫隨李相至禁中自陳於殿下百五八舎人草東坡復官制院吏教爲結尾百五九陳述併治鄭良俱死而旅攅並室百六十江子我不信卜者之言百六一朱新仲代王彦昭致語用魯公帖及栁詞百六二􅂫叔黨不從賊脅通夕痛飲而卒百六三􅂫叔黨屬李植於向伯恭百六四蔡元長貶潭自歎失人心且作詞以卒百六五髙宗擢用徐師川百六六葉宗諤得婦人濟江百六七李元量魁天下卷之九百六八王廷秀閱丗録載眀受之變甚俻百六九頴彦文記髙宗幸海事百七十髙宗命王兵部撰楚州守將趙立死事傳卷之十百七一吳傅朋上殿髙宗自謂九里松牌不如呉􅀃百七二王殏掩匿御府器玩服御百七三髙宗從王子裳言釋苗劉鹵掠婦女百七四錢穆収復平江記百七五秦㑹之脩和盟胡銓上書除名張仲宗送行詞削籍卷之十一百七六孫仲益作墓碑百七七徐康國傲忽觸韓璜劉剛百七八􅀓崧卿觸二執政名百七九范擇善迁葬百八十秦㑹之荅李元老啓百八一御史希秦㑹之言罷䥴汰濫賞百八二王承可以名同偏旁縁秦㑹之誣罔以至侍從百八三周葵言梁仲謨語洩去位百八四秦㑹之使馮濟川探髙宗意百八五方庭實強勉入廣百八六馬子約梁􅀭祖因議斷強盗罪不咸百八七朱希真雪溪集序百八八名家子知邵州希合秦㑹之按辛永宗籍其家百八九解潜爲韓丗忠草奏配嶺外百九十榮茂丗不受岳飛父子不􅁤之訴百九一曾宏父小顰誦赤壁二賦百九二髙宗問陳桷百九三秦㑹之以姚宏不簽名卒以祈雨死大理獄中百九四熊彦詩賀啓百九五錢遹迎拜臈冦痛毁時政爲冦所殺百九六李孝廣以費又試卷謗訕竄廣南死其子病又爲祟百九七方􅁢迪以先得御注老子爲毛逹可所賞百九八譚稹梁師成言早來玉音可畏百九十孟富文爲執政二百王慶曾畏秦㑹之不爲顯仁償虜使金㑹之卒喜二百一曾􅁻父荅啓二百二孫立爲盗得壽州鈐轄印二百三王公明爲王原所疑二百四秦師垣謂魏道弼莫胡思亂量二百五陸農師揮麈後録目卷終
