front:
  text: 揮麈後録總目卷之一乙自漢哀帝以來歷代加上皇帝尊號二太祖興王之兆三滁州創端命殿崇奉太祖御容四祖宗規撫宏逺五太祖藏弓弩於楊州郡治宣和間得用六祖宗置公庫以待過客欲使人無旅寓之歎七太宗收用舊臣處之編修以役其心八錢氏逢辰録言朝廷典故甚詳九章獻太后命儒臣編書鏤板禁中十天聖中詔修三朝國史十一昭陵降誕之因十二神宗聖學非人所及十三神宗置封椿庫以為開拓境土之資十四神宗詔史院賜筵史官就席賦詩十五録紹聖謗語與史院十六曽布等議復瑶華本末十七曽布奏事上深憚服十八徽宗好學潛心詞藝十九徽宗𥘉郊事迹二十程若英上言皆驗二乙鄧洵武乞正選人官稱二二政和中廢毒藥庫並罷貢額二三靖康中鄧善詢隨車駕次雍丘召縣令計事二四編類元祐黨人立碑刋石二五宰相樞密分合因革二六史官記事所因者有四二七自秦相擅政紀録不足傳信二八太祖誓不殺大臣言官二九治平宰執進草熟狀
  hash: sha256:77558f5c40dc46721ecabf8a8f560a9477f4488b83f6c28008387adcbf9ecc3a
