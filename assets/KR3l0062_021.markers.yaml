  - {type: variant, offset: 102, length: 0, content: '', WYG: 跡加誣欽聖欺罔上皇以誑惑衆聼國史所載臣雖不得而見然以紹聖不得伸之姦謀施於崇寧擅權自肆之後其變亂是非巧肆誣詆亦不待言而後知也然彼不知者公論所在判若黑白於陛下聖德亦已久矣又况二聖玉音如在先臣記錄甚詳乃欲以一二姦人之言欺罔天地成其私意今日之敗必至之理也本末事實盡載先臣三朝正論伏望聖慈萬機之暇特賜省覽付之外廷宣之史官播告中外使天下後世曉然皆知哲宗仁孝之德初無疑似欽聖歎息之語深切著明而四十餘年間止緣二三姦臣賊子興訛造訕以報簾幃之怨貪天之力以掩巍巍之功使宣仁聖烈皇后保佑大德返遭誣􅀈今者考正是非誅鉏謗讟隂霾蔽蝕之際然後赫然日月之光旁燭四海焜燿萬世與天地合德於無窮也先臣不昧亦鼓舞於九泉之下矣此紹興三年五月也三朝正論士大夫家往往有之紹興庚申歲明清侍親居山隂方總角有學者張堯叟唐老自九江來從先人適聞岳侯父子伏誅堯叟云僕去歲在匡廬正覩岳侯葬母儀衛甚盛觀者塡塞山間如市解后一僧為僕言岳葬地雖佳但與王樞密之先塋坐向既同龍虎無異掩壙之後子孫須有非命者然經數十年再當昌盛子其識之今迺果然未知它日如何耳王樞密迺襄敏本江州人葬其母於鄉里有十子輔道既罹横逆而有名宇者為開封幕過橋墮馬死名端者待漏禁門簷瓴氷桂折墜穿頂而沒後數十年輔道之子炎弼彥融以勲德之裔朝廷錄用以官把麾持節升直内閣炎弼二子萬全萬樞今皆正郎而諸位登進士第者接踵岳非辜之後凡三十年滿洗寃誣諸子若孫驟從縲紲進躐清華昔日之言猶在耳也紹興癸亥和議初成有南雄太守黄逹如者考滿還朝獻言請盡誅前此異議之士庶幾以杜後患秦㑹之喜之薦為監察御史方數日廣東部使者韓球按其􅂍汙鉅萬奏牘既上雖秦亦不能揜僅止罷絀人亦快之洪景伯兄弟應博學宏詞以克敵弓銘為題洪惘然不知所出有巡鋪老卒覩於案間以問洪云官人欲知之否洪笑曰非而所知卒曰不然我本韓世忠太尉之部曲從軍日目見有人以神臂弓舊様獻於太尉太尉令如其制度製以進御賜名克敵并以歲月告之洪盡用其語首云紹興戊午五月大將云云主文大以驚喜是歲遂中科目若有神助焉此葢熈寜中西人李宏中創造因内侍張若水獻於裕陵者也李平叔云鄭亨仲剛中為川陜宣撫節制諸將極為尊嚴呉璘而下每入謁必先堦墀然後升㕔就坐忽璘除少保來謝語主閽吏乞講鈞敵之禮吏以為白亨仲亨仲云少保官雖高猶都統制耳倘變常禮是廢軍容少保若欲反則取吾頭可矣堦墀之儀不可易也璘皇恐聽命人皆韙之政和末秦㑹之自金陵往參成均行次當塗境上値大雨水衝橋斷不能前進虛中居民開短窻延一士子教其子弟士子於書室窻中窺見秦徒歩執葢立風雨中淋漓悽然甚憐之呼入令小愒至晩雨不止白其主人推食挽留而共榻翌日晴霽送之登途秦大以感激秦既自叙其詳復詢士之姓名云曹筠庭堅也秦登第即宦顯絶不相聞久之曹建炎初以太學生隨大駕南幸至維揚免省䇿名後為台州知錄老不任事太守張偁對移為黄巖主簿無憀之甚時秦專權乆矣曹一夕偶省悟其前此一飯之恩因謀諸婦婦吳越錢族晩事曹頗解事謂曰審爾何不漫愬之筠因便介姑作詩以致祈懇末句云浩浩秦淮千萬頃好將餘浪到灘頭其淺陋不工如此秦一覽慨然興念以删定官召之尋改官入臺遂進南床高宗惡之親批逐出秦猶以為集英殿修撰知衢州未幾坤維闕師即擢次對制閫全蜀到官之後弛廢不治遂致孝忠之變秦竟庇䕶之奉祠而歸秦没始奪其職云方務德帥荆南有寓客張黜者迺魏公之族子出其迺翁所記建炎荆州遺事一編示務德云孔彥舟領衆十餘萬破荆南城是時朝廷方經理北敵未暇討捕羣盗張單騎入城說諭彥舟使之効順朝廷著名青史勿罣丹書為天下笑彦舟感悟與部下謀咸有納欵之意張又語之云太尉須立勞効庶為朝廷所信四川宣撫乃我之叔父也目今去朝廷甚逺俟見太尉立功當為引領頭目人入川叅宣撫以求保奏推賞如何彥舟云甚好今有一項敵人往湖南劫掠聞朝夕取道襄陽以歸北界待與欄截勦殺以圖報國張云此項來寇人數不}
