front:
  text: 揮麈後録卷之四七四汝隂王明淸徽宗宣和七年十二月二十一日就􅐶謨殿張燈預
  hash: sha256:72982279d992cec1d274c076aae928d9ca99ea39e25bf02c4d77e10cf9d2bf0a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_009-1a}
body:
  text: 賞元霄曲燕近臣命左丞王安中中書侍郎馮熙載為詩以進安中云上帝通明闕神霄廣愛天九光環日月五色麗雲煙紫袖開三極瓊璈列萬仙希夷麈境斷髣佛玉經傳妙道逢昌運真王撫契賢龜圖規大壯龍位正純乾穹昊親無間皇居掇自然剛風同變化祥氣共陶甄層觀星潢上重闉斗柄邊摩空七雉峻冠嶠六鼇連夢想何嘗到階升信有緣昕朝𥘉放仗密宴忽聞宣清禁來鳴珮修廊入並肩獸鋪金半闔鸞障繡微褰霽景留庭砌雷文繪桷梴宫簾波錦漾殿榜字金填花擁巍巍座香浮秩秩筵髙呼稱萬億韶奏侍三千華歲推堯曆元璣候舜璿氷霜知臘後梅栁認春前造化應呈巧芳菲巳鬪妍樛枝雕檻小多葉露桃鮮錯落飛杯斚鏘洋雜管絃承雲歌歷歷回雪舞翩翩黼幄祥氛合銅壷永漏延鎬京方置醴羲馭自停鞭乃聖情深渥諸臣意更虔宗藩親魯衛相芾拱閎顛側辨恩光浹中觴詔蹕旋寶薰携滿袖御果得加籩要賞嬉遊盛俄追步武遄騰身復道表送日夾城田耎仰揖蒼龍象旁臨艮嶽巔謳歌紛廣陌簫鼓樂豐年赫奕攢輕幰珍竒集市廛博盧多袒跣飲肆競蹁蹮蕃衍開朱邸崔嵬照彩椽橋虹彎矗矗江練泮濺濺擊柝周廬晚張燈别院先餘霞搖綺暈列宿舍珠躔浩蕩三山島稜層十丈蓮再趍天北極却立榻東偏既用家人禮仍占聖製篇兕觥從酩酊蟾魄待嬋姢轉盻隨親指環觀得縱穿曲屏江浪蹙巨柱赤虬纏光透垂枝井晶銜帶壁錢蕭臺千級峻重屋八窗全就席花墩匝行樽紫袖揎交輝方爍爍起立復闐闐邃宇會寧過中宵勝賞專鋪陳尤有韻清雅不相沿户箔明珠串欄釭水碧棬規模啇鑄欵識魯壷鐫秦曲移箏柱唐粧儼鬢蟬窄襟珠綴領髙朵翠為鈿喜氣排寒沍輕颸洗靜便層琳籍璣組方鼎炷龍涎瑪瑙供盤大玻璃琢盞圎暖金傾小榼屑玉釀新泉帝豫天才異英姿棣蕚聮頻看揮斗碗端是吸鯨川推食俱均逮攘餐及墜捐海螯𥘉破殼江柱乍離淵寧數披綿雀休論縮頸鯿南珍誇飣餖北饌厭烹煎賜橘懷頳卵酡顔釂寶船言歸荷慈惠未節笑拘攣放鑰嚴扄啓籠紗逸足牽氷輪挂銀漢夜色映華韉人識重熙象功參獨斷權五辰今不忒六氣永無愆天紀承三古時雍變八埏比閭增板籍疆埸罷戈鋋文軌包夷夏絃歌遍幅貟恢儒榮藻薦作士極魚鳶慶胄貽謀顯多男景福綿迓衡常穆穆遵路益平平亭障今踰隴耕耘久際燕信通鵬海漲威竄犬戎羶東擬封雲岱西將欵澗瀍琳科宣蘂笈玉府下雲軒帝籍勤𥘉播宫蠶長自眠繭絲登六寢稃米秀中田廟鶴垂昭格壇光監吉蠲靈芝滋􅌲蠢甘醴湧潺湲合教尨風革頒經衆疾痊雨隨親禱降河避上流遷執契皇猷洽披圖福物駢太和輸橐籥妙用絶蹄筌此際君臣恱應先簡册編雅稱魚罩罩頌述鼓咽咽詎比千齡遇猶聞四始箋羇臣起韋布陋質愧駑鉛驟俾陪機政由來出眷憐恩方拜綸綍報未效塵涓密席叨臨勸凡蹤曲拳雖無三峽水曾步八花磚渝望知難稱才慳合勉􅏧鈞天思盡賦賸續白雲箋熙載云化工欲放陽春到先教元冥戮衰草疑水封地萬木僵誰向雪中探天巧璿璣星回斗指寅羣芳未知時巳春人心蕩漾趂佳節燈夕獨冠年華新升平萬里同文軌井邑相連通四裔蘭膏競吐夜烘春和叔回車避羲轡巍巍九禁倚天開溫風更覺先春來試燈不用雨花俗迎陽為却寒崔嵬宣和𥘉載元冬尾瑞白才消麈不起穆清光賞屬欽鄰錦繡雲龍頒宴喜𥘉聞傳詔開睿謨步障幾里承金鋪調音度曲三千女正似廣樂陳清都遏雲妙唱韓娥侣回雪飛花稱獨步千春蟠木效紅英獻壽當筵豈金母上林晚色煙藹輕景龍遊人歡笑聲霞裾月珮擁仙仗翠鳯挾輦趍平成銅華金掌散晶彩翠碧重重簇珠琲先從前殿望修廊日出綺霞紅滿海神光通透雲母屏驪龍出舞波濤驚煌煌黼座承天命座下錯浴如明星榻前玉案真核旅獸炭銀爐夜𥘉鼓憲天重屋訝雲屯崇道簫臺疑蜃吐前楹火柱回萬牛藺卿璧碎色光浮周圍照耀眼界徹氷壷漾月生珠流點點金錢盡銜璧豹髓騰輝粲銀礫絲篁人籟有機緘繳繹清音傳屋壁須臾隨蹕登會寧如驂鸞鶴遊紫清彩蟾倒影上浮空纎雲不點惟光明四壁垂簾玉非玉銀釭吐艷相連屬棼楣橫帶碧玻璃一朵翠雲承日轂萬光閃爍爭吐吞爥龍㗸耀輝四崑又如電母神鞭馳金蛇著壁不可捫端信竒工通造化豈比胡人能幻假丹青漫數顧虎頭盤礴解衣未容寫此時帝御鈞天臺紫垣兩兩明三台尚方飲器萬金寶古玉未足誇雲雷帝傍侍女雲華品玉立仙標及時韻四音促柱泛笙簫應有翔鸞落千仭龍瓶㵼酒如流泉御厨絡繹紛珍鮮榻邊爭欲供天笑快倒頗類虹吸川厭厭夜飲方歡浹玉漏頻催鼓三疊金門𥘉下醉歸時正見氷輪上城堞微臣去歲陪淸班惡詩誤辱重曈觀小才易窮真鼠技再賦愈覺相如慳履道彥七五為二集中今不復印行故録於此宣和𥘉徽宗有意征遼蔡元長鄭逹夫不以為然童貫𥘉亦不敢領略惟王黼蔡攸將順贊成之有諜者云天祚貌有亡國之相班列中或言陳堯臣者㜈州人善丹青精人倫登科為畫學正黼聞之甚喜薦其人于上令銜命以視之擢水部貟外郎假尚書以將使事堯臣即挾畫學生二貟俱行盡以道中所歷形勢向背同繪天祚像以歸入對即云虜主望之不似人君臣謹寫其容以進若以相法言之亡在旦夕幸速進兵兼弱攻昧此其時也并圖其山川嶮易以上上大喜即擢堯臣右司諌賜豫巨萬燕雲之役遂決時堯臣方三十三歲遷至侍御史會蔡元長復將起預政事黼誅堯臣望風上疏以元長前日不合人情狀攻之𥘉榜朝堂然上猶眷元長黜堯臣為萬州監稅而元長竟不告廷堯臣繼寢是行黼敗堯臣亦遭斥建炎中監察御史李寀疏其為黼鷹犬誤國之罪始詔除其𥘉秦會之主泮髙密堯臣以滄州掾曺同為京東漕同試官因以厚甚會之擅國遂盡復故官雖不敢用招至武林每延致相府𣢾密敘舊堯臣以前所錫萬金築園亭于西湖之上極其雄麗今所謂陳侍御花園是也會之殂湯致逺為御史欲露臺評而周為髙方祟堯臣之妻兄致逺之腹心力回護之遂免先以壽終李仁父長編載胡交修繳其祠命之章尤摘其姦其嗣懇為髙作行狀以蓋前迹為髙後亦悔之會之炎炎時前御史敢七六於國門外建苐以此可見為髙之子樂云靖康之變士大夫紀録排日編綴者多矣其間蓋亦有逸事焉近從親舊家得是時進士黃時侢徐揆假光逺三人所上虜酋書云大宋進士黃時侢謹齋沭裁書于大金二帥曰嘗謂良藥苦口利於病忠言逆耳利於行若夫樂軟熟而憎鯁㘦取諛美而捨忠良雖堯舜無以致治時稱淮右寒生家襲儒業老父每訓曰不在其位不謀其政罔可輕言自取戮辱由是鉗口結舌守分固窮未曾敢以片言辨時是非方今國家艱難苟有見聞寧忍甘陷盲聾之域非不知身為宋民不當以狂妄之辝干冒元帥聰德也非不知一言忤意死未塞責也直欲內報吾君之德外光二元帥之名一身九死又何憾焉時侢㘦觀我宋自崇寧以來姦臣誤國竊升威柄者有之妨公害民者有之大啓幸門壅遏言路者有之所以元帥因之遂有此舉道君太上皇帝親降詔書反巳痛責斷出宸心乃傳大寶今皇帝即位未久適丁國難以孝行夙彰天人咸服今元帥斂城不下蓋為此也時侢伏覩去年十二月二十三日國書正為催督金銀表段有云須索之外必不重取禮數優異保無它虞奈何都民朝夕思念燃頂煉臂延頸跋踵以望御車之塵也元帥豈不念天生萬民而立之君以主治之乃復須索他物絡繹不絶參酌以情雖不足以報再生之萬一然方册所載自古及今未聞有大事既決反緣細故而延萬乘之君者證以國書似非𥘉意愚㘦惑之念我國家曩昔傷財害民之事結怨連禍之人尚可目也曰內待伶倫美女是巳曰宫室衣服聲樂是巳今軍前一一須索唯復謂此悉皆國害堅欲為我痛鋤其根株耶亦欲驅挈歸境以為自奉之樂耶軍機深密非愚陋可得而知也法曰上賢下不肖取誠信去詐偽禁暴亂止奢侈又曰為雕文刻鏤技巧華飾而傷農事者必禁之願元帥詳覽此章熟思正論殺人以挺與刃無以異也儻使宿姦復𬒳新寵是猶禾莠相雜而耕者未耘膏盲之疾而醫者未悟則將日漸月稽習以成風不害此而害彼何時巳矣時侢懵不知書愚不練事言切而其意甚忠事雖小而所繫甚大方議修書鋪陳管見未及形言衆乃自禍鳴呼天網恢恢踈而不漏老蠹巨惡難於逃覆載之中也且如內侍藍欣醫官周道隆樂官孟子書俱為平昔僥濫渠魁今取過軍前坐席未暖乃忘我宋日前恩寵之優不思兩國修講和好之始尚循故態妄興間諜稱有金銀在本家窖藏遂煩元帥怪問考諸人用心雖粉骨碎軀難塞滔天之罪請試陳之今焉明降御筆根括金銀以報大金活生靈之恩㘦須盡力不可惜人情苟可以報大金者雖髮膚不惜只是要有盡取於是有司纍行勸諭及指為禁物稍有隱藏以軍法從事其措置根括非不盡心上至宗廟器皿下至細民首飾罄其所有欲酬再造而天子且曰朕可以報金國者雖髮膚不惜凡為臣子固當體國愛君匹兩以上盡合送納藍欣等不務濟朝廷之急報元帥之仁輒抵冒典憲埋窖金銀慳吝庸逆無如此之甚者若使未過軍前則人人蓄為私寶論當時根括指揮巳合誅戮切恐逐人昨緣有司根取犒賞亦嘗囚禁挾此為仇意要生事厥罪尤不可赦愚謂正當擾攘之際猶敢懷姦罔上取侫一時異日安居為國患也必矣亮元帥智周萬物不待斯言察見罪狀文王問太公主聽如何太公答曰勿妄而許勿逆而拒聖人垂教良有以也伏望元帥擴乾坤之度垂日月之明母納諛情以玷大德將藍欣等先賜行遣徇首京城不惟掃蕩宿孽又可以懲戒後人仍願元帥務全兩國之歡以慰生靈之心請我鑾輿早還禁籞軍前或有所闕朝廷亦必不違書之青史傳為盛事豈不韙歟太學生徐揆等謹獻書于大金國相元帥大子元帥揆等聞昔春秋魯宣公十一年伐陳欲以為縣申叔時諫曰諸侯之從者曰討有罪也今縣陳是貪其冨以討召諸侯而以貪歸之無乃不可乎王曰善哉吾未之聞也乃復封陳後之君子莫不多申叔時之善諌楚子之從諫千百歲之下猶且想其風采為不可及昔上皇任用非人政失厥中背盟致討元帥之職也大肆縰兵都城失守社稷幾亡而復存元帥之德也兵不血刃市不易㕓生靈幾死而幸免元帥之仁也雖楚子入陳之功未能逺過我宋皇帝以萬乘之尊兩造轅門議賞軍之資加徽號之請越在草莽信宿逾邁國中喁喁企望屬車塵者屢矣今生民無主境內騷然忠義之士食不下噎又聞道路之言以金銀未足天子未還揆等㘦惑之蓋金銀之産不在中國而在深山窮谷之間四方職貢歲有常賦邦財既盡海內蕭然帑藏為之一空此元帥之所明知也重以去歲之役增請和之幣獻犒賞之資官吏征求及於編户都城之內雖一妾婦之飾一器用之微無不輸之於上以酬退師之恩也又自兵興以來邦國未寧道路不通冨啇大賈絶迹而不造境京師豪民蓄積素厚者悉散而之四方矣間有從宦王畿仰給於俸祿者飦粥之外儲無長資豈復有金銀之多乎今雖天子為質猶無益於事也元帥體大金皇帝好生之德每以赤子塗炭為念大兵長驅直抵中原未嘗以屠戮為事所以愛民者至矣凡元帥有存社稷之德活生靈之仁而乃以金銀之故質君是猶愛人子弟而辱及其父祖與不愛奚擇元帥必不為也昔楚子圍鄭三日克之鄭公肉袒牽羊以迎左右曰不可許王曰其君能下人必能信用其民矣退三十里而許之平春秋書之後丗以為美談揆等願元帥推惻隱之心存終始之惠反其君父損其元數班師振旅緩以時月使求之四方然後遣使人獻則楚子封陳之功不足道也國中之人德元帥之仁豈敢弭忘傳曰主憂臣辱主辱臣死揆等雖卑賤輒敢浼死以紓君父之難唯元帥矜之大宋進士段光逺謹齋沭裁書百拜獻于大金元帥軍前僕嘗讀春秋左傳有曰親仁善鄰國之寶也又嘗讀禮記聘義有曰輕財重禮則民遜矣讀至於斯未嘗不三復斯言掩卷長嘆切謂非賢聖之人疇能如此仰而思之在昔太祖皇帝膺天明命以揖遜受禪奄有神器為天下君創業垂統重熙纍洽垂二百年東漸西𬒳南洽北暢薄海內外悉為郡縣殊方絶域悉為鄰國聘問交通絡繹道路其間義重禮隆恩深德渥方之他國唯大金皇帝為然比年以來本朝不幸姦臣用事宦官橈權罔知陳善閉邪而挌其非罔知獻可替否而引之當道欺君誤上蠹國害民靡所不至姦臣可罪庶民可吊事一至此則弔民問罪之師有不得巳而舉也共惟大金元帥舉問罪之師施好生之德念今聖之有道憫斯民之無辜斂兵不下崇社再安生靈獲全深厚之惠若海涵而春育生成之賜若天覆而地載兩國永和萬姓恱服夫如是則親仁善鄰曷以加於此哉特枉鑾輿為民請命重蒙金諾與國通和帝謂髮膚亦所不惜况於金帛豈復有辝宵旰焦勞不遑寢食官户根括急於星火竭帑藏之所積罄貧下之所有甘心獻納莫或敢違雖曠蕩之恩難以論報而有限之財恐或不敷久留聖駕痛㘦民心夙夜匪懈而事君之禮廢於朝號泣旻天痛君之民滿於道仰望恩慈再垂矜念兾聖駕之早還慰下民之痛切夫如是則輕財重禮曷以加于此哉伏念光逺草茅寒士沐浴膏澤涵泳聖涯隂受其賜于兹有年才踈命薄報德無階今兹聖駕蒙塵于外僕雖至愚噫嗚泣涕疾首痛心其於庶民尚幸仰賴元帥再生之恩若天地無不覆載於人無所不容僕是以敢輸忠義激切之誠干冒威嚴仰祈垂聽俯賜矜憐無任戰懼皇恐哀懇之至不宣俶擾之際排難解紛伏節死誼有如此者嘉其忠義慨慷歲久慮不復傳所以録之張邦昌為虜人所立反正之功蓋出于吕舜徒吕氏七七自敘甚詳不復重紀啓其端者堂吏張思聰也應天中興思聰巳死詔特贈宣教郎思聰字謀道知書能文嘗從先人學今其子孫尚有事刀筆于省中者然亦不振虜人立張偽詔與其謝牘併録于後維天會五年歲次丁未二月辛亥朔二十一日辛巳皇帝若曰先皇帝肇造區夏務安元元肆朕纂承不敢荒怠夙夜兢兢思與方國措于治平粵惟有宋爰乃通鄰貢歲幣以交歡馳星軺而講好斯於萬丗永保無窮蓋我大造于宋也指斥不録今者國既乏主民冝混同然念厥功誠非貪土遂致帥府與衆推賢僉曰太宰張邦昌天育疏通神咨睿哲在位著忠良之譽居家聞孝友之名實天命之有歸乃人情之所徯擇其賢者非子其誰是用遣使諸部宫都署尚書左僕射權簽書樞密事韓昉持節備禮儀以璽綏册命爾為皇帝以授斯民國號大楚都于金陵自黃河以外除西夏對新疆埸仍丗輔王室永作藩臣貢禮時修汝勿疲于述職聘問歲致汝無緩於忱誠於戲天生蒸民不能自治故立君而臨之君不能獨理故樹官以教之乃知民非后不治非賢不守其于有位可不慎歟子𢡟乃德嘉乃丕休日慎一日雖休勿休欽哉其聽朕命天會五年三月日大楚皇帝邦昌謹致書于國相元帥皇子元帥今月初七日依奉聖旨特降樞臣俯加封册退省庸陋之資何堪對揚之賜尋因還使附致感悰願亟拜於光儀庶少伸於謝禮未聞台令殊震危衷遂遣從官具敷誠懇重蒙敦諭仰戴眷存然而掩目未前撫躬無措恐浸成於稽緩實深積於兢惶伏望恩慈早容趍詣俟取報示徑伏軍門拳拳之誠併留靣敘不宣謹白建炎元年詔云九月二十五日三省同奉聖旨張邦昌初聞以權冝攝國事嘉其用心寵以髙位雖知建號肆赦度越常格支優賞賜錢數百萬緡猶以迫於金人之勢其示外者或不得巳比因鞫治他獄始知在內中衣赭衣履黃禋宿福寧殿使宫人侍寢心迹如此甚負國家遂將盜有神器雖欲容貸懼祖宗在天之靈尚加惻隱不忍顯肆市朝今遣奉議郎試殿中侍御史馬伸問狀止令自裁全其家屬仍令潭州日給口劵常切拘管先是祐陵在端邸有妾彭者稍惠黠上憐之小故出嫁為都人聶氏婦上即位頗思焉復召入禁中以其嘗為民妻無所稱但以彭婆目之或呼為聶婆婆其實未有年也恩幸一時舉無與比父黨夫族頗招權顧金錢士大夫亦有登其門而進者逮二聖北狩彭以無名位獨得留內庭虜人強立邦昌僣位之後雖竊處宸居多不敢當至尊之儀服御之屬未始易也寢殿之邃不敢履也一夕偶置酒彭生乘邦昌之醉擁之曰官家事巳至此它復何言即衣之赭色半臂邦昌醉中猶能却彭呼二三宫人力挽而穿之益之以酒掖邦昌入福寧殿使宫人之有色者侍邦昌寢邦昌既醒皇恐而趍就它室急解其衣固巳無及矣邦昌卒坐此以死蓋詔中及之者也姑敘邦昌初終于秩焉烏乎彭生者誠可誅矣然當時在庭之臣被二聖寵榮者尚奉賊稱臣七八賣降恐後彼小人也又何足道哉彭事陸務覲云粘罕相金國取大遼繼擾我朝既歸乃欲伐夏國夏人隂為之備久矣忽求釁於夏言欲馬萬匹夏人從其請先以所練精兵每一馬以二人御之紿言于金人曰萬馬雖有然本國乏人牽攏今以五千人押送請遣人交之粘罕遣人往取皆善騎射者其實欲以窺之也至境未及交馬夏人群起金國之兵悉斃夏人復持馬歸國粘罕氣沮自此不敢西向發一矢玉隆外祖云揮麈後録卷之四
