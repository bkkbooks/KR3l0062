front:
  text: 揮麈後録卷之三五六汝隂王明清宋興巳來宰輔封國公者巳見宋次道春明退朝録
  hash: sha256:d82cd8c9007e87a2f4d3c0c9662e53153535c9f9d60fb0914c979662635e8273
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_008-1a}
body:
  text: 自熙寧以後者今列于後陳丞相秀王文公舒荆王文恭郇𡵨韓獻肅康章子厚申韓文定儀蔡元長嘉衛魏楚陳魯童貫涇成益楚徐豫何正憲榮鄭文正崇宿燕余源仲豐衛劉文憲康鄧子常莘王黼崇慶楚蔡攸英燕白丞相崇吕忠穆成張忠獻和魏秦忠獻莘慶兾秦魏益張循王濟廣益韓蘄王英福潭秦熺嘉陳文恭信福魯湯進之榮慶𡵨虞忠肅濟華雍史文惠永衛魯魏陳正獻申福魏梁文靖儀鄭趙丞相沂五七王丞相信福兾魯周丞相濟益留丞相申京丞相魏謝丞相蔡元道作官制舊典極其用心甚為詳縝但事有抵牾或出於穿鑿者有所未免明清嘗略引舊文以證數項于印本上僉貼呈似遂初尤丈延之深以歎賞其帙尚存尤丈處不復悉紀姑以一條言之熙寧三年許將以磨勘當遷宰相王安石方欲抑三人之進取遂轉太常博士𥘉下筆方成大字堂後官以手約定具陳祖宗舊制當遷右正言安石乃改大字右筆作口字因知前輩堂後官猶能執祖宗之法耳時先公掌外制乃見而知之者明清以謂磨勘吏部成法非宰相所得而專縱使有之王荆公之文過執拗丗所共知當新法之行雖韓冨歐范司馬諸公與之爭悉不能回其意豈一堂吏能轉其筆耶元道云先公即延慶王荆公薦李資深時蘇子容李才元宋次道繳其改官除監察御史之命荆公改授延慶即為書行延慶字五八仲逺文忠齊之子也别命書讀始此方通興化人與蔡元長鄉曲姻婭之舊元長薦之以登要路其子軫宏放有文采元長復欲用之軫聞之即上書訟元長之過既逹乙覽元長取其疏自辨云大觀元年九月十九日勑中書省送到司空左僕射兼門下侍郎魏國公蔡京劄子奏伏蒙宣示方軫章疏一項論列臣睥睨社稷內懷不道效王莽自立為司空效曹操自立為魏國公視祖宗神靈為無物玩陛下不啻若嬰兒專以紹述熙豐之説為自媒之計上以不孝劫持人主下以謗訕詆誣恐赫天下威震人主禍移生靈風聲氣熖中外畏之大臣保家族不敢議小臣保寸祿不敢言顛倒紀綱肆意妄作自古為臣之姦未有如京今日為甚爰自崇寧巳來交通閽寺通謁宫禁蠹國用則若糞土輕名器以市私恩內自執政侍從外至帥臣監司無非京之親戚門人政事上不合於天心下悉結於民怨若設九鼎鑄大錢置三衛興三舍祭天地於西郊如此之類非獨無益又且無輔其意安在京凡妄作必持説劫持上下曰此先帝之法也此三代之法也或曰熙豐遺意未及施行仰惟神考十九年間典章文物粲然大備豈蔡京不得馳騁於當年必欲妄施於今日以罔在天之神靈凡欲奏請盡乞作御筆指揮行出語士大夫曰此上意也明日或降指揮更不施行則又語人曰京實啓之也善則稱巳過則稱君必欲陛下斂天下怨而後巳是豈宗社之福乎天下之事無常是亦無常非可則因之否則革之惟其當之為貴何必三代之為哉李唐三百年間所傳者二十一君所可稱者太宗一人而巳當時如房杜王魏智慮才識必不在蔡京之下竊觀正觀間未嘗一言以及三代後丗論太宗之治者則曰除隋之亂比迹湯武致治之美庶幾成康自古功德兼隆由漢以來未之有也京不學無術妄以三代之説欺陛下豈不為有識者之所笑也元豐三年廢殿前廨宇二千四百六十間造尚書省分六曹設二十四司以揔天下機務落成之日車駕親幸命有司立法諸門牆窗壁輒增修改易者徒二年京惡白虎地不利宰相盡命毁坼收置禁中是欲利陛下乎是謂之紹述乎括地數千里屯兵數十萬建置四輔郡遣親信門人為四輔州總管又以宋喬年為京畿轉運使密諷兖州父老詣闕下請車駕登封意在為東京留守是欲乘輿一動投間竊發呼吸群助不知宗廟社稷何所依倚陛下將措聖躬於何地臣嘗中夜思之不覺涕泗橫流也臣聞京建議立方田法欲擾安業百姓借使行之豈不召亂乎又况數年間行鹽鈔法朝行夕改昔是今非以此脫賺客旅財物道途行旅謂朝廷法令信如寒暑未行旬浹又報鹽法變矣鈔為故紙為棄物家財蕩盡赴水自縊客死異鄉孤兒寡婦號泣籲天者不知其幾千萬人聞者為之傷心見者為之流涕生靈怨歎皆歸咎於陛下然京自謂暴虐無傷奈皇天后土之有靈乎所幸者祖宗不馳一騎以得天下仁厚之德涵飬生靈幾二百年矣四方之民不忍生事萬一有壟上之耕夫等死之亭長嘯聚亡命於一方天下嚮應不約而從陛下何以枝梧其禍乎內外臣獠皆京親戚門人將誰為陛下使乎京乘此時談笑可得陛下之天下也元符末年陛下嗣服之𥘉忠臣義士明目張膽思見太平投匭以陳巳見者無日無之京鉗天下之口欲塞陛下耳目分為邪等賊虐忠良天下之士皆以忠義為羞方且全身逺害之不暇何暇救陛下之失乎奈何陛下以京為忠貫星日以忠臣義士為謗訕詆誣或流配逺方或除名編置或不許齒仕籍以言得罪者無慮萬人矣誰肯為陛下言哉蔡攸者垂髫一頑童耳京遣攸日與陛下遊從嬉戲必無文武堯舜之道啓沃陛下惟以花栽怪石籠禽檻獸舟車相㗸不絶道路今日所獻者則曰臣攸上進明日所獻者則又曰臣攸上進故欲愚陛下使之不知天下治亂也久虛諫院不差人自除門人為御史京有反狀陛下何從而知臣是以知京必反也臣與京皆壷山人也案讖云水繞壷公山此時方好看京諷部使者鑿渠以繞山日者星文謫見西方日蝕正陽之月天意所以啓陛下聰明者可謂極也奈何陛下略不省悔默悟帝意止於肆恩赦開寺觀避正殿減常膳舉常儀以答天戒而巳然國賊尚全首領未聞梟首以謝天下百姓此則神民共憤祖宗含怒在天之日久矣陛下勿謂雉鳴乎鼎榖生于朝不害髙宗太戊之德九年之水七年之旱不害堯湯之聖古人之事出於適然今日之事禍發不測天象人情危栗如是伏惟陛下留神聽覽念藝祖創業之難思履霜堅氷之戒今日氷巳堅矣非獨履霜之漸願陛下早圖之後悔之何及臣批肝為紙瀝血書辝忘萬死叩天閽區區為陛下力言者非幕陛下爵祿而言也所可重者祖宗之廟社所可惜者天下之生靈而自忘其言之迫切陛下殺之可也赦之可也竄之可也臣一死生不繫於重輕陛下上體天戒下顧人言安可愛一國賊而忘廟社生靈之重乎冒瀆天威無任戰栗之至謹備録如后臣讀之駭汗若無所容臣以愚陋備位宰司不能鎮伏紀綱訖無毫髮報稱徒致姦言干浼聖聽且人臣有將必誅之刑告言不實有反坐之法臣若有是事死不敢辝臣若無是事方軫之言不可不辨伏望聖慈付之有司推究事實不可不問取進止詔軫削籍流嶺外後竟殂于貶所元長猶用其兄會為待制家間偶存此疏録以呈太史李公仁甫載之長編當是時也元長領天下事誰敢言者軫獨能奮不顧身無所回避如此使九重信其言逐元長元長悟其説急流勇退則國家無五九後來之患元長與軫得禍俱輕三者備矣宣和元年八月丁丒皇帝詔大晟作景鍾是月二十五日鍾成皇帝以身為度以度起律以律審聲以聲制鍾以鍾出樂而樂宗焉于以祀天地享鬼神朝萬國罔不用乂在廷之臣再拜稽首上頌明明天子以身為度有景者鍾衆樂所怙於昭于天乃眷斯顧揚于大庭罔不時序億萬斯年受天之祐此翰林學士承旨強淵眀之文也偶獲斯本六十謹録于右王寀輔道樞密韶之子少豪邁有父風早中甲科善議論工詞翰曾文肅蔡元長薦入館為郎後以直祕閣知汝州考滿守陜年未三十輕財喜士賔客多歸之坐不覺察盜鑄免官自負其材受辱不羞是時羽流林靈素以善役鬼神得幸而輔道之客兾其復用乘時所好昌言輔道有術可致天神出靈素上抳不得施蓋其客亦能請紫姑作詩詞而巳非林之比輔道固所不解然實不知客有此語也輔道嘗對別客謂靈素太誕妄安得為上言之其言適與前客語偶合工部尚書劉炳子蒙者輔道母夫人之姪孫也及其弟煥子宣俱長從班歆豔一時時開封尹盛章新用事忌炳兄弟進思有以害其寵未得也𥘉炳視輔道雖中表然炳性謹厚每以輔道擇交不慎踈之會炳姑適王氏於輔道為嫂一日輔道語其嫂曰某久欲謁子蒙兄弟奉從容然不得其門而入奈何嫂曰俟我至其家可往候之輔道於是如其教候炳於賔舍久之始得通炳逡巡猶不欲見迫於其姑勉強接之既就坐談論風生亹亹不倦炳大歎服入告其姑曰久不與王叔言其進乃爾自恨不及也因遣持馬人歸止宿其家自是始相親洽殆至興獄朱及歲也前客語既逹靈素靈素忿怒泣請于上且增加以白之曰臣以羇旅荷陛下寵靈而姦人造言纍及君父乞放還山以避之不然願置對與之理上令逮捕輔道與所言客姚坦之王大年以其事下開封使者至輔道自謂無它亦不以介意語家人曰辨數乃置無以為念也至獄中刻木皆出紙求書且謂輔道曰昔蘇學士坐繫烏臺時衛獄吏實某等之父祖蘇學士既出後每恨不從其乞翰墨也輔道喜作歌行以贈之處之甚怡然而盛章以炳之故得以甘心矣因上言詞語有連及炳者乞併治之上曰炳從臣也有罪未冝草草炳既聞上語不疑其他一日上幸寶籙騑蹕齋宫從官皆在焉炳越班靣奏簾外曰臣猥以無狀待罪邇列適有中傷者非陛下保全巳虀粉矣再拜而退炳既謝巳舉首始見章在側注目瞪視惶駭失措深以為悔翌日章以急速請對因言寀與炳腹心誹謗事驗明白今對衆越次上以欺罔陛下下以營惑羣臣禍將有不勝言者幸陛下裁之上始怒是日有旨內侍省不得收接劉炳文字炳猶朱知之以謂事平矣故不復間防章既歸遣開封府司録孟彥弼携捕吏竇鑒等數人即訊炳於家炳囚服出見分賔主而坐詞氣慷慨無服辭彥弼既見其不屈欲歸而竇鑒者語彥弼曰尚書几間得寀一紙字足以成案矣遂亂抽架上書適有炳著撰藁草翻之至砥見炳和輔道詩尚未成首云白水之年大道盛掃除荆棘奉髙真詩意謂輔道嘗有嫉惡之意時尚道目上為髙真爾鑒得之以為竒貨歸以授章章命其子并釋以進云白水謂來年庚子寀舉事之時炳指寀為髙真不知以何人為荆棘將置陛下於何地豈非所謂大逆不道乎但以此坐輔道與客皆極刑炳以官髙得弗誅削籍竄海外煥責授團練副使黃州安置凡王劉親屬等苐斥謪之并擢為祕書省正字數日而死出現其父巳為蛇矣華陽張德逺文老子蒙之壻也又并娶德逺之妹目覩其事且當時亦以有連坐送吏部與監當故知之為詳嘗謂明清曰德逺死無人言之者矣子其因筆無惜識之文老嘗為四川茶馬東坡先生賦張熙明萬卷堂詩即其父也文老博極羣書尤長史學發言可孚故盡列其語又益知丗所傳輔道遇宿冤六一之事為不然云王景彛故弟在京師太子巷初開寶間江南李後主遣其弟從善入貢留不遣建宅以賜故都人猶以太子目之也從善死後歸王氏宣和𥘉崔貴妃者得幸祐陵未育子有劉康孫者卜祝之流以術蒙恩甚厚為遙郡觀察使言之於崔之兄曰王氏所居巷名既佳而宅中有福氣冝請於上崔遣人告於妃妃以致懇上上喻京尹王革令善圖之革即呼王氏子弟導指意王諸子愚騃不知時變遲遲未許崔欲速得之會舍旁有造磬者時都下𥘉行當十錢崔訹人誣告王諸子與鄰人盜鑄革即為掩捕煆錬黥竄而沒其宅遂以賜崔崔氏既得之上幸其居設酺三日榮冠一時未幾崔命康孫禱於宅中樹下適有爭寵者譛於上及中宫云崔氏姊弟夜祠祭與巫覡祝詛叵測會上嘗夢明節劉妃泣訴以為人猒勝致死上因以語妃妃抗上語頗不遜上怒付有司捕康孫等窮治康孫𣢾承實嘗以上及崔妃所生年月禱神求嗣且祈固寵呪詛則無之猶坐指斥詔臠康孫於宅前國醫曹孝忠併坐流竄孝忠亦幸進為廉車二子濟渙俱冒館職至是皆斥之孝忠嘗侍明節藥故也仍命懸康孫首于所祝樹上制云貴妃崔氏乏柔順進賢之志溺姦淫罔上之私惑于竒邪隂行媚道散資産以掠衆譽招術者以彰虛聲祝詛同列以及於死生指斥中宫而刑於切害談命術以徼後福挾猒勝以及乘輿可降充庶人移居別院崔兄除名嫂姊妹並逺外編管距王氏之籍不及一歲云陳成季迪云時任大理卿親六二鞫其事承平時宰相入省必先以稱稱印匣而後開蔡元長秉政一日稱匣頗輕疑之搖撼無聲吏以白元長元長曰不須啓封今日不用印復携以歸私苐翌日入省稱之如常日開匣則印在焉或以詢元長元長曰是必省吏有私用者偶倉猝不能入倘失六三措急索則不可復得徒張皇耳蔡元長晚年語其猶子耕道曰吾欲得一好士人以教諸孫汝為我訪之耕道云有新進士張觷者其人遊太學有聲學問正當有立作可備其選元長領之涓辰延致入館數日之後忽語蔡諸孫云可且學走其它不必諸生請其故云君家父祖姦憍以敗天下指日喪亂惟有奔竄或可脫死它何必解耶諸孫泣以訴于元長元長愀然不樂命置酒以謝之且詢以救弊之䇿觷曰事勢到此無可言者目下姑且收拾人材改往修來以補萬一然無及矣元長為之垂涕所以敘劉元城之官召張才叔楊中立之徒用之蓋繇此也耕道名佃君謨之六四孫觷字柔直南劒人後亦顯名于時巳上二事尤丈延之云靖康中有解習者東州人為郎于朝未嘗與人接談虜騎南寇擇西北帥守時相以其謹厚不泄謂沈鷙有謀遂除直龍圗知河中府習別時相云某實以訥於言故尋常不敢妄措辝於朝列今一旦付委也如此習之一死固不足惜切恐朝廷以此擇人廟謀誤矣解竟沒於難丗人以饒舌掇禍者六五多而習乃以箝口喪軀昔所未聞也外舅云薛紹彭既易定武蘭亭石歸于家政和中祐陵取入禁中龕置睿思東閣靖康之亂金人盡取御府珍玩以北而此刻非虜所識獨得留焉宋汝霖為留守見之并取內帑所掠不盡之物馳進于髙宗時駐蹕維揚上每置左右踰月之後虜騎忽至大駕倉猝渡江竟復失之向叔堅子固為六六揚帥髙宗嘗密令冥搜之竟不獲向端叔云靖康𥘉童貫既以誤國竄海外巳而下詔誅之欽宗喻宰執云貫素姦狡須得熟識其靣目者銜命追路即所在而行刑庶免差誤唐欽叟時為首相云朝臣中有張澄字逹明者與貫往還冝令其往詔除澄監察御史以行澄字逹明有一小女十餘歲玉雪可憐素所愛時天寒欲卯飲忽聞有此役駭愕戰掉柚拂湯酒碗沃其女立死逹明號慟引道怨欽叟切骨至南雄州而貫就戮明年欽叟免相留京二聖北遷虜人立張邦昌為主且驅廷臣連銜列狀欽叟僉名畢仰藥而殂建炎中逹明為中司適欽叟家陳乞恤典逹明言欽叟不能抗虜之命雖死不足褒贈繇是恩數盡寢至今不六七能理也俞彥時云馮楫濟川雷觀公逹靖康中俱為學官于京師皆蜀士也而觀以上書得之楫實先逹焉一日楫出䇿題問諸生經旨觀摘其疪訐之於稠人中曰自王安石曲學邪説之行蔡京挾之以濟其姦遂亂天下今日豈可尚習其餘論耶楫曰子去歲為學生嘗以書屬我求為蔡氏館客豈忘之耶前牘尚存譸張為幻乃尓是繇同浴而譏祼裎也二人大忿六八坐是論列皆絀為監當邵公濟云賀子忱允中靖康中為郎或有薦其持節河北者子忱微聞之忽就省户作中風狀顛仆於地呼之不醒同舍郎急命舁之以歸即牒開封府乞致仕得勑買舟南下𥘉無所苦也李邈彥思以武官為樞密都承旨朝論亦將有所委任亦效子忱之舉時聶山尹都以謂此風不可長翌日啓上以謂邈詐疾退避後來何以使人詔邈降兩官除河北提點刑獄兼攝真定府日下出門竟死於難子忱紹興𥘉以李泰發薦落致仕又三十年為參知政六九事晚節末路持祿固位而巳向荆父云秦會之嘗對外舅自言靖康末與莫儔俱在虜寨粘罕二太子者謂搜尋宗室有所未盡儔陳計於二賊乞下宗正寺取玉牒其中有名者盡行根刷無能逃矣會之在傍曰尚書之言誤矣譬如吾曹人家宗族不少有服屬雖近而情好極踈者有雖號同姓而恩義反不及異姓者多矣平時冨貴既不與共一旦禍患乃欲與之均以人情揆之恐無此七十理粘罕者曰中丞之言是由此異時之王劉既誅竄適鄭逹夫與蔡元長交惡鄭知蔡之嘗薦二人也忽降旨應劉炳所薦並令吏部具姓名以聞當議降黜宰執既對左丞薛昂進曰劉炳臣嘗薦之矣今炳所薦尚當坐而臣薦炳何以逃罪京即進曰劉炳王寀臣俱曽薦之今大臣造為此謀實欲傾臣臣當時所薦者材也固不保其往今在庭之臣如鄭居中等皆臣所引以至於此今悉叛臣矣臣亦不保其往願陛下深察上笑而止由是不直七一逹夫即再降旨劉炳所薦並不問亦丈老云明清前録記靖康中贈范文正恐是誤書近日李文授孟傳云當時乃是進擬忠宣欽宗改文正之名付出身仍於其矜其旁批云不欲專崇元祐文七二授云得之於曾文清文清吳元中妻兄冝知其詳溫益字禹弼徽考以端邸舊僚即位未久擢尹開府欽聖因山曾文肅為山陵使益為頓遞使梓宫次板橋以人衆柱折幾陷時外祖空青公侍文肅為山陵所主管文字偶問左右曰蝢遞使何在不虞益之在旁忽應曰益在斯由是怨外祖入骨髓時蔡元長巳有中禁之授使運力為引重至於斥文肅于上前元長大感之遂以為中書侍郎興大獄欲擠文肅父子於死地賴上保全之得免未幾益卒於位後元長復用其子萬石為閣學七三士以報之曾玉隆云東坡先生平生為人碑志絶少蓋不妄語可故也其作陳公弼希亮傳敘其剛方明敏之業殆數千言至比之長孺非有以心未易得之然其後無聞心竊疑焉比閲孫叔易外制集載其所行陳簡齋去非為參知政事封贈三代告詞始知乃公弼之孫取張巨山所作去非墓碑視之又知為公弼仲子忱之孫焉簡齋出處氣節翰墨文章為中興大臣之冠善惡之報時有後先其可謂無乎揮麈後録卷之三
