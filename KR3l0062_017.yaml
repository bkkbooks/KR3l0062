front:
  text: 揮麈第三録緫目
  hash: sha256:ffaebbcb00e96b294b5a5f8a17216ad2a6add1c86f10ca70e3f6155a4e92960d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_017-1a}
body:
  text: 卷之一一孝宗登真如寺鍾樓二髙宗東狩四明日録三劉希范責鄒志全書四婁陟明上髙宗書五呉處厚與蔡持正不和六曾南豐辟陳無已邢和叔爲實録檢討官卷之二七龍眠三李八宋惠直樂語九九江碑工李仲寧不肯刋黨籍姓名十蘇叔黨善畫窠石十一徽宗宣曾空青至行宫十二錢遜叔治宿州十三張夫人哭魏夫人詩十四劉季髙謁詹安丗十五秦㑹之陳議狀十六王㓜安草檄十七王禀徐微李邈忠義事迹十八吕張以勤王檄諸郡十九曾空青跋真草千字文略二十李夫人盡獲群賊二十一向伯恭徐端益忠義二十二趙叔近守秀州卷之三二十劉廷黃大本朱弁行狀二十四髙宗召見張九成二十五吕元直趙元鎮相排二十六許志仁善戯謔二十七靠背交椅自梁仲謨始二十八曾空青辯謗録十十九岳侯與王樞宻葬地一同三十黃逹如監察御史三十一洪景伯試克敵弓銘三十二鄭亨仲節制尊嚴三十三曹庭堅遭遇秦相三十四建炎荆州遺事三十五湯致逺帥浙東三十六陳師禹責降三十七孟仁仲上表三十八万俟元忠薦汪明逺三十九鄭恭老上殿陳劄子四十陳忠肅得罪秦師垣四一李泰發寓書秦相四二汪明逺宣諭荆襄四三王權和州與虜接戰四四胡昉夸誕四五湯進之封慶國公四六尤延之愽物洽聞揮麈第三録緫目終
