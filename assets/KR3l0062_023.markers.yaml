  - {type: variant, offset: 15359, length: 730, content: 易貴多識前言往行詩貴多識鳥獸草木之名至於多聞見則欲守約而守卓寡聞見則曰無約而無卓古人有取乎博洽者於此可見誠以寡陋之爲吾病不淺也范武之問殽烝籍談之忘司典可以鑒矣記礼有云學然後知不足教然後知困知不足然後能自反也知困然後能自強也丗之旁捜廣採貪多務得者其亦以自反自強者有以加力於其先故其知識聞見之多日以博洽自然人鮮得而企及雪溪先生秉太史筆諸子仲信仲言史學得之家傳惟父子志趣髙逺學問器識率加於人一等故所以自期者夐然與衆不同雖經史子集傳記與夫九流百家道釋之書皆巳饜飫方且以爲未足而又求所未聞訪所未見常有歉然不滿之意兹泰華所以不得不髙溟渤所以不得不深也歟不譾自㓜服膺雪溪先生之名恨不得摳衣趨隅在弟子列所幸得從仲信仲言遊仲信寓越之蕭寺不譾以敝廬宻邇時一相過未甞不劇談終日有𥙷於茅塞爲多仲言後居甥館于嘉禾每興契闊之歎仲信著京都歳時記廣古今同姓名録留心内典作𥙷定水陸章句洞曉天文作新乾曜真形圗此皆平昔幸得以窺一斑者不寜惟是其發爲稗官小說尤不碌碌仲言著投轄録清林詩話玉照新志揮麈録昆季之所作類皆出人意表且學士大夫之所欲知者益信夫父子之博洽雖名卿鉅公無不欽服敬慕蓋有自來遂初尤丈一時之鴻儒也淹貫古今罕見其比一日詢仲言以天臨殿與南唐中主畫像仲言詳陳本末無一不符遂𥘉驚愕歎仰以爲丗不多得至形諸公送行㤗倅詩擬欲告于上収寘史館不果仲言又嘗剴切上封事不譾因不自揆以拙句殿諸公後有云信史賖青簡封章窒皂囊者以此揮麈所録尤仲言平日之用功深者三復以觀非志不分力不衰加之歉然不滿者朝夕于懷未易得此是不可以無傳也前録先巳刋行後録餘話不譾備數昭武日仲言移書見委顧淺見寡聞亦欲以其素所未知者期天下之共知是以喜而承命因浼龍山張君得以繼之若夫博洽如仲言父子者則勿以見誚可也慶元庚申秋七月旣望昭武假守浚儀趙不譾師厚父, WYG: ''}
