front:
  text: 揮麈第三録卷之一一朝請大夫主管台州崇道觀汝隂王明清佛宇挂鍾之閣多虛其中蓋欲聲之透徹也
  hash: sha256:0399c009f95629e399f81fcaf04e059c4acdf2b06538657655f9b58965a00b20
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0062_SBCK_018-1a}
body:
  text: 孝宗潛躍在幼歲時偶至秀州郡城外真如寺登鍾樓遊戲而僧徒先以蘧蒢覆空處上悮履其上遂并墜焉旁觀之人失色無措亟往視之乃屹然立于席上略無驚怖之狀此與夫國史所載太祖皇帝少年日人馬俱墯于汴都城樓者若合二一契焉陳揆彥緼云明清前年虱底百僚夏日訪尤丈延之語明清云中興以來省中文字亦可引證但建炎己酉之冬髙宗東狩四明登舶涉嶮至次年庚戌三月回次越州數月之間翠華駐幸之所排日不可稽考奈何明清即應之曰自昔以來大臣各有日録以書是日君臣奏對之語當時吕元直為左僕射覺民為參知政事張全真為簽書樞密院皆從上浮于海早晚密衛于舟中者樞密都承旨辛道宗兄弟也逐人必有家乘存焉今吕范二家皆居台州全真鄉里常州若行下數家取索日録參照則瞭然不遺時刻矣延之云甚善便當理會繼而延之病矣不知曾及施行否去秋赴官吳陵舟過茂苑訪一親舊觀其所藏書因得己酉年李方叔正民代言詞掖從行航海所紀頗備眀清所緝後録取王頴彥錢穆記録其間於此亦有相犯者姑悉存之所恨尤先生不及見之耳其目云中書舍人李正民乘桴記曰建炎己酉秋七月車駕在金陵初一日下詔奉隆祐太后六宫外洎六曹百司皆之南昌命簽書樞密院事滕康資政殿學士劉與同知從衛三省樞密院治常程有格法細務及從官郎吏皆分其半從行八月十六日隆祐登舟百司辝於內東門閠八月一日內出御筆以固守建康或左趨鄂嶽右駐吳越集百官議于都堂羣臣皆以鄂嶽道逺恐饋餉難繼又慮車駕一動即江北群盜必乘虛以窺吳越則二浙非我有乃決吳越之行十三日制以吕頥浩為左僕射杜充為右僕射繼又命杜充以江淮宣撫使留平建康府沿江諸將並聽節制二十四日從官以下先行二十六日車駕離建康府九月八日行在平江府十一日以翰林學士張守簽書樞密院周望為兩浙宣撫使留平江府初命周望為江南荆湖宣撫使駐兵鄂州以控上流以頥浩不可離行在乃改命焉十月二日從官以下先發初五日車駕離平江府十三日行在越州入居府廨百司分寓十一月二十日知杭州康允之遣人押到歸朝官某人云自壽陽來報金人數道並入巳自采石濟江以未得杜充周望奏報朝廷大駭集從官議欲移蹕江上親督諸將為迎敵之計宰相侍從同對于便坐或謂且遣兵將或謂冝募敢戰士以行宰相吕頥浩又自請行議未決退詣都堂午間得周望奏狀録到杜充書虜騎至和州巳召王􅊛移師南渡杜充親督師詣采石防守朝廷稍安從官乃請遣兵應援建康又分兵守衢州信州隘路慮胡騎自江黃間南渡或從趨衢信以迫行在也二十一日命傅嵩卿為浙東防遏使令召募土豪以備衢信得江州報胡人破黃州由鄂州渡江向興國軍洪州是日有中使自洪來云隆祐一行巳於十一月初八日起發往虔州矣二十二日從官又請對慮胡騎不測馳突請以郭仲荀輕兵三千從車駕至平江府倚周望韓丗忠兵以為援仲荀方自杭來士卒老幼未至易作去計而令張俊兵以次進發既對上以張俊重兵不可留遂決議皆行退命直學士院汪藻草詔曉諭軍兵以迎敵之説乃以二十三日先發兵三千車駕以二十五日起行既至錢清堰宿頓是夜得杜充奏我師敗績又康允之奏人馬巳自建康府徑路犯杭州界遂倉猝回鑾二十六日次越州城下從官對于河次亭上議趨四明吕頥浩奏欲令從官已下各從便而去上以為不可曰士大夫當知義理豈可不扈從若如此則朕所至乃同冦盜耳於是郎官以下或留越或徑歸者多矣二十七日以御史中丞范宗尹參知政事是日早駕詣都堂撫諭將士移御舟過都泗堰不克二十八日晚出門雨作自是路中連雨泥淖吏卒老幼暴露不勝其苦命兩浙轉運使陳國瑞沿路排頓用炭一千二百斤豬肉六百斤以給衛士云十二月五日車駕至四明居于府廨朝廷召集海舟甚急監察御史林之平自春中遣詣福建召募海船至是相繼而至朝廷甚喜十一日親從班直百餘人因宰執早朝至行宫門外邀宰相問以欲乘海舟何往頥浩喻以利害乃退上命辛永宗勒中軍盡捕諸班直囚之十三日誅其首者十有餘人並降隸諸軍以侍御史趙鼎為御史中丞十四日臺諌請對上喻以不得已之意又探報虜人巳入杭州劉俊引兵出戰不勝康允之走保赭山詔六曹百司官吏並於明越溫台從便居住於是左右司御營使司參議官皆留十五日大雨群臣欲朝至殿門有旨放散惟宰執入對既退車駕遂登舟至定海宰執從行十六日從官以次行吏部侍郎蘇望之以疾辝不至詔給寬假給事中汪藻乞陸行以從十八日聞有使人至命范宗尹趙鼎復回明州以修贄既至乃前所遣報信使臣而已十九日車駕至昌國縣二十四日遣權户部貟外郎李承造往台州刷錢帛二十五日早得越州李鄴奏云虜人巳在西興下寨别令人馬自諸暨趨􅌘縣徑入明州乃議移舟之溫台是日范宗尹趙鼎回至行在二十六日啓行自是連日南風舟行雖穩而日僅行數十里云二十九日歲除庚戌正月一日大風碇海中二日北風稍徑晚泊台州港口三日早至章安鎮駐舟知台州朝公為與李承造皆來上幸祥符寺從官迎拜於道左是日得餘姚把隘官陳彥報人馬至縣迎擊乃退又得韓丗忠奏見在青龍鎮就糧欲俟敵人之歸為擊計初命丗忠駐兵鎮江控扼後聞胡人自采石濟師上命追丗忠赴行在又欲令移軍常州吕頥浩請以御筆召之上曰朕與丗忠約堅守今聞乃來於是遣中使賫詔丗忠聞采石失守已離鎮江府登海舟矣至得奏上優詔答之四日象山縣報人馬至明州張俊為戰守備明州西城外民居盡爇之矣然其意亦欲來赴行在也晚得康允之奏繳到杜充書已在真州與劉位聚兵為邀擊計徐州趙立以師三千來援建康守陳邦光及户部尚書李梲皆降于虜六日張俊奏云二十九日正月初二日凡敵殺傷相當又得二十八日奏及差人賫到二級上命辛企宗以兵一千赴明䇿應又出手詔趣杜充趙立劉位激勵使戰以為後圖皆親書示宰執乃遣之而辛企宗不行七日周望奏常州有緋抹額賊衆犯外城知州事周𣏌守子城以拒賊赤心隊劉晏出戰敗之又言知秀州程俱率官吏棄城保華亭縣又探建康人馬皆焚糧草收金銀稍稍渡江北去自稱李成人馬云八日張思正奏云張俊出兵擊退虜騎思正與劉洪道李質分兵追躡九日張俊已自台州陸趨行在意恐金人小衄濟師而來力不能拒爾前此屢奏求海舟朝廷報以方聚集遣行欲其且留明州既得此奏甚以為憂又慮李鄴已迎降虜人以越為巢穴其經營未巳也十日郭仲荀貴授汝州團練副使廣州安置以擅離越州及妄支散錢帛又夜過行在不乞朝見等罪也十二日滕康遣使臣奏隆祐一行巳到虔州前此得信州探報云十七日到吉州又云二十一日有人馬至吉州東岸知州楊淵棄城走朝廷深慮胡人追躡然本謀南昌之行意謂虜人未必侵犯雖離建康日得密旨令緩急取太后聖旨便冝以行後至平江議者乃云自蘄黃渡江陸行二百餘里可抵南昌朝廷始以為憂遂命劉光丗自淮南移軍于江州以為南昌屏蔽既至而軍中月費十三萬緡知州事權邦彥以用度不足告于朝廷命洪州三省密院應副至十一月中權邦彥乃奏言得東平府故吏卒報其父巳身亡遂解官持服朝廷雖遽命起復而邦彥已離郡去及胡騎渡江光丗乃言初謂蘄黃間賊冦遣兵迎擊既知其為金人遂回軍隆祐以初八日行胡騎以十四日到城下於是知州王子獻以下皆走胡騎入犯撫州執知州事王仲山以其子權知州事令根括境內金銀走洪州送納虜怒其少云撫州四縣不及洪州一縣乃知信州陳杌探報也十三日劉洪道奏金人再犯境上遣兵拒之及陳彥在餘姚屢獲首級及稱李鄴並無關報文字然台州探報越州並放散把隘人兵及管待虜人與之飲燕又命父老僧道赴杭州知其必迎降矣十四日張俊自台州來執胡人一名至行在戮之知邵武軍張毣奏有光澤縣弓手同胡人一騎至軍稱有大軍千餘人繼至巳行斬首於是福建諸州皆震恐知福州林遹奏乞遣兵防守又自言老病不任事乃命集英殿修撰程邁代之十五日胡人再犯餘姚朝廷欲遣張公𥙿以海舟數千載兵直抵錢塘江下燒爇胡人所集舟船衆以公𥙿素不知兵又慮海舟反為胡人所得皆以為不可十六日雨雷發聲十七日劉洪道人以十三日一更水陸並進直至城下洪道與張思正皆引兵出天童山先是李質巳擅趨台州朝廷方降三官今還四明巳無及矣又聞南昌胡騎入潭州而洪撫建昌之間稍稍引去建昌通判朝公邁申先因出城招集民兵以軍事付訓練官承信郎蔡延丗凡八易回延丗拒而不納十八日移舟離章安鎮始張俊既移軍朝廷議分遣其將領率兵應授明州上不欲遣乃止謂他時駐蹕之後資以彈壓蓋行在諸軍此皆精甲全裝稍整齊爾又批令劉洪道等皆退避其鋒然議者皆慮明既失守則海道可虞而行在必不敢安也十九日晚雷雨又作二十日泊青澳門二十一日泊溫州港口二十二日余被旨奉使江湖問安隆祐宫自後不復記録聞行在巳駐溫州矣已上李所記云耳明清又聞是歲越州郡守李鄴既以城降通判曾怘罵賊不屈而死全家𬒳害獨乳婢抱一嬰兒獲免有宣教郎知餘姚縣李頴士者募鄉兵數千列其旗幟以捍拒之賊既不知其地勢又不惻兵之多寡為之小却倣徨不敢進者一晝夜繇是大駕得以自定海登舟航海事平詔特贈怘直祕閣命其弟怤子崈以官頴士遷兩官擢通判州事時又有宋輝者為大漕治事秀州之華亭縣聞龍已涉巨浸即運米十萬石以數大舶轉海訪尋六飛所向至章安鎮而與御舟遇百司正闕續食賴此遂濟多事之際若二人輝與頴士者亦可謂竒績而怘之忠節皆恨丗人未多知之頴士福州人登進士弟紹興中為刑部郎中輝敏求之孫後為袐閣修撰知臨安府怘南豐先生之孫崈即所逃嬰兒也嘗知南安軍鄒志全既以元符抗疏徙新州繼又遭溫益鍾正甫之困辱禍患憂畏瀕於死所建中靖國之初召還自流人不及一年遂代言西掖傷兮之後噤不出一語吳興劉希范時為太學生以書責之陳義甚髙云玨少而學經究觀春秋責備賢者之義私切疑之以謂丗之賢者不易得也求之百餘年間所得不過十數人求之億萬人間所得不過一二人苟有未至猶當掩蔽以全其名奈何反責其備哉及長式觀吏氏眇覿昔人特立獨行以自著見者甚衆然靡不有初鮮克有終其能終始一德以全公忠之節者幾希稱於當年罕全令名著於史氏鮮有完傳豈特賢者之過哉亦當時君子不能相與輔其不及之罪也然則春秋責備之義是乃垂戒萬丗欲全賢者之善此某所以不避僣易輒獻所疑於門下也某自為兒童即聞閣下場屋之名及有知識又誦閣下場屋之文固以閣下為當今辝人然未敢直以古人大節望閣下也暨遊太學在諸生中往往有言前數年有博士鄒公經甚明文甚髙行甚修不能低回當丗以直去位方且歎息願見風采而不可得未幾閣下𬒳遇泰陵進列諌垣極言時政萬里逺謫方是之時某亦東下所過郡縣每見親朋故舊下及田夫里婦必問閣下貌孰似年今幾逢天子之怒誰與解之家纍之重誰與恤之莫不咨嗟稱誦或至泣下前此以言得罪者衆矣閣下之名獨隱然特出不知何以致此豈忠信之誠感於人心者深而然耶則天下所以侍閣下雅亦不為不重矣今天子嗣位首加褒擢授以舊職繼拜司諌乃直起居乃典丈誥歲未再周職已五易越録超等罕見其比則天子所以望閣下雅亦不為不大矣爰自入朝以來天下之士翹首跋踵冀閣下日以忠言摩上不謂若今之為起居舍人者止司記録而已也不謂若今之為中書舍人者止事文筆而已也踰年之間不過言一張寅亮之不可罪爾其他不聞有所發明言某事可行某事不可行某人可用某人不可用有識之士私切疑之始閣下之為博士不顧爵位力言經術取士之美拂衣而歸非知有紹聖之報也其為諌官不避誅責極陳中宫廢立之失逺貶蠻徼非知有今日之報也誠以信其所學行其所志耳然昔以博士而言之今以侍從而不言昔未信於君而言之今信於君而不言此人之所以疑也為閣下解者曰閣下之下言以職非臺諌也疑者曰唐文宗命魏謨以兩省屬皆可論朝廷事故范希文為袐閣校理則言人主不冝北靣為壽為東南安撫則言郭后不冝以小過廢為天章閣待制則言時政所以得失為開封尹則言遷進所以公私後丗之議希文者必稱其愛君忠國不聞罪其侵官也今以職非臺諌而不言是不以希文自處也為閣下解者又曰閣下之不言以當今無大得失也疑者曰唐太宗嘗怪舜作􅃮器禹雕其爼諌者數十不止禇遂良謂諌者救其源不使得開橫流則無復事矣當今庶政之行雖曰盡善亦豈無過舉者乎百官之間雖日多才亦豈無姦佞者乎從官相繼而出豈皆以不稱職乎言官相繼而逐豈皆以其罪乎事之若制器雕爼者尚多也乃以非大政事而不言是不以舜禹事其君也則閣下不免天下之疑必矣方閣下有正言之命人人相賀其君子曰為我寄聲正言公栁冝城堅於守政不以久位為心自謂舌不可禁故能全其名白居易力爭安危不以被斥介意晚益不衰故能全其節公其勿倚勿跛引明主於三代之隆以全令名以利天下其小人曰為我善祝正言公汲直以數切諌不得久留內爰絲以數直諌不得久居中公其慎言母去朝廷今閣下未肯力言時事豈亦哀憐小人不忍違其所請乎豈亦有意君子所謂有待而言乎伏願閣下上思聖主進用之意下思君子跂望之心數陳讜言以輔聖政使堯舜成康之治復於一朝閣下之功豈淺淺哉某性介且僻動與丗忤又惡奔競之風往來京師幾五歲矣其於公卿權貴雖有父兄之舊未嘗一登其門輒造門下以獻所疑非敢求之也蓋以天子仁聖切於治正古人所謂難得之時每欲自為一書以獻又耻與覬覦恩賞者同受疑於丗私念當今天子素所深信莫如閣下者公忠直道而行亦莫如閣下者閣下不言誰為吾君言之故陳所疑以禆萬一狂易之罪誠無所逃然區區之意非獨為閣下計也為朝廷計也非獨為朝廷計為天下計也未識能賜垂聽否志全繇是復進讜論曾文肅薦之祐陵欲令再位言路不契上指文肅云臣近日屢探賾其議論極通疏兼稍成時名願更優容上云何可得它如此上又云宰相執政所引人才如浩前年是宣德郎今作兩制巳多時朕所欲主張人才又却似難蓋崇恩以宿憾言先入矣未幾文肅罷政志全再竄昭州此文肅手記云爾希范名與後登第浸登華要建炎初拜同知三省樞密院竟以徑節聞於四時為中興之名臣子唐稽孫三傑也先正有言太祖舍其子而立弟此天下之大公也周王薨章聖取宗室子育之宫中此天下之大慮也仁宗皇帝感悟其説制詔英祖入繼大統文子文孫冝君冝王遭罹變故不斷如帶今有天下者獨陛下一人而已恭惟陛下克己憂勤備嘗艱難春秋鼎盛自當則百斯男屬者椒寢未繁前星不耀孤立無助有識寒心天其或者深惟陛下追念祖宗公心長慮之所及及乎崇寧以來諛臣進説推濮王子孫以為近屬餘皆謂之同姓致使昌陵之後寂寥無聞奔迸藍縷僅同民庶臣恐祀豐于昵仰違天鑒藝祖在上莫肯顧歆此二聖所以未有回鑾之期黠虜所以未有悔禍之意中原所以未有息肩之時也欲望陛下於子行中遴選太祖諸孫有賢德者視秩親王使牧九州以待皇嗣之生退處藩服更加廣選宣祖太宗之裔材武可稱之人升為南班以備環列庶幾上尉在天之靈下係人心之望臣本書生白首選調垂二十年今將告歸不敢終默位卑言髙罪當萬死惟陛下裁赦此婁陟明上髙宗皇帝書也陟明名寅亮永嘉人早負才名遊上庠有聲南度後始為上虞丞大駕暫駐越上陟明扣閽抗疏以陳是説首發大計之端上讀之大以歎窹冨季申時為樞密從而薦之即令召對改官除監察御史告詞云汝俊造䇿名慷慨自任上書論事憂國甚深深有大用之意未幾會秦師垣入相嫉之托其前任微罪廢棄以終先人與之有太學同舍之舊封事之初實縱臾之手寫副本以見遺云時紹興元年十一月也或云五陟明𬒳譴後還鄉值江漲父子沒於巨浸未知果否蔡持正既孤居陳州鄭毅夫冠多士通判州事從毅夫作賦吳處厚與毅夫同年得汀州司理來謁毅夫間與持正遊明年持正登科寖顯於朝矣處厚辝王荆公薦去從滕元發薛師正辟於中山大忤荆公抑不得進元豐初師正薦於王禹玉甚蒙知遇已而持正登庸處厚乞憐頗甚賀啓云播告大廷延登右弼釋天下霖雨之望尉海內巖石之瞻帝渥俯臨輿情共慶共惟集賢相公道包康濟業茂贊襄秉一德以亮庶工遏群邪以持百度始進陪於國論俄列㑭於政經論道於黃閣之中致身於青霄之上竊以閩川出相今始五人蔡氏登庸古惟二士澤干秦而聘辨汲汲霸圖義輔漢以明經區區暮齒孰若遇休明之運當強仕之年尊主庇民已陟槐廷之貴代天理物遂躋鼎石之崇處厚早辱埏陶竊深欣躍豨苓馬勃敢希乎良醫之求木屑竹頭願充乎大匠之用然持正終無汲引之意是時王蔡並相禹玉薦處厚作大理寺丞會尚書左丞王和甫與御史中丞舒亶有隙元豐初改官制天子勵精政事初嚴六察亶彈擊太吏無復畏避最後糾和甫尚書省不用例事以侵和甫和甫復言亶以中丞兼直學士院在官制既行之後祗合一處請給今亶仍舊用學士院厨錢蠟燭為贓罪亶奏事殿中神宗靣喻亶亶力請付有司推治詔送大理寺亶恃主婘盛隆自以無疵欲因推治益明白且上初無怒亶意姑從其請而已處厚在大理適當推治亶擊和甫而和甫與禹玉合謀傾亶亶事得明必參大政亶若罪去則禹玉必引和甫並位將代持正矣處厚觀望佑禹玉煆錬傅致固稱亶作自盜贓是時大理正王吉甫等二十餘人咸言亶乃夾誤非贓罪明白禹玉和甫從中助下亶于獄坐除名之罪當處厚執議也持正密遣逹意救亶處厚不從故亶雖得罪而御史張汝賢楊畏先後論和甫諷有司陷中司等罪出和甫知江寧府致大臣交惡而持正大怒處厚小官規動朝聽離間大臣欲黜之未果會皇嗣婁夭處厚論程嬰公孫杵臼存趙孤事乞訪其墳墓神宗喜禹玉請擢處厚館職持正言反覆小人不可近禹玉每挽之憚持正輒止終神宗之丗不用哲宗即位禹玉為山陵使辟處厚掌箋表禹玉薨持正代為山陵使首罷處厚山陵畢事處厚言嘗到局乞用衆例遷官不許出知通利軍後以賈種民知漢陽軍種民言母老不習南方水土詔與處厚兩易其任處厚詣政事堂言通利軍人使路已借紫矣改漢陽則奪之一等作郡請仍舊持正笑曰君能作真知州安用假紫邪處厚積怒而去其後持正罷相守陳又移安州有靜江指揮卒當出戍漢陽持正以無兵留不遣處厚移文督之持正寓書荆南帥唐義問固留之義問令無出戍處厚大怒曰汝昔居廟堂固能害我今貶斥同作郡耳尚敢爾耶會漢陽僚吏至安州者持正問處厚近耗吏誦處厚秋興亭近詩云雲共去時天杳杳鴈連來處水茫茫持正笑曰猶亂道如此吏歸以告處厚處厚曰我文章蔡確乃敢譏笑耶未幾安州舉子吳犯御名自漢江販米至漢陽而郡遣縣令陳當至漢口和糴吳袖刺謁當規欲免糴且言近離鄉里時蔡丞相作車蓋亭十詩舟中有本續以寫呈既歸舟以詩送之當方盤量不暇讀姑置懷袖處厚晚置酒秋興亭遣介亟召當當自漢口馳往既解帶處厚問懷中何書當曰適一安州舉人遺蔡丞相近詩也處厚亟請取讀篇篇稱善而已蓋已貯於心矣明曰於公宇冬青堂箋注上之後兩日其子柔嘉登第授太原府司户至侍下處厚迎謂曰我二十年深仇今報之矣柔嘉問知其詳泣曰此非人所為大人平生學業如此今何為此將何以立於丗柔嘉為大人子亦無容迹於天地之間矣處厚悔悟遣數健步剩給緍錢追之馳至進邸云邸吏方往閣門投文書適校俄頃時爾先子久居安陸皆親見之又伯父太中公與持正有連聞處厚事之詳丗謂處厚首興告六訐之風為搢紳復讎禍首幾數十年因備敘之先人手記秦會之暮年作示孫文云曽南豐辟陳無巳邢和叔為英宗皇帝實録檢討官𥘉呈藁無已便蒙許可至邢乃遭橫筆又微聲數稱亂道邢尚氣跽以請曰願善誘南豐笑曰措辭自有律令一不當即是亂道請公讀試為公櫽括邢疾讀至有百餘字南豐曰少止涉筆書數句邢復讀南豐應口以書略不經意既畢授歸就編歸閲數十過終不能有所增損始大服自爾識關健以文章軒輊諸公聞以上秦語其首略云文之始出秦方氣𦦨熏天士大夫爭先快覩而傳之今猶有印行者存焉是時明清考國史及前輩所記即嘗與蘇仁仲訓直父子言之矣案曽南豐元豐五年受詔修五朝史為中丞徐禧所沮寢命繼丁憂而終蓋未嘗濡毫初亦不曽修英宗實録也陳無巳元祐三年始以東坡先生傅欽之李邦直孫同老薦于朝自布衣起為徐州教授距南豐之沒後十年始仕亦未始預編摩也邢和叔元豐間雖為崇文館校書郎不兼史局英宗實録熙寧元年曽宣靖提舉王荆公時巳入翰林請自為之兼實録修撰不置官屬成書三十卷出於一手東坡先生嘗語劉壯輿義仲云此書詞簡而事備文古而意明為國朝諸史之冠不知秦何所據而云義仲道原子也揮麈第三録卷之一
