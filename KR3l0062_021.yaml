body:
  text: 卷之二三十七丁晉公端研三十八王荆公集句詩三十九周美成夢中得瑞鶴仙詞四十周美成風流子詞四一蔡元度燕曾文肅四二耿南仲席上不作詩四三張如塋與聶賁逺王將明同官四四徐典樂製轉調二郎神四五東坡記發冡小話四六艮嶽竒石四七朱勔葬父四八風和尚知人休咎四九蔡攸曲燕禁中五十李邈換武五一詹堅老與李端初交代五二黃謙狡獪五三王履道詠梁師成賜第五四劉跛子知人禍福五五蔡元長令費孝先畫卦影五六蔡元長建第錢塘五七胡宗哲陳舉氷清玉潤五八蘇元老謝表五九李泰發謝表六十潭州天寧寺有平楚樓六一韋絢嘉話虛誕六二向子固維揚夢果應六三康倬詭易姓名六四王佾戲向宗厚六五宋毅叔醫田登母六六王子亨醫吐舌六七李氏醫腸癰六八王定觀服丹砂六九丁廣服丹藥七十秦會之還朝入相七一印行書籍自母丘儉始七二靖康議狀乃馬伸之文七三秦會之詆范覺民七四秦會之以秦熺為乞字七五王歧公復官七六殺帥蜀之職自王曆始七七宗室入蜀自趙德夫始七八廉宣仲再居霅川七九秦會之擢張師言八十向伯恭奏輔陳序八一王俊首嶽侯狀八二南都老盜自陳八三吕元直除馬子約英州八四吳幵莫儔竄逐八五國朝六曹尚書寄祿八六王兵部跋李伯時古器圗語八七劉士祥姦利八八張彥實居西掖八九王仲言作慈寧殿賦九十相蔡元長題超覽堂字九一林開相蔡元度子九二九江舟中盜鑄錢九三賞心亭長短句九四張韓奏凱九五秦會之題跋鄭德象九六甄保義賈機冝九七唐崔相國德政碑九八顔魯公墨帖九九團石讖語一百趙知府跋揮麈録餘話總目終
