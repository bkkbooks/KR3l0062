  - {type: variant, offset: 95, length: 5, content: 十二張思廉, WYG: 之意素已著明太母愛孫之慈初無間隙哲宗至再三稱善元符之末太上皇帝踐祚欽聖獻肅垂簾之初先臣又嘗陳三省言元祐廢立之事欽聖云寃他孃孃豈有此意又云無此事又云當時不聞誰敢説及此事葢欽聖受遺神宗同定大䇿禁中議論無不與聞歎息驚嗟形於聖語誣罔之狀明白可知逮崇寜之後蔡京用事首逐先臣極力傾擠寘之死地一時忠良相繼貶竄方遂其指鹿為馬之計豈復以投鼠忌器為嫌顚倒是非甘心快意至與蔡懋等撰造宫禁語}
