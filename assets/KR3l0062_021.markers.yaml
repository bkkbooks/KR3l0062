  - {type: variant, offset: 116, length: 0, content: '', WYG: 十萬自随由淮西來與王權相遇而王權之衆不能當在和州對壘權盡遣渡􅊑過南岸與其衆誓云國家養汝軰許時正要今日以死上報衆皆唯唯兩軍堅壁不動權以二三腹心自随手執諸軍旗號戒諭諸將云不可妄動且看敵軍有陣脚不固不肅者看吾舉逐軍旗號先舉動敵軍數重之内有紫傘往來傳呼者莫知其意敵軍先來犯陣遇大雨遂退復駐軍於舊寨無一不肅諸將遂語權云敵軍如此我軰如何可戰權云諸公不可說此語今日正當報國之時宜盡死於此不可有一人異議諸將云太尉欲與諸軍死此却將甚軍馬與國家保守江靣權悟其言遂言當從諸人議往南岸呌􅊑渡軍馬還與國家保江却自往朝廷請罪又與諸將計算軍馬渡江有殿後者必為敵騎所追合損折一軍半人馬又要一將殿後統制官時俊云願為殿後保全軍馬過江衆服其勇王琪是時為䕶聖馬軍統制亦同行云所部軍馬乃主上親随太尉不可失却他一人一騎遂令䕶聖馬軍先渡諸軍次第而濟敵騎果下馬來追襲時俊牌手當之幸所失不致如算之數諸軍遂就采石各上戰艦以備敵人權為樞宻行府押詣朝廷竄於海外金亮築臺江岸刑白馬祭天自執紅旗麾諸軍渡江行至中流為采石戰艦迎敵時俊在舟中令軍士以寸札弩射敵人赴水者多盡皆退走亮知江岸有備遂全軍過揚州軍士奏凱未及登岸虞丞相允文以參賛軍事偶至采石遂與王琪報㨗於朝虞自中書舍人除兵部尚書自此遂東眷知琪除正任觀察使諸將在江中獲㨗者亦皆次第而遷水軍統制盛新功多而獲賞最輕抑鬱而死建康采石軍士至今憐之次年春初明清從外舅起帥合肥道出采石親見將士言之直書其語不復潤色以文云隆興初有胡昉者大言夸誕當國者以為天下竒才力加薦引命之以官曾未數年為兩浙漕一日語坐客云朝廷官爵是買吾曹之頭顱豈不可畏適聞人伯卿阜民在坐末趍前云也買脱空胡黙然前錄載湯進之封慶國公也明清嘗陳之章聖之初封湯始疑以為未然於史館檢閲然後封章其所上劄子迺云自天聖以來未有敢以為封者然又不知宣和中王黼白蒙亨皆嘗受而失於辭避是不曾詳於稽考也明清晩識遂初尤延之先生一見傾葢若平生懽借舉引重恩􅁩非輕公任文昌一日忽問云天臨殿在於何時邪明清云自昔以來葢未有之紹聖初米元章為令畿邑之雍丘遊治下古寺寺僧指方丈云頃章聖幸亳社千乘萬騎經從嘗愒宿於中元章即命彩飾建鴟嚴其羽衛自書榜之曰天臨殿時吕升卿為提㸃開封府縣鎮公事以謂下邑不白朝廷擅創殿立名將按治之}
